<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <nav class="site-nav">
                {% for item in site.navigation %}
                <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}class="active"{% endif %}>
                    {{ item.title }}
                </a>
                {% endfor %}
            </nav>
        </div>
    </header>

    <main class="site-content">
        <div class="container">
            {{ content }}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="social-links">
                {% if site.social.github %}
                <a href="https://github.com/{{ site.social.github }}" target="_blank">GitHub</a>
                {% endif %}
                {% if site.social.bilibili %}
                <a href="https://space.bilibili.com/{{ site.social.bilibili }}" target="_blank">Bilibili</a>
                {% endif %}
                {% if site.social.email %}
                <a href="mailto:{{ site.social.email }}">Email</a>
                {% endif %}
            </div>
            <p class="copyright">&copy; {{ site.time | date: '%Y' }} {{ site.title }}</p>
        </div>
    </footer>
</body>
</html>

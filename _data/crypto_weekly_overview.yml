    Adds ADA/BNB and ADA/USDT Trading Pairshttps://t.co/GmTUh2TsN1 pic.twitter.com/HDy7JxezGV—
    Binance (@binance) April 17, 2018\n\nTraders also seem to be bullish on the fundamental
    front as many believe that it can become a major competitor to Ethereum.\nSo,
    what does the future look like?\nWeekly chart\n\nThe ADA/BTC pair has a short
    but volatile history. From the lows of 0.00000254 on November 02 of last year,
    it skyrocketed to an intraday high of 0.00009180 on January 04 of this year. That’s
    a staggering return of 3514 percent within a span of about two months.\nThereafter,
    from there, it entered into a downtrend, which saw it plunge 81 percent from the
    highs to 0.00001673 on March 18.\nWhat can the investors expect from here on?\nFor
    the past five weeks, the digital currency is in a pullback, which has reached
    close to 23.6 percent retracement of the fall from 0.00009180 to 0.00001673.\nAfter
    such a sharp decline, a ‘V’ shaped recovery is unlikely because traders who had
    purchased at higher levels and were watching their portfolio sink to a huge loss
    would bail out once their buy levels are reached.\nSimilarly, short-term traders,
    who have purchased near the lows will also book profits on rallies.\nThe important

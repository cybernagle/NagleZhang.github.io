  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS9zdG9yYWdlL3VwbG9hZHMvdmlldy9kYTJjNmY2M2NmOThhNDZjZWU5MzI4YjIzZjI0MzBiNy5qcGc=.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS9zdG9yYWdlL3VwbG9hZHMvdmlldy9kYTJjNmY2M2NmOThhNDZjZWU5MzI4YjIzZjI0MzBiNy5qcGc=.jpg\"
    alt=\"Weekly Price Overview: NEO, April 26\"></p><p dir=\"ltr\"><span style=\"font-size:11px;\"><em>The
    views and opinions expressed here are solely those of the author and do not necessarily
    reflect the views of Cointelegraph.com. Every investment and trading move involves
    risk, you should conduct your own research when making a decision.</em></span><p
    dir=\"ltr\"><span style=\"font-size:11px;\"><em>The market data is provided by
    the <a href=\"https://hitbtc.com/\" rel=\"nofollow,noopener\" target=\"_blank\">HitBTC</a>
    exchange.</em></span></p><p dir=\"ltr\"><a href=\"https://cointelegraph.com/tags/neo\">NEO</a>
    has been an underperformer in the ongoing recovery from the lows. It has dropped
    to the <a href=\"https://coinmarketcap.com\" rel=\"nofollow,noopener\" target=\"_blank\">tenth</a>
    spot in terms of market capitalization.</p><p dir=\"ltr\">Many believe that NEO&rsquo;s
    potential will be fully realized only in about 3-5 years from now, so it seems
    to be a good idea to &lsquo;hodl&rsquo; the cryptocurrency through the dips.</p><p
    dir=\"ltr\">Let&rsquo;s look at the charts and try to analyze its long-term and
    short-term potential.</p><h2 dir=\"ltr\">Weekly chart</h2><p dir=\"ltr\"><img
    width=\"1236\" height=\"558\" alt=\"NEO/USD\" src=\"https://cointelegraph.com/storage/uploads/view/c4ed038ab77e7719ac632d0140617f3f.png\"
    title=\"NEO/USD\"></p><p dir=\"ltr\">Post listing, NEO exchanged hands below $1
    for a long time. Then, at the end of May 2017, the price started to rise and hit
    a high of about $58 levels in August of last year. &nbsp;&nbsp;</p><p dir=\"ltr\">After
    such a sharp rally, it was logical to expect some profit booking, and that is
    what happened. Prices corrected to the 20-week EMA but managed to stay above it
    until early December.</p><p dir=\"ltr\">The cryptocurrency again broke out of
    the range in mid-December, and the up move topped out around the $200 mark in
    mid-January 2018. The ensuing correction reached a low of just about $44 levels
    in early April of this year.</p><p dir=\"ltr\">If history is an example, the digital
    currency rallies hard, follows it up with a deep correction and after a period
    of consolidation the up move resumes.</p><p dir=\"ltr\">In the current bear phase,
    NEO has completed a sharp correction, we can now expect it to consolidate for
    a few weeks and then resume its uptrend once again. Currently, the 50-week SMA
    is providing support, while the 20-week EMA is acting as a resistance.</p><p dir=\"ltr\">Let&rsquo;s
    identify the important levels on the daily chart.</p><h2 dir=\"ltr\">Daily chart</h2><p
    dir=\"ltr\"><img width=\"1236\" height=\"558\" alt=\"NEO/USD\" src=\"https://cointelegraph.com/storage/uploads/view/45ed58a4d196bc3babcd3bba5d9a830b.png\"
    title=\"NEO/USD\"></p><p dir=\"ltr\">The <a href=\"https://www.tradingview.com/symbols/NEOUSD/\"
    rel=\"nofollow,noopener\" target=\"_blank\">NEO/USD pair</a> recovered smartly
    from the lows but is facing a stiff resistance at the downtrend line and the horizontal
    line around the $80 mark. Though the bulls succeeded in breaking out of $80 on
    April 24, they could not sustain the highs, and the price dipped back below the
    trendline on the very next day.</p><p dir=\"ltr\">Currently, we find a rounding
    bottom pattern, which will complete on a breakout and close above $80 levels.
    This has a pattern target of $115. Another possibility is that, above $80, there
    is a minor resistance zone between $92.5-$95.5. Once this is crossed, the cryptocurrency
    could skyrocket to $140 levels.</p><p dir=\"ltr\">On the other hand, if the price
    breaks down below both moving averages and $64, it will become weak and slide
    back towards the early April lows.</p><p dir=\"ltr\">Can we make use of the information
    above?</p><h2 dir=\"ltr\">How to trade the NEO/USD pair now</h2><p dir=\"ltr\">Long-term
    investors can expect a few weeks of consolidation, but history suggests that the
    next trending move should be to the upside. Therefore, they can wait and buy NEO
    on dips and keep a stop loss of $40.</p><p dir=\"ltr\">Short-term traders can
    wait for a breakout above $85 to establish long positions with stops around $65
    levels.</p><p dir=\"ltr\">Traders who follow us and are long at <a href=\"https://cointelegraph.com/news/bitcoin-ethereum-bitcoin-cash-ripple-stellar-litecoin-cardano-neo-eos-price-analysis-april-13\">$64
    levels</a> should maintain their stops on the <a href=\"https://cointelegraph.com/news/bitcoin-ethereum-bitcoin-cash-ripple-stellar-litecoin-cardano-neo-eos-price-analysis-april-21\">remaining</a>
    position at breakeven. Currently, the cryptocurrency is finding support at the
    moving average. A bounce and a break above $85 should reward the traders immensely.
    Hence, hold the position with the designated stops.</p><p><span style=\"font-size:11px;\"><em>The
    market data is provided by the <a href=\"https://hitbtc.com/\" rel=\"nofollow,noopener\"
    target=\"_blank\">HitBTC</a> exchange. The charts for the analysis are provided

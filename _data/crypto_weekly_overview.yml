    rel=\"nofollow,noopener\" target=\"_blank\">end-June</a>.</p>\n\n<p dir=\"ltr\">So,
    can it move further or has it run its course? Let&rsquo;s see its charts.</p>\n\n<h2
    dir=\"ltr\">Weekly Chart</h2>\n\n<p dir=\"ltr\"><img width=\"1236\" height=\"558\"
    alt=\"Weekly Chart\" src=\"https://cointelegraph.com/storage/uploads/view/d09d1fe37f77c5f4c20ed194a60b2179.png\"
    title=\"Weekly Chart\"></p>\n\n<p dir=\"ltr\">VEN remained in a tight range from
    mid-November to mid-December of last year. It started an uptrend in end-December,
    which took it from the lows of 0.00002184 on November 30 to an intraday high of
    0.00081678 on January 22 of this year. That&rsquo;s a 3639 percent return within
    two months.</p>\n\n<p dir=\"ltr\">The subsequent correction took support close
    to the 61.8 percent Fibonacci retracement levels of 0.00032752. The digital currency
    bottomed out on March 30, at 0.00031748.</p>\n\n<p dir=\"ltr\">After a strong
    break out from the downtrend line, VeChain can reach 0.00062102 levels where it
    might face some resistance. Once this level is crossed, a retest of the highs
    will be on the cards.</p>\n\n<h2 dir=\"ltr\">Daily Chart</h2>\n\n<p dir=\"ltr\"><img
    width=\"1236\" height=\"558\" alt=\"Daily Chart\" src=\"https://cointelegraph.com/storage/uploads/view/13035f4294bba28865d3c286b19ae2da.png\"
    title=\"Daily Chart\"></p>\n\n<p dir=\"ltr\">On the daily chart, the VEN/BTC pair
    has broken out of an inverted head and shoulders (H&amp;S) pattern, which has
    a minimum target objective of 0.00063 levels. This is close to the overhead resistance
    at 0.00062102, therefore, we can expect a dip or a consolidation at this level.</p>\n\n<p
    dir=\"ltr\">On the downside, support exists at the 0.00047 levels, below which
    the neckline of the inverse H&amp;S pattern will provide support.</p>\n\n<h2 dir=\"ltr\">How
    to trade the VENBTC pair now?</h2>\n\n<p dir=\"ltr\">Traders who already own the
    cryptocurrency should hold their positions because a move to 0.00062 is possible.
    There is a high probability of a dip from the overhead resistance or a consolidation.
    Therefore, traders can book a small percentage of their position and attempt to
    buy it at lower levels. Long-term holders can trail their stops higher instead
    of getting in and out of the position because above 0.00062102, we can expect
    a straight dash towards the lifetime highs.</p>\n\n<p dir=\"ltr\">Others, who
    haven&rsquo;t purchased the virtual currency should wait for a dip towards the
    20-day EMA to buy and keep a stop loss at 0.0004, just below the 50-day SMA. Failure
    of a bullish pattern is a negative sign; below 0.0004, a retest of the 0.00032
    levels is likely.</p>\n\n<p dir=\"ltr\">If we don&rsquo;t get a dip to the 20-day
    EMA, traders can wait for the consolidation or correction at the overhead resistance
    and then buy the breakout. A break out confirms the resumption of the uptrend
    and a rally to the lifetime highs is likely. Once the bulls succeed in breaking
    out the lifetime highs, the digital currency can extend the uptrend to 0.00111242
    levels. However, as most cryptocurrencies tend to give up their gains quickly,
    traders should trail their stops higher to lock in the paper profits.</p>\n\n<p><span

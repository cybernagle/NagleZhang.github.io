    to take the project further. Nevertheless, IOTA’s price has not slumped, which
    shows that the investors have not given up on the team completely.\r\n\r\nNow,
    let’s look at the technical picture of the IOTA/USD pair.\r\n\r\nWeekly chart\r\n\r\n\r\n\r\nIOTA
    remained range bound from mid-June to mid-November of last year. From early November

- title: " Hong Kong Extends Migrant Policy to Facilitate DLT and FinTech Professionals "
  url: https://cointelegraph.com/news/hong-kong-extends-migrant-policy-to-facilitate-dlt-and-fintech-professionals?utm_source=rss_feed&utm_medium=rss_category_weekly-overview&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS9zdG9yYWdlL3VwbG9hZHMvdmlldy9kNDA0N2NlN2M0YjA1ODMwYmNlOGIyZjBmZWZhY2NmZC5qcGc=.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS9zdG9yYWdlL3VwbG9hZHMvdmlldy9kNDA0N2NlN2M0YjA1ODMwYmNlOGIyZjBmZWZhY2NmZC5qcGc=.jpg\"
    alt=\"Hong Kong Extends Migrant Policy to Facilitate DLT and FinTech Professionals\"></p><p
    dir=\"ltr\">A new <a data-amp=\"https://cointelegraph-com.cdn.ampproject.org/c/s/cointelegraph.com/tags/hong-kong/amp\"
    href=\"https://cointelegraph.com/tags/hong-kong\">Hong Kong</a> government initiative
    seeks to attract professionals in Distributed Ledger Technology (DLT) by simplifying
    the immigration policy, according to a press release <a href=\"http://www.info.gov.hk/gia/general/201808/28/P2018082800360.htm\"
    rel=\"nofollow,noopener\" target=\"_blank\">published</a> August 28.<p>On Thursday,
    the <a data-amp=\"https://cointelegraph-com.cdn.ampproject.org/c/s/cointelegraph.com/tags/government/amp\"
    href=\"https://cointelegraph.com/tags/government\">government</a> of Hong Kong
    published its first <a href=\"https://www.talentlist.gov.hk/en/index.html\" rel=\"nofollow,noopener\"
    target=\"_blank\">Talent List</a> aimed at attracting &ldquo;highly skilled&rdquo;
    experts in 11 different fields, including <a data-amp=\"https://cointelegraph-com.cdn.ampproject.org/c/s/cointelegraph.com/tags/fintech/amp\"
    href=\"https://cointelegraph.com/tags/fintech\">fintech</a>, DLT, and cyber security,
    from around the world. The move designates the government&rsquo;s intention to
    &ldquo;support Hong Kong's development as a high value-added and diversified economy.&rdquo;</p><p>According
    to the press release, Hong Kong will facilitate successful applicants under the
    Talent List through the Quality Migrant Admission Scheme (QMAS). The QMAS has
    an annual quota of 1,000 people. The Chief Secretary for Administration and Chairman
    of the Human Resources Planning Commission, Matthew Cheung Kin-chung, said:</p><blockquote><p>&ldquo;The
    promulgation of the Talent List is one of our major initiatives to enhance our
    competitive advantages in attracting international talents, creating cluster effects,
    stimulating the development of local talents and propelling Hong Kong forward.\"</p></blockquote><p>While
    Hong Kong <a data-amp=\"https://cointelegraph-com.cdn.ampproject.org/c/s/cointelegraph.com/news/hong-kong-continues-taking-regulatory-action-hopes-to-become-international-blockchain-hub/amp\"
    href=\"https://cointelegraph.com/news/hong-kong-continues-taking-regulatory-action-hopes-to-become-international-blockchain-hub\">continues</a>
    taking regulatory actions towards digital currencies and <a data-amp=\"https://cointelegraph-com.cdn.ampproject.org/c/s/cointelegraph.com/tags/ico/amp\"
    href=\"https://cointelegraph.com/tags/ico\">Initial Coin Offerings</a> (ICOs),
    <a data-amp=\"https://cointelegraph-com.cdn.ampproject.org/c/s/cointelegraph.com/news/hong-kong-securities-regulator-promises-to-keep-close-watch-on-crypto-sector/amp\"
    href=\"https://cointelegraph.com/news/hong-kong-securities-regulator-promises-to-keep-close-watch-on-crypto-sector\">stating</a>
    that the new technology &ldquo;comes with risks,&rdquo; it seems to have set sights
    on becoming an international <a data-amp=\"https://cointelegraph-com.cdn.ampproject.org/c/s/cointelegraph.com/tags/blockchain/amp\"
    href=\"https://cointelegraph.com/tags/blockchain\">blockchain</a> hub.</p><p>Last
    month, the Hong Kong Monetary Authority (HKMA) <a data-amp=\"https://cointelegraph-com.cdn.ampproject.org/c/s/cointelegraph.com/news/hong-kong-monetary-authority-to-launch-multi-bank-blockchain-trade-finance-platform/amp\"
    href=\"https://cointelegraph.com/news/hong-kong-monetary-authority-to-launch-multi-bank-blockchain-trade-finance-platform\">announced</a>
    the launch its own blockchain trade finance solution with 21 banks in August,
    aiming to substantially reduce paperwork, costs, and security risks for participants.</p><p>In
    June, the HKMA <a href=\"https://www.hkma.gov.hk/eng/key-information/press-releases/2018/20180626-4.shtml\"
    rel=\"nofollow,noopener\" target=\"_blank\">signed</a> a fintech collaboration
    agreement with the Financial Services Regulatory Authority of the Abu Dhabi Global
    Market &ldquo;to start a dialogue on the opportunity to build a cross-border trade
    finance network using [DLT].&rdquo; That month, Alibaba subsidiary Ant Financial
    <a data-amp=\"https://cointelegraph-com.cdn.ampproject.org/c/s/cointelegraph.com/news/alibaba-offshoot-trials-first-blockchain-remittance-to-philippines-plans-global-expansion/amp\"
    href=\"https://cointelegraph.com/news/alibaba-offshoot-trials-first-blockchain-remittance-to-philippines-plans-global-expansion\">trialled</a>
    its first blockchain remittances, sending a transaction in three seconds between
    its AliPayHK app in Hong Kong and Filipino payment app GCash.</p><p>The Hong Kong
    University of Science and Technology Business School (HKUST) recently <a data-amp=\"https://cointelegraph-com.cdn.ampproject.org/c/s/cointelegraph.com/news/hong-kong-university-receives-20-mln-research-grant-for-payment-systems-blockchain/amp\"
    href=\"https://cointelegraph.com/news/hong-kong-university-receives-20-mln-research-grant-for-payment-systems-blockchain\">received</a>
    a $20 million research grant to improve the security capabilities of electronic
    payment systems earlier this month.</p><p>Additionally, the HKUST in partnership
    with the University of Hong Kong are planning to explore blockchain technology
    applications, and discuss the possibility of Hong Kong&rsquo;s transformation
    into a global fintech hub.</p></p>\n</p>\n            "

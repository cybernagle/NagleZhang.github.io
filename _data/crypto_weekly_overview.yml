    target=\"_blank\">HitBTC</a><span style=\"color:#696969;\"> exchange.</span></span></em></strong></p>\n\n<p><a
    href=\"https://cointelegraph.com/tags/iota\" target=\"_blank\">IOTA</a> is the
    <a href=\"https://coinmarketcap.com\" rel=\"nofollow,noopener\" target=\"_blank\">tenth</a>
    largest cryptocurrency in terms of market capitalization. While a few coins in
    the top 10 are attempting to recover from their recent lows, IOTA continues to
    struggle.</p>\n\n<p dir=\"ltr\">The <a href=\"https://spectrum.ieee.org/tech-talk/computing/networks/cryptographers-urge-users-and-researchers-to-abandon-iota-after-leaked-emails\"
    rel=\"nofollow,noopener\" target=\"_blank\">ugly spat</a> between the IOTA team
    and a group of external security researchers is not helping matters either. Some
    believe that the IOTA founder and his team handled the whole episode immaturely,
    raising questions on the capability of the team to take the project further. Nevertheless,
    IOTA&rsquo;s price has not slumped, which shows that the investors have not given
    up on the team completely.</p>\n\n<p dir=\"ltr\">Now, let&rsquo;s look at the
    technical picture of the <a href=\"https://www.tradingview.com/symbols/IOTUSD/\"
    rel=\"nofollow,noopener\" target=\"_blank\">IOTA/USD</a> pair.</p>\n\n<h2 dir=\"ltr\">Weekly
    chart</h2>\n\n<p dir=\"ltr\"><img width=\"1600\" height=\"809\" alt=\"IOTA\" src=\"//cointelegraph.com/storage/uploads/view/3df65d24cfd0b6959455b949b5760dde.png\"
    title=\"IOTA\"></p>\n\n<p dir=\"ltr\">IOTA remained range bound from mid-June
    to mid-November of last year. From early November to early December, the cryptocurrency
    rallied from a low of $0.33870 to a high of $5.59, which is a 1550 percent return
    within five weeks.</p>\n\n<p dir=\"ltr\">After that, the cryptocurrency remained
    volatile but range-bound near the highs for five weeks. It broke below the range
    and slumped to a low of $1.2 in early February. Since then, this is the fourth
    week of consolidation near the lows.</p>\n\n<p dir=\"ltr\">The previous consolidation
    had lasted only for five weeks. So, with the other coins attempting a pullback,
    can we expect an up move in the IOTA/USD pair?</p>\n\n<p dir=\"ltr\">Let&rsquo;s
    look at the daily charts to identify the levels that will confirm that the consolidation
    has ended.</p>\n\n<h2 dir=\"ltr\">Daily chart</h2>\n\n<p dir=\"ltr\"><img width=\"1600\"
    height=\"809\" alt=\"IOTA\" src=\"//cointelegraph.com/storage/uploads/view/a4442acb126acd66ec084841dda9ae36.png\"
    title=\"IOTA\"></p>\n\n<p dir=\"ltr\">The cryptocurrency is attempting to hold
    the 78.6 percent retracement of the entire rally from $0.33870 to $5.8. It has
    largely remained range-bound between $1.5 to $2.2117 since Feb. 02 of this year.</p>\n\n<p
    dir=\"ltr\">Additionally, we find a symmetrical triangle formation at the lows
    with price attempting to break out of it.</p>\n\n<p dir=\"ltr\">The moving averages
    are turning down, but IOTA has risen above the 20-day EMA. The 50-day SMA is close
    to the upper end of the range at $2.2418.</p>\n\n<p dir=\"ltr\">If the price breaks
    out and closes (UTC) above the range, it has a pattern target of $2.9234. Visibly
    too, the major resistance is at $3 with only minor resistance at $2.62.</p>\n\n<p
    dir=\"ltr\">On the other hand, if IOTA breaks down and closes below the range,
    it has a pattern target of $0.7883. At the same time, the support zone between
    $1.1 to $1.2 is likely to attract buying.</p>\n\n<h2 dir=\"ltr\">So, what should
    traders do?</h2>\n\n<p dir=\"ltr\">We don&rsquo;t find any trade setups inside
    the range. However, once the price breaks out and closes above $2.23, long positions
    can be initiated with a suitable stop loss. If the bulls succeed in breaking out
    of $3, a rally to $4 is possible. Traders should avoid bottom fishing if the virtual
    currency breaks down of the range.</p>\n\n<p><span style=\"font-size:11px;\"><em><span

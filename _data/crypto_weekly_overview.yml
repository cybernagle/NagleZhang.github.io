- title: " Weekly Price Overview: Cardano, April 24 "
  url: https://cointelegraph.com/news/weekly-price-overview-cardano-april-24?utm_source=rss_feed&utm_medium=rss_category_weekly-overview&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS9zdG9yYWdlL3VwbG9hZHMvdmlldy83MzExYzliNDc2MjRmZmZkMDViZDBjM2Q4ZjI0NDNmMy5qcGc=.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS9zdG9yYWdlL3VwbG9hZHMvdmlldy83MzExYzliNDc2MjRmZmZkMDViZDBjM2Q4ZjI0NDNmMy5qcGc=.jpg\"
    alt=\"Weekly Price Overview: Cardano, April 24\"></p><body>\n<p dir=\"ltr\"><em><span
    style=\"font-size:11px;\">The views and opinions expressed here are solely those
    of the author and do not necessarily reflect the views of Cointelegraph.com. Every
    investment and trading move involves risk, you should conduct your own research
    when making a decision.</span></em></p>\n<p dir=\"ltr\"><em><span style=\"font-size:11px;\">The
    market data is provided by the <a href=\"https://hitbtc.com/\" rel=\"noopener
    nofollow\" target=\"_blank\">HitBTC</a> exchange.</span></em></p>\n<p dir=\"ltr\">Cardano
    is the <a href=\"https://coinmarketcap.com\" rel=\"noopener nofollow\" target=\"_blank\">seventh</a>
    largest cryptocurrency in terms of market capitalization. It has made a stellar
    comeback in the past few days on the back of its listing on the Huobi exchange
    and <a href=\"https://twitter.com/binance/status/986090994486591488?ref_src=twsrc%5Etfw\"
    rel=\"noopener nofollow\" target=\"_blank\">introduction</a> of additional trading
    pairs on Binance exchange.</p>\n<blockquote class=\"twitter-tweet\" data-lang=\"en\">\n<p
    dir=\"ltr\" lang=\"en\"><a href=\"https://twitter.com/hashtag/Binance?src=hash&amp;ref_src=twsrc%5Etfw\"
    rel=\"noopener nofollow\" target=\"_blank\">#Binance</a> Adds ADA/BNB and ADA/USDT
    Trading Pairs<a href=\"https://t.co/GmTUh2TsN1\" rel=\"noopener nofollow\" target=\"_blank\">https://t.co/GmTUh2TsN1</a>
    <a href=\"https://t.co/HDy7JxezGV\" rel=\"noopener nofollow\" target=\"_blank\">pic.twitter.com/HDy7JxezGV</a></p>&mdash;
    Binance (@binance) <a href=\"https://twitter.com/binance/status/986090994486591488?ref_src=twsrc%5Etfw\"
    rel=\"noopener nofollow\" target=\"_blank\">April 17, 2018</a>\n</blockquote>\n<script
    async src=\"https://platform.twitter.com/widgets.js\" charset=\"utf-8\"></script><p>Traders
    also seem to be bullish on the fundamental front as many believe that it can become
    a major competitor to <a href=\"https://globalcoinreport.com/cardano-ada-making-inroads-to-china/\"
    rel=\"noopener nofollow\" target=\"_blank\">Ethereum</a>.</p>\n<p dir=\"ltr\">So,
    what does the future look like?</p>\n<h2 dir=\"ltr\">Weekly chart</h2>\n<p dir=\"ltr\"><img
    width=\"1230\" height=\"579\" alt=\"ADA/BTC\" src=\"https://cointelegraph.com/storage/uploads/view/df96b26c353d9a7a4fc2f8a6f4cd9119.png\"
    title=\"ADA/BTC\"></p>\n<p dir=\"ltr\">The <a href=\"https://www.tradingview.com/symbols/ADABTC/\"
    rel=\"dofollow\" target=\"_blank\">ADA/BTC</a> pair has a short but volatile history.
    From the lows of 0.00000254 on November 02 of last year, it skyrocketed to an
    intraday high of 0.00009180 on January 04 of this year. That&rsquo;s a staggering
    return of 3514 percent within a span of about two months.</p>\n<p dir=\"ltr\">Thereafter,
    from there, it entered into a downtrend, which saw it plunge 81 percent from the
    highs to 0.00001673 on March 18.</p>\n<p dir=\"ltr\">What can the investors expect
    from here on?</p>\n<p dir=\"ltr\">For the past five weeks, the digital currency
    is in a pullback, which has reached close to 23.6 percent retracement of the fall
    from 0.00009180 to 0.00001673.</p>\n<p dir=\"ltr\">After such a sharp decline,
    a &lsquo;V&rsquo; shaped recovery is unlikely because traders who had purchased
    at higher levels and were watching their portfolio sink to a huge loss would bail
    out once their buy levels are reached.</p>\n<p dir=\"ltr\">Similarly, short-term
    traders, who have purchased near the lows will also book profits on rallies.</p>\n<p
    dir=\"ltr\">The important levels to watch out on the upside are 38.2 percent Fibonacci
    retracement level of 0.00004541 and the 50 percent retracement levels of 0.00005427.</p>\n<p
    dir=\"ltr\">The start of a new uptrend can be confirmed only after the next decline
    towards the recent lows. A range bound action for a few weeks is also possible,
    which will be a positive sign. Longer the time spent in forming a base, larger
    will be the ensuing rally.</p>\n<p dir=\"ltr\">Let&rsquo;s see how to use the
    levels above for trading. &nbsp;</p>\n<h2 dir=\"ltr\">Daily chart</h2>\n<p dir=\"ltr\"><img
    width=\"1230\" height=\"579\" alt=\"ADA/BTC\" src=\"https://cointelegraph.com/storage/uploads/view/3e83a3c68eab077a4fec7672a06921b7.png\"
    title=\"ADA/BTC\"></p>\n<p dir=\"ltr\">The daily chart shows how the current pullback
    has stalled right at the 23.6 percent retracement levels. For the past seven days,
    Cardano has been consolidating near the overhead resistance without giving up
    much ground. This is a positive sign. We also like the bullish crossover of the
    moving averages.</p>\n<p dir=\"ltr\">We should see another attempt by the bulls
    to break out of the overhead resistance within the next few days. If they succeed,
    a rally to 0.00004541 will be on the cards.</p>\n<p dir=\"ltr\">If the break out
    fails, then most of the traders who have purchased at lower levels will book out
    of their positions resulting in a dip.</p>\n<p dir=\"ltr\">The 20-day EMA will
    be the first support. If this breaks, a decline to the 50-day SMA is also possible.</p>\n<p
    dir=\"ltr\">So, how should one trade it?</p>\n<h2 dir=\"ltr\">How to trade the
    ADA/BTC pair now?</h2>\n<p dir=\"ltr\">Long-term traders should accumulate positions
    on dips towards the 50-day SMA and keep a stop loss at 0.00001600. If prices sustain
    below the March 18 lows of 0.00001673, the targets on the downside are 0.00000965
    and 0.00000560. The target of this trade is 0.000054 and higher.</p>\n<p dir=\"ltr\">Short-term
    traders, who have purchased at lower levels can hold their positions with a stop
    loss at 0.00003 levels.</p>\n<p dir=\"ltr\">Fresh positions by short-term traders
    should be only considered on a breakout and close (UTC) above 0.000035 levels
    with a close stop loss. Their first target is 0.000045.</p>\n<p><span style=\"font-size:11px;\"><em>The

  url: https://mixergy.com/interviews/coo-with-cameron-herold/
  summary: "A topic we don’t talk about on Mixergy is how to actually manage a company.
    I remember when I was in NYU as an undergrad I loved all my business classes,
    but management just didn’t feel like me. \nI always thought of the guys in Dilbert
    but entrepreneurs were the ones who were creating, the ones who were doing. Mixergy’s
    grown and I’ve been running it, but I have to be honest, I’m not doing a great
    job of running it. \nSo earlier in the year, the Mixergy team said, “Andrew, go
    get a COO.” They kept challenging me. One of things that they told me to do was
    to talk to Cameron Herold.\nCameron Herold was Chief Operating Officer at 1-800-GOT-JUNK?

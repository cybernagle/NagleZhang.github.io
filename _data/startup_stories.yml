    So I started looking around for solutions and I started looking at bots. Bots are basically software that communicates with humans via a chat app. I came across one company that looked too good to be true. It&#8217;s called ManyChat. And I said, &#8220;I&#8217;ve got to find out who the founder is.&#8221;
    And today, Mikael Yang is the founder of ManyChat. Not only does the software work, but the intelligence behind the scenes of dripping out content, tagging people, interacting with people is brilliant.

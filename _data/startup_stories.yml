- title: "#1001 The 1,000 interview celebration"
  url: https://mixergy.com/interviews/the-1000-interview-celebration/
  summary: "On August 4, 2008, I posted a video up on Mixergy where I looked up into
    the web cam on my computer and I said &#8220;I failed.&#8221; And I said that
    I was going to shut down my invitation business and start doing interviews with
    entrepreneurs and people in general who I admire so I can learn from them and
    take back what I&#8217;ve learned from them to build a more successful company
    in the future. And I said that along the way you&#8217;d get to watch and learn
    as I learned directly from my heroes. We did it. \nA thousand interviews later
    here I am today bringing back some of the most memorable and most influential
    interviewees. People who helped me both on camera here with you and off. I invited
    them on to a Google Hangout to talk about the old days, to ask them some new questions
    and to do short interviews with them all for you. That&#8217;s what this is all
    about. My goal when I started out was to build a successful company. I think Mixergy
    is that company. But I wanted to be even more successful. My goal is that I started
    to talk in interviews afterwards evolved into saying that I would like someone
    who is watching these interviews to learn from them, to use what they&#8217;ve

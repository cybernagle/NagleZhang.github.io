- title: "#1453 The future of chat (and interacting with your customers)"
  url: https://mixergy.com/interviews/manychat-with-mikael-yang/
  summary: |-
    About a year ago I realized that no matter how much effort we’ve put into my email list, I could never double the response rate. We kept growing it, but people were not using email much.
    So I started looking around for solutions and I started looking at bots. Bots are basically software that communicates with humans via a chat app. I came across one company that looked too good to be true. It’s called ManyChat. And I said, “I’ve got to find out who the founder is.”
    And today, Mikael Yang is the founder of ManyChat. Not only does the software work, but the intelligence behind the scenes of dripping out content, tagging people, interacting with people is brilliant.
    This whole space is still pretty young but it’s important to have this conversation because he’s gotten very far and because I want you to see the future of chat as a way of interacting with your customers.

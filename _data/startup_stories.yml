    <p><a href="https://mixergy.com/interviews/he-bought-a-ghost-town/"><img src="https://mixergy.com/interviews/he-bought-a-ghost-town/?get-twitter-card=true&amp;v=14&amp;time=1714057368" alt="" class="alignnone size-full"/></a></p><p>Brent Underwood is the founder of Cerro Gordo, an ambitious project aimed at reviving a historic ghost town into a tourist attraction and real estate opportunity. Outside of his entrepreneurial endeavors, Brent has a passion for history, hospitality, and the unique storytelling of the American West, all of which play a central role in his current venture.</p>

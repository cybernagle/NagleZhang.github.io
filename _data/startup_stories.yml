- title: "#2265 He Bought a Ghost Town"
  url: https://mixergy.com/interviews/he-bought-a-ghost-town/
  summary: |-
    Brent Underwood had a business idea: buy an abandoned town and turn it into a tourist destination.
    It didn&#8217;t work. Mostly because he tried running it remotely.
    Then he moved in. He started looking around, diving into old mines, and finding old treasures.
    He shot video of what he saw and of his renovations. That got hugely popular on social media, helped him raise money and allowed him to fund his project. It&#8217;s all in his book, Ghost Town Living, and in this interview.

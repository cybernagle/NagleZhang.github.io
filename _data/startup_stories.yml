    I’ve learned from them to build a more successful company in the future. And I
    said that along the way you’d get to watch and learn as I learned directly from
    my heroes. We did it. \nA thousand interviews later here I am today bringing back
    some of the most memorable and most influential interviewees. People who helped
    me both on camera here with you and off. I invited them on to a Google Hangout
    to talk about the old days, to ask them some new questions and to do short interviews
    with them all for you. That’s what this is all about. My goal when I started out
    was to build a successful company. I think Mixergy is that company. But I wanted

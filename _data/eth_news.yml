- title: " Why is the crypto market down today? "
  url: https://cointelegraph.com/news/why-is-the-crypto-market-down-today?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "The cryptocurrency market is down on April 7, with the total market capitalization
    dropping by 10% at the peak of the selling to $2.41 trillion. Trading volumes
    across the total crypto market spiked by 293% over the last 24 hours to $165.05
    billion, reinforcing the intensity of the sell-side activity.Top cryptocurrencies
    and their 24-hour performances. Source: Coin360While the crypto market is known
    for its high volatility, several unique factors contributed to this latest dip,
    including US President Trump’s stiff adherence to his recently announced tariffs
    and sharp selling in the equities and crypto market, leading to historically large
    liquidations. Bitcoin’s decoupling endsThe crypto market sank during the early
    part of the Asian trading session on April 7, and US tariffs plunged investors
    into a risk-off mode. President Trump’s administration hit all countries with
    a 10% tariff starting April 5. Trump also emphasized that there would be no deal
    with China, worsening Black Monday’s bearish sentiment.In response, Bitcoin (BTC)
    tumbled as low as $74,434 on Bistamp for the first time since Nov. 6, 2024. Ether
    (ETH) extended its three-day losses, dipping as low as $1,400 on April 7, marking
    16% losses over the last 24 hours. XRP (XRP), Solana (SOL) and BNB Chain’s BNB
    also witnessed significant losses, down 15.5%, 15.3% and 8%, respectively. Performance
    of top cryptocurrencies. Source: CoinMarketCapFears of renewed inflation are intensifying,
    as the tariffs are expected to lead to an “economic nuclear war,” according to
    hedge funder Bill Ackman. The risk of higher-than-anticipated inflation is also
    leading market participants to boost their estimate of Federal Reserve interest
    rate cuts in the near future. The odds of a 25 basis point rate decrease are now
    up 42% compared to 14% a week ago.Target rate potential for June 18 Fed meeting.
    Source: CMEOver $1.4 billion in crypto liquidations accompany market crashMore
    than $1.4 billion in crypto positions have been liquidated in the last 24 hours.
    Almost $1.22 billion of those are long positions. This marked one of the largest
    liquidation events in the history of Web3, mirroring events like the Covid-19
    market crash and the FTX debacle.Crypto market liquidation heatmap. Source: CoinGlassOver
    460,996 traders were liquidated in the past day, with the largest single liquidations
    taking place on OKX involving a BTC/USD swap worth $7 million. This scale of liquidations
    not only exacerbates price drops but also instills fear among other market participants,
    leading to further selling pressure. Over $350 billion wiped off the crypto marketThe
    total market capitalization of all cryptocurrencies (TOTAL) dropped by over 13%
    from a high of $2.67 trillion on April 5 to an intra-day low of $2.31 trillion
    on April 7, as per data from Cointelegraph Markets Pro and TradingView. This marks
    an over $350 billion loss over a span of three days. Although TOTAL has since
    recovered to $2.4 trillion at the time of writing, it is down 35% from the all-time
    high of $3.73 reached on Dec. 17, 2023.As earlier reported by Cointelegraph, the
    US-led trade war could upend investors’ risk-asset sentiment, driving crypto prices
    even lower.This article does not contain investment advice or recommendations.
    Every investment and trading move involves risk, and readers should conduct their
    own research when making a decision.\n\n            "

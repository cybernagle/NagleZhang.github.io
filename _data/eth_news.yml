- title: " Price analysis 4/9: BTC, ETH, XRP, BNB, SOL, DOGE, ADA, LEO, LINK, TON "
  url: https://cointelegraph.com/news/price-analysis-4-9-btc-eth-xrp-bnb-sol-doge-ada-leo-link-ton?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Risky assets remain volatile as trade war tension between the United States
    and China keeps investors on the edge. A minor positive is that Bitcoin (BTC)
    has avoided a sharp fall and is trading well above the crucial near-term support
    at $73,777. BitMEX co-founder Arthur Hayes said in a post on X that the PBOC (People’s
    Bank of China) could give the catalyst needed for the next leg of the crypto bull
    run by weakening the yuan. Such a move led to Chinese capital flight into Bitcoin
    in 2013 and 2015, and it could work again in 2025.Crypto market data daily view.
    Source: Coin360The situation remains fluid and difficult to predict. Therefore,
    investors seem to be curtailing risk, as seen from the $595.9 million in outflows
    from the US-listed spot Bitcoin exchange-traded funds in the past four trading
    days, per Farside Investors data.Could Bitcoin hold above the $73,777 support,
    or will the bears pull the price below it? How are the altcoins positioned? Let’s
    analyze the charts of the top 10 cryptocurrencies to find out.Bitcoin price analysisBitcoin
    tried to start a recovery on April 8 but met with strong selling near the 20-day
    exponential moving average ($82,218). That suggests the sentiment remains negative,
    and traders are selling on rallies.BTC/USDT daily chart. Source: Cointelegraph/TradingViewThe
    downsloping moving averages indicate an advantage to bears, but the positive divergence
    on the relative strength index (RSI) suggests the bearish momentum could be slowing
    down. However, if the $73,777 level cracks, the BTC/USDT pair could swiftly nosedive
    to the next support at $67,000. Solid buying is likely to emerge in the $67,000
    to $65,000 support zone.The 50-day simple moving average ($85,703) remains the
    key overhead resistance to watch out for. Buyers will have to drive the price
    above the 50-day SMA to suggest that the corrective phase may have ended. Until
    then, rallies are likely to be sold into.Ether price analysisEther (ETH) has been
    in a strong downtrend, but the price has reached the $1,368 support, which could
    start a relief rally.ETH/USDT daily chart. Source: Cointelegraph/TradingViewThe
    ETH/USDT pair could rise to the 20-day EMA ($1,786), which is likely to act as
    a stiff hurdle. If the price turns down from the 20-day EMA, the bears will try
    to sink the pair below $1,368. If they can pull it off, the pair may collapse
    to $1,150.Instead, if the price turns down from the 20-day EMA but rebounds off
    $1,368, it will signal a range formation in the near term. A break and close above
    the 20-day EMA suggests the bears are losing their grip. The pair may then ascend
    to the breakdown level of $2,111.XRP price analysisXRP (XRP) tried to rise above
    the breakdown level of $2 on April 8, but the bears held their ground. That suggests
    the bears are trying to flip the level into resistance.XRP/USDT daily chart. Source:
    Cointelegraph/TradingViewIf the price turns down and breaks below $1.61, the XRP/USDT
    pair could resume the downtrend. The next support on the downside is at $1.27.Conversely,
    if buyers drive the price above the 20-day EMA ($2.10), it suggests solid demand
    at lower levels. There is a minor hurdle at the 50-day SMA, but it is likely to
    be crossed. If that happens, the pair could rally to the resistance line, where
    the bears are expected to sell aggressively.BNB price analysisBNB (BNB) is trying
    to form a higher low at $520, indicating solid buying by the bulls at lower levels.BNB/USDT
    daily chart. Source: Cointelegraph/TradingViewThe bulls will try to push the price
    toward the downtrend line, which is expected to act as a solid barrier. If the
    price returns from the downtrend line, it will indicate that the bears are active
    at higher levels. The BNB/USDT pair may oscillate inside the triangle for a while.The
    support line is the crucial level to watch out for on the downside. A break and
    close below the support line could open the doors for a fall to $460. Buyers are
    expected to defend the $460 level with all their might because a break below it
    may sink the pair to $400.Solana price analysisSolana (SOL) has been trading below
    the $110 support, but the bears have failed to start a downward move. That suggests
    a lack of aggressive selling at lower levels.SOL/USDT daily chart. Source: Cointelegraph/TradingViewBuyers
    are expected to face stiff resistance in the $110 to $120 zone. If the price turns
    down from the overhead zone, it will signal that the bears remain sellers on rallies.
    That heightens the risk of a break below $95. The SOL/USDT pair may then tumble
    to $80.Alternatively, a break and close above $120 suggests that the markets have
    rejected the breakdown below $110. The 50-day SMA ($135) may act as a resistance,
    but it is likely to be crossed. The pair could rise to $147 and, after that, to
    $180.Dogecoin price analysisDogecoin (DOGE) is witnessing a tough battle between
    the bulls and the bears near the $0.14 support.DOGE/USDT daily chart. Source:
    Cointelegraph/TradingViewThe downsloping moving averages indicate advantage to
    bears, but the positive divergence on the RSI suggests the selling pressure is
    reducing. However, if the price dips and maintains below $0.14, the selling could
    pick up again. The next stop on the downside is at $0.10.Contrarily, a break and
    close above the $0.20 resistance signals the formation of a double bottom pattern.
    The DOGE/USDT pair could rally to $0.24 and later to the pattern target of $0.26.Cardano
    price analysisBuyers are trying to keep Cardano (ADA) above the $0.50 support
    but are expected to face selling on every minor rally.ADA/USDT daily chart. Source:
    Cointelegraph/TradingViewIf the price turns down from the 20-day EMA ($0.65),
    it increases the risk of a break below $0.50. The ADA/USDT pair could then drop
    to $0.45 and subsequently to $0.40. Buyers are expected to fiercely defend the
    $0.30 to $0.40 support zone.The first sign of strength will be a break and close
    above the 20-day EMA. If that happens, the pair may climb to the 50-day SMA ($0.72).
    This is an important level for the bears to defend because a break above it signals
    a short-term trend change.Related: Bitcoin price at risk of new 5-month low near
    $71K if tariff war and stock market tumult continuesUNUS SED LEO price analysisUNUS
    SED LEO (LEO) has started a recovery, which is expected to face selling at the
    20-day EMA ($9.36).LEO/USD daily chart. Source: Cointelegraph/TradingViewIf the
    price turns down from the 20-day EMA, it will signal that the sentiment has turned
    negative and traders are selling on rallies. That increases the risk of a break
    below the $8.80 support. If that happens, the LEO/USD pair could drop to $8.30.Contrary
    to this assumption, if the price rises and maintains above the 20-day EMA, it
    indicates solid buying at lower levels. The bulls will then attempt to push the

- title: " Price analysis 4/11: BTC, ETH, XRP, BNB, SOL, DOGE, ADA, LEO, LINK, AVAX "
  url: https://cointelegraph.com/news/price-analysis-4-11-btc-eth-xrp-bnb-sol-doge-ada-leo-link-avax?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Bitcoin (BTC) is showing strength as buyers have pushed the price above
    $82,500, but higher levels are likely to attract solid selling from the bears.
    CryptoQuant analysts said in a recent market report that Bitcoin could face resistance
    around $84,000, but if the level is surpassed, the next stop may be $96,000.Although
    trade tensions between the United States and China have flared up, institutional
    crypto investment firm Bitwise remains bullish on Bitcoin. Bitwise chief investment
    officer Matt Hougan said in a post on X that the firm’s previously predicted year-end

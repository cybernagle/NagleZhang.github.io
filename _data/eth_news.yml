    line. That could sink the pair to $8.84 and later to $8.30.Chainlink price analysisChainlink
    (LINK) plunged and closed below the support line of the descending channel pattern
    on March 10, but the bears could not sustain the lower levels.LINK/USDT daily
    chart. Source: Cointelegraph/TradingViewThe bulls have pushed the price back into
    the channel on March 14, but their efforts are likely to be met with strong selling
    at the 20-day EMA ($15.14). If the price turns down from the 20-day EMA, the bears
    will attempt to sink the LINK/USDT pair below $11.85. If they manage to do that,
    the pair could decline to $10.On the contrary, a break and close above the 20-day
    EMA will signal that the markets have rejected the break below the channel. The
    pair may then climb to the 50-day SMA ($18.27).This article does not contain investment
    advice or recommendations. Every investment and trading move involves risk, and
    readers should conduct their own research when making a decision.\n\n            "

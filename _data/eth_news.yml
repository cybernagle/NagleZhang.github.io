- title: " Ethereum whale liquidated for $106M on Sky amid crypto bloodbath "
  url: https://cointelegraph.com/news/ethereum-whale-loses-106-million-maker-amid-crypto-bloodbath?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "An Ether investor who had a large position on decentralized finance (DeFi)
    lending platform Sky has been liquidated to the tune of more than $100 million
    as the price of Ether crashed. The Ether (ETH) whale lost 67,570 ETH worth around
    $106 million when the asset crashed by around 14% on April 6, liquidating his
    collateralized debt position on Sky, according to Maker Vaults explorer DeFi Explore,
    and as observed by Lookonchain.The Sky lending protocol, which rebranded from
    Maker in August, is used by DeFi participants to create collateralized debt positions
    by providing crypto, ETH in this case, to borrow the platform’s stablecoin, DAI
    (DAI).The system uses an overcollateralization ratio, typically 150% or higher,
    meaning that users need to deposit at least $150 worth of ETH to borrow 100 DAI. The
    protocol autonomously monitors the value of ETH collateral relative to the borrowed
    DAI, and if the ETH value falls and the collateral ratio drops below the minimum
    requirement, the position becomes eligible for liquidation.This whale’s liquidation
    occurred when the ratio fell to 144% as the price of ETH plummeted. ETH whale
    liquidations. Source: DeFi ExploreMeanwhile, Spot On Chain reported that another
    whale that supplied 56,995 wrapped ETH, worth around $91 million, to borrow DAI
    was on the verge of liquidation. In a liquidation event, Sky seizes the ETH collateral,
    which is auctioned off to pay back the borrowed DAI plus fees. Any remaining collateral
    after the debt is paid is returned to the user. Ethereum price at bear market
    lowsETH prices have crashed a whopping 14.5% over the past 24 hours, falling to
    $1,547 at the time of writing as the wider crypto market melts down in reaction
    to US President Donald Trump’s tariff-induced market sell-off. The last time ETH
    traded this low was in October 2023, when crypto was still deep in bear market
    territory, almost a year after the collapse of the FTX exchange. ETH remains down
    68% from its all-time high in 2021, and further losses are likely to see more
    DeFi users liquidated unless they can provide more collateral. Related: Bitcoin
    price drops below $80K as stocks face 1987 Black Monday rerunAccording to CoinGlass,
    320,000 traders have been liquidated over the past 24 hours to the tune of almost
    $1 billion dollars. The majority of liquidations over the past four hours have
    been ETH positions, it revealed.Magazine: Bitcoin heading to $70K soon? Crypto
    baller funds SpaceX flight: Hodler’s Digest\n\n            "

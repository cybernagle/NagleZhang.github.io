- title: " Standard Chartered drops 2025 ETH price estimate by 60% to $4K "
  url: https://cointelegraph.com/news/standard-chartered-drops-2025-eth-price-estimate-by-60-to-4-k?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWE1ODQtZWNiNS03NmQ1LWJiODMtOTdlYmRlYmM3MDVk.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWE1ODQtZWNiNS03NmQ1LWJiODMtOTdlYmRlYmM3MDVk.jpg\"
    alt=\"Standard Chartered drops 2025 ETH price estimate by 60% to $4K\"></p><p>Ethereum
    price is more than 52% down from its December 2024 high at $4,107 and data from
    TradingView shows ETH (<a data-ct-non-breakable=\"null\" href=\"/ethereum-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">ETH</a>) down 42% since
    the start of 2025.&nbsp;<p>Despite being one of the largest cryptocurrencies by
    market capitalization and holding the dominant spot as the leader in Web3 and
    DeFi, many analysts believe that ETH&rsquo;s price prospects remain grim in the
    short term.&nbsp;</p><p>Crypto analyst and chartered market technician Askel Kibar
    warned traders against assuming that ETH price trades at a discount simply based
    on how far off it is from its average trading price.&nbsp;</p><p>On X, Kibar <a
    data-ct-non-breakable=\"null\" href=\"https://x.com/TechCharts/status/1901662508164821185\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">explained</a> that &ldquo;bottom
    reversals take time&rdquo; given that &ldquo; all that supply needs to be accumulated.&rdquo;&nbsp;</p><figure><img
    alt=\"Coinbase, Cryptocurrencies, Markets, Base, Solana, Layer2, Ethereum Price,
    Arbitrum, Memecoin, Dencun Upgrade\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a599-5db4-72dc-a118-bbbe9f6276a5\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><br><em>ETH/USD daily
    chart. Source: X / Aksel Kibar</em></p></figcaption></figure><p>Referring to the
    chart above, Kibar said,&nbsp;</p><blockquote>&ldquo;Those of you that want to
    see ETH outperform BTC need to see similar price action to 2018-2020 period. After
    an extending downtrend price formed a double bottom late in 2019. Then it turned
    out to a larger scale H&amp;S bottom reversal.&rdquo;&nbsp;</blockquote><p>Currently,
    ETH&rsquo;s chart does not show any type of bottoming formation, leading Kibar
    to compare trading Ethereum to &ldquo;catching a falling knife.&rdquo;&nbsp;</p><h2><strong>Standard
    Chartered chops 2025 ETH price call to $4,000</strong></h2><p>Standard Chartered
    added to the dim outlook via a March 17 client letter, which revised down their
    end of 2025 ETH price estimate from $10,000 to $4,000, a drastic 60% reduction.</p><p>Geoff
    Kendrick, the bank&rsquo;s global head of Digital Assets Research, said, &ldquo;We
    expect ETH to continue its structural decline.&rdquo;</p><blockquote>&ldquo;Layer
    2 blockchains were meant to improve ETH scalability, but we estimate that Base
    (a key layer 2) has removed USD 50bn from ETH&rsquo;s market cap.&rdquo;&nbsp;</blockquote><p>Kendrick
    cited lower ETH fees, a &ldquo;higher net issuance,&rdquo; and layer 2 blockchains
    &ldquo;taking Ethereum&rsquo;s GDP&rdquo; as an unexpected result of the Dencun
    upgrade.&nbsp;</p><p>Adding to their observation of Base absorbing Ethereum&rsquo;s
    fee revenue, Kendrick said,&nbsp;</p><blockquote>&ldquo;In particular, Base &mdash;
    a layer 2 that was developed to address the problem of scalability on Ethereum&mdash;
    is passing all the profit (fee revenue minus data recording fees) it extracts
    to Coinbase, its corporate owner.&rdquo;&nbsp;</blockquote><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/long-term-ethereum-accumulation-could-unwind-if-eth-price-falls-below-1-9-k-analyst\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Long-term
    Ethereum accumulation could unwind if ETH price falls below $1.9K &mdash; Analyst</strong></em></a></p><p>VanEck
    Head of Digital Assets Research Matthew Sigel and Patrick Bush, the firm's Senior
    Analyst on Digital Assets, concur with the dim ETH price view held by many analysts.
    In a March 5 <a data-ct-non-breakable=\"null\" href=\"https://www.vaneck.com/us/en/blogs/digital-assets/matthew-sigel-vaneck-crypto-monthly-recap-for-february-2025/?cid=28489765/ANYSRG4&amp;mkt_tok=NDEwLVhPUi02NzMAAAGZCvLA2n0gGLCuBpODE-YNXtJBg9k2V8FEV4PadExlCh3T5Dh2QhbmoFqXgUUYYDVNkVXVH-UCRK73fkYVbxJF9N2EIOyPavNEevSElNjT8-v1175E#ethereum\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">note</a> to investors,
    the researchers cited ETH&rsquo;s decline as being &ldquo;largely due to the erosion
    of the core factors that once made Ethereum valuable.&rdquo;&nbsp;</p><p>The analysts
    again cited layer 2 blockchains Arbitrum and Base as catalysts in <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/ethereum-onchain-data-2k-eth-price-out-of-reach\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">diminishing ETH&rsquo;s
    fee revenue</a>, along with the popularity of memecoin trading on the Solana blockchain.&nbsp;&nbsp;</p><p
    class=\"post-content__disclaimer\" type=\"\">This article does not contain investment
    advice or recommendations. Every investment and trading move involves risk, and
    readers should conduct their own research when making a decision.</p><template
    data-name=\"subscription_form\" data-type=\"markets_outlook\" label=\"Subscription
    Form: Markets Outlook\"></template></p>\n</p>\n            "

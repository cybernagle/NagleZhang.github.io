    China agree to slash tariffsDogecoin price predictionDogecoin (DOGE) turned down
    from $0.26 on May 11, indicating profit booking by short-term buyers.DOGE/USDT
    daily chart. Source: Cointelegraph/TradingViewThe bulls are expected to aggressively

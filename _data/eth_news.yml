- title: " Deutsche Boerse to launch Bitcoin, Ether institutional custody: Report "
  url: https://cointelegraph.com/news/deutsche-boerse-to-launch-btc-eth-services-to-institutions-report?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTg0NGItMzgxMS03YzdiLWEyNTItNmU4ZjMxZGMyNGIw.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTg0NGItMzgxMS03YzdiLWEyNTItNmU4ZjMxZGMyNGIw.jpg\"
    alt=\"Deutsche Boerse to launch Bitcoin, Ether institutional custody: Report\"></p><p>Deutsche
    Boerse&rsquo;s trading unit, Clearstream, is preparing to launch cryptocurrency
    custody and settlement services for institutional clients in 2025 amid increasing
    demand for regulated digital asset infrastructure.<p><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/coinshares-launches-staked-algorand-etp-on-deutsche-boerse-xetra\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/coinshares-launches-staked-algorand-etp-on-deutsche-boerse-xetra\">The
    German exchange group</a> plans to offer Bitcoin (BTC) and Ether (ETH) custody
    to its more than 2,500 institutional clients, with services expected to begin
    in April, <a data-ct-non-breakable=\"null\" href=\"https://www.bloomberg.com/news/articles/2025-03-11/deutsche-boerse-s-clearstream-to-offer-bitcoin-ether-custody\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://www.bloomberg.com/news/articles/2025-03-11/deutsche-boerse-s-clearstream-to-offer-bitcoin-ether-custody\">according</a>
    to a Bloomberg report on March 11.</p><p>Clearstream will provide these digital
    asset services through Crypto Finance AG, a Switzerland-based subsidiary in which
    Deutsche Boerse <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/deutsche-boerse-acquires-majority-ownership-of-crypto-finance-ag\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">acquired a majority
    stake</a> in 2021.</p><p>Deutsche Boerse&rsquo;s trading unit also aims to launch
    support for other cryptocurrencies and diversified services such as staking, lending
    and brokerage capabilities.</p><p>&ldquo;With this offering, we are creating a
    one-stop shop around custody, brokerage and settlement,&rdquo; Jens Hachmeister,
    head of issuer services and new digital markets at Clearstream, told Bloomberg.</p><p>The
    move aligns with a growing institutional push toward regulated crypto services
    in Europe following the <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/mica-attract-crypto-investment-despite-overregulation-concerns-regulatory-expert\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">implementation of Markets
    in Crypto-Assets Regulation (MiCA)</a>, which went into full effect for crypto
    asset service providers on Dec. 30, 2024.</p><p>The institutional offering came
    nearly two months after Boerse Stuttgart Digital Custody became <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/boerse-stuttgart-digital-first-mica-license-germany\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Germany&rsquo;s first
    crypto asset service provider</a> to receive a full license under MiCA, Cointelegraph
    reported on Jan. 17.</p><p>Boerse Stuttgart&rsquo;s license was part of the firm&rsquo;s
    efforts to become a regulated infrastructure provider for banks, brokers and asset
    managers.</p><p><em><strong>Related: </strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/mica-systemic-banking-risks-stablecoin-tether-ceo\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>EU MiCA
    rules pose &lsquo;systemic&rsquo; banking risks for stablecoins &mdash; Tether
    CEO</strong></em></a></p><h2>Europe&rsquo;s MiCA poses overregulation concerns</h2><p>While
    MiCA is widely viewed as a positive step for global crypto regulation, some industry
    experts worry about <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/mica-attract-crypto-investment-despite-overregulation-concerns-regulatory-expert\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/mica-attract-crypto-investment-despite-overregulation-concerns-regulatory-expert\">potential
    regulatory overreach</a> that could impact retail investors and drive crypto firms
    out of Europe.</p><p>While the regulation is a significant step toward a more
    mature industry, it also seeks to identify the &ldquo;weak points of control&rdquo;
    in the crypto space, which could mean more scrutiny for retail investors and the
    end-users of crypto platforms, according to Dmitrij Radin, the founder of Zekret
    and chief technology officer of Fideum, a regulatory and blockchain infrastructure
    firm focused on institutions.</p><p>&ldquo;Retail users will be way more obligated
    to provide information, data which will be screened. They will be accounted for.
    Most Europeans will see taxation,&rdquo; Radin told Cointelegraph.</p><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/20-percent-gen-z-alpha-crypto-retirement-report\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>20% of Gen
    Z, Alpha sees crypto as retirement alternative: Report</strong></em></a></p><p>The
    regulation also raises the possibility of enforcement actions against blockchain
    protocols that fail to comply with MiCA standards. European governments may pursue
    legal cases against noncompliant platforms during the early implementation phase.</p><p>Other
    blockchain regulatory experts fear that MiCA will introduce consolidation among
    crypto firms with limited capital, leading to a potential <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/mica-crypto-firm-exodus-middle-east-regulatory-expert\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">crypto firm exodus to
    the Middle East</a> due to more lenient regulations.</p><iframe width=\"100%\"
    height=\"315\" src=\"https://www.youtube.com/embed/q980_6dJFYU?start=\" frameborder=\"0\"
    allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\"
    allowfullscreen loading=\"lazy\"></iframe><p><em><strong>Magazine: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/sec-crypto-laws-unclear/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>SEC&rsquo;s
    U-turn on crypto leaves key questions unanswered</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"law_decoded\" label=\"Subscription
    Form: Law Decoded\"></template></p>\n</p>\n            "

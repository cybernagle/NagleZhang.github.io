    “Our job isn’t to build crypto products. It’s to make DeGods as big as it can
    possibly be. That’s what you want. That’s what we want too. So that’s exactly
    what we’re gonna do,” Pasta wrote. Source: PastagotsauceRelated: Doodles NFT sales
    surge 97% ahead of DOOD token airdropNFT sales are up by 17% in the last seven
    daysMeanwhile, the broader NFT market has also gained traction in the last seven
    days. CryptoSlam data shows that from May 6 to 12, NFTs recorded a sales volume
    of over $120 million, a 17% increase over the previous week. Magazine: Trump-Biden
    bet led to obsession with ‘idiotic’ NFTs —Batsoupyum, NFT Collector\n\n            "

- title: " Deloitte predicts $4T tokenized real estate on blockchain by 2035 "
  url: https://cointelegraph.com/news/real-estate-tokenization-forecast-4-trillion-2035?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Over $4 trillion worth of real estate could be tokenized on blockchain
    networks during the next decade, potentially offering investors greater access
    to property ownership opportunities, according to a new report.The Deloitte Center
    for Financial Services predicts that over $4 trillion worth of real estate may
    be tokenized by 2035, up from less than $300 billion in 2024. The report, published
    April 24, estimates a compound annual growth rate (CAGR) of more than 27%.The
    $4 trillion of tokenized property is predicted to stem from the benefits of blockchain-based
    assets, as well as a structural shift across real estate and property ownership.Global
    tokenized real estate value, growth predictions. Source: Deloitte“Real estate
    itself is undergoing transformation. Post-pandemic work-from-home trends, climate
    risk, and digitization have reshaped property fundamentals,” according to Chris
    Yin, co-founder of Plume Network, a blockchain built for real-world assets (RWAs).“Office
    buildings are being repurposed into AI data centers, logistics hubs and energy-efficient
    residential communities,” Yin told Cointelegraph.“Investors want targeted access
    to these modern use cases, and tokenization enables programmable, customizable
    exposure to such evolving asset profiles,” he said.Related: Blockchain needs regulation,
    scalability to close AI hiring gapThe uncertainty triggered by US President Donald
    Trump’s import tariffs has boosted investor interest in the RWA tokenization sector,
    which involves minting financial products and tangible assets on a blockchain.Both
    stablecoins and RWAs have attracted significant capital as safe-haven assets amid
    the global trade concerns, Juan Pellicer, senior research analyst at IntoTheBlock,
    told Cointelegraph.The tariff concerns also led tokenized gold volume to surpass
    $1 billion in trading volume on April 10, its highest level since March 2023 when
    a US banking crisis saw the sudden collapse of Silicon Valley Bank and the voluntary
    liquidation of Silvergate BankRelated: US banks are ‘free to begin supporting
    Bitcoin’ — Michael SaylorBlockchain innovation could drive regulatory clarityGrowing
    RWA adoption may inspire a more welcoming stance from global regulators, Yin said.“While
    regulation is a hurdle, regulation follows usage,” he explained, likening tokenization
    to Uber’s growth before widespread regulatory acceptance:“Tokenization is similar
    — as demand increases, regulatory clarity will follow.”He added that making tokenized
    products compliant with a wide range of international regulations is key to unlocking
    broader market access.  However, some industry watchers are skeptical about the
    benefits introduced by tokenized real estate.The Truth Behind Tokenization and
    RWA panel. Source: Paris Blockchain Week“I don’t think tokenization should have
    its eyes directly set on real estate,” said Securitize chief operating officer
    Michael Sonnenshein at Paris Blockchain Week 2025.“I’m sure there are all kinds
    of efficiencies that can be unlocked using blockchain technology to eliminate
    middlemen, escrow, and all kinds of things in real estate. But I think today,
    what the onchain economy is demanding are more liquid assets,” he added. Magazine:
    Ripple says SEC lawsuit ‘over,’ Trump at DAS, and more: Hodler’s Digest, March
    16 – 22\n\n            "

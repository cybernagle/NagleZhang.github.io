- title: " Ethereum market share nears historic lows as ETH price risks falling to
    $1,100 "
  url: https://cointelegraph.com/news/ethereum-market-dominance-nears-historic-lows-eth-price-risks-falling?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Ether’s (ETH) market is very close to hitting all-time lows as a classic
    bearish chart pattern hints at a deeper correction toward $1,100.Ethereum’s market
    dominance keeps fallingOn April 9, Ethereum’s market dominance, or the measure
    of Ether’s share of crypto’s overall market capitalization, hit a new multiyear
    low of 7.18%, according to Cointelegraph Markets Pro and TradingView data. This
    value was merely a hair’s breadth above the all-time low of 7.09% reached in September
    2019.“Ethereum dominance is so very close to registering new all-time lows,” said
    popular crypto analyst Rekt Capital in an April 13 post on X, adding:“Ethereum
    Dominance needs to hold this green area to position itself to become more market-dominant
    over the coming months.”ETH market dominance %. Source: Rekt CapitalEther’s market
    share is now at its lowest value since 2019-2020. Meanwhile, Ether’s closest competitor
    in terms of market capitalization, XRP (XRP), has seen its dominance rise by over
    200% over the same timeframe.  Its top layer-1 rival tokens, BNB Chain’s (BNB)
    and Solana’s (SOL), have also seen 40% and 344% increases in their market dominance
    since 2023. Several reasons for this underwhelming performance include weak institutional
    demand evidenced by negative ETF flows, a sluggish derivatives market, and increasing
    competition from other layer-1 blockchains.More trouble for Ethereum could also
    be found when analyzing the total value locked (TVL) of competing blockchains.
    Although Ethereum remains the leader with a market dominance of 51.7%, this metric
    has decreased from 61.2% in February 2024. In comparison, Solana’s dominance in
    terms of TVL has increased by 172% over the same period. Total value locked market
    share (%). Source: DefiLlamaETH price “bear flag” targets $1,100Ether price, or
    the ETH/USD trading pair, is expected to resume its prevailing bearish momentum
    despite recovering from recent lows as a classic (bearish) chart pattern emerges.Related:
    Ethereum could be AI’s key to decentralization, says former core devEther’s price
    action over the past three weeks is painting a possible bear flag pattern on the
    daily chart, as shown in the figure below. A daily candlestick close below the
    flag’s lower boundary at $1,600 would signal the start of a massive move downward.The
    flagpole’s height sets the target, putting Ether’s potential price drop target
    at $1,100, or a 33% drop from the current price.ETH/USD daily chart with potential
    bear flag. Source: Cointelegraph/TradingViewMeanwhile, one key indicator to keep
    an eye on remains the relative strength index, or RSI, which is still below the
    50 mark, suggesting that the market trend still favors the downside.As Cointelegraph
    reported, ETH's price may ultimately bottom out at around $1,000 based on several
    other factors. This article does not contain investment advice or recommendations.
    Every investment and trading move involves risk, and readers should conduct their
    own research when making a decision.\n\n            "

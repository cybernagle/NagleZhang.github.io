- title: " Price analysis 3/28: BTC, ETH, XRP, BNB, SOL, DOGE, ADA, TON, LINK, AVAX "
  url: https://cointelegraph.com/news/price-analysis-3-28-btc-eth-xrp-bnb-sol-doge-ada-ton-link-avax?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Bitcoin (BTC) is moving farther away from the crucial $90,000 mark, indicating
    that buying dries up at higher levels. Market participants seem nervous about
    the fresh round of US trade tariffs and the renewed inflation pressure as US Personal
    Consumption Expenditures data came in hotter-than-expected.Traders are divided
    about Bitcoin’s price trajectory in 2025. Analyzing data from the prediction markets
    platform Polymarket, X user Ashwin highlighted that Bitcoin’s most bearish target
    for 2025 is $59,040, and the most bullish is $138,617.Crypto market data daily
    view. Source: Coin360Although the near-term remains uncertain, Real Vision chief
    crypto analyst Jamie Coutts remains bullish on Bitcoin. Coutts told Cointelegraph
    that Bitcoin could hit a new all-time high above $109,000 before the end of the
    second quarter. He added that a lack of clarity on the US tariffs and recession
    concerns are unlikely to derail the potential Bitcoin rally.What are the important
    support levels to watch out for in Bitcoin and the major altcoins? Let’s analyze
    the charts of the top 10 cryptocurrencies to find out.Bitcoin price analysisBitcoin
    turned down from the resistance line and broke below the 20-day exponential moving
    average ($85,765) on March 28.BTC/USDT daily chart. Source: Cointelegraph/TradingViewThe
    bears will try to pull the price below the immediate support at $83,000. If they
    do that, the BTC/USDT pair could slide to $81,000 and later to $80,000. Buyers
    are expected to fiercely defend the zone between $76,606 and $80,000.The bulls
    will have to push and maintain the price above the resistance line to signal that
    the correction may be ending. A close above the 50-day simple moving average ($89,346)
    could propel the pair to $95,000 and eventually to the psychological resistance

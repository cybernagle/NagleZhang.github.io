    view will be negated if the price turns down from the current level of $2,111
    and breaks below $1,754. That will signal the resumption of the downtrend. The
    pair may then nosedive to $1,500.XRP price analysisXRP (XRP) rebounded off the
    $2 support on March 11 and reached the 20-day EMA ($2.35) on March 13.XRP/USDT
    daily chart. Source: Cointelegraph/TradingViewThe bears are trying to halt the

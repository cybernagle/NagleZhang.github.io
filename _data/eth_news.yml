- title: " Starknet to settle on Bitcoin and Ethereum to unify the chains "
  url: https://cointelegraph.com/news/starknet-to-settle-on-bitcoin-ethereum-unify-chains?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTg3NjgtZGJiZi03NDkwLTljYmEtMjRjYWFhOTNiNDBl.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTg3NjgtZGJiZi03NDkwLTljYmEtMjRjYWFhOTNiNDBl.jpg\"
    alt=\"Starknet to settle on Bitcoin and Ethereum to unify the chains\"></p><p>Ethereum
    layer 2 Starknet is laying the groundwork to settle on Bitcoin and Ethereum to
    unify the two largest blockchains on a single layer.<p>The Starknet Foundation
    <a data-ct-non-breakable=\"null\" href=\"https://www.starknet.io/blog/starknet-bitcoin-scaling/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">said</a> in its March
    11 Bitcoin roadmap that it&rsquo;s aiming for Starknet to become <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/learn/articles/a-beginners-guide-to-understanding-the-layers-of-blockchain-technology\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Bitcoin&rsquo;s execution
    layer</a>, scaling it from 13 transactions per second to thousands, reducing blocks
    and gas fees, and creating a better user experience.</p><p>&ldquo;Most Bitcoin
    today sits static in wallets and exchanges, constrained by the limitations of
    the network&rsquo;s original design: a lack of scalability and an inability to
    natively support applications beyond simple buying, selling, and transferring,&rdquo;
    the foundation said.</p><p>It added that while some investors view Bitcoin (<a
    data-ct-non-breakable=\"null\" href=\"/bitcoin-price\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">BTC</a>) as &ldquo;digital gold,&rdquo; it believes
    &ldquo;there is a demand for utilizing Bitcoin for purposes beyond that.&rdquo;</p><figure><img
    alt=\"Starknet to settle on Bitcoin and Ethereum to unify the chains\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195882a-fae7-7506-a5f5-46fb05eaf677\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/Starknet/status/1899460308814716946\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\"><em>Starknet</em></a></p></figcaption></figure><p>Previously,
    StarkWare CEO Eli Ben Sasson, the company behind the STARK proof that contributes
    to the development of Starknet, said <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-upgrade-ethereum-defi\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">OP_CAT</a>, a Satoshi-era
    opcode for unlocking programmability on Bitcoin that was disabled over security
    concerns, <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/op-cat-may-go-live-bitcoin-within-12-months-starkware-eli-ben-sasson\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">would allow Starknet
    to settle</a> on the Bitcoin blockchain.&nbsp;</p><p>If successful, Starknet said
    the move would allow developers to build applications on the Bitcoin network through
    smart contracts and enable applications such as staking, borrowing, lending, leveraged
    trading and yield farming.</p><p>As part of the announcement, StarkWare said it
    has joined the growing number of firms in creating a Bitcoin reserve, holding
    a <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-reserve-us-states-global-accumulation\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">growing portion of its
    treasury</a> in crypto.</p><figure><img alt=\"Starknet to settle on Bitcoin and
    Ethereum to unify the chains\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195882c-289e-76fb-a82a-d6157096408b\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/ameensol/status/1899484469037559892\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\"><em>Ameen Soleimani</em></a></p></figcaption></figure><p>Starknet
    will also team up with <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/explained/crypto-wallets-explained\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Bitcoin Web3 wallet</a>
    Xverse, whose founder and CEO Ken Liao said the integration, slated for the second
    quarter of 2025, will achieve Bitcoin&rsquo;s &ldquo;DeFi take-off moment.&rdquo;</p><p>Xverse
    <a data-ct-non-breakable=\"null\" href=\"https://www.xverse.app/blog/xverse-is-integrating-starknet-l2\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">said</a> wallets need
    to be more than just storage solutions; and allow easy access to Bitcoin&rsquo;s
    growing utility. Liao said in a statement that the endgame is trustless DeFi on
    Bitcoin.</p><p><em><strong>Related: </strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/unknown-attacker-causes-issues-pectra-test-sepolia\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Unknown
    attacker causes headaches during Pectra upgrade on Sepolia</strong></em></a></p><p>&ldquo;In
    today&rsquo;s environment, there is a temptation for wallet teams to say, &lsquo;yeah,
    let&rsquo;s just focus on making it easier for people to use Bitcoin as a store
    of value,&rsquo;&rdquo; Liao said.</p><p>&ldquo;But the long-term future of Bitcoin
    also includes utility, and that&rsquo;s why layer 2 solutions must reach the public
    via the wallets they actually use,&rdquo; he added.</p><p>Meanwhile, in a March
    11 X space discussing Starknet&rsquo;s plan, Ethereum co-founder Vitalik Buterin
    <a data-ct-non-breakable=\"null\" href=\"https://x.com/starkwareltd/status/1899498614394966450?s=52\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">said</a> a proper Bitcoin
    L2 that can satisfy the needed security properties would &ldquo;make crypto payments
    great again, and all those use cases can work.&rdquo;</p><blockquote class=\"twitter-tweet\"><p
    lang=\"en\" dir=\"ltr\">Starknet on Bitcoin and Ethereum <a href=\"https://t.co/tCyQDHY7Yr\">https://t.co/tCyQDHY7Yr</a></p>&mdash;
    StarkWare &#128058;&#128049; (@StarkWareLtd) <a href=\"https://twitter.com/StarkWareLtd/status/1899498614394966450?ref_src=twsrc%5Etfw\">March
    11, 2025</a></blockquote><script async src=\"https://platform.twitter.com/widgets.js\"
    charset=\"utf-8\"></script><p>Buterin said there is a &ldquo;lot of value&rdquo;
    in enabling the trustless flow of assets between the Bitcoin and Ethereum ecosystems,
    such as easier paths for decentralized exchange.</p><p>&ldquo;If you go back to
    the white paper, Bitcoin was meant to be a peer-to-peer electronic cash system,
    and obviously, layer 1 is not nearly scalable enough for that,&rdquo; Buterin
    said.</p><p>&ldquo;I think we&rsquo;ve also seen some of the limits of the Lightning
    Network and that kind of approach.&ldquo;</p><p><em><strong>Magazine: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/megaeth-launch-could-save-ethereum-but-at-what-cost/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>MegaETH
    launch could save Ethereum&hellip; but at what cost?</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"defi_newsletter\" label=\"Subscription
    Form: DeFi Newsletter\"></template></p>\n</p>\n            "

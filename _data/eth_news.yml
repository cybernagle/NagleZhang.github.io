- title: " Hyperliquid’s mystery 50x ETH whale is now betting on LINK "
  url: https://cointelegraph.com/news/hyperliquid-mystery-50x-eth-whale-bet-link?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTk2NTYtOGQyNC03NzMxLWExODMtYzhlMGNhNDQ0ZGJi.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTk2NTYtOGQyNC03NzMxLWExODMtYzhlMGNhNDQ0ZGJi.jpg\"
    alt=\"Hyperliquid’s mystery 50x ETH whale is now betting on LINK\"></p><p>The
    cryptocurrency trader whose ultra-leveraged Ether (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/ethereum-price\" rel=\"\" target=\"_self\" text=\"null\"
    title=\"https://cointelegraph.com/ethereum-price\">ETH</a>) trade tested Hyperliquid&rsquo;s
    limits on March 12 has entered another multimillion-dollar position, this time
    in Chainlink (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/chainlink-price-index\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/chainlink-price-index\">LINK</a>),
    onchain data shows.&nbsp;<p>On March 14, the anonymous whale, referred to on X
    as &ldquo;ETH 50x Big Guy,&rdquo; took out long positions in LINK worth approximately
    $31 million with 10 times leverage, according to Lookonchain, a Web3 analytics
    service.&nbsp;</p><p>He placed the bets on Hyplerliquid and GMX, two popular perpetuals
    exchanges, Lookonchain <a data-ct-non-breakable=\"null\" href=\"https://x.com/lookonchain/status/1900496078258213100\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://x.com/lookonchain/status/1900496078258213100\">said</a>
    in a March 14 X post. Additionally, the whale accumulated roughly $12 million
    in spot LINK. </p><p>In the ensuing hours, the whale gradually reduced his LINK
    holdings through small swaps back into stablecoins, as per onchain <a data-ct-non-breakable=\"null\"
    href=\"https://debank.com/profile/0xf3f496c9486be5924a93d67e98298733bb47057c/history\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://debank.com/profile/0xf3f496c9486be5924a93d67e98298733bb47057c/history\">data</a>.&nbsp;</p><figure><img
    alt=\"Hyperliquid&rsquo;s mystery 50x ETH whale is now betting on LINK\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195965c-b454-781a-bfbd-38e99acaa26b\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/search?q=0xf3f496c9486be5924a93d67e98298733bb47057c&amp;src=typed_query\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://x.com/search?q=0xf3f496c9486be5924a93d67e98298733bb47057c&amp;src=typed_query\"><em>Lookonchain</em></a></p></figcaption></figure><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/hyperliquid-ups-margin-rules-4m-liquidation-loss\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/hyperliquid-ups-margin-rules-4m-liquidation-loss\"><em><strong>Hyperliquid
    ups margin requirements after $4 million liquidation loss</strong></em></a></p><h2>Massive
    trading gains</h2><p>On March 12, the unidentified trader intentionally liquidated
    a roughly $200 million ETH long position, causing Hyperliquid&rsquo;s liquidity
    pool, HLP, <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/hyperliquid-ups-margin-rules-4m-liquidation-loss\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/hyperliquid-ups-margin-rules-4m-liquidation-loss\">to
    lose $4 million</a>.&nbsp;The trader&rsquo;s profits topped roughly $1.8 million.
    </p><p>According to Lookonchain, the trader has earned nearly $17 million in the
    past month on Hyperliquid.&nbsp;</p><p>The incident highlighted the challenges
    facing perpetual trading platforms such as Hyperliquid, which enable traders to
    take long or short positions many times larger than their deposited capital.</p><p>Hyperliquid
    said the trader&rsquo;s actions did not qualify as an exploit and were instead
    a predictable consequence of the mechanics of its trading platform under extreme
    conditions.&nbsp;</p><p>In response to the losses, Hyperliquid announced on March
    13 <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/hyperliquid-ups-margin-rules-4m-liquidation-loss\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">revised collateral rules</a>
    for traders with open positions to guard against similar edge cases in the future.&nbsp;</p><p>Launched
    in 2024, Hyperliquid&rsquo;s flagship perpetuals exchange has captured 70% of
    the market share, surpassing rivals such as GMX and dYdX, according to a January
    report by asset manager VanEck.&nbsp;</p><p>Chainlink, the most popular decentralized
    oracle service, saw the price of its native LINK token increase by more than 150%
    in the weeks after President Donald Trump prevailed in the US election.&nbsp;</p><p>It
    has since given up much of those gains, declining from highs of nearly $30 per
    token in December to less than $14 as of March 14, according to <a data-ct-non-breakable=\"null\"
    href=\"https://www.coingecko.com/en/coins/chainlink\" rel=\"nofollow noopener\"
    target=\"_blank\" text=\"null\" title=\"https://www.coingecko.com/en/coins/chainlink\">data</a>
    from CoinGecko.&nbsp;</p><p>Chainlink&rsquo;s market capitalization is currently
    around $8.7 billion.&nbsp;</p><p><em><strong>Magazine: </strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/magazine/victims-ftx-hong-kong-civil-suit-gemini-singapore-express/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>&lsquo;Hong
    Kong&rsquo;s FTX&rsquo; victims win lawsuit, bankers bash stablecoins: Asia Express</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"defi_newsletter\" label=\"Subscription
    Form: DeFi Newsletter\"></template></p>\n</p>\n            "
  published: 2025-03-14 21:45:00 UTC
- title: " XRP flips Ether’s FDV amid change in market dynamics "
  url: https://cointelegraph.com/news/xrp-flips-ether-fdv-change-market-dynamics?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTk1YTQtYTFiOS03YmY5LTkzMDktNDhjODVkZjZkMmJk.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTk1YTQtYTFiOS03YmY5LTkzMDktNDhjODVkZjZkMmJk.jpg\"
    alt=\"XRP flips Ether’s FDV amid change in market dynamics\"></p><p>XRP&rsquo;s
    fully diluted valuation (FDV) has surpassed Ether (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/ethereum-price\" rel=\"\" target=\"_self\" text=\"null\"
    title=\"https://cointelegraph.com/ethereum-price\">ETH</a>), according to March
    14 data from CoinGecko.&nbsp;<p>The FDV flip signifies a reversal of fortune for
    both layer-1 (L1) blockchain networks behind the tokens, as XRP Ledger&rsquo;s
    decentralized finance (DeFi) ecosystem gains traction and Ethereum grapples with
    competition from rival L1s, such as Solana.</p><p>As of March 14, XRP&rsquo;s
    FDV stood at nearly $235 billion, more than $1 billion higher than Ether&rsquo;s,
    according to CoinGecko. Ether&rsquo;s market capitalization still leads at $233
    billion versus XRP&rsquo;s $136 billion, the data shows.&nbsp;</p><p>FDV measures
    the cumulative value of all existing tokens, whereas market capitalization only
    counts tokens already in circulation.&nbsp;</p><p>XRP&rsquo;s developer, Ripple
    Labs, holds a multibillion-dollar allocation of its chain&rsquo;s native token.&nbsp;</p><figure><img
    alt=\"XRP flips Ether&rsquo;s FDV amid change in market dynamics\" src=\"https://s3.cointelegraph.com/uploads/2025-03/019595f3-c522-7bac-a216-cbe414572c9d\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Cryptocurrencies by
    FDV. Source: </em><a data-ct-non-breakable=\"null\" href=\"https://www.coingecko.com/\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://www.coingecko.com/\"><em>CoinGecko</em></a></p></figcaption></figure><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/xrp-ledger-unveils-institutional-defi-roadmap\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/xrp-ledger-unveils-institutional-defi-roadmap\"><em><strong>XRP
    Ledger unveils institutional DeFi roadmap</strong></em></a></p><h2>Changing fortunes</h2><p>XRP&rsquo;s
    price has risen by more than 300%, to around $2.3 per token, since President Donald
    Trump prevailed in the US elections on Nov. 5.&nbsp;</p><p>Trump said he wants
    America to become the &ldquo;world&rsquo;s crypto capital&rdquo; and has appointed
    industry-friendly leadership to key regulators.&nbsp;</p><p>The thawing US regulatory
    environment is especially beneficial for XRP, which prioritizes enterprise users
    and <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/xrp-ledger-unveils-institutional-defi-roadmap\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/xrp-ledger-unveils-institutional-defi-roadmap\">unveiled
    an institutional DeFi roadmap</a> in February.</p><p>As of January, XRP&rsquo;s
    native decentralized exchange (DEX) has <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/xrp-dex-clocking-17-m-volume-daily-ceo\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/xrp-dex-clocking-17-m-volume-daily-ceo\">handled
    more than $1 billion in swap transactions</a> since launching in 2024.</p><p>The
    XRP token saw further support when Trump said he planned to include XRP in a proposed
    US Digital Asset Stockpile alongside other cryptocurrencies, such as Solana (<a
    data-ct-non-breakable=\"null\" href=\"/solana-price-index\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">SOL</a>) and Cardano (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/ada-price-index\" rel=\"\" target=\"_self\" text=\"null\"
    title=\"https://cointelegraph.com/ada-price-index\">ADA</a>).&nbsp;</p><p>The
    stockpile will only comprise assets <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/us-bitcoin-reserve-ups-volatility-futures-recoil\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/us-bitcoin-reserve-ups-volatility-futures-recoil\">acquired
    by law enforcement and other legal proceedings</a> and will not buy crypto.&nbsp;</p><p>The
    US Securities and Exchange Commission is <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/sec-enforcement-case-ripple-labs-ending\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/sec-enforcement-case-ripple-labs-ending\">reportedly
    &ldquo;in the process of wrapping up&rdquo;</a> an enforcement action against
    Ripple that has beleaguered the XRP developer since 2020.&nbsp;</p><p>The regulator
    has already dropped actions against crypto firms such as Coinbase, Kraken and
    Uniswap.</p><p>Meanwhile, Ether&rsquo;s spot price has struggled since March 2024,
    when the network&rsquo;s Dencun upgrade cut transaction fees by approximately
    95%.&nbsp;</p><p>As of March, trading volume on Solana, which prioritizes fast
    transaction execution and was central to 2024&rsquo;s memecoin frenzy, <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/solana-dex-volumes-still-rival-ethereum-s-despite-memecoin-meltdown-van-eck\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/solana-dex-volumes-still-rival-ethereum-s-despite-memecoin-meltdown-van-eck\">rivals
    that of Ethereum</a> and all of its layer-2 scaling chains combined.&nbsp;</p><p><em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/victims-ftx-hong-kong-civil-suit-gemini-singapore-express/\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/magazine/victims-ftx-hong-kong-civil-suit-gemini-singapore-express/\"><em><strong>&lsquo;Hong
    Kong&rsquo;s FTX&rsquo; victims win lawsuit, bankers bash stablecoins: Asia Express</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"defi_newsletter\" label=\"Subscription
    Form: DeFi Newsletter\"></template></p>\n</p>\n            "

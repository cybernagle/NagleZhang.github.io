- title: " Worst crypto cycle ever? Community and history say otherwise "
  url: https://cointelegraph.com/news/worst-crypto-cycle-community-history-bitcoin-price?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTk0MWQtZGVjZi03MzVmLTk2NDItMGFiZGMyODk0MzYy.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTk0MWQtZGVjZi03MzVmLTk2NDItMGFiZGMyODk0MzYy.jpg\"
    alt=\"Worst crypto cycle ever? Community and history say otherwise\"></p><p>The
    cryptocurrency market has faced a significant downturn since the start of 2025,
    with some investors calling it the most painful cycle in history.<p>Some were
    <a data-ct-non-breakable=\"null\" href=\"https://x.com/SenseiBR_btc/status/1896630767415132376\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">disappointed</a> about
    industry policy changes and the <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/trump-meme-craze-solana-addresses-all-time-high\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">memecoin craze</a> in
    the United States, while others even <a data-ct-non-breakable=\"null\" href=\"https://x.com/Dynamo_Patrick/status/1896737848356979168\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">speculated</a> about
    talent leaving the sector for other industries.</p><p>However, while the current
    crypto market state might look grim to some, the current cycle is far from being
    the most brutal on record, and many community members remain bullish.</p><figure><img
    alt=\"Worst crypto cycle ever? Community and history say otherwise\" src=\"https://s3.cointelegraph.com/uploads/2025-03/019594bc-44a9-734f-8cb8-a62267ffc312\"
    title=\"\"><figcaption style=\"text-align: center;\"></figcaption></figure><p>&ldquo;For
    those who have been through multiple cycles, this is just part of the process,&rdquo;
    Trezor analyst Lucien Bourdon told Cointelegraph.</p><h2>The post-Trump inauguration
    sale</h2><p>The current decline in crypto markets came after Bitcoin (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/bitcoin-price\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">BTC</a>) reached an all-time high above $106,000
    in December 2024, with the spike largely&nbsp;<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-price-hits-100-000-first-time-new-all-time-high\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">attributed to optimism</a>&nbsp;around
    Donald Trump&rsquo;s victory in the US presidential election.</p><p>While many
    were optimistic, some investors, such as BitMEX co-founder Arthur Hayes, accurately
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/arthur-hayes-crypto-crash-donald-trump-inauguration\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">predicted a crypto sell-off</a>
    following Trump&rsquo;s inauguration on Jan. 20.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/019594bc-487d-7551-80ff-1c0b4ffcbddb\"
    title=\"\" alt=\"Worst crypto cycle ever? Community and history say otherwise\"><figcaption
    style=\"text-align: center;\"><p><em>Bitcoin price chart since October 2024. Source:
    CoinGecko</em></p></figcaption></figure><p>Since then, Bitcoin has tumbled more
    than 18%, with the total crypto market capitalization <a data-ct-non-breakable=\"null\"
    href=\"https://www.coingecko.com/en/global-charts\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">erasing</a> almost all gains that came from Trump&rsquo;s
    election win, dropping 25%.</p><p>In the post-Trump inauguration sale, investors
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/crypto-etps-4th-consecutive-outflows-at-876m-coin-shares\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">offloaded about $4.6
    billion</a> from crypto exchange-traded products by March 7, while the spot market
    saw even more outflows, with at least <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/tariff-turmoil-sparks-1-billion-liquidations-coinglass\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">$1 billion in liquidations</a>
    in a single day on March 3.</p><h2>What was the most brutal crypto sell-off in
    history?</h2><p>But the most recent <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/a-brief-history-of-bitcoin-crashes-and-bear-markets-2009-2022\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">sell-off is not the
    worst on record</a>. &ldquo;If we&rsquo;re talking about the worst Bitcoin cycle,
    2014&ndash;2015 was possibly the most brutal,&rdquo; Trezor&rsquo;s Bourdon told
    Cointelegraph.</p><p>Referring to the collapse of the Mt. Gox crypto exchange,
    which <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-mt-gox-repayment-date-looming-is-bitcoin-in-trouble\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">suffered an 850,000
    BTC loss</a> in a security breach in 2024, the analyst highlighted the event as
    the worst Bitcoin sell-off on record.&nbsp;</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/019594bc-4b04-7d2c-b9dd-667d7ced3852\"
    title=\"\" alt=\"Worst crypto cycle ever? Community and history say otherwise\"><figcaption
    style=\"text-align: center;\"><p><em>Bitcoin price chart in the period from July
    2013 to July 2016. Source: CoinGecko</em></p></figcaption></figure><p>&ldquo;The
    Mt. Gox collapse wiped out 70% of Bitcoin&rsquo;s trading volume, leading to an
    85% drawdown in a market with no institutional support and far less liquidity,&rdquo;
    Bourdon said.</p><h2>More than just falling prices</h2><p>According to Brett Reeves,
    head of BitGo&rsquo;s European sales, there is a &ldquo;great deal more to just
    falling pieces&rdquo; in the current market.</p><p>In addition to bigger price
    downturns in the past, Reeves highlighted notable advancements in global crypto
    products and regulation, which point to crypto assets increasingly becoming integral
    to the international financial system. He said:</p><blockquote>&ldquo;While prices
    may be crashing for now, we must remember how far we&rsquo;ve come in a short
    space in time and just how much potential this space has in the years ahead.&rdquo;</blockquote><p>Contrary
    to crypto doubters and pessimists, some industry executives even see the current
    market cycle as a bull market.</p><p><em><strong>Related: </strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/eu-retaliatory-tariffs-bitcoin-price-uncertainty-trade-tensions\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>EU retaliatory
    tariffs threaten Bitcoin correction to $75K &mdash; Analysts</strong></em></a></p><p>&ldquo;I
    actually think it&rsquo;s the best,&rdquo; Quantum Economics founder Mati Greenspan
    told Cointelegraph, adding:</p><blockquote>&ldquo;What sets this bull market apart
    from previous crypto bull runs is that it&rsquo;s the first time we&rsquo;ve seen
    prices rising over time that is not accompanied by copious money printing. This
    pullback is a short-term pain that will enable long-term gain.&rdquo;</blockquote><p>According
    to crypto analyst Miles Deutscher, terms like &ldquo;bull market,&rdquo; &ldquo;bear
    market,&rdquo; &ldquo;cycle,&rdquo; or &ldquo;altseason&rdquo; are not even suitable
    for the current market situation.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/019594bc-4def-79bd-bc72-766f32b4d1a9\"
    title=\"\" alt=\"Worst crypto cycle ever? Community and history say otherwise\"><figcaption
    style=\"text-align: center;\"><p><em>Source: Miles Deutscher</em></p></figcaption></figure><p>&ldquo;This
    is a different market now,&rdquo; he <a data-ct-non-breakable=\"null\" href=\"https://x.com/milesdeutscher/status/1900186648010514635\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">said</a> in an X post
    on March 13.</p><p><em><strong>Magazine: </strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/magazine/trump-biden-bet-polymarket-nft-obsession-batsoupyum-nft-collector/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Trump-Biden
    bet led to obsession with &lsquo;idiotic&rsquo; NFTs &mdash;Batsoupyum, NFT Collector</strong></em></a><br></p><template
    data-name=\"subscription_form\" data-type=\"markets_outlook\" label=\"Subscription
    Form: Markets Outlook\"></template></p>\n</p>\n            "

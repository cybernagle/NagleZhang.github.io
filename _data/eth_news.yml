- title: " Standard Chartered predicts BNB will more than double in 2025 "
  url: https://cointelegraph.com/news/standard-chartered-forecasts-bnb-price-more-than-doubling-this-year?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Asset manager Standard Chartered predicts that Binance’s ecosystem token,
    BNB, could more than double in price this year, according to an analyst report
    reviewed by Cointelegraph. The asset manager sees BNB’s price rising to approximately
    $1,275 per token by the end of 2025 and as high as $2,775 by the end of 2028,
    according to the research report. As of May 6, BNB trades at nearly $600 per coin,
    for a fully diluted value (FDV) of approximately $84 billion, according to data
    from CoinMarketCap.Price forecasts for BNB. Source: Standard Chartered“BNB has
    traded almost exactly in line with an unweighted basket of Bitcoin and Ethereum
    since May 2021 in terms of both returns and volatility,” Geoff Kendrick, an analyst
    at Standard Chartered, wrote in the research note. “We expect this relationship
    to continue to hold, driving BNB’s price from around USD 600 currently to USD
    2,775 by end-2028.”Related: How much Bitcoin can Berkshire Hathaway buy?“Old-fashioned”
    networkThe BNB token is the native cryptocurrency of Binance BNB Chain, a layer-1
    (L1) blockchain network affiliated with the world’s largest centralized exchange
    (CEX). The BNB Chain has less developer activity than L1s such as Ethereum or
    Avalanche, and its ecosystem is comparatively “old-fashioned,” Standard Chartered
    said. BNB’s ecosystem is heavy on DEXs. Source: Standard CharteredMore than 60%
    of the network’s onchain economic activity involves decentralized exchanges (DEXs),
    compared to a more diverse spread on other L1s, it said.However, the asset manager
    noted that this could also serve as a source of stability for BNB Chain. “Assuming
    Binance remains one of the largest CEXs, BNB’s value drivers are unlikely to change
    anytime soon,” Geoff Kendrick, an analyst at Standard Chartered, wrote in the
    research note. “Given this, we see potential for BNB to serve as a form of benchmark,
    or average, for digital asset prices more broadly,” he added. BNB Chain is the
    fourth-largest L1, with nearly $6 million total value locked (TVL), according
    to data from DeFiLlama.On May 5, asset manager VanEck filed to list the first
    BNB exchange-traded fund (ETF) in the United States.Magazine: Financial nihilism
    in crypto is over — It’s time to dream big again\n\n            "

    move to $98 and then to $80.On the upside, a break and close above the 20-day
    EMA suggests that the selling pressure is reducing. The pair could rally to the
    50-day SMA ($178), where the bears are expected to mount a strong defense.Cardano
    price analysisCardano (ADA) was rejected from the 20-day EMA ($0.77) on March
    12, signaling that the bears are selling on rallies.ADA/USDT daily chart. Source:
    Cointelegraph/TradingViewThe ADA/USDT pair could drop to the uptrend line, which

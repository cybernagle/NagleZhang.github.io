    purchase has boosted the firm's haul to 568,840 Bitcoin.What are the crucial support
    levels to watch out for in Bitcoin and altcoins? Let’s analyze the charts of the
    top 10 cryptocurrencies to find out.S&P 500 Index price predictionThe S&P 500
    Index gapped up sharply on May 12 and rose above the stiff overhead resistance
    at 5,800.SPX daily chart. Source: Cointelegraph/TradingViewTime is running out
    for the bears. If they want to prevent the upside, they will have to fiercely
    defend the 5,800 level and quickly drag the price below the 20-day exponential
    moving average (5,570). If they manage to do that, the index could start a deeper
    correction toward 5,400.Instead, if the price closes above 5,800, the up move
    may continue toward the 6,000 level. There could be a minor halt at 6,000, but
    if the bulls prevail, the index could retest the all-time high at 6,147.US Dollar
    Index price predictionThe US Dollar Index pierced the 20-day EMA (100.42) on May
    8, indicating that the bears are losing their grip.DXY daily chart. Source: Cointelegraph/TradingViewSellers
    tried to pull the price back below the 20-day EMA on May 9, but the bulls held
    their ground. The index has reached the 50-day simple moving average (102.08),
    which is expected to behave as a resistance. If the price turns down from the
    50-day SMA but finds support at the 20-day EMA, it suggests a positive sentiment.
    That increases the likelihood of a rally to 103.54 and thereafter to 104.68.Bitcoin
    price predictionBitcoin has turned down from $105,819, indicating that the bears
    are defending the $107,000 to $109,588 zone.BTC/USDT daily chart. Source: Cointelegraph/TradingViewThe
    first support on the downside is the $100,000 level, and below that, the 20-day
    EMA ($97,238). If the price rebounds off the support zone, the bulls will again
    try to kick the BTC/USDT pair above $109,588. If they can pull it off, the pair
    could ascend to $130,000.Conversely, if the price turns down and breaks below
    the 20-day EMA, it signals that buyers are booking profits at higher levels. That
    opens the doors for a fall to $93,000 and then to the 50-day SMA ($89,302).Ether
    price predictionEther (ETH) bulls are trying to sustain the price above $2,550,
    but the bears have kept up the selling pressure.ETH/USDT daily chart. Source:
    Cointelegraph/TradingViewIf the price skids below $2,435, the ETH/USDT pair may
    fall to $2,320. If the price rebounds off $2,320, the bulls will try to resume
    the up move. There is resistance at $2,850, but if it is crossed, the pair could
    reach $3,000.Contrary to this assumption, if the price turns down and breaks below
    $2,320, it suggests that the bulls are booking profits. The pair may drop to the
    breakout level of $2,111, which is likely to act as support.XRP price predictionXRP
    (XRP) broke above the resistance line on May 10, and the bulls successfully held
    the retest of the breakout level on May 11.XRP/USDT daily chart. Source: Cointelegraph/TradingViewThe
    bulls have strengthened their position by pushing the price above the $2.50 resistance.
    There is minor resistance at $2.65, but if the level is scaled, the rally could
    reach $3. Such a move signals a potential trend change.Alternatively, if the price
    turns down sharply from $2.65 and breaks below the 20-day EMA ($2.27), it signals
    a possible range formation in the near term. The XRP/USDT pair could swing between
    $2 and $2.65 for some time.BNB price predictionBNB (BNB) turned down from $679
    on May 10 but rebounded off the breakout level of $644 on May 12.BNB/USDT daily
    chart. Source: Cointelegraph/TradingViewBuyers tried to resume the up move, but
    the long wick on the candlestick shows selling near the $700 level. If the price
    stays above $644, the bulls will make another attempt to propel the BNB/USDT pair
    to $745.Sellers will have to pull the price below $644 to weaken the bulls. The
    pair could then fall to the 20-day EMA ($621). Buyers are expected to defend the
    20-day EMA because a break below it could tilt the advantage in favor of the bears.Solana
    price predictionSolana’s (SOL) up move has stalled near the $180 resistance, but
    a positive sign is that the bulls have not given up much ground to the bears. SOL/USDT

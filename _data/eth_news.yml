- title: " Price predictions 4/23: BTC, ETH, XRP, BNB, SOL, DOGE, ADA, LINK, AVAX,
    SUI "
  url: https://cointelegraph.com/news/price-predictions-4-23-btc-eth-xrp-bnb-sol-doge-ada-link-avax-sui?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Key points:Bitcoin’s rally is backed by solid institutional buying in
    the spot BTC ETFs.A rally above the $95,000 level could be difficult, but analysts’
    end-of-year price projections now extend to $200,000.Select altcoins are showing
    signs of a price bottom.Bitcoin (BTC) price rallied close to the $95,000 resistance
    level on April 23 as the cryptocurrency finds support from rising spot BTC ETF
    inflows and positive macroeconomic news in the United States. According to Farside
    Investors, the funds recorded net inflows of $381.3 million on April 21 and $912.7
    million on April 22.Analysts from Standard Chartered and Intellectia AI said that
    institutional demand for Bitcoin ETFs and BTC’s use as a hedge against macroeconomic
    risk could propel the price to $200,000 in 2025.Crypto market data daily view.
    Source: Coin360Not everyone is convinced about the current rally. 10x Research
    head of research Markus Thielen questioned the sustainability of the Bitcoin rally
    in an April 23 markets report, as the stablecoin minting indicator was “yet to
    return to high-activity levels.”Could Bitcoin break above the $95,000 mark, pulling
    altcoins higher? Let’s analyze the charts of the top 10 cryptocurrencies to find
    out.Bitcoin price predictionBitcoin formed a Doji candlestick pattern on April
    23, indicating indecision between the bulls and the bears near the $95,000 overhead
    resistance.BTC/USDT daily chart. Source: Cointelegraph/TradingViewThe 20-day exponential

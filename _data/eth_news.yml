- title: " Massive Bitcoin whale buys $200M in BTC, another wakes up after 8 years "
  url: https://cointelegraph.com/news/billionaire-btc-whale-adds-to-stash-amid-other-whale-activity?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "A massive Bitcoin whale wallet holding has just added $200 million worth
    of Bitcoin to its position after selling over 11,400 Bitcoin over the last few
    months — coinciding with a recent rebound for the original cryptocurrency. The
    Bitcoin (BTC) whale added 2,400 Bitcoin — worth over $200 million — to their stash
    on March 24, blockchain analytics firm Arkham Intelligence said in an X post.Data
    shared by the firm shows that despite some sales in February, after the latest
    purchase, the whale holds over 15,000 Bitcoin in its wallet, worth over $1.3 billion,
    at current prices. “A $1 billion Bitcoin Whale just withdrew $200 million of Bitcoin
    this morning from Binance,” Arkham said.The whale started acquiring Bitcoin five
    days ago after selling off its stash when Bitcoin’s price was between $100,000
    and $86,000 in February. CoinGeck data shows on Feb. 1, Bitcoin was worth over
    $104,000, but it steadily declined to hit a low of $78,940 on Feb. 28. Source:
    Arkham IntelligenceThe whale movement comes amid a recent Bitcoin price rebound. Bitcoin
    has been trading $81,000 and $88,000 in the last seven days, according to CoinGecko,
    with a price surge of 3% on March 24, distancing itself from its $76,900 low on
    March 11.Bitcoin whale wakes from slumber At the same time, another Bitcoin whale
    has woken up after eight years of dormancy, moving over 3,000 Bitcoin, worth $250
    million, in one transaction on March 22.“His Bitcoin stack went from $3M in early
    2017 to over $250M today  — and he’s held Bitcoin on one address for over 8 years,”
    Arkham said in a March 22 X post. Another huge Bitcoin holder, BlackRock, the
    world’s largest asset manager with approximately $11.6 trillion in assets under
    management, has been steadily accumulating more Bitcoin over the last week as
    well, according to Arkham.Across 15 transactions, the asset manager bought an
    extra 4,054 Bitcoin, giving it a total stash of 573,878, worth over $50 billion,
    data on Bitbo’s Bitcoin treasury tracker shows. BlackRock’s iShares Bitcoin Trust
    (IBIT) also led a rally of spot Bitcoin exchange-traded funds (ETFs) in the US,
    snapping a five-week net outflow streak by clocking a net inflow of $744.4 million. The
    bulk of net inflows came from BlackRock’s iShares, which recorded $537.5 million,
    followed by Fidelity’s Wise Origin Bitcoin Fund (FBTC) with $136.5 million.Bitcoin
    whales weren’t the only ones accumulating more crypto. Lookonchain used Arkham
    data to track a lone Ether whale who added 7,074 Ether (ETH) to its stash on March
    21, worth $13.8 million.Source: LookonchainEther has been moving between $1,876
    and $2,097 in the last seven days, CoinGecko data shows. It’s still down over
    57% from its all-time high of $4,878, which it hit in November 2021.However, its
    open interest surged to a new all-time high on March 21, and the number of addresses
    with at least $100,000 worth of Ether started rising at the beginning of March,
    from just over 70,000 addresses on March 10 to over 75,000 on March 22.Magazine:
    Crypto fans are obsessed with longevity and biohacking: Here’s why\n\n            "
  published: 2025-03-25 03:18:31.000000000 +00:00
- title: " BNB Chain launches $100M liquidity program "
  url: https://cointelegraph.com/news/bnb-chain-launches-100m-liquidity-program?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "BNB Chain (BNB) has launched a $100 million program designed to bootstrap
    liquidity for its native projects on centralized exchanges (CEXs).The network
    is allocating $100 million in incentives, primarily in the form of its native
    BNB tokens, to projects that successfully list on any of 11 major CEXs specified
    by BNB Chain, according to a March 24 announcement.The program aims to “further
    enhance BNB Chain’s ecosystem liquidity and foster project growth by incentivizing
    exchanges to list native BNB Chain tokens,” the chain said in the statement. BNB
    Chain previously launched two smaller liquidity incentive programs, allocating
    two tranches of $4.4 million in February and March to incentivize CEX listings
    for memecoins and other ecosystem projects. Rewards vary based on the prominence
    of the exchange listing. Source: BNB ChainThe network’s latest liquidity incentive
    program will be executed on a first-come, first-served basis and will initially
    run for a three-month trial period, it said. Only projects with at least a $5
    million market capitalization and $1 million in daily trading volume are eligible,
    among other criteria, BNB Chain said. The largest rewards — $500,000 in permanent
    liquidity — are reserved for projects that list on major CEXs such as Binance
    and Coinbase, it said.In some cases, rewards will be limited to non-withdrawable
    BNB token liquidity and in others, they will also include purchases of project
    tokens to create two-sided liquidity, according to BNB Chain.Chains by TVL. Source:
    DeFILlamaRelated: Binance CEO reiterates denial of Trump family deal talksLagging
    competitorsBNB Chain has a total value locked (TVL) of approximately $5.4 billion,
    according to data from DefiLlama. It ranks fourth among blockchain networks in
    TVL, lagging behind leading smart contract platforms Ethereum and Solana, with
    TVLs of about $46 billion and $7 billion, respectively, according to DefiLlama. BNB
    Chain is affiliated with Binance, the world’s largest cryptocurrency exchange. In
    March, The Wall Street Journal reported that entities affiliated with US President
    Donald Trump were in talks to buy Binance.US, an independently-operated US crypto
    exchange.Former Binance CEO Changpeng “CZ” Zhao has denied many of the reports’
    claims, including any suggestion that a deal was contingent on Trump pardoning
    Zhao following his conviction on charges of violating the Bank Secrecy Act. In
    2023, Binance agreed to pay a $4.3 billion penalty and for Zhao to plead guilty
    to one count of violating the Bank Secrecy Act for shortcomings in Binance’s Anti-Money
    Laundering program.Magazine: Trump’s crypto ventures raise conflict of interest,
    insider trading questions\n\n            "
  published: 2025-03-24 20:43:28.000000000 +00:00
- title: " DeFi lender Nostra pauses borrowing after price feed error "
  url: https://cointelegraph.com/news/lending-protocol-nostra-reports-critical-price-feed-issue?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Nostra, a lending protocol on Starknet, has paused borrowing for two liquid
    staking tokens after identifying a “critical issue” with its price feeds, the
    decentralized finance (DeFi) protocol said. On March 24, errors in Nostra’s price
    feed inflated the reported prices of xSTRK and sSTRK — two liquid staking derivatives
    of Starknet’s native STRK token — to approximately three times the tokens’ actual
    value, Nostra said in a post on the X platform.According to Nostra, “[s]uch an
    inflated price feed could have caused unnecessary liquidations of otherwise safe
    positions, resulting in users with healthy positions getting liquidated.” In response,
    the DeFi protocol has disabled any further borrowing against xSTRK and sSTRK collateral
    deposits, Nostra said. Nostra has also recommended that users with existing xSTRK
    and sSTRK deposits withdraw the collateral immediately. “Since we don’t have a
    secondary (fallback) oracle to support these assets, as none are available, we
    are unable to fully prevent similar events from occurring in the future,” Nostra
    added.“Our priority has always been and continues to be to keep existing user
    funds safe and with no fallback oracle, the risks outweigh the benefits,” it said. Nostra’s
    collateral token options. Source: NostraRelated: Starknet to settle on Bitcoin
    and Ethereum to unify the chainsStarknet DeFi protocolStarknet is a layer-2 scaling
    chain of Ethereum secured using zero-knowledge (ZK) proofs. It launched its mainnet
    in late 2021, according to Messari.It has a total value locked (TVL) of approximately
    $575 million, according to data from L2Beat. Lending protocol Nostra is among
    the larger DeFi projects operating on the chain. It has a TVL of approximately
    $55 million, according to its website. On Nostra, users post collateral in one
    token to borrow in another token. The DeFi protocol’s most popular collateral
    tokens are Ether, STRK, and stablecoins USDC (USDC) and Tether (USDT). Starknet
    designed STRK to be staked in exchange for a portion of the network’s fee revenues,
    according to its documentation.xSTRK and sSTRK are liquid staking tokens issued
    by independent DeFi protocols Endur and Nimbura, respectively. Magazine: What
    are native rollups? Full guide to Ethereum’s latest innovation\n\n            "

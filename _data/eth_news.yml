- title: " New York bill proposes legalizing Bitcoin, crypto for state payments "
  url: https://cointelegraph.com/news/new-york-bill-legalize-bitcoin-crypto-payments?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "A New York lawmaker has introduced legislation that would allow state
    agencies to accept cryptocurrency payments, signaling growing political momentum
    for digital asset integration in public services.Assembly Bill A7788, introduced
    by Assemblyman Clyde Vanel, seeks to amend state financial law to allow New York
    state agencies to accept cryptocurrencies as a form of payment.It would permit
    state agencies to accept payments in Bitcoin (BTC), Ether (ETH), Litecoin (LTC)
    and Bitcoin Cash (BCH), according to the bill’s text.Source: Nysenate.govAccording
    to the bill, state offices could authorize crypto payments for “fines, civil penalties,
    rent, rates, taxes, fees, charges, revenue, financial obligations or other amounts,”
    as well as penalties, special assessments and interest.Related: Trump’s tariff
    escalation exposes ‘deeper fractures’ in global financial systemCryptocurrency
    legislation is becoming a focal point in New York, with Bill A7788 marking the
    state’s second crypto-focused legislation in a little over a month.In March, New
    York introduced Bill A06515, aiming to establish criminal penalties to prevent
    cryptocurrency fraud and protect investors from rug pulls.Crypto-focused legislation
    has gathered momentum since President Donald Trump took office on Jan. 20, with
    Trump signaling during his campaign that his administration intends to make crypto
    policy a national priority, as well as making the US a global hub for blockchain
    innovation.Related: Illinois Senate passes crypto bill to fight fraud and rug
    pullsNew York may mandate state “service fee” on crypto paymentsIf passed, the
    bill would mark a significant shift in how New York handles digital assets. It
    would allow state entities to integrate cryptocurrency into the payment infrastructure
    used for collecting public funds.The proposal also includes a clause allowing
    the state to impose a service fee on those choosing to pay with crypto. According
    to the text, the state may require “a service fee not exceeding costs incurred
    by the state in connection with the cryptocurrency payment transaction.” This
    could include transaction costs or fees owed to crypto issuers.Assembly Bill A7788
    has been referred to the Assembly Committee for review and may advance to the
    state Senate as the next step.New York’s legislation comes shortly after the state
    of Illinois passed a crypto bill to fight fraud and rug pulls after the recent
    wave of insider schemes related to memecoins, Cointelegraph reported on April
    11.Magazine: XRP win leaves Ripple and industry with no crypto legal precedent
    set\n\n            "

- title: " Crypto donations top $1B in 2024, gain traction after Myanmar, Thailand
    quake "
  url: https://cointelegraph.com/news/cz-donates-1000-bnb-thailand-myanmar-earthquake-relief?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Binance co-founder Changpeng “CZ” Zhao donated over half a million dollars
    worth of crypto to the earthquake disaster relief effort in Thailand and Myanmar,
    in another testament to the growing utility of blockchain-based emergency charity
    efforts.Zhao donated 1,000 BNB (BNB) tokens worth almost $600,000 to the disaster
    relief funds for the region on March 3, blockchain data shows.Zhao donates 1,000
    BNB. Source: BscScan“Sent 1000 BNB for the donation for Myanmar and Thailand,”
    wrote Zhao in an April 3 X post.The crypto donation comes after Thailand and Myanmar
    were hit by a 7.7 magnitude earthquake on March 28, causing severe damage to buildings
    and widespread flooding.Related: 70% chance of crypto bottoming before June amid
    trade fears: NansenAt least 2,719 people have been confirmed dead in Myanmar and
    18 in Thailand, with 76 people still unaccounted for, according to the latest
    figures shared by Reuters.The $600,000 donation comes nearly a week after Zhao
    pledged to donate 500 BNB for the relief efforts, an initial commitment that he
    doubled. Cryptocurrency-based donations have emerged as a significant lifeline
    for the region, due to banking restrictions caused by damaged infrastructure.Source:
    The Giving BlockCrypto donations exceeded $1 billion in 2024, spurred by increasing
    digital asset valuations and growing crypto regulatory clarity. About 16% of the
    donations went toward education, while 14% went toward medicine and health-related
    efforts.The Giving Block has launched a crypto-based emergency relief effort for
    Myanmar and Thailand to raise $500,000 for the devastated region.Source: TheGivingBlockThe
    organization expects crypto donations to reach $2.5 billion in 2025 on growing
    crypto wealth generation and increasing adoption due to a more favorable political
    landscape.Related: Trump-linked crypto ventures may complicate US stablecoin policyCrypto
    donations gain traction for emergency relief effortsZhao’s donation is a testament
    to the growing role of cryptocurrency in humanitarian aid, according to Anndy
    Lian, author and intergovernmental blockchain expert.“Crypto donations, compared
    to traditional fiat contributions, offer unique advantages, especially in emergencies,”
    Lian told Cointelegraph, adding:“Speed is a key factor—transactions on blockchain
    networks can settle in minutes, bypassing the delays of banks or intermediaries,
    which is critical when time saves lives.”“In disaster-stricken areas like Myanmar
    or Thailand, where infrastructure might be compromised, crypto can reach recipients
    directly via digital wallets, no SWIFT codes or wire transfers required,” Lian
    explained.Source: Anndy LianLian also donated 44 BNB tokens to the relief efforts
    in Myanmar and Thailand, a move that was publicly praised by Zhao.Ethereum co-founder
    Vitalik Buterin has been known for his crypto donations. In October, Buterin donated
    over $180,000 in Ether (ETH) to the biotech charity Kanro.Magazine: GUN token’s
    $69M milestone, Pudgy Penguins go to LOL Land: Web3 Gamer\n\n            "

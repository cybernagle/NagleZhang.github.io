- title: " Wallet in Telegram to list 50 tokens and launch yield program "
  url: https://cointelegraph.com/news/wallet-in-telegram-50-tokens-eth-xrp-earn-program?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Update (March 14, 9:40 am UTC: This article has been updated to add information
    on Wallet in Telegram’s new on-ramp features.Wallet in Telegram, a third-party
    cryptocurrency wallet Mini App on Telegram, is set to expand its custodial crypto
    services, adding at least 50 new cryptocurrencies and launching an earn feature
    for users.The Open Platform (TOP), the largest venture builder in The Open Network
    (TON) ecosystem, which manages Wallet in Telegram as one of its portfolio businesses,
    announced the rollout of the next wallet generation on March 13, introducing a
    wide range of new features.With the rollout, Wallet in Telegram will add at least
    50 new crypto assets, including major cryptocurrencies Ether (ETH) and XRP (XRP),
    as well as memecoins like Dogecoin (DOGE) and Pepe (PEPE), a spokesperson for
    Wallet told Cointelegraph.Source: Wallet in TelegramWallet’s new generation is
    set to be rolled out within the next two months and will also introduce an “Earn”
    feature, which will allow users to gain yields on assets including Tether’s USDt
    (USDT).Initial rollout limited to in-app transactionsInitially, Wallet users will
    be able to buy, sell and hold non-TON tokens without onchain deposits or withdrawals,
    meaning altcoin transactions to other wallets and exchanges will not be allowed.“The
    current stage of the rollout is only available for in-app transactions for non-TON
    tokens,” Wallet’s spokesperson said, adding that the altcoin option is only available
    for trading within the custodial wallet. The spokesperson added:“We focus primarily
    on the TON Ecosystem and maintain a full range of operations for TON-native tokens
    within the custodial Wallet. At the same time, we see consumer interest in expanding
    the portfolio with other assets and want to provide them with such an option in
    trade-only mode.”“The list of tokens is not final yet, as it will be rolling out
    gradually within the next two months,” the spokesperson said, adding that the
    first release will feature 50 assets, with a full list now being finalized.Wallet’s
    Earn: Minimum deposit is 0.1 TONIn addition to expanding Wallet with a large number
    of altcoins, TOP is working to introduce the new “Trade” section and the “Earn”
    section.Starting with Toncoin (TON), the first Earn campaign will provide a “flexible
    yield” on TON deposits, with a minimum deposit amount of 0.1 TON.“The yield is
    generated from TON staking,” the spokesperson for Wallet said.Related: Wallet
    enables zero-fee USDT deposits; withdrawal fees remain the sameWallet also plans
    to expand the earn offering to more altcoins and stablecoins, including Tether’s
    USDt (USDT), the announcement stated.Additional on-ramps are comingIn addition
    to introducing more trading and earning options, Wallet in Telegram has been boosting
    its on-ramp options recently.In mid-March, the crypto infrastructure firm Mercuryo
    integrated its on-ramp solution into Wallet in Telegram.The solution has allowed
    users in certain countries to buy default-supported assets like BTC, TON and USDT
    with US dollars and euros through its platform, TOP CEO Andrew Rogozov told Cointelegraph.The
    new on-ramp option joins previously available options to deposit funds into Wallet
    in Telegram using debit cards.As Mercuryo’s current integration only supports
    on-ramps — or deposits — the off-ramp feature is planned for launch in the second
    quarter of 2025. Magazine: Mystery celeb memecoin scam factory, HK firm dumps
    Bitcoin: Asia Express\n\n            "

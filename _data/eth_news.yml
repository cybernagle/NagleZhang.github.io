- title: " Price predictions 5/2: BTC, ETH, XRP, BNB, SOL, DOGE, ADA, SUI, LINK, AVAX "
  url: https://cointelegraph.com/news/price-predictions-5-2-btc-eth-xrp-bnb-sol-doge-ada-sui-link-avax?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Key points:Bitcoin trends toward $100,000. Will bears sell at this level?Altcoins
    are trading above their respective support levels, suggesting that an altcoin
    rally is brewing.Bitcoin’s (BTC) tight consolidation resolved in favor of the
    bulls with a break above the $95,000 barrier on May 1. The bulls are trying to
    push the price to the psychologically crucial level at $100,000, which may again
    witness a tough battle between the bulls and the bears. Veteran trader Peter Brandt
    sounded positive when he said in a post on X that Bitcoin could rally to the $125,000
    to $150,000 range by August or September 2025 if it manages to regain its broken
    parabolic slope. However, Brandt cautioned that the rally could be followed by
    a sharp correction of more than 50%.Crypto market data daily view. Source: Coin360As
    Bitcoin nears the 100,000 mark, onchain analytics firm Glassnode cautions that
    the long-term holders (LTHs) may be tempted to book profits. The firm said in
    its newsletter that the LTHs tend to book profits when their profit margin reaches
    350%, and that level will be hit at $99,900. A significant amount of buy-side
    pressure is needed to overcome the selling to continue the up move.Could Bitcoin
    break above $100,000, pulling select altcoins higher? Let’s analyze the charts
    of the top 10 cryptocurrencies to find out.Bitcoin price predictionBitcoin’s break
    above $95,000 signals an advantage to buyers, but the bears are unlikely to give
    up easily.BTC/USDT daily chart. Source: Cointelegraph/TradingViewSellers will
    try to pull the price back below $95,000, trapping the aggressive bulls. If they
    can pull it off, the BTC/USDT pair could test the 20-day exponential moving average
    ($91,391). This is a necessary support to watch out for as a solid bounce off
    the 20-day EMA suggests the bullish sentiment remains intact. That increases the
    likelihood of a break above $100,000. The pair may then reach $107,000.This optimistic
    view will be invalidated in the short term if the price turns down and breaks
    below the 20-day EMA. The pair may then tumble to the 50-day simple moving average
    ($86,236).Ether price predictionBuyers successfully defended Ether’s (ETH) drop
    to the 20-day EMA ($1,757) on April 30, signaling demand at lower levels.ETH/USDT
    daily chart. Source: Cointelegraph/TradingViewThe gradually upsloping 20-day EMA
    and the RSI in the positive territory indicate a slight edge to the bulls. If
    the price maintains above $1,857, the ETH/USDT pair could climb to the breakdown
    level of $2,111. There is minor resistance at $1,957, but that is likely to be
    crossed.This positive view will be invalidated in the near term if the price turns
    down and plunges below the moving averages. That could pull the pair down to $1,537,
    which is expected to attract buyers.XRP price predictionThe bulls have managed
    to keep XRP (XRP) above the moving averages, but the bounce lacks strength.XRP/USDT
    daily chart. Source: Cointelegraph/TradingViewThe flattening 20-day EMA ($2.17)
    and the RSI just above the midpoint do not give a clear advantage either to the
    bulls or the bears. Buyers will seize control on a break and close above the resistance
    line. That clears the path for a rally to $3.On the contrary, a break and close
    below the moving averages could sink the XRP/USDT pair to the solid support at
    $2. This is a critical level to keep an eye on because a break below $2 could
    pull the pair to $1.61.BNB price predictionBNB (BNB) is witnessing a seesaw battle
    between the bulls and the bears at the moving averages.BNB/USDT daily chart. Source:
    Cointelegraph/TradingViewIf the price maintains below the moving averages, the
    BNB/USDT pair could slump to $576 and later to $566. Buyers are expected to vigorously
    defend the $566 level because a break below it may sink the pair to $520.The bulls
    will have to push the price above $620 to signal strength. The pair could then
    rise to $644, which is likely to act as a strong resistance. If buyers bulldoze
    their way through, the pair could surge to $680.Solana price predictionSolana
    (SOL) continues to face selling at the $153 level, but a positive sign is that
    the bulls have not ceded much ground to the bears.SOL/USDT daily chart. Source:
    Cointelegraph/TradingViewThe upsloping 20-day EMA ($142) and the RSI in the positive
    zone suggest that the path of least resistance is to the upside. If buyers push
    and maintain the price above $153, the SOL/USDT pair could rally to $180.Contrary
    to this assumption, if the price turns down sharply and breaks below the 20-day
    EMA, it suggests profit booking by the short-term bulls. The pair could then slump
    to the 50-day SMA ($132).Dogecoin price predictionDogecoin (DOGE) rebounded off
    the moving averages on May 1, indicating that the bulls are trying to keep the
    price inside the upper half of the range.DOGE/USDT daily chart. Source: Cointelegraph/TradingViewThe
    bulls will attempt to push the price to the top of the range at $0.21, which is
    a critical near-term resistance level to watch out for. If buyers pierce the $0.21
    level, the DOGE/USDT pair will complete a double-bottom pattern. That could start
    a move to $0.25 and then to the pattern target of $0.28.Contrarily, a break and
    close below the moving averages opens the doors for a fall to the support of the
    range at $0.14. Buyers are expected to defend the $0.14 level with all their might
    because a break below it may sink the pair to $0.10.Cardano price predictionBuyers
    bought the dip to the moving averages in Cardano (ADA), but the failure to build
    upon the rebound suggests a lack of demand at higher levels.ADA/USDT daily chart.
    Source: Cointelegraph/TradingViewBuyers will have to drive the price above the
    $0.75 resistance to gain the upper hand. If they do that, the ADA/USDT pair could
    rally to $0.83. Sellers will try to halt the up move at $0.83, but if the bulls
    prevail, the pair could reach $1.On the downside, a break and close below the
    moving averages tilts the short-term advantage in favor of the bears. The pair
    could slide to $0.58, where the buyers are expected to step in. Related: Moon
    soon? XRP's strongest spot premium aligns with 70% rally setupSui price predictionBuyers
    pushed Sui (SUI) toward the $3.90 overhead resistance on May 1, but the long wick
    on the candlestick shows that bears are aggressively defending the level.SUI/USDT
    daily chart. Source: Cointelegraph/TradingViewThe first support on the downside
    is $3.27, and then the 20-day EMA ($3.01). If the price rebounds off the 20-day
    EMA with strength, the bulls will again try to drive the SUI/USDT pair above $3.90.
    If they manage to do that, the pair could rally to $4.25 and subsequently to $5.Instead,
    if the price breaks below the 20-day EMA, it suggests that the bulls have given
    up. The pair may slump to the solid support at $2.86. If the price rebounds off
    the $2.86 support, the pair may form a range.Chainlink price predictionChainlink
    (LINK) turned up from the moving averages on May 1, indicating that the sentiment
    remains positive.LINK/USDT daily chart. Source: Cointelegraph/TradingViewBuyers
    will try to push the price above the $16 overhead resistance and challenge the
    resistance line of the descending channel pattern. Sellers are expected to fiercely
    defend the resistance line because a break and close above it signals a potential
    trend change.If the price turns down from the overhead resistance and breaks below
    the moving averages, it suggests selling on rallies. The LINK/USDT pair may drop
    to $11.68, extending its stay inside the channel for some more time.Avalanche
    price predictionAvalanche (AVAX) bounced off the 20-day EMA ($20.89) on May 1,
    indicating that the bulls are buying on dips.  AVAX/USDT daily chart. Source:
    Cointelegraph/TradingViewBuyers will try to propel the price above the $23.50
    overhead resistance. If they manage to do that, the AVAX/USDT pair will complete
    a double-bottom pattern. That may start an up move to $28.78 and later to the
    pattern target of $31.73.The moving averages are the crucial support to watch
    out for. If the price turns down from the current level or the overhead resistance
    and breaks below the 50-day SMA ($19.79), it suggests that the range-bound action
    may continue for a few more days.This article does not contain investment advice
    or recommendations. Every investment and trading move involves risk, and readers
    should conduct their own research when making a decision.\n\n            "

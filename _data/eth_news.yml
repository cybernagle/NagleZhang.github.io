---
- title: " Hyperliquid opened doors to ‘democratized’ crypto whale hunting: Analyst "
  url: https://cointelegraph.com/news/traders-targeting-hyperliquid-whales-significant-positions-trigger-liquidations-10x-research?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWEyYmYtM2Y5ZC03ZmUzLWJkNTQtNDcxMmJkYTZhNGM1.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWEyYmYtM2Y5ZC03ZmUzLWJkNTQtNDcxMmJkYTZhNGM1.jpg\"
    alt=\"Hyperliquid opened doors to ‘democratized’ crypto whale hunting: Analyst\"></p><p>Crypto
    whale tracking on the Hyperliquid blockchain has enabled traders to target whales
    with prominent leveraged positions in a &ldquo;democratized&rdquo; attempt to
    liquidate them, according to the head of 10x Research.<p><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/explained/what-is-hyperliquid-hlp-and-how-does-it-work\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Hyperliquid, a blockchain
    network</a> specializing in trading, allows traders to publicly <a data-ct-non-breakable=\"null\"
    href=\"https://www.coinglass.com/hyperliquid\" rel=\"null\" target=\"null\" text=\"null\"
    title=\"null\">observe </a>what type of positions a whale is holding, and since
    these positions are leveraged, the market can assess the liquidation levels unless
    an additional margin is added, Markus Thielen said in a March 17 <a data-ct-non-breakable=\"null\"
    href=\"https://mail.10xresearch.co/p/hype-reloaded-is-the-dip-a-new-entry-point\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">report</a>.</p><figure><img
    alt=\"Data, Trading, Whale\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a2a8-0d7f-7d95-bc74-010d89ad945c\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/10x_Research/status/1901440012820050193\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\"><em>10x Research</em></a></p></figcaption></figure><p>&ldquo;This
    transparency opens the door for coordinated efforts, where groups of traders could
    intentionally target these stop levels to trigger liquidations,&rdquo; he said.&nbsp;</p><p>It&rsquo;s
    a common belief in the crypto market that whales with substantial holdings can
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/whales-shift-26-4-k-btc-to-accumulation-addresses-as-bitcoin-falls-to-3-month-low\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">influence the market
    through their trading</a> tactics, such as <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/what-are-bitcoin-whales-and-how-to-spot-them\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">stop-loss hunting</a>,
    to deliberately trigger other traders&rsquo; <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/learn/crypto-trading-basics-a-beginners-guide-to-cryptocurrency-order-types\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">stop-loss orders</a>
    and liquidate their positions.&nbsp;</p><p>Thielen says the recent actions from
    traders show this balance of power could be shifting. </p><p>&ldquo;In effect,
    stop-hunting is being &lsquo;democratized,&rsquo; with ad-hoc groups now playing
    a role once reserved mainly for market-making desks, or treasury teams, at exchanges
    before tighter regulatory scrutiny,&rdquo; Thielen added.&nbsp;</p><p>Thielen
    told Cointelegraph that it&rsquo;s still &ldquo;unclear if this type of activity
    will become widespread onchain, but as always, transparency can cut both ways.&rdquo;&nbsp;</p><h2><strong>Why
    are traders trying to liquidate whales?</strong></h2><p>This isn&rsquo;t the first
    time smaller traders have attempted to take down larger entities through coordinated
    trading tactics.&nbsp;</p><p>Thielen says crypto traders trying to liquidate whales
    have echoes of the <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/gamestop-short-squeeze-highlights-the-power-of-decentralization\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">GameStop short squeeze</a>,
    which saw small traders flip the table on Wall Street short-sellers by buying
    GameStop&rsquo;s stock, sending it to all-time highs of over $81 to liquid their
    positions.&nbsp;</p><p>&ldquo;This reminds me of the dynamics we saw during the
    GameStop saga in 2020/2021, where aggressive short squeezes drove rapid price
    spikes,&rdquo; he said.&nbsp;</p><p><em><strong>Related: </strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/hyperliquid-4-million-loss-leverage-eth-trader\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Bybit CEO
    on &lsquo;brutal&rsquo; $4M Hyperliquid loss: Lower leverage as positions grow</strong></em></a></p><p>&ldquo;When
    stop levels get triggered, prices often accelerate in that direction, providing
    liquidity for others to cover. We&rsquo;ve seen similar tactics from market makers
    and exchanges in the crypto space over the years.&rdquo;&nbsp;</p><h2><strong>Hunt
    is still on for 40x leveraged Bitcoin short-seller</strong></h2><p>On March 16,
    a crypto whale known for placing large, highly leveraged positions on Hyperliquid
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-whale-bets-368-m-40x-leverage-btc-decline-fomc\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">opened a 40x leveraged
    short position</a> at $84,043 for over 4,442 Bitcoin (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/bitcoin-price\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">BTC</a>), worth over $368 million on March 16, facing
    liquidation if Bitcoin&rsquo;s price surpassed $85,592.</p><p>The move didn&rsquo;t
    go unnoticed, and pseudonymous trader CBB <a data-ct-non-breakable=\"null\" href=\"https://x.com/Cbb0fe/status/1901293829715558513\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">sent</a> out the call
    on X to gather a team of traders with enough funds to liquidate the whale&rsquo;s
    position.&nbsp;</p><figure><img alt=\"Data, Trading, Whale\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a6bd-7d40-742e-8d94-90c2a2cfa1de\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/Cbb0fe/status/1901293829715558513\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\"><em>CBB</em></a></p></figcaption></figure><p>Thielen
    said in the 10x report that on March 16, Bitcoin surged by 2.5% within minutes,
    partly because of a coordinated effort to liquidate a whale&rsquo;s short position
    on Bitcoin perpetual via Hyperliquid.</p><p>The whale has since <a data-ct-non-breakable=\"null\"
    href=\"https://www.coinglass.com/hyperliquid\" rel=\"null\" target=\"null\" text=\"null\"
    title=\"null\">increased</a> their position to $524 million, and at one point,
    the whale hunters nearly got their wish when the price of Bitcoin hit $84,583.84,
    <a data-ct-non-breakable=\"null\" href=\"https://www.coingecko.com/en/coins/bitcoin\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">according</a> to CoinGecko.&nbsp;</p><figure><img
    alt=\"Data, Trading, Whale\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a6be-1cc4-70db-b3c0-be61874c99ad\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/MacroCRG/status/1901702497669902643\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\"><em>CRG</em></a></p></figcaption></figure><p>However,
    some speculate the exposed short position could be intentional.&nbsp;</p><p>Hedge
    fund trader Josh Man <a data-ct-non-breakable=\"null\" href=\"https://x.com/JoshMandell6/status/1901752236533055762\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">said</a> in a March
    17 post to X that the whale might be purposefully trying to get liquidated.&nbsp;</p><p>&ldquo;So
    this there is a fairly rare and not widely used technique of self-liquidation
    and this FEELS a little like that,&rdquo; he said.&nbsp;</p><p>&ldquo;In such
    events, the seller is actually creating a bomb designed to go off and create a
    rally from the liquidation of his own short. One would expect that he has a large
    offsetting long versus short.&rdquo;&nbsp;</p><figure><img alt=\"Data, Trading,
    Whale\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a6be-9e70-7263-b678-fc4ffdc1c517\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/JoshMandell6/status/1901752236533055762\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\"><em>Josh Man</em></a></p></figcaption></figure><p><em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/crypto-fans-obsessed-longevity-biohacking-why/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Crypto fans
    are obsessed with longevity and biohacking: Here&rsquo;s why</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"markets_outlook\" label=\"Subscription
    Form: Markets Outlook\"></template></p>\n</p>\n            "

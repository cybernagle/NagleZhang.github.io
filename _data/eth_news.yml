- title: " Price analysis 3/12: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI, LEO, HBAR "
  url: https://cointelegraph.com/news/price-analysis-3-12-btc-eth-xrp-bnb-sol-ada-doge-pi-leo-hbar?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NThiMTItZWY5OS03NDhlLThkOTYtZmM1OTdiZTc3YWZl.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NThiMTItZWY5OS03NDhlLThkOTYtZmM1OTdiZTc3YWZl.jpg\"
    alt=\"Price analysis 3/12: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI, LEO, HBAR\"></p><p>Bitcoin
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>) bounced from
    $76,606 on March 11, but the bulls could not sustain the price above $84,500 on
    March 12. <p>Nansen principal research analyst Aurelie Barthere told Cointelegraph
    that <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-70k-retracement-bull-market-analysts\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Bitcoin is in a macro
    correction</a> in a bull market, with the next crucial level being &ldquo;$71,000-$72,000,
    top of the pre-election trading range.&rdquo;</p><p>Glassnode also projected a
    similar target in its March 11 market report. The onchain analytics firm said
    the recent sell-off had been triggered by the short-term holders who may have
    purchased near the peak in January. Glassnode added that <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-high-entry-buyers-sell-pressure-btc-retrace-possible\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Bitcoin could bottom
    out near $70,000</a> if selling persists.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958afd-cd37-75af-954a-7b436b152da5\"
    title=\"\" alt=\"Price analysis 3/12: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI,
    LEO, HBAR\"><figcaption style=\"text-align: center;\"><p><em>Crypto market data
    daily view. Source: </em><a data-ct-non-breakable=\"null\" href=\"https://coin360.com\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://coin360.com\"><em>Coin360</em></a></p></figcaption></figure><p>It
    is not only the crypto markets; even the US stock market has been under pressure
    in the past few days. However, a silver lining for the bulls is that the US Dollar
    Index (DXY) has corrected from its multi-year high above 110 to under 104. Bitcoin
    generally moves in inverse correlation with the dollar, suggesting that a <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/4-reasons-why-76-7k-bitcoin-btc-is-the-ultimate-low\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">bottom may be around
    the corner</a>.</p><p>Could Bitcoin retest the support at $76,606 or rise above
    $85,000? What are the important support and resistance levels to watch out for
    in altcoins? Let&rsquo;s analyze the charts of the top 10 cryptocurrencies to
    find out.</p><h2>Bitcoin price analysis</h2><p>Bitcoin broke below the $78,258
    level on March 10 and fell to $76,606 on March 11, but the bears could not sustain
    the lower levels. This suggests solid buying by the bulls.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958afd-d8c5-798f-b370-cb90a7b282eb\"
    title=\"\" alt=\"Price analysis 3/12: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI,
    LEO, HBAR\"><figcaption style=\"text-align: center;\"><p><em>BTC/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The relief
    rally is facing selling near the 20-day exponential moving average ($87,262),
    but a minor positive in favor of the bulls is that the relative strength index
    (RSI) is showing a positive divergence. Buyers will have to drive the price above
    the 20-day EMA to suggest that the correction could be ending. The BTC/USDT pair
    may then ascend to the 50-day simple moving average ($94,654).</p><p>On the downside,
    the bulls are expected to defend the $73,777 level with all their might because
    a break below it may sink the pair to $67,000.</p><h2>Ether price analysis</h2><p>Ether
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/ethereum-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">ETH</a>) fell below
    the $1,993 support on March 9 and extended the decline, reaching $1,754 on March
    11.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958afd-e2fc-7c0f-bb1c-815eec87373b\"
    title=\"\" alt=\"Price analysis 3/12: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI,
    LEO, HBAR\"><figcaption style=\"text-align: center;\"><p><em>ETH/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The bulls are
    trying to start a recovery, which is expected to face significant resistance at
    the breakdown level of $2,111. If the price turns down sharply from $2,111, it
    will signal that the bears have flipped the level into resistance. That heightens
    the risk of a break below $1,754. The ETH/USDT pair may then slump to $1,500.</p><p>Conversely,
    a break above the 20-day EMA ($2,235) suggests that the markets have rejected
    the break below $2,111. The pair may then climb to $2,800, where the bears are
    expected to step in.</p><h2>XRP price analysis</h2><p>XRP (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/xrp-price-index\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">XRP</a>) fell below the $2 support on March 11, but
    the bears could not sustain the lower levels, as seen from the long tail on the
    candlestick.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958afd-ed2a-7136-ab0a-533874e88b6d\"
    title=\"\" alt=\"Price analysis 3/12: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI,
    LEO, HBAR\"><figcaption style=\"text-align: center;\"><p><em>XRP/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The bears are
    trying to stall the recovery at the 20-day EMA ($2.35). If the price continues
    lower, the possibility of a break below $2 increases. If that happens, the XRP/USDT
    pair will complete a bearish head-and-shoulders pattern. There is minor support
    at $1.77, but if the level cracks, the decline could extend to $1.28.</p><p>Contrary
    to this assumption, if the price breaks above the 20-day EMA, the pair could rise
    to the 50-day SMA ($2.58) and later to $3.&nbsp;</p><h2>BNB price analysis</h2><p>BNB
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/binance-coin-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BNB</a>) turned up from
    $507 on March 11, indicating that the bulls are aggressively defending the $500
    to $460 support zone.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958afd-f7c6-718b-a9ac-14d6233e1177\"
    title=\"\" alt=\"Price analysis 3/12: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI,
    LEO, HBAR\"><figcaption style=\"text-align: center;\"><p><em>BNB/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The relief
    rally is expected to face selling at the 20-day EMA ($592). If the price turns
    down sharply from the 20-day EMA, the bears will try to sink the BNB/USDT pair
    below $500. The pair may drop to $460 if they can pull it off.</p><p>Instead,
    if the price rises above the 20-day EMA, it will signal that the pair may remain
    inside the $460 to $745 range for a while longer. The bulls will be back in the
    driver&rsquo;s seat on a break and close above the 50-day SMA ($628).</p><h2>Solana
    price analysis</h2><p>Solana (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/solana-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">SOL</a>) turned up from
    $112 on March 11, signaling that the bulls are fiercely defending the $110 support.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958afe-0258-7a9d-ac0c-8cd25560f844\"
    title=\"\" alt=\"Price analysis 3/12: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI,
    LEO, HBAR\"><figcaption style=\"text-align: center;\"><p><em>SOL/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The RSI shows
    early signs of forming a positive divergence, indicating that the bearish momentum
    could weaken. The first sign of strength will be a break and close above the 20-day
    EMA ($145).&nbsp;</p><p>If the price turns down from the current level or the
    20-day EMA, it suggests that every minor rally is being sold into. That increases
    the risk of a break below $110. The SOL/USDT pair could tumble to $98 and subsequently
    to $80.</p><h2>Cardano price analysis</h2><p>Cardano (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/ada-price-index\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">ADA</a>) rebounded off the uptrend line on March
    11, suggesting that the bulls are trying to stop the decline.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958afe-0c75-746e-95bb-41fab9a10a6e\"
    title=\"\" alt=\"Price analysis 3/12: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI,
    LEO, HBAR\"><figcaption style=\"text-align: center;\"><p><em>ADA/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The bears are
    unlikely to give up easily and are expected to sell at the moving averages. If
    the price turns down from the moving averages, it will signal selling on rallies.
    The bears will then try to strengthen their position by pulling the price below
    the uptrend line. If they do that, the ADA/USDT pair could drop to $0.60 and then
    to $0.50.</p><p>Contrary to this assumption, a break and close above the moving
    averages suggests that the bulls are back in the game. The pair may then rally
    to $1.02.</p><h2>Dogecoin price analysis</h2><p>Dogecoin (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/doge-price-index\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">DOGE</a>) continued its slide and reached the $0.14
    support on March 11. The bulls are trying to defend the level but may face selling
    at higher levels.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958afe-16b9-75ce-8263-2166d4d4aaf2\"
    title=\"\" alt=\"Price analysis 3/12: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI,
    LEO, HBAR\"><figcaption style=\"text-align: center;\"><p><em>DOGE/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>If the price
    turns down from the 20-day EMA ($0.20), it will suggest that the sentiment remains
    negative and traders are selling on rallies. That increases the risk of a break
    below $0.14. The DOGE/USDT pair may descend to $0.10 if that happens.</p><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/what-happened-in-crypto-today\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/news/what-happened-in-crypto-today\"><em><strong>Here&rsquo;s
    what happened in crypto today</strong></em></a></p><p>On the contrary, a break
    and close above the 20-day EMA suggests that the bears are losing their grip.
    The pair could climb to the 50-day SMA ($0.25), which may pose a solid challenge
    again.</p><h2>Pi price analysis</h2><p>Pi (PI) is taking support at the 61.8%
    Fibonacci retracement level of $1.20, indicating buying at lower levels.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958afe-1ed3-736d-93b1-620fa87cc6fa\"
    title=\"\" alt=\"Price analysis 3/12: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI,
    LEO, HBAR\"><figcaption style=\"text-align: center;\"><p><em>PI/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The relief
    rally is expected to face resistance at the 20-day EMA ($1.69) and then again
    at $2. If the price turns down from the overhead resistance, the PI/USDT pair
    could range between $2 and $1.20 for some time.</p><p>A break and close above
    $2 suggests that the correction may be over. The pair could rally to $2.40. Alternatively,
    a break and close below $1.20 could sink the pair to the 78.6% retracement level
    of $0.72.</p><h2>UNUS SED LEO price analysis</h2><p>UNUS SED LEO (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/leo-price-index\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">LEO</a>) has been consolidating just below the $10
    level for several days, indicating that the bulls are holding on to their positions
    as they anticipate another leg higher.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958afe-2970-79b1-8d73-fb375bc6d64d\"
    title=\"\" alt=\"Price analysis 3/12: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI,
    LEO, HBAR\"><figcaption style=\"text-align: center;\"><p><em>LEO/USD daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The LEO/USD
    pair has formed an ascending triangle pattern, which will complete on a break
    and close above $10. If that happens, the pair could resume the uptrend toward
    the target objective of $12.04.</p><p>This positive view will be invalidated in
    the near term if the price turns down and breaks below the uptrend line. That
    will negate the bullish setup, starting a drop to $8.84 and later to $8.30.</p><h2>Hedera
    price analysis</h2><p>Hedera (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/hedera-hbar-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">HBAR</a>) bounced off
    the $0.17 support on March 11, indicating that the bulls are aggressively defending
    the level.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958afe-3457-7c06-8e2a-c6a3dce18f80\"
    title=\"\" alt=\"Price analysis 3/12: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI,
    LEO, HBAR\"><figcaption style=\"text-align: center;\"><p><em>HBAR/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The recovery
    is facing selling at the 20-day EMA ($0.22), as seen from the long wick on the
    candlestick. If the price continues lower, the bears will make one more attempt
    to sink the HBAR/USDT pair below $0.17. If they succeed, the pair could plunge
    to $0.12.</p><p>Contrarily, a break above the 20-day EMA suggests that the selling
    pressure is reducing. The pair could rise to the downtrend line, which is an important
    level to watch out for. If buyers push the price above the downtrend line, the
    pair could rally to $0.29.</p><p class=\"post-content__disclaimer\" type=\"\">This
    article does not contain investment advice or recommendations. Every investment
    and trading move involves risk, and readers should conduct their own research
    when making a decision.</p><template data-name=\"subscription_form\" data-type=\"markets_outlook\"
    label=\"Subscription Form: Markets Outlook\"></template></p>\n</p>\n            "

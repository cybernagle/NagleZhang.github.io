    pair is expected to face intense selling at the resistance line, but if the bulls
    prevail, the rally could reach $89,000 and then $95,000.Sellers are likely to
    have other plans. They will try to defend the resistance line and pull the price
    below the immediate support at $78,500. If they manage to do that, the pair could
    retest the vital support at $73,777.Ether price analysisEther (ETH) rebounded
    off the $1,368 support on April 9, but the bulls are struggling to sustain the
    higher levels.ETH/USDT daily chart. Source: Cointelegraph/TradingViewThe downsloping
    moving averages and the RSI in the negative territory suggest that the bears hold
    the edge. Sellers will try to sink the ETH/USDT pair below $1,368. If they can
    pull it off, the selling could accelerate, and the pair may tumble to $1,150.If
    buyers want to prevent the breakdown, they will have to quickly push the price
    above $1,754. That clears the path for a rally to the breakdown level of $2,111.
    This is an essential level for the bears to defend because a break above $2,111
    suggests a short-term trend change.XRP price analysisXRP (XRP) rose back above
    the breakdown level of $2 on April 9, but the recovery is facing selling at the
    20-day EMA ($2.09).XRP/USDT daily chart. Source: Cointelegraph/TradingViewIf the
    price turns down from the 20-day EMA, the bears will try to sink the XRP/USDT
    pair to the critical support at $1.61. Buyers are expected to fiercely defend
    the $1.61 level because a break below it may clear the path for a decline to $1.27.Alternatively,
    if the price rises above the 20-day EMA, it suggests that the markets have rejected
    the breakdown below $2. The pair could rally to the resistance line, where the
    bears are expected to mount a strong defense.BNB price analysisBNB (BNB) has reached
    the 20-day EMA ($590), which is an important near-term resistance to watch out
    for.BNB/USDT daily chart. Source: Cointelegraph/TradingViewSellers will try to
    defend the zone between the 20-day EMA and the downtrend line, but if the bulls
    do not give up much ground, it improves the prospects of a break above the overhead
    resistance zone. The BNB/USDT pair could then ascend to $644.Contrary to this
    assumption, if the price turns down sharply from the overhead resistance, it suggests
    that the bears have not given up. That could keep the pair stuck inside the triangle
    for a while longer.Solana price analysisSolana (SOL) rose above the breakdown
    level of $110 on April 9, but the bulls are facing resistance at the 20-day EMA
    ($121).SOL/USDT daily chart. Source: Cointelegraph/TradingViewA minor advantage
    in favor of the bulls is that the bears did not allow the price to slip back below
    $110 on April 10. That shows buying on dips. If the bulls kick the price above
    the 20-day EMA, the SOL/USDT pair may rally to the 50-day SMA ($133) and then
    to $153.This positive view will be invalidated in the short term if the price
    turns down sharply from the 20-day EMA and breaks below $110. The pair could then
    retest the April 7 intraday low of $95. Dogecoin price analysisBuyers have successfully
    defended the $0.14 in Dogecoin (DOGE) but are yet to clear the moving averages.DOGE/USDT
    daily chart. Source: Cointelegraph/TradingViewIf the price turns down sharply
    from the moving averages, it suggests that the sentiment remains negative and
    traders are selling on rallies. That increases the likelihood of a break below
    $0.14. The DOGE/USDT pair could then plummet toward the next significant support
    at $0.10.Conversely, a break and close above the moving averages will be the first
    sign of strength. There is resistance at $0.20, but if the bulls overcome it,
    the pair will complete a double-bottom pattern. The pair could march to $0.24
    and subsequently to $0.26.Cardano price analysisCardano (ADA) has reached the
    20-day EMA ($0.65), which is a strong near-term resistance to watch out for.ADA/USDT
    daily chart. Source: Cointelegraph/TradingViewIf the price breaks above the 20-day
    EMA, the ADA/USDT pair could reach the 50-day SMA ($0.71). This level may again
    pose a strong challenge, but if the buyers prevail, the pair could rally to $0.83.On
    the contrary, if the price turns down sharply from the 20-day EMA, it signals
    that the bears are selling on every minor rally. That heightens the risk of a
    break below the $0.50 support. If that happens, the pair could slide to $0.40.Related:
    Bollinger Bands creator says Bitcoin forming 'classic' floor near $80KUNUS SED
    LEO price analysisUNUS SED LEO (LEO) rose back above the uptrend line on April
    9, signaling solid demand at lower levels.LEO/USD daily chart. Source: Cointelegraph/TradingViewThe
    20-day EMA ($9.38) is flattening out, and the RSI is near the midpoint, suggesting
    a balance between supply and demand. If the price breaks above the 20-day EMA,

- title: " Lazarus Group sends 400 ETH to Tornado Cash, deploys new malware "
  url: https://cointelegraph.com/news/lazarus-group-deposits-400-eth-into-tornado-cash-new-malware?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NThkZTYtNDYzOC03MDU1LWE4YTctZGE1ODkyYzA5NWMx.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NThkZTYtNDYzOC03MDU1LWE4YTctZGE1ODkyYzA5NWMx.jpg\"
    alt=\"Lazarus Group sends 400 ETH to Tornado Cash, deploys new malware\"></p><p>North
    Korean-affiliated hacking collective the Lazarus Group has been moving crypto
    assets using mixers following a string of high-profile hacks.&nbsp;<p>On March
    13, blockchain security firm CertiK <a data-ct-non-breakable=\"null\" href=\"https://x.com/CertiKAlert/status/1900010122044412187\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">alerted</a> its X followers
    that it had detected a deposit of 400 ETH (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/ethereum-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">ETH</a>) worth around
    $750,000 to the Tornado Cash mixing service.&nbsp;</p><p>&ldquo;The fund traces
    to the Lazarus group&rsquo;s activity on the Bitcoin network,&rdquo; it noted.&nbsp;</p><p>The
    North Korean hacking group was <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/zach-xbt-identifies-lazarus-group-bybit-hack-arkham-bounty\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">responsible</a> for
    the massive <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bybit-exchange-hacked\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Bybit exchange hack</a>
    that resulted in the theft of $1.4 billion worth of crypto assets on Feb. 21.&nbsp;</p><p>It
    has also been linked to the $29 million <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/lazarus-group-consolidates-bybit-phemex-hacker-wallet\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Phemex exchange hack</a>
    in January and has been laundering assets ever since.&nbsp;</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958dfd-1e5d-7382-98c7-cda8007b357d\"
    title=\"\" alt=\"Lazarus Group sends 400 ETH to Tornado Cash, deploys new malware\"><figcaption
    style=\"text-align: center;\"><p><em>Lazarus Group crypto asset movements. Source:
    </em><a data-ct-non-breakable=\"null\" href=\"https://x.com/CertiKAlert/status/1900010122044412187\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://x.com/CertiKAlert/status/1900010122044412187\"><em>Certik</em></a><em>&nbsp;</em></p></figcaption></figure><p>Lazarus
    has also been linked to some of the most notorious crypto hacking incidents, including
    the $600 million <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/the-aftermath-of-axie-infinity-s-650m-ronin-bridge-hack\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Ronin network hack</a>
    in 2022.</p><p>North Korean hackers stole over $1.3 billion worth of crypto assets
    in 47 incidents in 2024, more than doubling thefts in 2023, <a data-ct-non-breakable=\"null\"
    href=\"https://www.chainalysis.com/blog/crypto-hacking-stolen-funds-2025/\" rel=\"null\"
    target=\"null\" text=\"null\" title=\"null\">according</a> to Chainalysis data.</p><h2>New
    Lazarus malware detected</h2><p>According to researchers at cybersecurity firm
    Socket, Lazarus Group has <a data-ct-non-breakable=\"null\" href=\"https://socket.dev/blog/lazarus-strikes-npm-again-with-a-new-wave-of-malicious-packages?data=he93crypto7h29news87g2\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">deployed</a> six new
    malicious packages to infiltrate developer environments, steal credentials, extract
    cryptocurrency data and install backdoors.&nbsp;</p><p>It has targeted the Node
    Package Manager (NPM) ecosystem, which is a large collection of JavaScript packages
    and libraries.</p><p>Researchers discovered malware called &ldquo;BeaverTail&rdquo;
    embedded in packages that mimic legitimate libraries using typosquatting tactics
    or methods used to deceive developers.&nbsp;</p><p>&ldquo;Across these packages,
    Lazarus uses names that closely mimic legitimate and widely trusted libraries,&rdquo;
    they added.&nbsp;</p><p><em><strong>Related: </strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/inside-lazarus-group-money-laundering-strategy-bybit-hack\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Inside the
    Lazarus Group money laundering strategy</strong></em></a></p><p>The <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/crypto-stealing-malware-andriod-ios-app-kits-kaspersky\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">malware</a> also targets
    cryptocurrency wallets, specifically Solana and Exodus wallets, the added.&nbsp;</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958dfd-2401-7deb-9ba2-3683b7c5e17c\"
    title=\"\" alt=\"Lazarus Group sends 400 ETH to Tornado Cash, deploys new malware\"><figcaption
    style=\"text-align: center;\"><p><em>Code snippet showing Solana wallet attacks.
    Source: Socket</em></p></figcaption></figure><p>The attack targets files in Google
    Chrome, Brave and Firefox browsers, as well as keychain data on macOS, specifically
    targeting developers who might unknowingly install the malicious packages.</p><p>The
    researchers noted that attributing this attack definitively to Lazarus remains
    challenging; however, &ldquo;the tactics, techniques, and procedures observed
    in this npm attack closely align with Lazarus&rsquo;s known operations.&rdquo;&nbsp;</p><p><em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/china-memecoin-factory-hk-firm-dumps-bitcoin-asia-express/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Mystery
    celeb memecoin scam factory, HK firm dumps Bitcoin: Asia Express</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"consulting_newsletter\" label=\"Subscription
    Form: Consulting Newsletter\"></template></p>\n</p>\n            "

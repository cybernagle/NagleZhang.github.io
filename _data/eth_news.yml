- title: " Ethereum’s ‘Pectra’ network upgrade goes live: What to expect "
  url: https://cointelegraph.com/news/ethereum-s-pectra-network-upgrade-goes-live-today-what-to-expect?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Ethereum — the network that unleashed smart contracts on the world — moves
    on to the next chapter with today’s Pectra upgrade, but what does it mean?Pectra
    went live on the Ethereum mainnet at the start of epoch 364032, May 7, 2025, at
    about 10:00 am UTC. The three main Ethereum improvement proposals (EIPs) included
    are EIP-7702, EIP-7251 and EIP-7691.Source: Ethereum.orgEIP-7702 allows externally
    owned accounts to act as smart contracts and cover gas expenses (transaction fees)
    and payments in tokens that are not Ether (ETH). EIP-7251 increases the validator
    staking limit from 32 ETH to 2,048 ETH, which makes operations for large stakers
    easier and simpler.Finally, EIP-7691 increases the number of data blobs per block,
    which allows for better layer-2 scalability and potentially significantly reduces
    transaction fees. Sergej Kunz, co-founder of Ethereum decentralized exchange (DEX)
    aggregator 1inch, said Pectra “introduces ‘smart account’ functionality” at deeper
    protocol levels and “improves Ethereum’s scalability” through layer-2 solutions.Related:
    Ethereum to simplify crosschain transactions with new token standardsBetter account
    abstraction0xAw, lead developer at Base Ethereum layer-2 DEX Alien.Base told Cointelegraph
    that EIP‑7702 “is a potentially great addition for Ethereum.” He said that account
    abstraction has so far been unable to gain traction due to the need to switch
    wallets.The positives of adopting such a solution include “getting rid of approval
    flows, not having to sign each transaction, segregated permissions and actions,
    and automations on behalf of the user.” 0xAw added that, following the update,
    developers will have an easier time implementing the features.While account abstraction
    “won’t magically result in mass adoption,” it still “does remove a significant
    barrier to entry for new people.” He added:“It enables a Web2-like UX by hiding
    many of the underlying scaffolding from users.”1inch’s Kunz said the update will
    pave “the way for native gasless transactions and simplified user flows.” Ivo
    Georgiev, founder and CEO of self-custodial smart wallet Ambire, told Cointelegraph
    that “there will be no more infinite ERC-20 approvals, and users won’t need native
    currency like ETH to pay transaction gas fees.” He added:“Following this, the
    UX will be reworked completely, with permissions/delegations systems that let
    wallets give more limited abilities to apps, thus increasing their overall security
    — for example, you won’t need the wallet popup every time you interact with OpenSea.“Still,
    the change is not without its downsides. According to 0xAw, “users have one more
    dangerous thing they could sign, which would be even more damaging than an approval
    to wallet drainers.”Mike Tiutin, chief technology officer at onchain compliance
    protocol PureFi, told Cointelegraph that “drainers proved that users will sign
    ‘harmless’ messages in cloned DApps.” The risk will now get worse:“EIP-7702 expands
    that trick from one token to the whole wallet.“Georgiev is more optimistic, saying
    he is “confident there will not be a tangible increase in risk.” He explained,
    “By this point, the industry knows how to create a secure contract, especially
    with such a minimal scope as an EIP-7702 delegation.”Related: Vitalik wants to
    make Ethereum ‘as simple as Bitcoin’ in 5 yearsEasier institutional stakingArtemiy
    Parshakov, vice president of institutions at Ethereum staking service P2P.org,
    told Cointelegraph, “EIP-7002 makes institutional staking much easier to integrate
    without taking too much risk.” Staking service clients had to obtain a signed
    message from their staking service provider to be able to exit and store it securely
    for later.Until Pectra, stakers could not exit without the participation of the
    staking service provider. Those messages also couldn’t be generated until about
    13 hours after starting staking — now this exit delay will be decreased to about
    13 minutes.Supply validator deposits onchainAnother notable upgrade is EIP-6110.
    This makes the execution‑layer block carry data about new validator deposits to
    the consensus layer. Validator deposits are new validators joining Ethereum’s
    staking protocol.Consensus clients previously waited for block proposers to vote
    on a Merkle root that summarized deposits. Now, the execution-layer block includes
    (supplies) a list of new verifier deposits. This sort of upgrade makes changes
    very deep in Ethereum’s consensus layer, and its introduction follows client bugs
    breaking the Holesky and Sepolia Ethereum test networks. Still, Parshakov said
    that his firm’s biggest concerns “are client bugs, but we trust that respectable
    teams and the Ethereum Foundation are working together to prevent it from happening
    on mainnet.”Magazine: 12 minutes of nail-biting tension when Ethereum’s Pectra
    fork goes live\n\n            "

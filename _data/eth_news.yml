- title: " $649B stablecoin transfers linked to illicit activity in 2024: Report "
  url: https://cointelegraph.com/news/stablecoin-risk-crypto-transactions-bitrace-2024-report?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Cryptocurrency compliance firm Bitrace found that $649 billion worth of
    stablecoins flowed through addresses classified as high-risk in 2024, according
    to an April 29 report.Bitrace defines high-risk blockchain addresses as those
    used by illegal entities to receive, transfer or store stablecoins.Crypto compliance
    firms typically score crypto wallet addresses based on their likelihood of involvement
    in illicit activities. The higher the risk, the higher the likelihood of foul
    play, and the less likely compliant crypto businesses are to accept the assets.Per
    the report, the amount accounted for roughly 5.14% of all stablecoin transaction
    volume in 2024. This is down 0.8% from 5.94% the previous year, but significantly
    higher than the 2.8% reported in 2022 and 1.63% in 2021.Proportion of high-risk
    stablecoin transactions. Source: BitraceRelated: Americans lost $9.3B to crypto
    fraud in 2024 — FBITron USDT tops high-risk transactionsTron-based USDt (USDT)
    dominates high-risk stablecoin transactions, with Bitrace data indicating that
    well over 70% of the volume moved on the network. The remaining high-risk stablecoin
    transactions are mostly Ethereum-based USDt and a small amount of USDC (USDC).A
    likely explanation for the prevalence of USDT is likely due to its larger market
    capitalization and adoption compared with other stablecoins. At the time of writing,
    CoinMarketCap shows that USDt has a market cap of over $148 billion, while USDC
    stands at over $62 billion.Tron’s prevalence is not as easy to explain. Ethereum
    remains the more popular choice for most stablecoin users, with DefiLlama showing
    nearly $124.3 billion worth of stablecoins circulating on the network. Tron ranks
    second, with about $71 billion — almost 43% less than Ethereum.When comparing
    USDT balances alone, Tron holds slightly more than Ethereum: 47.4% of USDT supply,
    versus Ethereum’s 45.44%.High-risk inflows by stablecoin type. Source: BitrueRelated:
    Tether stablecoin issuer and Tron launch financial crime unitCrypto gambling continues
    its riseBitrace also reported that in 2024, online gambling platforms processed
    $217.8 billion worth of stablecoins — a 17.5% increase over the previous year.Once
    again, USDT also dominated this type of activity. Still, USDC’s market share is
    rapidly rising, clocking in at 13.36% in 2024.Stablecoin inflows to gambling platforms.
    Source: BitrueThe data follows recent reports that crypto casinos generated more
    than $81 billion in revenue in 2024, even as regulators in key jurisdictions continued
    to block access to the platforms, according to a new report.Magazine: Ridiculous
    ‘Chinese Mint’ crypto scam, Japan dives into stablecoins: Asia Express\n\n            "

- title: " Solana CME futures tip impending US ETF approvals — Exec "
  url: https://cointelegraph.com/news/sol-cme-futures-tip-impending-us-etf-approval-exec?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMTEvMDE5MzRjMWItZGRiMy03Mzk5LTllYzQtMmUwNjAwNTE4MmEz.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMTEvMDE5MzRjMWItZGRiMy03Mzk5LTllYzQtMmUwNjAwNTE4MmEz.jpg\"
    alt=\"Solana CME futures tip impending US ETF approvals — Exec\"></p><p>The upcoming
    launch of Solana (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/solana-price-index\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/solana-price-index\">SOL</a>)
    futures on the Chicago Mercantile Exchange (CME), a US derivatives exchange, signals
    that the first US SOL exchange-traded fund (ETF) listings are coming soon, Chris
    Chung, founder of Solana-based swap platform Titan, told Cointelegraph.&nbsp;<p>On
    March 17, CME is <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/cme-group-launch-solana-futures-march-17\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/cme-group-launch-solana-futures-march-17\">preparing
    to launch SOL futures contracts</a>. They will be among the first regulated Solana
    futures to hit the US market after <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/coinbase-launches-cftc-regulated-sol-futures-us\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/coinbase-launches-cftc-regulated-sol-futures-us\">Coinbase&rsquo;s
    launched in February</a>.&nbsp;</p><p>The listing &ldquo;paves the way for the
    eventual approval of SOL ETFs,&rdquo; Chung told Cointelegraph.</p><p>Chung said
    he expects the US Securities and Exchange Commission (SEC) to approve asset managers
    VanEck and Canary Capital&rsquo;s proposed spot Solana ETFs as soon as May.</p><p>The
    existence of regulated Solana futures &ldquo;signals to regulators that Solana
    is maturing as an asset, making it easier for them to greenlight additional financial
    products of similar risk and type,&rdquo; Chung said.&nbsp;</p><p>Futures contracts
    are standardized agreements to buy or sell an underlying asset at a future date.
    They play a crucial supporting role for spot cryptocurrency ETFs because regulated
    futures markets provide a stable benchmark for measuring a digital asset&rsquo;s
    performance.</p><p>CME already lists futures contracts for Bitcoin (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/bitcoin-price\" rel=\"nofollow noopener\" target=\"_self\"
    text=\"null\" title=\"https://cointelegraph.com/bitcoin-price\">BTC</a>) and Ether
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/ethereum-price\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/ethereum-price\">ETH</a>).
    US regulators approved ETFs for both of those cryptocurrencies last year.&nbsp;</p><figure><img
    alt=\"Solana CME futures tip impending US ETF approvals &mdash; Exec\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195916b-db77-75bd-a2f4-2c5fd4976ea2\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>CME already lists
    crypto futures, including Bitcoin contracts. Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://www.cmegroup.com/markets/cryptocurrencies.html#overview\" rel=\"nofollow
    noopener\" target=\"_blank\" text=\"null\" title=\"https://www.cmegroup.com/markets/cryptocurrencies.html#overview\"><em>CME</em></a></p></figcaption></figure><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/cme-group-reports-record-crypto-volumes-q4\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/news/cme-group-reports-record-crypto-volumes-q4\"><em><strong>CME
    Group reports record crypto volumes for Q4</strong></em></a></p><h2>Beyond memecoins</h2><p>Additionally,
    Solana futures and ETFs will help expand Solana&rsquo;s growth story beyond memecoins,
    which were central to the blockchain network&rsquo;s success in 2024, Chung said.</p><p>These
    products &ldquo;will bring more serious, sticky capital and pave the way for the
    development of other real-world use cases, such as payments and remittances,&rdquo;
    according to Chung.&nbsp;</p><p>Those use cases are &ldquo;[f]ar more boring than
    memecoins, perhaps, but a reliable source of long-term revenue that will buoy
    Solana&rsquo;s price in the next bear market.&rdquo;</p><p>Memecoin trading, largely
    tied to the popular Pump.fun platform, comprises roughly 80% of the Solana blockchain
    network&rsquo;s revenues, according to asset manager VanEck.</p><p>However, activity
    on the Solana network declined in February after a series of memecoin-related
    scandals soured sentiment among retail traders.&nbsp;</p><figure><img alt=\"Solana
    CME futures tip impending US ETF approvals &mdash; Exec\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195916a-76ef-7abd-b098-c18715a5ac72\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Solana vs. Ethereum
    price chart. Source: TradingView</em></p></figcaption></figure><h2>Rivaling Ethereum</h2><p>Still,
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/solana-dex-volumes-still-rival-ethereum-s-despite-memecoin-meltdown-van-eck\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">cryptocurrency trading
    volumes on Solana</a> continue to rival those of the entire Ethereum ecosystem,
    including its layer-2 scaling chains, VanEck said on March 6.&nbsp;</p><p>Chung
    said he expects Solana ETFs to take off among retail investors, partly because
    of the challenges facing rival smart contract platform Ethereum.&nbsp;</p><p>Solana&rsquo;s
    native SOL token has performed about twice as well as Ether since early 2024,
    according to TradingView.&nbsp;</p><p>Ethereum&rsquo;s spot price has struggled
    since March 2024, when the network&rsquo;s Dencun upgrade cut transaction fees
    by approximately 95%.&nbsp;</p><p>&ldquo;With the extremely weak price action
    we&rsquo;re seeing in ETH, Solana is now the only option for retail investors
    wanting to get exposure to crypto beyond Bitcoin, but not willing to go full degen,&rdquo;
    Chung said.</p><p>Bloomberg Intelligence has set the odds of the SEC approving
    spot Solana and Litecoin ETFs at 70%. </p><p><em><strong>Magazine: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/solana-printing-tokens-bots-subsidies/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/magazine/solana-printing-tokens-bots-subsidies/\"><em><strong>What
    Solana&rsquo;s critics get right&hellip; and what they get wrong</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"crypto_biz\" label=\"Subscription
    Form: Crypto Biz Newsletter\"></template></p>\n</p>\n            "
  published: 2025-03-13 21:42:05 UTC
- title: " US Bitcoin ETFs break outflow streak with $13.3M inflow "
  url: https://cointelegraph.com/news/bitcoin-etfs-break-outflow-streak-13m-inflow?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMTEvMDE5MzAzZTEtZWJhZS03Yzg2LTk1NTMtMTA3YzA3MGQzZWM3.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMTEvMDE5MzAzZTEtZWJhZS03Yzg2LTk1NTMtMTA3YzA3MGQzZWM3.jpg\"
    alt=\"US Bitcoin ETFs break outflow streak with $13.3M inflow\"></p><p>Over $1.67
    billion exited US spot Bitcoin and Ether exchange-traded funds (ETFs) in March,
    but investors stopped the bleeding by bringing in $13.3 million on March 12 as
    the BTC market price inched closer to $85,000.<p>As of March 12, spot Bitcoin
    ETFs had attracted $35.4 million worth of inflows spread across two days, <a data-ct-non-breakable=\"null\"
    href=\"https://farside.co.uk/btc/\" rel=\"null\" target=\"null\" text=\"null\"
    title=\"null\">according</a> to Farside Investors data. On the other hand, spot
    Ether ETFs recorded inflows on just one occasion, bringing in $14.6 million on
    March 4.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958f57-a8ce-7d67-941a-e77fd65fa5d7\"
    title=\"\" alt=\"US Bitcoin ETFs break outflow streak with $13.3M inflow\"><figcaption
    style=\"text-align: center;\"><p><em>Spot Bitcoin ETF daily flow data. Source:
    Farside Investors</em></p></figcaption></figure><h2>Bitcoin ETFs break outflow
    streak with $13.3 million inflow</h2><p><a data-ct-non-breakable=\"null\" href=\"https://sosovalue.com/assets/etf/us-btc-spot\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://sosovalue.com/assets/etf/us-btc-spot\">According</a>
    to Sosovalue, the cumulative net inflows of BTC ETFs confirmed the recent $13.3
    million inflow on March 12, signaling a pause in Bitcoin&rsquo;s ETF outflows.</p><p>The
    total value of the trades that day for Bitcoin ETFs amounted to $2.01 billion,
    its lowest daily value since Feb. 20. The inflows were contributed by three BTC
    funds: BlackRock&rsquo;s iShares Bitcoin Trust (IBIT), the ARK 21Shares Bitcoin
    ETF (ARKB) and the Grayscale Bitcoin Mini Trust ETF (BTC).</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958f57-ae83-788e-b3ec-19a231be1cd0\"
    title=\"\" alt=\"US Bitcoin ETFs break outflow streak with $13.3M inflow\"><figcaption
    style=\"text-align: center;\"><p><em>Daily flow of investments into spot Bitcoin
    ETFs. Source: Sosovalue</em></p></figcaption></figure><p>On the Ethereum side,
    the one day of inflows saw <a data-ct-non-breakable=\"null\" href=\"https://farside.co.uk/eth/\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://farside.co.uk/eth/\">contributions</a>
    from the Fidelity Ethereum Fund (FETH), Bitwise Ethereum ETF (ETHW), Grayscale
    Ethereum Trust (ETHE) and the Grayscale Ethereum Mini Trust (ETH).</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958f57-b235-7fb0-b7fc-a0f1ceef7f46\"
    title=\"\" alt=\"US Bitcoin ETFs break outflow streak with $13.3M inflow\"><figcaption
    style=\"text-align: center;\"><p><em>Spot Ether ETF daily flow data. Source: Farside
    Investors</em></p></figcaption></figure><h2>Market downturn and geopolitical tensions
    drive ETF outflows</h2><p>The broader market downturn and macroeconomic uncertainties
    have contributed to the ETF outflows, driven by geopolitical tensions, trade wars
    and bearish investor sentiment.</p><p><em><strong>Related: </strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/crypto-etps-4th-consecutive-outflows-at-876m-coin-shares\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Crypto ETPs
    see 4th straight week of outflows, totaling $876M &mdash; CoinShares</strong></em></a></p><p>Analysts
    say that the lack of concrete implementation or unmet expectations regarding President
    Donald Trump&rsquo;s Strategic Bitcoin Reserve plan has also exacerbated selling
    pressure.</p><p>Despite Bitcoin maintaining levels above $80,000, market watchers
    warned that the upcoming European Union retaliatory tariffs could introduce greater
    volatility, further influencing Bitcoin&rsquo;s price trajectory.</p><p><br><em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/crypto-fans-obsessed-longevity-biohacking-why/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Crypto fans
    are obsessed with longevity and biohacking: Here&rsquo;s why</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"markets_outlook\" label=\"Subscription
    Form: Markets Outlook\"></template></p>\n</p>\n            "
  published: 2025-03-13 12:57:34 UTC
- title: " Ethereum average gas fees drop 95% one year after the Dencun upgrade "
  url: https://cointelegraph.com/news/ethereum-average-gas-fees-95-percent-drop-dencun?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NThmMTMtOTE3ZC03OTI2LTk5NmQtOGM5YmZhZDg5OWZj.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NThmMTMtOTE3ZC03OTI2LTk5NmQtOGM5YmZhZDg5OWZj.jpg\"
    alt=\"Ethereum average gas fees drop 95% one year after the Dencun upgrade\"></p><p>The
    average Ethereum gas fee has dropped by 95% in the year following the Dencun upgrade,
    one of Ethereum&rsquo;s most significant network improvements.<p>On March 13,
    2024, <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/dencun-upgrade-live-ethereum-mainnet\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Ethereum&rsquo;s Dencun
    upgrade</a> was rolled out. The upgrade combined the Cancun upgrade on the execution
    layer and the Deneb upgrade on the consensus layer. It also introduced nine Ethereum
    Improvement Proposals (EIPs).</p><p>The primary goal was to enhance Ethereum&rsquo;s
    scalability and reduce transaction costs for layer-2 networks. <a data-ct-non-breakable=\"null\"
    href=\"https://ycharts.com/indicators/ethereum_average_gas_price\" rel=\"nofollow
    noopener\" target=\"_blank\" text=\"null\" title=\"https://ycharts.com/indicators/ethereum_average_gas_price\">According</a>
    to YCharts data, Ethereum&rsquo;s average gas fee has fallen from 72 gwei in 2024
    to just 2.7 gwei as of March 12, 2025.</p><p>Last year, an average swap cost users
    $86 in fees, while non-fungible token sales averaged $145 in gas fees. At the
    time of writing, Etherscan data showed that an average swap would cost $0.39,
    while an NFT sale would average $0.65.&nbsp;&nbsp;</p><figure><img alt=\"Fees,
    Dencun Upgrade\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01958f51-e5d5-7312-b675-e2dfdc5edc6e\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Ethereum average gas
    fee. Source: YCharts&nbsp;</em></p></figcaption></figure><h2>Ether price has dropped
    53% since the Dencun Upgrade</h2><p>Despite the sharp drop in gas fees, Ether
    (<a data-ct-non-breakable=\"null\" href=\"/ethereum-price\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">ETH</a>) price has declined by 53% since the Dencun
    upgrade.</p><p>During the upgrade in March 2024, ETH was trading above $4,070.
    One year later, as of March 13, 2025, ETH was valued at around $1,891, according
    to CoinGecko data.</p><figure><img alt=\"Fees, Dencun Upgrade\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01958f51-a375-715f-8327-88a8033010d3\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Ether's 1-year price
    chart. Source: CoinGecko</em></p></figcaption></figure><p>In a statement sent
    to Cointelegraph, Dominik Harz, the co-founder of hybrid layer-2 Build on Bitcoin
    (BOB), said Ethereum has &ldquo;underperformed&rdquo; recently:</p><blockquote>&ldquo;Monday&rsquo;s
    price drop erased all DeFi TVL gains since Trump&rsquo;s election. Between Solana&rsquo;s
    memecoin frenzy and Ethereum&rsquo;s fractured few months, it&rsquo;s clear the
    industry is searching for a new, more sustainable and secure frontier for DeFi.&rdquo;&nbsp;</blockquote><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/more-than-50-of-validators-signal-to-increase-eth-gas-limit\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>More than
    50% of validators signal to increase ETH gas limit</strong></em></a></p><h2>Upcoming
    Pectra upgrade sees hiccups</h2><p>On March 5, Ethereum&rsquo;s next major upgrade,
    Pectra, <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/ethereum-pectra-upgrade-sepolia-testnet-mainnet-delay-possible\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">rolled out on its final
    testnet</a>, Sepolia. However, the team started seeing error messages and empty
    blocks being mined.</p><p>Ethereum developer Marius van der Wijden confirmed that
    a fix was deployed, but an unknown user later triggered the same error, leading
    to further issues. The development team has since <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/unknown-attacker-causes-issues-pectra-test-sepolia\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/unknown-attacker-causes-issues-pectra-test-sepolia\">managed
    to stabilize the testnet</a> and successfully process transactions.</p><p>Harz
    said that while these testnet issues are &ldquo;disrupting the mainnet launch,&rdquo;
    they are far from Ethereum&rsquo;s biggest problems. The executive said that once
    Pectra goes live, it will double the available data space for layer-2s, reduce
    costs and increase execution capacity.&nbsp;</p><p>&ldquo;While that&rsquo;s a
    step in the right direction, the reality is that Ethereum is quickly losing its
    position as the go-to chain for builders, and Pectra isn&rsquo;t the fix-all solution
    to its deeper issues,&rdquo; Harz said.&nbsp;</p><iframe width=\"100%\" height=\"315\"
    src=\"https://www.youtube.com/embed/FWo0hw_94a4?start=\" frameborder=\"0\" allow=\"accelerometer;
    autoplay; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen loading=\"lazy\"></iframe><p><em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/crypto-fans-obsessed-longevity-biohacking-why/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Crypto fans
    are obsessed with longevity and biohacking: Here&rsquo;s why</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"markets_outlook\" label=\"Subscription
    Form: Markets Outlook\"></template></p>\n</p>\n            "
  published: 2025-03-13 12:52:31 UTC
- title: " Wallet in Telegram to list 50 tokens and launch yield program "
  url: https://cointelegraph.com/news/wallet-in-telegram-50-tokens-eth-xrp-earn-program?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDIvMDE5NGRhYjUtMDc2Zi03ZmFkLTkxYTUtZDQyZjk4MjlhY2Nl.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDIvMDE5NGRhYjUtMDc2Zi03ZmFkLTkxYTUtZDQyZjk4MjlhY2Nl.jpg\"
    alt=\"Wallet in Telegram to list 50 tokens and launch yield program\"></p><p class=\"post-content__disclaimer\"
    type=\"\">Update (March 14, 9:40 am UTC: This article has been updated to add
    information on Wallet in Telegram&rsquo;s new on-ramp features.<p>Wallet in Telegram,
    a third-party cryptocurrency wallet Mini App on Telegram, is set to expand its
    custodial crypto services, adding at least 50 new cryptocurrencies and launching
    an earn feature for users.</p><p>The Open Platform (TOP), the largest venture
    builder in The Open Network (<a data-ct-non-breakable=\"null\" href=\"/toncoin-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">TON</a>) ecosystem,
    which manages Wallet in Telegram as one of its portfolio businesses, announced
    the rollout of the next wallet generation on March 13, introducing a wide range
    of new features.</p><p>With the rollout, Wallet in Telegram will add at least
    50 new crypto assets, including major cryptocurrencies Ether (<a data-ct-non-breakable=\"null\"
    href=\"/ethereum-price\" rel=\"null\" target=\"null\" text=\"null\" title=\"null\">ETH</a>)
    and XRP (<a data-ct-non-breakable=\"null\" href=\"/xrp-price-index\" rel=\"null\"
    target=\"null\" text=\"null\" title=\"null\">XRP</a>), as well as memecoins like
    Dogecoin (<a data-ct-non-breakable=\"null\" href=\"/doge-price-index\" rel=\"null\"
    target=\"null\" text=\"null\" title=\"null\">DOGE</a>) and Pepe (<a data-ct-non-breakable=\"null\"
    href=\"/pepe-price-index\" rel=\"null\" target=\"null\" text=\"null\" title=\"null\">PEPE</a>),
    a spokesperson for Wallet told Cointelegraph.</p><figure><img alt=\"Wallet, Rewards,
    XRP, Telegram, TON, Memecoin\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01958f6e-1e4e-7c66-8f4d-9236f0eb470c\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Source: Wallet in
    Telegram</em></p></figcaption></figure><p>Wallet&rsquo;s new generation is set
    to be rolled out within the next two months and will also introduce an &ldquo;Earn&rdquo;
    feature, which will allow users to <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/learn/articles/decentralized-finance-a-beginners-guide-to-earning-passive-income-with-defi\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">gain yields</a> on assets
    including Tether&rsquo;s USDt (<a data-ct-non-breakable=\"null\" href=\"/tether-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">USDT</a>).</p><h2>Initial
    rollout limited to in-app transactions</h2><p>Initially, Wallet users will be
    able to buy, sell and hold non-TON tokens without onchain deposits or withdrawals,
    meaning <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/learn/articles/altcoins-for-beginners\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/learn/articles/altcoins-for-beginners\">altcoin</a>
    transactions to other wallets and exchanges will not be allowed.</p><p>&ldquo;The
    current stage of the rollout is only available for in-app transactions for non-TON
    tokens,&rdquo; Wallet&rsquo;s spokesperson said, adding that the altcoin option
    is only available for trading within the <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/telegram-wallet-avoided-self-custody\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/telegram-wallet-avoided-self-custody\">custodial
    wallet</a>. The spokesperson added:</p><blockquote>&ldquo;We focus primarily on
    the TON Ecosystem and maintain a full range of operations for TON-native tokens
    within the custodial Wallet. At the same time, we see consumer interest in expanding
    the portfolio with other assets and want to provide them with such an option in
    trade-only mode.&rdquo;</blockquote><p>&ldquo;The list of tokens is not final
    yet, as it will be rolling out gradually within the next two months,&rdquo; the
    spokesperson said, adding that the first release will feature 50 assets, with
    a full list now being finalized.</p><h2>Wallet&rsquo;s Earn: Minimum deposit is
    0.1 TON</h2><p>In addition to expanding Wallet with a large number of altcoins,
    TOP is working to introduce the new &ldquo;Trade&rdquo; section and the &ldquo;Earn&rdquo;
    section.</p><p>Starting with Toncoin (<a data-ct-non-breakable=\"null\" href=\"/toncoin-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">TON</a>), the first
    Earn campaign will provide a &ldquo;flexible yield&rdquo; on TON deposits, with
    a minimum deposit amount of 0.1 TON.</p><p>&ldquo;The yield is generated from
    TON staking,&rdquo; the spokesperson for Wallet said.</p><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/telegram-wallet-fee-usdt-deposits-withdrawal\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/telegram-wallet-fee-usdt-deposits-withdrawal\"><em><strong>Wallet
    enables zero-fee USDT deposits; withdrawal fees remain the same</strong></em></a></p><p>Wallet
    also plans to expand the earn offering to more altcoins and stablecoins, including
    Tether&rsquo;s USDt (<a data-ct-non-breakable=\"null\" href=\"/tether-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">USDT</a>), the announcement
    stated.</p><h2>Additional on-ramps are coming</h2><p>In addition to introducing
    more trading and earning options, Wallet in Telegram has been boosting its on-ramp
    options recently.</p><p>In mid-March, the crypto infrastructure firm Mercuryo
    integrated its on-ramp solution into Wallet in Telegram.</p><p>The solution has
    allowed users in certain countries to buy default-supported assets like BTC, TON
    and USDT with US dollars and euros through its platform, TOP CEO Andrew Rogozov
    told Cointelegraph.</p><p>The new on-ramp option joins previously available options
    to deposit funds into Wallet in Telegram using debit cards.</p><p>As Mercuryo&rsquo;s
    current integration only supports on-ramps &mdash; or deposits &mdash; the off-ramp
    feature is planned for launch in the second quarter of 2025.</p><p> <em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/china-memecoin-factory-hk-firm-dumps-bitcoin-asia-express/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Mystery
    celeb memecoin scam factory, HK firm dumps Bitcoin: Asia Express</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"markets_outlook\" label=\"Subscription
    Form: Markets Outlook\"></template></p>\n</p>\n            "

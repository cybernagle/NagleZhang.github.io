- title: " DeGods NFT founder steps down as collection gains traction "
  url: https://cointelegraph.com/news/degods-frank-steps-down-ceo-nft-sales-surge?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "The creator of the non-fungible token (NFT) collection DeGods announced
    that he has stepped down as the CEO of the project amid an uptick in sales. Rohun
    Vora, known online as “Frank DeGods” on X, said he has stepped down as the project’s
    CEO, concluding a three-year stint as the head of one of the most popular Solana-based
    NFT collections. He identified pseudonymous figures 0x_chill and Pastagotsauce
    as the new leaders of DeGods. “There are no investigations, because I have never
    done anything illegal. That’s the boring truth,” Vora wrote, addressing speculation
    about his departure.  The announcement came as the NFT collection started gaining
    traction on the Ethereum and Solana blockchains. Source: FrankdegodsDeGods’ sales
    are up 101% on SolanaData tracker CryptoSlam shows that in the last seven days,
    DeGods NFTs have seen a significant increase in sales. On May 12, DeGods on Solana
    recorded a sales volume of around $458,000, a 101% increase over the previous
    week. In the last 30 days, the collection had a sales volume of $1.1 million for
    its NFTs based on the Solana network. On Ethereum, the DeGods collection recorded
    $104,000 in sales for the past week, a 156% growth over the previous seven days.
    In the last 30 days, the collection recorded over $250,000 in sales, a 323% increase
    in sales volumes. Following the announcement, new DeGods project lead Pasta shared
    plans to release a tribute to the project’s three-year history and teased a shift
    in strategy.Pasta also hinted that there will be changes in the project’s approach.
    “Our job isn’t to build crypto products. It’s to make DeGods as big as it can
    possibly be. That’s what you want. That’s what we want too. So that’s exactly
    what we’re gonna do,” Pasta wrote. Source: PastagotsauceRelated: Doodles NFT sales
    surge 97% ahead of DOOD token airdropNFT sales are up by 17% in the last seven
    daysMeanwhile, the broader NFT market has also gained traction in the last seven
    days. CryptoSlam data shows that from May 6 to 12, NFTs recorded a sales volume
    of over $120 million, a 17% increase over the previous week. Magazine: Trump-Biden
    bet led to obsession with ‘idiotic’ NFTs —Batsoupyum, NFT Collector\n\n            "

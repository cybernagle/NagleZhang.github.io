- title: " Rising $219B stablecoin supply signals mid-bull cycle, not market top "
  url: https://cointelegraph.com/news/rising-219-b-stablecoin-supply-mid-bull-cycle-not-top?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "The current crypto market correction is merely the middle of the bull
    cycle, not the top, based on the steadily growing stablecoin supply, which may
    signal more incoming investment according to analysts.The cumulative stablecoin
    supply has surpassed $219 billion, suggesting that the current cycle is still
    far from its top.Source: IntoTheBlockHistorically, stablecoin supply peaks have
    aligned with crypto cycle tops, according to a March 14 X post by crypto intelligence
    platform IntoTheBlock, which wrote:“In April 2022, supply hit $187B—just as the
    bear market started. Now it’s at $219B and still rising, suggesting we’re likely
    still mid-cycle.”Increasing stablecoin inflows to crypto exchanges can signal
    incoming buying pressure and growing investor appetite, as stablecoins are the
    main investor on-ramp from fiat to the crypto world. Still, Ether (ETH) price
    is down over 52% over the past three months, after it peaked above $4,100 on Dec.
    16, 2024, and analysts are eying another decline below $1,900, a “robust” demand
    zone that may bring more investment into the world’s largest cryptocurrency.Related:
    Bitcoin needs weekly close above $81K to avoid downside ahead of FOMCCrypto market
    will likely lack direction ahead of FOMC meeting: analystDespite the rising stablecoin

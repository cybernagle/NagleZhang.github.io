- title: " FTX liquidated $1.5B in 3AC assets 2 weeks before hedge fund’s collapse "
  url: https://cointelegraph.com/news/ftx-liquidated-three-arrows-capital-assets-before-collapse?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMTEvMDE5MzQ0ZTgtYjczMi03NWI2LWE1OWItNDJiYjQ5ZTJkNTMw.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMTEvMDE5MzQ0ZTgtYjczMi03NWI2LWE1OWItNDJiYjQ5ZTJkNTMw.jpg\"
    alt=\"FTX liquidated $1.5B in 3AC assets 2 weeks before hedge fund’s collapse\"></p><p>Newly
    revealed court documents show that FTX secretly liquidated $1.53 billion in Three
    Arrows Capital (3AC) assets just two weeks before the hedge fund collapsed in
    2022. The disclosure challenged previous narratives that 3AC&rsquo;s downfall
    was solely market-driven.<p>Once valued at over $10 billion, 3AC <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/3ac-a-10b-hedge-fund-gone-bust-with-founders-on-the-run\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/3ac-a-10b-hedge-fund-gone-bust-with-founders-on-the-run\">collapsed
    in mid-2022</a> after a series of leveraged directional trades turned sour. The
    hedge fund had borrowed from over 20 large institutions before the May 2022 crypto
    crash, which saw Bitcoin (<a data-ct-non-breakable=\"null\" href=\"/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>) fall to $16,000.</p><p>However,
    recently-discovered evidence shows that the FTX exchange liquidated $1.53 billion
    worth of 3AC&rsquo;s assets just two weeks ahead of the hedge fund&rsquo;s collapse.</p><p>3AC
    &ldquo;asked a bankruptcy court to let it increase its claim against FTX from
    $120 million to $1.53 billion,&rdquo; <a data-ct-non-breakable=\"null\" href=\"https://x.com/Mbottjer/status/1900314697192075469\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://x.com/Mbottjer/status/1900314697192075469\">according</a>
    to &ldquo;Mbottjer,&rdquo; the pseudonymous co-founder of FTX Creditor, a group
    FTX creditors and bankruptcy claim buyers.</p><p>&ldquo;3AC says it only recently
    discovered evidence that FTX liquidated $1.53B of 3AC&rsquo;s assets just two
    weeks before 3AC itself went into liquidation, much more than the $120M originally
    claimed,&rdquo; they stated.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195944d-665b-7f82-9dd6-250e01782d5b\"
    title=\"\" alt=\"FTX liquidated $1.5B in 3AC assets 2 weeks before hedge fund&rsquo;s
    collapse\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/Mbottjer/status/1900314697192075469\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"https://x.com/Mbottjer/status/1900314697192075469\"><em>Mbottjer</em></a></p></figcaption></figure><p>The
    crypto hedge fund claims it was never notified of these liquidations due to FTX&rsquo;s
    own bankruptcy proceedings. A court ruled that 3AC acted in good faith, allowing
    it to pursue its full $1.53 billion claim in FTX&rsquo;s bankruptcy case.</p><p>On
    Dec. 21, 2023, a British Virgin Islands court <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/3ac-founders-1-billion-frozen-court\" rel=\"null\"
    target=\"null\" text=\"null\" title=\"null\">froze $1.14 billion worth</a> of
    3AC co-founder Kyle Davies and Su Zhu&rsquo;s assets. Teneo has since estimated
    that 3AC creditors are still owed roughly $3.3 billion following the <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/3ac-a-10b-hedge-fund-gone-bust-with-founders-on-the-run\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">hedge fund&rsquo;s collapse
    in 2022</a>.</p><p>Davies claimed that allegations from Teneo &mdash; the firm
    in charge of 3AC&rsquo;s liquidation &mdash; that he and co-founder <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/top-people-in-crypto-and-blockchain-2023/su-zhu-and-alex-mashinsky\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Su Zhu</a> were &ldquo;not
    cooperating&rdquo; were exaggerated.</p><p><em><strong>Related: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/us-bankruptcy-court-nods-three-arrow-bid-increase-claim-against-ftx\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>US court
    gives Three Arrows nod to increase its FTX claim to $1.53B</strong></em></a></p><h2>Missing
    $1.5 billion not enough to avoid 3AC collapse</h2><p>While the $1.53 billion sum
    is significantly larger than FTX&rsquo;s previously disclosed liquidations, it
    may not have been enough to save 3AC from bankruptcy, according to Nicolai Sondergaard,
    research analyst at Nansen:</p><blockquote>&ldquo;From what I can see, even if
    they in 2022 had the additional $1.5 billion they still would not have been able
    to meet creditor claims/debt repayments.&rdquo;</blockquote><p><em><strong>&ldquo;</strong></em>Without
    being a legal expert, it seems to me that 3AC, while being allowed to pursue a
    much larger amount, likely won&rsquo;t get the full $1.53 billion claim. It seems
    realistic that they will get more, but how much is uncertain,&rdquo; the analyst
    added.</p><p><em><strong>Related: </strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/3-ac-liquidators-file-1-3-b-claim-against-terraform-labs\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>3AC liquidators
    file $1.3B claim against Terraform Labs</strong></em></a></p><p>Binance co-founder
    and former CEO Changpeng Zhao called the revelations an &ldquo;interesting turn
    of events.&rdquo;</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195944d-6a43-777f-920a-1b193839e257\"
    title=\"\" alt=\"FTX liquidated $1.5B in 3AC assets 2 weeks before hedge fund&rsquo;s
    collapse\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/cz_binance/status/1900444387907428838\" rel=\"nofollow noopener\"
    target=\"_blank\" text=\"null\" title=\"https://x.com/cz_binance/status/1900444387907428838\"><em>CZ
    BNB</em></a></p></figcaption></figure><p>&ldquo;I am curious if FTX had anything
    to do with the LUNA/UST crash/depeg in May 2022,&rdquo; Zhao said in a March 14
    X post.</p><p>The collapse of 3AC occurred a month after that of Terraform Labs&rsquo;
    Terra (<a data-ct-non-breakable=\"null\" href=\"/terra-classic-price-index\" rel=\"null\"
    target=\"null\" text=\"null\" title=\"null\">LUNC</a>) and TerraClassicUSD (<a
    data-ct-non-breakable=\"null\" href=\"/terraclassicusd-price-index\" rel=\"null\"
    target=\"null\" text=\"null\" title=\"null\">USTC</a>) tokens and shortly before
    crypto lender Celsius <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/celsius-reportedly-seeks-advice-from-lawyers-on-restructuring\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">paused all user withdrawals</a>
    after its native token Celsius (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/celsius-cel-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">CEL</a>) <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/celsius-crisis-exposes-problems-of-low-liquidity-in-bear-markets\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">dropped 90%</a>.</p><iframe
    width=\"100%\" height=\"315\" src=\"https://www.youtube.com/embed/tVMMJ6rr4so?start=\"
    frameborder=\"0\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope;
    picture-in-picture\" allowfullscreen loading=\"lazy\"></iframe><p><em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/victims-ftx-hong-kong-civil-suit-gemini-singapore-express/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>&lsquo;Hong
    Kong&rsquo;s FTX&rsquo; victims win lawsuit, bankers bash stablecoins: Asia Express</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"defi_newsletter\" label=\"Subscription
    Form: DeFi Newsletter\"></template></p>\n</p>\n            "

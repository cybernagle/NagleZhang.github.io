- title: " Price analysis 3/14: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI, LEO, LINK "
  url: https://cointelegraph.com/news/price-analysis-3-14-btc-eth-xrp-bnb-sol-ada-doge-pi-leo-link?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Bitcoin (BTC) has risen back above the 200-day simple moving average ($83,754),
    indicating that the bulls are attempting a comeback. The failure of the bears
    to capitalize on the drop below the 200-day SMA shows that selling dries up at
    lower levels.However, Bitcoin may not be out of the woods yet. Crypto analyst
    Matthew Hyland said in a video posted to X that Bitcoin needs a weekly close above
    $89,000 to confirm a bottom. A move above $89,000 could liquidate roughly $1.60
    billion in short positions, according to CoinGlass data. If that does not happen,
    Hyland warns that Bitcoin will fall into the $74,000 to $69,000 range.Crypto market
    data daily view. Source: Coin360Buyers have a challenging task ahead of them.
    The inflows of $13.3 million into US spot Bitcoin exchange-traded funds (ETFs)
    on March 12 could not be sustained, and the ETFs recorded outflows of $135.2 million

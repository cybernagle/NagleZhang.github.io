- title: " Now is not the time for a restaking revival "
  url: https://cointelegraph.com/news/not-the-time-for-a-restaking-revival?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Opinion by: Alon Muroch, founder of SSV LabsEven though Ethereum remains
    a leader in terms of total value locked (TVL), things aren’t looking great. Network
    activity is hemorrhaging, and momentum is slipping. Ethereum has become locked
    in a fight for its future. Without meaningful change, Ethereum risks becoming
    inaccessible to the builders and users it needs to thrive. Ethereum needs fresh
    ideas to bolster the ecosystem out of its slump, unify it, and genuinely support
    innovation.Enter based applications (bApps), which are any application or service
    that uses the Ethereum validator set for security. Inspired by the based movement,
    bApps enable any project to bootstrap directly from the Ethereum layer 1 (L1),
    enabling interoperable, scalable and cost-effective development.High stakes and
    high costsThe recent decline in network activity highlights a deep issue across
    Ethereum, and it boils down to UX. The race to scale a blockchain isn’t just about
    TVL and transactions per second (TPS). It’s about the experience of users and
    developers who co-create the ecosystem. Ease of development and interoperable
    developer ecosystems and applications are paramount. Improving the developer experience
    is crucial for improving user experience, which drives adoption.Today, builders
    are presented with two options. The first and more popular one is restaking, which
    has become the default mechanism for bootstrapping new services by locking up
    validators’ withdrawal keys or large amounts of capital for security. That leaves
    teams with only one other inconvenient alternative: self-bootstrapping. Building
    a validator set from scratch is resource-heavy, technically complex and often
    starts off centralized. Both choices are limiting for builders and don’t solve
    the fragmentation problems we see today in Ethereum.It is not just builders but
    validators that are affected by this system. In the current restaking setup, validators
    who want to earn more yield by supporting new services must restake, lock up their
    withdrawal keys, and take on additional risk. By locking up withdrawal keys to
    secure applications with slashable capital, validators are exposed to cascading
    risks, which, at scale, could affect Ethereum itself — a core departure from Ethereum’s
    founding vision.bApps are more securebApps provide a third, more accessible option
    for self-bootstrapping and restaking. Using based security infrastructure drastically
    lowers entry barriers for any size protocol to build securely and sustainably,
    all while preserving the traditional network effects of Ethereum. Validators are
    incentivized to join through risk-free yield opportunities; developers can affordably
    access security to build; and users benefit from a unified and interoperable ecosystem.Recent:
    SSV Network to create ‘based’ apps infrastructure for EthereumMission-critical
    services like rollups, bridges and oracles don’t need to reinvent the wheel. They
    simply plug into an existing, trusted security model. Using Ethereum validators
    as a primary security base, any out-of-protocol service can inherit the Ethereum
    L1’s decentralization and Sybil resistance. It’s also possible to extend this
    paradigm beyond Ethereum, enabling other L1 validators to secure bApps. This potentially
    turns bApps into a marketplace for multichain security, dramatically reducing
    the complexity (and cost) for developers and raising the bar for the entire ecosystem,
    offering a “based” path forward.bApps empower validators to earn more with their
    existing stake. By primarily using the validator principle as non-slashable security,
    validators can opt into many services through their existing Ethereum validator
    role without needing to restake or supply extra stakes. This would encourage broader
    validator participation, especially from smaller or more risk-averse operators,
    which is excellent considering solo stakers are an important ecosystem pillar.bApps
    unlock scalabilitybApps also revolutionize Ethereum’s current bootstrapping ecosystem,
    which relies heavily on slashable capital. In restaking, one participant’s gain
    may directly correspond to another’s loss, creating a zero-sum model. Building
    a competitive dynamic where participants must add or reallocate resources instead
    of sharing them, consequently working against new entrants by creating competition
    for limited attention and resources.The based economy, conversely, promotes an
    infinite-sum game, transforming competition for resources into a synergistic environment
    where new applications, services and participants increase the overall value of
    the platform. Each new validator increases security for bApps, and each new bApp
    provides new opportunities for validators. This infinitely scalable model breaks
    free from the limitations of a zero-sum model, enabling seamless bootstrapping,
    rewarding innovation and building more secure, inclusive and resilient ecosystems.Unifying
    Ethereum’s fractured ecosystemFor Ethereum to grow, fragmentation has to be addressed.
    Builders need building blocks, which need to be secure, low-cost, interoperable
    and scalable. Think about what cloud computing did for Web2. BApps offer just
    that — by introducing an infinite-sum game, they unlock scalability and provide
    a safe and affordable way to bootstrap with Ethereum’s proof-of-stake network.If
    Ethereum is to be the foundation of tomorrow’s decentralized world, it must empower
    the builders of today. The way forward is to solve Ethereum’s user and developer
    experience problem with a based infrastructure. Going based is the clear solution.Opinion
    by: Alon Muroch, founder of SSV Labs. This article is for general information
    purposes and is not intended to be and should not be taken as legal or investment
    advice. The views, thoughts, and opinions expressed here are the author’s alone
    and do not necessarily reflect or represent the views and opinions of Cointelegraph.\n\n
    \           "

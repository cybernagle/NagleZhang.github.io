- title: " Wallet in Telegram to list 50 tokens and launch yield program "
  url: https://cointelegraph.com/news/wallet-in-telegram-50-tokens-eth-xrp-earn-program?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDIvMDE5NGRhYjUtMDc2Zi03ZmFkLTkxYTUtZDQyZjk4MjlhY2Nl.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDIvMDE5NGRhYjUtMDc2Zi03ZmFkLTkxYTUtZDQyZjk4MjlhY2Nl.jpg\"
    alt=\"Wallet in Telegram to list 50 tokens and launch yield program\"></p><p class=\"post-content__disclaimer\"
    type=\"\">Update (March 14, 9:40 am UTC: This article has been updated to add
    information on Wallet in Telegram&rsquo;s new on-ramp features.<p>Wallet in Telegram,
    a third-party cryptocurrency wallet Mini App on Telegram, is set to expand its
    custodial crypto services, adding at least 50 new cryptocurrencies and launching
    an earn feature for users.</p><p>The Open Platform (TOP), the largest venture
    builder in The Open Network (<a data-ct-non-breakable=\"null\" href=\"/toncoin-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">TON</a>) ecosystem,
    which manages Wallet in Telegram as one of its portfolio businesses, announced
    the rollout of the next wallet generation on March 13, introducing a wide range
    of new features.</p><p>With the rollout, Wallet in Telegram will add at least
    50 new crypto assets, including major cryptocurrencies Ether (<a data-ct-non-breakable=\"null\"
    href=\"/ethereum-price\" rel=\"null\" target=\"null\" text=\"null\" title=\"null\">ETH</a>)
    and XRP (<a data-ct-non-breakable=\"null\" href=\"/xrp-price-index\" rel=\"null\"
    target=\"null\" text=\"null\" title=\"null\">XRP</a>), as well as memecoins like
    Dogecoin (<a data-ct-non-breakable=\"null\" href=\"/doge-price-index\" rel=\"null\"
    target=\"null\" text=\"null\" title=\"null\">DOGE</a>) and Pepe (<a data-ct-non-breakable=\"null\"
    href=\"/pepe-price-index\" rel=\"null\" target=\"null\" text=\"null\" title=\"null\">PEPE</a>),
    a spokesperson for Wallet told Cointelegraph.</p><figure><img alt=\"Wallet, Rewards,
    XRP, Telegram, TON, Memecoin\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01958f6e-1e4e-7c66-8f4d-9236f0eb470c\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Source: Wallet in
    Telegram</em></p></figcaption></figure><p>Wallet&rsquo;s new generation is set
    to be rolled out within the next two months and will also introduce an &ldquo;Earn&rdquo;
    feature, which will allow users to <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/learn/articles/decentralized-finance-a-beginners-guide-to-earning-passive-income-with-defi\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">gain yields</a> on assets
    including Tether&rsquo;s USDt (<a data-ct-non-breakable=\"null\" href=\"/tether-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">USDT</a>).</p><h2>Initial
    rollout limited to in-app transactions</h2><p>Initially, Wallet users will be
    able to buy, sell and hold non-TON tokens without onchain deposits or withdrawals,
    meaning <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/learn/articles/altcoins-for-beginners\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/learn/articles/altcoins-for-beginners\">altcoin</a>
    transactions to other wallets and exchanges will not be allowed.</p><p>&ldquo;The
    current stage of the rollout is only available for in-app transactions for non-TON
    tokens,&rdquo; Wallet&rsquo;s spokesperson said, adding that the altcoin option
    is only available for trading within the <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/telegram-wallet-avoided-self-custody\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/telegram-wallet-avoided-self-custody\">custodial
    wallet</a>. The spokesperson added:</p><blockquote>&ldquo;We focus primarily on
    the TON Ecosystem and maintain a full range of operations for TON-native tokens
    within the custodial Wallet. At the same time, we see consumer interest in expanding
    the portfolio with other assets and want to provide them with such an option in
    trade-only mode.&rdquo;</blockquote><p>&ldquo;The list of tokens is not final
    yet, as it will be rolling out gradually within the next two months,&rdquo; the
    spokesperson said, adding that the first release will feature 50 assets, with
    a full list now being finalized.</p><h2>Wallet&rsquo;s Earn: Minimum deposit is
    0.1 TON</h2><p>In addition to expanding Wallet with a large number of altcoins,
    TOP is working to introduce the new &ldquo;Trade&rdquo; section and the &ldquo;Earn&rdquo;
    section.</p><p>Starting with Toncoin (<a data-ct-non-breakable=\"null\" href=\"/toncoin-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">TON</a>), the first
    Earn campaign will provide a &ldquo;flexible yield&rdquo; on TON deposits, with
    a minimum deposit amount of 0.1 TON.</p><p>&ldquo;The yield is generated from
    TON staking,&rdquo; the spokesperson for Wallet said.</p><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/telegram-wallet-fee-usdt-deposits-withdrawal\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/telegram-wallet-fee-usdt-deposits-withdrawal\"><em><strong>Wallet
    enables zero-fee USDT deposits; withdrawal fees remain the same</strong></em></a></p><p>Wallet
    also plans to expand the earn offering to more altcoins and stablecoins, including
    Tether&rsquo;s USDt (<a data-ct-non-breakable=\"null\" href=\"/tether-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">USDT</a>), the announcement
    stated.</p><h2>Additional on-ramps are coming</h2><p>In addition to introducing
    more trading and earning options, Wallet in Telegram has been boosting its on-ramp
    options recently.</p><p>In mid-March, the crypto infrastructure firm Mercuryo
    integrated its on-ramp solution into Wallet in Telegram.</p><p>The solution has
    allowed users in certain countries to buy default-supported assets like BTC, TON
    and USDT with US dollars and euros through its platform, TOP CEO Andrew Rogozov
    told Cointelegraph.</p><p>The new on-ramp option joins previously available options
    to deposit funds into Wallet in Telegram using debit cards.</p><p>As Mercuryo&rsquo;s
    current integration only supports on-ramps &mdash; or deposits &mdash; the off-ramp
    feature is planned for launch in the second quarter of 2025.</p><p> <em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/china-memecoin-factory-hk-firm-dumps-bitcoin-asia-express/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Mystery
    celeb memecoin scam factory, HK firm dumps Bitcoin: Asia Express</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"markets_outlook\" label=\"Subscription
    Form: Markets Outlook\"></template></p>\n</p>\n            "
  published: 2025-03-13 12:28:05 UTC
- title: " Bybit CEO on ‘brutal’ $4M Hyperliquid loss: Lower leverage as positions
    grow "
  url: https://cointelegraph.com/news/hyperliquid-4-million-loss-leverage-eth-trader?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDIvMDE5NTJlMTMtNDUzYS03OWQ5LTgyOTUtNzI1NjcxY2MwODg5.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDIvMDE5NTJlMTMtNDUzYS03OWQ5LTgyOTUtNzI1NjcxY2MwODg5.jpg\"
    alt=\"Bybit CEO on ‘brutal’ $4M Hyperliquid loss: Lower leverage as positions
    grow\"></p><p>Bybit CEO Ben Zhou commented on a recent $4 million loss suffered
    by decentralized exchange (DEX) Hyperliquid due to an Ether whale&rsquo;s high-leverage
    trade, noting that centralized exchanges (CEXs) face similar challenges.<p>On
    March 12, a crypto investor walked away with $1.8 million and forced the Hyperliquidity
    Pool (HLP) to bear a $4 million loss after a trade that used leverage on the Hyperliquid
    decentralized exchange (DEX).&nbsp;</p><p>The trader <a data-ct-non-breakable=\"null\"
    href=\"https://hyperdash.info/trader/0xf3f496c9486be5924a93d67e98298733bb47057c\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">used</a> about 50x leverage
    to turn $10 million into a $270 million Ether (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/ethereum-price\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">ETH</a>) long position. However, the trader couldn&rsquo;t
    exit without tanking their own position. Instead, they withdrew collateral, offloading
    assets without triggering a self-inflicted price drop, leaving Hyperliquid to
    cover the losses.</p><p>Smart contract auditor Three Sigma <a data-ct-non-breakable=\"null\"
    href=\"https://x.com/threesigmaxyz/status/1899798137000145067\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">said</a> the trade was a &ldquo;brutal game of liquidity
    mechanics,&rdquo; not a bug or an exploit. Hyperliquid also clarified that this
    was not a protocol exploit or a hack.&nbsp;</p><figure><img alt=\"Bybit CEO on
    &lsquo;brutal&rsquo; $4M Hyperliquid loss: Lower leverage as positions grow\"
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958eab-acea-7e3c-bc07-eee9f465afed\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/HyperliquidX/status/1899768864705237211\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"https://x.com/HyperliquidX/status/1899768864705237211\"><em>Hyperliquid</em></a></p></figcaption></figure><h2>Hyperliquid
    lowers leverage trading for BTC and ETH</h2><p>In response to the trade, Hyperliquid
    lowered its Bitcoin (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>) leverage to
    40x and its ETH leverage allowance to 25x. This increases the maintenance margin
    requirements for larger positions on the DEX. &ldquo;This will provide a better
    buffer for backstop liquidations of larger positions,&rdquo; Hyperliquid stated.&nbsp;</p><p>In
    an X post, the Bybit CEO <a data-ct-non-breakable=\"null\" href=\"https://x.com/benbybit/status/1900060802490433801?s=19\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">commented</a> on the
    trade, saying that CEXs are also subjected to the same situation. Zhou said their
    liquidation engine takes over whale positions when they get liquidated. While
    lowering the leverage may be an effective solution, Zhou said this could be bad
    for business:&nbsp;</p><blockquote>&ldquo;I see that HP has already lowered their
    overall leverage; that&rsquo;s one way to do it and probably the most effective
    one, however, this will hurt business as users would want higher leverage.&rdquo;</blockquote><p>Zhou
    suggested a more dynamic risk limit mechanism that reduces the overall leverage
    as the position grows. The executive said that in a centralized platform, the
    whale would go down to a leverage of 1.5x with the huge amount of open positions.
    Despite this, the executive recognized that users could still use multiple accounts
    to achieve the same results.</p><p>The Bybit CEO added that even the lowered leverage
    capabilities could still be &ldquo;abused&rdquo; unless the DEX implements risk
    management measures such as surveillance and monitoring to spot &ldquo;market
    manipulators&rdquo; on the same level as a CEX.&nbsp;</p><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/crypto-trader-loses-least-215000-stablecoins-from-sandwich-attack\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Crypto trader
    gets sandwich attacked in stablecoin swap, loses $215K</strong></em></a></p><h2>Hyperliquid
    sees $166 million net outflow</h2><p>Following the liquidation event of the ETH
    whale and the losses the HLP Vault suffered, the protocol experienced a massive
    outflow of its assets under management. Dune Analytics data <a data-ct-non-breakable=\"null\"
    href=\"https://dune.com/queries/4845239/8026924\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">shows</a> that Hyperliquid had a net outflow of $166
    million on March 12, the same day as the trade.&nbsp;</p><template data-ct-widget=\"buzzsprout\"
    data-buzzsprout-podcast-id=\"2096415\" data-buzzsprout-episode-id=\"16616214\"></template><p><em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/crypto-fans-obsessed-longevity-biohacking-why/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Crypto fans
    are obsessed with longevity and biohacking: Here&rsquo;s why</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"defi_newsletter\" label=\"Subscription
    Form: DeFi Newsletter\"></template></p>\n</p>\n            "
  published: 2025-03-13 09:09:29 UTC
- title: " 3 reasons why Ethereum can outperform its rivals after crashing to 17-month
    lows "
  url: https://cointelegraph.com/news/ethereum-can-outperform-rivals-crashing-17-month-lows?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMTEvMDE5MzBhYzctNWQ4Zi03MDgxLWIzMDItZWNlZjk1ZDI0MTkx.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMTEvMDE5MzBhYzctNWQ4Zi03MDgxLWIzMDItZWNlZjk1ZDI0MTkx.jpg\"
    alt=\"3 reasons why Ethereum can outperform its rivals after crashing to 17-month
    lows\"></p><p>Ether (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/ethereum-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">ETH</a>) fell 13% between
    March 8 and March 11 as investors moved to short-term fixed-income and cash positions,
    seeking safety amid a global tariff war and rising fears of an economic downturn.
    <h2>ETH price needs 29% gains to reclaim $2.5K</h2><p>Market concerns escalated
    after the United States responded to Canada&rsquo;s electricity surcharge with
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-dips-below-80-k-as-trump-canada-tariffs-risk-asset-relief\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-dips-below-80-k-as-trump-canada-tariffs-risk-asset-relief\">retaliatory
    measures</a>.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958a60-a4f1-70c1-a81f-364b51ec9588\"
    title=\"\" alt=\"3 reasons why Ethereum can outperform its rivals after crashing
    to 17-month lows\"><figcaption style=\"text-align: center;\"><p><em>S&amp;P 500
    futures (left, magenta) vs. Ether/USD (blue). Source: TradingView/Cointelegraph</em></p></figcaption></figure><p>Typically,
    traders tend to overreact, increasing the likelihood that Ether will rebound faster
    than other assets once market sentiment improves. While some argue that risk assets
    are driven by inflation and economic growth data, others believe gains depend
    on stimulus measures and monetary expansion.</p><p>Regardless of the catalyst
    for the next bull run, Ether price must climb 29% from its current $1,940 level
    to reclaim $2,500. This move will likely require increased demand from leveraged
    buyers, whose activity is now at its lowest point in five months.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958a60-a9f9-7177-9998-9a02dedebb56\"
    title=\"\" alt=\"3 reasons why Ethereum can outperform its rivals after crashing
    to 17-month lows\"><figcaption style=\"text-align: center;\"><p><em>ETH 2-month
    futures annualized premium. Source: Laevitas.ch/Cointelegraph</em></p></figcaption></figure><p>Traders
    want higher prices to compensate for longer settlement periods, making a 5% to
    10% annualized premium (basis rate) expected in neutral markets. When rates fall
    below this range&mdash;such as the current 4.5%&mdash;it signals weak bullish
    conviction.</p><p>Excessive optimism played a role in Ether&rsquo;s <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/ether-1-8k-correction-global-tariff-fears-eth-etf-outflows\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">recent correction</a>,
    as $235 million in leveraged long positions were liquidated between March 10 and
    March 11.</p><p>The panic selling drove ETH to a low of $1,744, its lowest level
    since October 2023. However, several indicators suggest a potential recovery,
    as ETH derivatives and onchain metrics show resilience.</p><h2><strong>Ethereum
    L2 network grows</strong></h2><p>Ether is trading 60% below its $4,868 all-time
    high from November 2021. This decline is largely due to increased competition
    in the smart contract sector and waning demand for applications such as non-fungible
    tokens (NFTs), <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/web3-gaming-capital-investments-axie-killers\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">gaming</a>, collectibles,
    metaverse projects, social networks, and Web3 infrastructure.</p><p>However, this
    perspective overlooks a key factor. In late 2021, the average transaction fee
    exceeded $50, while activity on Ethereum&rsquo;s layer-2 ecosystem was 97% lower
    than it is today. </p><p>For context, a token swap on Ethereum&rsquo;s base layer
    cost $1.70 on March 11 despite the number of daily average operations per second
    growing, highlighting notable progress in network efficiency.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958a60-ad74-71f4-97c0-890ac0aa544c\"
    title=\"\" alt=\"3 reasons why Ethereum can outperform its rivals after crashing
    to 17-month lows\"><figcaption style=\"text-align: center;\"><p><em>Ethereum layer-2
    daily average operations per second. Source: L2beat</em></p></figcaption></figure><p>Even
    if bots generate 80% of layer-2 transactions, the remaining 20% of activity on
    Base, Arbitrum, Optimism, ZKsync, and Blast is still roughly three times higher
    than Ethereum&rsquo;s base layer. However, critics have a valid argument: despite
    the surge in network activity, validators are earning significantly less compared
    to late 2021.</p><h2><strong>Ethereum regains DEX top-spot, TVL grows </strong></h2><p>Ethereum
    has reinforced its position as the second-most popular option for institutional
    investors in traditional finance, supported by $8.9 billion in spot exchange-traded
    funds (ETFs). </p><p>Meanwhile, competitors such as Solana <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/sec-delays-decision-xrp-solana-litecoin-dogecoin-etfs\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/sec-delays-decision-xrp-solana-litecoin-dogecoin-etfs\">still
    await regulatory approval</a> for similar ETF products. Even if they gain approval,
    they cannot match the first-mover advantage of the Grayscale Ethereum Trust, which
    began public trading on over-the-counter markets in June 2019.</p><p>Moreover,
    Ethereum smart contract deposits, measured by total value locked (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/explained/what-is-total-value-locked-tvl-in-crypto-and-why-does-it-matter\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/explained/what-is-total-value-locked-tvl-in-crypto-and-why-does-it-matter\">TVL</a>),
    reached their highest level since July 2022 in ETH terms on March 11, marking
    a 10% increase over the past two weeks.</p><p><em><strong>Related: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/the-strategic-crypto-reserve\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>The strategic
    crypto reserve will fuel ecosystem growth</strong></em></a></p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958a60-b35e-79ea-afd8-1eb380b0138c\"
    title=\"\" alt=\"3 reasons why Ethereum can outperform its rivals after crashing
    to 17-month lows\"><figcaption style=\"text-align: center;\"><p><em>Ethereum network
    TVL, ETH. Source: DefiLlama</em></p></figcaption></figure><p>At 24 million ETH,
    Ethereum&rsquo;s TVL has been driven by the growth of liquid staking, lending,
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/explained/defi-yield-farming-explained\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">yield farming</a>, and
    real-world asset tokenization. The network recently reclaimed its leading position
    in decentralized exchange volumes, reaching $20.5 billion over seven days and
    surpassing Solana&rsquo;s $13.9 billion, according to DefiLlama data.</p><p>This
    provided a bullish outlook for ETH&rsquo;s price, driven by <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/learn/articles/a-beginners-guide-on-blockchain-layer-2-scaling-solutions\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/learn/articles/a-beginners-guide-on-blockchain-layer-2-scaling-solutions\">layer-2</a>
    transactions nearing all-time highs, reclaiming of the top spot in DEX volume,
    and rising TVL deposits. </p><p>Ultimately, Ether&rsquo;s trend reversal remains
    highly dependent on macroeconomic improvements, but once stabilized, ETH is well-positioned
    to regain $2,500 as a key support level in the coming weeks.<br></p><p class=\"post-content__disclaimer\"
    type=\"\">This article is for general information purposes and is not intended
    to be and should not be taken as legal or investment advice. The views, thoughts,
    and opinions expressed here are the author&rsquo;s alone and do not necessarily
    reflect or represent the views and opinions of Cointelegraph.</p><template data-name=\"subscription_form\"
    data-type=\"markets_outlook\" label=\"Subscription Form: Markets Outlook\"></template></p>\n</p>\n

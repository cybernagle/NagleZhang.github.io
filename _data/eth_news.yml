- title: " Price predictions 5/19: SPX, DXY, BTC, ETH, XRP, BNB, SOL, DOGE, ADA, SUI "
  url: https://cointelegraph.com/news/price-predictions-5-19-spx-dxy-btc-eth-xrp-bnb-sol-doge-ada-sui?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Key points:Bitcoin’s rejection at $107,000 shows sellers are active at
    higher levels, but the recovery from the intraday low shows solid buying.Strategy
    and Metaplanet continue to accumulate Bitcoin, adding steady buy-side pressure
    to BTC price. Select altcoins have pulled back, but they have not yet turned negative.Bitcoin’s
    (BTC) attempt to challenge the all-time high faced a strong rejection near $107,100
    on May 19, signaling that the bears are unlikely to give up without a fight. However,

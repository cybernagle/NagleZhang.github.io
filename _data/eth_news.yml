- title: " AAVE soars 13% as buyback proposal passes among tokenholders "
  url: https://cointelegraph.com/news/aave-buyback-proposal-passes-among-holders?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Aave’s tokenholders approved a governance proposal to start buying back
    the decentralized finance (DeFi) protocol’s governance token, AAVE, as part of
    a broader tokenomics overhaul, Aave said on April 9. The proposal — which was
    approved by more than 99% of AAVE tokenholders — permits the protocol to purchase
    $4 million in AAVE (AAVE) tokens, enough for one month of buybacks. The move is
    a “first step” toward a broader plan to repurchase $1 million AAVE tokens weekly
    for six months. It is also the latest instance of DeFi protocols implementing
    buyback mechanisms in response to tokenholder demands.“The goal is to sustainably
    increase AAVE acquisition from the open market and distribute it to the Ecosystem
    Reserve,” the proposal said. The AAVE token’s price rallied more than 13% on April
    9, bringing the protocol’s market capitalization to more than $2.1 billion, according
    to data from CoinGecko.The buyback proposal passed with overwhelming support.
    Source: AaveRelated: Aave proposal to peg Ethena’s USDe to USDT sparks community
    pushbackBuybacks gain popularityIn March, the Aave Chan Initiative (ACI), a governance
    advisory group, proposed a tokenomics revamp that would include new revenue allocations
    for AAVE tokenholders, enhanced safety features for users, and the creation of
    an “Aave Finance Committee.”Aave is Web3’s most popular DeFi protocol, with total
    value locked surpassing $17.5 billion as of April 9, according to DefiLlama. It
    is also among DeFi’s biggest fee generators, with an estimated annualized fee
    income of $350 million, the data shows. Aave is DeFi’s most popular protocol by
    TVL. Source: DeFILlamaDeFi protocols are under increasing pressure to provide
    tokenholders with a share of protocol revenues — partly because US President Donald
    Trump has fostered a friendlier regulatory environment for DeFi protocols in the
    United States.Projects including Ethena, Ether.fi and Maple are piloting value-accrual
    mechanisms for their native tokens.In January, Maple Finance’s community floated
    buying back native SYRUP tokens and distributing them as rewards to stakers.In
    December, Ether.fi, a liquid restaking token issuer, tipped plans to direct 5%
    of protocol revenues toward buying back native ETHFI tokens. Similarly, Ethena,
    a yield-bearing stablecoin issuer, agreed to share some of its approximately $200
    million in protocol revenues with tokenholders in November.Magazine: DeFi will
    rise again after memecoins die down: Sasha Ivanov, X Hall of Flame\n\n            "

    (SOL) turned up from the 20-day EMA ($163) on May 17, but the bulls could not
    push the price above the $180 resistance.SOL/USDT daily chart. Source: Cointelegraph/TradingViewSellers
    are trying to pull and retain the price below the 20-day EMA. If they manage to

    objective of $31.73.Instead, if the price turns down from the overhead resistance,
    it suggests that the pair could remain range-bound between $15.27 and $23.50 for
    some time.This article does not contain investment advice or recommendations.
    Every investment and trading move involves risk, and readers should conduct their

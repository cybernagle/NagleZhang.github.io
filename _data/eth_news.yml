    the price turns down sharply from the current level, it will suggest that the
    sentiment remains negative. The pair may retest the crucial $2 support, and if
    this level gives way, the pair will complete a bearish head-and-shoulders pattern.
    That may sink the pair to $1.28.BNB price analysisBNB (BNB) rose above the 20-day
    EMA ($591) on March 13, but the bulls could not sustain the higher levels, as
    seen from the long wick on the candlestick.BNB/USDT daily chart. Source: Cointelegraph/TradingViewThe
    bulls are again trying to push the price above the 20-day EMA. The BNB/USDT pair
    could challenge the 50-day SMA ($624) if they can pull it off. A break and close
    above the 50-day SMA will suggest that the correction may be over. The pair could
    then attempt a rally to $686.If bears want to prevent the upside, they will have
    to yank the price below the $500 support. The pair may then fall to $460, which
    is expected to attract aggressive buying by the bulls.Solana price analysisSolana
    (SOL) has been trading above the $120 level, but the bulls have failed to push
    the price above $132.SOL/USDT daily chart. Source: Cointelegraph/TradingViewIf
    the price skids below $120, the SOL/USDT pair could drop to $110. This is a critical

- title: " US crypto funds top $7.5B inflows in 2025 as investor appetite grows "
  url: https://cointelegraph.com/news/crypto-funds-7-5-b-2025-recover-march-sell-off?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Crypto investment products in the United States have attracted over $7.5
    billion worth of investment in 2025, with a fifth week of net positive inflows
    last week signaling growing investor demand for digital assets.US-based crypto
    investment products attracted $785 million worth of investment last week, pushing
    the year-to-date (YTD) total to over $7.5 billion, according to a May 19 report
    by digital asset manager CoinShares. The latest figure marks the fifth consecutive
    week of net positive flows, following nearly $7 billion in outflows during February
    and March.Weekly crypto asset flows, USD, million. Source: CoinSharesThe United
    States accounted for the bulk of inflows, with $681 million, followed by Germany
    at $86.3 million and Hong Kong at $24.4 million.  Crypto flows by country. Source:
    CoinSharesInvestor demand for risk assets such as cryptocurrencies staged a significant
    recovery after the White House announced a 90-day pause on additional tariffs
    on May 12, which marked a 24% cut for import tariffs for both the US and China.A
    day after the announcement, Coinbase exchange saw 9,739 Bitcoin (BTC) worth more
    than $1 billion withdrawn from the exchange — the highest net outflow recorded
    in 2025, signaling that institutional appetite was “accelerating,” according to
    Bitwise head of European research, André Dragosch.Related: Tether surpasses Germany’s
    $111B of US Treasury holdingsEthereum leads with $205 million in weekly inflowsEther
    (ETH) was the top performer among crypto investment products, attracting $205
    million in inflows last week. That brings its year-to-date total to more than
    $575 million.  The report attributed the $200 million to renewed investor optimism
    following the successful Pectra upgrade and the appointment of new co-executive
    director Tomasz Stańczak.After initial delays, Ethereum’s Pectra upgrade went
    live on the mainnet on May 7, introducing improvements such as higher staking
    limits and account abstraction via EIP-7702.By contrast, Solana (SOL) investment
    products were the only major assets to see net outflows, with $890,000 withdrawn
    over the past week.  Related: Bitcoin breaks out while Coinbase breaks down: Finance
    RedefinedMeanwhile, Ethereum co-founder Vitalik Buterin published a proposal to
    preserve trustless, censorship-resistant access to Ethereum, aiming to make Ethereum
    layer-1 scaling “more friendly” to users running local nodes for personal use. “The
    plan would drastically reduce the 1.3TB data burden by allowing nodes to sync
    only relevant information, opening the door to broader participation,” Stella
    Zlatareva, Nexo Dispatch editor, told Cointelegraph.Magazine: Altcoin season to
    hit in Q2? Mantra’s plan to win trust: Hodler’s Digest, April 13 – 19\n\n            "

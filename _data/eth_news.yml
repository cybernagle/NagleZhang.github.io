- title: " Price analysis 3/26: BTC, ETH, XRP, BNB, SOL, DOGE, ADA, LINK, AVAX, XLM "
  url: https://cointelegraph.com/news/price-analysis-3-26-btc-eth-xrp-bnb-sol-doge-ada-link-avax-xlm?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Bitcoin (BTC) bulls have maintained the pressure and are attempting to
    push the price above the $90,000 resistance. A positive sign in favor of the bulls
    is that the US spot Bitcoin exchange-traded funds have witnessed net inflows for
    eight successive trading days, according to SoSoValue data. That indicates institutional
    investors are gradually buying again.In another positive, a Bitcoin whale bought
    2,400 Bitcoin — worth over $200 million — on March 24 to increase the total holding
    to more than 15,000 BTC, blockchain analytics firm Arkham Intelligence said in
    a post on X.Crypto market data daily view. Source: Coin360However, a Bitcoin rally
    may not be easy as bulls are expected to encounter solid selling near $90,000.
    Alphractal CEO Joao Wedson highlighted in a post on X that whales had closed long
    positions and initiated short positions on Bitcoin at $88,000. He added that history
    says the whales are right.Could Bitcoin break above the stiff overhead resistance,
    pulling altcoins higher, or is it time for a short-term correction? Let’s analyze
    the charts of the top 10 cryptocurrencies to find out.Bitcoin price analysisBitcoin
    is facing selling at the resistance line, but a positive sign is that the bulls
    have not allowed the price to dip below the 20-day exponential moving average
    ($85,825). BTC/USDT daily chart. Source: Cointelegraph/TradingViewThe flattening
    20-day EMA and the relative strength index (RSI) near the midpoint suggest that
    the bulls have a slight edge. A break and close above the 50-day simple moving
    average ($89,787) indicates that the correction may be over. The BTC/USDT pair
    could soar to $95,000 and later to the crucial resistance at $100,000.Contrary

- title: " Crypto trader gets sandwich attacked in stablecoin swap, loses $215K "
  url: https://cointelegraph.com/news/crypto-trader-loses-least-215000-stablecoins-from-sandwich-attack?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NThjNGQtNTA0My03YmFhLTgxZTUtNTExMmZhMjhkMTc4.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NThjNGQtNTA0My03YmFhLTgxZTUtNTExMmZhMjhkMTc4.jpg\"
    alt=\"Crypto trader gets sandwich attacked in stablecoin swap, loses $215K\"></p><p>A
    crypto trader fell victim to a sandwich attack while making a $220,764 stablecoin
    transfer on March 12 &mdash; losing almost 98% of its value to a Maximum Extractable
    Value (MEV) bot.<p>$220,764 worth of the USD Coin (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/usdc-price-index\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">USDC</a>) stablecoin was swapped to $5,271 of Tether
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/tether-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">USDT</a>) in eight seconds
    as the MEV bot successfully front-ran the transaction, banking over $215,500.</p><p><a
    data-ct-non-breakable=\"null\" href=\"https://etherscan.io/tx/0xee9fcd2b9996e96b642cb4cda47fc140f98fdaf07ee02657743d4bfcc4670106\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Data</a> from Ethereum
    block explorer shows the MEV attack occurred on <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/learn/articles/what-are-decentralized-exchanges-and-how-do-dexs-work\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">decentralized exchange
    </a>Uniswap v3&rsquo;s USDC-USDT liquidity pool, where $19.8 million <a data-ct-non-breakable=\"null\"
    href=\"https://app.uniswap.org/explore/pools/ethereum/0x7858E59e0C01EA06Df3aF3D20aC7B0003275D4Bf\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">worth</a> of value is
    locked.<br></p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958cd9-e19b-7a62-8876-f924873a55e1\"
    title=\"\" alt=\"Crypto trader gets sandwich attacked in stablecoin swap, loses
    $215K\"><figcaption style=\"text-align: center;\"><p><em>Details of the sandwich
    attack transaction. Source: </em><a data-ct-non-breakable=\"null\" href=\"https://etherscan.io/tx/0xee9fcd2b9996e96b642cb4cda47fc140f98fdaf07ee02657743d4bfcc4670106\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em>Etherscan</em></a></p></figcaption></figure><p>The
    MEV bot front-ran the transaction by swapping all the USDC liquidity out of the
    Uniswap v3 <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/explained/fake-crypto-liquidity-pools-how-to-spot-and-avoid-them\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">USDC-USDT pool</a> and
    then put it back in after the transaction was executed, <a data-ct-non-breakable=\"null\"
    href=\"https://x.com/JustDeauIt/status/1899869531511660688\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">according</a> to founder of The DeFi Report Michael
    Nadeau.</p><p>The attacker tipped <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/two-ethereum-entities-produced-88-blocks-centralization-concerns\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Ethereum block builder</a>
    &ldquo;bob-the-builder.eth&rdquo; $200,000 from the $220,764 swap and profited
    $8,000 themselves, Nadeau said.</p><p>DeFi researcher &ldquo;DeFiac&rdquo; <a
    data-ct-non-breakable=\"null\" href=\"https://x.com/TheDEFIac/status/1899875037823345126\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">speculates</a> the same
    trader using different wallets has fallen victim to a total of six sandwich attacks,
    citing &ldquo;internal tools.&rdquo; They <a data-ct-non-breakable=\"null\" href=\"https://x.com/TheDEFIac/status/1899875044383207669\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">pointed</a> out that
    all funds traveled from borrowing and lending protocol Aave before being deposited
    on Uniswap.</p><p>Two of the wallets fell victim to an MEV bot sandwich attack
    on March 12 at around 9:00 am UTC. Ethereum wallet addresses &ldquo;0xDDe&hellip;42a6D&rdquo;
    and &ldquo;0x999&hellip;1D215&rdquo; were <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/explained/sandwich-attacks-in-crypto-explained-how-to-stay-safe\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">sandwich attacked</a>
    for <a data-ct-non-breakable=\"null\" href=\"https://etherscan.io/tx/0xb403f921671c5f1494153f0b9543a0650ff1212a4b557f2ea53455107c94215c\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">$138,838</a> and <a
    data-ct-non-breakable=\"null\" href=\"https://etherscan.io/tx/0x636ca7a5f63a6698c82e860e610363e75d97184403fa06f9907243a84e25b68a\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">$128,003</a> in transactions
    that occurred three to four minutes earlier.</p><p>Both transactors made the same
    swap in the <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/explained/defi-liquidity-pools-explained\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Uniswap v3 liquidity
    pool</a> as the trader who made the $220,762 transfer.&nbsp;</p><p>Others speculate
    the trades could be <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bybit-hacker-launders-1-billion-stolen-funds\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">attempts at money laundering</a>.</p><p>&ldquo;If
    you have NK illicit funds you could construct a very mev-able tx, then privately
    send it to a mev bot and have them arb it in a bundle,&rdquo; <a data-ct-non-breakable=\"null\"
    href=\"https://x.com/0xngmi/status/1899781324010914112\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"https://x.com/0xngmi/status/1899781324010914112\">said</a>
    founder of crypto data dashboard DefiLlama, 0xngmi.</p><p>&ldquo;That way you
    wash all the money with close to 0 losses.&rdquo; </p><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/thorchain-crossroads-decentralized-collides-illicit-activity\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>THORChain
    at crossroads: Decentralization clashes with illicit activity</strong></em></a></p><p>While
    initially criticizing Uniswap, Nadeau later <a data-ct-non-breakable=\"null\"
    href=\"https://x.com/JustDeauIt/status/1899944120749318506\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">acknowledged</a> that the transactions didn&rsquo;t
    come from Uniswap's front end, which has MEV protection and <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/learn/articles/crypto-slippage-how-to-avoid\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">default slippage settings.</a></p><p>Nadeau
    backtracked on those criticisms after Uniswap CEO Hayden Adams and others clarified
    the protections Uniswap has in place to fight against sandwich attacks.<br></p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958cd9-e872-758c-a348-b72088d806a6\"
    title=\"\" alt=\"Crypto trader gets sandwich attacked in stablecoin swap, loses
    $215K\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/haydenzadams/status/1899928912395985182\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\"><em>Hayden Adams</em></a></p></figcaption></figure><p><em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/crypto-fans-obsessed-longevity-biohacking-why/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Crypto fans
    are obsessed with longevity and biohacking: Here&rsquo;s why</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"markets_outlook\" label=\"Subscription
    Form: Markets Outlook\"></template></p>\n</p>\n            "
  published: 2025-03-13 00:54:32 UTC
- title: " Will Ethereum price bottom at $1.6K? "
  url: https://cointelegraph.com/news/will-ethereum-price-bottom-1-6k?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NThhM2MtNjU2Ny03ZWQyLTk2M2QtZDkxMzlmZGQwZjZm.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NThhM2MtNjU2Ny03ZWQyLTk2M2QtZDkxMzlmZGQwZjZm.jpg\"
    alt=\"Will Ethereum price bottom at $1.6K?\"></p><p>Ethereum&rsquo;s native token,
    Ether (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/ethereum-price\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/ethereum-price\">ETH</a>),
    dropped below $2,000 on March 10, and the altcoin has struggled to regain a position
    above the psychological level. <p>While Bitcoin <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/bitcoin-price\" rel=\"\" target=\"_self\" text=\"null\"
    title=\"https://cointelegraph.com/bitcoin-price\">(BTC)</a> and XRP <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/xrp-price-index\" rel=\"\" target=\"_self\" text=\"null\"
    title=\"https://cointelegraph.com/xrp-price-index\">(XRP)</a> exhibited minor
    recoveries over the past 24 hours, Ether prices failed to display bullish momentum
    in the charts. </p><figure><img alt=\"Markets, Price Analysis, Market Analysis,
    Ethereum Price, Ethereum ETF\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01958a53-d269-727b-91c4-70758f3c6228\"
    title=\"\"></figure><p>The altcoin plummeted to a multi-year low of $1,752 on
    March 11. However, onchain data and technical analysis indicate that the price
    could drop an additional 15% in the coming weeks. </p><h2>Ethereum dips below
    realized price after 2 years</h2><p>The current price deviation below $2,000 carried
    onchain implications for the altcoin. According to Glassnode, a data analytics
    platform, ETH <a data-ct-non-breakable=\"null\" href=\"https://x.com/glassnode/status/1899444968780935428\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://x.com/glassnode/status/1899444968780935428\">dropped</a>
    below its realized price of $2,054 for the first time since February 2023. </p><figure><img
    alt=\"Markets, Price Analysis, Market Analysis, Ethereum Price, Ethereum ETF\"
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958a6b-1752-7410-99a6-a5f1d41651d6\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Ethereum realized
    price and MVRV. Source: X.com</em></p></figcaption></figure><p>ETH realized price
    calculates the average price of each ETH last moved, representing the average
    cost basis of the total circulating supply. The current drop below the realized
    price indicates widespread unrealized loss for all ETH holders.  </p><p>The market
    value to realized value (MVRV) ratio also dropped to 0.93, indicating a 7% average
    loss for all ETH holders across the network. However, it is important to note
    that the realized price reflects the weighted average of all historical transactions.
    Hence, it encompasses the cost basis of every ETH holder, not a specific timeframe
    like 2023 to 2025.</p><figure><img alt=\"Markets, Price Analysis, Market Analysis,
    Ethereum Price, Ethereum ETF\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01958a80-b5da-7efa-bc3b-954959ed301a\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Ethereum&rsquo;s TVL
    chart. Source: DefiLlama</em></p></figcaption></figure><p>Meanwhile, Ethereum&rsquo;s
    total value locked (TVL) <a data-ct-non-breakable=\"null\" href=\"https://defillama.com/chain/Ethereum\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://defillama.com/chain/Ethereum\">dropped</a>
    to a six-month low of $45.6 billion on March 12, down 41% from its peak of $77
    billion on Dec. 17, 2024.</p><p>Additionally, the total fees users paid to use
    Ethereum fell to $46.28 million&mdash;the lowest level since July 2020&mdash;further
    signaling weakening network engagement.</p><p><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/starknet-to-settle-on-bitcoin-ethereum-unify-chains\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/starknet-to-settle-on-bitcoin-ethereum-unify-chains\"><em><strong>Related:
    Starknet to settle on Bitcoin and Ethereum to unify the chains</strong></em></a></p><h2>Ether
    price between $1.6K-$1.9K is &ldquo;attractive&rdquo;</h2><p>In a recent X post,
    Glassnode&nbsp;<a data-ct-non-breakable=\"null\" href=\"https://x.com/glassnode/status/1899799500249497816\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">explained</a>&nbsp;how
    Ethereum&rsquo;s cost-basis distribution could be useful in identifying potential
    support levels for ETH. Based on a weekly outlook, Ether&rsquo;s recent drop below
    $1,880 led to an accumulation of 600,000-700,000 ETH around $1,900. The post states,
    </p><blockquote>&ldquo;This suggests $1.9K could establish itself as a support
    if $ETH consolidates at current levels. Above spot, $2.2K (465K $ETH) is the potential
    next resistance. The supply gap between $1.9K and $2.2K remains thin, making a
    short-term move towards resistance plausible.&rdquo;</blockquote><figure><img
    alt=\"Markets, Price Analysis, Market Analysis, Ethereum Price, Ethereum ETF\"
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958a9d-f706-7c2e-b1fa-1456268242d6\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Ethereum weekly analysis
    by Ninja. Source: X.com</em></p></figcaption></figure><p>At the same time, anonymous
    analyst Ninja <a data-ct-non-breakable=\"null\" href=\"https://x.com/Ninjascalp/status/1899329713606099223\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://x.com/Ninjascalp/status/1899329713606099223\">believe</a>s
    that the floor price for Ethereum remains between $1,600 and $1,900. </p><p>The
    trader added that the above range is an &ldquo;attractive region for commercial
    money&rdquo; and set a high swing target at $2,500. </p><p><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-whales-hint-80k-market-rebound-binance-inflows-cool\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-whales-hint-80k-market-rebound-binance-inflows-cool\"><em><strong>Related:
    Bitcoin whales hint at $80K &lsquo;market rebound&rsquo; as Binance inflows cool</strong></em></a></p><p
    class=\"post-content__disclaimer\" type=\"\">This article does not contain investment
    advice or recommendations. Every investment and trading move involves risk, and
    readers should conduct their own research when making a decision.</p><template
    data-name=\"subscription_form\" data-type=\"markets_outlook\" label=\"Subscription
    Form: Markets Outlook\"></template></p>\n</p>\n            "

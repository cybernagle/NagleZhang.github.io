- title: " Crypto whale liquidated for $308M in leveraged Ether trade "
  url: https://cointelegraph.com/news/ether-trader-loses-308-m-50x-leverage-market-volatility?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NThhOTAtM2MxYi03OWRmLWIzODgtYzJkMzU5MTBlNzMx.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NThhOTAtM2MxYi03OWRmLWIzODgtYzJkMzU5MTBlNzMx.jpg\"
    alt=\"Crypto whale liquidated for $308M in leveraged Ether trade\"></p><p>A large
    cryptocurrency trader, known as a whale, lost more than $308 million on a leveraged
    Ether position, underscoring the risks of leveraged trading during volatile market
    conditions.<p>The unknown crypto trader was liquidated on their 50x leveraged
    long position for over 160,234 Ether (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/ethereum-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">ETH</a>), worth more
    than $308 million at the time of writing, <a data-ct-non-breakable=\"null\" href=\"https://hypurrscan.io/address/0xf3F496C9486BE5924a93D67e98298733Bb47057c\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Hypurrscan</a> data
    shows.</p><p><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/explained/long-and-short-positions-explained\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Leveraged positions
    use</a> borrowed money to increase the size of an investment, which can boost
    the size of both gains and losses, making leveraged trading riskier compared to
    regular investment positions.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958a94-e3c2-7a74-80ae-c81f3b92e0bf\"
    title=\"\" alt=\"Crypto whale liquidated for $308M in leveraged Ether trade\"><figcaption
    style=\"text-align: center;\"><p><em>The crypto trader&rsquo;s address showing
    transactions. Source: Hypurrscan&nbsp;</em></p></figcaption></figure><p>The crypto
    whale opened the initial 50x leveraged position when ETH traded at $1,900, with
    a liquidation price of $1,877.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958a94-e8b5-7077-aea4-710ab5bd7e2c\"
    title=\"\" alt=\"Crypto whale liquidated for $308M in leveraged Ether trade\"><figcaption
    style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/lookonchain/status/1899741688689463342/photo/1\" rel=\"null\"
    target=\"null\" text=\"null\" title=\"https://x.com/lookonchain/status/1899741688689463342/photo/1\"><em>Lookonchain</em></a><em>&nbsp;</em></p></figcaption></figure><p>According
    to onchain intelligence firm Lookonchain, the whale had rotated all of his Bitcoin
    (<a data-ct-non-breakable=\"null\" href=\"/bitcoin-price\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">BTC</a>) holdings into the leveraged Ether trade
    before suffering the liquidation.</p><p>The liquidation came during a period of
    heightened volatility, as both crypto and traditional markets are limited by global
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-hinges-93k-support-risks-1-3-b-liquidation-trade-wars\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">trade war concerns</a>
    due to the latest <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/eu-retaliatory-tariffs-bitcoin-price-uncertainty-trade-tensions\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">retaliatory tariffs
    from</a> the European Union.&nbsp;</p><p><em><strong>Related: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/us-bitcoin-reserve-disappoints-investors-trump-crypto-summit\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Bitcoin
    reserve backlash signals unrealistic industry expectations</strong></em></a></p><h2>Ether
    risks correction to $1,800 amid tariff fears, ETF outflows</h2><p>Ether&rsquo;s
    price has fallen by more than 53% since it began its downtrend on Dec. 16, 2024,
    after it had peaked above $4,100.</p><figure><img alt=\"Cryptocurrencies, Law,
    Investments, Markets, Ethereum 2.0, Ether Price, Ethereum Price, Ethereum ETF\"
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958a94-ed08-7d98-9a78-3ca0dc9b0fa5\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>ETH/USD, 1-day chart,
    downtrend. Source: Cointelegraph/ TradingView&nbsp;</em></p></figcaption></figure><p>The
    main reasons behind <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/ether-1-8k-correction-global-tariff-fears-eth-etf-outflows\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Ether&rsquo;s downtrend
    are</a> the ongoing macroeconomic concerns and lack of builder activity on the
    Ethereum network, according to Bitfinex analysts.</p><p>&ldquo;A lack of new projects
    or builders moving to ETH, primarily due to high operating fees, is likely the
    principal reason behind the lackluster performance of ETH. [...] We believe that
    for ETH, $1,800 will be a strong level to watch,&rdquo; the analysts told Cointelegraph.</p><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/deutsche-boerse-to-launch-btc-eth-services-to-institutions-report\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Deutsche
    Boerse to launch Bitcoin, Ether institutional custody: Report</strong></em></a></p><p>&ldquo;However,
    the current sell-off is not being seen solely in ETH, we have seen a marketwide
    correction as fears over the impact of tariffs hit all risk assets,&rdquo; they
    added.</p><p>The US spot Ether exchange-traded funds (ETFs) are also limiting
    Ether&rsquo;s upside.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958a94-f418-74e3-a0ff-6d282a2d169c\"
    title=\"\" alt=\"Crypto whale liquidated for $308M in leveraged Ether trade\"><figcaption
    style=\"text-align: center;\"><p><em>Total spot Ether ETF net inflow. Source:
    Sosovalue</em></p></figcaption></figure><p>US spot Ether ETFs have entered a fourth
    consecutive week of net negative outflows, after seeing over $119 million worth
    of cumulative outflows during the previous week, <a data-ct-non-breakable=\"null\"
    href=\"https://sosovalue.com/assets/etf/Total_Crypto_ETH_ETF_Fund_Flow?page=usETH\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Sosovalue</a> data shows.</p><iframe
    width=\"100%\" height=\"315\" src=\"https://www.youtube.com/embed/VgqDMx_taRw?start=\"
    frameborder=\"0\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope;
    picture-in-picture\" allowfullscreen loading=\"lazy\"></iframe><p><em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/ethereum-l2s-interoperability-roadmap-complete-guide/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Ethereum
    L2s will be interoperable &lsquo;within months&rsquo;: Complete guide</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"defi_newsletter\" label=\"Subscription
    Form: DeFi Newsletter\"></template></p>\n</p>\n            "

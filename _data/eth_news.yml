- title: " Yuga exec warns about ‘true bear market’ Ether price as whales scramble "
  url: https://cointelegraph.com/news/eth-price-prediction-200-dollars-yuga-exec-whale-liquidation?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTg1MDgtNmE2Yy03ZWIxLWJlM2YtNGZkZDg5NzVhNzU4.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTg1MDgtNmE2Yy03ZWIxLWJlM2YtNGZkZDg5NzVhNzU4.jpg\"
    alt=\"Yuga exec warns about ‘true bear market’ Ether price as whales scramble\"></p><p>Yuga
    Labs&rsquo; vice president of blockchain warned that Ether could drop as low as
    $200 in a prolonged bear market, a 90% decline from its current price.<p>In a
    March 11 post on X, the executive, known as &ldquo;Quit,&rdquo; pushed back against
    analysts who suggested $1,500 as the possible bottom for Ether (<a data-ct-non-breakable=\"null\"
    href=\"/ethereum-price\" rel=\"null\" target=\"null\" text=\"null\" title=\"null\">ETH</a>).
    Instead, Quit argued that a true bear market could see ETH fall significantly
    lower, similar to previous market cycles.</p><blockquote>&ldquo;A true bear market
    target, if we&rsquo;re just getting started, would be ~$200-$400. That&rsquo;s
    an 80% drawdown from here, 90% total drawdown -- in line with past bear markets.&rdquo;</blockquote><p>The
    executive said he&rsquo;s in a &ldquo;comfortable&rdquo; position if things go
    south. Quit told followers to consider selling their stash if they&rsquo;re uncomfortable
    with the asset going down.&nbsp;</p><figure><img alt=\"Yuga exec warns about &lsquo;true
    bear market&rsquo; Ether price as whales scramble\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01958550-2453-7708-a9d5-428237c07e0d\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/0xQuit/status/1899169761029652797\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"https://x.com/0xQuit/status/1899169761029652797\"><em>Quit</em></a></p></figcaption></figure><h2>ETH
    holders discuss potential price trajectory</h2><p>Quit&rsquo;s post drew mixed
    reactions from the crypto community. Some investors agreed that ETH could drop
    further, while others said such a scenario would require a major systemic collapse.</p><p>One
    X user <a data-ct-non-breakable=\"null\" href=\"https://x.com/karmakame_lion/status/1899240044830875667\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">said</a> they set $1,800
    as the bottom. However, when the price reached $1,800, they contemplated whether
    it could go to $1,200. The ETH holder agreed with Quit&rsquo;s prediction and
    said, &ldquo;It could very well go lower&rdquo; if Bitcoin (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/bitcoin-price\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">BTC</a>) goes to $66,000.</p><p>Meanwhile, another
    X user disagreed with the prediction, saying it would only be possible if there
    were a systemic collapse similar to 2018. The ETH investor <a data-ct-non-breakable=\"null\"
    href=\"https://x.com/shineDUDES/status/1899177822507159863\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">said</a> that, unlike previous cycles, Ether has
    been adopted by institutions and has a maturing ecosystem.&nbsp;</p><p>&ldquo;Positioning
    for both scenarios is what every smart investor should done, but being too bearish
    at the wrong time can cost just as much as being overly bullish,&rdquo; they wrote.</p><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/4-things-before-ethereum-reclaim-2-600\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>4 things
    must happen before Ethereum can reclaim $2,600</strong></em></a></p><h2>ETH whales
    scramble against liquidation threat</h2><p>Quit&rsquo;s sentiments came as ETH
    whales scrambled to avoid liquidation as Ether prices collapsed. On March 11,
    CoinGecko data showed that ETH prices went to a low of $1,791 on a 22% decline
    in the past seven days.&nbsp;</p><p>Because of the sharp price changes, ETH whales
    moved millions of dollars in ETH to protect their positions against potential
    liquidation.&nbsp;</p><p>Blockchain analytics firm Lookonchain <a data-ct-non-breakable=\"null\"
    href=\"https://x.com/lookonchain/status/1899293860435726491\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">flagged</a> an ETH whale dumping $47.8 million and
    losing $32 million to avoid being liquidated. The whale still has over $64 million
    at the lending protocol Aave with a liquidation price of $1,316.&nbsp;</p><p>Another
    ETH investor who had already used over $5 million in assets to lower the liquidation
    price to $1,836 started to be liquidated. Lookonchain <a data-ct-non-breakable=\"null\"
    href=\"https://x.com/lookonchain/status/1899266447286907048\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">said</a> the whale&rsquo;s $121 million balance was
    being liquidated as the price dropped below $1,800.&nbsp;</p><p>A whale account
    suspected of being linked to the Ethereum Foundation also used $56 million in
    ETH to avoid liquidation amid the price drop. The address deposited over 30,000
    ETH to the Sky vault, bringing its liquidation price to $1.127.14. The account
    was later determined to be <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/ethereum-foundation-not-behind-56m-sky-deposit\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">unrelated to the foundation</a>.&nbsp;</p><iframe
    width=\"100%\" height=\"315\" src=\"https://www.youtube.com/embed/FWo0hw_94a4?start=\"
    frameborder=\"0\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope;
    picture-in-picture\" allowfullscreen loading=\"lazy\"></iframe><p><em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/bitcoin-miners-landlords-chinese-ethereum-whales-mind-control-notes-asia-express/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>ETH whale&rsquo;s
    wild $6.8M &lsquo;mind control&rsquo; claims, Bitcoin power thefts: Asia Express</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"markets_outlook\" label=\"Subscription
    Form: Markets Outlook\"></template></p>\n</p>\n            "
  published: 2025-03-11 13:33:22 UTC
- title: " Ether risks correction to $1.8K as ETF outflows, tariff fears continue "
  url: https://cointelegraph.com/news/ether-1-8k-correction-global-tariff-fears-eth-etf-outflows?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTg1MjUtYWQ0YS03YmU2LTk0NWYtMTNjOTE3Mzk0YWNh.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTg1MjUtYWQ0YS03YmU2LTk0NWYtMTNjOTE3Mzk0YWNh.jpg\"
    alt=\"Ether risks correction to $1.8K as ETF outflows, tariff fears continue\"></p><p>Ether
    is struggling to reverse a near three-month downtrend as macroeconomic concerns
    and continued selling pressure from US Ether exchange-traded funds (ETFs) weigh
    on investor sentiment.<p>Ether (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/ethereum-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">ETH</a>) has fallen
    by more than 53% since it began its downtrend on Dec. 16, 2024, after it had peaked
    above $4,100, <a data-ct-non-breakable=\"null\" href=\"https://www.tradingview.com/chart/JBpUV8Q8/?symbol=COINBASE%3AETHUSD\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">TradingView</a> data
    shows.</p><p>The downtrend has been fueled by global uncertainty around <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-price-limited-etf-institutional-investment-tariff-concerns\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">US import tariffs</a>
    triggering <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-hinges-93k-support-risks-1-3-b-liquidation-trade-wars\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">trade war concerns</a>
    and a lack of builder activity on the Ethereum network, according to Bitfinex
    analysts.</p><figure><img alt=\"Cryptocurrencies, Law, Investments, Markets, Ethereum
    2.0, Ether Price, Ethereum Price, Ethereum ETF\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01958547-8b0a-75c8-a533-9ac2adce35e6\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>ETH/USD, 1-day chart,
    downtrend. Source: Cointelegraph/ TradingView&nbsp;</em></p></figcaption></figure><p>&ldquo;A
    lack of new projects or builders moving to ETH, primarily due to high operating
    fees, is likely the principal reason behind the lackluster performance of ETH.
    [...] We believe that for ETH, $1,800 will be a strong level to watch,&rdquo;
    the analysts told Cointelegraph. </p><p>&ldquo;However, the current sell-off is
    not being seen solely in ETH, we have seen a marketwide correction as fears over
    the impact of tariffs hit all risk assets,&rdquo; they added.</p><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/us-bitcoin-reserve-disappoints-investors-trump-crypto-summit\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Bitcoin
    reserve backlash signals unrealistic industry expectations</strong></em></a></p><p>Crypto
    investors are also wary of an early bear market cycle that could break from the
    traditional four-year crypto market pattern.</p><p>Bitcoin (<a data-ct-non-breakable=\"null\"
    href=\"/bitcoin-price\" rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>)
    is at <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-70k-retracement-bull-market-analysts\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-70k-retracement-bull-market-analysts\">risk
    of falling to $70,000</a> as cryptocurrencies and global financial markets undergo
    a &ldquo;macro correction&rdquo; while remaining in a bull market cycle, said
    Aurelie Barthere, principal research analyst at blockchain analytics firm Nansen.</p><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/deutsche-boerse-to-launch-btc-eth-services-to-institutions-report\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Deutsche
    Boerse to launch Bitcoin, Ether institutional custody: Report</strong></em></a></p><h2>Ether
    price limited by ETF outflows</h2><p>Adding to Ethereum&rsquo;s challenges, continued
    outflows from Ether ETFs are limiting the asset&rsquo;s price recovery, according
    to Stella Zlatareva, dispatch editor at digital asset investment platform Nexo:</p><blockquote>&ldquo;ETH&rsquo;s
    20% decline last week pushed its price below the key $2,200 trendline that had
    supported its bull market recovery since 2022. The modest price action may be
    attributed, as with Bitcoin, to ETFs.&rdquo;</blockquote><p>US spot Ether ETFs
    have entered a fourth consecutive week of net negative outflows, after seeing
    over $119 million worth of cumulative outflows during the previous week, <a data-ct-non-breakable=\"null\"
    href=\"https://sosovalue.com/assets/etf/Total_Crypto_ETH_ETF_Fund_Flow?page=usETH\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Sosovalue</a> data shows.<br></p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958543-d183-719e-9490-aa0eeb6af524\"
    title=\"\" alt=\"Ether risks correction to $1.8K as ETF outflows, tariff fears
    continue\"><figcaption style=\"text-align: center;\"><p><em>Total spot Ether ETF
    net inflow. Source: Sosovalue</em></p></figcaption></figure><p>Still, some notable
    institutional crypto market participants remain optimistic about Ether&rsquo;s
    price for 2025. <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/vaneck-predicts-q1-2025-crypto-correction-q4-all-time-highs\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">VanEck predicted a $6,000</a>
    cycle top for Ether&rsquo;s price and a $180,000 Bitcoin price during 2025.</p><iframe
    width=\"100%\" height=\"315\" src=\"https://www.youtube.com/embed/VgqDMx_taRw?start=\"
    frameborder=\"0\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope;
    picture-in-picture\" allowfullscreen loading=\"lazy\"></iframe><p><em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/ethereum-l2s-interoperability-roadmap-complete-guide/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Ethereum
    L2s will be interoperable &lsquo;within months&rsquo;: Complete guide</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"defi_newsletter\" label=\"Subscription
    Form: DeFi Newsletter\"></template></p>\n</p>\n            "
  published: 2025-03-11 13:23:18 UTC
- title: " Why is Ethereum (ETH) price down today?  "
  url: https://cointelegraph.com/news/why-is-ethereum-eth-price-down-today?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMDgvNzY1MTY5ZjktYTBmMC00MTdlLTgwYTctZTQ2YzYyZDU4ZjI2.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMDgvNzY1MTY5ZjktYTBmMC00MTdlLTgwYTctZTQ2YzYyZDU4ZjI2.jpg\"
    alt=\"Why is Ethereum (ETH) price down today? \"></p><p>Ether (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/ethereum-price\" rel=\"\" target=\"_self\" text=\"null\"
    title=\"https://cointelegraph.com/ethereum-price\">ETH</a>) price declined by
    over 11.75% in the last 24 hours to around $1,900. At its intraday low, the cryptocurrency
    was trading for $1,755, its lowest price since October 2023.<figure><img alt=\"Cryptocurrencies,
    Markets, Hacks, Decentralized Exchange, Ether Price, Ethereum Price\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01958463-a65f-7a71-b322-713270301d6c\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>ETH/USD four-hour
    price chart. Source: TradingView</em></p></figcaption></figure><p>Several factors
    appear to be contributing to ETH price losses, including:</p><ul><li><p>US recession
    fears and its overall impact on risk-on markets.</p></li><li><p>Massive long liquidations
    in the crypto market.</p></li><li><p>Crypto loans backed by ETH as collateral
    facing liquidation risks.</p></li><li><p>Bearish technicals.</p></li></ul><h2>Ether
    price declines with risk-on assets</h2><p>Ether&rsquo;s ongoing price drop mirrors
    similar declines in the broader risk-on market due to unfavorable macroeconomic
    conditions.</p><p>Key points:</p><ul><li><p>The crypto market&rsquo;s combined
    market capitalization has dropped by over 4.6% in the last 24 hours, aligning
    with selloffs in US stocks.</p></li></ul><figure><img alt=\"Cryptocurrencies,
    Markets, Hacks, Decentralized Exchange, Ether Price, Ethereum Price\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01958471-0091-7409-a9a5-f33d133a4651\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>TOTAL crypto market
    cap vs. Nasdaq, Dow Jones, S&amp;P 500, and US 10-year Treasury note yields four-hour
    chart. Source: TradingView</em></p></figcaption></figure><ul><li><p><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/investors-skitter-off-risk-assets-jpmorgan-raises-recession-chances\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/investors-skitter-off-risk-assets-jpmorgan-raises-recession-chances\">JPMorgan
    raised US recession risk</a> to 40% for 2025, up from 30%, citing US President
    Donald Trump&rsquo;s \"extreme US policies\" as a key risk factor.</p></li><li><p>Goldman
    Sachs also raised its 12-month recession probability to 20%, up from 15%.</p></li><li><p>Earlier
    in March, <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/crypto-sentiment-plummets-extreme-fear-trump-tariffs\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/crypto-sentiment-plummets-extreme-fear-trump-tariffs\">Trump
    imposed 25% tariffs</a> on all goods from Mexico and Canada, and 10% tariffs on
    Chinese imports.</p></li><li><p>Canada and Mexico have announced intentions to
    impose retaliatory tariffs on US goods, escalating trade tensions and raising
    concerns about a potential trade war. </p></li><li><p>Meanwhile, China has already
    retaliated by increasing tariffs on multiple US products and imposing export controls
    and investment restrictions on 25 US firms.</p></li><li><p>These tariffs are expected
    to increase consumer prices and contribute to US inflation.</p></li></ul><p>US
    recession fears are impacting Ethereum and the crypto sector, notably:</p><ul><li><p>Ether,
    Bitcoin, and other top-ranking crypto assets have historically declined during
    periods of economic turbulences, e.g., the&nbsp;<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/how-has-the-covid-19-pandemic-affected-the-crypto-space-experts-answer\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Covid-19 sell-off in
    March 2020</a>.</p></li><li><p>As of March 11, the 52-week correlation between
    the crypto market and the US benchmark index, the S&amp;P 500 index, was 0.69.
    </p></li></ul><figure><img alt=\"Cryptocurrencies, Markets, Hacks, Decentralized
    Exchange, Ether Price, Ethereum Price\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01958490-24d5-7c92-b7c7-e166528e83d4\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>TOTAL crypto market
    cap and S&amp;P 500&rsquo;s 52-week correlation coefficient. Source: TradingView</em></p></figcaption></figure><ul><li><p>A
    consistently positive correlation increases the odds of a crypto market decline
    if US stocks keep falling, especially as the trade war drags on further.</p></li><li><p>Bond
    traders see no need for a rate cut before June, with <a data-ct-non-breakable=\"null\"
    href=\"https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html\">CME
    data</a> showing 95% and 52.5% odds of a pause in the Fed&rsquo;s March and May
    meetings, respectively.</p></li></ul><figure><img alt=\"Cryptocurrencies, Markets,
    Hacks, Decentralized Exchange, Ether Price, Ethereum Price\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01958494-b9a9-7779-a599-6703b215720b\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Target rate probabilities
    for March&rsquo;s Fed meeting. Source: CME</em></p></figcaption></figure><ul><li><p>The
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/learn/articles/what-the-feds-rate-cut-means-for-crypto-markets\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/learn/articles/what-the-feds-rate-cut-means-for-crypto-markets\">rate
    cut pause scenario</a> dampens the crypto and ETH risk appetite.</p></li></ul><h2>Bad
    DeFi loans increase Ether sell-off pressure</h2><advertisement><p>A <a data-ct-non-breakable=\"null\"
    href=\"https://info.sky.money/collateral/core/ETH-C/cdps/0x6f8019bb195b47e9f7d7ef65b97e3ad5de3ea843/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://info.sky.money/collateral/core/ETH-C/cdps/0x6f8019bb195b47e9f7d7ef65b97e3ad5de3ea843/\">$74
    million DeFi loan</a> on the Sky protocol, collateralized with $130 million in
    ETH, almost got liquidated after Ether price fell below the liquidation level
    just above $1,900.</p><p>As it happened: </p><ul><li><p>The borrower <a data-ct-non-breakable=\"null\"
    href=\"https://debank.com/profile/0xab7b99998206d1ccf8b13b02b7566c267f4e2313/history\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://debank.com/profile/0xab7b99998206d1ccf8b13b02b7566c267f4e2313/history\">added
    $34 million in ETH</a> as collateral to avoid liquidation. </p></li><li><p>Withdrew
    $1.6 million in USDT from Binance, swapped it for DAI, and deposited into Maker.</p></li><li><p>Reduced
    debt to $73.1 million while ETH&rsquo;s price continued to decline.</p></li><li><p>Liquidation
    level remained at $1,836 per ETH, closer to ETH&rsquo;s current price above $1,900.</p></li><li><p>Nearly
    <a data-ct-non-breakable=\"null\" href=\"https://defillama.com/liquidations/eth\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://defillama.com/liquidations/eth\">$353
    million in debt is tied to such loans</a>, risking liquidation if ETH&rsquo;s
    price falls 20% from here. </p></li></ul><figure><img alt=\"Cryptocurrencies,
    Markets, Hacks, Decentralized Exchange, Ether Price, Ethereum Price\" src=\"https://s3.cointelegraph.com/uploads/2025-03/019584a7-5586-784e-b8b0-9edd82448c80\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Ethereum liquidation
    levels in DeFi. Source: DefiLlama</em></p></figcaption></figure><ul><li><p>Such
    a cascade of liquidations could exacerbate the downward pressure as borrowers
    scramble to stabilize their positions by selling or moving ETH.</p></li></ul><h2>Long
    liquidations accelerate ETH downtrend</h2><p>Ether&rsquo;s tumble over the past
    24 hours coincided with a wave of long liquidations that forced traders to exit
    their leveraged positions.</p><p>Key takeaways:</p><ul><li><p>Over $240 million
    worth of ETH positions were wiped out in the last 24 hours, with long liquidations
    accounting for $196.27 million, or 82% of the total.</p></li></ul><figure><img
    alt=\"Cryptocurrencies, Markets, Hacks, Decentralized Exchange, Ether Price, Ethereum
    Price\" src=\"https://s3.cointelegraph.com/uploads/2025-03/019584ae-816f-7908-808d-254f0b2db37c\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>ETH total liquidation
    chart. Source: </em><a data-ct-non-breakable=\"null\" href=\"https://www.coinglass.com/currencies/ETH\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://www.coinglass.com/currencies/ETH\"><em>Coinglass</em></a></p></figcaption></figure><ul><li><p>The
    sharp price drop triggered a cascade of forced sell-offs as traders betting on
    Ethereum&rsquo;s price increase were liquidated.</p></li><li><p>When leveraged
    long positions fail to maintain margin requirements, exchanges automatically sell
    off their holdings to cover losses.</p></li><li><p>Such liquidations accelerate
    price declines, exacerbating the downturn.</p></li><li><p>The broader crypto market
    also <a data-ct-non-breakable=\"null\" href=\"https://www.coinglass.com/LiquidationData\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://www.coinglass.com/LiquidationData\">experienced
    a sharp deleveraging event</a>, with total liquidations reaching $897.26 million
    across assets.</p></li></ul><figure><img alt=\"Cryptocurrencies, Markets, Hacks,
    Decentralized Exchange, Ether Price, Ethereum Price\" src=\"https://s3.cointelegraph.com/uploads/2025-03/019584af-21d6-7cff-929d-2b6c810c9303\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Crypto market liquidations
    (24 hours). Source: TradingView</em></p></figcaption></figure><h2>Ether eyes further
    decline toward $1,700</h2><p>From a technical perspective, Ether&rsquo;s price
    decline today is part of its prevailing inverse-cup-and-handle (IC&amp;H) pattern.</p><p>Key
    points:</p><ul><li><p>The rounded top formation (cup) suggests a loss of bullish
    momentum, with sellers gradually taking control.</p></li></ul><figure><img alt=\"Cryptocurrencies,
    Markets, Hacks, Decentralized Exchange, Ether Price, Ethereum Price\" src=\"https://s3.cointelegraph.com/uploads/2025-03/019584bd-3447-79aa-8b2e-2a8497c0efbb\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>ETH/USD daily price
    chart. Source: TradingView</em></p></figcaption></figure><ul><li><p>A temporary
    consolidation (handle) formed near $2,700, indicating a failed breakout attempt.</p></li><li><p>ETH
    broke below key support levels, confirming the IC&amp;H breakdown, leading to
    more losses.</p></li><li><p>The measured move target from the pattern suggests
    a potential decline toward $1,700, aligning with the dotted support level.</p></li><li><p>The
    50-day EMA ($2,600) and 200-day EMA ($2,929) remain far above, reinforcing bearish
    sentiment.</p></li></ul><p>Key levels to watch:</p><ul><li><p>ETH price is inside
    a descending channel pattern since late February.</p></li><li><p>As of March 11,
    the ETH/USD pair was rising after testing the channel&rsquo;s lower trendline
    as support. </p></li></ul><figure><img alt=\"Cryptocurrencies, Markets, Hacks,
    Decentralized Exchange, Ether Price, Ethereum Price\" src=\"https://s3.cointelegraph.com/uploads/2025-03/019584c5-d895-7425-95b8-2c8e7a0eb250\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>ETH/USD four-hour
    price chart. Source: TradingView</em></p></figcaption></figure><ul><li><p>Such
    rebounds have taken prices toward the channel&rsquo;s upper trendline in recent
    history.</p></li><li><p>If the fractal repeats, ETH&rsquo;s next upside target
    could be around $2,000, aligning with the 0.236 Fibonacci retracement line.</p></li><li><p>A
    reversal from current price levels could have ETH test the IC&amp;H downside target
    of $1,700.</p></li></ul></advertisement><p class=\"post-content__disclaimer\"
    type=\"\">This article does not contain investment advice or recommendations.
    Every investment and trading move involves risk, and readers should conduct their
    own research when making a decision.</p><template data-name=\"subscription_form\"
    data-type=\"markets_outlook\" label=\"Subscription Form: Markets Outlook\"></template></p>\n</p>\n

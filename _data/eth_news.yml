- title: " Crypto plunges as Trump tariff ‘medicine’ brutalizes global stock markets "
  url: https://cointelegraph.com/news/crypto-plunges-nasdaq-dow-stock-futures-fall-on-open?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Cryptocurrency prices tumbled as the US stock futures market opened sharply
    lower on April 6 as the Trump administration doubled down on its global tariff
    strategy.The Trump administration hit all countries with a 10% tariff starting
    April 5, with some slapped at higher rates, including China at 34%, the European
    Union at 20%, and Japan at 24%.Bitcoin (BTC) dropped over 6% in the last 24 hours
    and was trading around $77,883. Meanwhile, Ether (ETH) shed over 12% in the same
    time frame and was trading at $1,575, according to CoinGecko. The total crypto
    market cap dropped over 8% to $2.5 trillion. Prices have clawed back some losses
    since. Bitcoin has recovered 1.4% to $78,500. Meanwhile, Ether regained $1,594.Source:
    Autism CapitalAt the same time, the Crypto Fear & Greed Index, which measures
    market sentiment for Bitcoin and other cryptocurrencies, returned a score of 23
    in its latest April 7 update, which is considered extreme fear.In a statement,
    Charlie Sherry, head of finance at Australian crypto exchange BTC Markets, said
    the drop is unsurprising because global markets are generally more illiquid on
    Sundays. “As a result, a few large sell-offs can have a disproportionate impact,
    pushing prices down quickly,” he said. “There’s no mystery behind the trigger:
    President Trump’s recent tariff talk has rattled macro markets, with global trade
    relations suddenly looking uncertain.” Some traders, however, predict a Bitcoin
    breakout could be around the corner. BitMEX co-founder Arthur Hayes has also speculated
    that while the tariffs are rattling markets, they could result in a Bitcoin rally. The
    US Stock Futures market has also opened down. Futures tied to the S&P 500 dropped
    nearly 4%, according to Google Finance. Meanwhile, the tech-heavy Nasdaq lost,
    and the Dow Jones Industrial Average futures sank by over 8%. Trading resource
    the Kobeissi Letter said in an April 6 post to X that the drop in US stock market
    futures puts S&P 500 futures in ”bear market territory,” adding that the US stock
    market has now erased an average of $400 billion per trading day for the last
    32 days. Source: Kobeissi LetterTom Dunleavy, a managing partner at venture capital
    firm MV Global, said it could be the “worst three-day move for US stocks of all
    time” if “tonight’s futures hold.” Trump administration doubles down on tariffsCrypto-friendly
    billionaire investor Bill Ackman speculates that US President Donald Trump could
    postpone the tariffs to allow countries to make counteroffers or deals.In an April
    6 statement on his social media platform, Truth Social, Trump doubled down on
    the tariffs, saying the US has massive financial deficits with China, the European
    Union and many others, which the levies will solve.Related: ‘National emergency’
    as Trump’s tariffs dent crypto prices“The only way this problem can be cured is
    with TARIFFS, which are now bringing tens of billions of dollars into the USA.
    They are already in effect, and a beautiful thing to behold,” he said.He also
    told reporters aboard Air Force One that he wasn't intentionally trying to cause
    a market sell-off but added that “sometimes you have to take medicine to fix something.” At
    the same time, US National Economic Council Director Kevin Hassett said in an
    April 6 interview with ABC's This Week program that more than 50 countries have
    reached out to the president to negotiate fresh trade deals.“They’re doing that
    because they understand that they bear a lot of the tariff,” he said. US Treasury
    Secretary Scott Bessent urged US trading partners in an April 2 interview with
    Bloomberg against taking retaliatory steps, arguing “this is the high end of the
    number” for tariffs if they don't try to add more levies in response. Magazine:
    Financial nihilism in crypto is over — It’s time to dream big again\n\n            "
  published: 2025-04-07 03:16:09.000000000 +01:00
- title: " Trump’s Liberation Day: ‘Climax of uncertainty’ before crypto market recovery "
  url: https://cointelegraph.com/news/trump-liberation-day-climax-uncertainty-crypto-market-recovery?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Cryptocurrency markets could be on track for recovery as investor sentiment
    begins to stabilize following US President Donald Trump’s sweeping tariff announcement
    — what some analysts are calling the peak of recent market uncertainty.Trump announced
    his reciprocal import tariffs on April 2, which sent tremors across global markets.
    The S&P 500 lost more than $5 trillion, its largest drop on record, surpassing
    the pandemic-induced crash in March 2020, according to Reuters.Still, some analysts
    see a silver lining to the tariff announcement.“In my opinion, the tariffs are
    the representation of the uncertainty in the markets,” Michaël van de Poppe, founder
    of MN Consultancy, told Cointelegraph. “Liberation Day is basically the peak of
    that period, the climax of uncertainty. Now it’s out in the open. Everybody knows
    the new playing field.”Van de Poppe added that he believes Trump is using tariffs
    as a strategic move to stimulate domestic growth and reduce yields. “Tariffs are
    literally the only way to do that,” he said. “I wouldn’t be surprised if they’re
    reversed within the next six to 12 months.”Average tariff rate on US goods and
    imports. Source: JPMorgan, Ayesha TariqPresident Trump’s plan imposes a 10% baseline
    tariff on all US imports from April 5 and a higher “reciprocal tariff” of up to
    54% on select countries with larger trade deficits from April 9.Related: Michael
    Saylor’s Strategy buys Bitcoin dip with $1.9B purchaseImport tariffs could trigger
    Fed easingStill, the end of the uncertainty could bring renewed investment into
    crypto markets, leading to a recovery, Van de Poppe said:“We’ll start to see the
    rotation toward the crypto markets in the coming period where there’s more calm
    and peace in the markets where investors start to buy the dip and understand that
    some things have been undervalued.”He noted that the economic impact of the tariffs
    may ultimately lead the US Federal Reserve to lower interest rates and begin a
    new round of quantitative easing (QE), a monetary policy that involves the Fed
    buying bonds to inject liquidity into the economy.Arthur Hayes, co-founder of
    BitMEX and chief investment officer at Maelstrom, has predicted Bitcoin could
    climb to $250,000 if the Fed formally enters a QE cycle.Related: Satoshi Nakamoto
    turns 50 as Bitcoin becomes US reserve assetTrump tariff uncertainty still weighing
    on sentimentOn the downside, the tariff-related uncertainty may continue pressuring
    risk asset appetite for weeks, according to Noelle Acheson, author of the Crypto
    is Macro Now newsletter.“We can count on President Trump changing his mind a few
    times within the first couple of weeks,” Acheson told Cointelegraph. She added:“With
    heightened uncertainty a given in these markets, we can expect more risk-off behavior,
    even though some short-term bounces may bring some relief.”“For crypto, BTC continues
    to act like a risk asset short-term while its analog counterpart gold breaks through
    one all-time high after another,” a development that may impact crypto investor
    sentiment in the short term, Acheson said.Meanwhile, crypto intelligence firm
    Nansen estimated a 70% probability that the market could bottom by June, depending
    on how the tariff negotiations evolve.Magazine: Bitcoin ATH sooner than expected?
    XRP may drop 40%, and more: Hodler’s Digest, March 23 – 29\n\n            "
  published: 2025-04-06 15:17:22.000000000 +01:00
- title: " Crypto stocks down, IPOs punted amid tariff tumult "
  url: https://cointelegraph.com/news/crypto-stocks-down-ipos-punted-amid-tariff-tumult?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Cryptocurrency firms felt the heat from US President Donald Trump’s sweeping
    tariff rollout this week as market turbulence sent share prices tumbling and foiled
    initial public offering (IPO) plans. From exchanges to Bitcoin (BTC) miners, crypto
    stocks suffered as much, if not more, than shares of other companies — despite
    the industry’s warm relationship with the US president. On April 2, Trump announced
    he was placing tariffs of at least 10% on practically all imports into the United
    States and adding additional \"reciprocal\" tariffs on some 57 countries. Since
    then, major US stock indices — including the S&P 500 and Nasdaq — tumbled by roughly
    10% as traders braced for a looming trade war. Bitcoin miners sold off on Trump’s
    tariff news. Source: MorningstarRelated: Bitcoin ‘decouples,’ stocks lose $3.5T
    amid Trump tariff war and Fed warning of ‘higher inflation’Sharp selloffsCrypto
    exchange Coinbase — a prominent ally of Trump during the November US elections
    — experienced a similarly severe sell-off, with its stock price dropping by roughly
    12% during the same period, according to data from Google Finance.Bitcoin miners
    are also taking a hit. The CoinShares Crypto Miners ETF (WGMI) — which tracks
    a diverse basket of Bitcoin mining stocks — has lost roughly 13% of its value
    since immediately prior to Trump’s April 2 announcement, according to data from
    Morningstar. Even Strategy, one of the best-performing stocks of 2024, wasn’t
    immune. Its share price has fallen by around 6% on the news, Google Finance data
    showed.According to Reuters, investment bank JPMorgan has raised its estimated
    odds of a global economic recession in 2025 to 60% from 40% previously. \"Disruptive
    U.S. policies have been recognized as the biggest risk to the global outlook all
    year,\" JP Morgan reportedly said.\"The effect ... is likely to be magnified through
    (tariff) retaliation, a slide in U.S. business sentiment and supply-chain disruptions.\"Strategy’s
    shares also dropped this week. Source: Google FinanceIPO delaysThe impact of US
    tariffs hasn’t been limited to stock price volatility. Stablecoin issuer Circle
    has reportedly paused plans for a 2025 IPO, citing market turbulence. According
    to The Wall Street Journal, Circle is “waiting anxiously” before taking further
    steps after filing to take the company public on April 1. It is among several
    companies — including fintech Klarna and ticketing service StubHub — reportedly
    considering altering or shelving IPO plans. One exception may be Bitcoin itself,
    which some analysts say is finally “decoupling” from the broader market. Bitcoin’s
    spot price has held above $82,000 this week, even as US equities markets collapsed.Magazine: Unstablecoins:
    Depegging, bank runs and other risks loom\n\n            "
  published: 2025-04-04 23:28:06.000000000 +01:00
- title: " Price analysis 4/4: BTC, ETH, XRP, BNB, SOL, DOGE, ADA, TON, LEO, LINK "
  url: https://cointelegraph.com/news/price-analysis-4-4-btc-eth-xrp-bnb-sol-doge-ada-ton-leo-link?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Bitcoin (BTC) price has managed to stay above the $80,000 level as volatility
    wrecked US stock markets on April 3 and April 4. The failure of the bears to capitalize
    on the opportunity shows a lack of selling at lower levels.Risky assets were rattled
    after US President Donald Trump announced reciprocal tariffs on several countries
    on April 2. The fall in the US markets deepened on April 4 after China announced
    a retaliatory tariff of 34% on all imported US goods starting April 10.While several
    market participants are concerned about the near-term impact of tariffs, BitMEX

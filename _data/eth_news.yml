- title: " 3 reasons why Ethereum can outperform its rivals after crashing to 17-month
    lows "
  url: https://cointelegraph.com/news/ethereum-can-outperform-rivals-crashing-17-month-lows?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMTEvMDE5MzBhYzctNWQ4Zi03MDgxLWIzMDItZWNlZjk1ZDI0MTkx.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMTEvMDE5MzBhYzctNWQ4Zi03MDgxLWIzMDItZWNlZjk1ZDI0MTkx.jpg\"
    alt=\"3 reasons why Ethereum can outperform its rivals after crashing to 17-month
    lows\"></p><p>Ether (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/ethereum-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">ETH</a>) fell 13% between
    March 8 and March 11 as investors moved to short-term fixed-income and cash positions,
    seeking safety amid a global tariff war and rising fears of an economic downturn.
    <h2>ETH price needs 29% gains to reclaim $2.5K</h2><p>Market concerns escalated
    after the United States responded to Canada&rsquo;s electricity surcharge with
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-dips-below-80-k-as-trump-canada-tariffs-risk-asset-relief\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-dips-below-80-k-as-trump-canada-tariffs-risk-asset-relief\">retaliatory
    measures</a>.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958a60-a4f1-70c1-a81f-364b51ec9588\"
    title=\"\" alt=\"3 reasons why Ethereum can outperform its rivals after crashing
    to 17-month lows\"><figcaption style=\"text-align: center;\"><p><em>S&amp;P 500
    futures (left, magenta) vs. Ether/USD (blue). Source: TradingView/Cointelegraph</em></p></figcaption></figure><p>Typically,
    traders tend to overreact, increasing the likelihood that Ether will rebound faster
    than other assets once market sentiment improves. While some argue that risk assets
    are driven by inflation and economic growth data, others believe gains depend
    on stimulus measures and monetary expansion.</p><p>Regardless of the catalyst
    for the next bull run, Ether price must climb 29% from its current $1,940 level
    to reclaim $2,500. This move will likely require increased demand from leveraged
    buyers, whose activity is now at its lowest point in five months.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958a60-a9f9-7177-9998-9a02dedebb56\"
    title=\"\" alt=\"3 reasons why Ethereum can outperform its rivals after crashing
    to 17-month lows\"><figcaption style=\"text-align: center;\"><p><em>ETH 2-month
    futures annualized premium. Source: Laevitas.ch/Cointelegraph</em></p></figcaption></figure><p>Traders
    want higher prices to compensate for longer settlement periods, making a 5% to
    10% annualized premium (basis rate) expected in neutral markets. When rates fall
    below this range&mdash;such as the current 4.5%&mdash;it signals weak bullish
    conviction.</p><p>Excessive optimism played a role in Ether&rsquo;s <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/ether-1-8k-correction-global-tariff-fears-eth-etf-outflows\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">recent correction</a>,
    as $235 million in leveraged long positions were liquidated between March 10 and
    March 11.</p><p>The panic selling drove ETH to a low of $1,744, its lowest level
    since October 2023. However, several indicators suggest a potential recovery,
    as ETH derivatives and onchain metrics show resilience.</p><h2><strong>Ethereum
    L2 network grows</strong></h2><p>Ether is trading 60% below its $4,868 all-time
    high from November 2021. This decline is largely due to increased competition
    in the smart contract sector and waning demand for applications such as non-fungible
    tokens (NFTs), <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/web3-gaming-capital-investments-axie-killers\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">gaming</a>, collectibles,
    metaverse projects, social networks, and Web3 infrastructure.</p><p>However, this
    perspective overlooks a key factor. In late 2021, the average transaction fee
    exceeded $50, while activity on Ethereum&rsquo;s layer-2 ecosystem was 97% lower
    than it is today. </p><p>For context, a token swap on Ethereum&rsquo;s base layer
    cost $1.70 on March 11 despite the number of daily average operations per second
    growing, highlighting notable progress in network efficiency.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958a60-ad74-71f4-97c0-890ac0aa544c\"
    title=\"\" alt=\"3 reasons why Ethereum can outperform its rivals after crashing
    to 17-month lows\"><figcaption style=\"text-align: center;\"><p><em>Ethereum layer-2
    daily average operations per second. Source: L2beat</em></p></figcaption></figure><p>Even
    if bots generate 80% of layer-2 transactions, the remaining 20% of activity on
    Base, Arbitrum, Optimism, ZKsync, and Blast is still roughly three times higher
    than Ethereum&rsquo;s base layer. However, critics have a valid argument: despite
    the surge in network activity, validators are earning significantly less compared
    to late 2021.</p><h2><strong>Ethereum regains DEX top-spot, TVL grows </strong></h2><p>Ethereum
    has reinforced its position as the second-most popular option for institutional
    investors in traditional finance, supported by $8.9 billion in spot exchange-traded
    funds (ETFs). </p><p>Meanwhile, competitors such as Solana <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/sec-delays-decision-xrp-solana-litecoin-dogecoin-etfs\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/sec-delays-decision-xrp-solana-litecoin-dogecoin-etfs\">still
    await regulatory approval</a> for similar ETF products. Even if they gain approval,
    they cannot match the first-mover advantage of the Grayscale Ethereum Trust, which
    began public trading on over-the-counter markets in June 2019.</p><p>Moreover,
    Ethereum smart contract deposits, measured by total value locked (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/explained/what-is-total-value-locked-tvl-in-crypto-and-why-does-it-matter\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/explained/what-is-total-value-locked-tvl-in-crypto-and-why-does-it-matter\">TVL</a>),
    reached their highest level since July 2022 in ETH terms on March 11, marking
    a 10% increase over the past two weeks.</p><p><em><strong>Related: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/the-strategic-crypto-reserve\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>The strategic
    crypto reserve will fuel ecosystem growth</strong></em></a></p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958a60-b35e-79ea-afd8-1eb380b0138c\"
    title=\"\" alt=\"3 reasons why Ethereum can outperform its rivals after crashing
    to 17-month lows\"><figcaption style=\"text-align: center;\"><p><em>Ethereum network
    TVL, ETH. Source: DefiLlama</em></p></figcaption></figure><p>At 24 million ETH,
    Ethereum&rsquo;s TVL has been driven by the growth of liquid staking, lending,
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/explained/defi-yield-farming-explained\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">yield farming</a>, and
    real-world asset tokenization. The network recently reclaimed its leading position
    in decentralized exchange volumes, reaching $20.5 billion over seven days and
    surpassing Solana&rsquo;s $13.9 billion, according to DefiLlama data.</p><p>This
    provided a bullish outlook for ETH&rsquo;s price, driven by <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/learn/articles/a-beginners-guide-on-blockchain-layer-2-scaling-solutions\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/learn/articles/a-beginners-guide-on-blockchain-layer-2-scaling-solutions\">layer-2</a>
    transactions nearing all-time highs, reclaiming of the top spot in DEX volume,
    and rising TVL deposits. </p><p>Ultimately, Ether&rsquo;s trend reversal remains
    highly dependent on macroeconomic improvements, but once stabilized, ETH is well-positioned
    to regain $2,500 as a key support level in the coming weeks.<br></p><p class=\"post-content__disclaimer\"
    type=\"\">This article is for general information purposes and is not intended
    to be and should not be taken as legal or investment advice. The views, thoughts,
    and opinions expressed here are the author&rsquo;s alone and do not necessarily
    reflect or represent the views and opinions of Cointelegraph.</p><template data-name=\"subscription_form\"
    data-type=\"markets_outlook\" label=\"Subscription Form: Markets Outlook\"></template></p>\n</p>\n
    \           "

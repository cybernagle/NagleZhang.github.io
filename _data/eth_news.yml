- title: " Multi-wallet usage up 16%, but AI may address crypto fragmentation gap "
  url: https://cointelegraph.com/news/multi-wallet-usage-16-ai-address-crypto-fragmentation-gap?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Fragmentation and complicated user experience remain two of the most significant
    obstacles to cryptocurrency’s mainstream adoption, according to a new industry
    report. Most users now use at least two wallets to manage their cryptocurrency
    investments.The lack of interoperability across blockchains means users need to
    create multiple wallets to interact with different networks, with users having
    at least two wallets rising by 16% over the past year. According to a research
    report published by onchain user experience platform Reown and crypto intelligence
    firm Nansen, 62% of crypto users reported using at least two wallets over the
    past three months, up from 45% in 2024.More than 18% of respondents said security
    was their top concern related to wallet use, while 10.6% cited poor user experience
    as the biggest issue.Wallet usage over the past 3 months. Source: Nansen, ReownRelated:
    Bitcoin volatility lowest in 563 days, Hayes predicts $1M BTC by 2028AI integration
    may be next “breakthrough” for crypto wallets“We’re at a pivotal moment in the
    evolution of wallet UX,” according to Eowyn Chen, the CEO at Trust Wallet. “The
    next wave of users, especially those coming from traditional Web2 or emerging
    markets, are bringing new expectations that challenge how we design tools and
    interfaces.”Chen said wallets are shifting from asset storage tools to becoming
    the primary gateway to Web3 services, including digital identity, financial products,
    governance and gaming.“That’s why we see wallets evolving into intelligent, personal
    companions — tools that not only hold your assets, but understand your behaviour,
    preferences, and needs,” she said.Chen added that integrating artificial intelligence
    agents could help users navigate Web3 as easily as they shop online, while also
    reducing risks from scams such as phishing attacks. These scams typically involve
    tricking victims into sending assets to fake wallet addresses.The need for more
    robust wallets became more apparent after an unknown attacker stole $330 million
    worth of Bitcoin (BTC) in a social engineering scam from an elderly US citizen,
    Cointelegraph reported on April 28.Related: Crypto hackers hit DeFi for $92M in
    April as attacks double from MarchMobile wallets dominate, hardware wallet usage
    on the riseOut of the 1,000 surveyed participants, 51% of users preferred using
    a mobile wallet, down from 54.8% in 2024.Mobile vs hardware wallet usage. Source:
    Nansen, ReownOnly 10% of the respondents preferred using a hardware wallet, up
    from just 7% a year ago, signaling that hardware wallets are slowly gaining traction
    among more advanced crypto users. However, only 3% of new investors reported using
    a hardware wallet.Social wallets, which are connected to a user’s email or other
    social account and require no seed phrase, have “transformed onboarding,” and
    are at the “forefront of UX innovation, quickly adopting technologies like passkey
    signers and gas abstraction,” according to Derek Rein, chief technical officer
    at Reown. He added:“Crucially, they prioritize simple, easy design, users shouldn’t
    need to understand gas tokens or chain switching just to transact.”Sentiment around
    social wallets. Source: Nansen, Reown However, users are still hesitant, with
    39% of surveyed respondents saying that improved security and trust would help
    them adopt social wallets.Magazine: Ethereum is destroying the competition in
    the $16.1T TradFi tokenization race\n\n            "

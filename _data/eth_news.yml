- title: " Price analysis 3/14: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI, LEO, LINK "
  url: https://cointelegraph.com/news/price-analysis-3-14-btc-eth-xrp-bnb-sol-ada-doge-pi-leo-link?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTk1NmEtZTY2MS03OTQwLWE4M2EtNDAxOWQxYjRjOWEx.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTk1NmEtZTY2MS03OTQwLWE4M2EtNDAxOWQxYjRjOWEx.jpg\"
    alt=\"Price analysis 3/14: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI, LEO, LINK\"></p><p>Bitcoin
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>) has risen back
    above the 200-day simple moving average ($83,754), indicating that the bulls are
    attempting a comeback. The failure of the bears to capitalize on the drop below
    the 200-day SMA shows that selling dries up at lower levels.<p>However, Bitcoin
    may not be out of the woods yet. Crypto analyst Matthew Hyland said in a video
    posted to X that Bitcoin needs a weekly <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-price-weekly-close-89k-bottom-resume-uptrend-crypto-analyst\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">close above $89,000
    to confirm a bottom</a>. </p><p>A move above $89,000 could liquidate roughly $1.60
    billion in short positions, according to CoinGlass data. If that does not happen,
    Hyland warns that Bitcoin will fall into the $74,000 to $69,000 range.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/0195955a-501f-7189-a8bc-1bf9b70ca8be\"
    title=\"\" alt=\"Price analysis 3/14: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI,
    LEO, LINK\"><figcaption style=\"text-align: center;\"><p><em>Crypto market data
    daily view. Source: </em><a data-ct-non-breakable=\"null\" href=\"https://coin360.com\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://coin360.com\"><em>Coin360</em></a></p></figcaption></figure><p>Buyers
    have a challenging task ahead of them. The inflows of $13.3 million into US spot
    Bitcoin exchange-traded funds (ETFs) on March 12 could not be sustained, and the
    ETFs <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-etfs-break-outflow-streak-13m-inflow\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">recorded outflows of
    $135.2 million on March 13</a>, per Farside Investors data. </p><p>This shows
    that the investors remain nervous and are pressing the sell button on new tariff
    threats and actions by US President Donald Trump.</p><p>Could Bitcoin surge to
    $100,000, pulling select altcoins higher? Let&rsquo;s analyze the charts of the
    top 10 cryptocurrencies to find out.</p><h2>Bitcoin price analysis</h2><p>Bitcoin
    bulls are trying to start a recovery but are expected to face significant resistance
    in the zone between the 200-day SMA and the 20-day exponential moving average
    ($86,717).</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195955a-5b49-7df5-bc7a-e2dab962755a\"
    title=\"\" alt=\"Price analysis 3/14: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI,
    LEO, LINK\"><figcaption style=\"text-align: center;\"><p><em>BTC/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>If buyers drive
    the price above the 20-day EMA, it will signal that the break below the 200-day
    SMA may have been a bear trap. The BTC/USDT pair could rise to the 50-day SMA
    ($93,876) and, after that, to the $100,000 psychological barrier.</p><p>Conversely,
    if the price turns down from the overhead resistance zone with force, it will
    indicate that the bears are in command. That increases the likelihood of a drop
    to the vital support at $73,777. Buyers are expected to fiercely defend the $73,777
    level because a drop below it may pull the pair to $67,000.</p><h2>Ether price
    analysis</h2><p>Ether (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/ethereum-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">ETH</a>) has been trading
    in a tight range between $1,963 and $1,754, indicating a tough battle between
    the bulls and the bears.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195955a-66b1-76f1-afc2-9ecf4fbc0fe5\"
    title=\"\" alt=\"Price analysis 3/14: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI,
    LEO, LINK\"><figcaption style=\"text-align: center;\"><p><em>ETH/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The relative
    strength index (RSI) is showing early signs of forming a positive divergence.
    If the price rises above $1,963, the ETH/USDT pair could climb to the breakdown
    level of $2,111. This level may attract aggressive selling by the bears, but if
    the bulls persist, the pair could rally to the 50-day SMA ($2,597).</p><p>This
    optimistic view will be negated if the price turns down from the current level
    of $2,111 and breaks below $1,754. That will signal the resumption of the downtrend.
    The pair may then nosedive to $1,500.</p><h2>XRP price analysis</h2><p>XRP (<a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/xrp-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">XRP</a>) rebounded off
    the $2 support on March 11 and reached the 20-day EMA ($2.35) on March 13.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/0195955a-7167-7374-8c6d-f2ad482a37ac\"
    title=\"\" alt=\"Price analysis 3/14: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI,
    LEO, LINK\"><figcaption style=\"text-align: center;\"><p><em>XRP/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The bears are
    trying to halt the recovery at the 20-day EMA, but the bulls have kept up the
    pressure. That increases the possibility of a break above the 20-day EMA. The
    XRP/USDT pair may then rise to $2.64. If this level is cleared, the pair could
    rally to $3.</p><p>Contrarily, if the price turns down sharply from the current
    level, it will suggest that the sentiment remains negative. The pair may retest
    the crucial $2 support, and if this level gives way, the pair will complete a
    bearish head-and-shoulders pattern. That may sink the pair to $1.28.</p><h2>BNB
    price analysis</h2><p>BNB (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/binance-coin-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BNB</a>) rose above
    the 20-day EMA ($591) on March 13, but the bulls could not sustain the higher
    levels, as seen from the long wick on the candlestick.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195955a-7bdd-72c4-9844-8b8eeaff1bb0\"
    title=\"\" alt=\"Price analysis 3/14: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI,
    LEO, LINK\"><figcaption style=\"text-align: center;\"><p><em>BNB/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The bulls are
    again trying to push the price above the 20-day EMA. The BNB/USDT pair could challenge
    the 50-day SMA ($624) if they can pull it off. A break and close above the 50-day
    SMA will suggest that the correction may be over. The pair could then attempt
    a rally to $686.</p><p>If bears want to prevent the upside, they will have to
    yank the price below the $500 support. The pair may then fall to $460, which is
    expected to attract aggressive buying by the bulls.</p><h2>Solana price analysis</h2><p>Solana
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/solana-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">SOL</a>) has been trading
    above the $120 level, but the bulls have failed to push the price above $132.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/0195955a-877d-7f6a-8075-27a613fb38dd\"
    title=\"\" alt=\"Price analysis 3/14: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI,
    LEO, LINK\"><figcaption style=\"text-align: center;\"><p><em>SOL/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>If the price
    skids below $120, the SOL/USDT pair could drop to $110. This is a critical support
    to watch out for because a break and close below it may start a downward move
    to $98 and then to $80.</p><p>On the upside, a break and close above the 20-day
    EMA suggests that the selling pressure is reducing. The pair could rally to the
    50-day SMA ($178), where the bears are expected to mount a strong defense.</p><h2>Cardano
    price analysis</h2><p>Cardano (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/ada-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">ADA</a>) was rejected
    from the 20-day EMA ($0.77) on March 12, signaling that the bears are selling
    on rallies.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195955a-925b-718f-ae8c-9fd373e8988a\"
    title=\"\" alt=\"Price analysis 3/14: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI,
    LEO, LINK\"><figcaption style=\"text-align: center;\"><p><em>ADA/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The ADA/USDT
    pair could drop to the uptrend line, which is an important level for the bulls
    to defend. If the price bounces off the uptrend line with strength, it will improve
    the prospects of a break above the moving averages. If that happens, the pair
    could rise to $1.02.</p><p>This positive view will be invalidated in the near
    term if the price turns down and breaks below the uptrend line. That could start
    a slide to $0.58 and subsequently to the Feb. 3 intraday low of $0.50.</p><h2>Dogecoin
    price analysis</h2><p>Dogecoin (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/doge-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">DOGE</a>) bounced off
    the $0.14 support on March 11, indicating that the bulls are trying to defend
    the level.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195955a-9ce4-76a2-87d5-6a93a7e9f51e\"
    title=\"\" alt=\"Price analysis 3/14: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI,
    LEO, LINK\"><figcaption style=\"text-align: center;\"><p><em>DOGE/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The relief
    rally is expected to face selling at the 20-day EMA ($0.19). If the price turns
    down sharply from $0.19, it increases the possibility of a break below $0.14.
    The DOGE/USDT pair could then plummet to $0.10.</p><p><em><strong>Related: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-gold-price-12-year-support-record-3k\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-gold-price-12-year-support-record-3k\"><em><strong>Bitcoin-to-gold
    ratio breaks 12-year support as gold price hits a record $3K</strong></em></a></p><p>The
    first sign of strength will be a break and close above the 20-day EMA. That could
    open the doors for a rally to the 50-day SMA ($0.24). Sellers will try to stall
    the up move at the 50-day SMA, but if the bulls pierce the resistance, the pair
    could climb to $0.29.</p><h2>Pi price analysis</h2><p>Pi&rsquo;s (PI) recovery
    stalled at $1.80 on March 13, indicating that the bears are selling on every minor
    rally.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195955a-a548-75aa-9406-c2cf9c808920\"
    title=\"\" alt=\"Price analysis 3/14: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI,
    LEO, LINK\"><figcaption style=\"text-align: center;\"><p><em>PI/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The bears will
    try to sink the price to $1.20, which is a crucial level to watch out for. If
    the price rebounds off $1.20, it will indicate a possible range formation. The
    PI/USDT pair could oscillate between $1.20 and $1.80 for some time.</p><p>Contrary
    to this assumption, if the price continues lower and breaks below $1.20, it will
    signal the resumption of the downward move. The pair could descend to the 78.6%
    retracement level of $0.72.</p><h2>UNUS SED LEO price analysis</h2><p>UNUS SED
    LEO (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/leo-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">LEO</a>) has been trading
    near the $10 overhead resistance, indicating that the bulls have kept up the pressure.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/0195955a-aea3-7621-823d-ebb94afd6929\"
    title=\"\" alt=\"Price analysis 3/14: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI,
    LEO, LINK\"><figcaption style=\"text-align: center;\"><p><em>LEO/USD daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>A break and
    close above $10 will complete a bullish ascending triangle pattern, which could
    start an upmove toward the pattern target of $12.04.</p><p>The bears are likely
    to have other plans. They will try to pull the price to the uptrend line, which
    is an important level to watch out for. If the price rebounds off the uptrend
    line, it will signal that the LEO/USD pair may remain inside the triangle for
    a while. </p><p>The bears will gain the upper hand on a break and close below
    the uptrend line. That could sink the pair to $8.84 and later to $8.30.</p><h2>Chainlink
    price analysis</h2><p>Chainlink (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/chainlink-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">LINK</a>) plunged and
    closed below the support line of the descending channel pattern on March 10, but
    the bears could not sustain the lower levels.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195955a-b8ee-76c1-9c85-81ac85bc83e8\"
    title=\"\" alt=\"Price analysis 3/14: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI,
    LEO, LINK\"><figcaption style=\"text-align: center;\"><p><em>LINK/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The bulls have
    pushed the price back into the channel on March 14, but their efforts are likely
    to be met with strong selling at the 20-day EMA ($15.14). If the price turns down
    from the 20-day EMA, the bears will attempt to sink the LINK/USDT pair below $11.85.
    If they manage to do that, the pair could decline to $10.</p><p>On the contrary,
    a break and close above the 20-day EMA will signal that the markets have rejected
    the break below the channel. The pair may then climb to the 50-day SMA ($18.27).</p><p
    class=\"post-content__disclaimer\" type=\"\">This article does not contain investment
    advice or recommendations. Every investment and trading move involves risk, and
    readers should conduct their own research when making a decision.</p><template

  summary: "Today in crypto, Conor McGregor launches memecoin, Bitcoin creator Satoshi
    Nakamoto turns 50 as their creation becomes a US reserve asset, and a US Securities
    and Exchange Commission (SEC) commissioner.UFC champion and political candidate
    Conor McGregor launches tokenUFC champion fighter and Irish political candidate
    Conor McGregor launched a memecoin called \"REAL\" on April 5 in collaboration
    with the Real World Gaming decentralized autonomous organization (DAO).Spokespeople
    for the project characterized the release of the token, which was launched through
    a sealed-bid auction, as fairer for retail buyers and a bulwark against bots and
    snipers hijacking the token price.Source: Conor McGregorIn a statement to Cointelegraph,
    McGregor said, \"This is about transparency — we are showing the world how it
    is done with integrity.”At the time of this writing, the token has only managed
    to attract approximately $144,530 of the $3,600,000 auction target.Satoshi Nakamoto
    turns 50 as Bitcoin becomes US reserve assetSatoshi Nakamoto, the pseudonymous
    creator of Bitcoin, marks their 50th birthday amid a year of rising institutional
    and geopolitical adoption of the world’s first cryptocurrency.The identity of
    Nakamoto remains one of the biggest mysteries in crypto, with speculation ranging
    from cryptographers like Adam Back and Nick Szabo to broader theories involving
    government intelligence agencies.While Nakamoto’s identity remains anonymous,
    the Bitcoin (BTC) creator is believed to have turned 50 on April 5 based on details
    shared in the past.According to archived data from his P2P Foundation profile,
    Nakamoto once claimed to be a 37-year-old man living in Japan and listed his birthdate
    as April 5, 1975.Source: Web.archive.orgNakamoto’s anonymity has played a vital
    role in maintaining the decentralized nature of the Bitcoin network, which has
    no central authority or leadership.The Bitcoin wallet associated with Nakamoto,
    which holds over 1 million BTC, has laid dormant for more than 16 years despite
    BTC rising from $0 to an all-time high above $109,000 in January.SEC paints ‘a
    distorted picture’ of USD-stablecoin market — CrenshawUS Securities and Exchange
    Commission (SEC) Commissioner and vocal crypto critic Caroline Crenshaw has accused
    the US regulator of downplaying risks and misrepresenting the US stablecoin market
    in its newly published guidelines.However, many in the crypto industry see the
    SEC’s decision as a step in the right direction.In an April 4 statement, Crenshaw,
    who is widely known for opposing the spot Bitcoin ETFs, said that the SEC's statement
    on stablecoins contained \"legal and factual errors that paint a distorted picture
    of the USD-stablecoin market that drastically understates its risks.\"Under the
    new SEC guidelines, stablecoins that meet certain criteria are now considered \"non-securities\"
    and are exempt from transaction reporting requirements.Crenshaw disputed the accuracy
    of the analysis made by the SEC in arriving at that decision. She pushed back
    on the SEC for reiterating issuer actions \"that supposedly stabilize price, ensure
    redeemability, and otherwise reduce risk.\"\n\n            "

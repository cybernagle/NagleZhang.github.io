- title: " US Bitcoin ETFs break outflow streak with $13.3M inflow "
  url: https://cointelegraph.com/news/bitcoin-etfs-break-outflow-streak-13m-inflow?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Over $1.67 billion exited US spot Bitcoin and Ether exchange-traded funds
    (ETFs) in March, but investors stopped the bleeding by bringing in $13.3 million
    on March 12 as the BTC market price inched closer to $85,000.As of March 12, spot
    Bitcoin ETFs had attracted $35.4 million worth of inflows spread across two days,
    according to Farside Investors data. On the other hand, spot Ether ETFs recorded
    inflows on just one occasion, bringing in $14.6 million on March 4.Spot Bitcoin
    ETF daily flow data. Source: Farside InvestorsBitcoin ETFs break outflow streak
    with $13.3 million inflowAccording to Sosovalue, the cumulative net inflows of
    BTC ETFs confirmed the recent $13.3 million inflow on March 12, signaling a pause
    in Bitcoin’s ETF outflows.The total value of the trades that day for Bitcoin ETFs
    amounted to $2.01 billion, its lowest daily value since Feb. 20. The inflows were
    contributed by three BTC funds: BlackRock’s iShares Bitcoin Trust (IBIT), the
    ARK 21Shares Bitcoin ETF (ARKB) and the Grayscale Bitcoin Mini Trust ETF (BTC).Daily
    flow of investments into spot Bitcoin ETFs. Source: SosovalueOn the Ethereum side,
    the one day of inflows saw contributions from the Fidelity Ethereum Fund (FETH),
    Bitwise Ethereum ETF (ETHW), Grayscale Ethereum Trust (ETHE) and the Grayscale
    Ethereum Mini Trust (ETH).Spot Ether ETF daily flow data. Source: Farside InvestorsMarket
    downturn and geopolitical tensions drive ETF outflowsThe broader market downturn
    and macroeconomic uncertainties have contributed to the ETF outflows, driven by
    geopolitical tensions, trade wars and bearish investor sentiment.Related: Crypto
    ETPs see 4th straight week of outflows, totaling $876M — CoinSharesAnalysts say
    that the lack of concrete implementation or unmet expectations regarding President
    Donald Trump’s Strategic Bitcoin Reserve plan has also exacerbated selling pressure.Despite
    Bitcoin maintaining levels above $80,000, market watchers warned that the upcoming
    European Union retaliatory tariffs could introduce greater volatility, further
    influencing Bitcoin’s price trajectory.Magazine: Crypto fans are obsessed with
    longevity and biohacking: Here’s why\n\n            "

  summary: "Bitcoin (BTC) is moving farther away from the crucial $90,000 mark, indicating
    that buying dries up at higher levels. Market participants seem nervous about
    the fresh round of US trade tariffs and the renewed inflation pressure as US Personal
    Consumption Expenditures data came in hotter-than-expected.Traders are divided
    about Bitcoin’s price trajectory in 2025. Analyzing data from the prediction markets
    platform Polymarket, X user Ashwin highlighted that Bitcoin’s most bearish target
    for 2025 is $59,040, and the most bullish is $138,617.Crypto market data daily
    view. Source: Coin360Although the near-term remains uncertain, Real Vision chief

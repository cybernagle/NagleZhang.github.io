- title: " Ethereum &#039;falling knife&#039; warning: Is another 30% crash versus
    Bitcoin coming? "
  url: https://cointelegraph.com/news/ethereum-falling-knife-another-30-crash-bitcoin?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMTEvMDE5Mzc2ZWMtNzkwOS03NTA5LWE2NmEtNTY4MGFhY2MwOTBh.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMTEvMDE5Mzc2ZWMtNzkwOS03NTA5LWE2NmEtNTY4MGFhY2MwOTBh.jpg\"
    alt=\"Ethereum 'falling knife' warning: Is another 30% crash versus Bitcoin coming?\"></p><p>Ethereum&rsquo;s
    native token, Ether (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/ethereum-price\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/ethereum-price\">ETH</a>),
    has dropped to its multi-year lows against Bitcoin (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/bitcoin-price\" rel=\"\" target=\"_self\" text=\"null\"
    title=\"https://cointelegraph.com/bitcoin-price\">BTC</a>), prompting analysts
    to predict further declines in the coming weeks.<h2>Falling knife warning furthers
    sell-off risks </h2><p>On March 13, ETH/BTC&mdash;a pair that tracks Ether&rsquo;s
    strength against Bitcoin&mdash;dropped by over 1.50% to reach $0.022, its lowest
    level since May 2020.</p><p>ETH&rsquo;s descent is part of its multi-year downtrend
    that started when it established a record high of $0.156 in June 2017. Since then,
    it has plunged by more than 85%, underscoring Ether&rsquo;s growing weakness against
    Bitcoin.</p><p>Meanwhile, on the two-week ETH/BTC chart, the relative strength
    index (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/here-s-3-ways-the-relative-strength-index-rsi-can-be-used-as-a-sell-signal\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/here-s-3-ways-the-relative-strength-index-rsi-can-be-used-as-a-sell-signal\">RSI</a>),
    a momentum indicator used to measure whether an asset is overbought or oversold,
    has fallen to a record low of 23.32.</p><figure><img alt=\"Markets, Tech Analysis,
    Market Analysis, Ethereum Price, Ethereum ETF, Bitcoin ETF\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01958e27-f975-706f-9f6c-6772a61cb193\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>ETH/BTC two-week price
    chart. Source: TradingView</em></p></figcaption></figure><p>Typically, when RSI
    drops below 30, it signals oversold conditions, potentially leading to a price
    rebound. </p><p>However, in Ethereum&rsquo;s case, RSI has continued to plunge
    even lower even two months after becoming oversold, suggesting that ETH&rsquo;s
    downtrend is still accelerating rather than stabilizing.</p><p>Crypto analyst
    Alessandro Ottaviani has <a data-ct-non-breakable=\"null\" href=\"https://x.com/AlexOttaBTC/status/1899684372296437761\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://x.com/AlexOttaBTC/status/1899684372296437761\">described</a>
    the situation as a &ldquo;falling knife&rdquo; scenario&mdash;a term used to describe
    an asset that is experiencing a rapid and steep decline, often discouraging buyers
    from stepping in too soon. </p><p>A falling knife implies that attempting to catch
    the asset at a perceived low could lead to further losses if the downtrend persists.</p><p>For
    Ethereum to signal a potential reversal, traders will be watching for RSI stabilization
    and reclaim of key resistance levels. That ideally begins with a rebound from
    the 0.022 BTC level, which had limited ETH/BTC&rsquo;s downside attempts in December
    2020, leading to a 300% rally.</p><figure><img alt=\"Ethereum 'falling knife'
    warning: Is another 30% crash versus Bitcoin coming?\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01958a58-441b-7f96-9e3a-29c16b15403a\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>ETH/BTC weekly price
    chart. Source: TradingView</em></p></figcaption></figure><p>Should a rebound happen,
    the ETH/BTC pair can rally toward its 0.382 Fibonacci retracement line at around
    0.038 BTC, aligning with the 50-week exponential moving average (50-week EMA;
    the red wave).</p><p>Until then, the technical outlook suggests that ETH/BTC could
    remain trapped in its falling knife trajectory, with the next potential downside
    targets at historical support levels inside the 0.020-0.016 BTC range.</p><figure><img
    alt=\"Ethereum 'falling knife' warning: Is another 30% crash versus Bitcoin coming?\"
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958a5a-e9c7-77f6-b8e3-8e566f88f450\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>ETH/BTC two-week price
    chart. Source: TradingView</em></p></figcaption></figure><p>The lowest point of
    this range is approximately 30% below the current price levels.</p><h2>ETH/BTC
    fundamentals support a bearish outlook</h2><p>Ether&rsquo;s prospects of declining
    further against Bitcoin are rooted in factors beyond technical analysis. </p><p>For
    instance, Ethereum currently faces strong competition from rival layer-1 blockchains,
    namely Solana (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/solana-price-index\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/solana-price-index\">SOL</a>).
    </p><p><em><strong>Related: '</strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/worst-thing-ethereum-eth-price-down-70-btc-the-merge\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/worst-thing-ethereum-eth-price-down-70-btc-the-merge\"><em><strong>The
    worst thing that happened to Ethereum' &mdash; Bitcoin up 160% since the Merge</strong></em></a></p><p>VanEck
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/solana-dex-volumes-still-rival-ethereum-s-despite-memecoin-meltdown-van-eck\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/solana-dex-volumes-still-rival-ethereum-s-despite-memecoin-meltdown-van-eck\">noted</a>
    that Solana&rsquo;s decentralized exchange volume has surpassed Ethereum&rsquo;s
    even during a steep dropoff in <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/solana-revenue-slumps-90-from-january-high-memecoin-mania-dies\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/solana-revenue-slumps-90-from-january-high-memecoin-mania-dies\">memecoin
    trading activity</a>. Meanwhile, Solana&rsquo;s volume has risen consistently
    in recent months, which coincides with a decline in Ethereum&rsquo;s volumes.</p><figure><img
    alt=\"Ethereum 'falling knife' warning: Is another 30% crash versus Bitcoin coming?\"
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958a71-9caf-7a7e-8eac-7a7d1f107c61\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Solana vs. Ethereum
    DEX volumes. Source: VanEck</em></p></figcaption></figure><p>Furthermore, the
    launch of spot Bitcoin ETFs has <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/altseason-bitcoin-etf-crypto-investment\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/altseason-bitcoin-etf-crypto-investment\">fundamentally
    altered the traditional crypto market cycle</a> that used to benefit Ethereum
    and other altcoins.</p><p>Historically, after Bitcoin surged post-halving, capital
    rotated into altcoins, triggering an &ldquo;<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/when-will-altseason-arrive-experts-reveal-what-s-holding-back-altcoins\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/when-will-altseason-arrive-experts-reveal-what-s-holding-back-altcoins\">altseason</a>&rdquo;
    where ETH and other assets outperformed BTC. However, the <a data-ct-non-breakable=\"null\"
    href=\"https://farside.co.uk/btc/\" rel=\"nofollow noopener\" target=\"_blank\"
    text=\"null\" title=\"https://farside.co.uk/btc/\">$129 billion inflows into Bitcoin
    ETFs</a> in 2024 have disrupted this cycle, draining liquidity from the broader
    altcoin market&mdash;including Ethereum.</p><figure><img alt=\"Ethereum 'falling
    knife' warning: Is another 30% crash versus Bitcoin coming?\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01958a8a-a303-7364-89b4-b3b358e2ce97\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Bitcoin Dominance
    Index weekly price chart. Source: TradingView</em></p></figcaption></figure><p>Another
    factor is Ethereum-specific selling pressure. </p><p>The <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/safe-wallet-releases-bybit-hack-post-mortem\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/safe-wallet-releases-bybit-hack-post-mortem\">recent
    Bybit hack</a> reportedly led to substantial ETH liquidations, with some of that
    value <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bybit-hacker-launders-1-billion-stolen-funds\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/bybit-hacker-launders-1-billion-stolen-funds\">laundered
    via decentralized platforms like Thorchain</a>. This absorbed sell-off may still
    be rippling through the market, depressing ETH&rsquo;s relative value.</p><p class=\"post-content__disclaimer\"
    type=\"\">This article does not contain investment advice or recommendations.
    Every investment and trading move involves risk, and readers should conduct their
    own research when making a decision.</p><template data-name=\"subscription_form\"
    data-type=\"markets_outlook\" label=\"Subscription Form: Markets Outlook\"></template></p>\n</p>\n

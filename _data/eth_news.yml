    try to drive the index to the all-time high. Sellers will have to tug the price
    below the 20-day EMA to break the bullish momentum. US Dollar Index price predictionThe
    relief rally in the US Dollar Index (DXY) hit a wall at the 50-day simple moving
    average (101.67) on May 12, indicating that the bears are selling on rallies.DXY
    daily chart. Source: Cointelegraph/TradingViewThe index is likely to find support
    at the 100.27 level. If the price rebounds off 100.27, the bulls will again try
    to kick the index above the 50-day SMA. If they manage to do that, the index could
    pick up momentum and surge toward 103.54. Such a move signals that the corrective
    phase may be over.Sellers will retain the advantage if the price closes below
    the 100.27 support. That opens the doors for a retest of the 99 level.Bitcoin
    price predictionBitcoin broke above the overhead resistance at $105,820 on May
    18, but the bulls could not sustain the momentum.BTC/USDT daily chart. Source:
    Cointelegraph/TradingViewSellers are expected to fiercely defend the zone between
    $107,000 and $109,588. The 20-day EMA ($100,787) is the crucial support to watch

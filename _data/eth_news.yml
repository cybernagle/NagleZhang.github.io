- title: " Crypto sleuth ZachXBT says he unmasked 50x Hyperliquid whale "
  url: https://cointelegraph.com/news/zachxb-unmasked-mysterious-50x-hyperliquid-whale?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Onchain sleuth ZachXBT said he had identified the mysterious whale who
    made $20 million in profits from highly leveraged trades on Hyperliquid and GMX
    as a British hacker known as William Parker.According to ZachXBT’s March 20 X
    post, Parker — who was previously known as Alistair Packover before changing his
    name — was arrested last year for allegedly stealing around $1 million from two
    casinos in 2023. Parker also made headlines a decade ago for allegations of hacking
    and gambling, ZachXBT said.“It is abundantly clear WP/AP has not learned his lesson
    over the years after serving time for fraud and will likely continue gambling,”
    ZachXBT said.Source: ZachXBTRelated: Hyperliquid ups margin requirements after
    $4 million liquidation lossZachXBT said his findings are based on a phone number
    provided by a person who allegedly received a payment from the whale trader’s
    wallet address. He also said that public wallet addresses associated with the
    whale trader received proceeds from past onchain phishing schemes.Cointelegraph
    has not independently verified ZachXBT’s claims. Massive leveraged betsThe mysterious
    whale rose to prominence after profiting approximately $20 million from highly
    leveraged trades — in some cases with up to 50x leverage — on decentralized perpetuals
    exchanges Hyperliquid and GMX. On March 12, the trader intentionally liquidated
    an approximately $200 million Ether (ETH) long, causing Hyperliquid’s liquidity
    pool to lose $4 million. Meanwhile, the whale earned profits of some $1.8 million.Hyperliquid
    said the liquidation was not an exploit but rather a predictable consequence of
    how the trading platform operates under extreme conditions. The DEX later revised
    its collateral rules for traders with open positions to guard against such occurrences
    in the future. On March 14, the whale took another multimillion-long position,
    this time on Chainlink (LINK).Perpetual futures, or “perps,” are leveraged futures
    contracts with no expiry date. Traders deposit margin collateral — typically USDC
    (USDC) for Hyperliquid — to secure open positions. Magazine: ‘Hong Kong’s FTX’
    victims win lawsuit, bankers bash stablecoins: Asia Express\n\n            "
  published: 2025-03-20 18:48:15.000000000 +00:00
- title: " ‘Successful’ ETH ETF less perfect without staking — BlackRock "
  url: https://cointelegraph.com/news/successful-eth-etf-less-perfect-without-staking-blackrock?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "BlackRock’s head of digital assets, Robbie Mitchnick, described the firm’s
    Ether (ETH) exchange-traded fund (ETF) as a “tremendous success” but acknowledged
    a key limitation. Speaking on March 20 at the Digital Asset Summit, he noted that
    the ETF is “less perfect” without staking, highlighting a crucial feature absent
    from the current offering.“A staking yield is a meaningful part of how you can
    generate investment return in this space,” Mitchnick said. “And all the [Ether]
    ETFs, of course, at launch did not have staking. So, if that is able to get resolved...”However,
    adding staking to Ether ETFs is no simple task, according to Mitchnick. “It’s
    not as simple as a new administration just green-lighting something, and then
    boom, we’re all good, off to the races,” he said. “There’s a lot of fairly complex
    challenges that have to be figured out, but if that can get figured out, then
    I think it’s gonna be sort of a step change upward in terms of what we see the
    activity around those products is.”Panel at Digital Asset Summit 2025 with Joseph
    Lubin (middle) and Robbie Mitchnick (right). Source: YouTubeETH staking was first
    introduced in December 2020 as part of the Ethereum network’s move from a proof-of-work
    consensus mechanism to proof-of-stake. By February 2024, Ether staking deposits
    reached $85 billion, accounting for 25% of the circulating supply of the cryptocurrency.The
    current yield rate for staked Ether is between 2% and 7% annually. However, staking
    ETH comes with risks, including the possibility of slashing if a validator engages
    in misconduct. This potential penalty could deter traditional investors, as it
    introduces an additional layer of risk to their investments.Related: Ether ETFs
    poised to surge in 2025, analysts sayJoseph Lubin weighs in on Ethereum narrativesNarratives
    surrounding Ethereum have, at times, been negative during this bull run, especially
    because the price of Ether has lagged behind other crypto tokens.Also speaking
    at the Digital Asset Summit, Ethereum co-founder Joseph Lubin said the narrative
    about Ethereum to institutional investors is “too big to describe.” “It’s like
    trying to describe the internet protocols and the web protocols,” Lubin said,
    adding: “It can do everything just the way you can do pretty much anything on
    the web. And so, there are people who can rock all of that, who can hold a lot
    of the complexity and the potentiality in mind, but most people are not gonna
    be able to do that.”According to Lubin, the Ethereum narrative should target applications
    that matter to users and businesses rather than broad theoretical discussions.
    “We are at our broadband moment, and we will see applications like social graphs,
    decentralized ID, attestations, reputation, things that you can use inside of
    different applications.”BlackRock's ETH pitch to investorsMitchnick noted that
    when talking to institutional investors, Ethereum is easier to describe at a second-grade
    level than a 10th-grade level.Robbie Mitchnick at Digital Asset Summit 2025. Source:
    YouTube“Second-grade level, it’s a technology innovation story,” Mitchnick said.
    “Once you start to get beyond that, it does get a little more vast, a little more
    complicated. It’s about being a bet on blockchain adoption and innovation. That’s
    part of the thesis as we communicate it to clients. And then when they wanna get
    down to a little more tangible level, we can talk about some of the more specific
    use cases that it unlocks.”BlackRock has advertised Ethereum to investors as a
    bet on tokenization, stablecoin adoption and decentralized finance, according
    to Mitchnick.Data from SoSoValue shows ETH ETFs hold a total value of $7 billion
    as of March 20, with a cumulative inflow of $2.5 billion. However, the ETFs have
    seen a cumulative outflow of $358 million in the past 11 days as the cryptocurrency
    market has largely struggled.Magazine: Ethereum L2s will be interoperable ‘within
    months’ — Complete guide\n\n            "
  published: 2025-03-20 18:30:00.000000000 +00:00
- title: " Kevin O’Leary reveals key catalysts that could reverse the bearish trend "
  url: https://cointelegraph.com/news/kevin-o-leary-crypto-future-game-changing-legislation-bull-run?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "The crypto market is currently facing significant pressure, largely due
    to US President Donald Trump’s trade war and deteriorating macroeconomic conditions.
    These factors have put markets under strain, with some analysts predicting that
    the bull run is over and a bear market may be on the horizon.In a recent Cointelegraph
    interview, Kevin O’Leary, also known as “Mr. Wonderful,” shared his thoughts on
    the current state of the market and what could be ahead. Despite the turbulence,
    O’Leary remains optimistic about the future of Bitcoin (BTC). He explains that
    while the market is under pressure, he still expects Bitcoin to end the year higher
    as a couple of key factors come into play.A key issue discussed in the interview
    is the need for regulatory clarity, especially surrounding stablecoins. O’Leary
    is particularly focused on the GENIUS Act, which he believes will be passed imminently
    by the US Congress. “We have been waiting for almost seven years for this legislation.
    I have a feeling it’s going to make it, and when that happens, it’s a game changer,”
    O’Leary said.The passage of the GENIUS Act, which aims to provide regulatory clarity
    around stablecoins, should boost the adoption of dollar-backed stablecoins. This
    move is expected to bring much-needed stability and legitimacy to the crypto market,
    helping to mitigate some of the ongoing risks. O’Leary also shared insights into
    his personal crypto portfolio, revealing a diversified mix of assets in his portfolio.To
    dive deeper into O’Leary’s views on the current state of the crypto market and
    his personal approach to investing in crypto, make sure to watch the full interview
    on our channel.Related: Trump says US will be 'Bitcoin superpower' as BTC price
    breaks 4-month downtrend\n\n            "
  published: 2025-03-20 17:21:02.000000000 +00:00
- title: " Solana futures ETF to grow institutional adoption, despite limited inflows "
  url: https://cointelegraph.com/news/solana-futures-etf-launch-spot-etf-expected?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "The crypto industry is set to debut the first Solana futures exchange-traded
    fund (ETF), a significant development that may pave the way for the first Solana
    spot ETF as the “next logical step” for crypto-based trading products, according
    to industry watchers.Volatility Shares is launching two Solana (SOL) futures ETFs,
    the Volatility Shares Solana ETF (SOLZ) and the Volatility Shares 2X Solana ETF
    (SOLT), on March 20.The debut of the first Solana futures ETF may bring significant
    new institutional adoption for the SOL token, according to Ryan Lee, chief analyst
    at Bitget Research.Volatility Shares Solana ETF SEC filing. Source: SECThe analyst
    told Cointelegraph: “The launch of the first Solana ETFs in the US could significantly
    boost Solana’s market position by increasing demand and liquidity for SOL, potentially
    narrowing the gap with Ethereum’s market cap.”The Solana ETF will grow institutional
    adoption by “offering a regulated investment vehicle, attracting billions in capital
    and reinforcing Solana’s competitiveness against Ethereum,” said Lee, adding that
    “Ethereum’s entrenched ecosystem remains a formidable barrier.”Still, other industry
    participants are concerned that the Solana futures ETF will lead to investor disappointment
    due to a lack of inflows, as we’ve seen with the spot Ether (ETH) ETF launch,
    which was only a “sidekick” to Bitcoin ETFs in terms of inflows, as predicted
    by Bloomberg’s senior ETF analyst, Eric Balchunas.Related: Bitcoin beats global
    assets post-Trump election, despite BTC correctionSOL futures ETF may disappoint,
    but spot SOL ETFs may be nextWhile the futures ETF may not bring significant inflows,
    it legitimizes Solana’s status as a top cryptocurrency, especially after US President
    Donald Trump announced that his Working Group on Digital Assets would include
    Solana in the US crypto strategic reserve, along with Cardano’s ADA (ADA) token
    and XRP (XRP).“Solana ETFs are in motion creating the possible avenues for more
    wide-scale adoption,” according to Anmol Singh, co-founder of Bullet — a Solana-native
    perpetual futures decentralized exchange.Singh told Cointelegraph:“Solana spot
    ETF is yet to be approved, but given the increased awareness around Solana and
    the futures ETFs, this would be a logical next step.”“We can expect moderate inflows
    into the futures ETF — spot ETF is generally a better instrument for getting exposure,
    and that will be the major milestone,” he added.Related: Trump-linked WLFI triples
    Ether holdings, Solana sees $485M outflows: Finance RedefinedWhile the adoption
    rate of futures ETFs is difficult to measure, a spot Solana ETF may attract between
    $3 billion and $6 billion of net assets in the first six months, eclipsing the
    adoption rate of Ether ETFs, according to a JPMorgan report seen by Cointelegraph. SOL
    and XRP ETPs could attract $3 billion–$8 billion. Source: JPMorgan“When applying
    these so-called “adoption rates” to SOL and XRP, we see SOL attracting roughly
    $3 billion–$6 billion of net assets and XRP gathering $4 billion–$8 billion in
    net new assets,” the report stated.However, “the timeline could extend into 2026
    due to the SEC’s precedent of taking […] 240–260 days to review filings,” James
    Seyffart, Bloomberg Intelligence analyst, said on Jan. 16.Magazine: Memecoins
    are ded — But Solana ‘100x better’ despite revenue plunge\n\n            "
  published: 2025-03-20 13:38:17.000000000 +00:00
- title: " Coinbase becomes Ethereum&#039;s largest node operator with 11% stake "
  url: https://cointelegraph.com/news/coinbase-largest-ethereum-node-operator-11-percent-staked-eth?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "A Coinbase report revealed that the crypto exchange is the largest node
    operator on the Ethereum network, controlling 11.42% of the total staked Ether.In
    a performance report, Coinbase said it had 3.84 million Ether (ETH), worth about
    $6.8 billion, staked to its validators. The exchange said that, as of March 3,
    it has 11.42% of the total staked ETH. Anthony Sassano, host of The Daily Gwei,
    said that Coinbase's stake makes the exchange the “single largest node operator”
    in the network. Sassano added that while the staking platform Lido is bigger as
    a collective, each node operator has a much smaller percentage share. Source:
    Anthony SassanoRelated: 83% of institutions plan to up crypto allocations in 2025:
    CoinbaseCoinbase validator uptime and participation rate at 99.75%Coinbase also
    shared that it exceeded its target for validator uptime, which indicates the percentage
    of time when validators are operational. It also had a similar figure for its
    participation rate, a metric that indicates how well validators perform their
    consensus duties.Coinbase also reported that its validators had an average uptime
    of 99.75%. Coinbase said they outperformed their target of 99% uptime without
    compromising security standards. The exchange attributed the performance to an
    upgrade implemented in 2024, which allowed the exchange to keep validators running
    while performing beacon node maintenance. Meanwhile, Coinbase validators’ participation
    rate is also at 99.75%. This exceeds the network average of 99.52%. In addition,
    the Coinbase average for signing and submitting blocks produced by their MEV relays
    is 99.76%, higher than the network average of 99.38%. While Coinbase operates
    a centralized exchange platform, the company said it distributes its validators
    across several regions to “help maintain a truly distributed and decentralized
    Ethereum blockchain.” The exchange said its validators operate in Japan, Singapore,
    Ireland, Germany and Hong Kong. Coinbase validator average performance versus
    Ethereum network averages. Source: CoinbaseEther surges above $2,000 on March
    20Coinbase’s recent report was followed by a surge in ETH prices as ETH accumulation
    addresses started stockpiling significantly. 7-day ETH price chart. Source: CoinGeckoOn
    March 2, Ether hit a weekly high of $2,060.73, surging by 12.3% in seven days.
    On March 19, the asset’s daily trading volume reached $17.4 billion as its price
    surpassed $2,000. The surge comes as ETH price sentiments turned bearish. On March
    11, Yuga Labs’ vice president of blockchain suggested that ETH could drop as low
    as $200 in a prolonged bear market. Magazine: Memecoins are ded — But Solana ‘100x
    better’ despite revenue plunge\n\n            "

- title: " Ethereum onchain data suggests $2K ETH price is out of reach for now "
  url: https://cointelegraph.com/news/ethereum-onchain-data-2k-eth-price-out-of-reach?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMTIvMDE5M2U3YTAtYzgzMS03NDM0LTk1NTQtYmY3MzFmMDVmOGE0.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMTIvMDE5M2U3YTAtYzgzMS03NDM0LTk1NTQtYmY3MzFmMDVmOGE0.jpg\"
    alt=\"Ethereum onchain data suggests $2K ETH price is out of reach for now\"></p><p>Ether&rsquo;s
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/ethereum-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">ETH</a>) price has been
    consolidating within a roughly $130 range over the last seven days as $2,000 remains
    strong overhead resistance.<p>Data from <a data-ct-non-breakable=\"null\" href=\"https://subscription.cointelegraph.com/?_gl=1*7499wx*_ga*MTQ0MzQ0NzI4Ny4xNzE2MzY1NTA0*_ga_53R24TEEB1*MTcxNjM2NTUwNC4xLjEuMTcxNjM2Njg2MC4wLjAuMA..\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Cointelegraph Markets
    Pro</a> and Bitstamp shows that ETH price oscillates within a tight range between
    $1,810 and $1,960.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a413-f91c-7562-8140-e078a005342c\"
    title=\"\" alt=\"Ethereum onchain data suggests $2K ETH price is out of reach
    for now\"><figcaption style=\"text-align: center;\"><p><em>ETH/USD daily chart.
    Source: Cointelegraph/</em><a data-ct-non-breakable=\"null\" href=\"https://www.tradingview.com/x/fZJnJjP5/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://www.tradingview.com/x/fZJnJjP5/\"><em>TradingView</em></a></p></figcaption></figure><p>Ether
    price remains pinned below $2,000 for several reasons, including declining Ethereum&rsquo;s
    weak network activity and decreasing TVL, negative spot Ethereum ETF flows, and
    weak technicals.</p><h2><strong>Negative spot Ethereum ETF outflows</strong></h2><p>The
    underperformance in Ether&rsquo;s price can be attributed to investors&rsquo;
    risk-off behavior, which is visible across the<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/learn/articles/spot-ethereum-etf\" rel=\"null\"
    target=\"null\" text=\"null\" title=\"null\"> spot Ethereum exchange-traded funds</a>
    (ETFs). ETH outflows from these investment products have persisted for more than
    two weeks.</p><p>US-based spot Ether ETFs have recorded a streak of outflows for
    the last seven days, totaling $265.4 million, as per data from SoSoValue.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a413-fe7d-7a97-b19b-01dba52756e5\"
    title=\"\" alt=\"Ethereum onchain data suggests $2K ETH price is out of reach
    for now\"><figcaption style=\"text-align: center;\"><p><em>Ether ETF flow chart.
    Source: </em><a data-ct-non-breakable=\"null\" href=\"https://sosovalue.com/assets/etf/us-eth-spot\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://sosovalue.com/assets/etf/us-eth-spot\"><em>SoSoValue</em></a></p></figcaption></figure><p>At
    the same time, other Ethereum investment products saw <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/crypto-etps-see-1-7b-outflows-fifth-week-in-row\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/crypto-etps-see-1-7b-outflows-fifth-week-in-row\">outflows
    totaling $176 million</a>. This brings month-to-date outflows out of Ether ETPs
    to $265 million, in what CoinShares&rsquo;s head of research, James Butterfill,
    described as the &ldquo;worst on record.&rdquo; </p><p>He noted:</p><blockquote>&ldquo;This
    also marks the 17th straight day of outflows, the longest negative streak since
    our records began in 2015.&rdquo;</blockquote><h2><strong>Weak onchain activity
    hurts ETH price</strong></h2><p>To understand the key drivers behind Ether&rsquo;s
    weakness, it is essential to analyze Ethereum&rsquo;s onchain metrics.</p><p>The
    Ethereum network maintained its leadership based on the 7-day decentralized exchange
    (DEX) volume. However, the metric has been declining over the last few weeks,
    dropping by approximately 30% in the last seven days to reach $16.8 billion on
    March 17.&nbsp;</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a414-03ac-7b84-9902-d3f9ab459808\"
    title=\"\" alt=\"Ethereum onchain data suggests $2K ETH price is out of reach
    for now\"><figcaption style=\"text-align: center;\"><p><em>Ethereum: 7-day DEX
    volumes, USD. Source: DefiLlama</em></p></figcaption></figure><p>Key weaknesses
    for Ethereum included an 85% drop in activity on Maverick Protocol and a 45% decline
    in Dodo&rsquo;s volumes.</p><p>Similarly, Ethereum&rsquo;s <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/explained/what-is-total-value-locked-tvl-in-crypto-and-why-does-it-matter#:~:text=It%20is%20the%20total%20value,in%20the%20previous%20two%20years.\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">total value locked</a>
    (TVL) decreased 9.3% month-to-date, down 47% from its January high of $77 billion
    to $46.37 billion on March 11.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a414-0930-71c6-92df-a1bdd87ee3dd\"
    title=\"\" alt=\"Ethereum onchain data suggests $2K ETH price is out of reach
    for now\"><figcaption style=\"text-align: center;\"><p><em>Ethereum: total value
    locked. Source: DefiLlama</em></p></figcaption></figure><p>Lido was among the
    weakest performers in Ethereum deposits, with TVL dropping 30% over 30 days. Other
    notable declines included EigenLayer (-30%), Ether.fi (-29%), and Maker (-28%).</p><h2><strong>Ether&rsquo;s
    bear flag target is at $1,530</strong></h2><p>Meanwhile, Ether&rsquo;s technicals
    show a potential&nbsp;<a data-ct-non-breakable=\"null\" href=\"https://crypto.news/crypto-trading-101-bull-and-bear-flags/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">bear flag</a>&nbsp;on
    the four-hour chart, which hints at more downside in the coming days or weeks.</p><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/ether-price-bottom-sec-delays-multiple-crypto-etfs-ftx-hodlers-digest/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/magazine/ether-price-bottom-sec-delays-multiple-crypto-etfs-ftx-hodlers-digest/\"><em><strong>ETH
    may bottom at $1.6K, SEC delays multiple crypto ETFs, and more: Hodler&rsquo;s
    Digest, March 9 &ndash; 15</strong></em></a></p><p>A bear flag is a downward continuation
    pattern characterized by a small, upward-sloping channel formed by parallel lines
    against the prevailing downtrend. It gets resolved when the price decisively breaks
    below its lower trendline and falls by as much as the prevailing downtrend&rsquo;s
    height.</p><p>ETH bulls are counting on support from the flag&rsquo;s lower boundary
    at $1,880. A daily candlestick close below this level would signal a bearish breakout
    from the chart formation, projecting a decline to $1,530. Such a move would represent
    a 20% descent from the current price.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a414-0f0d-703f-9a0c-0efd05cb07ec\"
    title=\"\" alt=\"Ethereum onchain data suggests $2K ETH price is out of reach
    for now\"><figcaption style=\"text-align: center;\"><p><em>ETH/USD daily chart.
    Source: Cointelegraph/</em><a data-ct-non-breakable=\"null\" href=\"https://www.tradingview.com/x/bToI2EMy/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://www.tradingview.com/x/bToI2EMy/\"><em>TradingView</em></a></p></figcaption></figure><p>The
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/here-s-3-ways-the-relative-strength-index-rsi-can-be-used-as-a-sell-signal\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/here-s-3-ways-the-relative-strength-index-rsi-can-be-used-as-a-sell-signal\">relative
    strength index</a> is positioned in the negative region at 48, suggesting that
    the market conditions still favor the downside.</p><p>The bulls will attempt a
    daily candlestick close above the flag&rsquo;s middle boundary at $1,930 (embraced
    by the 50 SMA) to defend the support at $1,880. They must push the price above
    the flag&rsquo;s upper limit of $1,970 to invalidate the bear flag chart pattern.</p><p
    class=\"post-content__disclaimer\" type=\"\">This article does not contain investment
    advice or recommendations. Every investment and trading move involves risk, and
    readers should conduct their own research when making a decision.</p><template
    data-name=\"subscription_form\" data-type=\"markets_outlook\" label=\"Subscription
    Form: Markets Outlook\"></template><p><br></p></p>\n</p>\n            "

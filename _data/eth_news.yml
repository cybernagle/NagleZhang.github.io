- title: " Tokenized stocks could top $1T in market cap — Execs "
  url: https://cointelegraph.com/news/tokenized-stocks-top-1-trillion-market-cap-executives?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Tokenized stocks are on track to exceed $1 trillion in market capitalization
    in the coming years as adoption accelerates, two industry executives said at the
    TokenizeThis conference in New York. The total addressable market for tokenized
    stocks — a type of tokenized real-world asset (RWA) —  is difficult to project
    but is “definitely a bigger trillion-dollar market,” Arnab Naskar, STOKR’s CEO,
    said during an April 16 panel at the event.In 2025, demand for the instruments
    has “exploded” from institutions ranging from Web3 wallets to neobanks to traditional
    financial services firms, according to Anna Wroblewska, Dinari’s Chief Business
    Officer. “We've had an enormous influx of demand from a much broader scope of
    potential partners than you might even imagine [...] it's actually been really
    interesting,” Wroblewska said.Tokenized stocks are still a small portion of the
    total RWA market. Source: RWA.xyzRelated: Tokenization can transform US markets
    if Trump clears the waySmall but growing market shareAs of April 18, tokenized
    stocks comprise around $350 million in cumulative market capitalization, according
    to data from RWA.xyz. This represents only a sliver of the total RWA market, which
    is worth upward of $18 billion, the data shows. But this could change as tokenized
    stocks capture a growing share of the US equities market, Wroblewska said. The
    US stock market has an aggregate value of more than $50 trillion, according to
    Siblis Research. There is a “huge appetite for US public equities... even individual
    investors globally want exposure to US capital markets. Tokenization makes it
    fast and cheap,” Wroblewska said. She added that tokenized US Treasury Bills are
    already in high demand for similar reasons. They currently comprise nearly $6
    billion in total market cap, RWA.xyz data shows. Meanwhile, Coinbase is considering
    making tokenized shares of its stock available on Base, its Ethereum layer-2 network.Collectively,
    tokenized RWAs represent a $30 trillion market opportunity globally, Colin Butler,
    Movement Labs’ global head of institutional capital, told Cointelegraph in an
    August interview.“Tokenization will become a mirror of the market. If the user
    experience is better, faster, and cheaper, people will default to tokenized assets,”
    Wroblewska said.Magazine: SEC’s U-turn on crypto leaves key questions unanswered\n\n
    \           "

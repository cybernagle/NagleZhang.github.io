- title: " Here’s what happened in crypto today "
  url: https://cointelegraph.com/news/what-happened-in-crypto-today?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Today in crypto, stablecoin issuer Circle filed to go public in the US,
    Ethereum's revenue from blob storage sinks to its lowest level of 2025 and Binance
    halts select Tether (USDt) spot trading pairs in the European Economic Area.Circle
    files for Initial Public Offering planned for AprilUSDC (USDC) stablecoin issuer
    Circle Internet Group filed with the US Securities and Exchange Commission on
    April 1 to go public later this month on the New York Stock Exchange under the
    ticker “CRCL.”Its Form S-1 registration statement didn’t detail the number of
    shares it would offer or what its initial public offering target price would be,
    but it did shed some light on the firm’s financials.The filing shows Circle’s
    revenue last year was $1.67 billion in revenue for 2024, a 16% year-on-year bump,
    while its 2024 net income was $155.6 million — a 41.8% fall from 2023.Circle’s
    financials over the last three years ended Dec. 31. Source: SECOver 99% of Circle’s
    revenue in 2024 came from its stablecoin reserves. The company issues the second-largest
    stablecoin by market cap behind only Tether (USDT) and generates part of its income
    by holding yield-bearing Treasury bills.Circle attempted to go public via a Special
    Purpose Acquisition Company (SPAC) merger in 2021— which it abandoned in December
    2022 — and again in January 2024 via a confidential filing with the SEC.Ethereum's
    weekly blob fees hit 2025 lowsThe Ethereum network’s main source of income from
    layer-2 (L2) scaling chains — “blob fees” — has sunk to the lowest weekly levels
    so far this year, according to data from Etherscan. In the week ending March 30,
    Ethereum earned only 3.18 Ether (ETH) from blob fees, according to Etherscan,
    or approximately $6,000 US dollars as of April 1. This figure marks a 73% drop
    from the prior week and a more than 95% decline from the week ending March 16,
    when Ethereum’s income from blob fees exceeded 84 ETH, Etherscan said in an X
    post. Ethereum’s blob fee income has been uneven. Source: Dune AnalyticsIn March
    2024, Ethereum’s Dencun upgrade migrated L2 transaction data to temporary offchain
    stores called “blobs.” The upgrade cut costs for users but also reduced overall
    fee revenue for Ethereum — initially by as much as 95%, according to data from
    asset manager VanEck.Since then, growth in blob fees has been unsteady. Ethereum’s
    weekly blob fee income peaked at nearly $1 million in November before declining
    sharply in recent weeks, according to data from Dune Analytics. Binance ends Tether
    USDT trading in Europe to comply with MiCA rulesBinance has discontinued spot
    trading pairs with Tether’s USDt in the EEA to comply with MiCA.Cryptocurrency
    exchange Binance has delisted spot trading pairs with several non-MiCA-compliant
    tokens in the EEA in line with a plan disclosed in early March, Cointelegraph
    has learned.While spot trading pairs in tokens such as USDt (USDT) are now delisted
    on Binance, users in the EEA can still custody the affected tokens and trade them
    in perpetual contracts.USDT is available for perpetual trading on Binance. Source:
    BinanceAccording to a previous announcement by Binance, the spot trading pairs
    for non-MiCA-compliant tokens were to be delisted by March 31, which is in line
    with a local requirement to delist such tokens by the end of the first quarter
    of 2025.Binance is not the only crypto exchange delisting non-MiCA-compliant tokens
    for spot trading in the EEA.Other exchanges, such as Kraken, have delisted spot
    trading pairs in tokens such as USDT in the EEA after announcing plans in February.According
    to a notice on the Kraken website, the exchange restricted USDT for sell-only
    mode in the EEA on March 24. At the time of writing, the platform doesn’t allow
    its EEA users to buy the affected tokens.Kraken restricted USDT to sell-only mode
    in the EEA on March 24. Source: KrakenAmong other non-MiCA-compliant tokens, Binance
    has also delisted spot trading pairs for Dai (DAI), First Digital USD (FDUSD),
    TrueUSD (TUSD), Pax Dollar (USDP), Anchored Euro (AEUR), TerraUSD (UST), TerraClassicUSD
    (USTC) and PAX Gold (PAXG).\n\n            "

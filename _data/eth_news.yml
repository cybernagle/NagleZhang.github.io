- title: " US House kills IRS DeFi broker rule, Solana won’t cut 80% inflation rate:
    Finance Redefined "
  url: https://cointelegraph.com/news/us-house-kills-irs-de-fi-broker-rule-solana-won-t-cut-80-inflation-rate?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "In a significant regulatory development for the crypto industry, the United
    States House of Representatives voted to nullify a bill that threatened the privacy-preserving
    properties of decentralized finance (DeFi) protocols.In the wider crypto space,
    one of the Solana network’s most significant governance proposals was rejected;
    it sought to implement a mechanism to reduce Solana’s inflation rate by about
    80%.US House follows Senate in passing resolution to kill IRS DeFi broker ruleThe
    US House of Representatives voted to nullify a rule requiring decentralized finance
    (DeFi) protocols to report to the Internal Revenue Service.On March 11, the House
    of Representatives voted 292 for and 132 against a motion to repeal the so-called
    IRS DeFi broker rule that aimed to expand existing IRS reporting requirements
    to crypto.All 132 votes to keep the rule were Democrats. However, 76 Democrats
    joined with the Republicans to repeal it. This followed the Senate’s March 4 vote
    on the motion, which saw it pass 70 to 27.The rule would have forced DeFi platforms,
    such as decentralized exchanges, to disclose gross proceeds from crypto sales,
    including information regarding taxpayers involved in the transactions.After the
    vote, Republican Representative Mike Carey, who submitted the repeal motion, said,
    “The DeFi broker rule invades the privacy of tens of millions of Americans, hinders
    the development of an important new industry in the United States and would overwhelm
    the IRS.”Congressman Mike Carey speaking after the vote. Source: Mike CareyContinue
    readingSolana proposal to cut inflation rate by up to 80% failsA proposal to dramatically
    change Solana’s inflation system was rejected by stakeholders but is being hailed
    as a victory for the network’s governance process.“Even though our proposal was
    technically defeated by the vote, this was a major victory for the Solana ecosystem
    and its governance process,” commented Multicoin Capital co-founder Tushar Jain
    on March 14.Around 74% of the staked supply voted on proposal SIMD-228 across
    910 validators, but just 43.6% voted in favor of it, with 27.4% voting against
    it and 3.3% abstaining, according to Dune Analytics. It needed 66.67% approval
    from participating votes to pass and only received 61.4%.Jain added that this
    was the biggest crypto governance vote ever, by the number of participants and
    the participating market cap, of any ecosystem, chain or network.“This was a meaningful
    scaling stress test — a social, rather than technical, stress test — and the network
    passed despite a wide stratification of diverging opinions and interests.”Continue
    readingBitcoin $70,000 retracement part of “macro correction” in bull market —
    AnalystsBitcoin’s potential retracement to $70,000 may be an organic part of the
    current bull market, despite crypto investor fears of an early arrival of a bear
    market cycle.Bitcoin (BTC) fell more than 14% during the past week to close at
    around $80,708 after investors were disappointed with the lack of direct federal
    Bitcoin investments in President Donald Trump’s March 7 executive order. It outlined
    a plan to create a Bitcoin reserve using cryptocurrency forfeited in government
    criminal cases.Despite the drop in investor sentiment, cryptocurrencies and global
    markets remain in a “macro correction” as part of the bull market, according to
    Aurelie Barthere, principal research analyst at the Nansen crypto intelligence
    platform.BTC/USD, 1-month chart. Source: CointelegraphMost cryptocurrencies have
    broken key support levels, making it hard to estimate the next key price levels,
    the analyst told Cointelegraph, adding:“This is a macro correction (US tech will
    be down by 3% in the future, as discussed), so we have to monitor BTC. Next level
    will be $71,000 - $72,000, top of the pre-election trading range.”The analyst
    added: “We are still in a correction within a bull market: Stocks and crypto have
    realized and are pricing; a period of tariff uncertainty and fiscal cuts, no Fed
    put. Recession fears are popping up.”Continue readingCalls for stricter rules
    on political memecoins after $4 billion Libra collapseIndustry voices warned that
    politically endorsed cryptocurrencies must adopt stronger investor protections
    and liquidity safeguards to prevent another significant market collapse.Investor
    sentiment remains shaken after the Libra (LIBRA) token, which was endorsed by
    Argentine President Javier Milei, suffered a $4 billion market cap wipeout due
    to insider cash-outs.According to blockchain analytics firm DWF Labs, at least
    eight insider wallets withdrew $107 million in liquidity, triggering the massive
    collapse.Source: Kobeissi LetterTo avoid a similar meltdown, tokens with presidential
    endorsements will need more robust safety and economic mechanisms, such as liquidity
    locking or making the tokens in the liquidity pool non-sellable for a predetermined
    period, DWF Labs wrote in a report shared with Cointelegraph.The report stated
    that tokens from high-profile leaders also need launch restrictions to limit participation
    from crypto-sniping bots and large holders or whales.“Limiting bot and whale activity
    is essential in limiting the impact of individuals acting on insider information
    to corner a large percentage of the token supply,” according to Andrei Grachev,
    managing partner at DWF Labs.Continue readingHyperliquid ups margin requirements
    after $4 million liquidation lossHyperliquid, a blockchain network specializing
    in trading, increased margin requirements for traders after its liquidity pool
    lost millions of dollars during a massive Ether (ETH) liquidation, the network
    said.On March 12, a trader intentionally liquidated a roughly $200 million Ether
    long position, causing Hyperliquid’s liquidity pool, HLP, to lose $4 million,
    unwinding the trade.Starting March 15, Hyperliquid will require traders to maintain
    a collateral margin of at least 20% on certain open positions to “reduce the systemic
    impact of large positions with hypothetical market impact upon closing,” Hyperliquid
    said in a March 13 X post.The incident highlights the growing pains confronting
    Hyperliquid, which has emerged as Web3’s most popular platform for leveraged perpetual
    trading. Hyperliquid has adjusted margin requirements for traders. Source: HyperliquidHyperliquid
    said the $4 million loss was not from an exploit but rather a predictable consequence
    of the mechanics of its trading platform under extreme conditions. Continue readingDeFi
    market overviewAccording to data from Cointelegraph Markets Pro and TradingView,
    most of the 100 largest cryptocurrencies by market capitalization ended the week
    in the red.Of the top 100, the Hedera (HBAR) token fell over 24%, marking the
    biggest weekly decrease, followed by JasmyCoin (JASMY) down over 21% over the
    past week.Total value locked in DeFi. Source: DefiLlamaThanks for reading our
    summary of this week’s most impactful DeFi developments. Join us next Friday for
    more stories, insights and education regarding this dynamically advancing space.\n\n

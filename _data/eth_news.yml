- title: " Ethereum whale sells ETH after 900 days, missing $27M possible peak profit "
  url: https://cointelegraph.com/news/ethereum-whale-sells-eth-after-900-days-missing-27-m-peak-profit?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "An Ether whale who had held 10,000 Ether for the last 900 days has sold
    their entire stash and missed out on a peak profit of $27.6 million when the cryptocurrency
    was worth over $4,000. The whale initially bought a total of 10,000 Ether (ETH)
    across two transactions in October and November 2022 for $13 million at the time
    for an average price of $1,295 per token, blockchain analytics service Lookonchain
    said in an April 8 X post.“He didn’t sell when Ether broke through $4,000. But
    today, he exited with a $2.75 million profit. The profit at the peak was $27.6
    million,” Lookonchain said.Source: Lookonchain The whale sold when Ether was around
    $1,578, according to Lookonchain. Within the period that the whale wallet was
    holding its stack, Ether hit a high of $4,015 on Dec. 9, CoinGecko data shows. Ether
    is sitting at around $1,426, down 24% over the last seven days amid a broader
    market sell-off sparked by the Trump administration’s sweeping global tariffs.ETH
    hit its all-time high of $4,878 on Nov. 10, 2021, about a year before the whale’s
    first purchase.Trump’s World Liberty Financial sells part of ETH stash In a separate
    April 9 post to X, Lookonchain said the Donald Trump-backed crypto project, World
    Liberty Financial (WLF), might have also sold some of its Ether stash at a loss. “A
    wallet possibly linked to World Liberty sold 5,471 ETH ($8.01M) at $1,465,” Lookonchain
    wrote.Source: LookonchainBefore the supposed sale, Lookonchain said World Liberty
    Financial had a stash of 67,498 Ether, which it bought at an average price of
    $3,259.Related: Trump tariffs could lower Bitcoin miner prices outside US, says
    mining execTwo other whales have also made big moves amid a market bloodbath that
    has seen some traders buying the dip. On April 7, an unidentified crypto whale
    had to inject 10,000 Ether— worth more than $14.5 million, to save their position
    of 220,000 Ether worth more than $300 million from liquidation amid the market
    slump. Another whale wasn’t as lucky, losing 67,570 Ether on April 6, worth around
    $106 million, when their significant position on decentralized finance lending
    platform Sky was liquidated. Magazine: Bitcoin heading to $70K soon? Crypto baller
    funds SpaceX flight: Hodler’s Digest\n\n            "

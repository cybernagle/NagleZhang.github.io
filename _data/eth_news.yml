    (BNB) bounced off the 20-day EMA ($635) on May 18, but the higher levels attracted
    selling by the bears.BNB/USDT daily chart. Source: Cointelegraph/TradingViewThe
    gradually upsloping 20-day EMA and the RSI in the positive territory indicate
    a slight edge to the bulls. If the price rises and maintains above $644, the bulls
    will again try to drive the BNB/USDT pair above $680. If they succeed, the pair

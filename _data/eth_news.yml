- title: " Ethereum price falls to 2-year low, but pro traders still have hope "
  url: https://cointelegraph.com/news/ethereum-price-falls-to-2-year-low-but-pro-traders-still-have-hope?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Ether (ETH) price dropped to $1,410 on April 7, marking its lowest level
    since March 2023. This sharp decline triggered liquidations of leveraged ETH futures
    worth over $370 million in 2 days, according to CoinGlass data. However, the altcoin
    managed to recover above the $1,500 mark as the S&P 500 index reclaimed its psychological
    5,000 support level.Ether/USD (blue) vs. total crypto market capitalization (magenta).
    Source: TradingView / CointelegraphOver the past 30 days, Ether has underperformed
    the broader cryptocurrency market by 14%. Despite this, professional traders are
    not yet ready to turn bearish, as suggested by Ethereum’s derivatives data and
    onchain metrics. While this data does not guarantee that Ether’s price has reached
    its bottom, the reduced demand for bearish positions below $1,600 offers some
    reassurance for bullish investors.Ether 2-month futures annualized premium. Source:
    laevitas.chOn April 7, the Ether monthly futures premium rose to 4% after dipping
    to 3% earlier in the day. Although still below the neutral threshold of 5%, this
    marks an improvement from March 31, when the indicator hit a low of 2%. Currently,
    there is a noticeable lack of demand from long positions (buyers), but this is
    not unusual following a steep 30% drop in ETH’s price over the past month.Ether
    is a victim of worsening macroeconomic conditionsInvestors remain concerned that
    escalating global trade tensions could lead to an economic recession and reduce
    interest in risk-on assets. This scenario also weakens the potential positive
    impact of a possible interest rate cut during the US Federal Reserve’s (Fed) next
    meeting on May 6-7. Typically, such a move would benefit the cryptocurrency market
    by lowering returns on fixed-income investments.Despite US President Donald Trump’s
    strong push for interest rate cuts, as expressed in his Truth Social post on April
    7, Fed Chair Jerome Powell remains cautious about inflation trends. Powell reportedly
    stated on April 4: \"It is too soon to say what will be the appropriate path for
    monetary policy,\" according to Yahoo Finance.Adding further pressure to Ether’s
    price was Ethereum developers’ decision to delay the Pectra upgrade, originally
    scheduled for April. Developers have now set May 7 as the target date for its
    mainnet launch but provided no specific reason for the delay. This comes even
    though the Hoodi testnet upgrade was successfully implemented on March 26.Ether
    derivatives display moderate resilience while Ethereum TVL jumps to an all-time
    highGiven the negative news flow, one might have expected Ether bears to dominate
    the market entirely. However, derivatives data suggests that bears are not as
    confident as anticipated. When traders foresee a correction, put (sell) options
    tend to trade at a premium, pushing the 25% delta skew metric above 6%. Conversely,
    during bullish periods, this indicator typically falls below -6%.Ether 30-day
    options skew (put-call) at Deribit. Source: Laevitas.chCurrently, the ETH options
    skew stands at 10%, the same level as March 31, which remains within bearish territory.
    However, this reading is significantly less extreme compared to May 2024, when
    it peaked at 20% amid a sharp ETH price drop from $3,700 to $2,860 within five
    weeks. In essence, while Ether derivatives markets signal bearish sentiment, they
    do not reflect panic levels.Onchain data for Ethereum shows resilience despite
    broader market challenges. The total value locked (TVL) on the Ethereum network
    reached an all-time high of 30.2 million ETH on April 6—a 22% increase compared
    to the previous month. This growth outpaced Solana’s 12% increase in SOL (SOL)
    terms and BNB Chain’s 16% TVL rise during the same period. Ultimately, macroeconomic
    conditions remain the primary driver of cryptocurrency demand. However, when analyzing
    Ether derivatives data and Ethereum’s TVL performance, it appears that ETH’s price
    downside may be limited.This article is for general information purposes and is
    not intended to be and should not be taken as legal or investment advice. The
    views, thoughts, and opinions expressed here are the author’s alone and do not
    necessarily reflect or represent the views and opinions of Cointelegraph.\n\n
    \           "

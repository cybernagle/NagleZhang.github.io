- title: " Kalshi accepts Bitcoin deposits in bid to woo crypto-native users "
  url: https://cointelegraph.com/news/kalshi-starts-taking-bitcoin-deposits-bid-crypto-natives?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Prediction marketplace Kalshi has started taking Bitcoin (BTC) deposits
    in a bid to onboard more crypto-native users.The company that lets users bet on
    events ranging from election outcomes to Rotten Tomatoes film ratings has seen
    a strong uptake among crypto traders, Kalshi told Cointelegraph on April 9. For
    instance, event contracts for betting on Bitcoin’s hour-by-hour price changes
    have seen $143 million in trading volume to date, a spokesperson said.Kalshi is
    a derivatives exchange regulated by the US Commodity Futures Trading Commission
    (CFTC). As of April 9, it listed some 50 crypto-related event contracts, including
    markets for betting on coins’ 2025 highs and lows, as well as on headlines such
    as US President Donald Trump’s proposed National Bitcoin Reserve. Kalshi has doubled
    down on crypto event contract markets. Source: KalshiThe platform started accepting
    crypto payments in October when it enabled stablecoin USD Coin (USDC) deposits. Kalshi
    relies on ZeroHash — a crypto payments infrastructure provider — for off-ramping
    BTC and USDC and converting the deposits to US dollars. The exchange accepts BTC
    deposits only from the Bitcoin network. Most Kalshi traders no longer expect core
    tokens to earn positive returns this year. Source: KalshiRelated: Kalshi traders
    place the odds of US recession in 2025 at over 61%More accurate than pollsLaunched
    in 2021, Kalshi rose to prominence ahead of the US’s November elections. It became
    a top venue for trading on 2024 political events after winning a lawsuit against
    the CFTC, which tried to block Kalshi from listing contracts tied to elections. The
    regulator argued that political prediction markets threaten the integrity of elections,
    but industry analysts say they often capture public sentiment more accurately
    than polls. For instance, prediction markets, including Kalshi, accurately predicted
    Trump’s presidential election win even as polls indicated a tossup.“Event contract
    markets are a valuable public good for which there is no evidence of significant
    manipulation or widespread use for any nefarious purposes that the Commission
    alleges,” Harry Crane, a statistics professor at Rutgers University, said in an
    August comment letter filed with the CFTC.As of April 9, Kalshi traders peg the
    odds of the US entering a recession at 68%, according to its website. In March,
    Kalshi partnered with Robinhood to bring prediction markets to the popular online
    brokerage platform. Robinhood’s stock rose some 8% on the news. Kalshi competes
    with Polymarket, a Web3-based prediction platform. Polymarket processed more than
    $3 billion in trading volumes tied to the US presidential election despite being
    off-limits for US traders.Magazine: Bitcoin heading to $70K soon? Crypto baller
    funds SpaceX flight: Hodler’s Digest, March 30 – April 5\n\n            "
  published: 2025-04-09 18:30:00.000000000 +01:00
- title: " Price analysis 4/9: BTC, ETH, XRP, BNB, SOL, DOGE, ADA, LEO, LINK, TON "
  url: https://cointelegraph.com/news/price-analysis-4-9-btc-eth-xrp-bnb-sol-doge-ada-leo-link-ton?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Risky assets remain volatile as trade war tension between the United States
    and China keeps investors on the edge. A minor positive is that Bitcoin (BTC)
    has avoided a sharp fall and is trading well above the crucial near-term support
    at $73,777. BitMEX co-founder Arthur Hayes said in a post on X that the PBOC (People’s
    Bank of China) could give the catalyst needed for the next leg of the crypto bull
    run by weakening the yuan. Such a move led to Chinese capital flight into Bitcoin
    in 2013 and 2015, and it could work again in 2025.Crypto market data daily view.
    Source: Coin360The situation remains fluid and difficult to predict. Therefore,
    investors seem to be curtailing risk, as seen from the $595.9 million in outflows
    from the US-listed spot Bitcoin exchange-traded funds in the past four trading
    days, per Farside Investors data.Could Bitcoin hold above the $73,777 support,
    or will the bears pull the price below it? How are the altcoins positioned? Let’s
    analyze the charts of the top 10 cryptocurrencies to find out.Bitcoin price analysisBitcoin
    tried to start a recovery on April 8 but met with strong selling near the 20-day
    exponential moving average ($82,218). That suggests the sentiment remains negative,
    and traders are selling on rallies.BTC/USDT daily chart. Source: Cointelegraph/TradingViewThe
    downsloping moving averages indicate an advantage to bears, but the positive divergence
    on the relative strength index (RSI) suggests the bearish momentum could be slowing
    down. However, if the $73,777 level cracks, the BTC/USDT pair could swiftly nosedive
    to the next support at $67,000. Solid buying is likely to emerge in the $67,000
    to $65,000 support zone.The 50-day simple moving average ($85,703) remains the
    key overhead resistance to watch out for. Buyers will have to drive the price
    above the 50-day SMA to suggest that the corrective phase may have ended. Until
    then, rallies are likely to be sold into.Ether price analysisEther (ETH) has been
    in a strong downtrend, but the price has reached the $1,368 support, which could
    start a relief rally.ETH/USDT daily chart. Source: Cointelegraph/TradingViewThe
    ETH/USDT pair could rise to the 20-day EMA ($1,786), which is likely to act as
    a stiff hurdle. If the price turns down from the 20-day EMA, the bears will try
    to sink the pair below $1,368. If they can pull it off, the pair may collapse
    to $1,150.Instead, if the price turns down from the 20-day EMA but rebounds off
    $1,368, it will signal a range formation in the near term. A break and close above
    the 20-day EMA suggests the bears are losing their grip. The pair may then ascend
    to the breakdown level of $2,111.XRP price analysisXRP (XRP) tried to rise above
    the breakdown level of $2 on April 8, but the bears held their ground. That suggests
    the bears are trying to flip the level into resistance.XRP/USDT daily chart. Source:
    Cointelegraph/TradingViewIf the price turns down and breaks below $1.61, the XRP/USDT
    pair could resume the downtrend. The next support on the downside is at $1.27.Conversely,

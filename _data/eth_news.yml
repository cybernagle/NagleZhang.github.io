    which recorded $537.5 million. Fidelity’s Wise Origin Bitcoin Fund (FBTC) followed
    with $136.5 million.The renewed inflows come after a bearish period for both the
    crypto market and the broader global economy, marked by growing concerns over
    escalating trade tensions and rising recession concerns.Related: US recession
    would be a big catalyst for Bitcoin: BlackRockEarlier this year, Bitcoin ETFs
    recorded their largest net inflows of 2025: $1.96 billion in the week ending Jan.
    17 and $1.76 billion the following week. Bitcoin (BTC) surged to an all-time high
    of $109,000 on Jan. 20, the inauguration day of US President Donald Trump.Bitcoin
    later dropped into the $78,000 range amid the broader market correction. With
    the latest inflows — the strongest since January — the price rebounded to $87,343
    at the time of writing, according to CoinGecko.Bitcoin leaves Ethereum in the
    red zoneThe same can’t be said for Ether (ETH) ETFs, which extended their weekly
    net outflow streak to four weeks.Ethereum ETF net inflows continue slumping. Source:
    SoSoValueDuring the week ending March 21, Ethereum funds saw a net outflow of
    $102.9 million, with BlackRock’s iShares Ethereum Trust ETF (ETHA) accounting

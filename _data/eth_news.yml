- title: " Whale makes $14M Ether emergency deposit to avoid $340M liquidation "
  url: https://cointelegraph.com/news/whale-14-m-emergency-deposit-avoid-340-m-eth-liquidation?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "An unidentified cryptocurrency whale injected millions of dollars in emergency
    capital to avoid a potential liquidation of more than $300 million in Ether as
    markets slumped amid renewed macroeconomic pressure.The whale is reportedly close
    to liquidation on a 220,000 Ether (ETH) position on MakerDAO, a decentralized
    finance (DeFi) lending platform. To stave off liquidation, the investor deposited
    10,000 ETH — worth more than $14.5 million — and 3.54 million Dai (DAI) to raise
    the position’s liquidation price, blockchain analytics firm Lookonchain said in
    an April 7 post on X.“If $ETH drops to $1,119.3, the 220,000 $ETH($340M) will
    be liquidated.”Source: LookonchainThe development came hours after another Ether
    investor was liquidated for over $106 million on the decentralized finance (DeFi)
    lending platform Sky.The whale lost more than 67,000 ETH when the asset crashed
    by around 14% on April 6. Sky’s system employs an overcollateralization ratio,
    typically 150% or higher, meaning that users need to deposit at least $150 worth
    of ETH to borrow 100 DAI.Related: Decentralized exchanges gain ground despite
    $6M Hyperliquid exploitAccording to data from CoinGlass, more than 446,000 positions
    have been liquidated in the past 24 hours, with total losses surpassing $1.36
    billion. That includes $1.21 billion in long positions and $152 million in shorts.Crypto
    market liquidations, 24-hours. Source: CoinGlassThe largest single liquidation
    was a $7 million Bitcoin (BTC) position on crypto exchange OKX.Related: Smart
    money still hunting for memecoins despite end of ‘supercycle’Crypto markets crash
    after Trump’s tariff announcement, but 70% recovery chance by JuneUS President
    Donald Trump announced his reciprocal import tariffs on April 2, which sent tremors
    across global markets, leading to a $5 trillion loss by the S&P 500, its largest
    two-day drop on record.Still, the tariff announcement may finally end the global
    uncertainty plaguing traditional and digital markets for the past two months.“In
    my opinion, the tariffs are the representation of the uncertainty in the markets,”
    Michaël van de Poppe, founder of MN Consultancy, told Cointelegraph. “Liberation
    Day is basically the peak of that period, the climax of uncertainty. Now it’s
    out in the open. Everybody knows the new playing field.”The end of tariff-related
    uncertainty may bring the start of a “rotation toward the crypto markets,” as
    investors will start buying the dip as digital assets become “undervalued,” said
    van de Poppe.Crypto intelligence firm Nansen also estimated a 70% probability
    that the market may bottom by June, depending on how the tariff negotiations evolve.Magazine:
    BTC’s ‘reasonable’ $180K target, NFTs plunge in 2024, and more: Hodler’s Digest
    Jan 12–18\n\n            "
  published: 2025-04-07 10:42:09.000000000 +01:00
- title: " Ethereum whale liquidated for $106M on Sky amid crypto bloodbath "
  url: https://cointelegraph.com/news/ethereum-whale-loses-106-million-maker-amid-crypto-bloodbath?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "An Ether investor who had a large position on decentralized finance (DeFi)
    lending platform Sky has been liquidated to the tune of more than $100 million
    as the price of Ether crashed. The Ether (ETH) whale lost 67,570 ETH worth around
    $106 million when the asset crashed by around 14% on April 6, liquidating his
    collateralized debt position on Sky, according to Maker Vaults explorer DeFi Explore,
    and as observed by Lookonchain.The Sky lending protocol, which rebranded from
    Maker in August, is used by DeFi participants to create collateralized debt positions
    by providing crypto, ETH in this case, to borrow the platform’s stablecoin, DAI
    (DAI).The system uses an overcollateralization ratio, typically 150% or higher,
    meaning that users need to deposit at least $150 worth of ETH to borrow 100 DAI. The
    protocol autonomously monitors the value of ETH collateral relative to the borrowed
    DAI, and if the ETH value falls and the collateral ratio drops below the minimum
    requirement, the position becomes eligible for liquidation.This whale’s liquidation
    occurred when the ratio fell to 144% as the price of ETH plummeted. ETH whale
    liquidations. Source: DeFi ExploreMeanwhile, Spot On Chain reported that another
    whale that supplied 56,995 wrapped ETH, worth around $91 million, to borrow DAI
    was on the verge of liquidation. In a liquidation event, Sky seizes the ETH collateral,
    which is auctioned off to pay back the borrowed DAI plus fees. Any remaining collateral
    after the debt is paid is returned to the user. Ethereum price at bear market
    lowsETH prices have crashed a whopping 14.5% over the past 24 hours, falling to
    $1,547 at the time of writing as the wider crypto market melts down in reaction
    to US President Donald Trump’s tariff-induced market sell-off. The last time ETH
    traded this low was in October 2023, when crypto was still deep in bear market
    territory, almost a year after the collapse of the FTX exchange. ETH remains down
    68% from its all-time high in 2021, and further losses are likely to see more
    DeFi users liquidated unless they can provide more collateral. Related: Bitcoin
    price drops below $80K as stocks face 1987 Black Monday rerunAccording to CoinGlass,
    320,000 traders have been liquidated over the past 24 hours to the tune of almost
    $1 billion dollars. The majority of liquidations over the past four hours have
    been ETH positions, it revealed.Magazine: Bitcoin heading to $70K soon? Crypto
    baller funds SpaceX flight: Hodler’s Digest\n\n            "
  published: 2025-04-07 06:42:13.000000000 +01:00
- title: " Crypto plunges as Trump tariff ‘medicine’ brutalizes global stock markets "
  url: https://cointelegraph.com/news/crypto-plunges-nasdaq-dow-stock-futures-fall-on-open?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Cryptocurrency prices tumbled as the US stock futures market opened sharply
    lower on April 6 as the Trump administration doubled down on its global tariff
    strategy.The Trump administration hit all countries with a 10% tariff starting
    April 5, with some slapped at higher rates, including China at 34%, the European
    Union at 20%, and Japan at 24%.Bitcoin (BTC) dropped over 6% in the last 24 hours
    and was trading around $77,883. Meanwhile, Ether (ETH) shed over 12% in the same
    time frame and was trading at $1,575, according to CoinGecko. The total crypto
    market cap dropped over 8% to $2.5 trillion. Prices have clawed back some losses
    since. Bitcoin has recovered 1.4% to $78,500. Meanwhile, Ether regained $1,594.Source:
    Autism CapitalAt the same time, the Crypto Fear & Greed Index, which measures
    market sentiment for Bitcoin and other cryptocurrencies, returned a score of 23
    in its latest April 7 update, which is considered extreme fear.In a statement,
    Charlie Sherry, head of finance at Australian crypto exchange BTC Markets, said
    the drop is unsurprising because global markets are generally more illiquid on
    Sundays. “As a result, a few large sell-offs can have a disproportionate impact,
    pushing prices down quickly,” he said. “There’s no mystery behind the trigger:
    President Trump’s recent tariff talk has rattled macro markets, with global trade
    relations suddenly looking uncertain.” Some traders, however, predict a Bitcoin
    breakout could be around the corner. BitMEX co-founder Arthur Hayes has also speculated
    that while the tariffs are rattling markets, they could result in a Bitcoin rally. The
    US Stock Futures market has also opened down. Futures tied to the S&P 500 dropped
    nearly 4%, according to Google Finance. Meanwhile, the tech-heavy Nasdaq lost,
    and the Dow Jones Industrial Average futures sank by over 8%. Trading resource
    the Kobeissi Letter said in an April 6 post to X that the drop in US stock market
    futures puts S&P 500 futures in ”bear market territory,” adding that the US stock
    market has now erased an average of $400 billion per trading day for the last
    32 days. Source: Kobeissi LetterTom Dunleavy, a managing partner at venture capital
    firm MV Global, said it could be the “worst three-day move for US stocks of all
    time” if “tonight’s futures hold.” Trump administration doubles down on tariffsCrypto-friendly
    billionaire investor Bill Ackman speculates that US President Donald Trump could
    postpone the tariffs to allow countries to make counteroffers or deals.In an April
    6 statement on his social media platform, Truth Social, Trump doubled down on
    the tariffs, saying the US has massive financial deficits with China, the European
    Union and many others, which the levies will solve.Related: ‘National emergency’
    as Trump’s tariffs dent crypto prices“The only way this problem can be cured is
    with TARIFFS, which are now bringing tens of billions of dollars into the USA.
    They are already in effect, and a beautiful thing to behold,” he said.He also
    told reporters aboard Air Force One that he wasn't intentionally trying to cause
    a market sell-off but added that “sometimes you have to take medicine to fix something.” At
    the same time, US National Economic Council Director Kevin Hassett said in an
    April 6 interview with ABC's This Week program that more than 50 countries have
    reached out to the president to negotiate fresh trade deals.“They’re doing that
    because they understand that they bear a lot of the tariff,” he said. US Treasury
    Secretary Scott Bessent urged US trading partners in an April 2 interview with
    Bloomberg against taking retaliatory steps, arguing “this is the high end of the

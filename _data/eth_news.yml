- title: " Blockchain needs regulation, scalability to close AI hiring gap "
  url: https://cointelegraph.com/news/blockchain-regulation-scalability-crypto-ai-hiring-gap?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "The emerging blockchain industry lags behind the artificial intelligence
    sector in terms of job creation, but this hiring gap may narrow by 2030.Blockchain
    remains one of the smallest sectors in the tech industry, with about 300,000 global
    jobs, compared to 1.5 million in AI and machine learning and 25 million in software
    development, according to a new Bitget Research report shared with Cointelegraph.The
    blockchain sector added around 20,000 new jobs in 2024, according to job listings
    aggregated from platforms like LinkedIn, Web3 Jobs and Crypto Job List.Total workforce
    in tech industry. Source: Bitget ResearchWhile blockchain-based jobs had an average
    compound annual growth rate (CAGR) of 45%, outpacing most traditional tech sectors,
    it trails the AI industry’s 57% CAGR, according to the report.The AI industry’s
    maturity and larger share of venture capital investment are the main reasons behind
    the hiring discrepancy, Vugar Usi Zade, chief operating officer of Bitget exchange,
    told Cointelegraph:“Venture investors put more than $100 billion into AI startups
    in 2024, with AI-centric titles topping a million vacancies worldwide,” Usi Zade
    said. “Blockchain companies, meanwhile, advertise barely 20,000 openings and drew
    only about $5.4 billion in new funding during the same period.”Regional blockchain
    market distribution. Source: Bitget ResearchRelated: Crypto firms moving into
    Wall Street territory amid ‘growing synergy’Blockchain may generate over 1 million
    jobs by 2030AI-related job listings have risen between 75% and 100% year-over-year,
    while blockchain job growth remains around the 45% to 60% growth range.Blockchain
    vs AI job listings growth. Source: Bitget ResearchBlockchain could exceed 1 million
    jobs by 2030 if it manages to scale at the same rate as AI-based roles, the report
    said.More regulatory clarity from laws such as Europe’s Markets in Crypto-Assets
    Regulation (MiCA) may encourage blockchain firms to increase their hiring efforts,
    Zade said:“Europe’s MiCA rule-book, live since December 2024, is already thawing
    hiring freezes; similar clarity in the United States and Asia would unlock global
    head-count plans.”“Second comes enterprise-grade performance: Ethereum’s Dencun
    upgrade cut typical layer-2 fees by more than 95%, signaling that blockchains
    can now handle corporate traffic at an acceptable cost,” he added.Related: Trump
    fought the bond market, the bond market won: Saifedean AmmousWhile blockchain-based
    jobs are poised for growth, “AI will naturally garner more talent in the next
    decade,” Jawad Ashraf, CEO of Vanar Chain, told Cointelegraph.“This is because
    AI’s market integration has been faster than any other modern technology we can
    remember,” he said. “If you look at blockchain, we’re still very much focused
    on integrating with TradFi and broader Web3 markets like gaming, real-world tokenization,
    etc.”He added: “Blockchain still hasn’t penetrated the more conventional consumer-oriented
    markets. It will, in the near future, but we are not there yet.”Blockchain and
    AI are not competing for talent“AI and blockchain aren’t competing for talent;
    they’re working together to create new opportunities,” Yakov Lebedev, chief business
    development officer at 3Commas, a trading automation solution, told Cointelegraph.Combining
    the two technologies enables “sophisticated financial tools accessible for everyone,
    not just big institutions, he said, adding:“Companies are paying top dollar for
    professionals who understand both AI and blockchain, recognizing the value of
    this cross-domain expertise.” Lebedev added that the integration of blockchain
    with AI is driving steady job growth in both fields, as financial and tech firms
    move integrated solutions from pilot programs into core operations.Thanks to the
    synergistic benefits of the two technologies, blockchain job growth may start
    mirroring the AI industry, according to Adi Ben-Ari, founder and CEO at Applied
    Blockchain, an AI-powered blockchain development firm.AI technology is “probabilistic
    and introduces uncertainty,” which creates more demand for blockchain and cryptographic
    technologies, he told Cointelegraph.“AI produces outcomes that are not always
    accurate, can be fake, and can sometimes be incorrect,” he said. “This new uncertainty
    needs to be countered by a technology that brings absolute certainty, and this
    is where blockchain and cryptography come in.”Ben-Ari added that blockchain’s
    ability to secure sensitive information through cryptography would become increasingly
    important as AI consumes larger amounts of personal data.  LUNA payments to STIX
    protocol. Source: BasescanAI agents are already using cryptocurrency for autonomous
    transactions. On Dec. 16, 2024, Luna, an AI agent on Virtuals Protocol, paid another
    AI agent from STIX Protocol, in exchange for its image generation services — sending
    $1.77 worth of Virtual (VIRTUAL) tokens, onchain data shows.Magazine: Altcoin
    season to hit in Q2? Mantra’s plan to win trust: Hodler’s Digest, April 13 – 19\n\n
    \           "

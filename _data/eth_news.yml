- title: " Crypto firms moving into Wall Street territory amid ‘growing synergy’ "
  url: https://cointelegraph.com/news/crypto-firms-moving-into-wall-street-growing-synergy?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Cryptocurrency firms and exchanges are increasingly moving into Wall Street
    territory, launching more traditional investment offerings and showcasing the
    increasing connection between crypto and traditional finance (TradFi).“There’s
    a growing synergy between traditional financial investments and the emerging crypto
    space,” according to Gracy Chen, the CEO of Bitget, the world’s sixth-largest
    crypto exchange.“Crypto players are now checking out traditional finance as they
    see the opportunity to bridge it,” Chen told Cointelegraph.“The lines are blurring
    — investors want flexibility, and products that can straddle both worlds are naturally
    attractive,” Chen said. “Some players see TradFi as a safety net; others, like
    Bitget, see it as a launchpad for broader adoption.” She added:“In a volatile
    market, integration is smarter than isolation.”Related: Trump’s tariff escalation
    exposes ‘deeper fractures’ in global financial systemChen’s comments come a week
    after crypto exchange Kraken launched access to 11,000 US-listed stocks and exchange-traded
    funds (ETFs) as the first part of a global expansion into TradFi offerings, Cointelegraph
    reported on April 14.Kraken’s expansion into traditional stock offerings was announced
    a week after the S&P 500’s record-breaking two-day loss of over $5 trillion, triggered
    by US President Donald Trump’s reciprocal import tariffs announcement on April
    2.Coinbase CEO Brian Armstrong echoed a similar vision. During the company’s latest
    earnings call, Armstrong said Coinbase aims to help modernize the global financial
    system and bring more of the world’s GDP onto crypto rails.“We think that’s a
    more efficient, fair, free world that will accelerate progress, and it creates
    economic freedom,” he said during Coinbase’s latest earnings call.Related: 70%
    chance of crypto bottoming before June amid trade fears: NansenCrypto and TradFi
    relationship is “inherently symbiotic” The relationship between “digital assets
    and more traditional assets is inherently symbiotic,” a spokesperson for Coinbase,
    the world’s third-largest crypto exchange, told Cointelegraph, adding:“Core to
    our mission to enable economic freedom by onboarding one billion users to crypto,
    is supporting more of ‘traditional finance’ to be integrated with crypto.”“As
    regulatory clarity and institutional adoption increase globally, we expect more
    of the global GDP to be running on crypto rails,” the spokesperson added.Related:
    Bitcoin rally above $100K may follow US Treasury buybacks — Arthur HayesBlockchain
    technology brings “speed and transparency” while TradFi introduces “trust, scale
    and compliance,” in an “inevitable convergence,” Omri Hanover, general manager
    at Gems Trade cryptocurrency platform, told Cointelegraph.“Together, TradFi and
    crypto unlock new pathways for both retail and institutional investors, especially
    those seeking exposure to digital assets without navigating the full complexity
    of native crypto products,” he explained.Traditional investment platforms such
    as eToro and Robinhood have also launched cryptocurrency offerings.Magazine: Altcoin
    season to hit in Q2? Mantra’s plan to win trust: Hodler’s Digest, April 13 – 19\n\n
    \           "

- title: " Bybit CEO on ‘brutal’ $4M Hyperliquid loss: Lower leverage as positions
    grow "
  url: https://cointelegraph.com/news/hyperliquid-4-million-loss-leverage-eth-trader?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDIvMDE5NTJlMTMtNDUzYS03OWQ5LTgyOTUtNzI1NjcxY2MwODg5.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDIvMDE5NTJlMTMtNDUzYS03OWQ5LTgyOTUtNzI1NjcxY2MwODg5.jpg\"
    alt=\"Bybit CEO on ‘brutal’ $4M Hyperliquid loss: Lower leverage as positions
    grow\"></p><p>Bybit CEO Ben Zhou commented on a recent $4 million loss suffered
    by decentralized exchange (DEX) Hyperliquid due to an Ether whale&rsquo;s high-leverage
    trade, noting that centralized exchanges (CEXs) face similar challenges.<p>On
    March 12, a crypto investor walked away with $1.8 million and forced the Hyperliquidity
    Pool (HLP) to bear a $4 million loss after a trade that used leverage on the Hyperliquid
    decentralized exchange (DEX).&nbsp;</p><p>The trader <a data-ct-non-breakable=\"null\"
    href=\"https://hyperdash.info/trader/0xf3f496c9486be5924a93d67e98298733bb47057c\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">used</a> about 50x leverage
    to turn $10 million into a $270 million Ether (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/ethereum-price\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">ETH</a>) long position. However, the trader couldn&rsquo;t
    exit without tanking their own position. Instead, they withdrew collateral, offloading
    assets without triggering a self-inflicted price drop, leaving Hyperliquid to
    cover the losses.</p><p>Smart contract auditor Three Sigma <a data-ct-non-breakable=\"null\"
    href=\"https://x.com/threesigmaxyz/status/1899798137000145067\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">said</a> the trade was a &ldquo;brutal game of liquidity
    mechanics,&rdquo; not a bug or an exploit. Hyperliquid also clarified that this
    was not a protocol exploit or a hack.&nbsp;</p><figure><img alt=\"Bybit CEO on
    &lsquo;brutal&rsquo; $4M Hyperliquid loss: Lower leverage as positions grow\"
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958eab-acea-7e3c-bc07-eee9f465afed\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/HyperliquidX/status/1899768864705237211\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"https://x.com/HyperliquidX/status/1899768864705237211\"><em>Hyperliquid</em></a></p></figcaption></figure><h2>Hyperliquid
    lowers leverage trading for BTC and ETH</h2><p>In response to the trade, Hyperliquid
    lowered its Bitcoin (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>) leverage to
    40x and its ETH leverage allowance to 25x. This increases the maintenance margin
    requirements for larger positions on the DEX. &ldquo;This will provide a better
    buffer for backstop liquidations of larger positions,&rdquo; Hyperliquid stated.&nbsp;</p><p>In
    an X post, the Bybit CEO <a data-ct-non-breakable=\"null\" href=\"https://x.com/benbybit/status/1900060802490433801?s=19\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">commented</a> on the
    trade, saying that CEXs are also subjected to the same situation. Zhou said their
    liquidation engine takes over whale positions when they get liquidated. While
    lowering the leverage may be an effective solution, Zhou said this could be bad
    for business:&nbsp;</p><blockquote>&ldquo;I see that HP has already lowered their
    overall leverage; that&rsquo;s one way to do it and probably the most effective
    one, however, this will hurt business as users would want higher leverage.&rdquo;</blockquote><p>Zhou
    suggested a more dynamic risk limit mechanism that reduces the overall leverage
    as the position grows. The executive said that in a centralized platform, the
    whale would go down to a leverage of 1.5x with the huge amount of open positions.
    Despite this, the executive recognized that users could still use multiple accounts
    to achieve the same results.</p><p>The Bybit CEO added that even the lowered leverage
    capabilities could still be &ldquo;abused&rdquo; unless the DEX implements risk
    management measures such as surveillance and monitoring to spot &ldquo;market
    manipulators&rdquo; on the same level as a CEX.&nbsp;</p><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/crypto-trader-loses-least-215000-stablecoins-from-sandwich-attack\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Crypto trader
    gets sandwich attacked in stablecoin swap, loses $215K</strong></em></a></p><h2>Hyperliquid
    sees $166 million net outflow</h2><p>Following the liquidation event of the ETH
    whale and the losses the HLP Vault suffered, the protocol experienced a massive
    outflow of its assets under management. Dune Analytics data <a data-ct-non-breakable=\"null\"
    href=\"https://dune.com/queries/4845239/8026924\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">shows</a> that Hyperliquid had a net outflow of $166
    million on March 12, the same day as the trade.&nbsp;</p><template data-ct-widget=\"buzzsprout\"
    data-buzzsprout-podcast-id=\"2096415\" data-buzzsprout-episode-id=\"16616214\"></template><p><em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/crypto-fans-obsessed-longevity-biohacking-why/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Crypto fans
    are obsessed with longevity and biohacking: Here&rsquo;s why</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"defi_newsletter\" label=\"Subscription
    Form: DeFi Newsletter\"></template></p>\n</p>\n            "

- title: " Price predictions 4/30: BTC, ETH, XRP, BNB, SOL, DOGE, ADA, SUI, LINK,
    AVAX "
  url: https://cointelegraph.com/news/price-predictions-4-30-btc-eth-xrp-bnb-sol-doge-ada-sui-link-avax?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Key points:Bitcoin’s 7-day volatility is the lowest in 563 days, signaling
    an impending range expansion.Bitcoin’s breakout above $95,000 could swiftly take
    it to $100,000 and above.Although the probability is low, traders should remain
    cautious about a pullback in the near term.Bitcoin (BTC) has been trading in a
    tight consolidation near the $95,000 level for several days. K33 Research head
    of research Vetle Lunde said in a post on X that Bitcoin’s 7-day volatility has
    hit a 563-day low.A range expansion usually follows a low-volatility period. Although
    it is difficult to predict the direction of the breakout, a tight consolidation
    just below a crucial resistance increases the likelihood of an upside rally. Several
    analysts are also optimistic that Bitcoin’s break will occur to the upside.Crypto
    market data daily view. Source: Coin360Although signs point to a possible breakout
    to the upside, traders should remain cautious. Sometimes, short-term buyers book
    profits when the price fails to break out to the upside. That leads to a short-term
    pullback.Could Bitcoin break above $95,000, or is a correction around the corner?
    How are the altcoins placed? Let’s analyze the charts of the top 10 cryptocurrencies
    to find out.Bitcoin price predictionBitcoin bulls are struggling to push the price

    told Cointelegraph, adding that memecoins may only be a “fun play” for smart investors,
    as they aren’t affected by the same macroeconomic concerns as Bitcoin (BTC) and
    Ether (ETH).At the end of March, a savvy trader turned an initial investment of
    just $2,000 into $43 million with the popular Pepe (PEPE) memecoin, but missed
    selling the top, locking in a realized profit of over $10 million, despite Pepe’s
    over 70% decline.Magazine: Memecoin degeneracy is funding groundbreaking anti-aging
    research\n\n            "

- title: " XRP, Solana lead altcoin ETP inflows as Ethereum slumps — CoinShares "
  url: https://cointelegraph.com/news/xrp-solana-lead-altcoin-etp-inflows-ethereum-struggles?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "XRP and Solana led all altcoin-based exchange-traded product (ETP) inflows
    during the week ending March 21, with $6.71 million and $6.44 million respectively,
    according to digital asset investment firm CoinShares.Other altcoin inflows were
    comparatively modest, with Polygon (MATIC) logging $400,000 and Chainlink (LINK)
    adding $200,000.Sentiment toward altcoins remained mixed overall, as Ether (ETH)
    alone saw significant outflows totaling $86 million. Other notable outflows included
    Sui (SUI), with $1.3 million, Polkadot (DOT), with $1.3 million and Tron (TRX)
    with $950,000.Despite Ether’s substantial outflows dragging down the altcoin sector,
    digital assets collectively reversed a five-week streak of net outflows, registering
    inflows of $644 million. Bitcoin (BTC) led this recovery with inflows amounting
    to $724 million, snapping its own five-week negative streak.Ethereum outflows
    pull down altcoins ETP performance, but Bitcoin carries digital assets. Source:
    CoinSharesAs Cointelegraph reported, Ethereum has now experienced net weekly outflows
    for four consecutive weeks, while Bitcoin recorded its largest net inflow since
    January.Related: Bitcoin ETFs log first net inflows in weeks, while Ether outflows
    continueSentiment on digital assets ETPs shifting across the worldCoinShares noted
    that the majority of inflows originated from the US, which accounted for $632
    million, driven primarily by BlackRock’s iShares Bitcoin Trust (IBIT). Positive
    sentiment, however, extended beyond the US, with Switzerland leading other regions
    at $15.9 million, followed closely by Germany ($13.9 million) and Hong Kong ($1.2
    million).Canada and Sweden lead outflows. Source: CoinSharesStars lining up for
    Solana and XRPAlthough altcoins collectively suffered a net outflow driven primarily
    by Ethereum’s performance, Solana and XRP emerged as the standout altcoin performers.
    In Solana’s case, the US market is poised to introduce its first Solana futures
    exchange-traded funds (ETF), potentially paving the way for a future spot Solana
    ETF.Related: XRP and Solana race toward the next crypto ETF approvalIn Bitcoin’s
    case, the approval of futures-based ETFs was initially favored by regulators due
    to the existence of a regulated market (the Chicago Mercantile Exchange), which
    provided assurances against potential market manipulation. However, this raised
    controversy over the SEC’s continued rejection of spot Bitcoin ETFs, which directly
    hold the cryptocurrency. A pivotal lawsuit by Grayscale successfully challenged
    this inconsistency, compelling the SEC to revisit its stance and ultimately paving
    the way for approval of the long-awaited spot Bitcoin ETFs.Meanwhile, XRP has
    seen a significant boost from the recent dismissal by the SEC of its long-running
    lawsuit against Ripple Labs.Magazine: Memecoins are ded — But Solana ‘100x better’
    despite revenue plunge \n\n            "
  published: 2025-03-24 13:53:21.000000000 +00:00

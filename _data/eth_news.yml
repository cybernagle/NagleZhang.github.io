- title: " Price analysis 3/12: BTC, ETH, XRP, BNB, SOL, ADA, DOGE, PI, LEO, HBAR "
  url: https://cointelegraph.com/news/price-analysis-3-12-btc-eth-xrp-bnb-sol-ada-doge-pi-leo-hbar?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "Bitcoin (BTC) bounced from $76,606 on March 11, but the bulls could not
    sustain the price above $84,500 on March 12. Nansen principal research analyst
    Aurelie Barthere told Cointelegraph that Bitcoin is in a macro correction in a
    bull market, with the next crucial level being “$71,000-$72,000, top of the pre-election
    trading range.”Glassnode also projected a similar target in its March 11 market
    report. The onchain analytics firm said the recent sell-off had been triggered
    by the short-term holders who may have purchased near the peak in January. Glassnode
    added that Bitcoin could bottom out near $70,000 if selling persists.Crypto market
    data daily view. Source: Coin360It is not only the crypto markets; even the US
    stock market has been under pressure in the past few days. However, a silver lining
    for the bulls is that the US Dollar Index (DXY) has corrected from its multi-year
    high above 110 to under 104. Bitcoin generally moves in inverse correlation with
    the dollar, suggesting that a bottom may be around the corner.Could Bitcoin retest
    the support at $76,606 or rise above $85,000? What are the important support and
    resistance levels to watch out for in altcoins? Let’s analyze the charts of the
    top 10 cryptocurrencies to find out.Bitcoin price analysisBitcoin broke below
    the $78,258 level on March 10 and fell to $76,606 on March 11, but the bears could
    not sustain the lower levels. This suggests solid buying by the bulls.BTC/USDT
    daily chart. Source: Cointelegraph/TradingViewThe relief rally is facing selling
    near the 20-day exponential moving average ($87,262), but a minor positive in
    favor of the bulls is that the relative strength index (RSI) is showing a positive
    divergence. Buyers will have to drive the price above the 20-day EMA to suggest
    that the correction could be ending. The BTC/USDT pair may then ascend to the
    50-day simple moving average ($94,654).On the downside, the bulls are expected
    to defend the $73,777 level with all their might because a break below it may
    sink the pair to $67,000.Ether price analysisEther (ETH) fell below the $1,993
    support on March 9 and extended the decline, reaching $1,754 on March 11.ETH/USDT
    daily chart. Source: Cointelegraph/TradingViewThe bulls are trying to start a
    recovery, which is expected to face significant resistance at the breakdown level

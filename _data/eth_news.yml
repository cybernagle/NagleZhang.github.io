- title: " Calls for stricter rules on political memecoins after $4B Libra collapse "
  url: https://cointelegraph.com/news/presidential-token-launches-liquidity-locking-insider-restrictions?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTkzOWItMjFmYi03NWFkLWEzOWItNTc2ZjU4MDE5Nzc3.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTkzOWItMjFmYi03NWFkLWEzOWItNTc2ZjU4MDE5Nzc3.jpg\"
    alt=\"Calls for stricter rules on political memecoins after $4B Libra collapse\"></p><p>Industry
    voices warned that politically endorsed cryptocurrencies must adopt stronger investor
    protections and liquidity safeguards to prevent another major market collapse.<template
    data-ct-widget=\"buzzsprout\" data-buzzsprout-podcast-id=\"2040516\" data-buzzsprout-episode-id=\"16791823\"></template><p>Investor
    sentiment remains shaken after the Libra (LIBRA) token, which was endorsed by
    Argentine President Javier Milei, suffered a $4 billion market cap wipeout due
    to insider cash-outs.</p><p>According to blockchain analytics firm DWF Labs, at
    least eight insider <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/milei-libra-token-scandal-107m-rug-pull\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/milei-libra-token-scandal-107m-rug-pull\">wallets
    withdrew $107 million in liquidity</a>, triggering the massive collapse.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/019593a4-ef7c-7ace-a5f6-4ef3c2052f20\"
    title=\"\" alt=\"Calls for stricter rules on political memecoins after $4B Libra
    collapse\"><figcaption style=\"text-align: center;\"><p><em>Libra/USDC market
    cap. Source: Kobeissi Letter</em></p></figcaption></figure><p>To avoid a similar
    meltdown, tokens with presidential endorsements will need more robust safety and
    economic mechanisms, such as liquidity locking or making the tokens in the liquidity
    pool non-sellable for a predetermined period, DWF Labs wrote in a report shared
    with Cointelegraph.</p><p>The report stated that tokens from high-profile leaders
    would also need launch restrictions to limit participation from crypto-sniping
    bots and large holders or whales.</p><p>&ldquo;Limiting bot and whale activity
    is essential in limiting the impact of individuals acting on insider information
    to corner a large percentage of the token supply,&rdquo; according to Andrei Grachev,
    managing partner at DWF Labs:</p><blockquote>&ldquo;Projects must strive to deliver
    as fair a launch as possible so that all participants have an equal opportunity
    to secure an allocation and aren&rsquo;t disadvantaged by a handful of well-funded
    or well-informed players claiming the lion&rsquo;s share of the supply.&rdquo;</blockquote><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/019593a4-f3bd-798c-8914-00d817a4ac5c\"
    title=\"\" alt=\"Calls for stricter rules on political memecoins after $4B Libra
    collapse\"><figcaption style=\"text-align: center;\"><p><em>Source: DWF Labs</em></p></figcaption></figure><p>The
    Libra scandal resulted in 74,698 traders losing a cumulative $286 million worth
    of capital, according to DWF Labs&rsquo; report.</p><p>The token&rsquo;s quick
    meltdown further illustrated the need for liquidity locking, which &ldquo;ensures
    that there is sufficient liquidity for users to buy and sell into without high
    slippage,&rdquo; Grachev said, adding:</p><blockquote>&ldquo;This is particularly
    valuable during the launch phase of a token when there is high volatility, ensuring
    there is sufficient liquidity to satisfy large trades without major price impact.&rdquo;</blockquote><p>DWF
    Labs&rsquo; report comes a week after <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/ny-bill-criminalize-crypto-fraud-rug-pulls-amid-memecoin-scandals\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">New York lawmakers introduced</a>
    legislation aimed at protecting crypto investors from rug pulls and insider fraud,
    amid the latest wave of memecoin scams.&nbsp;</p><p><em><strong>Related: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/trump-doge-bonk-etf-approvals-more-likely-new-sec-leadership\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>TRUMP, DOGE,
    BONK ETF approvals &lsquo;more likely&rsquo; under new SEC leadership</strong></em></a></p><h2>More
    transparency needed for token launches</h2><p>The Libra token&rsquo;s meltdown
    illustrates the necessity for more transparent token launch mechanisms, explained
    DWF Labs&rsquo; Grachev, adding:</p><blockquote>&ldquo;These include pre-launch
    wallet transparency and launchpads conducting and better due diligence on projects.&rdquo;</blockquote><p>&ldquo;There&rsquo;s
    always a degree of risk when launching any token, something which can&rsquo;t
    easily be fully mitigated,&rdquo; he said.</p><p>&ldquo;Nevertheless, by carefully
    scrutinizing the projects they partner with and taking full advantage of the transparency
    that is one of blockchain&rsquo;s core features, launchpads can empower users
    to make more informed decisions,&rdquo; he added.</p><p><em><strong>Related: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/memecoins-social-experiment-retail-value-extraction-tools\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Memecoins:
    From social experiment to retail &lsquo;value extraction&rsquo; tools</strong></em></a></p><p>Some
    troubling developments have emerged since the meltdown of the memecoin endorsed
    by the Argentine president, including that <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/libra-token-insider-trading-javier-milei-scandal\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Libra was an &ldquo;open
    secret&rdquo;</a> in some memecoin circles, which were aware of the token&rsquo;s
    launch up to two weeks ahead.</p><p>Milei has requested the Anti-Corruption Office
    to investigate all government members, including the president, for potential
    misconduct, <a data-ct-non-breakable=\"null\" href=\"https://x.com/oprargentina/status/1890937875677495542\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">according</a> to a Feb.
    16 X statement issued by Argentina&rsquo;s presidential office, Oficina del Presidente.</p><p><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/javier-milei-risks-impeachment-107-m-libra-rug-pull\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Milei faces impeachment
    calls</a> from his political opponents after endorsing the cryptocurrency that
    turned into a $100 million rug pull.</p><iframe width=\"100%\" height=\"315\"
    src=\"https://www.youtube.com/embed/6UnogdVQWrE?start=\" frameborder=\"0\" allow=\"accelerometer;
    autoplay; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen loading=\"lazy\"></iframe><p><em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/cailtlyn-jenner-token-scammer-sahil-arora-celebrity-network-leaked-price-list/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Caitlyn
    Jenner memecoin &lsquo;mastermind&rsquo;s&rsquo; celebrity price list leaked</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"defi_newsletter\" label=\"Subscription
    Form: DeFi Newsletter\"></template></p>\n</p>\n            "
  published: 2025-03-14 08:15:11 UTC
- title: " Ethereum pushes back Pectra upgrade to conduct third testnet ‘Hoodi’ "
  url: https://cointelegraph.com/news/ethereum-pectra-upgrade-delayed-after-devs-decide-make-third-testnet?utm_source=rss_feed&utm_medium=rss_tag_ethereum&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMTIvMDE5M2U0ZjEtZTIwMi03NjE5LTlhZDMtMGUyMGRkZGRlZjE2.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMTIvMDE5M2U0ZjEtZTIwMi03NjE5LTlhZDMtMGUyMGRkZGRlZjE2.jpg\"
    alt=\"Ethereum pushes back Pectra upgrade to conduct third testnet ‘Hoodi’\"></p><p>Ethereum
    core developers have decided to create a third testnet, Hoodi, to better prepare
    for the Pectra upgrade, which has now been delayed until at least late April after
    the first two testnets encountered several bugs.<p>The Hoodi testnet will launch
    on March 17 and the Pectra upgrade for it will be activated on March 26, Ethereum
    Foundation developer Tim Beiko <a data-ct-non-breakable=\"null\" href=\"https://ethereum-magicians.org/t/all-core-devs-execution-acde-207/23020\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://ethereum-magicians.org/t/all-core-devs-execution-acde-207/23020\">said</a>
    following the Ethereum All Core Dev <a data-ct-non-breakable=\"null\" href=\"https://www.youtube.com/live/byrC-fdTOvE\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://www.youtube.com/live/byrC-fdTOvE\">Call</a>
    on March 13.</p><p>If Pectra runs smoothly on Hoodi without major issues, core
    developers could set a mainnet launch date for Pectra as soon as 30 days after
    Hoodi&rsquo;s activation, Beiko said.</p><p>That would mean Pectra could go live
    on Ethereum mainnet as early as April 25.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/019591e8-9621-72d4-8988-7efa9fdd10c6\"
    title=\"\" alt=\"Ethereum pushes back Pectra upgrade to conduct third testnet
    &lsquo;Hoodi&rsquo;\"><figcaption style=\"text-align: center;\"><p><em>Tim Beiko&rsquo;s
    latest announcement on the Pectra upgrade: </em><a data-ct-non-breakable=\"null\"
    href=\"https://ethereum-magicians.org/t/all-core-devs-execution-acde-207/23020\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em>Ethereum Magicians</em></a></p></figcaption></figure><p>Pectra,
    which combines features from the Prague and Electra proposals, will implement
    over 10 Ethereum Improvement Proposals mostly aimed at bringing more functionality
    to Ethereum wallets and improving user experience.</p><p>It will also include
    scaling proposals to double the blob count for data availability from three to
    six.</p><p>Pectra was initially slated to <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/ethereums-pectra-hard-fork-could-solve-lost-private-keys\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">launch on Ethereum mainnet</a>
    in late 2024 but has faced repeated delays due to client readiness issues and
    synchronization bugs in the first two Ethereum testnets, <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/unknown-attacker-causes-issues-pectra-test-sepolia\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Holesky and Sepolia.</a></p><p>Pectra
    was<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/ethereum-pectra-upgrade-sepolia-testnet-mainnet-delay-possible\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/news/ethereum-pectra-upgrade-sepolia-testnet-mainnet-delay-possible\">
    rolled out on Sepolia</a> on March 5, but soon after, Ethereum developers started
    seeing error messages on their geth nodes and empty blocks being mined.</p><p>Galaxy
    Digital vice president of research Christine Kim <a data-ct-non-breakable=\"null\"
    href=\"https://x.com/christine_dkim/status/1900249399185535130\" rel=\"null\"
    target=\"null\" text=\"null\" title=\"null\">said</a> Hoodi would look to &ldquo;mimic&rdquo;
    the Ethereum mainnet as closely as possible by launching a validator set similar
    to how mainnet currently operates.</p><p>That would <a data-ct-non-breakable=\"null\"
    href=\"https://notes.ethereum.org/@ethpandaops/hoodi\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">see</a> at least 20 million test staked-Ether (<a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/ethereum-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">ETH</a>) distributed
    across 11 client teams and five staking operators.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/019591e8-9ee2-7f7f-b7ef-91d10ae51b3a\"
    title=\"\" alt=\"Ethereum pushes back Pectra upgrade to conduct third testnet
    &lsquo;Hoodi&rsquo;\"><figcaption style=\"text-align: center;\"><p><em>Source:
    </em><a data-ct-non-breakable=\"null\" href=\"https://x.com/christine_dkim/status/1900249399185535130\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em>Christine Kim</em></a></p></figcaption></figure><p>Beiko
    noted that aspects of Pectra may still be tested on Sepolia and Holesky.</p><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/ethereum-average-gas-fees-95-percent-drop-dencun\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Ethereum
    average gas fees drop 95% one year after the Dencun upgrade</strong></em></a></p><p>The
    third testnet comes as Ethereum core developers agreed to deploy future Ethereum
    protocol upgrades at a faster cadence during an &ldquo;All Core Devs&rdquo; meeting
    on Feb. 13.</p><p>Crypto-focused<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/paradigm-raises-850-million-third-crypto-fund\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"> venture capital firm
    Paradigm</a> also called on Ethereum core developers to ship faster protocol updates
    to achieve more milestones on its technical roadmap and maintain its<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/ethereum-future-rests-10000-blockchains\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"> competitive edge</a>
    as a<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/learn/articles/a-beginners-guide-to-understanding-the-layers-of-blockchain-technology\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"> leading layer 1 blockchain.</a></p><p><em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/megaeth-launch-could-save-ethereum-but-at-what-cost/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>MegaETH
    launch could save Ethereum&hellip; but at what cost</strong></em></a></p><template

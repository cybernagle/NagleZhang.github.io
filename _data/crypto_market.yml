- title: " Bitcoin poised to reclaim $90,000, according to derivatives metrics "
  url: https://cointelegraph.com/news/bitcoin-poised-reclaim-90000-according-derivatives-metrics?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTk3NGUtMWFlZi03Nzg3LWI2OGQtOTBjOTNmMDYwZjcx.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTk3NGUtMWFlZi03Nzg3LWI2OGQtOTBjOTNmMDYwZjcx.jpg\"
    alt=\"Bitcoin poised to reclaim $90,000, according to derivatives metrics\"></p><p>Bitcoin
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>) failed to sustain
    levels above $85,000 on March 14, despite a 1.9% gain in the S&amp;P 500 index.
    More importantly, it has been over a week since Bitcoin last traded at $90,000,
    prompting traders to question whether the bull market is truly over and how long
    selling pressure will persist. <h2>Bitcoin basis rate rebounds from bearish levels</h2><p>From
    a derivatives perspective, Bitcoin metrics have shown resilience despite a 30%
    drop from its all-time high of $109,354 on Jan. 20. The Bitcoin basis rate, which
    measures the premium of monthly contracts over spot markets, has recovered to
    healthy levels after briefly signaling bearish sentiment on March 13.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/0195973f-03ef-7caa-a3c5-a4f09c619058\"
    title=\"\" alt=\"Bitcoin poised to reclaim $90,000, according to derivatives metrics\"><figcaption
    style=\"text-align: center;\"><p><em>Bitcoin 2-month futures contracts annualized
    premium. Source: </em><a data-ct-non-breakable=\"null\" href=\"https://app.laevitas.ch/assets/overview/BTC\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://app.laevitas.ch/assets/overview/BTC\"><em>Laevitas.ch</em></a></p></figcaption></figure><p>Traders
    typically demand a 5% to 10% annualized premium to compensate for longer settlement
    periods. A basis rate below this threshold signals weak demand from leveraged
    buyers. While the current 5% rate is lower than the 8% recorded two weeks ago,
    it remains within neutral territory.</p><h2><strong>Central banks will eventually
    boost BTC price</strong></h2><p>Bitcoin price action has closely tracked the S&amp;P
    500, suggesting that factors driving investor risk aversion may not be directly
    tied to the top cryptocurrency. </p><p>However, this also challenges the idea
    of Bitcoin as a non-correlated asset, as its price behavior has aligned more closely
    with traditional markets, at least in the short term.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195973f-09b0-78fa-ad8e-76bb6ddf3322\"
    title=\"\" alt=\"Bitcoin poised to reclaim $90,000, according to derivatives metrics\"><figcaption
    style=\"text-align: center;\"><p><em>S&amp;P 500 futures (left) vs. Bitcoin/USD.
    Source: TradingView / Cointelegraph</em></p></figcaption></figure><p>If Bitcoin&rsquo;s
    price remains heavily dependent on the stock market, which is under pressure due
    to fears of an <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-bull-market-in-peril-as-us-recession-and-tariff-worries-loom\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">economic recession</a>,
    investors are likely to keep reducing exposure to risk-on assets and shift toward
    short-term bonds for safety. </p><p>However, central banks are expected to implement
    stimulus measures to avoid a recession, and scarce assets like Bitcoin are likely
    to outperform as a result. </p><p>According to the CME <a data-ct-non-breakable=\"null\"
    href=\"https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html\">FedWatch</a>
    tool, the markets are pricing less than 40% odds for interest rates in the US
    below 3.75% from the current 4.25% baseline ahead of the July 30 FOMC meeting.</p><p>Nevertheless,
    Bitcoin should reclaim the $90,000 level as soon as the S&amp;P 500 pares some
    of its recent 10% losses. But in a worst-case scenario, panic selling of risk-on
    assets could continue.</p><p>Under such conditions, BTC would likely keep underperforming
    over the next few months, especially if spot Bitcoin exchange-traded funds (ETFs)
    continue to experience significant and <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-etfs-break-outflow-streak-13m-inflow\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">sustained net outflows</a>.</p><h2><strong>Bitcoin
    derivatives show no signs of stress</strong></h2><p>Professional traders are not
    actively using Bitcoin options for hedging presently, as shown by the 25% delta
    skew metric. This implies that few market participants expect the BTC price to
    retest the $76,900 level anytime soon.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195973f-0f64-76a2-89b6-c4adb6cf588c\"
    title=\"\" alt=\"Bitcoin poised to reclaim $90,000, according to derivatives metrics\"><figcaption
    style=\"text-align: center;\"><p><em>Bitcoin 1-month options 25% delta skew (put-call).
    Source: Laevitas.ch</em></p></figcaption></figure><p>Bullish sentiment typically
    leads to put (sell) options trading at a 6% or higher discount. In contrast, bearish
    periods cause the indicator to rise to a 6% premium, as seen briefly on March
    10 and March 12. However, the 25% delta skew has recently stayed within the neutral
    range, reflecting a healthy <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/learn/articles/bitcoin-spot-vs-derivatives-trading\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">derivatives market</a>.</p><p>To
    better gauge trader sentiment, examining BTC&nbsp;<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/how-to-long-and-short-with-margin-trading\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">margin markets is important</a>.
    Unlike derivatives contracts, which are always balanced between longs (buyers)
    and shorts (sellers), margin markets let traders borrow stablecoins to buy spot
    Bitcoin. Similarly, bearish traders can borrow BTC to open short positions, betting
    on a price drop.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195973f-1423-73b3-99a6-ed98d1372f08\"
    title=\"\" alt=\"Bitcoin poised to reclaim $90,000, according to derivatives metrics\"><figcaption
    style=\"text-align: center;\"><p><em>Bitcoin margin long-to-short ratio at OKX.
    Source: </em><a data-ct-non-breakable=\"null\" href=\"https://www.okx.com/markets/data/all\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://www.okx.com/markets/data/all\"><em>OKX</em></a></p></figcaption></figure><p>The
    Bitcoin long-to-short margin ratio at OKX shows longs outweighing shorts by 18
    times. Historically, excessive confidence has pushed this ratio above 40 times,
    while levels below five times favoring longs are seen as bearish. The current
    ratio mirrors sentiment on Jan. 30, when Bitcoin traded above $100,000.</p><p>There
    are no signs of stress or bearishness in Bitcoin derivatives and margin markets,
    which is reassuring, especially after over $920 million in leveraged long futures
    contracts were liquidated in the seven days ending March 13. </p><p>Therefore,
    as recession risks ease, Bitcoin price is likely to reclaim the $90,000 level
    in the coming weeks, given the resilience in investor sentiment.</p><p class=\"post-content__disclaimer\"
    type=\"\">This article is for general information purposes and is not intended
    to be and should not be taken as legal or investment advice. The views, thoughts,
    and opinions expressed here are the author&rsquo;s alone and do not necessarily
    reflect or represent the views and opinions of Cointelegraph.</p><template data-name=\"subscription_form\"
    data-type=\"markets_outlook\" label=\"Subscription Form: Markets Outlook\"></template></p>\n</p>\n
    \           "

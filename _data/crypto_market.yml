- title: " Bitcoin set for $150K BTC price rally as US, China agree to slash tariffs "
  url: https://cointelegraph.com/news/bitcoin-set-150k-btc-price-rally-us-china-slash-tariffs?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "Key takeaways:Bitcoin broke above $105,700 after the US and China agreed
    to slash tariffs.A confirmed bull flag breakout on the weekly chart projects $150,000.Bitwise’s
    sentiment index warns of potential short-term overheating.Bitcoin (BTC) bulls
    cheered a major development in the ongoing US-China tariff talks, with the cryptocurrency
    climbing over the $105,700 mark on May 12 for the first time in four months, further
    confirming a bullish continuation setup with a $150,000 price target.BTC/USD weekly
    price chart. Source: TradingViewUS-China trade truce fuels Bitcoin boomThe catalyst
    behind Bitcoin’s breakout appears to be de-escalating trade tensions between the
    US and China. Over the weekend, US Treasury Secretary Scott Bessent and Chinese
    Vice President He Lifeng struck a deal in Geneva to reduce tariffs that had crippled
    bilateral trade for months.Source: David Ingles, Chief Markets Editor, BloombergUnder
    the deal, the US will lower tariffs on Chinese goods from 145% to 30%, while China
    will reduce its duties on US imports from 125% to 10%. Related: US-China trade
    deal could shed light on Bitcoin’s use case: TraderThe agreement triggered a broad-based
    market rally, with S&P 500 futures rising 2.8% and the US dollar gaining 0.7%.
    In contrast, gold dropped 2.3%, signaling a shift away from safe-haven assets.S&P
    500 futures, gold, and the US Dollar Index weekly chart comparison. Source: TradingView
    Bitcoin, often seen as a high-beta risk asset, had suffered under the weight of
    the trade war, with increased investor caution suppressing crypto inflows. The
    truce now signals improved liquidity and risk appetite, conditions historically
    favorable for BTC rallies.Bull flag breakout points to $150K targetThe current
    Bitcoin rally follows the textbook breakout of a bull flag pattern on the weekly
    chart, a bullish continuation setup formed when the price consolidates downward
    in a parallel channel after a sharp upward move.In Bitcoin’s case, the flag began
    forming after BTC peaked at nearly $110,000 in January. The consolidation persisted
    for months until early May, when the price broke above the flag’s upper trendline
    with a slight volume increase.BTC/USD weekly price chart. Source: TradingView
    This breakout confirms bullish continuation, with the pattern’s projected upside
    target now sitting near $150,000, measured after adding the height of the initial
    flagpole to the breakout point.Momentum indicators, including the relative strength
    index (RSI), are also supportive, with weekly RSI rebounding above 65, reflecting
    renewed buying pressure without entering overbought territory above 70.BTC may
    return to $100,000 firstSome analysts are urging caution as Bitcoin’s sentiment
    is becoming euphoric. André Dragosch, European head of research at Bitwise, noted
    that the firm’s Cryptoasset Sentiment Index had reached its highest level since
    November 2024, a level that previously aligned with local market tops.Cryptoasset
    Sentiment Index. Source: BitwiseThe chart shows that past peaks in sentiment,
    such as those in April 2022, October 2023, and November 2024, were followed by
    short-term corrections or sideways price action. This suggests growing optimism
    may be stretched, raising the risk of a near-term pullback despite Bitcoin’s strong
    long-term outlook.Bitcoin’s price was retracing following its climb above $107,000
    as of May 12, with its daily RSI alarming about overbought conditions. BTC/USD
    daily price chart. Source: TradingViewThe next support target sits around $100,000,
    aligning with its 0.786 Fibonacci retracement line. A decisive drop below the
    level could have BTC test its exponential moving average (EMA) supports below,
    with the 20-day EMA (the purple wave) at around 97,385 as the initial downside
    target. This article does not contain investment advice or recommendations. Every
    investment and trading move involves risk, and readers should conduct their own
    research when making a decision.\n\n            "
  published: 2025-05-12 09:25:45.000000000 +01:00
- title: " Ethereum chart pattern supports ‘moon shot’ rally to new price highs if
    confirmed — Trader "
  url: https://cointelegraph.com/news/ethereum-chart-pattern-supports-moon-shot-rally-to-new-price-highs-if-confirmed-trader?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "Key Takeaways:Veteran trader Peter Brandt suggests a potential Ethereum
    rally to $3,800–$4,800 if ETH breaks above a rising wedge pattern.A short-term
    pullback may occur as the taker buy-sell ratio drops below one, signaling caution
    from futures traders.Ethereum’s native token Ether (ETH) opened its weekly candle
    at $1,807 on May 7, and now it is close to recording its highest 7-day returns
    of 38% since December 2020. Ether also surpassed its realized price for accumulating
    addresses ($1,900), which is the average cost basis for holders, signaling profits
    for users. As illustrated in the chart, most of the buying pressure for ETH came
    from Binance, which is currently the most active exchange for ETH traders. Ethereum
    realized price. Source: CryptoQuantElevated activity at Binance and an uptick
    in outflows reflect strong trader confidence, liquidity, and sustained bullish
    momentum in the current market. “Moonshot” rally to new highs for EthereumIn a
    recent X post, veteran trader Peter Brandt highlighted a developing market structure
    that could pave the way for an Ethereum rally, provided the altcoin breaks through
    a key \"congestion\" pattern. Brandt identified a rising wedge formation on the
    chart—a pattern often considered bearish. Ethereum analysis by Peter Brandt. Source:
    X.comHowever, he suggested that a breakout above this pattern could propel Ethereum’s
    price toward the descending resistance line, targeting a range between $3,800
    and $4,800. This analysis marks a notable shift in Brandt’s outlook from 2024,
    aligning with the renewed optimism for the altcoin. Ethereum futures saw a 42%
    surge in open interest (OI), climbing from $21.3 billion to $30.4 billion between
    May 8 and May 11, 2025. Nearing its all-time high of $32 billion, this spike reflects
    heightened market activity and growing trader engagement. The rapid increase in
    OI signals strong interest in Ether futures, potentially paving the way for increased
    price volatility.Ethereum futures open interest. Source: CoinGlassRelated: Altseason
    is coming, 40% daily gains to become ‘new normal’ — AnalystEthereum’s higher-time
    frame (HTF) chart reflects a price rise on the weekly chart, where the altcoin
    has jumped toward the 50 and 100-week exponential moving averages (EMAs) over
    the past couple of weeks. Historically, such a recovery marks a price bottom but
    could also signal the beginning of a small correction period after the EMAs retest.Ethereum
    weekly chart analysis. Source: Cointelegraph/TradingViewUsing Fibonacci retracement
    levels, ETH has retested the 0.5 to 0.618 range (orange box), which aligns with
    a price level of $2,500. This retest represents the first leg of the recovery,
    but a short-term pullback may occur before further bullish action unfolds.With
    ETH prices moving at a parabolic rate over the past few days, liquidation heatmaps
    noted higher buy-side liquidity between $2,200 and $2,400, after a short-squeeze
    took prices up to $2,608.Ethereum taker buy-sell ratio. Source: CryptoQuantSimilarly,
    the taker buy-sell ratio is beginning to slow down and dropped below 1 on May
    10. The ratio of buy volume divided by sell volume of takers in perpetual swap
    trades indicates futures sentiment, and a ratio below 1 implies short-term bearishness.
    Thus, traders could approach the coming days more cautiously, with ETH consolidating
    under the $2,500 level. Related: Ethereum price greenlit for further upside after
    surprise 29% ETH rallyThis article does not contain investment advice or recommendations.

- title: " Why is Dogecoin price down today? "
  url: https://cointelegraph.com/news/why-is-dogecoin-doge-price-down-today?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMDgvOTViNTBhZGYtYTBiNC00NmJlLWFmYjctZDQ2NjIyYzVjZGQx.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMDgvOTViNTBhZGYtYTBiNC00NmJlLWFmYjctZDQ2NjIyYzVjZGQx.jpg\"
    alt=\"Why is Dogecoin price down today?\"></p><p>Dogecoin (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/doge-price-index#:~:text=Aside%20from%20a%20few%20brief,reaching%20%240.74%20on%20May%207.\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">DOGE</a>) is underperforming
    its top-ranking rivals, having fallen over 8% in the last 24 hours to trade at
    $0.158.<p>What to know:</p><ul><li><p>Dogecoin lost 41% of its value between March
    3 and March 11.</p></li><li><p>The top memecoin established its lowest price in
    four months at $0.142 on March 11.</p></li></ul><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958536-5fef-79dd-bb02-2b21c072eae8\"
    title=\"\" alt=\"Why is Dogecoin price down today?\"><figcaption style=\"text-align:
    center;\"><p><em>DOGE/USD daily price chart. Source: Cointelegraph/TradingView</em></p></figcaption></figure><ul><li><p>Dogecoin&rsquo;s
    downturn today and in recent months mirrors the panic across the memecoin sector.</p></li><li><p>DOGE&rsquo;s
    technicals and onchain data hint at further declines.</p></li></ul><h2><strong>DOGE
    leads memecoin slump</strong></h2><p>Dogecoin&rsquo;s declines today are part
    of a broader bearish sentiment in the memecoin sector.</p><p>Key takeaways:</p><ul><li><p>Shiba
    Inu (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/shiba-inu-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">SHIB</a>), the second
    largest memecoin by market capitalization, was down 7% over the last 24 hours
    to trade at $0.00001167.&nbsp;</p></li><li><p>Ethereum-based Pepe (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/pepe-price-index\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">PEPE</a>) has dropped by approximately 8%.</p></li><li><p>Solana-based
    SPX6900 (SPX) posted the most losses among the top-cap <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/price-indexes/memecoins\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">memecoins</a>, dropping by 28%.</p></li></ul><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958536-6a0d-78ce-bd6f-41c52d1665ea\"
    title=\"\" alt=\"Why is Dogecoin price down today?\"><figcaption style=\"text-align:
    center;\"><p><em>Top memecoins&rsquo; performance. Source: CoinMarketCap</em></p></figcaption></figure><ul><li><p>This
    bearish performance has seen the combined market capitalization drop by 7.5% over
    the last 24 hours, wiping out $4.54 billion from the market.</p></li></ul><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958536-75ba-710e-bc4f-3e49e7908a1f\"
    title=\"\" alt=\"Why is Dogecoin price down today?\"><figcaption style=\"text-align:
    center;\"><p><em>Memecoin market cap. Source: CoinMarketCap</em></p></figcaption></figure><ul><li><p>The
    risk-off behavior from investors comes amid increasing negative sentiment fueled
    by <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/why-bitcoin-sells-off-trump-tariffs\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">macroeconomic uncertainties</a>
    tied to President Trump&rsquo;s tariffs. </p></li><li><p>This has spooked investors,
    pushing them away from volatile assets like memecoins.</p></li></ul><h2><strong>Over
    $23 million in long DOGE positions liquidated</strong></h2><p>Dogecoin&rsquo;s
    bearishness on March 11 is accompanied by <a data-ct-non-breakable=\"null\" href=\"https://www.coinglass.com/LiquidationData\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">significant liquidations</a>
    in the derivatives market, signaling strong bearish pressure.</p><p>Key points:</p><ul><li><p>Over
    $23.1 million worth of long DOGE positions have been liquidated over the last
    24 hours alone, compared to $4.4 million in short liquidations.</p></li><li><p>Bullish
    traders are forced to sell their positions when long positions are liquidated.</p></li></ul><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958536-7fe3-7115-b1fd-15ca53026116\"
    title=\"\" alt=\"Why is Dogecoin price down today?\"><figcaption style=\"text-align:
    center;\"><p><em>Total DOGE liquidations. Source: CoinGlass</em></p></figcaption></figure><ul><li><p>A
    total of $161 million in long DOGE positions have been liquidated since Feb. 24,
    accompanying a 41% drop in price over the same period.</p></li></ul><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/memecoins-dead-but-will-be-back-coin-gecko\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/news/memecoins-dead-but-will-be-back-coin-gecko\"><em><strong>Memecoins
    are likely dead for now, but they&rsquo;ll be back: CoinGecko</strong></em></a></p><ul><li><p>DOGE&rsquo;s
    open<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/explained/what-is-open-interest-in-the-crypto-futures-market\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"> interest</a> (OI) has
    also dropped 37% in the past seven days, signaling a decline in trader participation.</p></li></ul><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958536-8a52-7ab9-985e-72cfb0a6353a\"
    title=\"\" alt=\"Why is Dogecoin price down today?\"><figcaption style=\"text-align:
    center;\"><p><em>DOGE futures open interest. Source: CoinGlass</em></p></figcaption></figure><ul><li><p>The
    low OI and long liquidations suggest that leveraged traders are exiting their
    positions, triggering forced selling.</p></li><li><p>The funding rate has flipped
    negative, and its value at -0.0077% suggests a bearish outlook where short sellers
    are in control. </p></li></ul><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958536-958d-71b8-a2e5-5909b46b97a3\"
    title=\"\" alt=\"Why is Dogecoin price down today?\"><figcaption style=\"text-align:
    center;\"><p><em>DOGE OI-weighted funding rate. Source: CoinGlass</em></p></figcaption></figure><h2><strong>Moving
    averages are not in Dogecoin&rsquo;s favor</strong></h2><p>The ongoing drawdown
    comes after DOGE ran into a major resistance zone.</p><p>Notably:</p><ul><li><p>A
    key barrier sits between $0.24 and $0.26, within which the 200-day simple moving
    average (SMA) at $0.247 and the 50-day SMA at $0.257 are currently.&nbsp;</p></li><li><p>Since
    Feb. 3, DOGE bulls have attempted to rise above this level three times, but on
    each occasion, the altcoin produced a lower high than the previous one.&nbsp;</p></li><li><p>This
    means that traders sell every time the price tries to cross this zone.</p></li><li><p>An
    additional barrier sits higher up at $0.3129, which is also the 100-day SMA.</p></li></ul><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958536-a08e-7e6a-b6a6-bccdf9f83f4f\"
    title=\"\" alt=\"Why is Dogecoin price down today?\"><figcaption style=\"text-align:
    center;\"><p><em>DOGE/USD daily chart. Source: Cointelegraph/TradingView</em></p></figcaption></figure><ul><li><p>On
    the downside, a key area of interest lies between the psychological level at $0.150
    and the range low at $0.127, reached on Oct. 26, 2024.</p></li><li><p>This is
    an important level that bulls need to defend in order to avoid further losses
    to $0.10.</p></li><li><p>Note that when the DOGE bounced off this level in November
    2024, it initiated a 227% rally to $0.480.&nbsp;</p></li></ul><p class=\"post-content__disclaimer\"
    type=\"\">This article does not contain investment advice or recommendations.
    Every investment and trading move involves risk, and readers should conduct their
    own research when making a decision.</p><template data-name=\"subscription_form\"
    data-type=\"markets_outlook\" label=\"Subscription Form: Markets Outlook\"></template></p>\n</p>\n

- title: " Bitcoin ‘Realized Cap’ hits $890B as BTC traders focus on recapturing $100K "
  url: https://cointelegraph.com/news/bitcoin-realized-cap-hits-890-b-as-btc-traders-focus-on-recapturing-100-k?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "Key Takeaways: Bitcoin’s realized capitalization hit a record $890 billion,
    reflecting strong investor conviction as long-term and short-term holders increased
    allocations. Large Bitcoin holders with over 1,000 BTC have accumulated significantly
    since March 2025, reflecting the Q1 2024 trend.Bitcoin (BTC) price saw a short-squeeze
    above $97,000 on May 6, shortly after US Treasury Secretary Scott Bessent announced
    that trade talks would commence with China on May 10. At the same time, BTC’s
    realized capitalization, a metric adding the dollar value of all coins at their
    last moved price, soared to a new all-time high of $890 billion on May 7, 2025.
    The surge also marks the metric’s third consecutive week of record-breaking growth.Bitcoin
    realized cap. Source: CryptoQuantThe realized cap’s rise highlights the total
    investment held by Bitcoin owners, with long-term holders (LTHs) and short-term
    holders (STHs) increasing their positions. It reflects investors’ conviction,
    signaling a potential anticipation for a price breakout. Recent market trends
    have supported this optimism. Cointelegraph reported that large Bitcoin holders
    have been actively accumulating Bitcoin since late March 2025. Data indicates
    that wallets between 10 and 10,000 BTC added 81,338 BTC over six weeks. This accumulation
    signals confidence in the current price uptrend and the possibility of BTC returning
    to $100,000.Glassnode data revealed a notable rise in Bitcoin whale addresses
    holding over 1,000 BTC, climbing from 1,945 on March 1 to 2,006 on May 7. This
    marks the most significant 30-day increase for this cohort in 2025 and the highest
    surge since Q1 2024, when a similar accumulation trend preceded Bitcoin's all-time
    high in March 2024.Bitcoin whale count balance >1K BTC. Source: GlassnodeRelated:
    Why is Bitcoin price up today?Can Bitcoin rally to $100,000?Bitcoin’s support
    zone between $93,000 and $95,000 showed resilience on May 6, with BTC bulls holding
    the level, supported by activity in long perpetual positions.There is downside
    liquidity between $91,600 and $89,000, which Bitcoin could retest if bearish momentum
    persists after this week’s FOMC minutes and Federal Reserve presser. However,
    if BTC breaks above the resistance zone of $97,000 to $99,000, the higher time
    frame (HTF) outlook could tilt toward bulls.Bitcoin 1-day chart. Source: Cointelegraph/TradingViewThis
    resistance area carries weight due to a price cluster formed in Q1, which previously
    led to a downward move. If BTC price clears $99,000, it might shift market dynamics,
    potentially pressuring short positions and adding to bullish liquidity.The $100,000
    level appears to be more of a psychological marker than a significant resistance
    level. If BTC surpasses the $97,000-$99,000 resistance and establishes it as support,
    it could pave the way for a move toward $110,000, although this would depend on
    market conditions and momentum.Michael van de Poppe, founder of MN Capital, suggested
    that the dip below $94,000 and subsequent recovery may indicate a market bottom.
    He expressed optimism about a potential Bitcoin breakout to $100,000 within the
    next two weeks.On the other hand, crypto trader Honey expected a steady rise for
    BTC, predicting a new all-time high of $111,111 by the end of Q2. Related: Bitcoin
    $1B daily realized profits signal 'late-stage bull market'This article does not
    contain investment advice or recommendations. Every investment and trading move

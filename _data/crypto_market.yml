- title: " Why is Solana (SOL) price down today? "
  url: https://cointelegraph.com/news/why-is-solana-sol-price-down-today?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMDkvMDE5MWM4NWYtNTYyMi03NWM5LWIxODQtMDMyZWFiYzQ3OTBj.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMDkvMDE5MWM4NWYtNTYyMi03NWM5LWIxODQtMDMyZWFiYzQ3OTBj.jpg\"
    alt=\"Why is Solana (SOL) price down today?\"></p><p>Solana (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/solana-price-index\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">SOL</a>) has dropped by 6.5% in the last 24 hours
    to reach around $127 on March 17, mirroring losses across the cryptocurrency market.<figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a315-5be0-7296-9701-178e9292e875\"
    title=\"\" alt=\"Why is Solana (SOL) price down today?\"><figcaption style=\"text-align:
    center;\"><p><em>SOL/USD daily chart. Source: Cointelegraph/</em><a data-ct-non-breakable=\"null\"
    href=\"https://www.tradingview.com/x/vmOcinSb/\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"https://www.tradingview.com/x/vmOcinSb/\"><em>TradingView</em></a></p></figcaption></figure><p>The
    top reasons driving the SOL prices lower today include:</p><ul><li><p>Decreasing
    investor interest in SOL&rsquo;s <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/learn/articles/defi-a-comprehensive-guide-to-decentralized-finance\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">decentralized finance</a>
    (DeFi) ecosystem.</p></li><li><p>Decreasing open interest and negative funding
    rates.</p></li><li><p>Technicals suggest a possible further drop in SOL price.</p></li></ul><h2><strong>Solana
    TVL hits four-month lows</strong></h2><p>SOL&rsquo;s price drop today is preceded
    by a drop in the <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/explained/what-is-total-value-locked-tvl-in-crypto-and-why-does-it-matter\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">total value locked</a>
    (TVL) in its DeFi applications, as per data from DefiLlama.&nbsp;</p><p>Key points:</p><ul><li><p>Solana&rsquo;s
    TVL has been in a downtrend since mid-January.&nbsp;</p></li><li><p>This metric
    fell by 45.5% from $12.1 billion on Jan. 19 to $6.63 billion on March 11.</p></li><li><p>The
    TVL now stands at $7 billion on March 17, 41% below the Jan. 19 peak.</p></li></ul><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a315-6112-7084-a75b-dc46e4054332\"
    title=\"\" alt=\"Why is Solana (SOL) price down today?\"><figcaption style=\"text-align:
    center;\"><p><em>Solana total value locked. Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://defillama.com/chain/Solana?groupBy=daily\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"https://defillama.com/chain/Solana?groupBy=daily\"><em>DefiLlama</em></a></p></figcaption></figure><ul><li><p>This
    drop in TVL occurred in tandem with the decrease in SOL&rsquo;s price, which is
    down 56% over the same period.</p></li><li><p>Several layer-2 protocols, such
    as Jito and Raydium, have posted 30% and 32% drops in TVL over the last 30 days.</p></li><li><p>The
    declining TVL reflects traders&rsquo; waning interest and could be a sign that
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/tags/solana\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Solana</a> struggles
    to attract new users despite its lower traction costs.</p></li></ul><p>Solana&rsquo;s
    price slump is also supported by a decline in onchain activity within the <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/learn/solana-sol-ecosystem-overview\" rel=\"null\"
    target=\"null\" text=\"null\" title=\"null\">Solana ecosystem</a>, according to
    the data provided by Dune dashboard <a data-ct-non-breakable=\"null\" href=\"https://dune.com/hashed_official/pumpdotfun\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Pump.fun</a>.&nbsp;</p><p>What
    to know:</p><ul><li><p>A sharp drop in the number of network transactions preceded
    SOL&rsquo;s price drop on March 17.</p></li><li><p>The amount of daily transactions
    on the <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/what-is-solana-and-how-does-it-work#:~:text=Solana%20uses%20a%20256%2Dbit,included%20on%20central%20processing%20units.\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Solana blockchain</a>
    has dropped from an all-time high of 71,738 on Jan. 23 to 24.505 on March 17,
    as shown in the chart below.</p></li></ul><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a315-66c7-770c-9518-2d9b4cc3d397\"
    title=\"\" alt=\"Why is Solana (SOL) price down today?\"><figcaption style=\"text-align:
    center;\"><p><em>Solana&rsquo;s deployed transactions performance chart. Source:
    </em><a data-ct-non-breakable=\"null\" href=\"https://dune.com/hashed_official/pumpdotfun\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://dune.com/hashed_official/pumpdotfun\"><em>Pump.Fun</em></a></p></figcaption></figure><ul><li><p>This
    indicates decreasing network activity, resulting in lower revenues from fees.&nbsp;</p></li><li><p>This
    negatively affects SOL&rsquo;s price, partially explaining the ongoing correction.</p></li></ul><h2><strong>Solana
    funding rates remain negative</strong></h2><p>Solana's <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/learn/articles/open-interest-vs-trading-volume\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">open interest</a> (OI)
    is decreasing, and its funding rates are negative, which provides insight into
    why SOL&rsquo;s price is struggling.</p><p>Key points:</p><ul><li><p>Solana&rsquo;s
    OI in the futures market has dripped from its local peak of $8.57 billion on Jan.
    17 to $4.03 billion as of March 17.</p></li><li><p>OI measures the total number
    of outstanding futures contracts, and a decrease suggests more traders are exiting
    positions.</p></li></ul><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a315-6b5f-77c0-a8dc-4af64a703350\"
    title=\"\" alt=\"Why is Solana (SOL) price down today?\"><figcaption style=\"text-align:
    center;\"><p><em>SOL futures open interest. Source: CoinGlass</em></p></figcaption></figure><ul><li><p>A
    declining OI typically means reduced speculative demand, slowing upward price
    momentum.</p></li><li><p>SOL&rsquo;s weekly funding rates remain negative at -0.10%
    on March 17, four months after peaking out at 1.37%.</p></li></ul><figure><img
    alt=\"Cryptocurrencies, DApps, Markets, Cryptocurrency Exchange, Decentralized
    Exchange, Market Analysis, Solana\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a315-7079-7a5b-a6ee-b670a63235dd\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>SOL OI-Weighted Funding
    Rate. Source: CoinGlass</em></p></figcaption></figure><ul><li><p>Negative funding
    means shorts are paying longs to keep their positions open.</p></li><li><p>OI
    decline and negative funding rates show a lack of confidence in SOL&rsquo;s short-term
    price action.</p></li></ul><p><em><strong>Related: </strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/solana-five-year-birthday-anniversary-key-events-achievements\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Solana&rsquo;s
    5th birthday: From pandemic origins to US crypto stockpile</strong></em></a></p><h2><strong>SOL
    price could drop another 35%</strong></h2><p>SOL trades 56% below its all-time
    high of around $294, established on Jan. 19, and chart technicals suggest that
    there&rsquo;s more room for the downside over the next few weeks.</p><p>Key levels
    to watch:</p><ul><li><p>The altcoin has been trading above the $120 level, but
    the bulls have failed to push the price above $135.</p></li><li><p>If the price
    slides below $120, the SOL/USDT pair could drop to the $110 range low (established
    on Aug. 5, 2025).&nbsp;</p></li><li><p>This is a critical support to watch out
    for because a break and close below it may start a downward move to $100 and then
    to $80.</p></li><li><p>Such a move would represent a 35% drop from the current
    price.</p></li></ul><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a315-7643-784c-add3-4f0a59a529ac\"

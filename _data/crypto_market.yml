- title: " Why is Bitcoin price up today? "
  url: https://cointelegraph.com/news/why-is-bitcoin-price-up-today?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMDgvMjk3NTY5OWMtYWJkZC00ZjdiLWJkMzUtNzQyNjdhNTcwMTE3.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMDgvMjk3NTY5OWMtYWJkZC00ZjdiLWJkMzUtNzQyNjdhNTcwMTE3.jpg\"
    alt=\"Why is Bitcoin price up today?\"></p><p>Bitcoin (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/bitcoin-price\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">BTC</a>) is up 5% over the past 24 hours, rallying
    from a new local low at $76,450 to a high of $83,786 on March 12. <p>On the weekly
    chart, BTC&rsquo;s price retested its 50-weekly exponential moving average, or
    50W-EMA indicator (blue line), as support.</p><figure><img alt=\"Cryptocurrencies,
    Bitcoin Price, Markets, Donald Trump, Bitcoin ETF\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195895f-a2f9-769d-b2c5-e274ef523f7f\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Bitcoin 1-week chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>As observed
    in the chart, Bitcoin&rsquo;s price has maintained a position above this indicator
    since August 2023, which is a long-term bullish position. The 50-EMA level has
    been a support level for Bitcoin over the last 18 months. </p><p>Previously, Bitcoin
    bounced off this trendline in September 2024 before continuing to new all-time
    highs.</p><h2><strong>Bitcoin shows multiple bullish divergences</strong></h2><p>Before
    its relief rally, Bitcoin&rsquo;s low time frame (LTF) and high time frame (HTF)
    charts displayed bullish divergences between price and the <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/here-s-3-ways-the-relative-strength-index-rsi-can-be-used-as-a-sell-signal\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/here-s-3-ways-the-relative-strength-index-rsi-can-be-used-as-a-sell-signal\">relative
    strength index (RSI)</a> indicator.</p><p>Bullish divergences occur when the price
    and RSI move in opposite directions, with the price making a lower low and the
    RSI forming a higher low. Such technical setups indicate that underlying bullish
    momentum is improving to possibly reverse the dominant bearish trend.</p><figure><img
    alt=\"Cryptocurrencies, Bitcoin Price, Markets, Donald Trump, Bitcoin ETF\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01958904-5979-747c-a29a-14c7bc07a463\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Bitcoin bullish divergences
    across the 15-minute, 1-hour, 4-hour and 1-day charts. Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>As
    illustrated in the chart, bullish divergences appeared on the 15-minute, 1-hour,
    4-hour, and 1-day charts, which improved the probability of a short-term rebound.
    </p><p>Meanwhile, the RSI created a higher low on each chart after the indicator
    dropped below the 30 level, which is the oversold region. The oversold region
    hints at declining sell pressure, with buyers potentially stepping in to reverse
    the trend. </p><p>A bullish divergence on the daily chart is also a rare event.
    Since 2020, BTC has exhibited a similar technical setup only six times (including
    the current one), signaling a bottom on each occasion. The last divergence took
    place between July and August 2024.</p><p><em><strong>Related: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-high-entry-buyers-sell-pressure-btc-retrace-possible\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-high-entry-buyers-sell-pressure-btc-retrace-possible\"><em><strong>Bitcoin
    high-entry buyers are driving sell pressure, price may &lsquo;floor&rsquo; at
    $70K</strong></em></a></p><p>Likewise, Bitcoin&rsquo;s recent sweep below its
    previous lows at $78,150 collected all the existing liquidity on the downside.
    This helped BTC price to rebound above the $80,000 mark. </p><p>According to the
    <a data-ct-non-breakable=\"null\" href=\"https://www.coinglass.com/pro/futures/LiquidationHeatMap\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://www.coinglass.com/pro/futures/LiquidationHeatMap\">liquidation
    heatmap</a>, BTC has cleared downside liquidity, leaving over $250 million in
    leveraged positions on the upside, specifically between $85,000 and $87,000. Thus,
    Bitcoin might rally toward this range in the next few days.</p><figure><img alt=\"Cryptocurrencies,
    Bitcoin Price, Markets, Donald Trump, Bitcoin ETF\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01958911-da54-7da1-9379-15e3c07e075b\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Bitcoin 1-week liquidation
    heatmap. Source: CoinGlass</em></p></figcaption></figure><h2>Bitcoin inverse head
    and shoulder eyes $88K</h2><p>On the one-hour chart, Bitcoin&rsquo;s price has
    formed an inverse head-and-shoulders pattern over the past few days, hinting at
    confirmation if a candle closes above the neckline of $83,800.</p><figure><img
    alt=\"Cryptocurrencies, Bitcoin Price, Markets, Donald Trump, Bitcoin ETF\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01958926-c887-7ad7-b1a0-e766261e86e0\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Bitcoin 1-hour chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>Bitcoin could
    retest a higher price range if it decisively breaks above the neckline. The pattern
    target suggests a 7% upswing from the neckline, pushing Bitcoin to $89,000. </p><p>This
    target aligns with the Fibonacci retracement levels, namely the 0.50 and 0.618
    Fibs. These levels are Bitcoin&rsquo;s recent lower high of $96,450 and lower
    low of $76,560.</p><p><em><strong>Related: </strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/4-reasons-why-76-7k-bitcoin-btc-is-the-ultimate-low\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/news/4-reasons-why-76-7k-bitcoin-btc-is-the-ultimate-low\"><em><strong>4
    signs that $76.7K Bitcoin is probably the ultimate low</strong></em></a></p><p>However,
    the bullish pattern will undergo invalidation if the BTC value drops under $78,500.
    A drop below that level would invalidate the current higher-high bullish setup
    on the lower time frame.</p><p>RektProof <a data-ct-non-breakable=\"null\" href=\"https://x.com/RektProof/status/1899559296830230628\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://x.com/RektProof/status/1899559296830230628\">provided</a>
    a similar insight, with the crypto analyst expecting the price to consolidate
    near overhead resistance between $86,000 and $88,000. However, due to a strong
    demand zone near $74,000 to $70,000, the trader expects the price to eventually
    drop and form new price lows in the coming days or weeks.</p><figure><img alt=\"Cryptocurrencies,
    Bitcoin Price, Markets, Donald Trump, Bitcoin ETF\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195892e-d0b2-7c52-9dc1-ca558e346e60\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Bitcoin short-term
    analysis by RektProof. Source: RektProof</em></p></figcaption></figure><p class=\"post-content__disclaimer\"
    type=\"\">This article does not contain investment advice or recommendations.
    Every investment and trading move involves risk, and readers should conduct their
    own research when making a decision.</p><template data-name=\"subscription_form\"
    data-type=\"markets_outlook\" label=\"Subscription Form: Markets Outlook\"></template></p>\n</p>\n

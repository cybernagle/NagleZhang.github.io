- title: " 3 reasons XRP might drop to $1.60 in March "
  url: https://cointelegraph.com/news/3-reasons-xrp-might-drop-1-60-march?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTg0YTAtMTE0Ni03ZWE2LTg3ZjgtY2FlYzljMGJkMTgy.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTg0YTAtMTE0Ni03ZWE2LTg3ZjgtY2FlYzljMGJkMTgy.jpg\"
    alt=\"3 reasons XRP might drop to $1.60 in March\"></p><p>The XRP (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/xrp-price-index\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"https://cointelegraph.com/xrp-price-index\">XRP</a>) daily
    chart registered its lowest candle close in 99 days on March 10. The altcoin dropped
    below the $2 support level but registered a short-term recovery of 12% on March
    11. <figure><img alt=\"Ripple, XRP, Markets, Price Analysis, Market Analysis\"
    src=\"https://s3.cointelegraph.com/uploads/2025-03/019584bb-da5d-7057-9030-16fe2787d647\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>XRP 1-hour chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>On the high
    time frame (HTF) charts, XRP must hold above its psychological level at $2, but
    other metrics suggest that a deeper drawdown is possible. </p><h2>XRP markets
    lack buyers as futures flip bearish</h2><p>XRP price is currently down 37.1% from
    its all-time high of $3.40. When prices dipped by a similar percentage on Feb.
    3, spot market bids quickly absorbed the selling pressure, pushing XRP above $2.50.
    </p><figure><img alt=\"Ripple, XRP, Markets, Price Analysis, Market Analysis\"
    src=\"https://s3.cointelegraph.com/uploads/2025-03/019584e0-e690-778a-ab0d-c2bfc4d0d418\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>XRP&rsquo;s spot and
    perpetual aggregated data. Source: aggr.trade</em></p></figcaption></figure><p>However,
    XRP&lsquo;s spot and perpetual markets were relatively bearish over the past week.
    Data from <a data-ct-non-breakable=\"null\" href=\"https://aggr.trade\" rel=\"nofollow
    noopener\" target=\"_blank\" text=\"null\" title=\"https://aggr.trade\">aggr.trade</a>
    indicates that XRP&rsquo;s spot cumulative volume delta (CVD) dropped by 50% in
    March. </p><p>A negative CVD means that there is more selling volume than buying.
    The current CVD value is -$408 million, which signals waning demand, with sellers
    taking control.</p><p>Likewise, futures traders are also turning bearish, with
    perpetual CVD dropping to -1.18 billion on March 11. XRP&rsquo;s open interest-weighted
    <a data-ct-non-breakable=\"null\" href=\"https://www.coinglass.com/currencies/XRP\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://www.coinglass.com/currencies/XRP\">funding
    rate</a> has also turned significantly negative, which indicates more short positions
    were added over the past few days. </p><figure><img alt=\"Ripple, XRP, Markets,
    Price Analysis, Market Analysis\" src=\"https://s3.cointelegraph.com/uploads/2025-03/019584eb-fea1-7542-aac1-e5d01a82e2b2\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>XRP funding rate chart.
    Source: CoinGlass</em></p></figcaption></figure><h2>XRP whales continue selling
    spree</h2><advertisement><p>XRP&rsquo;s volume bubble map showed a surge in activity
    toward the end of February. Ki-Young Ju, CryptoQuant founder, <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/xrp-distribution-hits-record-level-as-the-altcoin-trades-below-3\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/xrp-distribution-hits-record-level-as-the-altcoin-trades-below-3\">observed</a>
    that this uptick aligned with an ongoing distribution phase for XRP. </p><p>Distribution
    refers to a period in the market cycle when large investors slowly offload their
    positions to secure gains, usually happening close to the peak of an upward trend.</p><p><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/why-is-xrp-price-down-today\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/news/why-is-xrp-price-down-today\"><em><strong>Related:
    Why is the XRP price down today?</strong></em></a></p><p>Current data <a data-ct-non-breakable=\"null\"
    href=\"https://cryptoquant.com/analytics/query/67c3f45a109d3633d52bf9e0?img=link%2F67c3f5615696bb679c8f10de.png&amp;v=67c3f45a109d3633d52bf9e2\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://cryptoquant.com/analytics/query/67c3f45a109d3633d52bf9e0?img=link%2F67c3f5615696bb679c8f10de.png&amp;v=67c3f45a109d3633d52bf9e2\">reveals</a>
    that the distribution phase has intensified over the past seven days. Specifically,
    whale outflows, measured as a 30-day moving average, have steadily risen. </p><p>This
    increase suggests that large holders continued to offload their XRP positions,
    further driving the distribution trend.</p></advertisement><figure><img alt=\"Ripple,
    XRP, Markets, Price Analysis, Market Analysis\" src=\"https://s3.cointelegraph.com/uploads/2025-03/019584ff-5c49-756b-ac52-7cf5d931c683\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>XRP total whale flows.
    Source: CryptoQuant</em></p></figcaption></figure><advertisement><p>Between March
    4 and March 10, these large XRP holders <a data-ct-non-breakable=\"null\" href=\"https://cryptoquant.com/analytics/query/6720df3d1336e76f6a8d2788?v=6720e151127ec65219c27394\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://cryptoquant.com/analytics/query/6720df3d1336e76f6a8d2788?v=6720e151127ec65219c27394\">offloaded</a>
    roughly $838 million in positions. This significant sell-off reflects the ongoing
    bearish trend for XRP.</p></advertisement><h2>XRP price H&amp;S pattern hints
    at $1.60 retest</h2><p>On March 11, XRP&rsquo;s 1-day chart closed below $2.05,
    which is the critical neckline of the daily head-and-shoulders pattern. This pattern
    has potentially strong bearish consequences when observed on a high time frame
    (HTF) chart. </p><figure><img alt=\"Ripple, XRP, Markets, Price Analysis, Market
    Analysis\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01958521-3781-789f-a463-739e8c7fdf87\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>XRP 1-day chart. Source:
    Cointelegraph/TradingView</em></p></figcaption></figure><p>Lower prices are likely
    if XRP fails to reclaim $2.05 as support, as illustrated in the chart above. </p><p>The
    immediate target zone for the XRP price remains between 0.5 and 0.618 Fibonacci
    retracement lines. Also known as the &ldquo;golden zone,&rdquo; the retest range
    lies between $1.90 and $1.60. The likelihood of retesting the 0.618 Fibonacci
    or $1.60 is high in the current bearish environment.</p><p>Failure to hold this
    range could lead to a retest of the long-term demand zone between $1.58 and $1.27.</p><p
    class=\"post-content__disclaimer\" type=\"\">This article does not contain investment
    advice or recommendations. Every investment and trading move involves risk, and
    readers should conduct their own research when making a decision.</p><template
    data-name=\"subscription_form\" data-type=\"markets_outlook\" label=\"Subscription
    Form: Markets Outlook\"></template></p>\n</p>\n            "

- title: " Ethereum price bottom? $1.8B in ETH leaves exchanges, biggest outflow since
    2022 "
  url: https://cointelegraph.com/news/ehtereum-bottom-eth-exchange-outflow-biggest-since-2022?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTdmODUtMTM3Ni03MDI0LTgyY2MtYmY4MDJlNTQ2MjUw.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTdmODUtMTM3Ni03MDI0LTgyY2MtYmY4MDJlNTQ2MjUw.jpg\"
    alt=\"Ethereum price bottom? $1.8B in ETH leaves exchanges, biggest outflow since
    2022\"></p><p>Ethereum&rsquo;s native token, Ether <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/ethereum-price\" rel=\"\" target=\"_self\" text=\"null\"
    title=\"https://cointelegraph.com/ethereum-price\">(ETH)</a>, witnessed its lowest
    weekly close since November 2023, highlighting just how much the top altcoin has
    struggled over the past few months. <figure><img alt=\"Ethereum price bottom?
    $1.8B in ETH leaves exchanges, biggest outflow since 2022\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01957fa0-2dbb-7a68-af98-f227ad5acd13\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Ethereum 1-day chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><advertisement><p>In
    the past 83 days, it declined by 51%, translating to an average daily loss of
    approximately 0.61%. If the losses are compounded daily, the rate increases to
    about 0.84%.</p><h2>Ethereum exchange outflows hit 27-month high</h2><p>According
    to IntoTheBlock, a crypto analytics platform, Ethereum witnessed significant outflows
    worth $1.8 billion over the past week. It was the highest weekly outflow since
    December 2022, and in an X post, the platform <a data-ct-non-breakable=\"null\"
    href=\"https://x.com/intotheblock/status/1899007382933422293\" rel=\"nofollow
    noopener\" target=\"_blank\" text=\"null\" title=\"https://x.com/intotheblock/status/1899007382933422293\">added</a>,
    </p><blockquote>&ldquo;Despite ongoing pessimism around Ether prices, this trend
    suggests many holders see current levels as a strategic buying opportunity.&rdquo;</blockquote><figure><img
    alt=\"Ethereum price bottom? $1.8B in ETH leaves exchanges, biggest outflow since
    2022\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01957fbc-f09b-7e91-ab7e-9ac79ffadbc0\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Ethereum net flows
    on aggregated exchanges. Source: X.com</em></p></figcaption></figure><p>Fellow
    onchain data provider CryptoQuant <a data-ct-non-breakable=\"null\" href=\"https://cryptoquant.com/asset/eth/chart/exchange-flows/exchange-netflow-total?exchange=all_exchange&amp;window=DAY&amp;sma=0_14_30&amp;priceScale=log&amp;metricScale=linear&amp;chartStyle=column&amp;ema=0\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://cryptoquant.com/asset/eth/chart/exchange-flows/exchange-netflow-total?exchange=all_exchange&amp;window=DAY&amp;sma=0_14_30&amp;priceScale=log&amp;metricScale=linear&amp;chartStyle=column&amp;ema=0\">paints</a>
    a similar picture. The 30-day simple-moving average of Ethereum netflows dropped
    to roughly 30,000 ETH last week, which was last recorded toward the end of December
    2022.</p></advertisement><figure><img alt=\"Ethereum price bottom? $1.8B in ETH
    leaves exchanges, biggest outflow since 2022\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01957fc2-c099-7d75-bcd2-b61ba69b5bc5\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Exchange exchange
    total netflows. Source: CryptoQuant</em></p></figcaption></figure><p>Likewise,
    Ethereum&rsquo;s MVRV (market value to realized value) ratio <a data-ct-non-breakable=\"null\"
    href=\"https://cryptoquant.com/analytics/query/64b514efd3b74754036eab78?v=64b514efd3b74754036eab7c\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cryptoquant.com/analytics/query/64b514efd3b74754036eab78?v=64b514efd3b74754036eab7c\">dropped</a>
    to 0.8 for the first time since Oct. 18, 2023, as observed in the chart.</p><p><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/crypto-etps-4th-consecutive-outflows-at-876m-coin-shares\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/news/crypto-etps-4th-consecutive-outflows-at-876m-coin-shares\"><em><strong>Related:
    Crypto ETPs see 4th straight week of outflows, totaling $876M &mdash; CoinShares</strong></em></a></p><p>The
    MVRV ratio is a metric that calculates ETH&rsquo;s market price to the average
    price at which all ETH in circulation was last moved. </p><figure><img alt=\"Ethereum
    price bottom? $1.8B in ETH leaves exchanges, biggest outflow since 2022\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01957fc8-fd52-7354-bbd6-9b6cf2d009cf\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Ethereum MVRV ratio.
    Source: CryptoQuant</em></p></figcaption></figure><p>An MVRV ratio below 1 indicates
    undervaluation, signaling a potential buying opportunity. For context, when the
    MVRV ratio dropped to 0.8 on Oct. 18,  2023, Ether registered a local bottom near
    $1,600, followed by a bullish reversal and the beginning of the 2024 bull run.</p><h2>Is
    the Ethereum bottom in?</h2><p>Ether price is currently consolidating near its
    psychological level at $2,000, following a steady correction since the beginning
    of 2025. </p><p>With respect to this intraday price action, Mikybull, a technical
    analyst, <a data-ct-non-breakable=\"null\" href=\"https://x.com/MikybullCrypto/status/1899061976585662814\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://x.com/MikybullCrypto/status/1899061976585662814\">points</a>
    out that Ethereum is &ldquo;showing a bullish reversal&rdquo; with a diamond price
    pattern. </p><figure><img alt=\"Markets, Market Analysis, Ether Price\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01957fea-ea65-7062-94d1-df47e5a3dec9\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Ethereum 4-hour analysis
    by Mikybull. Source: X.com</em></p></figcaption></figure><advertisement><p>A diamond
    pattern after a downtrend suggests a potential bullish reversal. Based on this
    pattern&rsquo;s measured target, Ether could rebound about 20% to $2,600 from
    its current price. </p><figure><img alt=\"Markets, Market Analysis, Ether Price\"
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958003-96c7-7138-96e5-dcae25d7d6b4\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Ethereum weekly chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure></advertisement><p>On
    the flip side, Ether&rsquo;s weekly chart closed below the 200-day EMA level for
    the first time since October 2023. Since 2020, ETH price has remained under this
    indicator for less than 15% of the time. Previously, Ether rebounded in the following
    week every time it dropped below this trendline in 2023. </p><p><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-monte-carlo-model-forecasts-713k-peak-6-months\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-monte-carlo-model-forecasts-713k-peak-6-months\"><em><strong>Related:
    Bitcoin &lsquo;Monte Carlo&rsquo; model forecasts $713K peak in 6 months</strong></em></a></p><p>However,
    a prolonged period under this line may extend ETH&rsquo;s bottom price target.
    Thus,  it will be critical for Ethereum to bounce back above this EMA trendline
    to confirm the bottom over the next few days or weeks. </p><p class=\"post-content__disclaimer\"
    type=\"\">This article does not contain investment advice or recommendations.
    Every investment and trading move involves risk, and readers should conduct their
    own research when making a decision.</p><template data-name=\"subscription_form\"
    data-type=\"markets_outlook\" label=\"Subscription Form: Markets Outlook\"></template></p>\n</p>\n

  summary: "Key points:Ether price rose 3% to $2,550 on May 18, triggering $22 million
    in short ETH liquidations.A bull flag on the chart suggests a $3,700 target, with
    analysts predicting Bitcoin’s price to go as high as $5,000 in May.Ether’s (ETH)
    price was up on May 18, rising more than 2.5% over the last 24 hours to trade
    at $2,536. This recovery reinforces the optimism among traders that ETH price
    could hit $3,000 in May, citing strong technicals.Ether wipes out $7.5 million
    shorts in an hourData from Cointelegraph Markets Pro and Bitsamp shows that ETH
    rose by more than 4.5% to an intraday high of $2,551 on May 18 from a low of $2,440
    the previous day.ETH/USD daily chart. Source: Cointelegraph/TradingViewAccompanying
    Ether’s losses today are significant liquidations across the crypto market. According
    to data from CoinGlass, more than $158 million leveraged crypto positions have
    been liquidated over the last 24 hours, with $95 million representing long liquidations.Short
    Ether liquidations amounted to $22.25 million, with the $7.5 million being wiped
    out in the last hour alone.Total liquidations across the crypto market. Source:
    CoinGlassThis means that short traders were caught off guard by Ether’s return
    to $2,500. Additional CoinGlass data showed several bands of seller interest above
    the spot price, with ask orders worth over $384 million building up all the way
    up to $3,000. This suggested that the ongoing recovery might be capped at this
    level.ETH liquidation heatmap. Source: CoinGlassIs Ether’s recovery back?Market
    analysts believe Ether’s recent drop was a technical correction to retest key
    support levels before continuing its uptrend toward $3,000 and beyond. Titan of
    Crypto said that the weekly Stochastic RSI’s value at 79 suggests that ETH “still
    has more gas in the tank” to move higher.#Ethereum might still have more gas in
    the tank ⛽️The weekly Stochastic RSI suggests there's still room before reaching
    extreme overbought territory, possibly a few more weeks to go. #ETH pic.twitter.com/atCm93napO—
    Titan of Crypto (@Washigorira) May 17, 2025Ether’s downside may be capped at $2,400,
    according to pseudonymous analyst Chimp of the North. The analyst shared a chart
    suggesting that the altcoin could continue its retracement to retest $2,400 support
    before launching another rally toward the $3,000-$3,300 range.ETH/USD chart. Source:
    Chimp of the NorthFellow analyst Crypto Patel projected a deeper retracement for
    Ether, saying that ETH price could potentially drop $1,800 before launching a
    move higher.“This area is a high-probability zone for bullish re-entry if price
    shows support,” the analyst wrote as part of a May 17 post of X, adding:“If demand
    holds here, the next leg up toward $4,000–$5,000 could follow.”ETH/USD daily chart.
    Source: Crypto PatelAs Cointelegraph reported, ETH could hit new all-time highs
    around $5,000, fueled by AI adoption, spot ETF inflows, and the latest improvements
    through the Pectra upgrade.Related: Price predictions 5/16: BTC, ETH, XRP, BNB,
    SOL, DOGE, ADA, SUI, LINK, AVAXEther price bull flag is still in playFrom a technical
    perspective, ETH price is still trading above a bull flag pattern in the four-hour

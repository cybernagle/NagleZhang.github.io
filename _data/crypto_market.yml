- title: " Why is XRP price up today? "
  url: https://cointelegraph.com/news/why-is-xrp-price-up-today?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "Key takeaways:XRP surged on May 8, boosted by risk-on sentiment following
    US President Donald Trump’s teased trade deal with the UK.Whale accumulation continues,
    with the number of addresses holding 10,000+ XRP rising steadily on price dips.XRP
    broke above a key falling wedge resistance, increasing the chances of a rally
    toward $2.80–$3.66.XRP’s (XRP) price gained 7.50% on May 8 to reach an intraday
    high of $2.27, mirroring similar upside moves elsewhere in the cryptocurrency
    market.Traders pushed the price higher amid Trump’s tariff threats, increased
    whale accumulation, and favorable chart technicals.XRP/USD daily price chart.
    Source: TradingViewTrump’s tariff tease boosts risk appetite, helping XRPTrump
    announced a “major trade deal” in a social media post, announcing an Oval Office
    press conference with representatives from a “big, highly respected country.”

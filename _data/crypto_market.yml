- title: " Bitcoin ‘power law’ model forecasts $200K BTC price in 2025 "
  url: https://cointelegraph.com/news/bitcoin-power-law-model-forecasts-200-k-btc-price-in-2025?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "Key takeaways: Based on power curve trends, Bitcoin may hit $200,000 in
    Q4 2025.Bitcoin follows gold’s price trend with a 100-150 day lag.Bitcoin’s (BTC)
    price has rallied 11% this week, its best weekly return in 2025 and its highest
    seven-day growth since early November 2024. Bitcoin also reached $95,000 on April
    25 for the first time since Feb. 24. Bitcoin 1-week chart. Source: Cointelegraph/TradingView21st
    Capital co-founder Sina mentioned that Bitcoin reclaimed the power-law price.
    The power law's predictive accuracy stems from Bitcoin's network growth following
    Metcalfe's Law, where value scales with the square of users. Based on Sina’s Bitcoin
    Quantile Model, reclaiming the power-law price keeps BTC on track to hit a price
    target of $130,000 and $163,000 before the end of 2025. Bitcoin Quantile Model
    by Sina. Source: X.comAs illustrated in the chart, Bitcoin is currently in the
    “Transition” range, where BTC accumulation occurs. Once it breaks into the “Acceleration”
    zone, the crypto asset enters the rally's 33% to 66% range, progressively targeting
    $106,000, $130,000, and $163,000 over the next few months. However, anonymous
    Bitcoin analyst apsk32 predicted BTC’s price target could be as high as $200,000
    in 2025. The prediction is based on \"Bitcoin power curve time contours,\" which
    overlay Bitcoin’s price movements across four-year cycles (2013, 2017, 2021, and
    2025). The chart suggests a strong performance in Q3 and Q4 of 2025, with the
    analyst noting that Bitcoin’s historical four-year cycle remains intact. The analyst
    said, “Looking at two-year segments centered today, 4, 8, and 12 years ago. Price
    scaling performed using the power curve trendline. Expecting $200,000+ Bitcoin
    in Q4. Gold suggests we could go significantly higher.”Bitcoin Power Curve Time
    Contours chart. Source: X.comRelated: 5 Bitcoin charts predicting BTC price rally
    toward $100K by MayGold-Bitcoin lag may repeat Q4 rallySince the beginning of
    2024, Bitcoin and gold have posted new highs in the market, with each asset outperforming
    the other during specific periods. As illustrated in the chart, Bitcoin and gold
    achieved new highs between March and August 2024. However, in Q3 2024, gold spearheaded
    the rally, surpassing Bitcoin's performance. By Q4, Bitcoin regained momentum,
    outpacing the precious metal and maintaining its lead until March 2025, when gold
    again took the lead. Bitcoin gold price performance chart. Source: Cointelegraph/TradingView
    Gold is still leading BTC but has dropped 6% since hitting new highs, while Bitcoin
    has gained 11%. Cointelegraph reported that BTC tends to follow gold’s directional
    bias with a lag of 100-150 days. Based on that narrative, it is possible that
    Bitcoin could lead gold in the coming weeks.Similarly, the US Dollar Index (DXY)
    dropped to a new three-year low on April 21, which further fueled the likelihood
    of a rally for risk assets. Cointelegraph reported that multi-year DXY lows have
    been historically bullish for Bitcoin. Crypto analyst ‘Venture Founder’ also pointed
    out, “Traditionally, DXY going down is very bullish for $BTC, we now have a massive
    bearish divergence for DXY, which may suggest it goes to 90. The last 2 times
    this happened triggered a Bitcoin parabolic bull run in the final phase of the
    bull market (lasting 12 months).”Related: Bitcoin spikes to 7-week highs as analyst
    doubts chances of $100K reboundThis article does not contain investment advice
    or recommendations. Every investment and trading move involves risk, and readers
    should conduct their own research when making a decision.\n\n            "

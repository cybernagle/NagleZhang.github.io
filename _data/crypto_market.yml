- title: " XRP price analysts project $10 next, ‘optimistic’ target of $20 "
  url: https://cointelegraph.com/news/xrp-price-analysts-10-optimistic-target-of-20?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "XRP (XRP) price is up 15% over the past seven days from a low of $1.61.
    According to several technical analysts, a sustained recovery daily close above
    $2.20 will signal a strong trend reversal that could put double digits within
    reach. XRP/USD daily chart. Source: Cointelegraph/TradingViewXRP price must reclaim
    $2.20After the cryptocurrency market experienced a relief rally due to US President
    Donald Trump’s announcement of tariff exemptions for a range of tech products,
    traders are optimistic about the possibility of XRP price breaking into double
    digits.Analyst DOM said XRP’s recent retest of the support at $1.96 saw it regain
    a key “value area” above $2.00, established in December 2024. “$2.20 is now the
    only objective here,” the analyst said in an April 13 post on X, adding that a
    decisive move above this level would lead to a rise toward $2.50.An accompanying
    chart showed that the price has also reclaimed the election VWAP (Volume Weighted
    Average Price) at $2.03, suggesting a potential for further gains.“If $2.00 and
    election VWAP stay as support, this chart looks very constructive.”XRP/USD chart.
    Source: DomXRP’s immediate support at $2.10, also the 100-day exponential moving
    average (EMA), is especially important, according to the liquidation heatmap.A
    wall of bid liquidity is building around this level, suggesting that a retest
    of support and a liquidity grab here is becoming increasingly likely in the short
    term.XRP liquidation heatmap. Source: CoinGlassWill XRP price hit $20 in 2025?Following
    the recent recovery in XRP price, Maelius, an anonymous crypto analyst, said that
    the altcoin could reach $10 and an “optimistic” target of between $15 and $20,
    according to the Elliott Wave Theory on the weekly time frame chart.“Conservative
    case assumes XRP has completed its W3, currently in the process of finalizing
    W4, before expanding to a final W5.”He added that the price action and RSI were
    mirroring the 2017 cycle, with the RSI topping out in the resistance area (in
    red), suggesting overbought conditions. If the current cycle repeats, Maelius
    predicts XRP could reach a W5 target of around $10 toward the end of the year. “Conservative
    assumption is for a magnitude of W5 to replicate the one of W3, thus targeting
    $10.”XRP/USD weekly chart. Source: MaeliusContinuing, the analyst argued that
    there is a possibility that the W3 top is not in just yet.Related: Price analysis
    4/14: SPX, DXY, BTC, ETH, XRP, BNB, SOL, DOGE, ADA, LEOThe reason given is a larger
    accumulation period compared to the 2017 cycle in terms of both price and the
    RSI.“Therefore, there is a possibility we have just completed W3 out of larger
    W3, meaning it is just taking a bit more time than previously,” Maelius explained. If
    it is taking longer this time, Maelius expects the RSI to retest the resistance
    to confirm the completion of the third wave. Also, the Eliott Wave count would
    be in line with the previous cycle, with a longer fourth wave within the third
    wave as before.“In such a case, the final W5 top could easily get prolonged to
    Q1-2 of 2026, with higher targets than in the conservative case, i.e. likely in
    the range of $15-$20 or even higher. ” XRP/USD weekly chart. Source: MaeliusMeanwhile,
    fellow analyst XForceGlobal noted that XRP is still in a “major bull market,”
    with its price action standing out dramatically from the rest of the crypto market
    from an Elliott Wave Theory perspective.“If we have all the ideas aligned together
    with even the simple technical analysis, there is a very good chance that we’re
    are gonna be working for all-time highs at the very minimum expectation.” XRP/USD
    daily chart. Source: XForceGlobalAs reported by Cointelegraph, XRP’s symmetrical
    triangle pattern suggests a possible rally to new all-time highs over $3.50. This
    article does not contain investment advice or recommendations. Every investment
    and trading move involves risk, and readers should conduct their own research
    when making a decision.\n\n            "

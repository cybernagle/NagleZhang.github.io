- title: " Why is Cardano price down today? "
  url: https://cointelegraph.com/news/why-is-cardano-price-down-today?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMDgvZTIzMDE1ZGQtODcyOC00YjI3LTgzYjctODgxYTY1YjUwMTlh.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMDgvZTIzMDE1ZGQtODcyOC00YjI3LTgzYjctODgxYTY1YjUwMTlh.jpg\"
    alt=\"Why is Cardano price down today?\"></p><p>Cardano (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/ada-price-index\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">ADA</a>) price displays weakness on March 11, down
    2.5% over the last 24 hours to trade at $0.7250. A weakening technical setup and
    several onchain signals suggest that ADA could see a deeper correction in the
    coming days.<figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958499-d439-7285-9c90-eff7745587c3\"
    title=\"\" alt=\"Why is Cardano price down today?\"><figcaption style=\"text-align:
    center;\"><p><em>ADA/USD daily chart. Source: Cointelegraph/</em><a data-ct-non-breakable=\"null\"
    href=\"https://www.tradingview.com/x/3vvOni1q/\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"https://www.tradingview.com/x/3vvOni1q/\"><em>TradingView</em></a></p></figcaption></figure><p>Let&rsquo;s
    take a closer look at why ADA price is underperforming today.</p><h2><strong>ADA
    falls alongside Bitcoin and Ether</strong></h2><p>The bearish sentiment was not
    only exclusive to Cardano as crypto prices also plummeted across the board, with
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-nears-78k-lows-us-stocks-dive-wall-street-open\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Bitcoin dropping toward
    $76,000</a> on March 10.</p><p>Key takeaways:</p><ul><li><p>Market leader Bitcoin
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>) has shed over
    3.6% and 17% over the last week and month, respectively, setting a new four-month
    low of around $76,600 on March 10.&nbsp;</p></li><li><p>BTC price has since <a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-price-bounces-4-data-89-chance-stocks-bottom-is-in\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-price-bounces-4-data-89-chance-stocks-bottom-is-in\">recovered
    above $81,000</a> but is still down 1.3% over the last 24 hours.</p></li><li><p>Ether
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/ethereum-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">ETH</a>) has also dropped
    by 8.6% over the last 24 hours to trade below $2,000 for the first time since
    November 2023.&nbsp;</p></li></ul><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958499-de6c-7d1a-b446-d9c7bbea539b\"
    title=\"\" alt=\"Why is Cardano price down today?\"><figcaption style=\"text-align:
    center;\"><p><em>Performance of top-10 cryptocurrencies. Source: CoinMarketCapp</em></p></figcaption></figure><ul><li><p>This
    dragged altcoins like ADA down even more, with a 41% decline over the last 90
    days compared to BTC&rsquo;s 19% decline over the same period.&nbsp;</p></li><li><p>The
    ADA/BTC pair is down approximately 20% over the same time frame.</p></li><li><p>The
    crypto market&rsquo;s volatility has been exacerbated by <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/trump-intentionally-crashing-markets-force-fed-lower-interest-rates\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">macroeconomic uncertainty</a>,
    which has also seen a sharp drop in US equities, with crypto-related stocks such
    as Strategy (MSTR) and Coinbase (COIN) tanking 10%.</p></li><li><p>Lack of near-term
    positive catalysts, a <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/will-trump-s-trade-war-bring-an-early-end-to-the-bitcoin-bull-market\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">potential tariff war</a>
    and fears of a US recession are adding headwinds to an already battered market.</p></li></ul><h2><strong>Weakening
    onchain Cardano activity</strong></h2><p>The bearishness in ADA prices today is
    preceded by reduced network activity and the <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/explained/what-is-total-value-locked-tvl-in-crypto-and-why-does-it-matter\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">total value locked</a>
    (TVL), which has dropped sharply over the last week.</p><ul><li><p>ADA&rsquo;s
    daily DEX trading volume fell by 67% from $21 million on March 2 to $7.3 million
    on March 10.</p></li><li><p>Similarly, <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/learn/articles/active-vs-new-addresses-in-crypto-key-differences-explained\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">daily active addresses</a>
    decreased by 59% from approximately 70,700 to 28,900 over the same period.</p></li></ul><figure><img
    alt=\"Cryptocurrencies, Dollar, SEC, Markets, Cardano, Tech Analysis, Market Analysis,
    Altcoin Watch\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195849a-c837-7dff-bac5-baf15c9c04af\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>DEX trading volume
    and DAA on Cardano. Source: </em><a data-ct-non-breakable=\"null\" href=\"https://app.artemis.xyz/project/cardano?tab=fundamentals\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://app.artemis.xyz/project/cardano?tab=fundamentals\"><em>Artemis</em></a></p></figcaption></figure><ul><li><p>Cardano&rsquo;s
    TVL has plummeted from $701.4 million on Dec. 3, 2024, to reach a four-month low
    of $268 million on Feb. 28.</p></li><li><p>This metric has again dropped by 25%
    over the last seven days.</p></li></ul><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958499-ecf3-7d86-95d7-c3aa46afa603\"
    title=\"\" alt=\"Why is Cardano price down today?\"><figcaption style=\"text-align:
    center;\"><p><em>Cardano total value locked, USD. Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://defillama.com/chain/Cardano\" rel=\"null\" target=\"null\" text=\"null\"
    title=\"https://defillama.com/chain/Cardano\"><em>DefiLlama</em></a></p></figcaption></figure><ul><li><p>The
    weekly decline in daily active addresses, DEX volume and TVL coincides with ADA&rsquo;s
    10% price drop over the same period.</p></li></ul><h2><strong>Buyer exhaustion
    hampers ADA price</strong></h2><p>Data from <a data-ct-non-breakable=\"null\"
    href=\"https://subscription.cointelegraph.com/?_gl=1*7499wx*_ga*MTQ0MzQ0NzI4Ny4xNzE2MzY1NTA0*_ga_53R24TEEB1*MTcxNjM2NTUwNC4xLjEuMTcxNjM2Njg2MC4wLjAuMA..\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Cointelegraph Markets
    Pro</a> and <a data-ct-non-breakable=\"null\" href=\"https://www.tradingview.com/symbols/BTCUSD/?exchange=BINANCE\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">TradingView</a> shows
    ADA&rsquo;s rally on March 2 pushed the relative strength index (RSI) above 70
    in multiple timeframes, indicating &ldquo;overbought&rdquo; conditions.&nbsp;</p><ul><li><p>On
    March 2, ADA&rsquo;s RSI reached as high as 90, 84 and 73 on the four-hour, 12-hour
    and daily timeframes, respectively.</p></li><li><p>An overbought <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/here-s-3-ways-the-relative-strength-index-rsi-can-be-used-as-a-sell-signal\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">RSI</a> implies that
    the rally is likely overheating, and the buyers have become exhausted.&nbsp;</p></li><li><p>Consequently,
    traders may take this as a signal to sell and lock in profits, leading the price
    to either consolidate sideways or fall further.</p></li></ul><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958499-f773-7257-991c-b9c2ee29a247\"
    title=\"\" alt=\"Why is Cardano price down today?\"><figcaption style=\"text-align:
    center;\"><p><em>ADA/USD daily chart. Source: Cointelegraph/</em><a data-ct-non-breakable=\"null\"
    href=\"https://www.tradingview.com/x/gtByv1KS/\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"https://www.tradingview.com/x/gtByv1KS/\"><em>TradingView</em></a></p></figcaption></figure><ul><li><p>In
    ADA&rsquo;s case, the price has been dropping since then, recording lower highs
    and lower lows, as shown in the chart above.</p></li><li><p>Thus, the downward
    target for the short term is between the March 11 intra-day low of around $0.6472
    and the range low at $0.5794 reached on Feb. 28.</p></li></ul><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/price-analysis-3-10-spx-dxy-btc-eth-xrp-bnb-sol-doge-ada-pi\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/news/price-analysis-3-10-spx-dxy-btc-eth-xrp-bnb-sol-doge-ada-pi\"><em><strong>Price
    analysis 3/10: SPX, DXY, BTC, ETH, XRP, BNB, SOL, DOGE, ADA, PI</strong></em></a></p><ul><li><p>The
    second area of interest lies between the Feb. 3 low at $0.5569 and the range low
    at $0.5197 reached on Nov. 13.&nbsp;</p></li><li><p>This demand zone could potentially
    provide a good entry position for late investors.&nbsp;</p></li></ul><p class=\"post-content__disclaimer\"
    type=\"\">This article does not contain investment advice or recommendations.
    Every investment and trading move involves risk, and readers should conduct their
    own research when making a decision.</p><template data-name=\"subscription_form\"
    data-type=\"markets_outlook\" label=\"Subscription Form: Markets Outlook\"></template></p>\n</p>\n

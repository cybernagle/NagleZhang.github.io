- title: " Why is Bitcoin price stuck? "
  url: https://cointelegraph.com/news/why-is-bitcoin-price-stuck?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "Bitcoin (BTC) price has been consolidating within a roughly $3,000 range
    since April 9 as the 200-day SMA trendline remains a stubborn barrier.Data from
    Cointelegraph Markets Pro and Bitstamp shows that BTC price oscillates within
    a tight range between $83,000 and $86,000, as shown in the chart below.BTC/USD
    four-hour chart. Cointelegraph/TradingViewKey factors behind Bitcoin’s flat price
    action include:Trump’s mixed signals on technology tariffs.Buy and sell pressure
    equilibrium with BTC price trapped between two key levels. Trump tariffs breed
    market uncertaintyOne significant factor contributing to Bitcoin price flatlining
    is the White House’s semiconductor and technology tariff inconsistency.Key points:Bitcoin
    price rallied on April 11 after US President Trump announced tariff exemptions
    for an array of tech products, including smartphones, chips, computers, and semiconductors.On
    April 13, Commerce Secretary Howard Lutnick walked back on this announcement,
    saying that the tariff relief on electronics was temporary.This was later confirmed
    by President Trump, who stated that the tariff rate would be announced next week,
    adding that there would be flexibility for some companies in the sector.This flip-flopping
    breeds uncertainty, as tariffs could disrupt supply chains for tech firms, many
    of which are intertwined with crypto infrastructure like mining and blockchain
    companies.According to capital markets commentator The Kobeissi Letter, the \"Clarification
    of Exceptions Under Executive Order 14257\" note published by the White House
    on April 11 did not present a “new list of exemptions.”Rather, it was a clarification
    that the “goods were never actually intended to be subject to 145% tariffs,” The
    Kobeissi Letter explained in an April 14 post on X. “It appears that the news
    and most investors, along with customs enforcement themselves, never truly understood
    what was being tariffed to begin with. This was a complete misunderstanding by
    almost everyone involved.”As a result, market participants have taken a wait-and-see
    approach, as clarity on policy could either ignite a rally or trigger a sell-off.Related:
    Trade war vs. record M2 money supply: 5 things to know in Bitcoin this weekBTC
    price trapped between two key trendlinesAnother reason why Bitcoin price remains
    stuck in limbo is that it trades within two significant levels, as shown in the
    chart below:BTC price trades between the 50-day simple moving average (SMA) at
    $84,400 and the 200-day SMA at $87,500.This confirms the 200 SMA as resistance
    and the 50 SMA as support on the daily candle chart.The value of the RSI close
    to the midline at 52 suggests that there is a tug-of-war between the bears and
    the bulls.Bitcoin needs to break the 200 SMA trendline and confront resistance
    at the $90,000 psychological level. Falling below the 50-day SMA will likely lead
    to a deeper correction.BTC/USD daily chart. Source: Cointelegraph/TradingViewMeanwhile,
    the Bitcoin liquidation heatmap reveals heavy ask orders around the 200-day SMA
    and bid positions just below the 50-day SMA, as shown in the figure below. This
    further highlights the liquidity clusters that are currently containing BTC prices
    within the current market structure.Bitcoin liquidation heatmap. Source: CoinGlassThis
    article does not contain investment advice or recommendations. Every investment
    and trading move involves risk, and readers should conduct their own research
    when making a decision.\n\n            "

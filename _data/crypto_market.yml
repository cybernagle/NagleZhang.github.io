    price turns down from the 20-day EMA and breaks below the $15.27 support. That
    could extend the decline to $11.AVAX/USDT 4-hour chart. Source: Cointelegraph/TradingViewThe
    pair has been trading inside a narrow range between $20.10 and $18.12 on the 4-hour
    chart. The 20-EMA is trying to move up, and the RSI is in the positive territory,
    giving a slight advantage to the bulls. If the price breaks above $20.10, the
    pair may ascend to $21.20 and then to $22.50.Alternatively, if the price turns
    down and breaks below $18.12, it suggests that the bears are trying to retain
    control. The pair may slump to $16.95 and eventually to $15.27.Related: Why is
    Bitcoin price stuck?Near Protocol price analysisNear Protocol (NEAR) has been
    in a strong downtrend, but it is showing early signs of starting a reversal.NEAR/USDT
    daily chart. Source: Cointelegraph/TradingViewThe positive divergence on the RSI
    suggests that the bears are losing their grip. A break and close above the 50-day

- title: " Ethereum eyes 65% gains from &#039;cycle bottom&#039; as BlackRock ETH
    stash crosses $1B "
  url: https://cointelegraph.com/news/ethereum-65-cycle-bottom-black-rock-eth-1b?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "Ethereum’s native token, Ether (ETH), has lost half of its value in the
    past three months, crashing from $4,100 in December 2024 to as low as around $1,750
    in March 2025. Nevertheless, it is now well-positioned for a sharp price rebound.65%
    ETH price rebound in play by JuneFrom a technical standpoint, Ether’s price is
    eyeing a potential breakout as it retests a long-term support zone. Historically,
    bounces from this multi-year support have led to explosive rallies — most notably
    gains of over 2,000% and 360% during past cycles.ETH/USD two-week price chart.
    Source: TradingViewAs of March 23, the ETH/USD pair was hovering near $2,000,
    close to the given support area. A bounce from this zone can lead the price toward
    $3400 by June—up 65% from current prices. This level coincides with the lower
    boundary of Ether’s prevailing descending channel resistance.Source: Ted PillowsConversely,
    a decline below the support zone could push the ETH price toward the 200-2W exponential
    moving average (200-2W EMA; the blue wave in the first chart) at around $1,560.BlackRock’s
    crypto funds hold over $1B in ETHEther’s bullish outlook appears as institutional
    confidence in Ethereum grows stronger. BlackRock’s BUIDL fund now holds approximately
    a record $1.145 billion worth of Ether, up from around $990 million a week ago,
    according to data from Token Terminal. Capital deployed across BlackRock’s BUIDL
    fund. Source: Token TerminalThe fund primarily focuses on tokenized real-world
    assets (RWAs), with Ethereum remaining the dominant base layer. While the fund
    diversifies across chains like Avalanche, Polygon, Aptos, Arbitrum, and Optimism,
    Ethereum remains its core allocation.BlackRock’s latest addition of ETH signals
    rising institutional confidence in Ethereum’s role as the leading platform for
    real-world asset tokenization.Related: Ethereum open interest hits new all-time
    high — Will ETH price follow?Ethereum’s bullish case also coincides with a sharp
    uptick in whale accumulation. The latest onchain data from Nansen shows that since
    March 12, 2024, addresses holding 1,000–10,000 ETH have grown their holdings by
    5.65%, while the 10,000–100,000 ETH cohort has risen by 28.73%. Ethereum whale
    holdings. Source: NansenThough addresses holding more than 100,000 ETH remain
    relatively stable, this accumulation trend underscores rising conviction among
    large investors.This article does not contain investment advice or recommendations.
    Every investment and trading move involves risk, and readers should conduct their
    own research when making a decision.\n\n            "

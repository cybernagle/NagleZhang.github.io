    5.23%. Overall, $1.6 trillion in value was wiped out from US stock at the market
    open. Bitcoin’s value dropped by 8%, but a positive is bulls seem capable of defending
    the $80,000 support level. These steep declines essentially stem from uncertainty
    surrounding the new tariffs and amplify investors’ concerns about impending recession.Source:
    XData from CoinGecko suggests that the total crypto market has dropped 6.8% over
    the past 24 hours and it seems unlikely that a relief rally is viable in the short-term.Related:
    Bitcoin price risks drop to $71K as Trump tariffs hurt US business outlookCrypto

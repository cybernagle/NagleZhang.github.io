- title: " Why is Bitcoin price stuck? "
  url: https://cointelegraph.com/news/why-is-bitcoin-price-stuck?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMDgvYWZjOGVjMDgtNDc2OC00MTdhLWEzNzEtYTQ2NDQyMzQ0ZWE4.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMDgvYWZjOGVjMDgtNDc2OC00MTdhLWEzNzEtYTQ2NDQyMzQ0ZWE4.jpg\"
    alt=\"Why is Bitcoin price stuck?\"></p><p>Bitcoin (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/bitcoin-price\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">BTC</a>) price has been consolidating within a roughly
    $5,500 range since March 9 as the $84,000 level represents stiff overhead resistance.<p>Data
    from <a data-ct-non-breakable=\"null\" href=\"https://subscription.cointelegraph.com/?_gl=1*7499wx*_ga*MTQ0MzQ0NzI4Ny4xNzE2MzY1NTA0*_ga_53R24TEEB1*MTcxNjM2NTUwNC4xLjEuMTcxNjM2Njg2MC4wLjAuMA..\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Cointelegraph Markets
    Pro</a> and Bitstamp shows BTC price oscillating between $78,599 and $84,000,
    as shown in the chart below.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195940c-a48f-731e-b0d0-86a03ef662d3\"
    title=\"\" alt=\"Why is Bitcoin price stuck?\"><figcaption style=\"text-align:
    center;\"><p><em>BTC/USD daily chart. Source: Cointelegraph/</em><a data-ct-non-breakable=\"null\"
    href=\"https://www.tradingview.com/x/I0QNGo3q/\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"https://www.tradingview.com/x/I0QNGo3q/\"><em>TradingView</em></a></p></figcaption></figure><p>Key
    reasons why Bitcoin price remains flat today include:</p><ul><li><p>Trump&rsquo;s
    trade war tensions causing uncertainty in the market.</p></li><li><p>Weakening
    demand for Bitcoin and neutral funding rates.</p></li><li><p>BTC price remains
    pinned below the 200-day SMA.</p></li></ul><h2><strong>Broader economic uncertainty,
    weakening demand</strong></h2><p>Bitcoin&rsquo;s price stagnation is partially
    due to the broader economic and geopolitical factors that are currently at play.&nbsp;</p><p>What
    to know:</p><ul><li><p><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/us-canada-tariff-bitcoin-miners\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Trump&rsquo;s new policies</a>,
    such as his <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-price-100k-fall-donald-trump-imposes-import-tariffs\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">proposed trade tariffs</a>
    on Mexico and Canada, have unnerved the market.</p></li><li><p>Investors, wary
    of inflation concerns and a potential tariff war, are avoiding risk assets like
    Bitcoin.</p></li><li><p>As Cointelegraph <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/crypto-trump-effect-short-lived\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">recently reported</a>,
    Bitcoin&rsquo;s rally post-Trump&rsquo;s November election has lost steam amid
    a weakening global economy.&nbsp;</p></li><li><p>This has resulted in weaker demand
    for Bitcoin, <a data-ct-non-breakable=\"null\" href=\"https://insights.glassnode.com/week-onchain-week-10-2025/\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://insights.glassnode.com/week-onchain-week-10-2025/\">according</a>
    to Glassnode.</p></li></ul><p>For instance, the cost basis of 1w&ndash;1m short-term
    holders flattened out above that of the longer-term holders (1m&ndash;3m) in Q1,
    &ldquo;marking an early sign of weakening demand in the immediate term.&rdquo;</p><p><em><strong>Related</strong></em><em>:
    </em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-price-drops-2-falling-inflation-us-trade-war-fears\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-price-drops-2-falling-inflation-us-trade-war-fears\"><em><strong>Bitcoin
    price drops 2% as falling inflation boosts US trade war fears</strong></em></a></p><p>Bitcoin&rsquo;s
    drop below the $95,000 level saw the 1w&ndash;1m cost basis slide below the 1m&ndash;3m
    cost basis, &ldquo;confirming a transition into net capital outflows.&rdquo;</p><p>Glassnode
    noted:</p><blockquote>&ldquo;This reversal indicates that macro uncertainty has
    spooked demand, reducing new inflows&hellip; and suggests that new buyers are
    now hesitant to absorb sell-side pressure, reinforcing the shift from post-ATH
    euphoria into a more cautious market environment.&rdquo;</blockquote><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/0195940c-aa26-796f-9f57-a2b736ba25d7\"
    title=\"\" alt=\"Why is Bitcoin price stuck?\"><figcaption style=\"text-align:
    center;\"><p><em>Bitcoin STH capital flow. Source: Glassnode</em></p></figcaption></figure><p>Until
    the current trend changes due to macroeconomic tailwinds, such as Fed rate cuts,
    Bitcoin could struggle to break out of the current range, leaving it vulnerable
    to <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/how-low-can-the-bitcoin-price-go\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">pullbacks toward $70,000</a>.</p><p>Another
    clear signal of Bitcoin&rsquo;s stagnation is in the perpetual futures funding
    rates. BTC funding rates, which reflect the cost of holding long or short positions
    in crypto futures, are hovering close to 0%, indicating increasing indecisiveness
    among traders.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01959455-f588-7f2a-8b06-e2d0a6ca5c18\"
    title=\"\" alt=\"Why is Bitcoin price stuck?\"><figcaption style=\"text-align:
    center;\"><p><em>Bitcoin perpetual futures funding rates across all exchanges.
    Source: Glassnode</em></p></figcaption></figure><p>Without speculative fuel, Bitcoin
    is struggling to move in either direction, leaving its price stuck in a tight
    range as traders wait for the next catalyst.</p><h2><strong>Bitcoin price faces
    stiff resistance on the upside</strong></h2><p>Bitcoin also trades below key resistance
    areas, as shown in the chart below:</p><ul><li><p>On March 9, BTC fell below the
    200-day simple moving average (SMA) at $83,736.</p></li><li><p>This trendline
    has stifled the latest efforts for a sustained recovery.</p></li></ul><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/0195940c-afb5-7047-bc41-f19522b855c0\"
    title=\"\" alt=\"Why is Bitcoin price stuck?\"><figcaption style=\"text-align:
    center;\"><p><em>BTC/USD daily chart. Source: Cointelegraph/</em><a data-ct-non-breakable=\"null\"
    href=\"https://www.tradingview.com/x/f4Pxm4PE/\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"https://www.tradingview.com/x/f4Pxm4PE/\"><em>TradingView</em></a></p></figcaption></figure><p>Popular
    crypto analyst Daan Crypto Trades says that the 200-day SMA at around $83,700
    and the 200-day EMA at $86,000 are key levels as they are &ldquo;solid indicators
    of the mid/long term trend and overall strength of the market.&rdquo;</p><p>In
    other words, failure to produce a decisive close above the 200-day SMA and flipping
    it into a new support level could lead to a longer consolidation period for Bitcoin
    price.</p><p class=\"post-content__disclaimer\" type=\"\">This article does not
    contain investment advice or recommendations. Every investment and trading move
    involves risk, and readers should conduct their own research when making a decision.</p><template
    data-name=\"subscription_form\" data-type=\"markets_outlook\" label=\"Subscription
    Form: Markets Outlook\"></template></p>\n</p>\n            "

- title: " Bitcoin inflows projected to reach $420B in 2026 — Bitwise "
  url: https://cointelegraph.com/news/bitcoin-inflows-projected-to-reach-420b-in-2026-bitwise?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "Key takeaways:Spot Bitcoin ETFs have already surpassed gold ETFs in early
    growth, with projections of $100 billion in annual inflows by 2027.Publicly listed
    companies and nation-states currently hold nearly 1.7 million BTC, pointing to
    long-term confidence.Bitwise projects $120 billion in Bitcoin inflows by 2025
    and $300 billion by 2026.Bitcoin (BTC) demand from a diverse range of investors
    — including publicly listed companies building Bitcoin treasuries, sovereign wealth
    funds, exchange-traded funds (ETFs), and nation-states — is projected to drive
    substantial capital inflows to the asset in the coming years. According to crypto
    index fund management firm Bitwise, inflows to Bitcoin could reach $120 billion
    by the end of 2025, with an additional $300 billion anticipated in 2026.In its
    recent report, “Forecasting Institutional Flows to Bitcoin in 2025/2026,” Bitwise
    highlights that US spot Bitcoin ETFs recorded $36.2 billion in net inflows in
    2024, surpassing the early success of SPDR gold Shares (GLD), which revolutionized
    gold investing. Bitcoin ETFs reached $125 billion in assets under management (AUM)
    within 12 months — 20 times faster than GLD — projecting Bitcoin to outperform
    gold significantly, with inflows potentially tripling to $100 billion annually
    by 2027.Spot Bitcoin and gold ETFs forecast projections. Source: BitwiseDespite
    this surge, $35 billion in Bitcoin demand remained sidelined in 2024 due to risk-averse
    compliance policies at major corporations like Morgan Stanley and Goldman Sachs,
    which manage $60 trillion in client assets. These firms require multi-year track
    records, but growing BTC ETF legitimacy is expected to unlock this capital.Jurrien
    Timmer, Director of Global Macro at Fidelity, remarked that Bitcoin trading above
    $100,000 signals its potential to take over gold’s role as a store of value. His
    analysis also pointed to the recent convergence of Bitcoin and gold’s Sharpe ratios,
    suggesting that both assets are becoming increasingly comparable in terms of risk-adjusted
    returns.Related: Bitcoin price ‘breather’ expected as short-term traders realize
    $11.6B in profitThe bull, bear and base cases for BTC wealth allocationIn addition
    to ETFs and wealth management firms, Bitcoin’s appeal as a reserve asset is rising
    among the public, private companies and sovereign nations. Companies with Bitcoin
    on the books currently hold around 1,146,128 BTC, worth $125 billion, accounting
    for 5.8% of BTC’s total supply. Sovereign nations collectively hold 529,705 BTC
    ($57.8 billion), with the United States (207,189 BTC), China (194,000 BTC), and
    the United Kingdom (61,000 BTC) leading the pack.Bitwise Senior investment strategist
    Juan Leon, UXTO research lead Guillaume Girard and research analyst Will Owens
    expect a continued wealth allocation to BTC, and outlined bear, base, and bull
    case scenarios.In the bear case, nation-states reallocated just 1% of their gold
    reserves to Bitcoin, driving $32.3 billion in inflows (323,000 BTC or 1.54% of
    supply). Multiple US states created BTC reserves at 10%, adding $6.5 billion,
    while wealth management platforms allocated 0.1% of assets ($60 billion). Public
    companies contributed another $58.9 billion, bringing the total inflows to over
    $150 billion.The base case envisions a 5% nation-state reallocation, generating
    $161.7 billion (1,617,000 BTC or 7.7% of supply). US states raised their adoption
    to 30% ($19.6 billion), wealth platforms allocated 0.5% ($300 billion), and public
    companies doubled their holdings to $117.8 billion. This scenario aligns with
    Bitwise’s forecast of $120 billion by 2025 and $300 billion by 2026, capturing
    20.32% of Bitcoin’s supply.In the bull case, a 10% nation-state swap of gold to
    Bitcoin drives $323.4 billion in inflows (3,234,000 BTC or 15.38% of supply).
    US state adoption rises to 70% ($45.8 billion), wealth platforms allocate 1% ($600
    billion), and public companies quadruple their holdings to $235.6 billion. Altogether,
    these inflows could exceed $426.9 billion, absorbing 4,269,000 BTC.The acceleration
    of institutional investor and government interest in BTC underscores growing confidence
    in Bitcoin’s long-term value. With 94.6% of its supply already mined (19,868,987
    BTC as of May 2025), Bitcoin is increasingly being viewed as a hedge against inflation
    and fiat currency debasement.Related: Will Bitcoin bulls secure $110K before BTC’s
    $13.8B options expiry?This article does not contain investment advice or recommendations.
    Every investment and trading move involves risk, and readers should conduct their
    own research when making a decision.\n\n            "

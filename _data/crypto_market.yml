- title: " Rare market volatility signal points to higher Bitcoin price in 6 to 12
    months — Dan Tapiero "
  url: https://cointelegraph.com/news/rare-market-volatility-signal-points-to-higher-bitcoin-price-in-6-to-12-months-dan-tapiero?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "On April 7, the CBOE Volatility Index (VIX) posted a rare spike to 60,
    a level seen as a barometer of extreme market fear and uncertainty. According
    to Dan Tapiero, CEO of 10Tfund, the VIX has hit 60 only five times in the last
    35 years, and data suggests a rebound for risk assets such as Bitcoin (BTC) in
    6 to 12 months. CBOE Volatility Index. Source: Cointelegraph/TradingViewThe VIX,
    which is widely considered a \"fear gauge,\" reflects investor expectations of
    market turbulence based on S&P 500 options trading. As illustrated in the chart,
    extreme spikes were seen in 2008 and 2020, typically coinciding with market bottoms,
    where panic-driven sellers paved the way for generational market entries. In light
    of that, Tapiero argued that the current spike is no different, with the worst
    of market fears likely \"priced in,\" setting the stage for a positive future.
    Tapiero said that “odds favor better future.”  Likewise, Julien Bittel, head of
    macro research at Global Macro Investor (GMI), supported Tapiero’s claim and said
    that tech stocks are at their most oversold since the COVID-19 crash, with over
    55% of Nasdaq 100 stocks posting a 14-day RSI below 30. Such a market signal has
    occurred only during major crises like the 2008 Lehman Brothers collapse and the
    2020 COVID-19 pandemic.American Association of Individual Investors survey. Source:
    X.comBittel explained that after the VIX touched 60 last week, it implied peak
    uncertainty, which breeds fear in investors’ minds. Briefly touching on the US
    Investors Intelligence Survey, Bittel compared the current bullish sentiment of
    23.6% to the lowest reading since December 2008. Additionally, the American Association
    of Individual Investors (AAII) survey respondents are currently 62% bearish, reflecting
    the highest bearish reading since March 2009. Bittel said,“In other words, we’re
    back at the same levels of fear that marked the bottom of the equity market after
    the Global Financial Crisis.”This widespread fear, alongside a rare VIX spike,
    sets up for market entries in assets like Bitcoin, as the recovery of market liquidity
    will inevitably flow back into risk-on assets. Related: Saylor, ETF investors’
    ‘stronger hands’ help stabilize Bitcoin — AnalystAnalyst warns Bitcoin VIX trends
    are bearishWhile macroeconomic experts highlighted the possibility of a bullish
    outcome for risk assets, markets analyst Tony Severino suggested that the Bitcoin/VIX
    ratio might also lead to a bear market. In a recent X post, Severino predicted
    that Bitcoin could have already peaked this cycle, but remained open about a possible
    change in opinion by the end of April. Bitcoin VIX analysis by Tony Severino.
    Source: X.comAs illustrated in the chart, Severino noted a sell signal at the
    beginning of January. The analyst used the Elliott Wave theory model to pinpoint
    the current bearish conditions and said that it is still early to say that Bitcoin
    will turn bullish based on the VIX correlation. Related: Bitcoin price volatility
    'imminent' as speculators move 170K BTC — CryptoQuantThis article does not contain
    investment advice or recommendations. Every investment and trading move involves
    risk, and readers should conduct their own research when making a decision.\n\n
    \           "

- title: " Crypto regulation shifts as Bitcoin eyes $105K amid liquidity boost "
  url: https://cointelegraph.com/news/crypto-regulation-shifts-as-bitcoin-eyes-105-k-amid-liquidity-boost?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NThmZjMtYTY4My03OTA4LWI3ZWItNDVjYzcyMDEzNTJm.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NThmZjMtYTY4My03OTA4LWI3ZWItNDVjYzcyMDEzNTJm.jpg\"
    alt=\"Crypto regulation shifts as Bitcoin eyes $105K amid liquidity boost\"></p><p>Bitcoin
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>) price has risen
    8% from its March 11 low of $76,703, driven in part by large investors aggressively
    buying the dip with leverage. <p>Margin longs on Bitfinex surged to their highest
    level since November 2024, adding 13,787 BTC over 17 days. Currently standing
    at $5.7 billion, this bullish leveraged positioning signals confidence in Bitcoin&rsquo;s
    upside potential despite recent price weakness.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958fe9-5d73-7e3d-85e0-19ad67aa12d0\"
    title=\"\" alt=\"Crypto regulation shifts as Bitcoin eyes $105K amid liquidity
    boost\"><figcaption style=\"text-align: center;\"><p><em>Bitcoin/USD (orange,
    left) vs. Bitfinex BTC margin longs (right). Source: TradingView / Cointelegraph</em></p></figcaption></figure><p>Some
    analysts argue that Bitcoin&rsquo;s price is closely linked to the global monetary
    base, meaning it tends to rise as central banks inject liquidity. </p><p>With
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/investors-skitter-off-risk-assets-jpmorgan-raises-recession-chances\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">recession risks</a>
    mounting, the likelihood of expansionary monetary policies increasing the money
    supply grows. If this correlation holds, Bitfinex whales could be well-positioned
    to capitalize on a rally above $105,000 in the next two months.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958fe9-643a-7365-8b7f-58e794c8bb8d\"
    title=\"\" alt=\"Crypto regulation shifts as Bitcoin eyes $105K amid liquidity
    boost\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/pakpakchicken/status/1899716858628149642\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"https://x.com/pakpakchicken/status/1899716858628149642\"><em>pakpakchicken</em></a></p></figcaption></figure><p>For
    instance, X user Pakpakchicken claims to have identified an 82% correlation between
    the global money supply (M2) and Bitcoin&rsquo;s price. </p><p>When central banks
    drain liquidity by raising interest rates or reducing bond holdings, traders become
    more risk-averse, leading to weaker demand for Bitcoin. Conversely, periods of
    monetary easing tend to fuel greater investor interest in the asset, increasing
    its price potential.</p><h2><strong>Bitfinex whales go long BTC as M2 bottoms</strong></h2><p>In
    early September 2024, Bitfinex margin traders added 7,840 BTC in long positions,
    coinciding with a period of bearish momentum as Bitcoin struggled to reclaim the
    $50,000 level for over three months. </p><p>Despite the downturn, Bitfinex whales
    held their positions, and Bitcoin&rsquo;s price surged past $75,000 less than
    two months later. Notably, the global M2 money supply bottomed out around the
    same time these traders increased their Bitcoin exposure, further reinforcing
    the correlation.</p><p>It may be impossible to establish a direct cause-and-effect
    relationship between money supply and investors&rsquo; willingness to accumulate
    Bitcoin, especially given the influence of major events during these periods.
    </p><p>For example, Donald Trump&rsquo;s election as US president in November
    2024 significantly fueled Bitcoin&rsquo;s rally due to the new administration&rsquo;s
    pro-crypto stance, regardless of global M2 trends and liquidity conditions.</p><figure><img
    alt=\"Crypto regulation shifts as Bitcoin eyes $105K amid liquidity boost\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195900c-01b5-73dd-b44d-ee550c5f6b01\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Spot Bitcoin ETF net
    flows, USD. Source: CoinGlass</em></p></figcaption></figure><p>Similarly, Michael
    Saylor&rsquo;s latest plan to<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/michael-saylor-strategy-raise-21-billion-purchase-bitcoin\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"> raise up to $21 billion</a>
    in fresh capital for Strategy to acquire more Bitcoin could shift market dynamics,
    even accounting for the $4.1 billion in net outflows from Bitcoin spot exchange-traded
    funds (ETFs) since Feb. 24. </p><p>Strategy remains the largest corporate Bitcoin
    holder, with 499,096 BTC acquired at a total cost of $33.1 billion, reinforcing
    its long-term bullish strategy.</p><h2><strong>Clearer crypto regulation, Strategy
    capital increase</strong></h2><p>In essence, the expansion of the global money
    supply may have influenced the increase in Bitfinex margin longs, but Bitcoin&rsquo;s
    push toward $105,000 could be primarily driven by industry-specific news and events.
    </p><p>A Wall Street Journal report on March 13 revealed that representatives
    of Donald Trump have held discussions about potentially <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/trump-family-had-talks-for-stake-in-binance-crypto-exchange-report\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">acquiring a stake</a>
    in Binance.</p><p><em><strong>Related: </strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-etfs-break-outflow-streak-13m-inflow\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>US Bitcoin
    ETFs break outflow streak with $13.3M inflow</strong></em></a></p><p>So far, the
    market impact of a more crypto-friendly US government has yet to yield concrete
    benefits. </p><p>For example, the Office of the Comptroller of the Currency (OCC)
    has not yet clarified whether banks can <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/occ-crypto-banking-donald-trump-ends-operation-chokepoint-2-0\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">custody digital assets</a>
    and manage stablecoins without prior approval. </p><p>Similarly, Acting SEC Chairman
    Mark Uyeda announced plans to remove <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/sec-looking-abandon-requiring-crypto-firms-register-exchanges\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">crypto-specific provisions</a>
    from a proposed rule that would expand exchange definitions.</p><p>The US Securities
    and Exchange Commission is currently reviewing requests from spot Bitcoin ETF
    issuers to permit in-kind creations and redemptions, allowing shares to be exchanged
    directly for Bitcoin instead of using the traditional cash-based method.</p><p>Meanwhile,
    global <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/investors-skitter-off-risk-assets-jpmorgan-raises-recession-chances\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/investors-skitter-off-risk-assets-jpmorgan-raises-recession-chances\">macroeconomic
    conditions have deteriorated</a>, putting pressure on Bitcoin&rsquo;s price. However,
    these same factors gradually push governments toward economic stimulus measures
    and expand the M2 money supply.</p><p>If this trend continues, it should ultimately
    create conditions for Bitcoin's price to meet Pakpakchicken&rsquo;s $105,000 prediction
    by May 2025 and possibly go even higher.</p><p class=\"post-content__disclaimer\"
    type=\"\">This article is for general information purposes and is not intended
    to be and should not be taken as legal or investment advice. The views, thoughts,
    and opinions expressed here are the author&rsquo;s alone and do not necessarily
    reflect or represent the views and opinions of Cointelegraph.</p><template data-name=\"subscription_form\"
    data-type=\"markets_outlook\" label=\"Subscription Form: Markets Outlook\"></template></p>\n</p>\n

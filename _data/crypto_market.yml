- title: " Bitcoin price soars to $83.5K — Have pro BTC traders turned bullish? "
  url: https://cointelegraph.com/news/bitcoin-price-soars-to-83-5-k-have-pro-btc-traders-turned-bullish?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "US equities and crypto markets shifted dramatically on April 9 after US
    President Donald Trump announced a 90-day pause on his reciprocal tariffs, except
    for China. Bitcoin (BTC) price responded by surging by 5% in less than an hour,
    reclaiming the $83,000 level which was last seen on April 6.While the S&P 500
    gained 8%, Bitcoin derivative metrics have yet to turn bullish as traders remain
    cautious about changes in US long-term government bonds.Bitcoin 2-month futures
    annualized premium. Source: Laevitas.chThe BTC futures premium briefly rose above
    the neutral 5% threshold but failed to sustain its momentum. Investors were skeptical
    about whether the US Federal Reserve would lower interest rates throughout the
    year. However, this indicator has moved away from the 3% level observed on March
    31, signaling growing confidence among Bitcoin bulls after several failed attempts
    to push prices below $76,000.Bitcoin traders worry after 10-year yield volatilityTraders’
    hesitancy can partly be attributed to the April 9 release of minutes from the
    Federal Reserve Committee (FOMC) meeting held on March 18-19. The minutes highlighted
    concerns about stagflation. According to CME FEDWatch Tool data, the probability
    of the Federal Reserve reducing interest rates below 4% by Sept. 17 dropped from
    97.6% on April 8 to 69.7% on April 9.Traders are worried about the implications
    of a weakened 10-year US Treasury yield. This decline reflects reduced confidence
    in the government’s ability to manage its growing debt. Economist Peter Boockvar,
    editor of The Boock Report, explained to Yahoo Finance: “We can draw a line at
    around the 4.40% level in the 10-year yield.” He added that investors fear “foreigners
    will continue to reduce their holdings of US Treasurys.”US 10-year Treasury yield.
    Source: TradingView / CointelegraphWhen bond yields rise, it indicates that buyers
    are demanding higher returns from the US government. As a result, the cost of
    rolling over debt increases, potentially creating a negative cycle that weakens
    the US dollar. This uncertainty in the macroeconomic environment has also been
    reflected in Bitcoin options markets.Bitcoin derivatives signal a lack of conviction
    from bullsWhen traders anticipate a market correction, put (sell) options typically
    trade at a premium, pushing the 25% delta skew (put-call) metric above 6%. On
    the other hand, during bullish periods, this indicator usually drops below -6%.Bitcoin
    1-month options 25% delta skew (put-call). Source: Laevitas.chOn April 9, the
    Bitcoin options delta skew peaked at 12% after China announced higher tariffs
    in retaliation. However, this trend reversed completely following President Trump’s
    announcement of a tariff pause, with the indicator returning to a neutral 3%.
    This shift suggests that options markets are now pricing equal probabilities for
    upward and downward price movements, marking the end of a bearish phase that began
    on March 29.Related: US Dollar Index (DXY) falls close to level that was followed
    by 500%+ Bitcoin price ralliesTo determine whether this lack of bullish sentiment
    is limited to monthly futures and options markets, one can examine leverage demand
    in perpetual futures (inverse swaps). These contracts closely follow spot prices
    but rely on an 8-hour funding fee. In neutral markets, this funding rate typically
    ranges between 0.4% and 1.4% over a 30-day period.Bitcoin perpetual futures 8-hour
    funding rate. Source: Laevitas.chOn April 9, the 30-day Bitcoin futures funding
    rate rose to 0.9%, its highest level in over six weeks. This increase likely reflects
    retail buyers entering the market but remains within the neutral range. This consistency
    across BTC derivatives metrics suggests that the tariff pause was insufficient
    to restore confidence, especially as tensions in the trade war with China persist.It
    remains unclear what will drive Bitcoin traders to adopt a bullish stance, but
    reduced macroeconomic uncertainty — such as a decline in the US 10-year Treasury
    yield — will likely play a critical role.This article is for general information
    purposes and is not intended to be and should not be taken as legal or investment
    advice. The views, thoughts, and opinions expressed here are the author’s alone
    and do not necessarily reflect or represent the views and opinions of Cointelegraph.\n\n
    \           "
  published: 2025-04-09 22:20:38.000000000 +01:00
- title: " Bitcoin $100K target ‘back on table’ after Trump tariff pause supercharges
    market sentiment "
  url: https://cointelegraph.com/news/bitcoin-100-k-target-back-on-table-after-trump-tariff-pause-supercharges-market-sentiment?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "Bitcoin (BTC) staged a sharp rebound after US President Donald Trump announced
    a pause on tariffs for non-retaliating countries, reigniting bullish momentum
    and raising hopes for a potential surge toward the $100,000 mark.On April 9, BTC/USD
    surged by approximately 9%, reversing most of the losses it incurred earlier in
    the week, to retest $83,000. In doing so, the pair came closer to validating a
    falling wedge pattern that has been forming on its daily chart since December
    2024. A falling wedge pattern forms when the price trends lower inside a range
    defined by two converging, descending trendlines. In a perfect scenario, the setup
    resolves when the price breaks decisively above the upper trendline and rises
    by as much as the maximum distance between the upper and lower trendlines.BTC/USD
    daily price chart ft. falling wedge breakout setup. Source: TradingViewAs of April
    9, Bitcoin’s price was confined within the falling wedge range while eyeing a
    breakout above its upper trendline at around $83,000. If it is confirmed, BTC’s
    main upside target by June could be around $100,000.Conversely, a rejection from
    the upper trendline could raise the likelihood of Bitcoin retreating deeper within
    the wedge pattern, potentially sliding toward the apex near $71,100.Source: Merlijn
    The TraderIf a breakout occurs after testing the $71,100 level, the most conservative
    upside target for BTC could still be as high as $91,500.Onchain data supports
    $100,000 Bitcoin outlookBitcoin’s rebound appears just before testing a critical
    onchain support zone between $65,000 and $71,000, reinforcing the cryptocurrency’s
    bullish outlook toward the 100,000 mark. Notably, the $65,000-71,000 range is
    based on two important Bitcoin metrics—active realized price ($71,000) and the
    true market mean ($65,000). Bitcoin short-term onchain cost basis bands. Source:
    GlassnodeThese metrics estimate the average price at which current, active investors
    bought their Bitcoin. They filter out coins that haven't moved in a long time
    or are likely lost, giving a relatively accurate picture of the cost basis for
    those still participating in the market.In the past, Bitcoin has spent about half
    the time trading above this price range and half below, making it a good indicator
    of whether the market is feeling positive or negative, according to Glassnode
    analysts. “We now have confluence across several onchain price models, highlighting
    the $65k to $71k price range as a critical area of interest for the bulls to establish
    long-term support,” they wrote in a recent weekly analysis, adding: “Should price
    trade meaningfully below this range, a super-majority of active investors would
    be underwater on their holdings, with likely negative impacts on aggregate sentiment
    to follow.”Related: Bitcoin has 'fully decoupled' despite tariff turmoil, says
    Adam BackBitcoin’s worst-case scenario is a decline toward $50,000Breaking below
    the $65,000-$71,000 range could worsen Bitcoin’s probability of retesting $100,000
    anytime soon. Such declines would also lead to the price breaking below its 50-week
    exponential moving average (50-week EMA; the red wave).BTC/USD weekly price chart.
    Source: TradingViewThe 50-week EMA — near $77,760 as of April 9 — has historically
    acted as a dynamic support during bull markets and a resistance during bear markets,
    making it a crucial trend-defining level. Losing this support could open the door
    for a steeper pullback toward the 200-week EMA (the blue wave) at around $50,000.
    Previous breakdowns below the 50-week EMA have resulted in similar declines, namely
    during the 2021-2022 and 2019-2020 bear cycles.A rebound, on the other hand, raises
    the likelihood of a $100,000 retest.This article does not contain investment advice
    or recommendations. Every investment and trading move involves risk, and readers
    should conduct their own research when making a decision.\n\n            "

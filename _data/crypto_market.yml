- title: " Bitcoin-to-gold ratio breaks 12-year support as gold price hits a record
    $3K "
  url: https://cointelegraph.com/news/bitcoin-gold-price-12-year-support-record-3k?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMTEvMDE5MzM0OGYtMzM1ZS03NWJjLTlmY2YtNjBlNDMyMWFmODkz.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMTEvMDE5MzM0OGYtMzM1ZS03NWJjLTlmY2YtNjBlNDMyMWFmODkz.jpg\"
    alt=\"Bitcoin-to-gold ratio breaks 12-year support as gold price hits a record
    $3K\"></p><p>Bitcoin (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/bitcoin-price\">BTC</a>)
    breached a rising support trendline against gold (XAU), which has been intact
    for over 12 years, on March 14. <figure><img alt=\"Bitcoin-to-gold ratio breaks
    12-year support as gold price hits a record $3K\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195944d-400f-769a-a422-163f5f29064c\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>XAU/BTC ratio weekly
    performance chart. Source: TradingView/NorthStar</em></p></figcaption></figure><p>Popular
    analyst NorthStar&nbsp;<a data-ct-non-breakable=\"null\" href=\"https://x.com/NorthstarCharts/status/1900211909850239056\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://x.com/NorthstarCharts/status/1900211909850239056\">says</a>
    this breakdown could spell the end of Bitcoin&rsquo;s 12-year bull run if it stays
    under the gold trendline for even a week or&mdash;worse&mdash;a month. </p><p>Is
    Bitcoin&rsquo;s bull market over? Let&rsquo;s take a closer look at BTC&rsquo;s
    correlation with gold. </p><h2>Gold hits new record high as Bitcoin&rsquo;s uptrend
    cools</h2><p>The BTC/XAU ratio breakdown occurred as spot gold rates hit a new
    record high above $3,000 per ounce on March 14, after rising by about 12.80% year-to-date.
    </p><p>In contrast, Bitcoin, which is often called &ldquo;<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/explained/trumps-strategic-bitcoin-reserve-and-digital-asset-stockpile-explained\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/explained/trumps-strategic-bitcoin-reserve-and-digital-asset-stockpile-explained\">digital
    gold</a>,&rdquo; has dropped by 11% so far in 2025.</p><figure><img alt=\"Bitcoin-to-gold
    ratio breaks 12-year support as gold price hits a record $3K\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195945b-1bb8-7c4f-a57e-2a715bb01692\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>BTC/USD vs. XAU/USD
    YTD performance chart. Source: TradingView</em></p></figcaption></figure><p>The
    performances reflect the contrasting net flows into US-based spot exchange-traded
    funds (ETF) tracking Bitcoin and gold.</p><p>For instance, as of March 14, the
    US-based spot gold ETFs had collectively attracted over $6.48 billion YTD, according
    to data resource <a data-ct-non-breakable=\"null\" href=\"https://www.gold.org/goldhub\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://www.gold.org/goldhub\">World
    Gold Council</a>. Globally, gold ETFs have seen $23.18 billion in inflows.</p><figure><img
    alt=\"Bitcoin-to-gold ratio breaks 12-year support as gold price hits a record
    $3K\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01959460-4e34-7b34-a84e-cfe01c0ff9d0\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Gold ETFs weekly holdings
    by region. Source: GoldHub.com</em></p></figcaption></figure><p>On the other hand,
    US-based spot <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-etfs-break-outflow-streak-13m-inflow\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-etfs-break-outflow-streak-13m-inflow\">Bitcoin
    ETFs</a> saw nearly $1.46 billion in outflows YTD, according to onchain data platform
    Glassnode. </p><figure><img alt=\"Gold, Bitcoin Price, Bitcoin Analysis, Markets,
    Market Analysis, Bitcoin ETF\" src=\"https://s3.cointelegraph.com/uploads/2025-03/019594c6-24da-7447-849a-eaf6ca5157ff\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>US Bitcoin ETFs year-to-date
    net flows. Source: Glassnode </em></p></figcaption></figure><p>The driving force
    behind this divergence lies in growing macroeconomic uncertainty and <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-no-longer-safe-haven-82k-btc-price-dive-gold-top\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-no-longer-safe-haven-82k-btc-price-dive-gold-top\">risk-off
    sentiment</a>, exacerbated by President Donald Trump&rsquo;s <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-price-drops-2-falling-inflation-us-trade-war-fears\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-price-drops-2-falling-inflation-us-trade-war-fears\">aggressive
    trade policies</a>. </p><p><em><strong>Related: </strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-panic-selling-speculators-100-m-6-weeks-research\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-panic-selling-speculators-100-m-6-weeks-research\"><em><strong>Bitcoin
    panic selling costs new investors $100M in 6 weeks &mdash; Research</strong></em></a></p><p><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/us-canada-tariff-bitcoin-miners\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/us-canada-tariff-bitcoin-miners\">New
    tariffs</a> on China, Mexico, and Canada have heightened fears of a global economic
    slowdown, pushing investors toward traditional safe-haven assets like gold. </p><p>Meanwhile,
    central banks, including those in the US, China, and the UK, have accelerated
    their gold purchases, further boosting gold prices. </p><figure><img alt=\"Bitcoin-to-gold
    ratio breaks 12-year support as gold price hits a record $3K\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01959466-1830-76d5-ada0-87676eade5bd\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Countries that acquired
    the most gold so far in 2025. Source: GoldHub.com</em></p></figcaption></figure><p>In
    contrast, Bitcoin is mirroring the broader risk-on market. As of March 14, its
    52-week correlation coefficient with the Nasdaq Composite index was 0.76.</p><figure><img
    alt=\"Bitcoin-to-gold ratio breaks 12-year support as gold price hits a record
    $3K\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195946a-74cc-7583-825c-639e4fe1c968\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>BTC/USD vs. Nasdaq
    Composite 52-week correlation coefficient chart. Source: TradingView</em></p></figcaption></figure><h2>Has
    Bitcoin price topped?</h2><p>The <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/is-bitcoin-topping-out-gold-fractal-btc-price-correction\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/is-bitcoin-topping-out-gold-fractal-btc-price-correction\">current
    Bitcoin-to-gold breakdown</a> aligns with historical patterns, particularly the
    March 2021&ndash;March 2022 fractal, which preceded the last bear market.</p><p>At
    that time, the BTC/XAU ratio exhibited a bearish divergence, characterized by
    rising prices juxtaposed against a declining relative strength index (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/here-s-3-ways-the-relative-strength-index-rsi-can-be-used-as-a-sell-signal\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/here-s-3-ways-the-relative-strength-index-rsi-can-be-used-as-a-sell-signal\">RSI</a>).
    This pattern suggested diminishing upward momentum.</p><figure><img alt=\"Bitcoin-to-gold
    ratio breaks 12-year support as gold price hits a record $3K\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195946d-9fb2-715d-8b8b-53db62dec809\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>BTC/XAU ratio two-week
    performance chart. Source: TradingView</em></p></figcaption></figure><p>Consequently,
    the ratio initially retreated toward the 50-period, two-week exponential moving
    average (EMA) support level before ultimately plummeting by 60%.</p><p>That BTC/XAU
    breakdown period coincided with Bitcoin&rsquo;s 68% correction against the US
    dollar.</p><figure><img alt=\"Bitcoin-to-gold ratio breaks 12-year support as
    gold price hits a record $3K\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01959471-00ea-7590-b8f1-d06e115e501f\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>BTC/USD two-week performance
    chart. Source: TradingView</em></p></figcaption></figure><p>BTC/XAU has once again
    completed a two-phase EMA retest, echoing the 2021&ndash;2022 fractal. </p><figure><img
    alt=\"Bitcoin-to-gold ratio breaks 12-year support as gold price hits a record
    $3K\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01959472-2994-7b56-9f99-f1da4827a480\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>BTC/USD two-week performance
    chart (zoomed). Source: TradingView</em></p></figcaption></figure><p>With the
    RSI showing bearish divergence, momentum appears to be fading, increasing the
    probability of further declines, especially if the ratio drops decisively below
    the 50-2W EMA support (~26 XAU).</p><p>As a result, it could also indicate Bitcoin&rsquo;s
    increased vulnerability to price declines in dollar terms, with the 50-2W EMA
    below $65,000 acting as the next potential downside target.</p><figure><img alt=\"Bitcoin-to-gold
    ratio breaks 12-year support as gold price hits a record $3K\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01959483-4d2f-77b6-a77c-7cc88d839581\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>BTC/USD 2W price performance
    chart. Source: TradingView</em></p></figcaption></figure><p>That is down about
    40% from Bitcoin&rsquo;s record high of around $110,000 established in January.
    </p><p>Still, Nansen analysts <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-70k-retracement-bull-market-analysts\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-70k-retracement-bull-market-analysts\">consider</a>
    such a decline as a &ldquo;correction within a bull market,&rdquo; raising possibilities
    of a bullish&nbsp;revival if the 50-2W EMA holds as support. However, a definitive
    break below the EMA could thrust Bitcoin into bear market territory. </p><p>That
    could drag Bitcoin&rsquo;s 2025 downside target toward the 200-period two-week
    EMA (the blue wave) to as low as $34,850 if this Bitcoin-gold fractal repeats.
    </p><p class=\"post-content__disclaimer\" type=\"\">This article does not contain
    investment advice or recommendations. Every investment and trading move involves
    risk, and readers should conduct their own research when making a decision.</p><template
    data-name=\"subscription_form\" data-type=\"markets_outlook\" label=\"Subscription
    Form: Markets Outlook\"></template></p>\n</p>\n            "

- title: " Bitcoin selling at $95K is ‘profit-taking pressure test’ but BTC whales
    are still buying "
  url: https://cointelegraph.com/news/bitcoin-selling-at-95-k-is-profit-taking-pressure-test-but-btc-whales-are-still-buying?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "Key Takeaways:US GDP shrank -0.3% in Q1, far below +0.3% forecasts, sparking
    recession fears.Bitcoin faces selling pressure with its spot volume delta dropping
    $300 million in 3 days.Whales are accumulating BTC, but smaller holders are selling,
    hinting at profit-taking.Bitcoin’s (BTC) price dropped under $93,000 on April
    30, after the US Gross Domestic Product (GDP) data revealed a -0.3% contraction
    in Q1. While the GDP missed expectations of +0.3%, the GDP Price Index soared
    to 3.7%—the highest since August 2023. Polymarket odds of a recession in 2025
    hit 67%, with consumer confidence at its lowest since May 2020.Quarterly US GDP
    growth data. Source: X.comMeanwhile, in March 2025, PCE (Personal Consumption
    Expenditures) inflation fell to 2.3% (above the expected 2.2%), and Core PCE dropped
    to 2.6% (in line with expectations). Still, February’s Core PCE was revised from
    2.8% to 3.0%, signaling mixed inflation trends.Short-term bearish, long-term bullish
    for Bitcoin?During the 2020 COVID-19-induced market crash, BTC initially followed
    traditional markets before rallying over 300% by year-end as the global M2 money
    supply increased, reflecting its appeal during periods of monetary expansion.
    However, stagflation, highlighted by the -0.3% GDP contraction in Q1 2025 and
    a 3.7% GDP Price Index, pose short-term risks. Cointelegraph noted that high inflation
    often deters retail crypto investment, as seen in 2022 when BTC fell 60% amid
    Federal Reserve interest rate hikes. The March 2025 PCE inflation data suggests
    cooling pressures that could ease Fed rate hike fears and support Bitcoin. On
    the other hand, February’s upward revisions (headline PCE from 2.5% to 2.7%, Core
    PCE to 3.0%) signal persistent inflation, keeping the Fed’s next moves uncertain.
    While fear of stagflation may pressure BTC in the short term, its long-term hedge
    potential remains valid. Related: Bitcoin macro indicator that predicted 2022
    bottom flashes 'buy signal'Bitcoin sees $300 million in spot selling pressureBitcoin’s
    spot volume delta dipped over $300 million over the past three days, increasing
    potential sell-off pressure for BTC around the $95,000 level. Data from Glassnode
    indicates the 7-day moving average of BTC spot volume delta recorded negative
    flows over consecutive days. The negative inflows progressively increased with
    a minor $16 million flush on April 26, followed by $30.9 million on April 27,
    $76.1 million on April 28, and $193.4 million on April 29.Bitcoin Spot volume
    delta chart. Source: GlassnodeThis sharp decline signals aggressive selling and
    weakening spot demand, a signal to profit-taking or a potential short-term trend
    reversal. Despite the sell-off, the analytics platform noted that accumulation
    trends among Bitcoin holders paint a more nuanced picture. Whales holding over
    10,000 BTC remain in an accumulation mode, with a trend score near 0.95. However,
    smaller holders show signs of distribution. The 10–100 BTC group is trending toward
    0.6, while those with 1–10 BTC (0.3) and less than 1 BTC (0.2) are net sellers. This
    top-down accumulation suggests the current selling pressure stems from short-term
    holders potentially taking profit around the $95,000 level. Termed as a “profit-taking
    pressure test” for BTC, the current market is at a key decision point, where profit-taking
    is a pivotal metric to monitor. BTC: realized profit data. Source: GlassnodeLast
    week, the total realized profit on an hourly chart surged to $139.9M/hour, roughly
    17% above its $120M/hour baseline. With the current spot delta outflows, the realized
    profit may hit new highs this week. Related: Bitcoin traders predict BTC price
    gains ahead of $96K liquidity clashThis article does not contain investment advice
    or recommendations. Every investment and trading move involves risk, and readers
    should conduct their own research when making a decision.\n\n            "
  published: 2025-04-30 18:51:37.000000000 +01:00
- title: " Bitcoin macro indicator that predicted 2022 bottom flashes &#039;buy signal&#039; "
  url: https://cointelegraph.com/news/bitcoin-macro-indicator-predicted-2022-bottom-flashes-buy?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "Key takeaways:Macro Chain Index issues first buy signal since 2022, hinting
    at a new Bitcoin bull run.RSI crossover on the MCI aligns with past cycle bottoms
    that preceded 500%+ BTC rallies.Bitcoin price recovers from $74K to $95K amid
    rising open interest and positive funding rates.A key Bitcoin (BTC) indicator
    that accurately signaled the 2022 market bottom has just flashed another buy signal,
    suggesting the cryptocurrency may be entering a new bull phase.Bitcoin metric
    hints at “absolute bottom”Dubbed the Macro Chain Index (MCI), the indicator is
    a composite of several long-term on-chain and macroeconomic metrics. It analyzes
    factors such as accumulation behavior, network activity, and supply trends, helping
    identify whether Bitcoin is undervalued or overvalued relative to its historical
    cycle position.The most important part of the current chart is the RSI (Relative
    Strength Index) of the MCI (purple). In April, the RSI crossed above its 52-week
    moving average (yellow), which has historically confirmed the start of Bitcoin
    bull runs.Bitcoin macro chain index. Source: Alpha ExtractThis RSI crossover previously
    appeared in 2015 ahead of Bitcoin’s surge to $20,000, in 2019 before the run to
    $65,000, and in late 2022 just before BTC bottomed near $15,500.If historical
    patterns hold, the April 2025 crossover means the beginning of a new bull run,
    particularly as several other indicators also point to Bitcoin breaking above
    its key psychological resistance at $100,000.“Our Macro Chain Index fired a long
    signal, the first buy signal since 2022, when it successfully went long at the
    absolute bottom,” Alpha Extract, the creator of the Macro Chain Index, stressed
    further, adding: “Considering that the fundamentals align and the market structure
    is gradually following, this is a significant call, imho.”Related: Bitcoin price
    always rallies at least 50% after these two patterns emergeBitcoin dipped by as
    much as 32% after establishing a record high of nearly $110,000 in January, a
    sharp decline caused primarily by US President Donald Trump’s global trade war.
    BTC/USD weekly price chart. Source: TradingViewBTC formed a local low below $74,450
    in early April, but has since recovered to around $95,650 amid signs that it is
    “decoupling” from an otherwise bearish US stock market.Bitcoin open interest rises
    by $2.2 billion in AprilBitcoin’s recent price rebound is gaining strong support
    from futures markets, especially on Binance.Between January and early April, open
    interest (OI) on the exchange dropped from $11.9 billion to $7.5 billion, marking
    a 36.9% decline and signaling reduced confidence and lower leverage during the
    market downturn. But the trend flipped in mid-April.Over the past three weeks,
    traders have pushed open interest up by 29.3%, from $7.5 billion to $9.7 billion,
    aligning with Bitcoin’s price rise in spot markets.Bitcoin open interest (Binance)
    daily chart. Source: CryptoQuantThis synchronized rise in price and open interest
    shows that traders are entering new long positions, not just closing shorts. It
    signals growing confidence in Bitcoin’s upside.Funding rates have also stayed
    mostly positive, which means long-position holders are paying short sellers, a
    typical sign that the market expects higher prices.Bitcoin funding rates. Source:
    CryptoQuantThe rising open interest and positive funding rates are showing renewed
    bullish momentum, adding weight to the argument that Bitcoin could continue climbing
    toward $100,000 in the coming days.This article does not contain investment advice
    or recommendations. Every investment and trading move involves risk, and readers
    should conduct their own research when making a decision.\n\n            "
  published: 2025-04-30 13:15:00.000000000 +01:00
- title: " Is Bitcoin price going to crash again? "
  url: https://cointelegraph.com/news/is-bitcoin-price-going-to-crash-again?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "Key takeaways:Bitcoin's 28% rebound from $75,000 faces resistance at $95,000,
    risking a bull trap.Strong spot price momentum and ETF inflows support a potential
    $100,000 push.Bull flag pattern suggests a $108,300 target if BTC breaks the $95,000
    resistance.Bitcoin (BTC) price has rebounded by 28% from its five-month low below
    $75,000 reached on April 9. However, its failure to break above the $95,000 resistance
    level decisively has sparked concerns that the latest recovery may trap bulls.BTC/USD
    daily price chart. Source: Cointelegraph/TradingViewBitcoin ETF flows provide
    a “more solid foundation”But another big crash may be averted as BTC price momentum
    is backed by elevated spot Bitcoin ETF inflows in recent days. This provides Bitcoin
    a “more solid foundation” to surge forward, according to market intelligence firm
    Glassnode.As Bitcoin edged above $95,000, its 14-day price momentum indicator
    rose sharply from 58.7 to 82.1, as shown in the chart below.“This breakout pushed
    the momentum above the statistical high band, a rare occurrence that historically
    signals strong bullish momentum,” Glassnode said in its latest Weekly Market Pulse
    report. This indicator last crossed the statistical high band in November 2024,
    preceding a 61% rally in Bitcoin’s price to new all-time highs.Bitcoin price momentum
    indicator. Source: GlassnodeGlassnode, however, warns that such high momentum
    also increases the likelihood of short-term cooling periods, explaining BTC’s
    current choppy price action.The onchain data provider added:“Sustained strength
    will require spot volume and demand to remain positive.”Meanwhile, Bitcoin’s spot
    Cumulative Volume Delta (CVD) metric, which tracks the difference between taker
    buyers and sellers, remains close to the statistical high band despite a modest
    pullback over the last few days.The high CVD metric suggests that the buy pressure
    is “still relatively strong,” Glassnode said, adding:“This persistent positive
    aggression supports the bullish momentum seen in spot markets, although the slight
    softening hints that some profit-taking activity may be emerging as the price
    extends into higher ranges.”Bitcoin spot CVD. Source: GlassnodeBullish signs are
    also emerging with the Hot supply rising higher and profitability metrics such
    as supply in profit (currently at 86%) expanding significantly. This signals a
    change in market sentiment favoring the upside, reducing the possibility of a
    major crash.Bitcoin bull flag hints at $108,000Bitcoin technicals show it remains
    within a bull flag pattern, which puts it in a good position to break out if key
    support levels hold.The flagpole pattern developed after price climbed from $84,000

- title: " Solana price struggles to flip $150 to support — Is the SOL bull market
    over? "
  url: https://cointelegraph.com/news/solana-price-struggles-to-flip-150-to-support-is-the-sol-bull-market-over?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "Solana's native token, SOL (SOL), faced a sharp 8% rejection after briefly
    touching $147 on March 25. For the past three weeks, SOL has struggled to reclaim
    the $150 level, which is leading traders to question whether the bullish momentum
    that was originally driven by memecoin speculation and the rise of artificial
    intelligence sectors has come to an end.Some analysts argue that SOL price could
    significantly benefit from the eventual approval of a Solana spot exchange-traded
    fund (ETF) in the United States, as well as the expansion of tokenized real-world
    assets (RWA) on the Solana network, including stablecoins and money market funds. Others,
    like Nikita Bier, co-founder of TBH and Gas startups, believe Solana has \"the
    fundamental building blocks for something to break out on mobile.\"Source: nikitabierBier
    highlighted the constructive regulatory environment from US President Donald Trump
    and the long-term impact of the memecoin frenzy, which introduced “millions” of
    new users to Web3 wallets and decentralized applications (DApps). Essentially,
    Nikita Bier believes Solana is well-positioned due to its streamlined onboarding
    experience for mobile users.The lackluster Bitcoin reserve announcement hurt all
    cryptocurrenciesDespite the potential for establishing a “consumer-grade” marketplace
    for DApps, most traders suffered losses as the memecoin mania faded and onchain
    volumes plunged. This decline has led investors to question whether SOL has the
    strength to reclaim levels above $150. Beyond the waning interest in DApps, Solana
    is also facing growing competition from other blockchains.Additionally, the realization
    that the US government would not purchase altcoins for its strategic reserve and
    digital asset stockpile was a major disappointment for some investors. On March
    6, President Trump signed a bill allowing budget-neutral strategies for the US
    Treasury to acquire Bitcoin (BTC), while altcoins in government possession could
    be strategically sold. In fact, there was no explicit mention of Solana or any
    other altcoin in the Digital Asset Stockpile executive order.Some may argue that
    the Solana ecosystem extends far beyond memecoin trading and token launchpads,
    as total value locked (TVL) has grown across liquid staking, collateralized lending,
    synthetic assets, and yield platforms. However, Solana’s fees and DApp revenues
    have continued to decline. Reduced onchain activity reduces SOL’s appeal to investors,
    thus limiting its upside potential.Solana 7-day DApp revenues (left) and chain
    fees (right), USD. Source: DefiLlamaSolana DApp revenues totaled $12 million in
    the seven days leading up to March 24, down from $23.7 million just two weeks
    earlier. Similarly, base layer fees reached $3.6 million in the same period, a
    sharp drop from $6.6 million in the seven days ending March 10. Interestingly,
    this decline occurred while the total value locked (TVL) remained stable at 53.2
    million SOL.Related: Specialized purpose DEXs poised for growth in 2025 — Curve
    founderSolana is no longer the dominant network in DEX volumesThe drop in Solana’s
    onchain activity is particularly concerning given that BNB Chain surged to the
    top spot in DEX volumes, despite having 34% less TVL than Solana, according to
    DefiLlama data.Decentralized exchanges volume market share. Source: DefiLlamaIn
    terms of volume, Solana dominated the DEX industry from October 2024 to February
    2025 but has recently lost ground to Ethereum and BNB Chain. As a result, part
    of SOL’s price weakness stems from a decline in Solana’s onchain activity compared
    to its competitors. For instance, trading volume on Hyperliquid increased by 35%
    over the past seven days, while activity on Pendle surged by an impressive 186%.Although
    fundamentals do not indicate an imminent rally above $150, the Solana network
    uniquely combines an integrated user experience with a degree of decentralization
    that has proven successful. For example, while BNB Chain and Tron offer similar
    scalability, neither has had a wallet or DApp rank among the top 10 on the Apple
    App Store—unlike Solana’s Phantom Wallet in November 2024.This article is for
    general information purposes and is not intended to be and should not be taken
    as legal or investment advice. The views, thoughts, and opinions expressed here
    are the author’s alone and do not necessarily reflect or represent the views and
    opinions of Cointelegraph.\n\n            "

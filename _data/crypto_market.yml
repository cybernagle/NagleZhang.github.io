    part of their dual mandate spikes further. Uncertainty remains.”This environment
    elevates Bitcoin’s status as a store of value, often likened to “digital gold.”
    Investors, wary of inflationary pressures eroding fiat currencies, are turning
    to Bitcoin as a hedge, much like during the 2020 monetary easing period when crypto
    rallied. “The Fed is worried about stagflation,” Zach Pandl, head of research
    at Grayscale, said in a May 7 post on X after the Fed’s decision and press conference.“We
    think that outcome would be good for Bitcoin.”Anticipation of US-UK trade deal
    fuels market optimismUS President Donald Trump’s administration has signaled a
    pro-crypto stance, and reports suggest a trade agreement with the UK could be
    announced soon.In a May 7 Truth Social post, Trump said that a “major trade deal”
    with a “big, and highly respected, country” would be announced on May 8. The New
    York Times reported that the country would be the UK, citing three people familiar
    with the matter.\U0001F1FA\U0001F1F8 JUST IN: President Trump announces a \"major
    trade deal\" news conference scheduled for tomorrow at 10:00 AM in the Oval Office
    with \"a big, and highly respected country.” pic.twitter.com/irsood0JRZ— Cointelegraph
    (@Cointelegraph) May 8, 2025A US-UK deal would signal the de-escalation of global
    trade tensions, boosting risk appetite across markets, including cryptocurrencies. Related:

    prevailing rebound that began on April 21 and has seen Sui rise more than 73%
    over the last seven days.Data from Cointelegraph Markets Pro and TradingView shows
    SUI rose from a low of $2.11 on April 21, climbing as much as 77% to an intraday
    high of $3.71 on April 25.SUI/USD daily chart. Source: Cointelegraph/TradingViewSUI’s
    performance over the last seven days made it the biggest gainer among the top
    100 cryptocurrencies by market cap.Top gainers April 25. Source: CoinMarketCapSUI
    price buoyed by positive fundamentalsSUI’s gains are primarily fueled by increasing

- title: " Solana price bottom below $100? Death cross hints at 30% drop "
  url: https://cointelegraph.com/news/solana-price-bottom-below-100-death-cross-30-drop?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NThmYWYtYThhZi03NjA0LTgzMTAtODk5NmYzNzZjZDU0.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NThmYWYtYThhZi03NjA0LTgzMTAtODk5NmYzNzZjZDU0.jpg\"
    alt=\"Solana price bottom below $100? Death cross hints at 30% drop\"></p><p>Solana<a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/solana-price-index\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/solana-price-index\">
    (SOL) </a>price completed a &ldquo;death cross&rdquo; on the one-day chart on
    March 12, as the altcoin consolidated near its long-term support level at $125.
    <p>This could potentially accelerate the SOL price sell-off in the near term for
    a drop below $100 for the first time since February 2024. </p><figure><img alt=\"Markets,
    Price Analysis, Market Analysis, Altcoin Watch, Solana\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01958fd9-6d0d-78ef-8053-d0c0eeea3ddf\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Solana&rsquo;s 1-day
    chart. Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>A death
    cross occurs when a bearish crossover occurs between the 50-day and 200-day simple
    moving averages (SMAs), with the long-term indicator above the short-term indicator.
    </p><p>Last month, the 50-day and 200-day exponential moving averages (EMAs) triggered
    a death cross on Solana&rsquo;s one-day chart, after which prices dropped 17%,
    from $137 to $122. </p><p>While the SMA and EMA death crosses carry similar implications,
    the EMA triggers the death cross faster since it responds more quickly to price
    changes. A double death cross from the SMA and EMA will likely increase the possibility
    of a correction. </p><p>Historically, the odds are neutral for Solana. Since its
    inception, SOL&rsquo;s price has witnessed a death cross three times (including
    2025) when prices have been on a 90-day or higher downtrend. </p><p>The first
    death cross in 2022 triggered a 90% collapse, but the FTX&rsquo;s fiasco escalated
    its severity. The second death cross occurred in September 2024, but it reversed
    within a month, leading to the Trump rally. </p><p><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/ethereum-can-outperform-rivals-crashing-17-month-lows\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/news/ethereum-can-outperform-rivals-crashing-17-month-lows\"><em><strong>Related:
    3 reasons why Ethereum can outperform its rivals after crashing to 17-month lows</strong></em></a></p><p>Yet,
    the current structure and sentiment mirror the 2022 death cross when we compare
    market conditions. On both occasions, a new all-time high preceded the downtrend,
    which led to the death cross.</p><p>As Cointelegraph <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/solana-revenue-slumps-90-from-january-high-memecoin-mania-dies\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/solana-revenue-slumps-90-from-january-high-memecoin-mania-dies\">reported</a>,
    Solana&rsquo;s revenue dropped 93% since January, dropping from $238 million to
    $32 million. This indicates a current lack of activity on Solana&rsquo;s network
    after the end of the memecoin frenzy.</p><h2>Can Solana traders defend $125?</h2><p>Based
    on its technicals, Solana remains in a tricky spot when comparing previous death
    cross returns and collective market sentiment. </p><p>Solana must hold support
    between $125 and $110 for a bullish reversal. Since March 2024, SOL prices have
    rebounded six times after testing the support range, closing above $125 on each
    weekly retest.  </p><figure><img alt=\"Markets, Price Analysis, Market Analysis,
    Altcoin Watch, Solana\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01959019-c34a-7b88-8c0d-3579f2f65b49\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Solana 1-week chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>A weekly close
    below $125 will signal market weakness, potentially increasing the likelihood
    of a drop below $100. The immediate price target after $110 is around $80 for
    Solana, which is a significant 30% correction. The downtrend target carries confluence
    with the weekly 0.5 Fibonacci retracement line. </p><figure><img alt=\"Markets,
    Price Analysis, Market Analysis, Altcoin Watch, Solana\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01959031-7b40-7f48-9545-8fb4f4913223\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Solana bullish divergences
    on the 1-day and 4-hour chart. Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>However,
    the bulls will pin their hopes on a bullish divergence between the price and relative
    strength index (RSI) on the 1-day and 4-hour charts. </p><p>If Solana manages
    to avoid another lower low, the divergences will remain valid, which can push
    prices higher above $125, enabling Solana to avoid a drop below $100 and possibly
    establish a bottom at $112. </p><p><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/will-bitcoin-price-reclaim-95k-before-end-march\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/will-bitcoin-price-reclaim-95k-before-end-march\"><em><strong>Related:
    Will Bitcoin price reclaim $95K before the end of March?</strong></em></a></p><p
    class=\"post-content__disclaimer\" type=\"\">This article does not contain investment
    advice or recommendations. Every investment and trading move involves risk, and
    readers should conduct their own research when making a decision.</p><template
    data-name=\"subscription_form\" data-type=\"markets_outlook\" label=\"Subscription
    Form: Markets Outlook\"></template></p>\n</p>\n            "
  published: 2025-03-13 16:06:29 UTC
- title: " Will Bitcoin price reclaim $95K before the end of March? "
  url: https://cointelegraph.com/news/will-bitcoin-price-reclaim-95k-before-end-march?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDIvMDE5NGNjNjMtMTExZC03NTVjLTg4MDEtYzJkYWIzOWI1Yzc2.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDIvMDE5NGNjNjMtMTExZC03NTVjLTg4MDEtYzJkYWIzOWI1Yzc2.jpg\"
    alt=\"Will Bitcoin price reclaim $95K before the end of March?\"></p><p>Bitcoin&rsquo;s
    price was up 3% after constant drawdowns since the end of January. The top cryptocurrency
    managed to rebound above $80,000 after a brief decline below the range on March
    11. <figure><img alt=\"Will Bitcoin price reclaim $95K before the end of March?\"
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01958e28-058f-77e5-a9da-c32407d40b68\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Bitcoin weekly chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>After the US
    core Consumer Price Index (CPI) <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-battles-us-sellers-cpi-inflation-sees-first-drop-since-mid-2024\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-battles-us-sellers-cpi-inflation-sees-first-drop-since-mid-2024\">came
    in lower than expected</a> at 3.1% on March 12, Bitcoin's market structure now
    sees the possibility of a quick bullish turnaround. </p><h2>Bitcoin liquidity
    clusters at $84K-$85K</h2><p>After Bitcoin's (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/bitcoin-price\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"https://cointelegraph.com/bitcoin-price\">BTC</a>) price
    tumbled on March 9, it rebounded to test the overhead resistance zone between
    $84,000 and $85,000 three times, spurring traders to aggressively build short
    positions in this range.</p><p>The liquidation heatmap data suggested that more
    than $300 million in short positions were piled in this price region, which would
    be liquidated if the price moved above the $85,000 resistance. </p><figure><img
    alt=\"Will Bitcoin price reclaim $95K before the end of March?\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01958e47-8a96-7219-a215-f9163aa09f1c\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Bitcoin 1-week liquidation
    heatmap. Source: CoinGlass</em></p></figcaption></figure><p>With a lack of downside
    liquidity below $77,000, the probability of BTC moving toward upside liquidity
    increased. Moreover, triggering liquidations above $85,000 could fuel further
    bullish momentum, allowing Bitcoin to form a higher high and turn this level into
    new support. </p><p>A CME Bitcoin futures gap from the previous weekend also remained
    unfilled between $85,000 and $86,000. With a 100% record of six gaps filled in
    the past four months, this setup further increased the chances of flipping the
    overhead resistance into support at $85,000. </p><figure><img alt=\"Will Bitcoin
    price reclaim $95K before the end of March?\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01958e48-9f06-799d-9664-37eeebd4277f\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Bitcoin 4-hour chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>If this happens,
    the next major resistance lies at $90,000, which could <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-price-weekly-close-89k-bottom-resume-uptrend-crypto-analyst\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-price-weekly-close-89k-bottom-resume-uptrend-crypto-analyst\">liquidate</a>
    over $1.6 billion in short positions for a retest of the $95,000 resistance level
    above, i.e., a 12% jump from the current price. </p><p><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-price-weekly-close-89k-bottom-resume-uptrend-crypto-analyst\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-price-weekly-close-89k-bottom-resume-uptrend-crypto-analyst\"><em><strong>Related:
    Bitcoin must secure weekly close above $89K to confirm bottom has passed</strong></em></a></p><p>Bitcoin
    analyst Mark Cullen underlined a similar outlook for Bitcoin but <a data-ct-non-breakable=\"null\"
    href=\"https://x.com/mark_cullen/status/1900046111660007583\" rel=\"nofollow noopener\"
    target=\"_blank\" text=\"null\" title=\"https://x.com/mark_cullen/status/1900046111660007583\">warn</a>ed
    that the price continues to move &ldquo;correctively,&rdquo; implying further
    sideways movement before a short squeeze. </p><p>On the contrary, Valeria, a crypto
    analyst and funded trader, <a data-ct-non-breakable=\"null\" href=\"https://x.com/valeriyaApex/status/1899890459377360987\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://x.com/valeriyaApex/status/1899890459377360987\">said</a>
    that BTC was showing signs of distribution near the $85,000 range, which is short-term
    bearish. The trader highlighted that the BTC price might thread lower below $80,000
    before a bullish breakout occurs.</p><h2>Coinbase, Binance diverge on orderbook
    trends</h2><p>Spot traders on Binance have been aggressively selling over the
    past few days, according to <a data-ct-non-breakable=\"null\" href=\"https://aggr.trade/clarifycrypto-order-flow\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://aggr.trade/clarifycrypto-order-flow\">data</a>
    from Aggr.trade, with selling pressure peaking during the local lows at $76,650.
    </p><p>Conversely, Coinbase spot buyers placed bids here, leading to BTC&rsquo;s
    rebound above $80,000. </p><figure><img alt=\"Will Bitcoin price reclaim $95K
    before the end of March?\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01958e6a-7e61-778a-b701-079d1195088c\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Binance, Coinbase
    orderbooks. Source: Aggr.trade</em></p></figcaption></figure><p>On March 12, a
    similar discrepancy was observed, with Binance spot traders selling near the $85,000
    resistance, as Coinbase traders defended the price at $81,000 during the early
    US trading session, avoiding further downside. </p><p><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/crypto-trading-volume-decline-reflects-diminishing-trader-enthusiasm-analysts\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/news/crypto-trading-volume-decline-reflects-diminishing-trader-enthusiasm-analysts\"><em><strong>Related:
    Crypto trading volume slumps, signaling market exhaustion: Analysis</strong></em></a></p><p>While
    Coinbase has led BTC&rsquo;s rally in the past, an opposing stance between the
    two leading exchanges might slow BTC&rsquo;s momentum to move swiftly through
    the resistance levels. </p><p>Thus, for Bitcoin to reclaim higher highs at $85,000,
    $90,000 and $95,000 over the next couple of weeks, spot trading activity between
    the two major exchanges may need more collective direction.</p><p class=\"post-content__disclaimer\"
    type=\"\">This article does not contain investment advice or recommendations.
    Every investment and trading move involves risk, and readers should conduct their
    own research when making a decision.</p><template data-name=\"subscription_form\"
    data-type=\"markets_outlook\" label=\"Subscription Form: Markets Outlook\"></template></p>\n</p>\n

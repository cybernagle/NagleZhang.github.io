- title: " Why is XRP price down today? "
  url: https://cointelegraph.com/news/why-is-xrp-price-down-today?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMDgvOWFiYzY1ZTEtMGE3Mi00ODkwLWIyODYtZmRmNDM3OTBlYWQ1.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMDgvOWFiYzY1ZTEtMGE3Mi00ODkwLWIyODYtZmRmNDM3OTBlYWQ1.jpg\"
    alt=\"Why is XRP price down today?\"></p><p>XRP (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/xrp-price-index\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">XRP</a>) mirrors the bearishness in the cryptocurrency
    market on March 11, with its price down approximately 7.50% in the last 24 hours
    to $2.08. At its intraday low, it was trading for $1.90.<figure><img alt=\"Cryptocurrencies,
    Federal Reserve, Dollar, Ripple, XRP, Markets, Interest Rate, Tech Analysis, Market
    Analysis, Altcoin Watch\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195843b-8213-784d-9fd8-276b91e5080a\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>XRP/USD daily price
    chart. Source: TradingView</em></p></figcaption></figure><p>Key catalysts driving
    the XRP prices lower today, include:</p><ul><li><p>Heightening US recession fears.</p></li><li><p>US
    President Donald Trump&rsquo;s digital asset stockpile letdown.</p></li><li><p>A
    textbook bearish technical setup.</p></li></ul><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01956048-3160-784f-b04e-cb2f2cc1e7e0\"
    title=\"\" alt=\"Why is XRP price down today?\"><figcaption style=\"text-align:
    center;\"><p><em>XRP/USD four-hour price chart. Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://www.tradingview.com/x/HoL7XgDJ/\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"https://www.tradingview.com/x/HoL7XgDJ/\"><em>TradingView</em></a></p></figcaption></figure><h2><strong>US
    recession fears hurt XRP price</strong></h2><p>Escalating concerns over a potential
    US economic slowdown have dampened investor sentiment across financial markets,
    hurting XRP and the broader cryptocurrency sector.</p><p>Key points:</p><ul><li><p>Crypto
    and tech stocks saw a large sell-off on March 10 due to rising US recession fears.</p></li><li><p>JPMorgan
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/investors-skitter-off-risk-assets-jpmorgan-raises-recession-chances\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/investors-skitter-off-risk-assets-jpmorgan-raises-recession-chances\">raised</a>
    the US recession risk to 40%, up from 30% at the start of 2025, citing extreme
    US policies as a key risk.</p></li></ul><ul><li><p>The Trump administration&rsquo;s
    recent imposition of tariffs on imports from Mexico, Canada, and China has heightened
    fears of a global trade war.</p></li><li><p>President Trump&rsquo;s acknowledgment
    of a <a data-ct-non-breakable=\"null\" href=\"https://www.bloomberg.com/news/articles/2025-03-09/the-bond-market-s-trump-trade-is-looking-like-a-recession-trade\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://www.bloomberg.com/news/articles/2025-03-09/the-bond-market-s-trump-trade-is-looking-like-a-recession-trade\">potential
    recession</a> during a \"period of transition\" has further unsettled investors.</p></li><li><p>Goldman
    Sachs has also increased its 12-month recession probability to 20%, up from 15%,
    warning that the forecast could rise if Trump maintains current policies.</p></li><li><p>The
    Nasdaq E-Mini Futures has dropped by nearly 6% over the past week, coinciding
    with a 1.18% plunge in the 10-year Treasury note yields.</p></li></ul><figure><img
    alt=\"Cryptocurrencies, Federal Reserve, Dollar, Ripple, XRP, Markets, Interest
    Rate, Tech Analysis, Market Analysis, Altcoin Watch\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195842d-8135-766f-978c-a5e3968efb0b\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Nasdaq Futures, US
    dollar index, US 10-year Treasury note yield, and TOTAL crypto market cap daily
    five-day performance. Source: TradingView</em></p></figcaption></figure><ul><li><p>The
    US dollar index dipped 1.88% in the same period, while the combined market cap
    of cryptocurrencies has fallen by 8.85%.</p></li><li><p>On the other hand, the
    Euro and Japanese Yen are rising.</p></li></ul><figure><img alt=\"Cryptocurrencies,
    Federal Reserve, Dollar, Ripple, XRP, Markets, Interest Rate, Tech Analysis, Market
    Analysis, Altcoin Watch\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195842f-222f-79ca-a6d4-184a6f1d53ed\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>EUR/USD and JPY/USD
    daily price chart. Source: TradingView</em></p></figcaption></figure><ul><li><p>Together,
    these performances indicate a growing rush toward what investors consider &ldquo;<a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-no-longer-safe-haven-82k-btc-price-dive-gold-top\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-no-longer-safe-haven-82k-btc-price-dive-gold-top\">safe
    havens</a>,&rdquo; especially as the Trump trade war hurts US economic growth
    prospects.</p></li></ul><h2>White House Crypto Summit fails to impress XRP bulls</h2><p>XRP's
    price took a sharp hit following the White House&rsquo;s inaugural Crypto Summit
    on March 7, as hopes for its inclusion in a US strategic crypto reserve were <a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-investors-mixed-reactions-white-house-crypto-summit\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-investors-mixed-reactions-white-house-crypto-summit\">swiftly
    dashed</a>.</p><p>Key takeaways:</p><ul><li><p><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/blockchain-industry-braces-for-white-house-crypto-summit-what-to-expect\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/news/blockchain-industry-braces-for-white-house-crypto-summit-what-to-expect\">Initial
    excitement</a> faded after President Donald Trump&rsquo;s team clarified that
    Ethereum, Solana, Cardano, and XRP were used as illustrative examples, not official
    selections for the US reserve.</p></li></ul><p><em><strong>Related: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/crypto-etps-4th-consecutive-outflows-at-876m-coin-shares\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/crypto-etps-4th-consecutive-outflows-at-876m-coin-shares\"><em><strong>Crypto
    ETPs see 4th straight week of outflows, totaling $876M &mdash; CoinShares</strong></em></a></p><ul><li><p>Trump&rsquo;s
    crypto strategy favors altcoin reserves but excludes new purchases, limiting XRP&rsquo;s
    chances of institutional accumulation.</p></li><li><p>No evidence exists that
    the <a data-ct-non-breakable=\"null\" href=\"https://intel.arkm.com/explorer/entity/usg\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://intel.arkm.com/explorer/entity/usg\">US
    government holds XRP</a>, further diminishing investor optimism.</p></li><li><p>Conversely,
    Bitcoin remains the clear winner, with the US government <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/how-much-bitcoin-does-us-have-where-did-it-come-from\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/news/how-much-bitcoin-does-us-have-where-did-it-come-from\">holding
    approximately $17.7 billion in BTC</a>, reinforcing its dominance.</p></li><li><p>The
    XRP/BTC pair has dropped by 15% in the past two weeks while consolidating within
    a historical distribution zone.</p></li></ul><figure><img alt=\"Cryptocurrencies,
    Federal Reserve, Dollar, Ripple, XRP, Markets, Interest Rate, Tech Analysis, Market
    Analysis, Altcoin Watch\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01957ff8-b97d-7047-91c4-1ea3151a5c9c\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>XRP/BTC two-week price
    chart. Source: TradingView</em></p></figcaption></figure><ul><li><p>A break below
    the 200-2W exponential moving average (200-2W EMA; the blue wave) at around 1,700
    satoshis could send XRP/BTC toward the 50-2W EMA (~1,700 satoshis).</p></li></ul><h2><strong>XRP
    risks 45% crash ahead</strong></h2><p>XRP&rsquo;s price decline today is furthermore
    a part of its prevailing head-and-shoulders pattern.</p><p>Key points:</p><ul><li><p>An
    H&amp;S pattern forms when the price forms three consecutive highs, with the middle
    peak (head) higher than the other two (shoulders).</p></li><li><p>As a technical
    rule, the pattern resolves when the price breaks below its common support (neckline)
    and falls by as much as the pattern&rsquo;s maximum height.</p></li></ul><figure><img
    alt=\"Cryptocurrencies, Federal Reserve, Dollar, Ripple, XRP, Markets, Interest
    Rate, Tech Analysis, Market Analysis, Altcoin Watch\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01958436-5665-77de-95cb-aa16f7d051ca\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>XRP/USD three-day
    price chart. Source: TradingView</em></p></figcaption></figure><ul><li><p>As of
    March 10, XRP had formed what appears to be the H&amp;S pattern&rsquo;s right
    shoulder and was heading toward the neckline support at around $2.</p></li><li><p>A
    decisive breakdown below the support level could send the XRP price toward $1.11
    by April, down by over 45% from the current prices.</p></li></ul><h2>Can XRP resume
    its bull run?</h2><ul><li><p>A rebound from $2 neckline support could delay or
    invalidate the H&amp;S pattern.</p></li><li><p>Interestingly, the level aligns
    with two other support levels: the lower trendline of XRP&rsquo;s prevailing symmetrical
    triangle pattern and the 50-3D EMA.</p></li></ul><figure><img alt=\"Cryptocurrencies,
    Federal Reserve, Dollar, Ripple, XRP, Markets, Interest Rate, Tech Analysis, Market
    Analysis, Altcoin Watch\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01958438-0e46-7b8d-8c05-9da374086af7\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>XRP/USD three-day
    price chart. Source: TradingView</em></p></figcaption></figure><ul><li><p>A bounce,
    followed by a decisive close above the triangle&rsquo;s upper trendline, could
    trigger a breakout scenario toward $3.44.</p></li><li><p>The upside target is
    measured after adding the triangle&rsquo;s maximum height to the breakout point
    (considered to be at the triangle&rsquo;s apex point at $2.05).</p></li></ul><p
    class=\"post-content__disclaimer\" type=\"\">This article does not contain investment
    advice or recommendations. Every investment and trading move involves risk, and
    readers should conduct their own research when making a decision.</p><template
    data-name=\"subscription_form\" data-type=\"markets_outlook\" label=\"Subscription
    Form: Markets Outlook\"></template></p>\n</p>\n            "

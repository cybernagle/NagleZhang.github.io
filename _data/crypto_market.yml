    GlassnodeHistorically, when the Percent Supply in Profit remains above 90% for
    an extended period, markets tend to enter a euphoric phase. With profitability
    now nearing that threshold, bullish sentiment continues to build.Combined with
    bullish chart structures and concentrated short liquidity overhead, BTC remains
    positioned for a potential move toward $100,000 by May. This article does not
    contain investment advice or recommendations. Every investment and trading move

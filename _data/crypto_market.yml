    to continue the recovery it began on April 22. BONK has climbed approximately
    73% from its April 22 low of around $0.00001247, bringing its price up to an intraday
    high of $0.00002167 on April 28.Data from Cointelegraph Markets Pro and TradingView
    shows BONK trading at $0.00001923, up 3% over the 24 hours and 60% over the last
    seven days.BONK/USD daily chart. Source: Cointelegraph/TradingViewBONK’s trading

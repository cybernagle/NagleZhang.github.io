- title: " Forget Solana, XRP may flip Ethereum first amid 5-year high "
  url: https://cointelegraph.com/news/forget-solana-xrp-flip-ethereum-first-5-year-high?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMTEvMDE5Mzc3NTItYmRhZi03MjUwLWI1ODItMTczNWJhMDgwMjEz.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMTEvMDE5Mzc3NTItYmRhZi03MjUwLWI1ODItMTczNWJhMDgwMjEz.jpg\"
    alt=\"Forget Solana, XRP may flip Ethereum first amid 5-year high\"></p><p>XRP
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/xrp-price-index\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/xrp-price-index\">XRP</a>)
    price versus Ether (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/ethereum-price\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/ethereum-price\">ETH</a>)
    reached its highest level in five years over the weekend, extending its recovery.<p>On
    March 15, the XRP/ETH pair touched 0.00128 ETH for the first time since April
    2020. That amounts to a 925% rebound when measured from its all-time low of 0.00013
    ETH established in June 2024 and approximately 620% gains since November 2024,
    when Donald Trump won the US presidential election.</p><figure><img alt=\"Forget
    Solana, XRP may flip Ethereum first amid 5-year high\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01959e0f-46b1-7d25-a5ad-900a3171eb36\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>XRP/ETH weekly price
    chart. Source: TradingView</em></p></figcaption></figure><h2>XRP potential breakout
    versus ETH</h2><p>The XRP/ETH rally is fueling speculation among market watchers
    that XRP could flip Ether to become the second-largest cryptocurrency by market
    capitalization.</p><p>For instance, analyst Dom <a data-ct-non-breakable=\"null\"
    href=\"https://x.com/traderview2/status/1897121401074524460\" rel=\"nofollow noopener\"
    target=\"_blank\" text=\"null\" title=\"https://x.com/traderview2/status/1897121401074524460\">highlights</a>
    0.0012 ETH as a historically significant resistance level, a threshold that has
    consistently preceded explosive rallies in past cycles. He notes that XRP has
    gone parabolic after breaking this resistance, delivering gains of at least 160%
    in previous instances.</p><figure><img alt=\"Forget Solana, XRP may flip Ethereum
    first amid 5-year high\" src=\"https://s3.cointelegraph.com/uploads/2025-03/019566a5-82c0-77c4-9111-9936cef5289d\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>XRP/ETH 12-hour price
    charts. Source: TradingView/Dom</em></p></figcaption></figure><p>He illustrated
    the same with three key breakout points&mdash;in early 2017, late 2017, and 2018
    when XRP&rsquo;s surged against Ether following a confirmed breach of the 0.0012
    ETH resistance. </p><p>As of March 16, XRP was once again testing this critical
    level. If history repeats itself, even a partial rally of 80% would be enough
    for XRP to flip ETH in market capitalization, DOM suggests, especially as <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/ether-fall-below-1-9k-robust-demand-zone-analysts-capitulation\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/ether-fall-below-1-9k-robust-demand-zone-analysts-capitulation\">Ether&rsquo;s
    price risks more downside in 2025</a>.</p><p><em><strong>Related: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/xrp-price-46-gains-after-ripple-secures-first-dubai-license\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>XRP price
    poised for 46% gains after Ripple secures first Dubai license</strong></em></a></p><p>At
    $138 billion, XRP&rsquo;s market cap is less than $100 billion short of hitting
    Ethereum&rsquo;s. Moreover, XRP&rsquo;s fully diluted valuation (FDV) <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/xrp-flips-ether-fdv-change-market-dynamics\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/xrp-flips-ether-fdv-change-market-dynamics\">briefly
    surpassed</a> Ethereum's earlier this week. </p><p>For context, FDV represents
    the total theoretical value of all tokens, including those not yet in circulation,
    whereas market capitalization only accounts for tokens currently in circulation.</p><h2>Why
    is Ethereum underperforming XRP?</h2><p>XRP&rsquo;s market dominance has grown
    by over 300% since Trump&rsquo;s reelection on Nov. 5.</p><figure><img alt=\"Forget
    Solana, XRP may flip Ethereum first amid 5-year high\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01959e42-3d2c-7026-a2b0-38338104d159\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>XRP.D vs. ETH.D daily
    price chart. Source: TradingView</em></p></figcaption></figure><p>The same period
    has witnessed Ethereum losing its market share by over 35.50%, showing a clear
    lack of interest among traders for Ether compared to other top-ranking crypto
    assets.</p><p>A key factor in this divergence is regulatory sentiment. Trump has
    positioned the US as the future \"<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/podcasts/rise-n-crypto/trump-to-make-us-crypto-capital-of-the-planet-will-fire-gensler-on-day-one\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/podcasts/rise-n-crypto/trump-to-make-us-crypto-capital-of-the-planet-will-fire-gensler-on-day-one\">world&rsquo;s
    crypto capital</a>,&rdquo; appointing pro-crypto regulators and pledging to foster
    a more favorable environment. </p><p>This shift has especially benefited XRP,
    which caters to enterprise users, particularly as Ripple <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/xrp-ledger-unveils-institutional-defi-roadmap\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/xrp-ledger-unveils-institutional-defi-roadmap\">unveiled
    an institutional DeFi roadmap</a> in February.</p><p>Meanwhile, Ethereum has slumped
    due to rising competition from rival layer-1 blockchains, particularly Solana
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/solana-price-index\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/solana-price-index\">SOL</a>).
    </p><p>The Dencun upgrade in March 2024, which <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/ethereum-average-gas-fees-95-percent-drop-dencun\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/ethereum-average-gas-fees-95-percent-drop-dencun\">slashed
    Ethereum&rsquo;s transaction fees by 95%,</a> was intended to improve scalability.
    However, it has also reduced ETH burn rates, increasing supply and weakening its
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/worst-thing-ethereum-eth-price-down-70-btc-the-merge\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/worst-thing-ethereum-eth-price-down-70-btc-the-merge\">deflationary
    appeal</a> and &ldquo;<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/ethereum-inflation-surge-questions-ultrasound-money-narrative\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/ethereum-inflation-surge-questions-ultrasound-money-narrative\">ultrasound
    money</a>&rdquo; narrative. </p><figure><img alt=\"Forget Solana, XRP may flip
    Ethereum first amid 5-year high\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01959e48-d525-7e0f-95ac-54df2e988cbb\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>ETH supply rate since
    the Merge. Source: </em><a data-ct-non-breakable=\"null\" href=\"https://ultrasound.money/?timeFrame=since_merge\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://ultrasound.money/?timeFrame=since_merge\"><em>UltraSound
    Money</em></a></p></figcaption></figure><p>At the same time, <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/flippening-solana-price-hits-new-record-high-ethereum\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/flippening-solana-price-hits-new-record-high-ethereum\">Solana&rsquo;s
    dominance</a> has risen, with its trading volume now rivaling Ethereum and all
    its layer-2 chains combined. </p><p>The network&rsquo;s faster and cheaper transactions
    have made it the go-to platform for DeFi activity, <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/pump-fun-memecoins-are-dying-at-record-rates-less-than-1-survive\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/pump-fun-memecoins-are-dying-at-record-rates-less-than-1-survive\">memecoin
    trading</a>, and NFT markets, which Ethereum previously dominated. This shift
    has eroded Ethereum&rsquo;s market share, particularly among traders and developers
    seeking high-speed, low-cost transactions.</p><p class=\"post-content__disclaimer\"
    type=\"\">This article does not contain investment advice or recommendations.
    Every investment and trading move involves risk, and readers should conduct their
    own research when making a decision.</p><template data-name=\"subscription_form\"
    data-type=\"markets_outlook\" label=\"Subscription Form: Markets Outlook\"></template></p>\n</p>\n

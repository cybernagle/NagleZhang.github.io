- title: " Why is XRP price up today? "
  url: https://cointelegraph.com/news/why-is-xrp-price-up-today?utm_source=rss_feed&utm_medium=rss_category_market-analysis&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMDgvNjJlNDdlMTgtYmFmMS00YzBiLWFkMDktZGRlZjY1NzYwN2Ew.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMDgvNjJlNDdlMTgtYmFmMS00YzBiLWFkMDktZGRlZjY1NzYwN2Ew.jpg\"
    alt=\"Why is XRP price up today?\"></p><p>XRP (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/xrp-price-index\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">XRP</a>) pared some losses following this week&rsquo;s
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/why-is-the-crypto-market-down-today\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">market crash</a>, with
    6% daily gains over the last 24 hours to trade at $2.24.<p>The top-ten altcoin
    trades 18% above the 24-hour low of $1.89 as the crypto market sentiment recovers
    slightly.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958a69-0243-7b45-b35b-fad3f23554b5\"
    title=\"\" alt=\"Why is XRP price up today?\"><figcaption style=\"text-align:
    center;\"><p><em>XRP/USD daily chart. Source: Cointelegraph/</em><a data-ct-non-breakable=\"null\"
    href=\"https://www.tradingview.com/x/bYfZV2U5/\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"https://www.tradingview.com/x/bYfZV2U5/\"><em>TradingView</em></a></p></figcaption></figure><p>Let&rsquo;s
    examine the key drivers behind XRP&rsquo;s rebound today.</p><h2><strong>Franklin
    Templeton&rsquo;s XRP ETF filing</strong></h2><p>One of the primary catalysts
    behind today&rsquo;s XRP price surge is Franklin Templeton&rsquo;s filing of an
    XRP ETF in the United States.</p><blockquote class=\"twitter-tweet\"><p lang=\"en\"
    dir=\"ltr\">&#128293; JUST IN: Franklin XRP Trust Files S-1 With the SEC for an
    XRP ETF on Cboe BZX. <a href=\"https://t.co/B6oo3e5k0d\">pic.twitter.com/B6oo3e5k0d</a></p>&mdash;
    Cointelegraph (@Cointelegraph) <a href=\"https://twitter.com/Cointelegraph/status/1899532549916877044?ref_src=twsrc%5Etfw\">March
    11, 2025</a></blockquote><script async src=\"https://platform.twitter.com/widgets.js\"
    charset=\"utf-8\"></script><p>Key takeaways:</p><ul><li><p>On March 11, California-based
    asset manager Franklin Templeton <a data-ct-non-breakable=\"null\" href=\"https://www.sec.gov/Archives/edgar/data/2059438/000113743925000181/s1.htm\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">filed</a> an S-1 registration
    form with the US Securities and Exchange Commission (SEC) to launch a <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/learn/articles/what-are-xrp-backed-securities\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">spot XRP ETF</a>.&nbsp;</p></li><li><p>Franklin
    Templeton is a major global asset manager with $1.5 trillion in assets under management.</p></li><li><p>It
    joins a growing list of financial giants like <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitwise-files-xrp-etf\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">Bitwise</a>, <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/grayscale-seeks-conversion-multi-crypto-fund-to-etf\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Grayscale</a>, and <a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/cboe-xrp-etfs-bitwise-wisdom-tree-canary-and-21-shares\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">WisdomTree</a> in pursuing
    XRP-based ETFs.&nbsp;</p></li><li><p>This filing signals a strong vote of confidence
    in XRP&rsquo;s potential as a mainstream investment vehicle.</p></li><li><p>The
    news has fueled speculation of major capital inflows that could push XRP price
    into double digits.&nbsp;</p></li></ul><p>&ldquo;Franklin Templeton has filed
    the 17th XRP ETF, which alone has $1.53 trillion USD under their asset management,&rdquo;
    <a data-ct-non-breakable=\"null\" href=\"https://x.com/DefendDark/status/1899578452732530740\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">said</a> pseudonymous
    XRP analyst Dark Defender in a March 12 post on X.</p><blockquote>&ldquo;Just
    imagine when all are approved. Double digits for XRP will be as easy as a pie.&rdquo;</blockquote><p>Meanwhile,
    the odds of a US spot XRP ETF <a data-ct-non-breakable=\"null\" href=\"https://polymarket.com/event/ripple-etf-approved-in-2025?tid=1740039864495\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">being approved</a> in
    2025 are now at 76% on Polymarket.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958a69-0bf0-7e77-a0bc-88012dbb56c9\"
    title=\"\" alt=\"Why is XRP price up today?\"><figcaption style=\"text-align:
    center;\"><p><em>XRP ETF approval odds on Polymarket. Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://polymarket.com/event/ripple-etf-approved-in-2025?tid=1740039864495\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://polymarket.com/event/ripple-etf-approved-in-2025?tid=1740039864495\"><em>Polymarket</em></a></p></figcaption></figure><p>If
    approved, it would boost XRP&rsquo;s credibility and <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/solana-xrp-etfs-billion-dollar-investment-jpmorgan\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">could draw billions
    of dollars</a> in capital inflows, according to JP Morgan.&nbsp;</p><p>Despite
    the <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/sec-delays-decision-xrp-solana-litecoin-dogecoin-etfs\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">SEC delaying decisions</a>
    on other XRP ETF applications, such as those from Grayscale and Canary Capital,
    until May 2025, Franklin Templeton&rsquo;s entry&mdash;given its size and reputation&mdash;has
    boosted market confidence, contributing to XRP&rsquo;s price rebound.</p><h2><strong>MVRV
    metric suggests XRP price bottom</strong></h2><p>Beyond external catalysts, onchain
    data provides a compelling case for XRP&rsquo;s price recovery.&nbsp;</p><p>Key
    points:</p><ul><li><p>Metrics like the Market Value to Realized Value (MVRV) ratio
    indicate that XRP may have bottomed.</p></li><li><p>The MVRV ratio compares XRP&rsquo;s
    market cap to the value of coins at their last transaction, offering insight into
    whether the asset is overbought or oversold.</p></li><li><p>Data from Santiment
    shows XRP&rsquo;s 30-day MVRV ratio has plunged to a low of -16%, the lowest since
    April 2024.</p></li></ul><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958a69-1704-7c6f-8a06-2c7fc9eb5c31\"
    title=\"\" alt=\"Why is XRP price up today?\"><figcaption style=\"text-align:
    center;\"><p><em>XRP 30-day MVRV. Source: Santiment</em></p></figcaption></figure><ul><li><p>The
    chart above shows it inside a zone typically associated with accumulation, suggesting
    that selling pressure has subsided.</p></li><li><p>Historically, XRP usually experiences
    a reversal whenever the 30D MVRV declines below 10%.</p></li></ul><h2><strong>XRP
    price eyes V-shaped recovery to $2.64</strong></h2><p>XRP&rsquo;s price action
    has been nurturing a V-shaped recovery chart pattern on the four-hour chart since
    March 6, as shown below.</p><ul><li><p>A V-shaped recovery is a bullish pattern
    formed when an asset experiences a sharp price increase after a steep decline.&nbsp;</p></li><li><p>XRP
    appears to be on a similar trajectory and now trades below a key supply congestion
    zone between $2.30 and $2.45, where all the major simple moving averages (SMAs)
    are currently sitting.</p></li><li><p>The bulls must now push XRP above this area
    to increase the chances of the price rising to the neckline at $2.64 to complete
    the V-pattern.</p></li><li><p>Completing the V-shaped recovery would result in
    20% gains from the current price.</p></li></ul><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958a69-213b-734c-82c8-870a6fe8a048\"
    title=\"\" alt=\"Why is XRP price up today?\"><figcaption style=\"text-align:
    center;\"><p><em>XRP/USD daily chart. Source: Cointelegraph/</em><a data-ct-non-breakable=\"null\"
    href=\"https://www.tradingview.com/x/2Tg070am/\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"https://www.tradingview.com/x/2Tg070am/\"><em>TradingView</em></a></p></figcaption></figure><ul><li><p>The
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/here-s-3-ways-the-relative-strength-index-rsi-can-be-used-as-a-sell-signal\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">relative strength index</a>
    has risen from oversold conditions at 27 on March 10 to 44 on March 1, suggesting
    that bullish momentum is picking up.</p></li></ul><blockquote class=\"twitter-tweet\"><p
    lang=\"en\" dir=\"ltr\"><a href=\"https://twitter.com/search?q=%24XRP&amp;src=ctag&amp;ref_src=twsrc%5Etfw\">$XRP</a>
    is among the strongest charts amid the sell-off <br><br>Daily bullish divergence
    <br><br>It will run massively as the market begins to recover. <a href=\"https://t.co/iIw6UlIDuF\">pic.twitter.com/iIw6UlIDuF</a></p>&mdash;
    Mikybull &#128002;Crypto (@MikybullCrypto) <a href=\"https://twitter.com/MikybullCrypto/status/1899548561026535560?ref_src=twsrc%5Etfw\">March
    11, 2025</a></blockquote><script async src=\"https://platform.twitter.com/widgets.js\"
    charset=\"utf-8\"></script><p class=\"post-content__disclaimer\" type=\"\">This
    article does not contain investment advice or recommendations. Every investment
    and trading move involves risk, and readers should conduct their own research
    when making a decision.</p><template data-name=\"subscription_form\" data-type=\"markets_outlook\"
    label=\"Subscription Form: Markets Outlook\"></template><p><br></p></p>\n</p>\n
    \           "

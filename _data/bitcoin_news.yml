- title: " Bitcoin buyer dominance at $111K suggests &#039;another wave&#039; of gains "
  url: https://cointelegraph.com/news/bitcoin-buyer-dominance-at-111k-suggests-another-wave-of-gains?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Key points:Bitcoin buyer interest remains strong at all-time highs, contrasting
    with the first touch of $100,000 in 2024.The BTC price uptrend “may continue”
    as a result, CryptoQuant analysis concludes.Bitcoin short-term holders are firmly
    in the black in a further potential bull market boost.Bitcoin (BTC) buyers remain
    dominant on exchanges as all-time highs are met with unusual optimism.Data from
    onchain analytics platform CryptoQuant shows a 90-day cumulative volume delta
    (CVD) favoring Bitcoin bulls.CryptoQuant: BTC price uptrend “may continue”BTC
    price all-time highs continue to find support among traders, with buyers staying
    dominant despite the market surging 50% in under two months.Analyzing 90-day CVD,
    CryptoQuant contributor Ibrahim Cosar reveals the extent to which sellers have
    ceded control during that period.“In short: Buy orders (taker buy) have become
    dominant again. In other words, more buy orders are being placed in the market
    than sell orders,” he summarizes. “This generally signals that the uptrend may
    continue.”Bitcoin spot taker CVD. Source: CryptoQuantCVD measures the difference
    between buy and sell volume over a three-month period. Until mid-March, sell-side
    pressure dominated the order book, with BTC/USD hitting multimonth lows under
    $75,000 in early April.Neutral conditions then prevailed until buyer dominance
    reentered in May.“The summary of the situation: As the price tests above $110K
    and reaches a new all-time high (ATH), buyers have not backed down. This could
    be setting the stage for another wave of upward movement,” Cosar concludes.Bitcoin
    hodlers hold off on salesAs Cointelegraph reported, hodlers have broadly refrained
    from distributing coins to the market at current levels.Related: Bitcoin 'looks
    exhausted' as next bear market yields $69K targetDaily profit-taking is half of

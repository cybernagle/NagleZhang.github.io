    ever in US dollar terms if its market cap is measured by the value at which the
    extant supply last moved onchain.Known as realized cap, this figure has seen continued
    all-time highs since mid-April as BTC/USD stages a sustained recovery, and as
    of May 7 stood at $891 billion.“Bitcoin has experienced a steady flow of capital
    inflows in recent weeks, reflecting renewed interest from investors,” CryptoQuant
    contributor Carmelo Alemán said in one of its “Quicktake” blog posts on May 7.Alemán
    argued that the realized cap uptrend reflects a long-term market shift across

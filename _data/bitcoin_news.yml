    ground to the bears. That suggests the bulls have kept up the pressure.BTC/USDT
    daily chart. Source: Cointelegraph/TradingViewThe upsloping 20-day exponential
    moving average ($90,102) and the relative strength index (RSI) in the positive
    territory indicate the path of least resistance is to the upside. A break and
    close above $95,000 could swiftly propel the BTC/USDT pair to the psychological
    resistance at $100,000. Sellers are expected to vigorously defend the $100,000
    obstacle, but if the bulls prevail, the pair could soar toward $107,000.Sellers

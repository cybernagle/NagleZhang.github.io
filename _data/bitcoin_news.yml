- title: " Strategy will beat all public equities with Bitcoin, analyst says "
  url: https://cointelegraph.com/news/bitcoin-strategy-number-one-publicly-traded-equity-analyst?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Michael Saylor’s Strategy, the world’s largest corporate holder of Bitcoin,
    may become the top publicly traded equity one day, according to a Strategy analyst.Strategy
    will be the “number one publicly traded equity in the entire market” because of
    its future financial strength enabled with Bitcoin (BTC), Strategy analyst Jeff
    Walton predicted in the new Financial Times documentary, Michael Saylor’s $40
    billion Bitcoin bet.The company currently holds about 568,840 Bitcoin, worth roughly
    $59 billion, and Walton said that advantage could push it past all other publicly
    listed firms in the future.  “Strategy holds more of the best assets and the most
    pristine collateral on the entire planet than any other company, by multiples,”
    Walton said.Strategy raised $12 billion in 50 daysThe analyst pointed to the firm’s
    ability to rapidly raise capital as another indicator of its strength. In November
    2024, Strategy raised $12 billion in just 50 days.“It’s incredibly hard to raise
    $100 million of capital, and they just raised $100 million of capital 120 times
    in 50 days, and they were able to buy Bitcoin with that capital. That’s insane,”
    Walton said.Strategy analyst Jeff Walton in the Financial Times’ documentary “Michael
    Saylor’s $40 billion Bitcoin bet.” Source: YouTubeIn the documentary, Saylor also
    paints a bullish picture of the future due to Bitcoin adoption by Strategy, formerly
    MicroStrategy.Saylor says Strategy will become a $10 trillion company“I think
    that MicroStrategy is in a position where we can grow from a $100 billion enterprise
    to a $1 trillion enterprise to a $10 trillion enterprise,” Saylor said.He also
    predicted that Bitcoin would one day reach a price of $13 million per coin:“My
    forecast for 2045 is 13 million a Bitcoin. I would think in the four to eight
    year time frame. Certainly, in 10 years we should be at a million. So one million
    in 10 years you know 10X that or more in 20 years.”Related: Coinbase considered
    Saylor-like Bitcoin strategy before opting out: BloombergWalton and Saylor’s predictions
    on Strategy potentially beating all publicly traded equities in the future come
    as the company ranks as the 151st largest company in the world, with a market
    capitalization of $117 billion, according to CompaniesMarketCap.Strategy (MSTR)
    stock against the top five stocks globally by market capitalization. Source: CompaniesMarketCapTo
    become the largest, Strategy would need to surpass Microsoft, whose current market

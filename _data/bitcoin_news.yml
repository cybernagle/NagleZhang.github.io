- title: " Multi-wallet usage up 16%, but AI may address crypto fragmentation gap "
  url: https://cointelegraph.com/news/multi-wallet-usage-16-ai-address-crypto-fragmentation-gap?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Fragmentation and complicated user experience remain two of the most significant
    obstacles to cryptocurrency’s mainstream adoption, according to a new industry
    report. Most users now use at least two wallets to manage their cryptocurrency
    investments.The lack of interoperability across blockchains means users need to
    create multiple wallets to interact with different networks, with users having
    at least two wallets rising by 16% over the past year. According to a research
    report published by onchain user experience platform Reown and crypto intelligence
    firm Nansen, 62% of crypto users reported using at least two wallets over the
    past three months, up from 45% in 2024.More than 18% of respondents said security
    was their top concern related to wallet use, while 10.6% cited poor user experience
    as the biggest issue.Wallet usage over the past 3 months. Source: Nansen, ReownRelated:
    Bitcoin volatility lowest in 563 days, Hayes predicts $1M BTC by 2028AI integration
    may be next “breakthrough” for crypto wallets“We’re at a pivotal moment in the
    evolution of wallet UX,” according to Eowyn Chen, the CEO at Trust Wallet. “The
    next wave of users, especially those coming from traditional Web2 or emerging
    markets, are bringing new expectations that challenge how we design tools and
    interfaces.”Chen said wallets are shifting from asset storage tools to becoming
    the primary gateway to Web3 services, including digital identity, financial products,
    governance and gaming.“That’s why we see wallets evolving into intelligent, personal
    companions — tools that not only hold your assets, but understand your behaviour,
    preferences, and needs,” she said.Chen added that integrating artificial intelligence
    agents could help users navigate Web3 as easily as they shop online, while also
    reducing risks from scams such as phishing attacks. These scams typically involve
    tricking victims into sending assets to fake wallet addresses.The need for more
    robust wallets became more apparent after an unknown attacker stole $330 million
    worth of Bitcoin (BTC) in a social engineering scam from an elderly US citizen,
    Cointelegraph reported on April 28.Related: Crypto hackers hit DeFi for $92M in
    April as attacks double from MarchMobile wallets dominate, hardware wallet usage
    on the riseOut of the 1,000 surveyed participants, 51% of users preferred using
    a mobile wallet, down from 54.8% in 2024.Mobile vs hardware wallet usage. Source:
    Nansen, ReownOnly 10% of the respondents preferred using a hardware wallet, up
    from just 7% a year ago, signaling that hardware wallets are slowly gaining traction
    among more advanced crypto users. However, only 3% of new investors reported using
    a hardware wallet.Social wallets, which are connected to a user’s email or other
    social account and require no seed phrase, have “transformed onboarding,” and
    are at the “forefront of UX innovation, quickly adopting technologies like passkey
    signers and gas abstraction,” according to Derek Rein, chief technical officer
    at Reown. He added:“Crucially, they prioritize simple, easy design, users shouldn’t
    need to understand gas tokens or chain switching just to transact.”Sentiment around
    social wallets. Source: Nansen, Reown However, users are still hesitant, with
    39% of surveyed respondents saying that improved security and trust would help
    them adopt social wallets.Magazine: Ethereum is destroying the competition in
    the $16.1T TradFi tokenization race\n\n            "
  published: 2025-05-01 09:22:09.000000000 +01:00
- title: " ‘Bad breach of ethics’ — Musk echoes crypto execs in backlash against WSJ "
  url: https://cointelegraph.com/news/musk-joins-crypto-leaders-in-slamming-wsj-over-false-reporting?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Tesla CEO Elon Musk has lashed out at The Wall Street Journal (WSJ), calling
    the publication’s latest report “an EXTREMELY BAD BREACH OF ETHICS,” after it
    claimed the Tesla board was actively seeking his replacement as CEO.The report,
    published on April 30, alleged that the board had approached recruitment firms
    due to concerns over Musk’s political activity and split focus across multiple
    ventures.Musk took to X to denounce the article, stating that the WSJ deliberately
    published false information while knowingly excluding an “unequivocal denial”
    from Tesla’s board.Tesla board chair Robyn Denholm also issued a strong rebuttal
    early Thursday morning, posting on Tesla’s official X account that the board had
    not contacted recruiters.“This is absolutely false,” she said. “The CEO of Tesla
    is Elon Musk and the Board is highly confident in his ability to continue executing
    on the exciting growth plan ahead.”Musk and Tesla board dismissing WSJ report.
    Source: Elon MuskRelated: WSJ debacle fueled US lawmakers’ ill-informed crusade
    against cryptoMusk under scrutiny for role in DOGEThe WSJ’s report comes amid
    growing scrutiny of Musk’s political involvement, particularly his advisory role
    in US President Donald Trump’s Department of Government Efficiency (DOGE).Critics
    argue that his involvement with the Trump administration has hurt Tesla’s brand,
    especially in international markets. Tesla’s first-quarter profit plunged 71%,
    and its market value has declined by over $800 billion since the start of the
    year.The automaker’s Q1 results released show revenues hit $19.34 billion, missing
    Wall Street estimates by 7.85% and marking a 9.2% fall from the same period last
    year.However, the firm held onto its Bitcoin during the first quarter of 2025.
    Tesla’s digital asset holdings dropped 11.61% in value from $1.076 billion to
    $951 million in Q1, alongside Bitcoin’s 11.56% price fall to $82,514 over the
    same time.Musk, who also runs SpaceX, Neuralink, and the recently merged X and
    xAI, has agreed to shift more of his time back to Tesla in response to shareholder
    pressure. According to reports, he is now advising DOGE remotely and has scaled
    back his physical presence in Washington.Related: Elon Musk’s sale of X to xAI
    just made fraud lawsuit ’a lot spicer’Crypto executives lash out at WSJMusk’s
    backlash against the WSJ adds to a growing chorus of criticism from crypto executives
    who have recently accused the outlet of misleading coverage and bias against the
    digital asset industry.On April 12, Binance’s former CEO Changpeng Zhao dismissed
    a WSJ report that claimed he has agreed to provide evidence against Tron founder
    Justin Sun as part of a plea deal with the United States Department of Justice
    (DOJ).“WSJ is really TRYING here. They seem to have forgotten who went to prison
    and who didn’t,” Zhao wrote in an April 12 X post. “People who become gov witnesses
    don’t go to prison. They are protected. I heard someone paid WSJ employees to
    smear me.”Soruce: CZIn March 2023, Tether also rejected a WSJ report alleging
    it used fake documents and shell companies to maintain banking access, calling
    the claims “stale,” “inaccurate,” and “misleading.”Magazine: Binance hits back
    at WSJ, Hong Kong crypto ETF’s take ‘$50B equivalent’: Asia Express\n\n            "
  published: 2025-05-01 08:37:53.000000000 +01:00
- title: " Strategy ends April up 32% in best month since November as Q1 earnings
    loom "
  url: https://cointelegraph.com/news/michael-saylor-strategy-mstr-stock-price-april-surge-earnings-call?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Key takeaways:Strategy’s stock rose 32% in April, its biggest monthly
    gain since November.Speculation is building that Strategy will announce a major
    capital raise during its Q1 earnings call on May 1 as it continues to grow its
    Bitcoin holdings.Analysts expect a 1% year-on-year revenue bump to $116.6 million,
    following the firm’s $120.7 million revenues for Q4 2024.Michael Saylor’s Strategy
    closed April with its highest monthly gain since November, ahead of the firm’s
    highly anticipated earnings call on May 1.Strategy (MSTR), formerly known as MicroStrategy,
    closed April 30 trading at $380.11, a 32% increase from its closing price of $288
    on March 31, according to Google Finance data.Speculation mounts on “huge capital
    raise” It’s Strategy's highest monthly gain in five months, following a 59% rise
    over November as the value of its vast Bitcoin (BTC) holdings swelled amid a price
    rally that saw BTC reach $100,000 for the first time on Dec. 5, which was kicked
    off by Donald Trump’s Nov. 5 election win.Source: Mark HarveyThe recent surge
    in Strategy’s stock price comes as the firm prepares to announce its first-quarter
    2025 results after the US markets close on May 1. Saylor will host a webinar to
    discuss the results shortly after, at 9 pm UTC.According to Seeking Alpha, analysts
    expect Strategy to report revenue of $116.6 million, reflecting a 1% year-on-year
    increase. The analytics firm also said that Strategy has beaten revenue estimates
    25% of the time over the past two years.The estimate represents a 3.40% decline
    compared to the previous quarter. The firm reported $120.7 million in revenue
    in the fourth quarter of 2024, marking a 3% year-on-year fall that missed analyst
    estimates by about $2 million.Strategy reported a net loss of $670.8 million in
    Q4 2024 as the firm stacked an additional 218,887 Bitcoin.Apollo Sat's founder
    Thomas Fahrer said in an April 30 X post, that “MSTR will announce a huge capital
    raise in their earnings call tomorrow. $100B is in play.”Related: Strategy added
    15,355 Bitcoin for $1.42B as the price surged above $90KOn March 10, Strategy
    announced that it had entered into a new sales agreement that would allow the
    firm to issue and sell shares of its 8% Series A perpetual strike preferred stock
    to raise funds for general corporate purposes, including potential Bitcoin acquisitions.At
    the time of publication, Strategy is holding 553,555 Bitcoin, worth approximately
    $52.57 billion, according to Saylor Tracker data.Meanwhile, Syz Capital partner
    Richard Byworth recently mulled over the idea that Strategy should take a more
    aggressive approach to buying Bitcoin by acquiring companies to use their cash
    holdings to fund purchases and do away with over-the-counter buys.“Should Saylor
    buy Bitcoin really carelessly? As in, not try and buy it through OTC desks…and
    actually just buy it with the intention of massively ramping the price,” Byworth
    said.Magazine: TV hit Peaky Blinders to launch crypto game, FIFA Rivals on Polkadot:
    Web3 GamerThis article does not contain investment advice or recommendations.
    Every investment and trading move involves risk, and readers should conduct their
    own research when making a decision.\n\n            "

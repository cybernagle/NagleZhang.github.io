- title: " Bitcoin must close the week above this level to start &#039;price discovery
    2&#039; "
  url: https://cointelegraph.com/news/bitcoin-must-close-week-this-level-start-price-discovery?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Key points:Bitcoin analysis identifies the all-important price point to
    hold into the weekly close as all-time highs loom.Liquidity is tightly clustered
    around current spot price, with $106,000 the likely next battleground.Some traders
    are expecting the bid to enter price discovery to fail.Bitcoin (BTC) preserved
    giant gains into the May 11 weekly close as analysis flagged the key level to
    hold next.BTC/USD 1-hour chart. Source: Cointelegraph/TradingViewAnalysis: BTC
    price can “kickstart the breakout process”Data from Cointelegraph Markets Pro
    and TradingView showed weekend upside volatility, delivering new multimonth highs
    of nearly $105,000.A lack of liquidity during “out of hours” trading contributed
    to the move, which once more came on the back of positive rumors over a US-China
    trade deal.$BTCalmost tagging $105K off again headlinesmarkets will want to see
    fruition of Trumps comments regarding a path forward with trade between US & ChinaShipping
    data does already suggest insiders know hence container volume has briefly picked
    up again pic.twitter.com/AijqalylwS— Skew Δ (@52kskew) May 10, 2025Now, popular
    trader and analyst Rekt Capital confirmed that Bitcoin could even kickstart a
    return to all-time highs and price discovery.The all-important weekly close level
    to flip to support, he said, lay at around $104,500.“Can Bitcoin do it? Can Bitcoin
    Weekly Close above the Range High of its recently reclaimed Re-Accumulation Range
    to kickstart the breakout process?” he queried in a post on X alongside an explanatory
    chart.“Bitcoin is on the cusp of beginning Price Discovery Uptrend 2.”BTC/USD
    1-week chart. Source: Rekt Capital/XAn additional update calculated the current
    Bitcoin bull market as 85.5% complete, yet with the most erratic upswings still
    to come.#BTC Bull Market Progress:▓▓▓▓▓▓▓▓░░ 85.5%(Progress will speed up on Parabolic
    advances)$BTC #Crypto #Bitcoin pic.twitter.com/Qe88NVmo2z— Rekt Capital (@rektcapital)
    May 9, 2025A look at the latest exchange order book data from monitoring resource
    CoinGlass showed a large cloud of asks clustered around the area immediately below
    $106,000 at the time of writing.Bids were laddered down to $102,000, creating
    a thickening band of liquidity around spot price into the weekly close.BTC liquidation
    heatmap. Source: CoinGlassBitcoin can still retrace “entire move”Some market participants
    remained bearish on short timeframes.Related: Is Bitcoin about to go parabolic?
    BTC price targets include $160K nextOn X, popular trader HTL-NL argued that the

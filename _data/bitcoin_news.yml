- title: " Bunq, Europe’s second-largest neobank, expands into crypto "
  url: https://cointelegraph.com/news/bunq-europe-second-largest-neobank-expands-crypto?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Update (April 29 at 8:54 pm UTC): This article has been updated to include
    comments from Bunq's CEO to Cointelegraph. Europe’s second-largest neobank, Bunq,
    is expanding into cryptocurrency, citing growing retail investor demand for digital
    assets worldwide.The Amsterdam-based neobank announced the launch of Bunq Crypto
    on April 29, a new offering enabling its users to invest in over 300 cryptocurrencies,
    including Bitcoin (BTC), Ether (ETH) and Solana (SOL).Starting April 29, Bunq
    users in the Netherlands, France, Spain, Ireland, Italy and Belgium will be able
    to access cryptocurrencies directly through the Bunq app, according to an announcement.Bunq
    CEO Ali Niknam told Cointelegraph that the move was driven by growing client demand
    for digital assets. \"We believe that now many, many people, the large majority,
    are interested in crypto, and we believe that they're interested in buying crypto
    through an environment that they can trust, and they can relate to and they can
    recognize,\" he said.  Bunq's update event. Source: Bunq/CointelegraphMoreover,
    a friendlier regulatory landscape helped clear the path for the bank’s expansion
    into crypto. \"I think for a long time, the future of crypto from a regulatory
    perspective was a bit unclear. And we have seen a lot of that change over the
    course of the past couple of months. And so we felt sufficiently assured as a
    regulated entity to now offer this to the general public,\" Niknam said.The crypto
    offering is powered in partnership with Kraken, the 14th-largest centralized cryptocurrency
    exchange globally by trading volume.Related: Coinbase to launch yield-bearing
    Bitcoin fund for institutionsAll-in-one financial platforms in focusThis marks
    the first phase of Bunq’s global crypto expansion, with plans to gradually roll
    out trading across the entire European Economic Area, as well as in the United
    States and the United Kingdom.  As of June 2024, Bunq reported more than 12.5
    million users, up from nine million users a year earlier.  Bunq’s move reflects
    a broader trend among financial institutions seeking to consolidate services —
    banking, savings and investing — into single digital platforms.  In a February
    post on X, Coinbase CEO Brian Armstrong said he expects future financial systems
    to be anchored by “a single primary financial account” where users manage all
    their financial activities.Related: Bitcoin treasury firms driving $200T hyperbitcoinization
    — Adam BackDemand for simplified crypto accessResearch commissioned by Bunq indicates
    a significant gap between available crypto offerings and user expectations in
    Europe. An estimated 65% of European consumers are seeking a unified platform
    to manage banking, savings and cryptocurrency investments, according to the study.
    \ Over 50% of surveyed investors want crypto exposure but said the existing platforms
    don’t meet their requirements, particularly regarding simplicity and security
    for new investors.“Our users across the world have long waited for a simple, safe
    and straightforward way to invest in digital assets,” said Ali Niknam, founder
    and CEO of Bunq. “Now, everything they will ever need to save, spend and invest
    — including crypto — is on one platform.”Bunq’s crypto expansion follows Revolut’s
    move in November 2024 to expand its crypto exchange services across 30 European
    Economic Area markets.  Magazine: Ethereum is destroying the competition in the
    $16.1T TradFi tokenization race\n\n            "
  published: 2025-04-29 20:00:00.000000000 +01:00
- title: " Bitcoin &#039;hot supply&#039; nears $40B as new investors flood in at
    $95K "
  url: https://cointelegraph.com/news/bitcoin-hot-supply-nears-40b-new-investors-flood-in-at-95k?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Key points:Bitcoin’s most recently-moved supply segment is increasing
    as higher prices see an influx of “speculative capital.”“Hot supply” has doubled
    in just five weeks versus local lows in March.Active address numbers have yet
    to mimic a classic bull market comeback.Bitcoin (BTC) short-term holders (STHs)
    are back in the game as a “speculative capital” enters the market.In an X thread
    on April 29, onchain analytics firm Glassnode reported a surge in Bitcoin’s so-called
    “hot capital.”Bitcoin sees “surge in capital turnover”New investors are entering
    the market as BTC price action circles its highest levels in several months.Glassnode
    reveals that the sum of coins which last moved up to a week ago has reached its
    largest figure since early February.“This metric captures short-term holder activity
    and is a proxy for speculative capital entering the market,” it explains.In the
    past week alone, hot capital has shot up by over 90% to near $40 billion. Since
    local lows in late March, hot capital has increased by $21.5 billion, a “surge
    in capital turnover” which underscores a sea change in market sentiment.“BTC hot
    capital bottomed at $17.5B on 23 Mar - its lowest level since Dec,” Glassnode
    summarizes. “In just 5 weeks, it has added over $21.5B, suggesting a rapid shift
    from dormancy to speculation among newer market entrants.”Bitcoin “hot supply”
    data. Source: Glassnode/XBTC bull market comeback in progressAs Cointelegraph
    continues to report, STH investors have recently returned to aggregate profit
    as price hovers near $95,000.Related: Bitcoin in 'critical zone' as triple breakout
    meets $93.5K support battleAnalyzing overall network participation, however, Glassnode
    suggested that a full bull market comeback has not yet taken place.“Signs of early
    FOMO are emerging, with the Hot Capital Share ticking higher and profitability
    metrics like Percent Supply in Profit (86%) and NUPL (0.53) expanding notably,”
    it wrote in an introduction to its latest “Market Pulse” analysis piece released
    on April 28.“However, while on-chain activity such as transfer volume and fees
    are recovering, daily active addresses remain suppressed, suggesting that full
    organic network engagement is still rebuilding.”Bitcoin active addresses (7-day
    simple moving average). Source: GlassnodeEarlier this week, other sources reported
    on the potential dangers of “FOMO” when it comes to an enduring BTC price recovery.This
    article does not contain investment advice or recommendations. Every investment
    and trading move involves risk, and readers should conduct their own research
    when making a decision.New analysis on April 29 from Axel Adler Jr., a contributor
    to onchain analytics platform CryptoQuant, shows \n\n            "

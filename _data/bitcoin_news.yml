- title: " Strategy, Semler bag 2K Bitcoin as price edged toward $100K last week "
  url: https://cointelegraph.com/news/strategy-semler-buy-2000-bitcoin-price-tested-97000-last-week?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Michael Saylor’s Strategy, one of the world’s largest corporate Bitcoin
    investors, slowed its BTC purchases last week as the cryptocurrency briefly surged
    above $97,000.Strategy acquired 1,895 Bitcoin (BTC) for $180.3 million during
    the week from April 28 to May 4 at an average price of $95,167 per BTC, the firm
    announced in its latest Form-8 filing with the US Securities and Exchange Commission.Strategy’s
    latest Bitcoin purchase is one of the smallest made by the company this year,
    alongside a comparatively meagre 130 BTC purchase in March.Source: Michael SaylorThe
    latest buy is 87% less than the previous purchase of 15,355 BTC announced last
    Monday.Semler boosts buying despite rising pricesWhile Saylor’s Strategy cooled
    its Bitcoin buying spree last week, others upped their appetite for BTC.Semler
    Scientific, a publicly traded US healthtech firm, bought 167 Bitcoin for $16.2
    million in the period from April 30 to May 2 at an average purchase price of $97,093
    BTC.Announced on May 5, the purchase by Semler was up at least 50% from the previous
    111 BTC purchase by the firm announced on April 25.Bitcoin price chart in the
    past 30 days. Source: CoinGeckoAs of May 2, Semler held 3,634 BTC, acquired for
    an aggregate of $322.3 million at an average purchase price of $88,668 per BTC.Semler’s
    Bitcoin holdings are considerably smaller than Strategy’s, which held 555,450
    BTC as of May 4, acquired for $68,550 per BTC.Strategy’s BTC gain surged to $5.8
    billion by May 1The new Bitcoin purchase by Strategy came shortly after the company
    announced its financial results for the first quarter of 2025 on May 1.According
    to the update, Strategy achieved a 13.7% BTC yield, an indicator representing
    the percentage change of the ratio between its BTC holdings and assumed diluted
    shares. The yield is close to the 15% yield targeted by Strategy in 2025.Source:
    Michael SaylorYear to date, Strategy’s gains on its Bitcoin investments also reached
    $5.8 billion, in line with its annual target of $10 billion.Additionally, Saylor
    said that the company has doubled its capital plan to $42 billion in equity and
    $42 billion in fixed income to purchase more Bitcoin.Magazine: Crypto wanted to
    overthrow banks, now it’s becoming them in stablecoin fight\n\n            "

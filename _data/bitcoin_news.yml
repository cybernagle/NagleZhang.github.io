- title: " Bitcoin looks ‘ridiculous’ as bulls attempt $2T market cap flip — Analyst "
  url: https://cointelegraph.com/news/bitcoin-looks-ridiculous-bulls-attempt-2t-market-cap-flip?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Key points:Bitcoin has a fight for a $100,000 price and a $2 trillion

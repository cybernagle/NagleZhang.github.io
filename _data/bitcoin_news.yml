- title: " Sorry bears — Bitcoin analysis dismisses $107K BTC price double top "
  url: https://cointelegraph.com/news/bitcoin-bears-analysis-dismisses-btc-price-double-top?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Key points:Bitcoin is not in line to cancel its attack on all-time highs,
    says the Bitcoin Fundamental Index (BFI).BTC price strength remains “intact,”
    says Swissblock Technologies, removing the risk of a double top.Historically,
    a return to within 10% of all-time highs delivers price discovery almost every
    time.Bitcoin (BTC) does not risk a “double top” bull market reversal with its
    trip past $107,000, new analysis says.In one of its latest X updates, private
    wealth manager Swissblock Technologies described BTC price strength as “intact.”BTC
    price indicator ignores double top “noise”Bitcoin shows “no signs of bearish divergence,”
    as seen through the lens of a basket of network indicators.Commenting on the latest
    signals from its Bitcoin Fundamental Index (BFI), Swissblock argued that despite
    being less than $5,000 from all-time highs, BTC/USD is not about to abandon its
    push into price discovery.“A lot of noise about a potential double top as $BTC
    struggles to break ATH,” it said.BFI combines various extant indicators into a
    single oscillator to provide insight into trend strength at a given price point.Since
    August 2024, BFI has stuck rigidly to its middle territory around the 50/100 mark,
    irrespective of price action.“Even during the Feb–Mar pullback, it held neutral,
    never dipped into weakness,” the post notes.Swissblock explained that if BTC/USD
    were to reverse now and head lower, leaving all-time highs untouched, BFI would
    already be “breaking down.”“On-chain strength is intact,” it concluded. “Bears:
    not this time, got to wait.”Bitcoin Fundamental Index (BFI). Source: Swissblock
    Technologies/XStats favor Bitcoin bullsThat perspective chimes with that of the
    majority of popular crypto market participants this month.Related: $107K fakeout
    or new all-time highs? 5 things to know in Bitcoin this weekAs Cointelegraph continues
    to report, price discovery is expected to reenter sooner rather than later, with
    one BTC price target for this week already at $116,000.On that topic, network
    economist Timothy Peterson used statistical analysis to assume a trip to at least
    $115,000 by the end of June.“Bitcoin has pulled to within 10% of its all-time
    high,” his X post from May 9 reads. “What happens next? This has happened nearly
    300 times since 2015. Within 50 days, Bitcoin made a new all-time high 98% of
    the time.”Peterson acknowledged that post-2020 gains have been more modest than
    those before, with an average 8% move giving BTC/USD a target of up to $125,000.This
    article does not contain investment advice or recommendations. Every investment
    and trading move involves risk, and readers should conduct their own research
    when making a decision.\n\n            "

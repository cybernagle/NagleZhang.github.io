- title: " Bitcoin apparent demand reaches lowest point in 2025 — CryptoQuant "
  url: https://cointelegraph.com/news/bitcoin-demand-lowest-point-2025?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMTIvMDE5M2JmM2UtZWU2NC03OTFlLTkwODEtMzc4N2JmYTI5MDBj.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMTIvMDE5M2JmM2UtZWU2NC03OTFlLTkwODEtMzc4N2JmYTI5MDBj.jpg\"
    alt=\"Bitcoin apparent demand reaches lowest point in 2025 — CryptoQuant\"></p><p>Apparent
    demand for Bitcoin (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>) has hit the
    lowest level in 2025, dropping down into negative territory, as traders and investors
    take a cautious approach to risk-on assets due to macroeconomic uncertainty. <p>According
    to CryptoQuant's Bitcoin Apparent Demand metric, demand for Bitcoin has dropped
    down to a negative 142 on March 13.</p><p>Bitcoin's apparent demand has been positive
    since September 2024, peaking around December 2024 before beginning the slow descent
    back down.</p><p>However, demand levels stayed positive until the beginning of
    March 2025 and have continued to decline since that point.</p><p>Fears of a <a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-price-drops-2-falling-inflation-us-trade-war-fears\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">prolonged trade war</a>,
    geopolitical tensions, and stubbornly high inflation, <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/us-cpi-lower-expected-rate-cuts-coming\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">which is cooling</a>
    but is nevertheless above the Federal Reserve&rsquo;s 2% target, are causing traders
    to take a step back from riskier assets and into safe havens such as cash and
    government securities.</p><figure><img alt=\"Bitcoin Price, Economy\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01959656-6932-7132-ad70-5610bfb822b8\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Bitcoin apparent demand.
    Source: </em><a data-ct-non-breakable=\"null\" href=\"https://cryptoquant.com/insights/quicktake/67d366b1a9545929ecce5c8c-The-weakest-Bitcoin-demand-of-the-year\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://cryptoquant.com/insights/quicktake/67d366b1a9545929ecce5c8c-The-weakest-Bitcoin-demand-of-the-year\"><em>CryptoQuant</em></a></p></figcaption></figure><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/worst-crypto-cycle-community-history-bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Worst crypto
    cycle ever? Community and history say otherwise</strong></em></a></p><h2>Crypto
    markets hemorrhage amid macroeconomic uncertainty</h2><p>The post-election hype
    has died down following the <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-investors-mixed-reactions-white-house-crypto-summit\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">mixed reactions from
    investors</a> to the White House Crypto Summit on March 7, as the realities of
    macroeconomic uncertainty and the political process set in.</p><p>Despite lower-than-expected
    CPI inflation figures reported on March 12, the <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-battles-us-sellers-cpi-inflation-sees-first-drop-since-mid-2024\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">price of Bitcoin declined</a>
    immediately following the news.</p><p>Crypto exchange-traded funds (ETFs) experienced
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/crypto-etps-4th-consecutive-outflows-at-876m-coin-shares\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">four consecutive weeks
    of outflows</a> beginning in February and the early weeks of March as traditional
    financial investors sought a flight to safety.</p><p>According to <a data-ct-non-breakable=\"null\"
    href=\"https://medium.com/coinshares/volume-224-digital-asset-fund-flows-weekly-report-ab149271a545\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">CoinShares</a>, outflows
    from crypto ETFs totaled $4.75 billion over the past four weeks, with BTC investment
    vehicles recording $756 million in month-to-date outflows.</p><p>Poor market sentiment
    and <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-bull-market-in-peril-as-us-recession-and-tariff-worries-loom\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">fears of a looming recession</a>
    triggered a <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-panic-selling-speculators-100-m-6-weeks-research\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">wave of panic selling</a>
    that sent crypto prices tumbling.</p><p>Since the Trump inauguration on Jan. 20,
    the Total3 Market Cap, a <a data-ct-non-breakable=\"null\" href=\"https://www.tradingview.com/chart/g7xkPkTa/?symbol=BITSTAMP%3ABTCUSD\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">measure</a> of the total
    crypto market capitalization excluding Ether (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/ethereum-price\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">ETH</a>) and BTC, plummeted by over 27% from over
    $1.1 trillion to approximately $795 billion.</p><figure><img alt=\"Bitcoin Price,
    Economy\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01959657-1995-7d59-9e87-16933231e69b\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Bitcoin price action
    and analysis. Source: </em><a data-ct-non-breakable=\"null\" href=\"https://www.tradingview.com/chart/g7xkPkTa/?symbol=BITSTAMP%3ABTCUSD\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://www.tradingview.com/chart/g7xkPkTa/?symbol=BITSTAMP%3ABTCUSD\"><em>TradingView</em></a></p></figcaption></figure><p>Similarly,
    the price of Bitcoin declined by over 22% from a high of over $109,000 to present
    levels.</p><p>Bitcoin has been trading below its 200-day exponential moving average
    (EMA) since March 9, with occasional dips below the 200-day EMA during February.</p><p>Bitcoin's
    Average True Range (ATR), a measure of volatility, is currently over 5,035 &mdash;
    indicating significant price swings as markets grapple with macro factors.</p><p>Crypto
    analyst Matthew Hyland recently <a data-ct-non-breakable=\"null\" href=\"https://x.com/MatthewHyland_/status/1899981232672563710\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">argued</a> that Bitcoin
    must <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-price-weekly-close-89k-bottom-resume-uptrend-crypto-analyst\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">secure a close of at
    least $89,000</a> on the weekly timeframe or risk a further correction to $69,000.</p><p><em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/bitcoiners-all-in-trump-since-bitcoin-2024-getting-risky/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Bitcoiners
    are &lsquo;all in&rsquo; on Trump since Bitcoin &rsquo;24, but it&rsquo;s getting
    risky</strong></em></a></p><p class=\"post-content__disclaimer\" type=\"\">This
    article does not contain investment advice or recommendations. Every investment
    and trading move involves risk, and readers should conduct their own research
    when making a decision.</p><template data-name=\"subscription_form\" data-type=\"markets_outlook\"
    label=\"Subscription Form: Markets Outlook\"></template></p>\n</p>\n            "

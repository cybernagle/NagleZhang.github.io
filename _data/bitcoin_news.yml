- title: " Bitcoin holds firm as stocks lose $5T in record Trump tariff sell-off "
  url: https://cointelegraph.com/news/bitcoin-outperforms-stock-market-during-trump-tariff-selloff?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin is gaining renewed attention as a hedge against financial instability
    after holding relatively steady during a record-breaking stock market downturn
    that saw $5 trillion wiped from the S&P 500.The S&P 500 posted a $5 trillion loss
    in market capitalization over two days, its largest drop on record, surpassing
    the $3.3 trillion decline in March 2020 during the initial wave of the COVID-19
    pandemic, according to an April 5 report by Reuters.The record sell-off occurred
    after US President Donald Trump announced his reciprocal import tariffs on April
    2. The measures aim to shrink the country’s estimated trade deficit of $1.2 trillion
    in goods and boost domestic manufacturing.S&P 500 record $5.4 trillion loss. Source:
    ZerohedgeBitcoin’s (BTC) dip after the tariff announcement was significantly smaller
    than traditional markets, proving Bitcoin’s growing maturity as a global asset,
    according to Marcin Kazmierczak, co-founder and chief operating officer of RedStone
    blockchain oracle firm.“What we’re potentially witnessing is an evolution in Bitcoin’s
    market positioning,” the co-founder told Cointelegraph, adding:“Historically,
    Bitcoin has been strongly correlated with risk assets during macro shocks, but
    this divergence might signal an emerging perception shift among investors.”“Bitcoin’s
    fixed supply architecture inherently contrasts with fiat currencies that may face
    inflationary pressure under tariff-driven economic changes,” he added.Related:
    70% chance of crypto bottoming before June amid trade fears: NansenWhile stocks
    plunged, Bitcoin dipped just 3.7% over the same two-day period, trading at around
    $83,600 as of April 5, according to TradingView data.BTC/USD, 1-hour chart. Source:
    Cointelegraph/TradingViewDespite the $5 trillion sell-off in traditional markets,
    “BTC shows its worth, staying above its $82,000 key support level — a sign that
    structural demand remains intact even amid forced selling and elevated volatility,”
    Nexo dispatch analyst Iliya Kalchev told Cointelegraph.Related: Michael Saylor’s
    Strategy buys Bitcoin dip with $1.9B purchaseBitcoin may emerge as “digital gold”
    amid Trump tariff talksDespite Bitcoin’s decoupling from traditional stocks, its
    initial plunge in price signals that some investors still see Bitcoin as a risk
    asset, according to James Wo, the founder and CEO of venture capital firm DFG.“With
    Bitcoin ETFs enabling greater institutional exposure, it is now even more influenced
    by macroeconomic trends,” Wo told Cointelegraph, adding:“However, if Bitcoin remains
    resilient amid ongoing uncertainty, its hard-capped supply and decentralized nature
    could not only strengthen its ‘digital gold’ narrative but also position it as
    an even more reliable store of value.”Despite the current lack of momentum, analysts
    are confident in Bitcoin’s upside potential for the rest of 2025.BTC projected
    to reach $132,000 based on M2 money supply growth. Source: Jamie CouttsThe growing
    money supply could push Bitcoin’s price above $132,000 before the end of 2025,
    according to estimates from Jamie Coutts, chief crypto analyst at Real Vision.Magazine:
    Bitcoin ATH sooner than expected? XRP may drop 40%, and more: Hodler’s Digest,
    March 23 – 29\n\n            "

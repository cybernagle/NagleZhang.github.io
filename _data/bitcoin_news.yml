- title: " Arizona legislature passes Bitcoin reserve bills, moving closer to stockpiling
    crypto "
  url: https://cointelegraph.com/news/arizona-legislature-bitcoin-reserve-bill-third-reading?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Lawmakers in the Arizona House of Representatives passed two bills that
    could allow the state to adopt a reserve using Bitcoin (BTC) or other cryptocurrencies.In
    a third reading on April 28 of Senate Bill 1025 (SB1025), a proposal to amend
    Arizona’s statutes to allow for a strategic BTC reserve, 31 members of the Arizona
    House voted in favor of the bill, with 25 opposed. A similar bill, SB1373, to
    establish a state-level digital assets reserve, passed with 37 lawmakers in favor
    and 19 voting nay.“This bill basically takes the approach that probably 15 other
    states are considering the same legislation nationwide that allows the treasurer
    to invest up to 10% into, probably mainly Bitcoin but other things as well,” said
    State Representative Jeff Weninger on SB1025. “I think this probably would start
    as a ‘may’ for the foreseeable future, but as things continue to pivot towards
    Bitcoin and these things, would have that already in place in the future.”Voting
    for SB1025 in the Arizona House of Representatives on April 28. Source: Arizona
    State LegislatureThe approvals bring the bills closer than any other state-level
    initiative in the US to getting a cryptocurrency or Bitcoin strategic reserve
    signed into law. Similar legislation proposed in New Hampshire passed the state’s
    House in April and is expected to head to the Senate for a full floor vote soon.Related:
    Bitcoin reserve backlash signals unrealistic industry expectationsArizona Governor
    Katie Hobbs announced on April 17 that she intended to veto any bill until lawmakers
    had a “serious, bipartisan funding solution that protects healthcare for Arizonans
    with disabilities.” However, with the passage of such legislation on April 24,
    the governor could be more open to signing SB1025 or SB1373 into law.Federal plans
    to establish a national crypto reserveThe state-level efforts to create Bitcoin
    reserves come amid a push from US President Donald Trump and Republican lawmakers
    to do the same in the federal government. Trump signed an executive order in March
    with a proposal for a “Strategic Bitcoin Reserve” and a “Digital Asset Stockpile.”Wyoming
    Senator Cynthia Lummis, a crypto advocate, proposed that Congress pass legislation
    that could allow the US government to hold more than 1 million BTC, in part through
    crypto seized through civil or criminal forfeiture. Some lawmakers have suggested
    Lummis’s bill was an attempt by Congress to codify Trump’s executive order into
    law.Magazine: Bitcoin $100K hopes on ice, SBF’s mysterious prison move: Hodler’s
    Digest, April 20 – 26\n\n            "

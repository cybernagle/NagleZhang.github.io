- title: " Russian national arrested in South Korea for attempted crypto robbery "
  url: https://cointelegraph.com/news/russian-arrested-south-korea-attempted-crypto-robbery?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "South Korean authorities have arrested one of three Russian nationals
    accused of an attempted robbery during a fake crypto deal in Seoul. The suspects
    allegedly lured Korean investors to a hotel, where they tried to steal 1 billion
    won (approximately $730,000) in cash.The Gangseo Police Precinct in Seoul detained
    a man in his 20s in Busan on May 27, according to a report by local news outlet
    JoongAng Daily. The suspect faces charges of assault and attempted robbery. The
    other two suspects reportedly fled South Korea shortly after the incident.According
    to investigators, the robbery attempt occurred on May 21 at a hotel in Seoul’s
    Gangseo District. The suspects posed as participants in a peer-to-peer crypto
    transaction and invited 10 Korean men to the hotel.Two were called to the room
    while the others waited in the lobby. Inside the room, the suspects — wearing
    protective vests — ambushed the victims with a replica handgun and a telescopic
    baton, tying their hands with cable ties.Related: Another suspect to surrender
    in NYC crypto torture case: ReportsPolice seize weapons, launch global manhuntPer
    the report, one of the victims managed to escape and raise the alarm, prompting
    the suspects to flee without the cash. Police responded to an emergency call and
    found one man bleeding in the lobby.Officers discovered a cache of equipment in
    the suspects’ hotel room, including a replica firearm, batons, vests and a money
    counter. Police suspect the robbery had been carefully planned.A request to prevent
    the suspects from leaving the country was filed the next morning, but two had
    already departed. “We have requested assistance from Interpol to track down the
    suspects who fled overseas,” a police official reportedly said.Authorities are
    now questioning the detained suspect and preparing to seek a pretrial detention
    warrant.Related: Crypto investor loses $2.6M in stablecoins in double phishing
    scamRise in crypto crime incidentsThe incident comes amid a recent uptick in crypto-related
    violent crimes, including kidnapping and ransom cases.A Manhattan crypto investor
    faces serious charges after allegedly kidnapping and torturing an Italian man
    in a bid to extract access to digital assets.Source: Mario NawfalOn May 13, the
    family of Pierre Noizat, the co-founder and CEO of French crypto exchange Paymium,
    was targeted in an attempted kidnapping.In response, executives and investors
    in the crypto industry are increasingly seeking personal security services. On
    May 18, private firm Infinite Risks International reported a rise in requests
    for bodyguards and protection contracts from high-profile figures in the crypto
    space.Magazine: TradFi is building Ethereum L2s to tokenize trillions in RWAs:
    Inside story\n\n            "

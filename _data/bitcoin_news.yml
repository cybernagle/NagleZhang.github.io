- title: " Crypto ETPs see $1.7B in outflows, longest streak since 2015 "
  url: https://cointelegraph.com/news/crypto-etps-see-1-7b-outflows-fifth-week-in-row?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWEzYjQtZjYzMy03YWZhLTk5MzktYmVlYWE5MTE2ZjFl.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWEzYjQtZjYzMy03YWZhLTk5MzktYmVlYWE5MTE2ZjFl.jpg\"
    alt=\"Crypto ETPs see $1.7B in outflows, longest streak since 2015\"></p><p>Cryptocurrency
    exchange-traded products (ETPs) continued seeing massive selling last week, recording
    the fifth week of outflows in a row, with $1.7 billion leaving the market.&nbsp;<p>After
    seeing slightly softened outflows of $876 million in the previous week, crypto
    ETP liquidations accelerated during the past trading week, bringing the total
    five-week outflows to $6.4 billion, CoinShares <a data-ct-non-breakable=\"null\"
    href=\"https://blog.coinshares.com/volume-225-digital-asset-fund-flows-weekly-report-6f57a96f6d1a\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">reported</a> on March
    17.</p><p>The ongoing outflow strike has also marked the 17th straight day of
    outflows, the longest negative streak since CoinShares started records in 2015,
    CoinShares&rsquo; James Butterfill wrote.</p><p>Despite notable negative sentiment,
    year-to-date (YTD) inflows remain positive at $912 million, he added.</p><h2>Bitcoin
    ETP outflows: $5.4 billion in five weeks</h2><p>After seeing $756 million outflows
    in the first week of March, Bitcoin (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>) ETPs saw increased
    selling in the trading week from March 10 to March 14, seeing a further $978 million
    outflows.</p><p>The five-week selling streak brought total BTC ETP outflows to
    $5.4 billion, leaving just $612 million of YTD inflows by March 14.</p><figure><img
    alt=\"Investments, CoinShares, Ethereum ETF, Bitcoin ETF\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a3bd-2a42-7b06-a410-36370231ce91\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Flows by asset (in
    millions of US dollars). Source: CoinShares</em></p></figcaption></figure><p>Both
    Ether (<a data-ct-non-breakable=\"null\" href=\"/ethereum-price\" rel=\"null\"
    target=\"null\" text=\"null\" title=\"null\">ETH</a>) and Solana (<a data-ct-non-breakable=\"null\"
    href=\"/solana-price-index\" rel=\"null\" target=\"null\" text=\"null\" title=\"null\">SOL</a>)
    ETPs saw $175 million and $2.2 million outflows, respectively. XRP (<a data-ct-non-breakable=\"null\"
    href=\"/xrp-price-index\" rel=\"null\" target=\"null\" text=\"null\" title=\"null\">XRP</a>)
    ETPs continued to go against the trend, seeing a further $1.8 million in inflows.</p><p
    class=\"post-content__disclaimer\" type=\"\">This is a developing story, and further
    information will be added as it becomes available.</p><p><em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/xrp-analyst-price-sbf-parents-trump-pardon-kraken-staking-hodlers-digest/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>XRP to $4
    next? SBF&rsquo;s parents seek Trump pardon, and more: Hodler&rsquo;s Digest,
    Jan. 26 &ndash; Feb. 1</strong></em></a></p></p>\n</p>\n            "

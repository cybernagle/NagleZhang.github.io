- title: " BlackRock now holds over 567,000 BTC, valued at over $47 billion "
  url: https://cointelegraph.com/news/blackrock-holds-47-billion-bitcoin?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTk1NGYtY2Q4ZC03ZjNkLTliMjMtMjU4YzU0YzQ5MjY3.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTk1NGYtY2Q4ZC03ZjNkLTliMjMtMjU4YzU0YzQ5MjY3.jpg\"
    alt=\"BlackRock now holds over 567,000 BTC, valued at over $47 billion\"></p><p>BlackRock,
    the world&rsquo;s largest asset manager with approximately $11.6 trillion in assets
    under management, currently holds over 567,000 Bitcoin (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/bitcoin-price\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">BTC</a>), valued at over $47.8 billion &mdash; making
    the asset manager one of the largest holders of BTC in the world.<p>According
    to Arkham Intelligence, the asset manager&rsquo;s most recent BTC acquisition
    occurred on March 14 when a Coinbase Prime wallet transferred 268 BTC, valued
    at over $22 million, to the asset manager&rsquo;s iShares Bitcoin ETF (IBIT) wallet.</p><figure><img
    alt=\"Bitcoin ETF, BlackRock, ETF\" src=\"https://s3.cointelegraph.com/uploads/2025-03/019595d6-7a62-7141-b88e-b3790de71837\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Tracking onchain funds
    to and from BlackRock. Source: </em><a data-ct-non-breakable=\"null\" href=\"https://intel.arkm.com/explorer/entity/blackrock\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://intel.arkm.com/explorer/entity/blackrock\"><em>Arkham
    Intelligence </em></a></p></figcaption></figure><p>Data from Arkham also shows
    that the asset manager holds over 1.2 million Ether (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/ethereum-price\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">ETH</a>), valued at over $2.3 billion, roughly 70
    million of the USDC (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/usdc-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">USDC</a>) stablecoin
    and a long list of altcoins.</p><p>The Bitcoin exchange-traded funds (ETFs) are
    widely <a data-ct-non-breakable=\"null\" href=\"https://x.com/NateGeraci/status/1865961360326119861\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">cited</a> as the most
    successful ETF launch in history, as asset managers like BlackRock drive tens
    of billions in liquidity to the crypto markets and <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/altseason-bitcoin-etf-crypto-investment\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/altseason-bitcoin-etf-crypto-investment\">disrupt
    the cyclical capital rotation</a> that characterizes crypto investment.</p><figure><img
    alt=\"Bitcoin ETF, BlackRock, ETF\" src=\"https://s3.cointelegraph.com/uploads/2025-03/019595d7-447c-7ab7-b06f-fa0e3412d225\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>BlackRock&rsquo;s
    crypto holdings. Source: </em><a data-ct-non-breakable=\"null\" href=\"https://intel.arkm.com/explorer/entity/blackrock\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://intel.arkm.com/explorer/entity/blackrock\"><em>Arkham
    Intelligence</em></a></p></figcaption></figure><p><em><strong>Related: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/blackrock-bitcoin-fund-sheds-420-million-etf-losing-streak-extends\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/blackrock-bitcoin-fund-sheds-420-million-etf-losing-streak-extends\"><em><strong>BlackRock
    Bitcoin fund sheds $420M as ETF losing streak hits day 7</strong></em></a></p><h2>Crypto
    ETFs experience four weeks of outflows</h2><p>Crypto ETFs experienced <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/crypto-etps-4th-consecutive-outflows-at-876m-coin-shares\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/crypto-etps-4th-consecutive-outflows-at-876m-coin-shares\">four
    consecutive weeks of outflows</a> in February 2025 and early March due to macroeconomic
    uncertainty and fears over a <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-price-drops-2-falling-inflation-us-trade-war-fears\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-price-drops-2-falling-inflation-us-trade-war-fears\">prolonged
    trade war</a>.</p><p>According to CoinShares, outflows from the recent market
    downturn totaled $4.75 billion, with the week of March 9 recording a total of
    $876 million in outflows.</p><p>BlackRock&rsquo;s iShares Bitcoin fund experienced
    $193 million in outflows for the week of March 9, with all BTC ETFs recording
    $756 million in month-to-date outflows.</p><figure><img alt=\"Bitcoin ETF, BlackRock,
    ETF\" src=\"https://s3.cointelegraph.com/uploads/2025-03/019595d8-3023-7d70-b33b-1f8a3eedb352\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Weekly crypto fund
    flows show a recent downturn featuring four weeks of consecutive outflows. Source:
    </em><a data-ct-non-breakable=\"null\" href=\"https://blog.coinshares.com/volume-224-digital-asset-fund-flows-weekly-report-ab149271a545\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://blog.coinshares.com/volume-224-digital-asset-fund-flows-weekly-report-ab149271a545\"><em>CoinShares</em></a></p></figcaption></figure><p>Despite
    the heightened volatility and macroeconomic uncertainty, BlackRock <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/blackrock-adds-btc-etf-150-b-model-portfolio-product\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/blackrock-adds-btc-etf-150-b-model-portfolio-product\">added
    IBIT to its model portfolio</a> in February 2025.</p><p>BlackRock&rsquo;s model
    portfolios are preset investment plans that feature a range of diversified financial
    instruments and different risk profiles. The portfolios are promoted to asset
    managers, who pitch the preset investment plans to investors.</p><p>The inclusion
    of an ETF or an asset in the model portfolio can significantly boost inflows into
    the asset by attracting fresh capital.</p><p>In the case of IBIT, including the
    ETF in a preset investment portfolio will expose investors, who may take a more
    passive approach, to Bitcoin without those investors having to self-custody the
    digital asset or make any onchain transactions.</p><p><em><strong>Magazine: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/bitcoin-etf-coinbase-honeypot-hackers-government-trezor-ceo/\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/magazine/bitcoin-etf-coinbase-honeypot-hackers-government-trezor-ceo/\"><em><strong>Bitcoin
    ETFs make Coinbase a &lsquo;honeypot&rsquo; for hackers and governments: Trezor
    CEO</strong></em></a></p><template data-name=\"subscription_form\" data-type=\"markets_outlook\"
    label=\"Subscription Form: Markets Outlook\"></template></p>\n</p>\n            "

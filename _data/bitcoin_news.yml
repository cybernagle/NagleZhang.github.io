- title: " Bitcoin price retakes $80K as US stocks avoid &#039;Black Monday&#039;
    meltdown "
  url: https://cointelegraph.com/news/bitcoin-price-retakes-80-k-as-us-stocks-avoid-black-monday-meltdown?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin (BTC) sought a relief rally into the April 7 Wall Street open
    as US stocks rebounded from a 4%+ loss.BTC/USD 1-hour chart. Source: Cointelegraph/TradingViewBitcoin
    joins US stocks in relief rallyData from Cointelegraph Markets Pro and TradingView
    showed the area around $80,000 forming a focus for BTC/USD after the pair hit
    five-month lows.The fallout from US trade tariffs continued to ricochet across
    global markets, with Asia stocks closing the day with considerable losses.At the
    same time, reports of a potential 90-day pause in the tariffs going live, against
    a background of negotiations with over 50 US trading partners, helped pare losses
    in futures markets ahead of the open and allowed the S&P 500 and Nasdaq Composite
    Index to avert a ”Black Monday” 1987-style implosion.“Nasdaq futures were down
    nearly -7% at their lowest point last night,” trading resource The Kobeissi Letter
    noted in part of ongoing coverage on X.Kobeissi nonetheless acknowledged that
    the S&P 500 had fallen more than 20% from its February all-time highs, opening
    in “bear market territory” for the first time since 2022.S&P 500 1-day chart.
    Source: Cointelegraph/TradingViewContinuing, trading firm QCP Capital called international
    engagement over tariffs “remarkable.”“Yet as the world scrambles to secure a seat
    at the table, markets are likely to remain on edge,” it concluded in its latest
    bulletin to Telegram channel subscribers. “The president, showing no signs of
    backing down, remarked that he doesn't want stocks to fall, ‘but sometimes you
    have to take medicine.’ With confidence and the credibility of the U.S. economy
    hanging in the balance, the coming days could prove too bitter a pill for global
    markets, and for Trump himself, if meaningful progress isn't made before Wednesday.”Fed
    target rate probability comparison for May FOMC meeting. Source: CME GroupData
    from CME Group’s FedWatch Tool continued to show shifting market expectations
    on interest rate cuts by the Federal Reserve, with the upcoming meeting in June
    now favored as a deadline.BTC price safety net extends to $69,000Bitcoin meanwhile
    attempted to solidify support in the mid-$70,000 range, having come within spitting
    distance of old all-time highs from March 2024.Related: Black Monday 2.0? 5 things
    to know in Bitcoin this weekIn its latest observations, onchain analytics firm
    Glassnode revealed the lows coinciding with the realized price of large tranches
    of the BTC supply.“For now, $BTC seems to have found support at $74K. This aligns
    with the first major supply cluster below $80K - over 50K $BTC at $74.2K,” it
    reported on X. “This level is mostly held by investors who had been active for
    five months, steadily raising their cost basis until 10 March, after which they’ve
    remained dormant.”Bitcoin supply cost basis data. Source: Glassnode/XGlassnode
    added that between the lows and $70,000 was another 175,000 BTC of “cost basis
    clusters.”“The single largest level within this range is $71.6k, holding ~41k
    $BTC. The next more substantial support sits at $69.9k, where ~68k $BTC are held,”
    it confirmed.As Cointelegraph reported, $69,000 and the area nearby is seen as
    a reliable long-term BTC price support zone which is statistically unlikely to
    break down.This article does not contain investment advice or recommendations.
    Every investment and trading move involves risk, and readers should conduct their
    own research when making a decision.\n\n            "

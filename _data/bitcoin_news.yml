- title: " Crypto exploit, scam losses drop to $28.8M in March after February spike "
  url: https://cointelegraph.com/news/crypto-losses-exploits-scams-drops-29-million-march-certik?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Losses to crypto scams, exploits, and hacks dropped to just $28.8 million
    in March, far from February’s spike to $1.5 billion in losses after the Bybit
    hack.Code vulnerabilities accounted for the most losses, at over $14 million,
    while wallet compromises were used to steal over $8 million, blockchain security
    firm CertiK said in an April 1 post to X.The most significant loss for the month
    was the $13 million March 25 smart contract exploit of the decentralized lending
    protocol Abracadabra.money.After accounting for returned funds, a total of $28.8
    million was stolen through exploits, hacks and scams in March. Source: CertiKIn
    a separate March 27 report, the blockchain security firm said, “The attacker was
    able to borrow funds, liquidate themselves, then borrow funds again without repaying
    them.”“This was due to the liquidation process not overwriting records in RouterOrder
    that counted as collateral, allowing the exploiter to falsely borrow additional
    funds after liquidation,” CertiK said.The protocols team has offered a 20% bounty,
    double the standard 10%, in exchange for the return of the funds, according to
    CertiK. So far, no public updates have been given on whether any funds have been
    returned.The second highest monthly loss was restaking protocol Zoth after its
    deployer wallet was compromised and the attacker withdrew over $8.4 million in
    crypto assets. March crypto losses reduced after hacker returned  funds Some of
    the stolen funds in March were returned. In total, CertiK says over $33 million
    was stolen for the month, but decentralized exchange aggregator 1inch successfully
    recovered most of the $5 million stolen in a March 5 exploit after negotiating
    a bug bounty agreement with the attacker.The total figures, however, exclude an
    unknown Coinbase user who crypto sleuth ZachXBT claims lost 400 Bitcoin (BTC),
    worth $34 million. At the same time, ZachXBT said over $46 million could have
    been lost in March to phishing scams spoofing crypto exchanges.Related: DeFi protocol
    SIR.trading loses entire $355K TVL in ‘worst news’ possibleAustralian federal
    police said on March 21 that they had to alert 130 people of a message scam aimed
    at crypto users that spoofed the same “sender ID” as legitimate crypto exchanges. X
    users also reported on March 14 of messages spoofing crypto exchanges trying to
    trick users into setting up a new wallet using pre-generated recovery phrases
    controlled by the fraudsters.Magazine: Mystery celeb memecoin scam factory, HK
    firm dumps Bitcoin: Asia Express\n\n            "
  published: 2025-04-01 06:05:59.000000000 +01:00
- title: " 4 key Bitcoin metrics suggest $80K BTC price is a discount "
  url: https://cointelegraph.com/news/4-key-bitcoin-metrics-suggest-80-k-btc-price-is-a-discount?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin (BTC) price dropped from $87,241 to $81,331 between March 28 and
    March 31, erasing gains from the previous 17 days. The 6.8% correction liquidated
    $230 million in bullish BTC futures positions and largely followed the declining
    momentum in the US stock market, as the S&P 500 futures fell to their lowest levels
    since March 14.Despite struggling to hold above $82,000 on March 31, four key
    indicators point to strong investor confidence and potential signs of Bitcoin
    decoupling from traditional markets in the near future.S&P 500 index futures (left)
    vs. Bitcoin/USD (right). Source: TradingView / CointelegraphTraders fear the global
    trade war’s impact on economic growth, especially after the March 26 announcement
    of a 25% US tariff on foreign-made vehicles. According to Yahoo News, Goldman
    Sachs strategists cut the firm’s year-end S&P 500 target for the second time,
    lowering it from 6,200 to 5,700. Similarly, Barclays analysts reduced their forecast
    from 6,600 to 5,900.Regardless of the reasons behind investors’ heightened risk
    perception, gold surged to a record high above $3,100 on March 31. The $21 trillion
    asset is widely considered the ultimate hedge, especially when traders prioritize
    alternatives over cash. Meanwhile, the US dollar has weakened against a basket
    of foreign currencies, with the DXY index dropping to 104.10 from 107.60 in February.Bitcoin
    metrics show strength, while long-term investors are unfazedBitcoin’s narratives
    of being “digital gold” and an “uncorrelated asset” are being questioned, despite
    a 36% gain over 6 months while the S&P 500 index fell 3.5% during the same period.
    Several Bitcoin metrics continued to show strength, indicating that long-term
    investors remain unfazed by the temporary correlation as central banks pivot to
    expansionist measures to prevent an economic crisis.Bitcoin's mining hashrate,
    which measures the computing power behind the network’s block validation mechanism,
    reached an all-time high. Bitcoin mining estimated 7-day average hashrate, TH/s.
    Source: Blockchain.comThe 7-day hashrate reached a peak of 856.2 million terahashes
    per second on March 28, up from 798.8 million in February. Hence, there are no
    signs of panic selling from miners, as shown by the flow of known entities to
    exchanges.In the past, BTC price downturns were associated with periods of FUD
    regarding the “death spiral,” where miners were forced to sell when becoming unprofitable.
    Additionally, the 7-day average of net transfers from miners to exchanges on March
    30 stood at BTC 125, according to Glassnode data, much lower than the BTC 450
    mined per day. Bitcoin 7-day average net transfer volume from/to miners, BTC.
    Source: GlassnodeBitcoin miner MARA Holdings filed a prospectus on March 28 to
    sell up to $2 billion in stocks to expand its BTC reserves and for “general corporate
    purposes.” This move follows GameStop (GME), the US-listed videogame company,
    which filed a $1.3 billion convertible debt offering plan on March 26 while updating
    its reserve investment strategy to include potential Bitcoin and stablecoin acquisitions.Related:
    Trump sons back new Bitcoin mining venture with Hut 8Crypto exchange reserves
    dropCryptocurrency exchanges’ reserves dropped to their lowest levels in over
    six years on March 30, reaching BTC 2.64 million, according to Glassnode data.
    The reduced number of coins available for immediate trading typically indicates
    that investors are more inclined to hold, which is particularly significant as
    Bitcoin’s price declined 5.1% in seven days. Lastly, near-zero net outflows in
    US spot Bitcoin exchange-traded funds (ETFs) between March 27 and March 28 signal

- title: " Eric Trump joins Metaplanet’s strategic board of advisers "
  url: https://cointelegraph.com/news/eric-trump-joins-metaplanet-strategic-board-advisors?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin-stacking firm Metaplanet has appointed US President Donald Trump’s
    son Eric to its newly established strategic board of advisers to further Metaplanet’s
    mission to become a “global leader in the Bitcoin economy.””His business acumen,
    love of the Bitcoin community and global hospitality perspective will be invaluable
    in accelerating Metaplanet’s vision of becoming one of the world’s leading Bitcoin
    Treasury Companies,” Metaplanet CEO Simon Gerovich said in a March 21 announcement
    on X.”As a globally recognized business leader and entrepreneur, Eric Trump brings
    a wealth of experience in real estate, finance, brand development, and strategic
    business growth and has become a leading voice and advocate of digital asset adoption
    worldwide,” Metaplanet added.Metaplanet’s March 21 letter appointing Eric Trump
    to the firm’s Strategic Board of Advisors. Source: MetaplanetThe move is part
    of Metaplanet’s plan to establish a board of influential voices, speakers and
    thought leaders around the world who are committed to furthering Bitcoin adoption.Metaplanet
    shares increased 17.8% to 4,730 Japanese yen ($31.74) over the first 80 minutes
    of the March 21 trading day on the Tokyo Stock Exchange, Google Finance data shows.Source:
    Simon GerovichMetaplanet currently holds 3,050 Bitcoin (BTC) — worth nearly $4.1
    billion — making it the 12th largest corporate Bitcoin holder, BitBo’s BitcoinTreasuries.NET
    data shows.The Japan-based investment firm set a target to accumulate at least
    10,000 Bitcoin before the end of 2025. Gerovich’s firm has purchased 1,288 Bitcoin

- title: " Bitcoin sell-off to $93.5K is a brief hiccup — Data still supports new
    BTC highs in 2025 "
  url: https://cointelegraph.com/news/bitcoin-sell-off-to-93-5-k-is-a-brief-hiccup-data-still-supports-new-btc-highs-in-2025?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Key takeaways:Bitcoin price slips, but BTC dominance is on the rise.Sizable
    purchases by Strategy and the spot BTC ETFs highlight institutional investors’
    appetite for Bitcoin.Bitcoin’s (BTC) price has dropped by 4.3% in the last three
    days after nearly reaching $97,900 on May 2. Despite showing resilience at the
    $94,000 level on May 5, some traders are disappointed that strong institutional
    inflows have not been enough to maintain bullish momentum. However, several encouraging
    signs suggest that a new all-time high for Bitcoin in 2025 remains within reach.Bitcoin
    market share excluding stablecoins. Source: TradingView / CointelegraphBitcoin’s
    dominance over the broader cryptocurrency market has surged, currently standing
    at 70%, its highest since January 2021. This has occurred despite a wave of new
    token launches, including several top-50 projects such as SUI, Toncoin (TON),
    PI, Official Trump (TRUMP), Bittensor (TAO), Ethena (ENA), and Celestia (TIA).
    This dominance makes riskier altcoins less appealing to new market entrants.The
    spot Bitcoin ETFs recorded $4.5 billion in net inflows between April 22 and May
    2. At the same time, the increasing appetite for Bitcoin futures signals growing
    institutional adoption regardless of whether leverage is used for downside protection
    or bullish bets.Bitcoin futures aggregate open interest, BTC. Source: CoinGlassAccording
    to CoinGlass, the total open interest in Bitcoin futures markets has reached 669,090
    BTC, a 21% increase since March 5. Even after Bitcoin’s price crashed below $75,000
    in early April, demand for leveraged positions remained strong. The open interest
    in BTC futures on the Chicago Mercantile Exchange (CME) alone exceeds $13.5 billion,
    indicating robust institutional demand.Several factors explain why Bitcoin has
    struggled to reclaim the $100,000 level. Traders who bought in anticipation of
    the US Strategic Bitcoin Reserve bill on March 6 are growing increasingly frustrated,
    as the government has yet to disclose its BTC holdings or announce plans for further
    purchases. Additionally, similar state-level Bitcoin bills have repeatedly failed,
    including the latest setback in the US state of Arizona.Strategy doubles its plans
    for BTC acquisitions despite the global trade war Over the past three months,
    gold has outperformed most assets, rising 16%, while Bitcoin has declined by 5%
    and the S&P 500 has corrected by 6.5%. This has challenged the notion of Bitcoin
    as an uncorrelated asset, as the cryptocurrency has repeatedly failed to decouple
    from the S&P 500 amid rising economic risks. The global trade war has led investors
    to favor fixed-income assets and cash positions.5-year US Treasury yield (left)
    vs. Bitcoin/USD (right). Source: TradingView / CointelegraphBitcoin’s recent drop
    to $94,000 is particularly concerning given that Strategy, a US-listed company
    led by Michael Saylor, announced the acquisition of 1,895 BTC on May 5, after
    doubling its capital increase plan to fund further Bitcoin purchases. However,
    since investors were previously uncertain about Strategy’s ability to raise additional
    capital, the announcement of an $84 billion plan on May 1 has reduced some of
    this risk.For Bitcoin to reach a new all-time high, investors will likely need
    reassurance that US-China trade relations are improving, as tariffs have negatively
    impacted overall risk appetite. Nevertheless, the key elements for a BTC bull
    run above $100,000 appear to be in place.This article is for general information
    purposes and is not intended to be and should not be taken as legal or investment
    advice. The views, thoughts, and opinions expressed here are the author’s alone
    and do not necessarily reflect or represent the views and opinions of Cointelegraph.\n\n

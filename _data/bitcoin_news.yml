- title: " Coinbase faces another data breach lawsuit claiming stock drop damages "
  url: https://cointelegraph.com/news/coinbase-another-breach-related-class-lawsuit-stock-drop?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Coinbase and two executives have been hit with another proposed class-action
    lawsuit over the crypto exchange’s stock price drop after disclosing a user data
    breach earlier this month and for allegedly failing to disclose a violation of
    an agreement with a UK regulator.Coinbase investor Brady Nessler said in a May
    22 lawsuit filed in a Pennsylvania federal court that the data breach and the
    alleged broken agreement with the UK’s Financial Conduct Authority resulted in
    a “precipitous decline in the market value of the Company’s common shares,” causing
    stockholders to suffer “significant losses and damages.”Coinbase said on May 15
    that its damages bill could run up to $400 million after it was hit with a $20
    million extortion attempt four days earlier, with several of its customer support
    agents bribed to access internal systems and steal a limited amount of user account
    data.Nessler claimed Coinbase (COIN) shares dropped by 7.2% to close at $244 on
    May 15 as a result of the disclosure. However, the stock did stage a comeback,
    spiking 9% and hitting $266 by the closing bell on May 16, according to Google
    Finance. Coinbase stock closed down over 3% on May 23 at $263, falling another
    $1.62 after the bell. COIN is up nearly 6% so far this year.Coinbase is down from
    the May 23 trading session. Source: Google FinanceNessler’s complaint is seemingly
    the first to argue damages caused by Coinbase’s stock drop following its breach
    disclosure in a series of recent class-action lawsuits over the incident.The crypto
    exchange was hit with at least six lawsuits in the days after disclosing the data
    breach, all accusing it of mishandling the incident and failing to protect their
    data. UK agreement breach hurt stock, suit saysThe FCA fined Coinbase’s UK arm
    $4.5 million in July 2024 for breaching a 2020 voluntary agreement preventing
    the exchange from onboarding customers considered high risk by the regulator.The
    FCA said Coinbase onboarded 13,416 customers that the regulator considered high-risk
    and offered them crypto services.Related: Coinbase presses to axe rule banning
    SEC staff from holding cryptoNessler said in the suit that the fine saw Coinbase’s
    stock fall by over 5%, closing at $231.52 on July 25, 2024.Nessler also claimed
    that Coinbase didn’t disclose it had breached this agreement when the exchange
    first listed its shares on the Nasdaq in April 2021, and as a result, “the market
    price of the Company’s securities had been artificially inflated.” Nessler claims
    that had she known about the agreement violation, she would not have purchased
    the stock at the “artificially inflated prices.”Coinbase did not immediately respond
    to a request for comment.The class suit was filed on behalf of anyone who bought
    Coinbase stock between April 14, 2021, and May 14, 2025, and is asking for damages
    and a jury trial. Coinbase CEO Brian Armstrong and chief financial officer Alesia
    Haas are also named as defendants.Another lawsuit filed in Illinois on May 13,
    alleges Coinbase failed to notify users in writing of the collection, storage,
    or sharing of their biometric data and the purpose and retention schedule for
    their data.Magazine: Bitcoin bears eye $69K, CZ denies WLF ‘fixer’ rumors: Hodler’s
    Digest, May 18 – 24\n\n            "

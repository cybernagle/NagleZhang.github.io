- title: " Price analysis 4/14: SPX, DXY, BTC, ETH, XRP, BNB, SOL, DOGE, ADA, LEO "
  url: https://cointelegraph.com/news/price-analysis-4-14-spx-dxy-btc-eth-xrp-bnb-sol-doge-ada-leo?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin (BTC) bulls are trying to start the week on a positive note by

    he summarized to X followers.“If the RSI successfully retests its Downtrend...
    That would display emerging strength & price would be able to break its own Downtrend.”BTC/USD
    1-day chart with RSI data. Source: Rekt Capital/XEarlier, Cointelegraph reported

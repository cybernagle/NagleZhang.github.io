- title: " ‘Very possible’ Bitcoin consolidates for 8 months again: 10x Research "
  url: https://cointelegraph.com/news/bitcoin-consolidation-phase-repeat-2024-price-action-possible-crypto-analyst?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTk4NDEtM2VmYy03MTJkLTg0M2ItZDI1ZDQxY2E5YTM4.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTk4NDEtM2VmYy03MTJkLTg0M2ItZDI1ZDQxY2E5YTM4.jpg\"
    alt=\"‘Very possible’ Bitcoin consolidates for 8 months again: 10x Research\"></p><p>10x
    Research&rsquo;s head crypto researcher isn&rsquo;t ruling out Bitcoin repeating
    its 2024 price action, where it spent the majority of the year consolidating after
    hitting all-time highs early on.<p>&ldquo;Very possible,&rdquo; Markus Thielen
    told Cointelegraph when asked what the chances of Bitcoin (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/bitcoin-price\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">BTC</a>) repeating a similar market movement to 2024.
    In March 2024, Bitcoin reached an all-time high of $73,679 before entering a consolidation
    phase, swinging within a range of around $20,000 up until Donald Trump was elected
    as US president in November.</p><h2>Bitcoin&rsquo;s current chart signals &ldquo;market
    indecision&rdquo;</h2><p>Thielen said he had this thought even two months ago,
    around the time Bitcoin hit its current all-time high of <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-all-time-high-109000-trump-inauguration-day\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-all-time-high-109000-trump-inauguration-day\">$109,000
    on the day of Trump&rsquo;s inauguration</a>.</p><p>He explained in his most <a
    data-ct-non-breakable=\"null\" href=\"https://mail.10xresearch.co/p/is-this-the-dip-to-buy-assessing-bitcoin-s-market-structure?_bhlid=44124caa8891c32522620e5fb5e96fac0959d4b9&amp;last_resource_guid=Post%3A6c1020ca-d63c-49fe-8bcc-9d77a7578ede&amp;utm_campaign=is-this-the-dip-to-buy-assessing-bitcoin-s-market-structure&amp;utm_medium=newsletter&amp;utm_source=mail.10xresearch.co\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://mail.10xresearch.co/p/is-this-the-dip-to-buy-assessing-bitcoin-s-market-structure?_bhlid=44124caa8891c32522620e5fb5e96fac0959d4b9&amp;last_resource_guid=Post%3A6c1020ca-d63c-49fe-8bcc-9d77a7578ede&amp;utm_campaign=is-this-the-dip-to-buy-assessing-bitcoin-s-market-structure&amp;utm_medium=newsletter&amp;utm_source=mail.10xresearch.co\">recent</a>
    market report on March 15 that Bitcoin&rsquo;s current chart resembles a &ldquo;High
    and Tight Flag,&rdquo; which, despite typically being a bullish continuation pattern,
    shows signs of weakness.</p><figure><img alt=\"Cryptocurrencies\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01959863-744e-7e94-9708-5051462039e1\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Bitcoin&rsquo;s price
    chart is forming a High, Tight Flag Pattern. Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://mail.10xresearch.co/p/is-this-the-dip-to-buy-assessing-bitcoin-s-market-structure?_bhlid=44124caa8891c32522620e5fb5e96fac0959d4b9&amp;last_resource_guid=Post%3A6c1020ca-d63c-49fe-8bcc-9d77a7578ede&amp;utm_campaign=is-this-the-dip-to-buy-assessing-bitcoin-s-market-structure&amp;utm_medium=newsletter&amp;utm_source=mail.10xresearch.co\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://mail.10xresearch.co/p/is-this-the-dip-to-buy-assessing-bitcoin-s-market-structure?_bhlid=44124caa8891c32522620e5fb5e96fac0959d4b9&amp;last_resource_guid=Post%3A6c1020ca-d63c-49fe-8bcc-9d77a7578ede&amp;utm_campaign=is-this-the-dip-to-buy-assessing-bitcoin-s-market-structure&amp;utm_medium=newsletter&amp;utm_source=mail.10xresearch.co\"><em>10x
    Research</em></a></p></figcaption></figure><p>&ldquo;Two flags instead of a single,
    precise formation weakens this setup,&rdquo; Thielen said.</p><p>&ldquo;As a result,
    the pattern currently suggests market indecision rather than a straightforward
    bullish consolidation,&rdquo; he added.</p><p>Meanwhile, he also pointed out that
    the spot Bitcoin exchange-traded fund (ETF) market shows no signs of a &ldquo;buy-the-dip&rdquo;
    mentality.</p><h2>&ldquo;Little incentive&rdquo; to take advantage of Bitcoin&rsquo;s
    recent price dip</h2><p>&ldquo;This aligns with our view that most ETF flows came
    from arbitrage-driven hedge funds. Given the persistently low funding rates, there&rsquo;s
    little incentive or willingness to deploy additional capital despite the recent
    price correction,&rdquo; Thielen said. </p><p>Since the beginning of March, when
    Bitcoin fell below $90,000, spot Bitcoin ETFs in the US have recorded total outflows
    of around $1.66 billion, <a data-ct-non-breakable=\"null\" href=\"https://farside.co.uk/btc/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://farside.co.uk/btc/\">according</a>
    to Farside data.</p><p>Bitcoin is trading at $84,290 at the time of publication,
    <a data-ct-non-breakable=\"null\" href=\"https://coinmarketcap.com/currencies/bitcoin/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">according</a> to CoinMarketCap.
    This represents a 23% decline from its $109,000 January all-time high.</p><figure><img
    alt=\"Cryptocurrencies\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01959865-6687-7982-b177-28177554992a\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Bitcoin is down 12.86%
    over the past month. Source: </em><a data-ct-non-breakable=\"null\" href=\"https://coinmarketcap.com/currencies/bitcoin/\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://coinmarketcap.com/currencies/bitcoin/\"><em>CoinMarketCap</em></a></p></figcaption></figure><p>Thielen
    is unsure if Bitcoin&rsquo;s uptrend will resume in the short term. &rdquo;Therefore,
    it may be prudent to close short positions at this stage, although there remains
    little evidence to support a strong price recovery,&rdquo; Thielen said.</p><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-panic-selling-speculators-100-m-6-weeks-research\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-panic-selling-speculators-100-m-6-weeks-research\"><em><strong>Bitcoin
    panic selling costs new investors $100M in 6 weeks &mdash; Research</strong></em></a></p><p>Ever
    since Bitcoin fell below $80,000 on Feb. 28 &mdash; the first time since November
    &mdash; amid growing macroeconomic uncertainty over US President Donald Trump&rsquo;s
    proposed tariffs,  several crypto analysts have been predicting further downfall
    for the asset.</p><p>On March 10, BitMEX co-founder and Maelstrom&nbsp;<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-falls-80-k-ugly-start-and-could-retest-78-k-resistance-arthur-hayes\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">chief investment officer
    Arthur Hayes</a>&nbsp;said, &ldquo;It looks like Bitcoin will retest $78,000.&rdquo;
    &ldquo;If it fails, $75,000 is next in the crosshairs,&rdquo; he added.</p><p>Meanwhile,
    Iliya Kalchev, dispatch analyst at digital asset investment platform Nexo, told
    Cointelegraph on <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-70k-retracement-bull-market-analysts\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-70k-retracement-bull-market-analysts\">March
    11 that the low $70,000 range</a> could &ldquo;provide a foundation for a more
    sustainable recovery.&rdquo;</p><p><em><strong>Magazine: </strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/magazine/crypto-fans-obsessed-longevity-biohacking-why/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Crypto fans
    are obsessed with longevity and biohacking: Here&rsquo;s why</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"crypto_biz\" label=\"Subscription
    Form: Crypto Biz Newsletter\"></template></p>\n</p>\n            "
  published: 2025-03-15 06:35:20 UTC
- title: " Crypto faces ‘starkest&#039; gap between sentiment and fundamentals: BlockTower "
  url: https://cointelegraph.com/news/crypto-market-divergence-sentiment-fundamentals-blocktower-founder?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTk3ZTQtZDY1Zi03ODM1LWJhZWQtY2RmMDVjM2Q4YWNh.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTk3ZTQtZDY1Zi03ODM1LWJhZWQtY2RmMDVjM2Q4YWNh.jpg\"
    alt=\"Crypto faces ‘starkest' gap between sentiment and fundamentals: BlockTower\"></p><p>The
    major disconnect between crypto traders&rsquo; growing short-term market uncertainty
    and crypto builders becoming more bullish than ever creates a prime setup for
    long-term investors, according to a crypto hedge fund founder.<p>&ldquo;This is
    one of the starkest divergences I&rsquo;ve seen in sentiment and fundamentals,&rdquo;
    BlockTower Capital founder Ari Paul <a data-ct-non-breakable=\"null\" href=\"https://x.com/AriDavidPaul/status/1900664081326993551\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">said</a> in a March
    14 X post.</p><h2>Optimism grows among those beyond crypto natives </h2><p>Paul
    said that while traders and analysts have recently turned bearish on crypto, developers
    &mdash; and, more broadly, those working for crypto companies less tied to market
    cycles &mdash; remain significantly more bullish. &ldquo;All the data points I&rsquo;m
    hearing from basically any crypto-related project or company that doesn&rsquo;t
    rely on &ldquo;natives&rdquo; near-term is positive,&rdquo; Paul said.</p><figure><img
    alt=\"Cryptocurrencies, Venture Capital, Cryptocurrency Investment\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01959821-dee3-730b-8f5a-1dfb955bf8a4\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/nicrypto/status/1900763131103543410\" rel=\"nofollow noopener\"
    target=\"_blank\" text=\"null\" title=\"https://x.com/nicrypto/status/1900763131103543410\"><em>Nic
    Puckrin</em></a></p></figcaption></figure><p>Based on this, he&rsquo;s confident
    that crypto is a &ldquo;good buy&rdquo; over the &ldquo;12-month timeframe&rdquo;
    but isn&rsquo;t sure if it has reached a short-term bottom yet. Crypto analyst
    Matthew Hyland recently said the only way for Bitcoin to confirm that the bottom
    is <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-price-weekly-close-89k-bottom-resume-uptrend-crypto-analyst\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">actually in would be
    to close a week back</a> above $89,000.</p><p>However, on March 14, the broader
    crypto market rose slightly, giving traders a bit more short-term confidence.
    </p><p>Bitcoin (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/bitcoin-price\">BTC</a>)
    spiked 3.16% to $84,638 over the 24-hour period, while Ether (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/ethereum-price\" rel=\"\" target=\"_self\" text=\"null\"
    title=\"https://cointelegraph.com/ethereum-price\">ETH</a>) rose 1.79% and XRP
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/xrp-price-index\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/xrp-price-index\">XRP</a>)
    jumped 6.01%, <a data-ct-non-breakable=\"null\" href=\"https://coinmarketcap.com/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">according</a> to CoinMarketCap.</p><p>Over
    the same 24 hours, the Crypto Fear &amp; Greed&nbsp;<a data-ct-non-breakable=\"null\"
    href=\"https://alternative.me/crypto/fear-and-greed-index/\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">Index</a>, which measures overall crypto market sentiment,
    surged 19 points to 46, still in the &ldquo;Fear&rdquo; zone but nearing neutral
    territory.</p><figure><img alt=\"Cryptocurrencies, Venture Capital, Cryptocurrency
    Investment\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01959823-54e5-7383-acf6-5e3b1c126286\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/robustus/status/1900558531343872339\" rel=\"nofollow noopener\"
    target=\"_blank\" text=\"null\" title=\"https://x.com/robustus/status/1900558531343872339\"><em>Dan
    McArdle</em></a></p></figcaption></figure><p>MN Trading Capital founder Michael
    van de Poppe said Bitcoin&rsquo;s price spike over the past 24 hours has strengthened
    his confidence in the asset, resuming its uptrend by June.</p><h2>Crypto market
    presenting opportunity for &ldquo;sustainable value&rdquo; investments</h2><p>&ldquo;Clearly
    made a higher low, clearly touching the highs,&rdquo; van de Poppe <a data-ct-non-breakable=\"null\"
    href=\"https://x.com/CryptoMichNL/status/1900633923962519854\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">said</a> in a March 14 X post.</p><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-bull-market-in-peril-as-us-recession-and-tariff-worries-loom\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-bull-market-in-peril-as-us-recession-and-tariff-worries-loom\"><em><strong>Bitcoin
    bull market in peril as US recession and tariff worries loom</strong></em></a></p><p>&ldquo;It&rsquo;s
    very likely that we&rsquo;re starting a new uptrend on the lower timeframes going
    into a good Q2,&rdquo; he added.</p><p>Paul also said it may be the right time
    to explore traditional venture capital crypto investments with a longer-term outlook.</p><p>&ldquo;A
    good time to be looking for &ldquo;traditional&rdquo; style VC crypto investments.
    By &ldquo;traditional&rdquo; I mean longer term, genuinely focusing on sustainable
    value creation, no quick monetization scheme,&rdquo; Paul said.</p><p><em><strong>Magazine:</strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/vitalik-ai-apocalypse-la-times-kkk-llm-grooming-ai-eye/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong> Vitalik
    on AI apocalypse, LA Times both-sides KKK, LLM grooming: AI Eye</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"crypto_biz\" label=\"Subscription
    Form: Crypto Biz Newsletter\"></template></p>\n</p>\n            "

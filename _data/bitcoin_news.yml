    key support battle now underway on BTC/USD.Filbfilb on $100,000 battle: “This
    time is no different”Bitcoin has begun to consolidate after making rapid gains
    this month, with the area just north of $100,000 seeing “choppy” BTC price moves.For
    filbfilb, however, current market behavior is about more than reclaiming six figures.Bitcoin’s
    market cap is now fighting to flip the $2 trillion mark from resistance back into
    firm support after losing it at the start of February, data from Cointelegraph

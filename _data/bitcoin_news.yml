- title: " Standard Chartered scales institutional crypto banking with FalconX "
  url: https://cointelegraph.com/news/standard-chartered-institutional-crypto-falconx?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Global bank Standard Chartered has beefed up its banking support to the
    cryptocurrency industry by inking a new partnership with the crypto prime broker
    FalconX.Standard Chartered will provide a comprehensive suite of banking services
    to FalconX’s global institutional clients following the strategic partnership
    announced on May 14.As part of the collaboration, FalconX will initially integrate
    Standard Chartered’s banking infrastructure and access to a range of diverse currency
    pairs for its institutional clients.The partnership ultimately aims to include
    a broader range of offerings and mutual opportunities, the announcement noted.Crypto
    support beyond bankingThe partnership is expected to “expand beyond banking” into
    additional products and services designed to meet evolving crypto demand from
    both FalconX and Standard Chartered’s institutional clients.The joint services
    will target a broad range of clients, including asset managers, hedge funds, token
    issuers and payment platforms, the companies said.Matt Long, FalconX’s general
    manager of APAC and Middle East, referred to Standard Chartered as “one of the
    most forward-thinking global banks in digital asset adoption.”“At FalconX, we
    support trading and financing for some of the world’s largest institutions in
    digital asset markets, and this relationship strengthens our ability to deliver
    robust banking and FX solutions to clients who rely on us to operate in crypto
    markets,” he said.Standard Chartered proud to provide banking services to crypto
    firmsStandard Chartered’s collaboration with FalconX underscores the bank’s dedication
    to improving the digital asset ecosystem, said Luke Boland, the bank’s South Asia
    head of fintech.“As institutional demand for digital assets continues to grow,
    we’re proud to provide the banking infrastructure that enables firms like FalconX
    to deliver world-class trading and financing solutions to institutional clients,”
    Boland stated in the announcement.Standard Chartered’s latest crypto move comes
    as yet another effort by the bank to provide banking services to the crypto industry.Related:
    Bunq, Europe’s second-largest neobank, expands into cryptoIn April, Standard Chartered
    partnered with major crypto exchange OKX to pilot cryptocurrency and tokenized
    fund collateral to institutional investors.The bank’s involvement in the cryptocurrency
    industry dates back to 2016, when Standard Chartered made a strategic investment
    in Ripple, the company behind the XRP (XRP) cryptocurrency.The growing banking
    commitment to crypto comes in line with expectations of executives at industry
    firms including Messari and Sygnum Bank, who predicted a global banking push into
    Bitcoin (BTC) in the second half of 2025 amid favorable regulatory developments.Magazine:
    Crypto wanted to overthrow banks, now it’s becoming them in stablecoin fight\n\n

- title: " Bitcoiner TJ Miller says ‘50-hour’ rule is why celebs stay off orange pill "
  url: https://cointelegraph.com/news/bitcoiner-tj-miller-why-more-hollywood-celebrities-not-bitcoiners?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Comedian and actor TJ Miller says it only takes a little over two full
    days to get the average person up to speed on Bitcoin. However, when asked why
    more celebrities aren’t Bitcoiners, he says most people simply refuse to ever
    sit down and study again.“It is really hard to get people to study after they
    graduate, from any level,” Miller told Natalie Brunell on the April 23 episode
    of Coin Stories.  Miller claimed it takes “about 50 hours of study” to understand
    Bitcoin (BTC).Hollywood rewards those who “do not think differently”“So to say
    to somebody it is going to take 50 hours for you to understand this, they are
    like, ah, I don’t want to,” he said. “They can’t even watch a Netflix series;
    they can’t even watch White Lotus because it takes seven hours,” he said.Comedian
    and actor TJ Miller spoke to Bitcoiner Natalie Brunell on the Coin Stories podcast.
    Source: Natalie BrunellMiller said it takes “such a paradigm shift” to embrace
    Bitcoin, not just in money or the internet, but in life — and that’s also why
    you don’t see more Hollywood celebrities becoming Bitcoin maxis:“Hollywood rewards
    people that do not think differently.”During a Bitcoin lunch hosted by crypto
    entrepreneur Anthony Pompliano, Miller introduced himself that, to his knowledge,
    he is “the only celebrity that is a Bitcoiner.”“I can’t really think of anyone
    else,” Miller said. While there aren't many celebrities known to be publicly active
    in the Bitcoin community, many have launched their own memecoins in recent years,
    including Iggy Azalea, Caitlyn Jenner, and Hailey Welch aka “Hawk Tuah.”However,
    Miller said he has been trying to educate people on Bitcoin for quite some time.
    He said when Bitcoin was trading between $8,000 and $12,000, he was telling friends
    to “just put $1,000 into Bitcoin.”Miller is confident that, at some point in the
    future, there will be a Hollywood movie about the Bitcoin revolution.Related:
    Bitcoin ETFs on $3B ‘bender,’ log first full week of inflows in 5 weeks“But it’ll
    be interesting because it didn’t happen all at once,” he said. “It didn’t happen
    in three years, and it hasn’t happened in ten years, so it will be interesting
    to see how they can connect the dots,” he added.Cointelegraph’s Gareth Jenkinson
    recently sat down with TJ Miller, where it became evident that his enthusiasm
    for Bitcoin isn’t just surface-level. He wants to use his platform to educate
    and inspire others to take it seriously.“You can tell that I’m passionate about
    it. And so that’s what I’d like to do is sort of be able… to be somebody that
    helps bring cultural awareness, spread awareness and just a trusting name and
    face in the Bitcoin community that hopefully will bring more people to it,” Miller
    said.Magazine:  Bitcoin $100K hopes on ice, SBF’s mysterious prison move: Hodler’s
    Digest, April 20 – 26\n\n            "

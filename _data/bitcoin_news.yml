- title: " Ex-UFC champ Conor McGregor touts Irish Bitcoin reserve in presidential
    bid "
  url: https://cointelegraph.com/news/ex-ufc-champ-conor-mcgregor-touts-irish-bitcoin-reserve?utm_source=rss_feed&utm_medium=rss_tag_bitcoin%3Fhttps%3A%252F%252Fcointelegraph.com%252Frss%252Ftag%252Fbitcoin%3D&utm_campaign=rss_partner_inbound
  summary: "UFC fighter turned Irish political candidate Conor McGregor has endorsed
    the idea of building a Bitcoin reserve in his country to give more “power back
    to the people.”“Crypto in it's origin was founded to give power back to the people.
    An Irish Bitcoin strategic reserve will give power to the people’s money,” McGregor
    wrote to X on May 9.The former UFC champion said he would discuss his plans in
    more detail in an upcoming X spaces, prompting responses from some of the Bitcoin
    industry’s most prominent leaders.Source: Conor McGregor“We need the greatest
    minds for this BTC Reserve. Message me and lets chat on my space,” McGregor said
    in response to Bitcoiner and host of The Pomp Podcast, Anthony Pompliano.One of
    US President Donald Trump’s crypto advisors, David Bailey, also reached out, to
    which McGregor responded: “David message me, let’s discuss your ideas!” McGregor
    announced his independent candidacy for the Irish presidency in late March 2025,
    centering his campaign on anti-immigration policies and combating crime.Ireland’s
    next presidential election must take place by Nov. 11, 2025, as the term of the
    current President, Michael D. Higgins, is set to end the day after.Establishing
    a Bitcoin reserve — let alone one coming from a minor, independent party — would
    be no easy feat.Despite recent regulatory progress, the US, El Salvador and Bhutan
    are among the few countries that have established a Bitcoin reserve to date.Related:
    US has ‘countless’ ways to bolster Bitcoin reserve: Bo HinesMcGregor’s political
    visibility was recently boosted by a trip to the White House, where he met Trump
    and received his support.However, McGregor is facing intense scrutiny in Ireland,
    having recently been found guilty of sexual assault in a civil case — a conviction
    which he has since appealed — while also previously being investigated for hate
    speech crimes.McGregor’s last crypto endeavor failedMcGregor’s push for a Bitcoin
    reserve comes a little over a month after the McGregor-backed REAL project failed
    to attract sufficient funding in its token launch pre-sale, prompting a full refund
    to all token bidders.The team behind the project, Real World Gaming, only raised
    $392,315 over a 28-hour presale on April 5 and 6, less than half of the $1 million
    minimum requirement that it initially set.Source: Conor McGregorMagazine: Adam
    Back says Bitcoin price cycle ’10x bigger’ but will still decisively break above
    $100K\n\n            "

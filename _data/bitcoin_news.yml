- title: " Grayscale and Osprey end 2-year legal fight over Bitcoin ETF promotion "
  url: https://cointelegraph.com/news/grayscale-osprey-lawsuit-connecticut-court-bitcoin-etf?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Asset managers Osprey Funds and Grayscale Investments agreed to settle
    a lawsuit over alleged violations of Connecticut law in the advertising and promotion
    of Grayscale’s Bitcoin exchange-traded fund (ETF). According to an April 9 court
    filing, the parties agreed to settle the two-year-old case and are finalizing
    documentation and settlement terms. The filing noted that once those steps are
    completed, Osprey will withdraw its appeal.“Soon after this appeal was filed,
    the parties reached a settlement of this case,” the motion stated. “It is expected
    that all these tasks can be done within 45 days, and it is uncertain whether a
    shorter extension would suffice.”Details of the settlement have not been made
    public. Grayscale and Osprey reach settlementThe legal battle between the two
    firms started on Jan. 30, 2023, when Osprey filed a suit in the Connecticut Superior
    Court. Osprey claimed it was Grayscale’s only competitor in the over-the-counter
    Bitcoin (BTC) trust market and that Grayscale had maintained its market share
    through deceit. Osprey claimed Grayscale promoted its Grayscale Bitcoin Trust
    (GBTC) as a means to access a spot Bitcoin ETF through a conversion. Osprey argued
    that the conversion was presented as a certainty, despite regulatory uncertainty
    at the time.Grayscale’s application to convert GBTC into a spot ETF was approved
    by the US Securities and Exchange Commission in January 2024. An August 2023 ruling
    compelled the SEC to reconsider its rejection of Grayscale’s application to convert
    the fund into an ETF. The SEC’s approval allowed GBTC to transition into a spot
    ETF and begin trading on the NYSE Arca exchange.Related: Crypto ETPs shed $240M
    last week amid US trade tariffs — CoinSharesLawsuit settlement follows Osprey
    appeal On Feb. 7, Judge Mark Gould sided with Grayscale, ruling that Osprey’s
    claims against the asset manager were exempted from the Connecticut Unfair Trade
    Practices Act. Osprey responded by filing a motion for reargument on Feb. 10.
    The fund claimed that Gould’s ruling came “before the close of discovery,” which
    is the formal evidence-gathering phase of a lawsuit.The fund claimed that the
    ruling overlooked the differences between how the Federal Trade Commission and
    Connecticut courts treat deceptive advertising. The settlement ended one of the
    more prominent legal clashes among crypto asset managers competing for early ETF
    dominance. Grayscale’s GBTC remains one of the largest Bitcoin investment vehicles
    in the United States.Magazine: Illegal arcade disguised as … a fake Bitcoin mine?
    Soldier scams in China: Asia Express\n\n            "
  published: 2025-04-11 09:51:28.000000000 +01:00
- title: " Bitcoiners’ ‘bullish impulse’ on recession may be premature: 10x Research "
  url: https://cointelegraph.com/news/bitcoin-bullish-impulse-recession-premature-crypto-analyst-forecast?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "It may be too early for Bitcoiners to start getting bullish over the longer-term
    impacts of a potential recession on Bitcoin’s price, says 10x Research head of
    research Markus Thielen.Thielen said in an April 11 markets report that credit
    spreads continue to widen, indicating that “recessionary concerns may be seeping
    deeper into the economy.”“Expecting a bullish impulse is too early,” he said.Bitcoin
    may face short-term headwindsWhile the long-term effects of a recession could
    be bullish for Bitcoin (BTC) — due to the monetary easing that typically follows
    US Federal Reserve rate cuts — Thielen warned that Bitcoin may face headwinds
    before gaining bullish momentum.“Normally, Bitcoin first sells off when China
    devalues or the Fed cuts, as the first cut might not be so impactful and also
    confirms economic weakness,” Thielen told Cointelegraph. Bitcoin is trading at
    $80,620 at the time of publication. Source: CoinMarketCapWhite House crypto and
    AI czar David Sacks said in an April 10 X post that it is “time for a rate cut”
    after the core Consumer Price Index increased 2.8% year-by-year for March, the
    lowest it has been since March 2021.CME Group’s FedWatch Tool shows a 64.8% chance
    of no rate cut at the Federal Reserve’s May Federal Open Market Committee meeting.Traders
    typically see interest rate cuts and monetary supply expansions as positively
    affecting asset prices, especially Bitcoin and other cryptocurrencies.However,
    Thielen said that historically, when year-over-year credit spreads “begin to widen,”
    Bitcoin often faces more downside pressure and takes longer to recover.Related:
    Bitcoin ‘significantly de-risked here’ as nearly 80% of cyclical price correction
    is done — Analyst“This pattern suggests that while a longer-term opportunity may
    emerge, Bitcoin could still face pressure in the near term,” Thielen said. He
    added that currency devaluations have also historically been bearish for markets
    in the short term before being bullish in the long term.It comes amid growing
    concern among market participants over the weakening US dollar.The US Dollar Index
    (DXY) is sitting at 100.337, down 2.92% over the past five days, according to
    TradingView data. The DXY is sitting at 100.337 at the time of publication. Source:
    TradingViewTrading resource account, The Kobeissi Letter, said in an April 10
    X post, “The US dollar has exited the room. Once again, something is broken.”Meanwhile,
    BlackRock’s head of digital assets, Robbie Mitchnick, said in late March that
    Bitcoin would most likely thrive in a recessionary macro environment. “I don’t
    know if we’ll have a recession or not, but a recession would be a big catalyst
    for Bitcoin,” Mitchnick said.Magazine: Memecoin degeneracy is funding groundbreaking
    anti-aging researchThis article does not contain investment advice or recommendations.

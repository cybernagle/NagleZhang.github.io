- title: " Bitcoin sales at $109K all-time high &#039;significantly below&#039; cycle
    tops — Glassnode "
  url: https://cointelegraph.com/news/bitcoin-sales-109-k-all-time-high-significantly-below-cycle-tops-research?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin (BTC) investors who bought BTC in 2020 or later are still waiting
    for higher prices, new research says.In findings published on X on April 1, onchain
    analytics firm Glassnode revealed that $110,000 was not high enough to make many
    hodlers sell.Glassnode: 2020 Bitcoin buyers “still holding”Bitcoiners who entered
    the market between three and five years ago have retained their holdings despite
    significant BTC price upside.According to Glassnode, this investor cohort, with
    a cost basis between the 2020 lows of $3,600 and the 2021 highs of $69,000, is
    still hodling.“Although the share of wealth held by investors who bought $BTC
    3–5 years ago has declined by 3 percentage points since its November 2024 peak,
    it remains at historically elevated levels,” it said.“This suggests that the majority
    of investors who entered between 2020 and 2022 are still holding.”Bitcoin Realized
    Cap HODL Waves data. Source: GlassnodeAn accompanying chart shows data from the
    Realized Cap HODL Waves metric, which splits the BTC supply into sections based
    on when each coin last moved onchain.Using this, Glassnode is able to draw a distinction
    between the 2020-22 buyers and those who came immediately before them.“In contrast,
    over two-thirds of those who had bought $BTC 5–7 years ago exited their positions
    by the December 2024 peak,” it reveals, reflecting their lower cost basis.Speculators
    stay cool at BTC price highsAs Cointelegraph reported, more recent buyers, who
    form the more speculative investor cohort known as short-term holders (STHs),
    have proven much more sensitive to recent BTC price volatility.Related: Bitcoin
    sellers 'dry up' as weekly exchange inflows near 2-year lowEpisodes of panic selling
    have occurred throughout the past six months as BTC/USD hit new record highs and
    then fell by up to 30%.Continuing, Glassnode said that current STH participation
    does not suggest a speculative frenzy — something common to previous BTC price
    cycle tops.“Short-Term Holders currently hold around 40% of Bitcoin's network
    wealth, after peaking near 50% earlier in 2025,” it said, alongside Realized Cap
    HODL Waves data on March 31. “This remains significantly below prior cycle tops,
    where new investor wealth peaked at 70–90%, suggesting a more tempered and distributed
    bull market so far.”Bitcoin Realized Cap HODL Waves. Source: GlassnodeThis article
    does not contain investment advice or recommendations. Every investment and trading
    move involves risk, and readers should conduct their own research when making
    a decision.\n\n            "

- title: " Strive to become Bitcoin treasury company "
  url: https://cointelegraph.com/news/strive-to-become-bitcoin-treasury-company?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Strive Asset Management, founded by entrepreneur and former presidential
    candidate Vivek Ramaswamy, has revealed plans to transition into a Bitcoin treasury
    company.According to a May 7 announcement, Strive is going public through a reverse
    merger and plans to use the combined company’s stock to accumulate Bitcoin (BTC).The
    deal will see Strive merging with Asset Entities, a social media marketing company
    listed on the Nasdaq. The combined entity will operate under the Strive brand
    and use its access to the public equity markets to finance Bitcoin purchases,
    the company said. Once the deal closes, Strive plans to issue approximately $1
    billion in equity and debt and use the proceeds to accumulate BTC. The asset manager
    “intends to use all available mechanisms to build a Bitcoin war chest […] and
    build a long-term investment approach designed to outperform Bitcoin,” it said.Strive
    plans to allow “Bitcoin holders to contribute Bitcoin in exchange for public stock
    through a structure that is intended to be tax-free,” it said. As of May 7, the
    company manages approximately $2 billion in net assets across a variety of funds. In
    December, Strive filed to list an exchange-traded fund (ETF) investing in convertible
    bonds issued by Strategy and other corporate Bitcoin buyers.Related: Trump-linked
    Strive files for ‘Bitcoin Bond’ ETFCorporate Bitcoin treasuries are increasingly
    popular. Source: Bitcointreasuries.netCorporate Bitcoin treasuriesCorporate Bitcoin
    treasuries have become popular since the approval of Bitcoin exchange-traded funds
    (ETFs) on Wall Street. Companies pioneering the Bitcoin buyer approach, such as
    Strategy have seen their share prices surge by 350% in 2024. Analysts say adding
    Bitcoin to corporate treasuries can “potentially be a valuable hedge against growing
    fiscal deficits, currency debasement, and geopolitical risks,” asset manager Fidelity
    Digital Assets said in a 2024 report.Corporate Bitcoin treasuries collectively
    hold roughly $74 billion worth of BTC as of May 7, according to Bitcointreasuries.net. Ramaswamy
    founded Strive in 2022. Source: StriveTrump connectionRamaswamy, an outspoken
    ally of President-elect Donald Trump, founded Strive in 2022. Its stated goal
    is to help investors “harness the power of capitalism,” according to Strive’s
    website. In 2023, Ramaswamy — who largely earned his $1 billion net worth from
    biotechnology startup Roivant Sciences — campaigned against Trump in the Republican
    presidential primary. He later endorsed the president-elect.Magazine: Bitcoin’s
    $100K push wakes taxman, Vitalik visits real Moo Deng: Asia Express\n\n            "

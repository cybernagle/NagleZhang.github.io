  summary: "Key takeaways:Bitcoin could reach $150,000 by August or September of this
    year if BTC breaks above the parabolic slope pattern. Bitcoin (BTC) price jumped
    to new quarterly highs at $96,700 on May 1, a day after the US GDP contracted
    -0.3% for the first time since Q2 2022. Amid heightened economic concerns, the
    probability of a Federal Reserve interest rate cut rose to 62.8% for the June
    18 Federal Reserve meeting. Over the past 24 hours, short position liquidations
    exceeded $137 million, with Alphractal founder Joao Wedson observing that BTC's
    price momentum continues to favor bullish trends.Bitcoin aggregated liquidation
    heatmap. Source: X.comPeter Brandt predicts a $150K Bitcoin top by Q3In a recent
    post on X, veteran trader Peter Brandt forecasted a Bitcoin price rally, potentially
    reaching $125,000 to $150,000 by August or September 2025. The trader predicted
    a parabolic arc pattern in Bitcoin’s price chart—a technical formation often signaling
    rapid rises followed by sharp corrections, as seen in the 2017 Bitcoin surge.
    Bitcoin 1-week analysis by Peter Brandt. Source: X.comBrandt noted that Bitcoin
    must reclaim its broken parabolic slope to achieve the above target. However,
    he cautioned that a 50%+ correction could follow the peak, reflecting the pattern’s
    characteristic volatility. From an onchain perspective, Bitcoin researcher Axel
    Adler Jr. pointed out that Bitcoin is on the cusp of a “start” rally zone. The
    analyst underlined three scenarios, with the optimistic (bull) case outlining
    a price target above $150,000. Adler Jr. added, “If the Ratio breaks through 1.0
    and holds above it, the NUPL/MVRV metrics will show a new impulse, and the price
    could reach $150-175K, repeating the cycle logic of 2017 and 2021.”Bitcoin Composite
    Index. Source: CryptoQuantIn a baseline scenario, BTC's price may consolidate
    within a $90,000 to $110,000 range if new capital inflows remain limited and existing
    investors do not increase their positions.Lastly, a bearish case could unfold
    if further profit-taking from short-term holders takes place, leading to a correction
    down to $85,000-$70,000. Over the past two weeks, Bitcoin has displayed a consistent
    breakout pattern, surging 13% before entering sideways consolidation, then breaking
    out again to reach $93,000–$96,000. BTC is currently breaking out of its existing
    resistance range. Still, as shown in the chart below, a significant volume cluster
    between $96,000 and $99,000 suggests a phase of consolidation before Bitcoin can
    test the $100,000 mark. Bitcoin 1-day chart. Source: Cointelegraph/TradingViewRelated:
    Bitcoin price about to ‘blast’ higher as Fed rate cut odds jump to 60%This article
    does not contain investment advice or recommendations. Every investment and trading
    move involves risk, and readers should conduct their own research when making
    a decision.\n\n            "

- title: " Bitcoin acts like ‘store of value that it is’ amid Trump policy chaos:
    NYDIG "
  url: https://cointelegraph.com/news/bitcoin-acts-store-of-value-amid-trump-policy-chaos-nydig?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin is starting to act as a store of value during times of “US-risk-off”
    sentiment, marking a potential shift in its relationship with traditional assets,
    according to the New York Digital Investment Group.Bitcoin (BTC) felt “noticeably
    different” over the trading week ended April 25, NYDIG’s global head of research
    Greg Cipolaro said in an April 25 market note. “We’ve been observing subtle shifts
    in its behavior over the past few weeks,” he added. “The decoupling from traditional
    risk assets is still very early and fragile, but for those watching crypto markets
    24/7, the shift is palpable.”“Bitcoin has acted less like a liquid levered version
    of levered US equity beta and more like the non-sovereign issued store of value
    that it is.”Cipolaro noted that Bitcoin has gained more than 13% since the beginning
    of April, while US markets such as the S&P 500 and tech-heavy Nasdaq have declined
    amid escalating global trade tensions due to US President Donald Trump’s tariffs.He
    added that the US dollar and long-term US Treasurys have also underperformed since
    the election and Trump’s April 2 “Liberation Day” tariff announcements, which
    lumped every country with various rates, the minimum being 10%.Gold and currencies
    such as the Swiss franc have been consistent winners as safe havens, Cipolaro
    said, noting that Bitcoin is emerging as a non-sovereign store of value.Amid surging
    volatility in equities, measured with the VIX index, foreign exchange rates (CVIX
    index), and interest rates and bonds (MOVE index), investors have been on the
    hunt for these safe haven assets. Several asset classes have recently seen high
    volatility. Source: NYDIGCipolaro said investors are also seeking alternatives
    to US hegemony, whether that is stocks, bonds, forex, or commodities. Few large
    liquid optionsHowever, Cipolaro said investors seeking alternatives outside traditional
    financial systems have few large, liquid options.Gold remains the largest non-sovereign
    store of value at around a $22 trillion market cap, while Bitcoin has just a fraction
    of that at $1.8 trillion. Related: New Bitcoin price all-time highs could occur
    in May — Here is whyAdditionally, Bitcoin is the only top crypto asset listed
    that “solely focuses on monetary or store of value use cases,” while the others
    are better described as the fuel for decentralized application platforms, he said. Cipolaro
    concluded that despite Bitcoin’s recent gains, “there are few signs of the market
    overheating,” and the recovery is still in early stages.Magazine: Bitcoin $100K
    hopes on ice, SBF’s mysterious prison move: Hodler’s Digest\n\n            "

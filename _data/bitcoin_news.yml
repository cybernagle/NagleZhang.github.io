- title: " Semler Scientific buys another $10M worth of BTC "
  url: https://cointelegraph.com/news/semler-scientific-buys-another-10-million-bitcoin?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Semler Scientific has bought approximately $10 million worth of Bitcoin
    since Feb. 14, the healthcare technology company said in an April 25 statement. The
    company purchased 111 Bitcoin (BTC) for $10 million at an average price of roughly
    $90,000 per coin, Semler said. It holds a total of more than 3,300 Bitcoin worth
    approximately $300 million in aggregate. Semler said its Bitcoin purchases have
    earned stockholders a Bitcoin yield of 23.5% in the year to date. Bitcoin yield
    measures the ratio of BTC holdings to outstanding shares, reflecting growing exposure
    per share for investors. “Semler Scientific uses BTC Yield as a [key performance
    indicator] to help assess the performance of its strategy of acquiring bitcoin
    in a manner Semler Scientific believes is accretive to stockholders,” it said. Semler
    bought 111 BTC since Feb. 14. Source: Eric SemlerThe company said it acquired
    its Bitcoin treasury for an average price of nearly $89,000. As of April 25, Bitcoin
    trades at approximately $95,000 per coin, according to data from Cointelegraph. Semler
    Scientific is a healthcare technology company that develops and sells medical
    diagnostic products, with a primary focus on detecting chronic diseases. The company
    has partially financed its Bitcoin purchases by issuing roughly $125 million in
    new stock, it said. Semler also announced plans to raise $75 million through the
    private offering of convertible senior notes in January. Corporations are among
    the biggest Bitcoin buyers. Source: BitcoinTreasuries.NET Related: Bitcoin, showing
    'signs of resilience', beats stocks, gold as equities fold — BinanceCorporate
    Bitcoin buyingIn 2024, Bitcoin’s surging price pushed Michael Saylor’s Strategy
    (formerly MicroStrategy) up more than 350%, according to data from FinanceCharts. Strategy’s
    success has inspired dozens of other companies, such as Semler, to start accumulating
    Bitcoin treasuries. Public companies are now among the largest institutional Bitcoin
    holders. As of April 25, corporate Bitcoin holdings are worth approximately $71
    billion in the aggregate, according to data from BitcoinTreasuries.NET.Strategy
    is still the largest corporate Bitcoin holder, with a treasury worth more than
    $50 billion. During the week of April 14, Strategy bagged 6,556 Bitcoin for an
    average price of $84,785 per coin.Among institutional buyers, corporate treasuries
    still lag exchange-traded funds (ETFs), which cumulatively hold approximately
    $110 billion in Bitcoin as of April 25, according to Coinglass data. Magazine: Pokémon
    on Sui rumors, Polymarket bets on Filipino Pope: Asia Express\n\n            "

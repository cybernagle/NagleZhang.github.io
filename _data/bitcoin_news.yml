- title: " Swiss National Bank chief dismisses Bitcoin reserve calls "
  url: https://cointelegraph.com/news/swiss-national-bank-official-dismisses-bitcoin-reserve-calls?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "An official of the Swiss National Bank dismissed calls for the institution
    to add Bitcoin to its reserves as a hedge against the ongoing macroeconomic turmoil.According
    to an April 25 Reuters report, Swiss National Bank Chairman Martin Schlegel said
    that “cryptocurrency cannot currently fulfil the requirements for our currency
    reserves” during a shareholder meeting in Bern earlier today. The comments come
    amid mounting pressure from the local crypto industry to add Bitcoin (BTC) to
    the central bank’s reserves.Campaigner Luzius Meisser, a board member of cryptocurrency
    broker Bitcoin Suisse, told Reuters that “holding bitcoin makes more sense as
    the world shifts towards a multipolar order.” He claimed that the need is even
    more dire now that “the dollar and the euro are weakening.”This is not the first
    time Schlegel has pushed back against the idea. Reports from early March quoted
    Schlegel saying that he doesn’t want to make Bitcoin a reserve asset in Switzerland,
    citing a lack of stability, liquidity concerns and security risks.Related: Swiss
    canton of Bern votes to study Bitcoin mining feasibilitySwitzerland’s campaign
    for a Bitcoin reserveOn the last day of 2024, the Swiss Federal Chancellery initiated
    a proposal to constitutionally mandate the Swiss National Bank to hold Bitcoin
    on its balance sheet. The proposal needs to gather 100,000 signatures to trigger
    a referendum in Switzerland.Signature collection document. Source: InitiativeBTC.chThe
    initiative requests to change the third paragraph of Article 99 of the constitution.
    The relevant text currently states:“The Swiss National Bank shall create sufficient
    currency reserves from its revenues; part of these reserves shall be held in gold.”If
    successful, the campaign would result in adding “and in Bitcoin.” to the end of
    the paragraph. The initiative saw the participation of the Swiss Bitcoin nonprofit
    think tank 2B4CH, which was responsible for preparing and submitting the documents.
    2B4CH had some ties to industry heavyweights, with Giw Zanganeh, vice president
    of energy and mining at leading stablecoin issuer Tether, helping launch the campaign.Related:
    Crypto bank Sygnum hits unicorn status with new $58M raiseThe campaign is still
    ongoingMeisser claims that holding Bitcoin would free the central bank from the
    political influence of its foreign currency holdings, most of which are in US
    dollars and euros. According to him, “politicians eventually give in to the temptation
    of printing money to fund their plans, but bitcoin is a currency that cannot be
    inflated through deficit spending.” 2B4CH founder and chairman Yves Bennaïm told
    Reuters:“We are not saying — go all in with bitcoin, but if you have nearly 1
    trillion francs in reserves, like the SNB does, then it makes sense to have 1–2%
    of that in an asset that is increasing in value, becoming more secure, and that
    everyone wants to own.”Switzerland is a hub for blockchain enterprises, with its
    “Crypto Valley” in the town of Zug being the location where Ethereum was founded.
    The nation continues to generate crypto initiatives, with global grocery giant
    Spar rolling out Bitcoin-based payments in a Swiss city earlier this month.The
    crypto Valley surpassed the $593 billion valuation mark, showcasing the growth
    trajectory of the region’s blockchain industry in 2024. Last year, the area saw
    the emergence of 17 crypto startup unicorns.Magazine: Crypto Valley and the Crypto
    Oasis: Ralf Glabischnig\n\n            "

- title: " $65K Bitcoin price targets pile up as &#039;Spoofy the Whale&#039; buys
    the dip "
  url: https://cointelegraph.com/news/65k-bitcoin-price-targets-pile-up-spoofy-whale-buys-dip?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin (BTC) circled $83,000 on March 30 after weekend volatility brought
    new ten-day lows.BTC/USD 4-hour chart. Source: Cointelegraph/TradingViewBTC price
    action deals snap weekend downsideData from Cointelegraph Markets Pro and TradingView
    showed BTC/USD gradually recovering after a trip to $81,600 the day prior.With
    no added selling pressure from the ongoing rout in US stock markets, Bitcoin managed
    to erase most of the downside to come full circle versus the last Wall Street
    close.“Quite the volatility for a weekend indeed,” popular trader Daan Crypto
    Trades summarized in part of his latest content on X. “Looking like it might end
    up opening on Monday where it closed on Friday as most of the dump has been retraced
    now.”BTC/USDT 15-minute chart with CME futures data. Source: Daan Crypto Trades/XDaan
    Crypto Trades eyed the potential for a new gap in CME Group’s Bitcoin futures
    markets to be created thanks to the erratic market moves.“Would be nice to not
    open with a gap for once so we can focus on everything else instead,” he argued,
    adding that a “big week” lay ahead.Others had little hope for a short-term turnaround
    in Bitcoin’s fortunes. Veteran trader Peter Brandt even doubted the stability
    of the multimonth lows seen earlier this month.I am not a big fan of inverted
    H&S patterns with downward slanting necklines. H&S patterns with horizontal necklines
    are far more reliable $BTC pic.twitter.com/GKGUZbrab8— Peter Brandt (@PeterLBrandt)
    March 29, 2025“Don't shoot the messenger. Just reporting on what the chart says
    until it says something different,” he told X followers this week, giving a new
    lower BTC price target. “Bear wedge completed with 2X target from the double top
    at 65,635.”BTC/USD 1-day chart. Source: Peter Brandt/XBrandt’s is not the only
    $65,000 BTC price prediction currently in force.Can “spoofy” $78,000 Bitcoin bids
    be trusted?Updating his market observations, meanwhile, Keith Alan, co-founder
    of trading resource Material Indicators, doubled down on his suspicions that a
    large-volume entity had been manipulating BTC price action lower in recent weeks.Related:
    'Bitcoin Macro Index' bear signal puts $110K BTC price return in doubtAs Cointelegraph
    reported, the entity, which Alan dubbed “Spoofy, The Whale,” had used overhead
    liquidity to pressure the price lower and stop it from gaining traction above
    $87,500.This form of order book manipulation, known as “spoofing,” is a common
    feature in crypto and can involve both bid and ask liquidity.“While I have no
    real way of confirming that it is the same entity using ask liquidity to herd
    price into their own bids, it certainly appears that Spoofy has been buying this
    dip and has bids laddered down to $78k,” he concluded on the day.An annotated
    chart showed all key liquidity clusters thought to be of dubious origin, with
    Alan now giving reason for optimism.He concluded: “In the grand scheme of things,
    none of this means BTC price can’t go lower, but it does mean that the whale that
    has been suppressing BTC price for the last 3 weeks is using a DCA strategy to
    buy this dip…and so am I.”BTC/USDT order book data for Binance. Source: Keith
    Alan/XThis article does not contain investment advice or recommendations. Every
    investment and trading move involves risk, and readers should conduct their own
    research when making a decision.\n\n            "

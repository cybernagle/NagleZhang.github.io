    higher levels. The DOGE/USDT pair may then slump to the 50-day SMA ($0.17), which
    is likely to act as strong support.Cardano price predictionBuyers have successfully
    held the retest of the neckline in Cardano (ADA), indicating buying on dips.ADA/USDT

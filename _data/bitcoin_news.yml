- title: " Bitcoin trader swaps $1.25B long for short as BTC price slides under $108K "
  url: https://cointelegraph.com/news/bitcoin-trader-swaps-1-25b-long-for-short-as-btc-price-108k?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Key points:Bitcoin is heading further away from its latest all-time highs
    as US trade tariffs dictate the mood.Traders are unfazed, arguing that BTC price
    action can retest even lower levels while maintaining its bull run.Hyperliquid
    trader James Wynn goes short BTC after closing a long worth $1.25 billion.Bitcoin
    (BTC) failed to maintain $108,000 into the May 25 weekly close as price action
    struggled to shake off new US trade war woes.BTC/USD 1-hour chart. Source: Cointelegraph/TradingViewTrump
    “hot air” blamed as Bitcoin halts price discoveryData from Cointelegraph Markets
    Pro and TradingView showed BTC/USD staying near multiday lows.After snap losses
    accompanied comments by US President Donald Trump over 50% tariffs on goods from
    the EU, crypto immediately felt the heat, and $112,000 remained Bitcoin’s latest
    all-time high.Further episodes, this time involving goods from specific tech giants,
    continued the impact, leading market participants to complain about Trump’s hold
    over volatility.Source: Truth Social“More hot air from the Manipulator in Chief,”
    Keith Alan, co-founder of trading resource Material Indicators, wrote in part
    of a response on X.Alan nonetheless had good news for Bitcoin bulls, arguing that
    price had more room to retest support without extinguishing the broader uptrend.“The
    MACRO trend line and 2 key Moving Averages on the Bitcoin Daily chart currently
    have confluence with the Yearly Open,” he noted, referring to the BTC/USD 2025
    opening level at around $93,500. “As long as BTC is trading above that zone, the
    Bull trend is still intact.”BTC/USD 1-day chart. Source: Keith Alan/XPopular trader
    Crypto Tony held a similar view, suggesting that even another $4,000 drop from
    current levels by the weekly close would be acceptable.$BTC / $USD - Update A
    close above $108,000 this week would be perfect, but a close above $104,000 is
    equally as ok as we clear the resistance zone pic.twitter.com/f1jYRouinj— Crypto
    Tony (@CryptoTony__) May 25, 2025Fellow trader Merlijn eyed a classic short-term
    BTC price magnet in the form of a new “gap” on CME Group’s Bitcoin futures.“$BTC
    just left a fresh CME Gap at $107,230,” he showed on the day. “These gaps don’t
    stay open for long. Expect price to come back and fill it. Eyes on that level.”BTC/USD

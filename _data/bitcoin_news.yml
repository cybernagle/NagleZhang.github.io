- title: " Bitcoin rally above $100K may follow US Treasury buybacks — Arthur Hayes "
  url: https://cointelegraph.com/news/bitcoin-rally-may-follow-us-treasury-buybacks?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Investors seeking Bitcoin exposure may be running out of time to purchase
    below a six-figure price, as US Treasury buybacks may signal the next leg up for
    the world’s first cryptocurrency.This might be the “last chance” to buy Bitcoin
    (BTC) below the $100,000 mark, according to Arthur Hayes, co-founder of BitMEX
    and chief investment officer of Maelstrom.“Seriously fam, this might be the last
    chance you have to buy $BTC post, hinting at incoming “treasury buy backs” as
    the “Bazooka” for Bitcoin’s price trajectory.Source: Arthur HayesTreasury buybacks
    refer to the US Treasury Department repurchasing its outstanding bonds from the
    open market to increase liquidity, manage federal debt or stabilize interest rates.These
    operations can inject liquidity into the financial system, often benefiting risk
    assets like Bitcoin.Related: Bitcoin up 33% since 2024 halving as institutions
    disrupt cycleOther analysts predicted that the growth of the fiat money supply
    will be Bitcoin’s main catalyst in 2025.BTC projection to $132,000 on M2 money
    supply growth. Source: Jamie CouttsThe growing money supply may push Bitcoin’s
    price above $132,000 before the end of the year, according to Jamie Coutts, chief
    crypto analyst at Real Vision.However, global trade war concerns may limit investor
    appetite until the US and China reach a trade agreement.Related: Metaplanet tops
    $400M Bitcoin holdings with new $28M purchaseUS dollar sinks to 2022 low, Bitcoin
    gains momentumBitcoin briefly rose above $87,700 for the first time in nearly
    three weeks, since US President Donald Trump announced reciprocal import tariffs
    on April 2.“Looks like Bitcoin is pumping on continued Dollar weakness,” wrote
    André Dragosch, the European head of research at Bitwise, adding that the US Dollar
    Index “just touched the lowest level since March 2022.”BTC, DXY, 1-year chart.
    Source: Cointelegraph/TradingViewThe weakening US dollar may reinforce Bitcoin’s
    appeal as a safe-haven asset, Ryan Lee, chief analyst at Bitget Research, told
    Cointelegraph, adding:“Strong volume and technical confirmation from a descending
    wedge breakout suggest a potential test of the $90,000 resistance, with macro
    factors like a weakening dollar and rising gold correlation reinforcing BTC’s
    appeal as a hedge.”Despite the recent correction, Japanese and UK-based investment
    firms are investing hundreds of millions into Bitcoin, signaling continued institutional
    adoption that may accelerate Bitcoin’s four-year cycle.This article does not contain
    investment advice or recommendations. Every investment and trading move involves
    risk, and readers should conduct their own research when making a decision.Magazine:
    SCB tips $500K BTC, SEC delays Ether ETF options, and more: Hodler’s Digest, Feb.
    23 – March 1\n\n            "

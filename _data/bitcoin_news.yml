- title: " Bitcoin futures divergences point to transitioning market — Are BTC bulls
    accumulating? "
  url: https://cointelegraph.com/news/bitcoin-futures-divergences-point-to-transitioning-market-are-btc-bulls-accumulating?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin’s (BTC) price has dropped 5.6% over the past seven days, closing
    three daily candles below the $80,000 support for the first time since Nov. 9,
    2024. Data from Glassnode highlighted Bitcoin witnessing a 64% rise in futures
    volume during the same period. The analytics platform said that “this marks a
    reversal from the past month,” when futures volume progressively decreased.A rise
    in futures volumes suggested heightened market activity, but further analysis
    of the broader futures market revealed a more complex outlook. Bitcoin’s open
    interest (OI), representing the total value of outstanding futures contracts,
    declined 19% over the past two weeks.Bitcoin futures volume chart by Glassnode.
    Source: X.comThis reduction suggests that while trading volume is increasing,
    some traders are closing their positions rather than keeping them open, possibly
    to lock in profits or mitigate risk with respect to Bitcoin’s bearish market structure.
    Total market liquidation chart. Source: CoinGlassTotal crypto liquidations also
    reached $2 billion between April 6 to April 8, further strengthening the likelihood
    of traders adopting a cautious approach. Considering this data collectively suggests
    that Bitcoin might be in a transitionary state. The surge in futures volume reflects
    growing interest and speculative activity, potentially signaling the end of a
    correction phase and the start of an accumulation period. Yet, the decline in
    open interest highlights a risk-off approach, with traders reducing exposure amid
    lingering macroeconomic uncertainty.If Bitcoin price fails to recover while futures
    volume and open interest converge, that might signal the beginning of a bear market.
    Likewise, Bitcoin’s price rising alongside OI and trading volumes would imply
    an accumulation period, followed by a possible uptrend. Related: Bitcoin on verge
    of largest ‘price drawdown’ of the bull market — AnalystSpot Bitcoin ETF outflows
    remain minimalMajor US equities are currently down more than 20% from their all-time
    highs, with the S&P 500 losing a year’s growth in just over a month. While traditional
    institutions have possibly faced significant unrealized losses over the past two
    weeks, spot Bitcoin ETF outflow data did not reflect the market panic just yet.
    Total spot BTC ETF flows data. Source: SosovalueOver the past two weeks, the total
    spot BTC ETF outflows have been just under $300 million. This divergence highlights
    a resilience in Bitcoin's institutional investor base. Unlike the selling seen
    in equity markets, the limited outflows from spot BTC ETFs suggest that institutional
    investors are not yet panicking, potentially viewing Bitcoin as a hedge or maintaining
    confidence in its long-term value amid traditional market turmoil.Related: Bitcoin’s
    24/7 liquidity: Double-edged sword during global market turmoilThis article does
    not contain investment advice or recommendations. Every investment and trading
    move involves risk, and readers should conduct their own research when making
    a decision.\n\n            "

    analyst said, “At the $96K level, there will be the final resistance from the
    cohort holding coins for 3-6 months, after which the next target of $100K opens
    up.”Bitcoin realized price analysis. Source: X.comRelated: Why is Bitcoin price
    up today?392,000 Bitcoin at $97K could trigger a sell-offAccording to Bitcoin’s
    cost basis distribution data, investors hold approximately 392,000 BTC at an average

    Bitcoin (BTC) ETFs recorded $211.7 million in inflows. However, BlackRock’s IBIT
    was the only fund to post gains in the trading day, adding $430.8 million and
    extending its inflow streak to eight consecutive days.Grayscale’s GBTC led outflows

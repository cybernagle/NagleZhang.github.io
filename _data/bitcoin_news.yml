    Stockmoney Lizards/XStockmoney Lizards acknowledged that upside continuation may
    take some time.“This test doesn’t guarantee an immediate pump, but history indicates
    we're approaching a bottoming zone,” it concluded.“How long does this take? Well,
    nobody knows. These days, news, macroeconomic signals etc. can determine the duration

- title: " Michigan lawmakers file 4 crypto bills on retiree funds, CBDCs, mining "
  url: https://cointelegraph.com/news/michigan-lawmakers-introduce-four-crypto-bills?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Michigan lawmakers have introduced four crypto-related bills covering
    crypto mining, central bank digital currencies (CBDCs) and crypto in state retirement
    funds.Republican state Representative Bill Schuette introduced House Bill 4510
    on May 21, which would amend Michigan’s Public Employee Retirement System Investment
    Act to allow the state treasurer, currently Rachael Eubanks, to invest in cryptocurrencies
    that have averaged a market cap above $250 million over the last calendar year.Bitcoin
    (BTC) and Ether (ETH) are the only cryptocurrencies that currently meet that threshold.
    The bill adds that any cryptocurrencies must be held in the form of an exchange-traded
    product issued by a registered investment company.A similar bill was introduced
    in February, permitting the state treasurer to allocate up to 10% of Michigan’s
    Budget Stabilization Fund into crypto.Republican Representative Bryan Posthumus
    led the introduction of the second bipartisan crypto bill on May 21, HB 4511,
    which would prohibit Michigan from banning crypto or imposing licensing requirements
    on crypto holders. It would also prohibit state officials from advocating or supporting
    a proposed CBDC from the federal government.The bill defines advocating or supporting
    a CBDC to involve issuing a memorandum or official statement endorsing a CBDC
    proposal related to its testing, adoption or implementation.Source: Bitcoin LawsMichigan
    to consider two crypto mining billsHB 4512, the third crypto bill introduced by
    a bipartisan group led by Democratic Representative Mike McFall, would create
    a Bitcoin mining program allowing operators to set up at abandoned oil and gas
    sites. A supervisor would be assigned to determine how much oil or gas could reasonably
    be expected to be produced from the site, who the last operator of the site was
    and how long it has been left unused.Related: US Senate moves forward with GENIUS
    stablecoin billThose seeking to participate in the program would need to submit
    legal documents outlining their organizational structure, demonstrate their ability
    to operate as a Bitcoin mining entity and provide estimates of the breakeven price
    for a profitable venture.The fourth bill, HB 4513 — also filed by a McFall-led
    bipartisan group — would amend Michigan’s income tax laws to include income obtained
    from the proposed Bitcoin mining program.Magazine: Crypto wanted to overthrow
    banks, now it’s becoming them in stablecoin fight \n\n            "

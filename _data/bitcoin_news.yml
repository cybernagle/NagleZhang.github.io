- title: " How crypto payments can become the new ‘tap-and-go’ — Pulsar co-founder "
  url: https://cointelegraph.com/news/how-crypto-payments-can-become-the-new-tap-and-go-pulsar-co-founder?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "What if paying with crypto was as easy and as fun as sending a meme on
    X?In the latest episode of The Clear Crypto Podcast, StarkWare’s Nathan Jeffay
    and Cointelegraph’s Gareth Jenkinson sit down with Stefana Banciu, growth lead
    at Pulsar Money, to explore how blockchain is bringing payments into the digital
    age, with speed, transparency and a dash of playfulness.Transforming Web3 paymentsBanciu
    lays out how Pulsar is pushing the frontier of Web3 payments with features like
    social transfers that allow users to send crypto directly through X, simply by
    tagging a handle. “You can actually have super seamless, easy and convenient payments,
    and it can also be super fun.”The episode cuts through the crypto jargon to tackle
    a question with mainstream resonance: Why aren’t we using crypto for everyday
    transactions yet?“I wish I could say yes, but that wouldn’t be a true reflection
    of the state of affairs,” Jenkinson admits when asked if crypto is widely used
    for payments. He points to Mastercard-linked crypto cards as a stopgap, but says
    the real revolution hasn’t yet reached the coffee shop counter.Related: Luxury
    app Dorsia taps MoonPay for crypto paymentsFor Banciu, the path forward lies in
    bridging fun and fundamentals. While crypto’s founding ideals include borderless,
    permissionless transfers and low fees, she says onboarding the next wave of users
    will require experiences that are intuitive, social and entertaining.Their platform
    includes a “social payments module” that lets users send crypto directly through
    X by tagging a handle, a small but powerful step toward making transactions feel
    more like communication than banking.“You can actually send funds directly on
    Twitter,” Banciu says. “This is a cool use case to showcase people that yes, with
    crypto payments you can actually have super seamless, easy and convenient payments.”But
    convenience alone isn’t enough. Banciu says making crypto fun is key to onboarding
    the next wave of users. “We all know within the crypto space, the whole community
    that is here for perhaps something else than payments, which is quite boring,
    right?” she adds. “So we said, OK, why not think of a way to onboard users, make
    them do payments in a fun way?”For Jenkinson, making crypto usable as a true “medium
    of exchange” is essential to its legitimacy.“If we’re not using cryptocurrencies
    as a medium of exchange, then it’s not solving one of the core characteristics
    that makes money, money.”To hear the full conversation on The Clear Crypto Podcast, 
    listen to the full episode on Cointelegraph’s Podcasts page, Apple Podcasts or
    Spotify. And don’t forget to check out Cointelegraph’s full lineup of other shows! Magazine:
    SEC’s U-turn on crypto leaves key questions unanswered\n\n            "
  published: 2025-04-24 14:30:00.000000000 +01:00
- title: " New Hampshire Bitcoin reserve bill heads to full Senate vote "
  url: https://cointelegraph.com/news/new-hampshire-bitcoin-reserve-bill-clears-senate-committee?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "A bill that would allow New Hampshire to invest a portion of its state
    funds in digital assets and precious metals has advanced to a full Senate vote
    after passing a second committee.On April 23, House Bill 302 (HB 302) was reviewed
    in the second Senate committee and passed in a 4-1 vote.The legislation, introduced
    in January, cleared the New Hampshire House earlier this month in a 192–179 vote.
    It now faces a vote by the full Senate and, if approved, will require the governor’s
    signature to become law.Once enacted, it would allow the New Hampshire treasury
    to use 10% of the state’s general funds to invest in crypto with a market cap
    of over $500 billion — a threshold currently met only by Bitcoin (BTC).Source:
    Bitcoin LawsDemocratic representative opposes New Hampshire’s crypto reserve bill  During
    a debate before the full House vote, Democratic Representative Terry Spahr argued
    that the bill is unnecessary. The lawmaker said it could undermine the future
    security of the state’s digital asset stockpile. Spahr argued that the state treasurer
    already has the authority to manage investments without the bill.Others said that
    it could earn the state good returns for its investment. Republican Representative
    Jordan Ulery said the investments could net the state a “large amount of money.”Related:
    US federal agencies to report crypto holdings to Treasury by April 7Bitcoin Laws,
    which tracks the progress of digital asset legislation, shows that New Hampshire
    also has two more blockchain-related bills going through its legislature. HB 639
    addresses blockchain dispute resolution and regulatory frameworks, while HB 310
    focuses on real-world asset tokenization and stablecoin usage.New Hampshire’s
    progress comes as Arizona pursues a more aggressive approach by exploring the
    creation of a strategic Bitcoin reserve, aiming to become the first US state to
    implement the policy.Magazine: Ethereum maxis should become ‘assholes’ to win
    TradFi tokenization race\n\n            "
  published: 2025-04-24 14:21:47.000000000 +01:00
- title: " Asian firms ramp up Bitcoin buys: Metaplanet, HK Asia lead charge "
  url: https://cointelegraph.com/news/asian-firms-bitcoin-accumulation-metaplanet-hk-asia-strategy?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Asian investment firms are stepping up their Bitcoin accumulation strategies,
    with Japan’s Metaplanet and Hong Kong’s HK Asia Holdings leading the way.Tokyo-based
    Metaplanet disclosed on April 24 that it acquired an additional 145 Bitcoin (BTC)
    for 1.9 billion Japanese yen (around $13.4 million), boosting its total holdings
    to 5,000 BTC.Metaplanet CEO Simon Gerovich confirmed the company had reached 50%
    of its initial goal of amassing 10,000 BTC by the end of 2025.Metaplanet CEO Simon
    Gerovich announcing Bitcoin purchase. Source: Simon GerovichThe firm has been
    aggressive in its Bitcoin treasury operations, using bond issuances and Bitcoin
    income strategies such as selling cash-secured BTC put options to finance its
    acquisitions.Since initiating its Bitcoin strategy, Metaplanet’s stock has surged
    over 3,000%. The company aims to hold 21,000 BTC by the close of 2026.Related:
    Strike’s Mallers to head firm seeking superior Bitcoin play to MSTRHK Asia Holdings
    to raise $8.35 million for BTC purchasesHK Asia Holdings has also announced plans
    to raise about $65 million Hong Kong dollars ($8.35 million) by issuing new shares
    and convertible notes to potentially buy more BTC.According to an April 23 filing,
    the company entered into share subscription and convertible note (CN) subscription
    agreements after trading hours.The deal includes issuing 3,272,000 new shares
    at a subscription price of HK$4.01 per share, alongside convertible notes valued
    at HK$52.38 million in aggregate principal amount. The newly issued shares will
    represent about 0.82% of HK Asia Holdings’ total shares in circulation.While the
    filing does not mention that HK Asia Holdings intends to use the funds to buy
    Bitcoin, many in the crypto community speculated that the capital raise is expected
    to fund further Bitcoin acquisitions.Source: CointelegraphThe speculation follows
    HK Asia’s February decision to step into Bitcoin markets. After buying its first
    BTC on Feb. 16, the firm doubled its share price within a day.By Feb. 20, HK Asia
    expanded its holdings by purchasing an additional 7.88 BTC, bringing its total
    to nearly 9 BTC at an average price of $97,021 per coin.Shares in HK Asia were
    up by around 5.4% on April 24 at the Hong Kong stock market closing, according
    to Google Finance.Related: Bitcoin exchange buying is back as ‘Spoofy the Whale’
    lifts $90K asksSaylor’s Strategy champions Bitcoin strategyMichael Saylor’s Strategy,
    the world’s largest publicly listed corporate Bitcoin holder, has championed the
    Bitcoin accumulation strategy by consistently issuing convertible notes and at-the-market
    (ATM) equity offerings to fund aggressive Bitcoin purchases.In February, Strategy
    announced plans to raise another $2 billion through 0% senior convertible notes
    to purchase more Bitcoin.As of April 20, Strategy held 538,200 BTC on its balance
    sheet. The figure includes the company’s most recent acquisition of 6,556 BTC
    for about $555.8 million.Magazine: Bitcoin ATH sooner than expected? XRP may drop
    40%, and more: Hodler’s Digest, March 23–29\n\n            "

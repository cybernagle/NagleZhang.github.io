- title: " Peak &#039;FUD&#039; hints at $70K floor — 5 Things to know in Bitcoin
    this week "
  url: https://cointelegraph.com/news/peak-fud-70k-floor-5-things-bitcoin-this-week?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWEzMjEtOGNjMC03ZGExLThiM2UtZDk3NmJmMWMzNDdi.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWEzMjEtOGNjMC03ZGExLThiM2UtZDk3NmJmMWMzNDdi.jpg\"
    alt=\"Peak 'FUD' hints at $70K floor — 5 Things to know in Bitcoin this week\"></p><p>Bitcoin
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>) heads into
    FOMC week in a cautious mood, with multimonth lows still uncomfortably close.<ul><li><p>BTC
    price action preserves $80,000 support as upside liquidity looks ripe for the
    taking.</p></li><li><p>The Fed is the center of attention with a decision due
    on interest rates and traders eagerly scanning Chair Jerome Powell for dovish
    signals.</p></li><li><p>A return to accumulation among Bitcoin top buyers forms
    grounds for confidence over market stability going forward.</p></li><li><p>Historical
    BTC price cycle analysis delivers an impressive $126,000 target for the start
    of June.</p></li><li><p>Those looking to &ldquo;be greedy when others are fearful&rdquo;
    should concentrate on $69,000, research concludes.&nbsp;</p></li></ul><h2><br>Bitcoin
    trader sees $87,000 liquidity grab</h2><p>A comparatively quiet weekend saw BTC/USD
    avoid a <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/biggest-red-weekly-candle-ever-5-things-bitcoin-this-week\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">lasting sell-off</a>
    into the weekly close, instead only dipping to $82,000 before rebounding.&nbsp;</p><p>Data
    from <a data-ct-non-breakable=\"null\" href=\"https://subscription.cointelegraph.com/?_gl=1*7499wx*_ga*MTQ0MzQ0NzI4Ny4xNzE2MzY1NTA0*_ga_53R24TEEB1*MTcxNjM2NTUwNC4xLjEuMTcxNjM2Njg2MC4wLjAuMA..\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Cointelegraph Markets
    Pro</a> and <a data-ct-non-breakable=\"null\" href=\"https://www.tradingview.com/symbols/BTCUSD/?exchange=BITSTAMP\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">TradingView</a> shows
    a broad reclaim of the $80,000 mark cementing itself in recent days.</p><figure><img
    alt=\"Peak 'FUD' hints at $70K floor &mdash; 5 Things to know in Bitcoin this
    week\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a324-97c1-7040-b6b7-327111007072\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>BTC/USD 1-hour chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>&ldquo;Not
    a bad Sunday for Bitcoin,&rdquo; crypto trader, analyst and entrepreneur Micha&euml;l
    van de Poppe <a data-ct-non-breakable=\"null\" href=\"https://x.com/CryptoMichNL/status/1901289715283755292\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">summarized</a> in part
    of his latest market analysis on X.&nbsp;</p><blockquote>&ldquo;We still have
    Monday to go, but this looks like we're making a new higher low on Bitcoin before
    attacking the highs again.&rdquo;</blockquote><figure><img alt=\"Peak 'FUD' hints
    at $70K floor &mdash; 5 Things to know in Bitcoin this week\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a322-9e79-78a7-8820-261f6fd3b44f\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>BTC/USDT 4-hour chart.
    Source: Micha&euml;l van de Poppe/X</em></p></figcaption></figure><p>Other market
    participants echoed the sentiment, including those seeing another retest of <a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/mt-gox-makes-second-billion-dollar-transfer-as-bitcoin-tanks-to-76000\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">multimonth lows</a>
    to take liquidity and &ldquo;trap&rdquo; late shorts.</p><p>&ldquo;I think Bitcoin
    will hit 78k first to grab liquidity before an Upside Breakout,&rdquo; popular
    trader Captain Faibik <a data-ct-non-breakable=\"null\" href=\"https://x.com/CryptoFaibik/status/1901504430970679532\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">argued</a> in part of
    his own X content.&nbsp;</p><blockquote>&ldquo;Once the breakout occurs, Bitcoin
    is likely to reach 109k in the coming weeks (Possibly by mid-April).&rdquo;</blockquote><figure><img
    alt=\"Peak 'FUD' hints at $70K floor &mdash; 5 Things to know in Bitcoin this
    week\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a323-1f41-79c2-b2a4-51c25ab778cf\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>BTC/USDT 1-day chart.
    Source: Captain Faibik/X</em></p></figcaption></figure><p>Fellow trader CrypNuevo
    meanwhile noted that liquidity was skewed mostly to the upside, resulting in key
    targets for bulls to take.</p><p>&ldquo;The area between $85.4k &amp; $87.1k is
    the main liquidity zone,&rdquo; an X thread explained.&nbsp;</p><blockquote>&ldquo;A
    move up targeting this area in the upcoming week seems more than likely.&rdquo;</blockquote><figure><img
    alt=\"Peak 'FUD' hints at $70K floor &mdash; 5 Things to know in Bitcoin this
    week\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a323-8ea9-772e-848a-9b613896813d\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Bitcoin exchange order
    book liquidity data. Source: CrypNuevo/X</em></p></figcaption></figure><h2><br>Fed&rsquo;s
    Powell in the spotlight as FOMC week arrives</h2><p>Bitcoin and risk-asset traders
    have one macroeconomic event only on their minds this week: the US Federal Reserve&rsquo;s
    interest rate decision.</p><p>Coming at what commentary <a data-ct-non-breakable=\"null\"
    href=\"https://x.com/KobeissiLetter/status/1901257035468935269\" rel=\"null\"
    target=\"null\" text=\"null\" title=\"null\">calls</a> a &ldquo;pivotal point
    in time,&rdquo; the move by the Federal Open Market Committee (FOMC) will have
    wide-ranging implications for market sentiment.</p><p>On the surface, it appears
    that few surprises will likely come as a result of the second meeting of 2025
    &mdash; inflation may be cooling, but Fed officials, including Chair Jerome Powell,
    maintain a hawkish stance on the economy and financial policy.</p><p>Powell has
    repeatedly stated that he is in no rush to cut rates, leading to almost unanimous
    market bets that current levels will remain unchanged after FOMC.</p><blockquote
    class=\"twitter-tweet\"><p lang=\"en\" dir=\"ltr\">&#127482;&#127480; FOMC: Polymarket
    users predict a 99% chance that the Fed will not make any rate cut changes on
    Mar. 20. <a href=\"https://t.co/zaDGBsmAZM\">pic.twitter.com/zaDGBsmAZM</a></p>&mdash;
    Cointelegraph (@Cointelegraph) <a href=\"https://twitter.com/Cointelegraph/status/1901423573136474219?ref_src=twsrc%5Etfw\">March
    17, 2025</a></blockquote><script async src=\"https://platform.twitter.com/widgets.js\"
    charset=\"utf-8\"></script><p>The latest estimates from CME Group&rsquo;s <a data-ct-non-breakable=\"null\"
    href=\"https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html\">FedWatch
    Tool</a> see a high probability of cuts coming only in June.</p><p>Should Powell
    strike a more relaxed tone during his accompanying statement and press conference,
    the mood could easily flip.</p><p>&ldquo;If Powell even whispers &lsquo;QE&rsquo;
    at the next FOMC, markets will move fast,&rdquo; crypto technical analyst Kyle
    Doops <a data-ct-non-breakable=\"null\" href=\"https://x.com/kyledoops/status/1900864585772699674\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">argued</a> in part of
    an X post on the topic.&nbsp;</p><blockquote>&ldquo;But knowing Powell, he&rsquo;ll
    keep it as vague as possible.&rdquo;</blockquote><figure><img alt=\"Peak 'FUD'
    hints at $70K floor &mdash; 5 Things to know in Bitcoin this week\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a326-549f-7d83-83e6-93896c3cb544\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Fed target rate probabilities.
    Source: CME Group</em></p></figcaption></figure><p>Doops referred to quantitative
    easing, a byword for liquidity injections and something that historically benefits
    crypto performance.</p><p>Behind the scenes, US M2 money supply is already increasing
    &mdash; a key ingredient for a crypto market rebound.</p><p>&ldquo;M2 money supply
    rose +3.9% year-over-year in January, the fastest pace in 30 months. This is the
    11th straight month of money supply expansion,&rdquo; trading resource The Kobeissi
    Letter <a data-ct-non-breakable=\"null\" href=\"https://x.com/KobeissiLetter/status/1901036222677385639\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">noted</a> at the weekend.</p><p>Kobeissi
    added that worldwide liquidity is following a similar pattern.</p><p>&ldquo;Meanwhile,
    global money supply has risen by ~$2.0 trillion over the last 2 months, to its
    highest since September 2024,&rdquo; it reported.</p><blockquote>&ldquo;Money
    supply is expanding again.&rdquo;&nbsp;&nbsp;</blockquote><figure><img alt=\"Peak
    'FUD' hints at $70K floor &mdash; 5 Things to know in Bitcoin this week\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a326-d738-776a-92c0-570582cf01ae\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>US M2 money supply
    chart. Source: The Kobeissi Letter/X</em></p></figcaption></figure><h2>Recent
    buyers show new &ldquo;hodling behavior&rdquo;</h2><p>Newer Bitcoin investors
    are showing signs of maturing behavior as the bull market drawdown persists.</p><p>The
    latest findings from onchain analytics platform CryptoQuant reveal accumulation
    taking over for the older half of the short-term holder (STH) cohort.</p><p>STH
    entities are those who bought BTC up to six months ago. Per CryptoQuant, investors
    hodling between three and six months are now entering &ldquo;accumulation&rdquo;
    by refusing to succumb to panic selling, despite potentially being underwater
    on their stack.</p><p>&ldquo;According to the latest data, the percentage of coins
    held for 3 to 6 months has been rising rapidly, mirroring the accumulation patterns
    observed during the prolonged correction in the summer of 2024,&rdquo; contributor
    ShayanBTC wrote in one of its &ldquo;<a data-ct-non-breakable=\"null\" href=\"https://cryptoquant.com/insights/quicktake/67d69e30a9545929ecd4ae4e-Bitcoin-Holders-Stay-Resilient-Rising-3-6-Month-UTXOs-Signal-Accumulation-Amid-M\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Quicktake</a>&rdquo;
    blog posts on March 16.</p><blockquote>&ldquo;This trend highlights a hodling
    behavior, where investors refrain from selling their Bitcoin despite the current
    market correction.&rdquo;</blockquote><figure><img alt=\"Peak 'FUD' hints at $70K
    floor &mdash; 5 Things to know in Bitcoin this week\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a327-8ad4-7861-a473-b45f27d1f7c4\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Bitcoin realized cap
    by UTXO age (screenshot). Source: CryptoQuant</em></p></figcaption></figure><p>An
    accompanying chart shows Bitcoin&rsquo;s realized cap split by the age of unspent
    transaction output (UTXOs). This reflects the total value of coins based on the
    price at which they last moved, with those dormant for between three and six months
    rising rapidly.</p><p>&ldquo;Historically, this type of resilience among Bitcoin
    holders has played a crucial role in forming market bottoms and igniting new uptrends,&rdquo;
    the post continues.&nbsp;</p><blockquote>&ldquo;As long-term holders continue
    accumulating, the available supply in circulation decreases, making Bitcoin more
    scarce. When demand eventually picks up, this supply squeeze often leads to price
    surges, pushing Bitcoin toward new record highs.&rdquo;</blockquote><p>As <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-panic-selling-speculators-100-m-6-weeks-research\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Cointelegraph reported</a>,
    however, STH buyers from 2025 have exhibited strikingly different reactions to
    the BTC price drop, selling coins with a combined $100 million loss since the
    start of February alone.</p><h2>$126,000 BTC price by June?</h2><p>Network economist
    Timothy Peterson&rsquo;s historically accurate BTC price metric, Lowest Price
    Forward, recently gave 95% odds of BTC/USD never <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-price-metric-called-2020-bull-run-69k-new-bottom\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">dropping below $69,000
    again</a>.</p><p>Now, <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-gets-126k-june-target-data-predicts-bull-market-comeback\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">another calculation</a>
    sees the potential for new all-time highs by the start of June.</p><figure><img
    alt=\"Peak 'FUD' hints at $70K floor &mdash; 5 Things to know in Bitcoin this
    week\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01959e79-fa0c-7b03-8b4e-7a845f490b40\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Bitcoin seasonal comparison.
    Source: Timothy Peterson/X</em></p></figcaption></figure><p>Comparing BTC price
    performance since 2015 at the weekend, Peterson described Bitcoin as currently
    being &ldquo;near the low end&rdquo; of what remains a standard range.</p><p>The
    next two months, however, should be critical &mdash; April is historically one
    of the two best months for the Bitcoin bull market.&nbsp;</p><p>&ldquo;Nearly
    all of Bitcoin's annual performance occurs in 2 months: April and October,&rdquo;
    Peterson commented.&nbsp;&nbsp;</p><blockquote>&ldquo;It is entirely possible
    Bitcoin could reach a new all-time high before June.&rdquo;</blockquote><figure><img
    alt=\"Peak 'FUD' hints at $70K floor &mdash; 5 Things to know in Bitcoin this
    week\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01959e7a-7ff1-7cfb-b7af-489116f5138d\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Bitcoin growth of
    $100 comparison. Source: Timothy Peterson/X</em></p></figcaption></figure><p>Further
    analysis produced a BTC price target of $126,000 as an average level that Bitcoin
    could still attain within the next two-and-a-half months.&nbsp;</p><h2>$70,000
    marks a key &ldquo;FUD&rdquo; watershed</h2><p>When it comes to BTC price predictions,
    social media analysis is giving research firm Santiment cause to pay attention
    to two levels in particular.</p><p><em><strong>Related: </strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-reclaims-80-k-zone-as-bnb-ton-gt-atom-hint-at-altcoin-season\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Bitcoin
    reclaims $80K zone as BNB, TON, GT, ATOM hint at altcoin season</strong></em></a></p><p>In
    its latest investigation, Santiment tied $69,000 and $100,000 to extremes in market
    outlook.</p><p>&ldquo;Over the past month, we have not seen Bitcoin's market value
    fall below $70K OR rise above $100K,&rdquo; it <a data-ct-non-breakable=\"null\"
    href=\"https://x.com/santimentfeed/status/1900700480034271434\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">summarized</a> on X.&nbsp;</p><blockquote>&ldquo;That
    means looking at the crowd's social predictions of $100K is a great gauge for
    FOMO. Historically, markets move the opposite direction of the crowd's expectations.&rdquo;</blockquote><figure><img
    alt=\"Peak 'FUD' hints at $70K floor &mdash; 5 Things to know in Bitcoin this
    week\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a329-9168-7625-9dd9-0ac99b013f1d\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Bitcoin social media
    data. Source: Santiment/X</em></p></figcaption></figure><p>Accompanying data examined
    social media mentions of various BTC price levels.</p><p>&ldquo;This is why clusters
    of blue bars (representing $10K-$69K $BTC predictions) so reliably foreshadow
    a reversal (or buy signal), especially while markets are moving down and the crowd
    is getting fearful,&rdquo; Santiment explained.</p><figure><img alt=\"Peak 'FUD'
    hints at $70K floor &mdash; 5 Things to know in Bitcoin this week\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a32a-13fb-7a65-9692-904cfe61fd6c\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Crypto Fear &amp;
    Greed Index (screenshot). Source: Alternative.me</em></p></figcaption></figure><p>The
    <a data-ct-non-breakable=\"null\" href=\"https://alternative.me/crypto/fear-and-greed-index/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Crypto Fear &amp; Greed
    Index</a> stood at 32/100 on March 17, out of its &ldquo;extreme fear&rdquo; bracket
    and at its highest levels since Feb. 24.</p><p class=\"post-content__disclaimer\"
    type=\"\">This article does not contain investment advice or recommendations.
    Every investment and trading move involves risk, and readers should conduct their
    own research when making a decision.</p><template data-name=\"subscription_form\"

- title: " Michael Saylor’s Strategy surpasses 500,000 Bitcoin with latest purchase "
  url: https://cointelegraph.com/news/microstrategy-surpasses-500k-bitcoin-holdings-sec-filing?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound

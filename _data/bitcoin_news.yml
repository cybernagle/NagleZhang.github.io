- title: " Bitcoin price volatility &#039;imminent&#039; as speculators move 170K
    BTC — CryptoQuant "
  url: https://cointelegraph.com/news/bitcoin-price-volatility-imminent-speculators-move-170k-btc-cryptoquant?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin (BTC) speculators may spark “significant” BTC price volatility
    as a large tranche of coins moves onchain.In one of its “Quicktake” blog posts
    on April 18, onchain analytics platform CryptoQuant warned that a Bitcoin market
    shake-up is due.CryptoQuant: “Volatility is coming” for BTC priceBitcoin short-term
    holders (STHs) are signaling that the current calm BTC price behavior may not
    last long.CryptoQuant reveals that 170,000 BTC owned by entities with a purchase
    date between three and six months ago has begun to circulate.“Around 170,000 BTC
    are moving from the 3–6 month holder cohort,” contributor Mignolet confirmed. “Large
    movements from this group often signal that significant volatility is imminent.”BTC
    movements by 3-6 month hodler cohort (screenshot). Source: CryptoQuantAn accompanying
    chart shows the impact of previous STH events, with the latest being the largest
    by volume since late 2021. Price direction varies, with both upward and downward
    market responses visible.“Volatility is coming,” Mignolet concluded.Bitcoin speculators
    blamed for sell pressureAs Cointelegraph reported, STH entities are notoriously
    sensitive to snap market moves and transitive narratives.Related: Bitcoin gold
    copycat move may top $150K as BTC stays ‘impressive’Recent BTC price downside
    has been met with episodes of panic selling by the cohort, which is defined as
    an entity buying up to six months previously.Earlier this week, CryptoQuant listed
    STHs as one of the main sources of current Bitcoin selling pressure.“Short-Term
    Holders (STH) have been the primary sellers, sending an average of ~930 BTC/day
    to exchanges,” fellow contributor Crazzyblockk wrote in a separate Quicktake post. “In
    contrast, Long-Term Holders (LTH) only moved about ~529 BTC/day — highlighting
    short-term fear or profit-taking, while long-term conviction remains intact.”Bitcoin
    investor flow comparison (screenshot). Source: CryptoQuantCrazzyblockk described
    a “classic shakeout” occurring in Bitcoin, while allaying concerns over a uniform
    rush for the exit across the investor spectrum.“With Bitcoin trading sideways
    and volatility compressing, this cohort-driven breakdown helps us understand that
    the current correction is not a mass exodus by smart money — it’s more likely
    a reaction from nervous short-term and mid-tier holders,” the post said.This article
    does not contain investment advice or recommendations. Every investment and trading
    move involves risk, and readers should conduct their own research when making
    a decision.\n\n            "

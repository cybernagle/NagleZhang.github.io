    accumulation from both LTHs and STHs, the market appears to be building a solid
    foundation for a potentially significant price breakout. If this trend continues,
    we could be witnessing the early stages of a new bull cycle for Bitcoin.”Bitcoin
    realized cap. Source: CryptoQuantBTC capital influx ongoing since 2023As Cointelegraph
    reported, concerns remain over the fate of the current market rebound.Related:
    BTC dominance due ‘collapse’ at 71%: 5 things to know in Bitcoin this weekMisgivings

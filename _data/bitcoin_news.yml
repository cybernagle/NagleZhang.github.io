    altcoin rallyFunding rates across derivatives platforms remain fairly neutral,
    they note — a similar picture to the run-up to previous all-time highs seen in
    late 2024.CryptoQuant data puts the cross-exchange Bitcoin funding rate at 0.006
    as of May 25.“Sentiment is calm. No overleveraged longs piling in,” trader Jelle
    responded to the numbers. “This is one of the healthiest Bitcoin breakouts in

    above the 50-day SMA ($0.71) to signal that the downtrend could be over. That
    could propel the pair to $0.83 and subsequently to $1.03.UNUS SED LEO price analysisBuyers
    are trying to push UNUS SED LEO (LEO) above the 20-day EMA ($9.39), but the bears
    are posing a substantial challenge.LEO/USD daily chart. Source: Cointelegraph/TradingViewThe
    flattening 20-day EMA and the RSI near the midpoint suggest a balance between
    supply and demand. That could keep the LEO/USD pair stuck between $9.90 and $8.79
    for a few days.The next trending move could begin on a break above $9.90 or below
    $8.79. If buyers kick the price above $9.90, the pair will complete a bullish
    ascending triangle pattern. This bullish setup has a target objective of $12.04.On
    the downside, a break below $8.70 could signal the start of a deeper correction
    toward $8.30.This article does not contain investment advice or recommendations.

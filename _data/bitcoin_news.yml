- title: " New Hampshire governor signs crypto reserve bill into law "
  url: https://cointelegraph.com/news/new-hampshire-bitcoin-reserve-law?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "New Hampshire became the first US state to allow its government to invest
    in cryptocurrencies, including Bitcoin (BTC), after Governor Kelly Ayotte signed
    a bill passed by the legislature into law. In a May 6 notice, Ayotte announced
    on social media that New Hampshire would be permitted to “invest in cryptocurrency
    and precious metals” through a bill passed in the state Senate and House of Representatives.
    House Bill 302, introduced in New Hampshire in January, will allow the state’s
    treasury to use funds to invest in cryptocurrencies with a market capitalization
    of more than $500 billion, eliminating many tokens and memecoins.“The Live Free
    or Die state is leading the way in forging the future of commerce and digital
    assets,” said New Hampshire Republicans in a May 6 X post.Signing New Hampshire’s
    crypto reserve bill into law on May 6. Source: Governor Kelly AyotteWith the signing
    of the bill into law, New Hampshire becomes the first of several US states considering
    passing legislation to establish a strategic Bitcoin reserve, including an initiative
    with the federal government. A similar bill in Arizona passed the state’s House
    in April but was vetoed by Governor Katie Hobbs on May 2, and Florida’s government
    withdrew two crypto reserve bills from consideration on May 3.Related: Bitcoin’s
    role as a reserve asset gains traction in US as states adoptNew Hampshire’s crypto
    plans to precede the US government’s?The efforts to create crypto reserves in
    different US states come as US President Donald Trump and Republican lawmakers
    propose similar policies at the federal level. Trump signed an executive order
    in March to establish a “Digital Asset Stockpile” and a “Strategic Bitcoin Reserve.”Senator
    Cynthia Lummis, who sponsored the Boosting Innovation, Technology, and Competitiveness
    through Optimized Investment Nationwide (BITCOIN) Act, proposed that the US government
    could hold more than 1 million BTC through civil and criminal forfeiture seizures.
    The bill is currently being considered by members of the US Senate Banking Committee.Magazine:
    Crypto wanted to overthrow banks, now it’s becoming them in stablecoin fight\n\n
    \           "

  summary: "Investments in Bitcoin exchange-traded funds (ETFs) rebounded to levels
    last seen in January, signaling a recovery in investor sentiment from concerns
    about global trade tariff escalations.US spot Bitcoin (BTC) ETFs had over $912
    million worth of cumulative net inflows on April 22, marking their highest daily
    investment in more than three months since Jan. 21, Farside Investors data shows.Bitcoin
    ETF Flow, millions. Source: Farside Investors“Bitcoin ETPs just saw the largest
    daily inflows since 21st January in a dramatic improvement in sentiment,” according
    to James Butterfill, head of research at CoinShares.Related: Bitcoin still on
    track for $1.8M in 2035, says analystInvestor sentiment appeared to improve after
    US President Donald Trump said that import tariffs on Chinese goods will “come
    down substantially,” adopting a softer tone in negotiations.The de-escalation
    and growing ETF inflows pushed Bitcoin price above $93,000 for the first time
    in seven weeks, Cointelegraph reported on April 23.The growing institutional investment
    and presence of ETFs may also accelerate the historic four-year cycle and bolster
    BTC to new highs before the end of 2025, analysts told Cointelegraph.US dollar
    weakness may reinforce Bitcoin’s safe-haven appealThe US dollar’s weakness may
    contribute to the growing investor demand for Bitcoin. DXY, year-to-date chart.
    Source: Cointelegraph/TradingView The US Dollar Index (DXY), which measures the
    strength of the greenback against a basket of leading fiat currencies, has declined
    9% since the beginning of 2025, touching a three-year low of 98.8 last seen in
    April 2022, TradingView data shows.“Macro factors like a weakening dollar and
    rising gold correlation” may reinforce Bitcoin’s appeal as a hedge against economic
    volatility, Ryan Lee, chief analyst at Bitget Research, told Cointelegraph.Related:
    Crypto, stocks enter ‘new phase of trade war’ as US-China tensions riseBitcoin
    no longer trading in the “shadow of tech”Crypto and traditional stock markets
    are “walking a tightrope between political drama and economic reality,” with Bitcoin
    staging a significant rebound thanks to “strong ETF inflows, institutional acquisitions,
    and a weakening US dollar,” according to Nexo dispatch analyst Iliya Kalchev:“Bitcoin’s

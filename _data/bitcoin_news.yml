- title: " $400M Web3 investment fund ABCDE halts new investments, fundraising "
  url: https://cointelegraph.com/news/400-m-web3-investment-fund-abcde-halts-investments-fundraising?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Web3 and blockchain-focused investment fund ABCDE is halting new investments,
    but the $400 million fund remains committed to supporting its existing projects.In
    an April 19 X post, ABCDE co-founder and Huobi exchange founder Du Jun said the
    $400 million fund will no longer invest in new projects or raise capital for the
    second phase of the fund.However, Jun said the fund will continue to “post-investment
    support and exit arrangements of existing projects” to ensure the firm’s commitment
    to entrepreneurs and liquidity providers (LPs).“My personal work focus will also
    gradually shift from financial investment in the primary market to strategic investment-led
    and deep incubation-based, focusing more on industrial synergy and long-term value
    creation,” Jun added.Source: Du JunThe announcement comes nearly three months
    after ABCDE’s last investment into an Ethereum layer-2 (L2) solution, Soon (Solana
    Optimistic Network), which raised $22 million through a non-fungible token sale
    to mark the launch of its mainnet, Cointelegraph reported on Jan. 22.SOON block
    times, compared to other blockchains. Source: SOONThe Soon mainnet claims to outperform
    Solana in speed and efficiency, delivering average block times of 50 milliseconds
    compared to Solana’s 400 milliseconds.ABCDE is a $400 million fund, with 28% of
    its investments in Bitcoin (BTC) scaling technology, 16% in Ethereum liquid staking
    derivatives finance (LSDFi) infrastructure, and an additional 12% invested in
    L2s, restaking and smart contract platforms, Cryptorank data shows.ABCDE investments
    focus area, average round size. Source: CryptorankABCDE has invested over $40
    million worth of capital into over 30 projects over the past three years, with
    an internal rate of return (IRR) “still at the global leading level,” despite
    the current market environment, Jun said.Related: Trump family memecoins may trigger
    increased SEC scrutiny on cryptoNew incubator brand Vernal announcedABCDE’s suspension
    of fundraising efforts was announced a month after the fund’s co-founder launched
    a new incubator brand, Vernal.Source: Du JunThe new incubator is set to announce
    its shareholders and incubation rules for the first batch of projects in May,
    along with its first investments.Jun said that the decision to halt ABCDE’s fundraising
    efforts was not made due to financial constraints or lack of funds but because
    of a fundamental concern for the current development trajectory of the crypto
    industry.Related: Crypto, stocks enter ‘new phase of trade war’ as US-China tensions
    rise.“Frankly speaking, I am increasingly unable to agree with the current ecological
    atmosphere of the primary market,” Jun said in an April 19 X post, adding:“Many
    projects are extremely short-sighted and only think about how to get listed on
    the exchange as soon as possible, and what is left behind is often a mess.”“What
    is more worrying is that some primary funds not only have no reflection on this,
    but also hype up their ‘listed projects’ and short-term market value performance,
    but never mention the value creation of the projects themselves,” he added.Cardano
    founder Charles Hoskinson has urged fourth-generation cryptocurrency projects
    to embrace more collaborative tokenomics to compete with major centralized tech
    companies entering the crypto industry.Charles Hoskinson. Source: Cointelegraph“The
    problem right now, with the way we’ve done things in the cryptocurrency space,
    is the tokenomics and the market structure are intrinsically adversarial. It’s
    sum 0,” Hoskinson said at Paris Blockchain Week on April 9. “Instead of picking
    a fight, what you have to do is you have to find tokenomics and market structure
    that allows you to be in a cooperative equilibrium.”“You can’t build a global
    ecosystem this way, and you can’t win this way,” he added. “Because here’s the
    thing. The incumbents are much larger.”Magazine: Your AI ‘digital twin’ can take
    meetings and comfort your loved ones\n\n            "

- title: " Binance debuts centralized exchange to decentralized exchange trades "
  url: https://cointelegraph.com/news/binance-debuts-centralized-exchange-decentralized-exchange-trades?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Crypto exchange Binance has debuted centralized exchange (CEX) to decentralized
    exchange trades (DEX), allowing customers to use funds from their Binance wallets
    to execute DEX trades — eliminating the need for asset bridging or manual transfers.According
    to the exchange, customers can use Circle’s USDC (USDC) and other supported stablecoins
    to acquire tokens on the Ethereum, Solana, Base, and BNB Smart Chain networks.The
    new CEX to DEX feature is also compatible with other tools on the platform, including
    Binance Alpha, which gives users the ability to discover emerging tokens in early-stage
    development, and the Binance quick buy tool.Incorporating CEX to DEX trading unlocks
    a smoother user experience and reduces the complexity of swapping digital assets.
    This reduction in complexity addresses the technical barrier to entry inherent
    in the user experience that makes it difficult for new users to interact with
    digital assets. Complex user interfaces and clunky user experience are some of
    the most widely cited issues in crypto.An online meme poking fun at the complexities
    in crypto. Source: Kev.EthRelated: Web3’s UX problem — and how to fix it, feat.
    Ponder OneOvercoming crypto’s user experience problem and getting crypto out of
    the AOL eraIn November 2024, The WalletConnect Foundation and Reown established
    a standard framework for crypto wallets to enhance the user experience and promote
    ease of use.Pedro Gomes, director of the WalletConnect Foundation, told Cointelegraph
    that the wallet standards framework focused on several key areas, including \"minimizing
    clicks, reducing transaction friction, interoperability, and providing clear and
    accessible information.\"Anurag Arjun, co-founder of Avail — a unified chain abstraction
    solution — and the Polygon layer-2 network, also told Cointelegraph that current
    blockchain abstraction techniques are fragmenting liquidity across the ecosystem.The
    Polygon co-founder said that each blockchain network has its own set of security
    assumptions, presenting challenges for interoperability; Arjun specifically cited
    bridging techniques as cumbersome for the end user.Sandeep Nailwal, who founded
    Polygon alongside Arjun, recently voiced similar sentiments and said that crypto
    needs to enhance user experience before achieving mass adoption, likening the
    current state of crypto to the internet in the late 1990s.Nailwal told Cointelegraph
    that crypto needs to adopt smoother fiat onboarding, better custody solutions
    that feature key recovery, and hardware wallets built into mobile devices to bring
    crypto out of the “AOL era” and achieve mass appeal.Magazine: They solved crypto’s
    janky UX problem — you just haven’t noticed yet\n\n            "

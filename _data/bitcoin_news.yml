    ($85,152) and the relative strength index (RSI) just above the midpoint signal
    the bears are losing their grip. That improves the prospects of a rally above
    the resistance line. If that happens, the BTC/USDT pair could climb to $95,000
    and eventually to $100,000.Alternatively, if the price turns down sharply from
    the resistance line and breaks below $81,000, it will suggest that the bears are
    back in the driver’s seat. The pair may then tumble to $76,606.Ether price analysisEther
    (ETH) rebounded off the $1,754 support on March 31, signaling that the bulls are
    attempting to form a double-bottom pattern.ETH/USDT daily chart. Source: Cointelegraph/TradingViewThe
    bears will try to stall the relief rally at the 20-day EMA ($1,965). If the price
    turns down from the 20-day EMA, the possibility of a break below $1,574 increases.
    The ETH/USDT pair may then collapse to $1,550.Contrarily, a break and close above
    the 20-day EMA opens the doors for a rise to the breakdown level of $2,111. If
    buyers pierce this resistance, the pair will complete a double-bottom pattern,
    starting a rally to the target objective of $2,468.XRP price analysisXRP’s (XRP)
    weak bounce off the crucial $2 support suggests a lack of aggressive buying by
    the bulls at the current levels.XRP/USDT daily chart. Source: Cointelegraph/TradingViewThat
    heightens the risk of a break below $2. If that happens, the XRP/USDT pair will
    complete a bearish head-and-shoulders pattern. This negative setup could start
    a downward move to $1.27. There is support at $1.77, but it is likely to be broken.On
    the upside, a break and close above the 50-day SMA ($2.39) suggests solid buying
    at lower levels. The pair may then rally to the resistance line, where the bears
    are expected to mount a strong defense. A break and close above the resistance
    line signals a potential trend change.BNB price analysisBNB’s (BNB) recovery attempt
    stalled at the moving averages on April 1, indicating that the bears are selling
    on rallies.BNB/USDT daily chart. Source: Cointelegraph/TradingViewThe bears will
    try to strengthen their position by pulling the price below $587. If they can
    pull it off, the BNB/USDT pair could descend to the 50% Fibonacci retracement
    level of $575 and later to the 61.8% retracement of $559. The deeper the pullback,
    the greater the time needed for the pair to recover.A break above the moving averages
    is the first sign that the selling pressure has reduced. The pair may rally to
    $644 and then to $686, which is likely to attract sellers.Solana price analysisSolana
    (SOL) is getting squeezed between the 20-day EMA ($132) and the $120 support,
    signaling a possible range expansion in the short term.SOL/USDT daily chart. Source:
    Cointelegraph/TradingViewIf the price breaks and closes above the 20-day EMA,
    it suggests that the buyers have overpowered the sellers. The SOL/USDT pair may
    rise to the 50-day SMA ($145) and, after that, to $180.This positive view will
    be invalidated in the near term if the price turns down from the moving averages
    and breaks below $120. That could pull the price to $110, where the buyers are
    expected to step in.Dogecoin price analysisDogecoin (DOGE) remains pinned below
    the 20-day EMA ($0.17), indicating that the bears continue to sell on minor rallies.DOGE/USDT
    daily chart. Source: Cointelegraph/TradingViewThe first sign of strength will
    be a break and close above the 20-day EMA. The DOGE/USDT pair may climb to $0.21,
    which could act as a strong barrier. If buyers pierce the $0.21 resistance, the
    pair may rally to $0.24 and later to $0.29.Sellers are likely to have other plans.
    They will try to defend the moving averages and pull the price below $0.16. If
    they manage to do that, the pair could descend to the $0.14 support. A break and
    close below the $0.14 level may sink the pair to $0.10.Cardano price analysisBuyers

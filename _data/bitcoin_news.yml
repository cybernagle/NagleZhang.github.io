- title: " North Carolina lawmaker introduces Digital Asset Freedom Act "
  url: https://cointelegraph.com/news/north-carolina-lawmaker-introduces-digital-asset-freedom-act?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "North Carolina (NC) representative Neal Jackson introduced the North Carolina
    Digital Asset Freedom Act on April 10. The bill proposes that qualifying \"digital
    assets\" be accepted as a legally recognized form of payment and for taxes.Although
    the language of the bill does not specifically mention Bitcoin (BTC), there are
    several provisions laid out that make BTC uniquely qualified under the bill's
    definition of a \"digital asset.\"These stipulations include a minimum market
    capitalization of $750 billion and a daily trading volume of over $10 billion,
    a market history of 10 years or more, proven censorship resistance, proof-of-work
    consensus, lack of a central authority, 99.98% or more network uptime, and a maximum
    supply cap. The bill read:\"The General Assembly further finds that decentralized
    digital assets, which are not governed by any central entity or foundation, align
    with the economic principles of limited, noninflationary money and are capable
    of ensuring the security and integrity of transactions.\"Jackson's bill is merely
    the latest in state-led Bitcoin strategic reserve legislation in the United States
    amid inflation concerns, high US federal debt and a depreciating currency.NC Digital
    Asset Freedom Act. Source: North Carolina LegislatureRelated: North Carolina bills
    would add crypto to state’s retirement systemNorth Carolina takes a firm stance
    against CBDCsFormer North Carolina Governor Roy Cooper vetoed a bill banning a
    central bank digital currency (CBDC) in July 2024. At the time, Cooper characterized
    the bill as \"premature, vague, and reactionary\" to threats that have not yet
    materialized.In August 2024, the North Carolina House of Representatives overrode
    Cooper's veto in a definitive and bipartisan 73-41 vote.The North Carolina Senate
    followed suit by overriding Cooper's veto in a 27-17 vote and passed the anti-CBDC
    legislation into law in September 2024.North Carolina’s anti-CBDC legislation.
    Source: North Carolina Legislature Dan Spuller, the head of industry affairs at
    crypto advocacy organization the Blockchain Association, applauded the action
    taken by NC lawmakers to push back against the tide of CBDCs.\"This bill should
    have never been vetoed, and Governor Cooper blew an opportunity to send a strong
    message to the Federal Reserve that NC stands united against CBDCs,\" Spuller
    wrote in a Sept. 9 X post.Magazine: Bitcoiner sex trap extortion? BTS firm’s blockchain
    disaster: Asia Express\n\n            "

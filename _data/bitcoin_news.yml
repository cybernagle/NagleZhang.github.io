- title: " Bitcoin must close the week above this level to start ‘price discovery
    2’ "
  url: https://cointelegraph.com/news/bitcoin-must-close-week-this-level-start-price-discovery?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Key points:Bitcoin analysis identifies the all-important price point to
    hold into the weekly close as all-time highs loom.Liquidity is tightly clustered
    around current spot price, with $106,000 the likely next battleground.Some traders
    are expecting the bid to enter price discovery to fail.Bitcoin (BTC) preserved
    giant gains into the May 11 weekly close as analysis flagged the key level to

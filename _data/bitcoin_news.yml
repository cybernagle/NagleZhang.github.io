- title: " ‘Bitcoin Standard’ author to develop Austrian economics curriculum for
    UK school "
  url: https://cointelegraph.com/news/lomond-school-bitcoin-curriculum-btc-tuition-ammous-uk?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Lomond School, a private institution in Scotland, will begin accepting
    Bitcoin for tuition payments and is collaborating with Bitcoin author Saifedean
    Ammous to introduce a new curriculum focused on Bitcoin and Austrian economics.
    \ Ammous, author of The Bitcoin Standard, is developing an educational curriculum
    combining the principles of Bitcoin (BTC) and Austrian economics.“I'm going to
    be working with Lomond School to develop a curriculum for bitcoin and Austrian
    economics,” Ammous wrote in an April 12 X post, sharing his excitement for “making
    the material widely available worldwide.”Source: Saifedean AmmousLomond School
    Principal Claire Chisholm confirmed the collaboration on April 12, writing that
    she was “thrilled to be working with Dr. Ammous” and appreciative of the “positivity
    of the Bitcoin community.”The news comes a day after Lomond School announced it
    would accept BTC for tuition payments starting from the autumn semester of 2025,
    becoming the first school in the United Kingdom to adopt BTC payments.Source:
    Saifedean AmmousAmmous is best known for The Bitcoin Standard, which was first
    published in 2018. The book outlines the economic philosophy behind Bitcoin and
    contrasts it with fiat currency systems. It has sold more than one million copies
    and has been translated into 38 languages, according to Ammous.Cointelegraph has
    contacted both Ammous and Lomond School for additional details regarding the upcoming
    curriculum.Related: New York bill proposes legalizing Bitcoin, crypto for state
    paymentsBitcoin education is gaining momentum worldwideEducational institutions
    around the world have increasingly embraced Bitcoin as both a subject of academic
    study and a financial tool.Schools and universities have been launching Bitcoin-based
    courses since as early as 2013 when the University of Nicosia in Cyprus launched
    its Master’s in Digital Currency program, which is accessible both in-person and
    online.New York University’s Stern School of Business launched “The Law and Business
    of Bitcoin and Other Cryptocurrencies” course in 2014 — one of the first Bitcoin-specific
    courses in the US.Stanford University also launched its “Bitcoin and Cryptocurrencies”
    course in 2015, focused on the technological and economic aspects of the world’s
    first cryptocurrency.Related: Swedish MP proposes Bitcoin reserve to finance ministerIn
    February 2025, the University of Austin announced launching the first first-of-its-kind
    Bitcoin investment fund of over $5 million as part of the institution’s larger
    $200 million endowment fund.Source: Eric BalchunasThree months before the University
    of Austin’s announcement, a regulatory filing revealed that Emory University accumulated
    over $15 million worth of Bitcoin via Grayscale’s spot Bitcoin exchange-traded
    fund, Cointelegraph reported on Oct. 28.Magazine: SCB tips $500K BTC, SEC delays
    Ether ETF options, and more: Hodler’s Digest, Feb. 23 –March. 1\n\n            "

- title: " Four suspects charged in home invasion of streamer Amouranth "
  url: https://cointelegraph.com/news/four-suspects-charged-home-invasion-streamer-amouranth?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Four suspects were charged in connection with the home invasion of online
    streamer Amouranth, whose real name is Kaitlyn Siragusa. The streamer says she
    was held at gunpoint by several individuals demanding that she hand over the private
    keys to her crypto.According to Fox 26, the suspects include Dylan Nesho Campbell,
    Bryan Anthony Salazar Guerrero and two additional suspects between the ages of
    16-17.Campbell and Guerrero were each charged with aggravated kidnapping and aggravated
    robbery with a deadly weapon, as was the 17-year-old suspect.Siragusa reported
    that several armed individuals entered her home late at night on March 2, beat
    her and held her at gunpoint, demanding her cryptocurrency.Source: AmouranthLuckily,
    her husband was on speakerphone, which the gunmen took in an attempt to access
    a crypto app. The husband, having been alerted to the situation, grabbed a handgun
    while attempting to gauge where the armed men were in the home.The online streamer
    led the assailants around the home and convinced them to start looking for a cold
    storage device.As the armed robbers were looking for the device, Siragusa ran
    upstairs to her husband, who was also watching the situation unfold on the home’s
    network of cameras.Once she was safely upstairs, her husband fired off three rounds
    at the assailants, likely shooting one in the process before the home invaders
    retreated and law enforcement arrived at the scene.Siragusa’s husband later revealed
    that he was the one posting from her account as the incident unfolded. Source:
    AmouranthThe streamer previously disclosed that she held roughly 211 Bitcoin,
    worth over $20 million in November 2024 — making her a target for armed robbery.Related:
    UK authorizes charges against NCA officer for alleged Bitcoin theftCrypto kidnappings
    and extortion on the rise The incident is merely the latest in a string of kidnappings
    and armed robberies aimed at crypto holders.In January, a UK court sentenced seven
    gang members for the kidnapping and extortion of a crypto investor, who was repeatedly
    assaulted and coerced into handing over funds over several months.During that
    same month, reports emerged that Ledger co-founder David Balland was kidnapped
    in France and held for a crypto ransom before being rescued by law enforcement.Magazine:
    Scam AI ‘kidnappings’, $20K robot chef, Ackman’s AI plagiarism war: AI Eye\n\n
    \           "

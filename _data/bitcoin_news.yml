- title: " GameStop hints at future Bitcoin purchases following board approval "
  url: https://cointelegraph.com/news/gamestop-future-bitcoin-purchases-board-approval?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "GameStop Corporation (GME), the video game retailer turned memecoin stock,
    is reportedly moving to invest in Bitcoin after its board unanimously approved
    a plan to acquire digital assets. According to a March 25 CNBC report, the company
    announced that it would use a portion of its corporate cash or future debt issuances
    to invest in Bitcoin (BTC) and US-dollar-pegged stablecoins. The plan was further
    corroborated by the company’s fourth-quarter earnings report, which was released
    on March 25 and showed intent to acquire Bitcoin and stablecoins. “[T]he Company’s
    investment policy permits investments in certain cryptocurrency assets, including
    Bitcoin and US dollar-denominated stable coins,” the financial statement reads.
    GameStop’s cash reserves stood at more than $4.77 billion as of Feb. 1, compared
    with $921.7 million a year earlier. The video game retailer posted $1.283 billion
    in net sales during the fourth quarter and $3.823 billion for fiscal 2024.GameStop’s
    quarterly financial statements. Source: GameStopRelated: GameStop buying Bitcoin
    would ‘bake the noodles’ of TradFi: Swan execFollowing the Strategy playbookGameStop
    broke from convention during the pandemic when it became the center of a meme
    stock frenzy that turned the company’s fortunes around. Since then, the video
    game retailer has shown signs of improvement, with a return to profitability in
    fiscal 2023. Rumors about GameStop’s interest in Bitcoin began to circulate in
    February, triggering a rise in GME stock. Earlier in the month, GameStop’s CEO,
    Ryan Cohen, posted an uncaptioned photo on social media alongside Strategy executive
    chairman and Bitcoin mega bull Michael Saylor, which further stoked anticipation
    of an impending BTC purchase. Source: Ryan CohenNow, more than one month later,
    GameStop appears poised to take a page out of Strategy’s playbook by adding Bitcoin
    to its balance sheet.Earlier this week, Saylor announced that Strategy had acquired
    an additional 6,911 Bitcoin, bringing its total stockpile to 506,137 BTC. The
    company now holds roughly 2.4% of Bitcoin’s total supply. Related: Strategy announces
    10% preferred stock offering to buy more Bitcoin\n\n            "

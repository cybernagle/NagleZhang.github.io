- title: " Saylor signals Strategy is buying the dip amid macroeconomic turmoil "
  url: https://cointelegraph.com/news/saylor-strategy-buying-dip-amid-macroeconomic-turmoil?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Strategy co-founder Michael Saylor has signaled that the company plans
    to acquire more Bitcoin (BTC) following a nearly two-week pause in purchases.The
    company's most recent acquisition of 22,048 Bitcoin on March 31 brought its total
    holdings to 528,185 BTC.According to SaylorTracker, Strategy's BTC investment
    is up by approximately 24%, representing over $8.6 billion in unrealized gains.Strategy
    continues to accumulate BTC amid the recent market downturn that took Bitcoin's
    price below the $80,000 level, and the company continues to be closely monitored
    by BTC investors as a barometer for institutional interest in BTC.Strategy’s Bitcoin
    purchase history. Source: SaylorTrackerRelated: Has Michael Saylor’s Strategy
    built a house of cards?Bitcoin's store-of-value narrative grows despite the recent
    price declineThe current macroeconomic uncertainty from the ongoing trade tensions
    between the United States and China has negatively impacted risk-on assets across
    the board.Stock markets wiped away trillions in shareholder value in response
    to Trump's sweeping tariff order, and crypto markets also experienced a deep sell-off.Data
    from the Total3, an indicator that tracks the market capitalization of the entire
    crypto sector excluding BTC and Ether (ETH), shows that altcoins have collectively
    shed over 33% of their value since the market peak in December 2024.By comparison,
    BTC is only down roughly 22% from its peak of over $109,000 in January 2025 and
    is currently rangebound, trading around the $84,000 level.The Total3 crypto market
    cap, pictured in blue, compared to the price of Bitcoin. Source: TradingViewThe
    price of Bitcoin remained relatively stable amid a $5 trillion sell-off in the
    stock market, lending credence to Bitcoin's use case as a store-of-value asset
    as opposed to a risk-on investment.Speaking with Cointelegraph at Paris Blockchain
    Week 2025, cypherpunk and CEO of digital asset infrastructure company Blockstream,
    Adam Back said the macroeconomic pressures from a prolonged trade war would make
    Bitcoin an increasingly attractive store of value.Back forecasted inflation to
    surge to 10-15% in the next decade, making real investment returns on traditional
    asset classes such as stocks and real estate incredibly difficult for market participants.\"There
    is a real prospect of Bitcoin competing with gold and then starting to take some
    of the gold use cases,” Back told Cointelegraph managing editor Gareth Jenkinson.Magazine:
    Bitcoiner sex trap extortion? BTS firm’s blockchain disaster: Asia Express\n\n

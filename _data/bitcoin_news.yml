    be a good outcome for the equity holders. The people at the top of the capital
    structure would suffer because they’re levered, but everybody else in the capital
    structure would get paid out,” he said.Magazine: Bitcoin to $1M ‘by 2029,’ CIA
    tips its hat to Bitcoin: Hodler’s Digest, April 27 – May 3\n\n            "

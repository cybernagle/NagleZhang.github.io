- title: " Bitcoiners blast Arizona governor’s ‘ignorance’ after Bitcoin bill veto "
  url: https://cointelegraph.com/news/arizona-governor-katie-hobbs-veto-bitcoin-bill-bitcoiners-react?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoiners and United States government officials have criticized Arizona
    Governor Katie Hobbs’ decision to veto a bill that would have allowed the state
    to hold Bitcoin as part of its official reserves.“This will age poorly,” Casa
    co-founder and cypherpunk Jameson Lopp said in a May 3 X post. Bitcoin (BTC) entrepreneur
    Anthony Pompliano said, “Imagine the ignorance of a politician to believe they
    can make investment decisions.”Call for government officials who understand Bitcoin
    is “the future”“If she can’t outperform Bitcoin, she must buy it,” Pompliano said.
    Crypto lawyer Andrew Gordon said, “We need more elected officials who understand
    that Bitcoin and crypto are the future.”Source: Julian FahrerWendy Rogers, who
    co-sponsored the bill with State Representative Jeff Weninger, also voiced her
    disappointment.“Politicians don’t understand that Bitcoin doesn’t need Arizona.
    Arizona needs Bitcoin,” Rogers said.On May 2, Hobbs vetoed the Arizona Strategic
    Bitcoin Reserve Act, which would have permitted Arizona to invest seized funds
    into Bitcoin and create a reserve managed by state officials. “Today, I vetoed
    Senate Bill 1025. The Arizona State Retirement System is one of the strongest
    in the nation because it makes sound and informed investments,” Hobbs said.Source:
    Dr. DanishRogers said she would refile the bill during her next session. Rogers
    also pointed out that Arizona’s state retirement system already holds stocks of
    Michael Saylor’s Strategy (MSTR).“Which is basically a leveraged Bitcoin ETF.
    Arizona’s Strategic Bitcoin Reserve bill will be back. HODL,” Rogers said. The
    stock price of Strategy rose 32% in April, the most significant monthly gain since
    November 2024.Related: US gov’t actions give clue about upcoming crypto regulationHowever,
    well-known crypto skeptic Peter Schiff sided with Hobbs. “The government should
    not be making decisions to use public funds to speculate in cryptocurrencies,”
    Schiff said.Arizona would have become the first US state to establish a Bitcoin
    Strategic Reserve if it had passed.Arizona joins several other US states where
    similar efforts have failed. Similar proposals in Oklahoma, Montana, South Dakota
    and Wyoming have stalled or been withdrawn recently.Magazine: Bitcoin to $1M ‘by
    2029,’ CIA tips its hat to Bitcoin: Hodler’s Digest, April 27 – May 3\n\n            "

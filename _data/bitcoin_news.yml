    reflects a market recalibrating what safety looks like.”“The conversation has
    clearly shifted. Bitcoin is no longer trading in the shadows of tech — it’s becoming
    a lens through which macro uncertainty is priced,” he added.Nansen CEO Alex Svanevik
    also praised Bitcoin’s resilience, noting that the maturing asset has become “less
    Nasdaq — more gold” in the past two weeks, increasingly acting as a safe haven
    asset against economic turmoil, though concerns over economic recession may limit
    its price trajectory.On April 21, BitMEX co-founder Arthur Hayes predicted that

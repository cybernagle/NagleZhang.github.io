- title: " Arizona governor signs law for state to keep unclaimed crypto "
  url: https://cointelegraph.com/news/arizona-governor-signs-bitcoin-reserve-keep-unclaimed-crypto?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Arizona Governor Katie Hobbs has signed a bill into law allowing the US
    state to keep unclaimed crypto and establish a “Bitcoin Reserve Fund” that won’t
    use any taxpayer money or state funds.Hobbs signed House Bill 2749 into law on
    May 7, which allows Arizona to claim ownership of abandoned digital assets if
    the owner fails to respond to communications within three years.The state’s custodians
    can stake the crypto to earn rewards or receive airdrops, which can then be deposited
    into what Arizona has called a Bitcoin and Digital Asset Reserve Fund.“This law
    ensures Arizona doesn’t leave value sitting on the table and puts us in a position
    to lead the country in how we secure, manage, and ultimately benefit from abandoned
    digital currency,” the bill’s sponsor, Jeff Weninger, said in a May 7 statement.Arizona
    House Representative Jeff Weninger’s statement on the signing of HB 2749 into
    law. Source: Jeff Weninger“We’ve built a structure that protects property rights,
    respects ownership, and gives the state tools to account for a new category of
    value in the economy,” Weninger added.On May 3, Hobbs vetoed a similar Bitcoin
    (BTC) reserve bill, Senate Bill 1025, which would have allowed the state to invest
    seized funds into Bitcoin, citing concerns over using public funds for \"untested
    assets.”Hobbs’ move gives hope for future crypto billsBitcoin Laws founder Julian
    Fahrer said on X that Hobbs’ signing of HB 2749 offers more hope that she may
    also sign Senate Bill 1373, which is currently on her desk.Related: Bitcoin bros
    at ‘the club’ may stop US gov’t from buying BTC — Arthur HayesSB 1373 would authorize
    Arizona’s treasurer, currently Kimberly Yee, to allocate up to 10% of Arizona’s
    Budget Stabilization Fund into Bitcoin. The bill’s passage in Arizona follows
    New Hampshire Governor Kelly Ayotte on May 6 signing House Bill 302 into law,
    allowing her state’s treasury to use funds to invest in cryptocurrencies with
    a market capitalization of more than $500 billion.Bitcoin is currently the only
    cryptocurrency that meets that threshold.Magazine: Crypto wanted to overthrow
    banks, and now it’s becoming them in stablecoin fight\n\n            "

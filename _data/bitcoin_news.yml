- title: " BTC dominance steadily rising since 2023, is altseason now a relic? "
  url: https://cointelegraph.com/news/btc-dominance-steadily-rising-2023-altseason-relic?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDIvMDE5NGNhYzktNjNiNy03NTc0LWI5MWQtN2E0MmU0NzUyMjEy.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDIvMDE5NGNhYzktNjNiNy03NTc0LWI5MWQtN2E0MmU0NzUyMjEy.jpg\"
    alt=\"BTC dominance steadily rising since 2023, is altseason now a relic?\"></p><p>Bitcoin
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>) dominance,
    a measure of Bitcoin's overall share of the crypto market, has been steadily rising
    since 2023 amid a torrent of new cryptocurrency coins and tokens.<p>The current
    BTC market dominance is roughly 61.6%, down from the local peak of 64.3% recorded
    on Feb. 3.</p><p>BTC market dominance <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-dominance-hits-60-altcoins-bleed\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">broke back above 60%</a>
    on Feb. 2 amid a general market downturn over fears of a <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-price-100k-fall-donald-trump-imposes-import-tariffs\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">prolonged trade war</a>
    between the United States and its trading partners.</p><p>Macroeconomic uncertainty
    typically takes a toll on risk-on assets, and the recent market downturn hit altcoins
    harder than BTC due to their lower liquidity and higher-risk profiles.</p><figure><img
    alt=\"Cryptocurrencies, Bitcoin Price\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01959b56-1c77-7e85-b553-6e3c23e438f3\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Bitcoin market dominance
    has been rising since 2023. Source: </em><a data-ct-non-breakable=\"null\" href=\"https://www.tradingview.com/chart/g7xkPkTa/?symbol=CRYPTOCAP%3ABTC.D\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://www.tradingview.com/chart/g7xkPkTa/?symbol=CRYPTOCAP%3ABTC.D\"><em>TradingView</em></a></p></figcaption></figure><p>The
    current market cycle also features Bitcoin exchange-traded funds (ETFs), which
    silo liquidity into these financial instruments &mdash; <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/altseason-bitcoin-etf-crypto-investment\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">preventing capital rotation
    into altcoins</a>, which crypto traders and investors have become accustomed to.</p><p>Previous
    cycles were characterized by investors rotating profits from less risky assets
    such as BTC into progressively higher-risk investments, starting with high market
    cap altcoins and eventually working their way into smaller cap tokens.</p><p>The
    liquidity siloed in traditional investment vehicles coupled with the <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/analysts-argue-oversupply-could-end-altcoin-season\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">proliferation of new
    coins and tokens</a> competing for limited investor attention and capital has
    led some analysts to suggest that altcoin season is now a thing of the past and
    will not be a feature of the current or future market cycles.</p><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-poised-reclaim-90000-according-derivatives-metrics\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Bitcoin
    poised to reclaim $90,000, according to derivatives metrics</strong></em></a></p><h2>Too
    many tokens have saturated the market</h2><p>The total number of cryptocurrency
    tokens and coins <a data-ct-non-breakable=\"null\" href=\"https://coinmarketcap.com/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">listed</a> on CoinMarketCap
    on Feb. 8 was <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/total-cryptos-near-11-million-market-oversaturated\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">below 11 million unique
    assets</a>, as of March 15 the number of digital assets listed on the website
    has surged to over 12.7 million.</p><figure><img alt=\"Cryptocurrencies, Bitcoin
    Price\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01959b56-d948-739f-b1f6-902f30c38824\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Tens of millions of
    unique digital assets are now floating around the markets. Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://dune.com/queries/4303251/7229372\" rel=\"nofollow noopener\" target=\"_blank\"
    text=\"null\" title=\"https://dune.com/queries/4303251/7229372\"><em>Dune</em></a></p></figcaption></figure><p>Over
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/crypto-token-issuance-600k-liquidity-risk\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">600,000 tokens were
    launched in January 2025</a> alone. The vast majority of these assets were memecoins
    created on fair launch platforms and low-cap altcoins.</p><p><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/Croesus_BTC/status/1900599093476335894\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">According</a>&nbsp;to market analyst Jesse Myers,
    when these coins fail, they do not go to $0. Instead, they linger around market
    capitalizations of $10,000 to $100,000 &mdash; permanently trapping capital inside
    illiquid pools.</p><p>The proliferation of new tokens and digital assets prompted
    Coinbase CEO Brian Armstrong to <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/brian-armstrong-coinbase-needs-to-rethink-token-listing-process\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">reevaluate the exchange's
    token listing process</a> to meet consumer demand.</p><p><em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/celeb-memecoin-hype-defi-comeback-waves-sasha-ivanov-x-hall-of-flame/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>DeFi will
    rise again after memecoins die down: Sasha Ivanov, X Hall of Flame</strong></em></a></p><p
    class=\"post-content__disclaimer\" type=\"\">This article does not contain investment
    advice or recommendations. Every investment and trading move involves risk, and
    readers should conduct their own research when making a decision.</p><template
    data-name=\"subscription_form\" data-type=\"markets_outlook\" label=\"Subscription
    Form: Markets Outlook\"></template></p>\n</p>\n            "

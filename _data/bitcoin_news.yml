- title: " Bitcoin experiencing ‘shakeout,’ not end of 4-year cycle: Analysts "
  url: https://cointelegraph.com/news/bitcoin-shakeout-not-end-4-year-cycle-analysts?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDIvMDE5NTMzOGEtMGI5Yy03ODU3LTg0OWUtNGM3YmMwYTcwMzFh.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDIvMDE5NTMzOGEtMGI5Yy03ODU3LTg0OWUtNGM3YmMwYTcwMzFh.jpg\"
    alt=\"Bitcoin experiencing ‘shakeout,’ not end of 4-year cycle: Analysts\"></p><p>Bitcoin&rsquo;s
    historic bull cycle remains intact despite widespread investor concerns over the
    current downturn, which analysts suggest may be just a temporary &ldquo;shakeout&rdquo;
    before the next upward move in the market.<p>Bitcoin&rsquo;s (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/bitcoin-price\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">BTC</a>) price is currently down 22% from its all-time
    high of over $109,000 recorded on Jan. 20, on the day of US President <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/ether-price-surpass-4000-trump-inauguration\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/ether-price-surpass-4000-trump-inauguration\">Donald
    Trump&rsquo;s inauguration</a>, Cointelegraph Markets <a data-ct-non-breakable=\"null\"
    href=\"https://pro.cointelegraph.com/users/sign_in\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">Pro</a> data shows.</p><p>Despite investor sentiment
    dropping into <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-price-92k-crypto-market-sentiment-fear-analysts-unsure\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">&ldquo;Extreme Fear&rdquo;</a>
    multiple times, historic chart patterns suggest that this may just be a price
    shakeout &mdash; a sudden price drop caused by multiple investors exiting their
    positions, preceded by a sudden price recovery.</p><p>&ldquo;Several key technical
    indicators have turned bearish, leading to speculation that the bull cycle may
    be ending prematurely,&rdquo; Bitfinex analysts told Cointelegraph.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01959e63-906b-7a68-a3f9-4e3987c17be7\"
    title=\"\" alt=\"Bitcoin experiencing &lsquo;shakeout,&rsquo; not end of 4-year
    cycle: Analysts\"><figcaption style=\"text-align: center;\"><p><em>BTC/USD, 1-year
    chart. Source: Cointelegraph</em></p></figcaption></figure><p>&ldquo;Despite this,
    Bitcoin&rsquo;s 4-year cycle remains an important factor, historically shaping
    price movements,&rdquo; said the analysts, adding:</p><blockquote>&ldquo;Corrections
    within bull cycles are normal, and past trends suggest that this may be a shakeout
    rather than the start of a prolonged bear market.&rdquo;</blockquote><p>However,
    the launch of the US spot Bitcoin exchange-traded funds (ETFs), which <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-etfs-surpass-125-b-blackrock-ibit-world-31st-etf\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">temporarily surpassed
    $125 billion</a> in cumulative holdings, along with the growing institutional
    crypto investments, make it &ldquo;clear that the conventional cycle ceases to
    exist,&rdquo; the analysts added.</p><p><em><strong>Related: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-weekly-close-81-k-avoid-downside-ahead-of-fomc\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Bitcoin
    needs weekly close above $81K to avoid downside ahead of FOMC</strong></em></a></p><p>In
    an optimistic sign for price action, Bitcoin staged a daily close above $84,000
    on March 15, for the first time in over a week since March 8, <a data-ct-non-breakable=\"null\"
    href=\"https://www.tradingview.com/chart/JBpUV8Q8/?symbol=BITSTAMP%3ABTCUSD\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">TradingView</a> data
    shows.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01959e63-94b1-722b-aac1-494c97d58934\"
    title=\"\" alt=\"Bitcoin experiencing &lsquo;shakeout,&rsquo; not end of 4-year
    cycle: Analysts\"><figcaption style=\"text-align: center;\"><p><em>BTC/USD, 1-day
    chart. Source: </em><a data-ct-non-breakable=\"null\" href=\"https://www.tradingview.com/chart/JBpUV8Q8/?symbol=BITSTAMP%3ABTCUSD\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://www.tradingview.com/chart/JBpUV8Q8/?symbol=BITSTAMP%3ABTCUSD\"><em>TradingView</em></a><em>&nbsp;</em></p></figcaption></figure><p>However,
    due to Bitcoin&rsquo;s correlation with traditional financial markets, BTC may
    only find a bottom along with equity markets, particularly the S&amp;P 500, said
    Bitfinex analysts, adding:</p><blockquote>&ldquo;While $72,000&ndash;$73,000 remains
    a key support range, the broader market narrative, especially global treasury
    yields and equity trends, will dictate Bitcoin&rsquo;s next major move.\"</blockquote><p>&ldquo;Trade
    wars have already been priced in, to some extent, but prolonged economic strain
    could weigh on sentiment,&rdquo; the analysts added.</p><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/rising-219-b-stablecoin-supply-mid-bull-cycle-not-top\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Rising $219B
    stablecoin supply signals mid-bull cycle, not market top</strong></em></a></p><h2>Bitcoin
    halving and four-year cycle still crucial for price action: Nexo analyst</h2><p>Despite
    fears over a disrupted Bitcoin bull market, the four-year cycle, along with the
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-halving\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Bitcoin halving event</a>,
    remain crucial for Bitcoin&rsquo;s price action, according to Iliya Kalchev, dispatch
    analyst at Nexo digital asset investment platform.</p><p>&ldquo;Bitcoin&rsquo;s
    four-year compound annual growth rate (CAGR) has declined to a record low of 8%,
    posing questions about whether its traditional four-year cycle remains valid,&rdquo;
    Kalchev told Cointelegraph, adding:</p><blockquote>&ldquo;Although strong institutional
    adoption over the past year has served as a significant tailwind for Bitcoin,
    its halving events are still expected to exert long-term influence.&rdquo;</blockquote><p>The
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/the-2024-bitcoin-halving-most-bullish-setup-btc-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">2024 Bitcoin halving</a>
    reduced the Bitcoin network&rsquo;s block reward to 3.125 BTC per block.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01959e63-99a0-75ba-a4ac-e00c4ec0bcde\"
    title=\"\" alt=\"Bitcoin experiencing &lsquo;shakeout,&rsquo; not end of 4-year
    cycle: Analysts\"><figcaption style=\"text-align: center;\"><p><em>BTC/USD, 1-day
    chart since 2024 halving. Source: </em><a data-ct-non-breakable=\"null\" href=\"https://www.tradingview.com/chart/JBpUV8Q8/?symbol=BITSTAMP%3ABTCUSD\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://www.tradingview.com/chart/JBpUV8Q8/?symbol=BITSTAMP%3ABTCUSD\"><em>TradingView</em></a><em>&nbsp;</em></p></figcaption></figure><p>Bitcoin
    price is up over 31% since the last halving occurred on April 20, 2024, which
    was coined <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/the-2024-bitcoin-halving-most-bullish-setup-btc-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">the &ldquo;most bullish&rdquo;
    setup</a> for Bitcoin price, partly because of the growing institutional interest
    in the world&rsquo;s first cryptocurrency.</p><iframe width=\"100%\" height=\"315\"
    src=\"https://www.youtube.com/embed/gnuNX0QwH3Q?start=\" frameborder=\"0\" allow=\"accelerometer;
    autoplay; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen loading=\"lazy\"></iframe><p><em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/sec-crypto-laws-unclear/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>SEC&rsquo;s
    U-turn on crypto leaves key questions unanswered</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"defi_newsletter\" label=\"Subscription
    Form: DeFi Newsletter\"></template></p>\n</p>\n            "
  published: 2025-03-16 10:09:39 UTC
- title: " Uber angel investor stirs Bitcoin debate with ‘build a better Bitcoin’
    remark "
  url: https://cointelegraph.com/news/jason-calacanis-build-better-bitcoin-controversy-bitcoin-community?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTljNGItNTMyMy03YjdhLTg1YTMtZTVkYjg5ZTA4MWIx.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTljNGItNTMyMy03YjdhLTg1YTMtZTVkYjg5ZTA4MWIx.jpg\"
    alt=\"Uber angel investor stirs Bitcoin debate with ‘build a better Bitcoin’ remark\"></p><p>A
    technology investor who backed ridesharing app Uber in its early days has sparked
    backlash from the Bitcoin community after claiming Bitcoin will inevitably be
    replaced by something better.<p>&ldquo;Bitcoin has been a wonderful game, but
    with a couple of giant players cornering the market, the timing is right to &ldquo;build
    a better Bitcoin&rdquo; &mdash; restarting the game,&rdquo; prominent angel investor
    and internet entrepreneur Jason Calacanis <a data-ct-non-breakable=\"null\" href=\"https://x.com/Jason/status/1900651642724499777\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">told</a> his 981,600
    X followers on March 14.</p><p>Calacanis, an early investor in Bitcoin-related
    companies like online trading platform Robinhood and <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/uber-angel-investor-jason-calacanis-invests-in-bitcoin-startup-keza\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Bitcoin startup Keza</a>,
    said, &ldquo;All technology gets replaced over time&hellip; and Bitcoin will be
    no different.&rdquo;</p><h2>Opportunity presents for Bitcoin layer-2 projects</h2><p>Founders
    and executives of Bitcoin-related companies were quick to push back, arguing that
    Bitcoin will not be replaced, though there&rsquo;s still room for a dominant layer-2
    protocol to emerge on top of the Bitcoin network.</p><figure><img alt=\"Technology\"
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01959cde-d83d-7ba3-b0c4-5d28548798bc\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/BitcoinPierre/status/1900741279127830824\" rel=\"nofollow
    noopener\" target=\"_blank\" text=\"null\" title=\"https://x.com/BitcoinPierre/status/1900741279127830824\"><em>Pierre
    Rochard</em></a></p></figcaption></figure><p>Swan Bitcoin co-founder Brady Swenson
    <a data-ct-non-breakable=\"null\" href=\"https://x.com/CitizenBitcoin/status/1900774926769918043\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">said</a>, &ldquo;Winning
    protocols don&rsquo;t get replaced; they are built upon.&rdquo;&nbsp;</p><p>&ldquo;Bitcoin
    will never be replaced as a protocol for value transfer. The race is still on
    for the winning second layer protocol,&rdquo; Swenson said.</p><p>The other co-founder
    of Swan Bitcoin, Cory Klippsten, <a data-ct-non-breakable=\"null\" href=\"https://x.com/coryklippsten/status/1901045336111804639\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">said</a>, &ldquo;Bitcoin
    is a technological revolution changing all industries, not following the adoption
    curve of a single technology like an iPad.&rdquo;</p><figure><img alt=\"Technology\"
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01959cd9-ff13-7680-b8ab-a651d496536b\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/JasonPLowery/status/1900729441006784736\" rel=\"nofollow
    noopener\" target=\"_blank\" text=\"null\" title=\"https://x.com/JasonPLowery/status/1900729441006784736\"><em>Jason
    Lowery</em></a></p></figcaption></figure><p>Echoing a similar sentiment, Lightspark
    CEO David Markus <a data-ct-non-breakable=\"null\" href=\"https://x.com/davidmarcus/status/1900965554594476334\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">said</a>, &ldquo;What
    it lacks in functionality can be built on L2s.&rdquo;&nbsp;</p><blockquote>&ldquo;Trying
    to build a better Bitcoin is a fool&rsquo;s errand.&rdquo;</blockquote><p>Meanwhile,
    ShapeShift CEO Eric Voorhees <a data-ct-non-breakable=\"null\" href=\"https://x.com/ErikVoorhees/status/1901003607790485810\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">said</a> Bitcoin&rsquo;s
    limitations can be solved &ldquo;on other chains.&rdquo;</p><h2>The bigger Bitcoin
    grows, the &ldquo;less likely&rdquo; it is to be replaced</h2><p>Many in the industry
    have emphasized the <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-layer-2-networks-ethereum\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">importance of layer-2s
    for Bitcoin</a>, as they provide use cases that the Bitcoin network cannot support,
    such as deploying smart contracts.</p><p>However, Muneeb Ali, co-founder of Stacks,
    recently <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-layer2-projects-fade-stacks-muneeb-ali\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">told Cointelegraph that
    more than two-thirds</a> of existing Bitcoin layer-2 projects will not exist within
    three years as their initial excitement will fade.</p><figure><img alt=\"Technology\"
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01959cdb-b166-78f9-ac49-f748e02628aa\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/givanse/status/1900991934254248390\" rel=\"nofollow noopener\"
    target=\"_blank\" text=\"null\" title=\"https://x.com/givanse/status/1900991934254248390\"><em>Gast&oacute;n
    Silva</em></a></p></figcaption></figure><p>Bitcoin advocate Wayne Vaughan said
    people wrongly assume Bitcoin is easily replaceable because they see it as just
    an asset, application, or platform.</p><p>&ldquo;I think of Bitcoin as a network.
    The larger the network gets, the less likely it is for something else to replace
    it,&rdquo; Vaughan <a data-ct-non-breakable=\"null\" href=\"https://x.com/WayneVaughan/status/1900986401451340137\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://x.com/WayneVaughan/status/1900986401451340137\">said</a>
    in a March 15 X post.&nbsp;</p><p><em><strong>Related: </strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/strategy-bitcoin-stash-up-7-billion-500k-btc-holdings\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Strategy&rsquo;s
    Bitcoin stash still up over $7B despite market downturn</strong></em></a></p><p>Strive
    Funds CEO Matt Cole <a data-ct-non-breakable=\"null\" href=\"https://x.com/ColeMacro/status/1900938071203348506\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">said</a>, &ldquo;There
    will not be a &ldquo;better&rdquo; Bitcoin.&rdquo; </p><p>&ldquo;I do think we
    will get occasional alt seasons of ever-diminishing strength that will continue
    to make insiders money. Most people will end up with less Bitcoin by going to
    that casino,&rdquo; Cole said.</p><p>This is not the first time that Calacanis&rsquo;
    comments have caused debate in the crypto industry.</p><p>In June 2020, Calacanis
    said that nearly all of the <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/uber-angel-investor-99-of-crypto-projects-are-garbage\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">crypto projects around
    the world</a> are under the control of &ldquo;unqualified idiots&rdquo; or &ldquo;grifters&rdquo;
    with below-average skills.</p><p><em><strong>Magazine: </strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/magazine/crypto-fans-obsessed-longevity-biohacking-why/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Crypto fans
    are obsessed with longevity and biohacking: Here&rsquo;s why</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"crypto_biz\" label=\"Subscription
    Form: Crypto Biz Newsletter\"></template></p>\n</p>\n            "

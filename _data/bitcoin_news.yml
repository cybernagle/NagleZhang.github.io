- title: " Democrats seek suspicious activity reports linked to Trump crypto ventures "
  url: https://cointelegraph.com/news/democrats-demand-us-treasury-reports-trump-crypto-ventures?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "US Democrat lawmakers have sent a letter to the US Treasury demanding
    access to suspicious activity reports (SARs) on several Trump-backed crypto projects
    as part of the latest probe into the president’s digital ventures. Penned by representatives
    Gerald Connolly, Joseph Morelle, and Jamie Raskin, the May 14 letter asks Treasury
    Secretary Scott Bessent for all SARS filed since 2023 related to World Liberty
    Financial (WLF) and the Official Trump (TRUMP) token. Financial institutions in
    the US must file SARs with the Financial Crimes Enforcement Network, a bureau
    within the Department of the Treasury, when they detect suspicious activity, including
    potential money laundering or fraud. Source: Oversight Committee DemocratsThe
    sweeping probe asks for any SARs mentioning WinRed, America PAC, Elon Musk, political
    action committee, PAC, Trump, World Liberty Financial, WLF, TRUMP, MELANIA and
    Justin Sun, no later than May 30. The Democratic lawmakers say their probe is
    to “determine whether legislation is necessary to prevent violations of campaign
    finance, consumer protection, bribery, securities fraud, and other anti-corruption
    laws” and to guard against “financial misconduct connected to prospective or current
    federal officials.” Democrats argue WLF and Trump coin could be misusedAs part
    of the letter, the lawmakers argue WLF could be misused as a “vehicle for foreign
    influence peddling” because it served part of its token sale for foreign investors,
    who are “generally subject to less stringent regulation than US investors.” Justin
    Sun’s investment in WLF and the subsequent pause of the SEC’s lawsuit that alleged
    the crypto entrepreneur broke securities laws has also been flagged as a concern. Trump’s
    token has come under fire as well because the lawmakers argue in their letter
    that the identities of the coin purchasers are not publicly disclosed, which could
    open the door for bad actors to “curry favor with Trump” by purchasing the coin. At
    the same time, SARS related to Republican digital fundraising WinRed, Elon Musk’s
    super PAC, which poured $250 million into Trump’s election campaign, and two other
    PACs are being sought. Related: Trump-owned Truth Social denies it is launching
    a memecoinThis effort is the latest Democrat-led salvo against Trump’s crypto
    ventures.  A group of Democratic senators reportedly sent a letter to leadership
    at the US Department of Justice and the Treasury Department expressing concerns
    about Trump’s ties to crypto exchange Binance and potential conflicts of interest
    in regulating the industry, according to a May 9 Bloomberg report. US Democratic
    lawmakers also launched a multi-angle attack on May 6, targeting Trump’s ability
    to profit from his crypto initiatives with two bills and a subcommittee inquiry. Magazine:
    Trump’s crypto ventures raise conflict of interest, insider trading questions\n\n
    \           "

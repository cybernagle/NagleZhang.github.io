- title: " Bitcoin won’t see ‘gigantic’ SWF buying until laws greenlit — Scaramucci "
  url: https://cointelegraph.com/news/bitcoin-buying-sovereign-wealth-funds-united-states-legislation-anthony-scaramucci?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Sovereign Wealth Funds are already gaining exposure to Bitcoin, but significant
    allocations won’t happen until the United States establishes clearer regulations
    for the digital assets industry, says SkyBridge founder Anthony Scaramucci.“I
    think they are buying it, I think they are buying it on the margin,” Scaramucci,
    former White House director of communications during US President Donald Trump’s
    first term, said on Anthony Pompliano’s podcast on May 8.Legislation will lead
    to “large blocks of buying”“I don’t think it is going to be a gigantic groundswell
    of buying until we greenlight legislation in the United States,” he added. Scaramucci
    previously said in a February interview with the Financial Times that he expects
    the US government to propose crypto legislation in November.SWFs are government-owned
    investment funds that manage national savings, often built from surplus revenues
    like oil profits or trade gains. Norway has the largest SWF in the world, with
    approximately $1.73 trillion in assets under management, followed by China with
    $1.33 trillion, according to data from Visual Capitalist.Bitcoin’s (BTC) market
    cap is approximately $2.05 trillion, according to CoinMarketCap.Anthony Scaramucci
    (right) spoke to Anthony Pompliano on his podcast on May 8. Source: Anthony PomplianoScaramucci
    said that if stablecoin regulation is passed, clear guidance is provided for traditional
    banks to custody of Bitcoin and other digital assets, and there’s progress on
    tokenizing stocks and bonds, a significant wave of buying from Sovereign Wealth
    Funds is likely to follow.“Then I will tell you that there will be large blocks
    of buying, or people worth 10, 20, 30 trillion dollars, buying a half a billion
    dollars of Bitcoin, buying a billion of Bitcoin,” Scaramucci said.Related: Institutional
    investors continue to scoop up Bitcoin above $100K“But if you wanna see a million
    dollar Bitcoin, that’s when someone at a sovereign says ok, this is part of the
    infrastructure of the world’s financial services architecture,” he added.ARK Invest
    CEO Cathie Wood recently said that the chances of Bitcoin reaching a seven-figure
    price by 2030 have increased.“We actually think the odds have gone up that our
    bull case will be the right number because of what is becoming the institutionalization
    of this new asset class,” Woods said in February.Magazine: Adam Back says Bitcoin
    price cycle’ 10x bigger’ but will still decisively break above $100K\n\n            "

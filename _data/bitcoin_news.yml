- title: " Pakistan allocates 2,000MW power for Bitcoin mining and AI centers "
  url: https://cointelegraph.com/news/pakistan-allocates-2000mw-bitcoin-mining-ai-centers?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Pakistan has allocated 2,000 megawatts of surplus electricity exclusively
    for Bitcoin mining and artificial intelligence centers.The move is part of a broader
    digital transformation plan spearheaded by the Pakistan Crypto Council and backed
    by the Ministry of Finance, according to a May 25 report by local news outlet
    24NewsHD TV Channel.In the first phase, the government plans to channel excess
    power into AI infrastructure and crypto mining operations. Finance Minister Muhammad
    Aurangzeb said the decision is expected to attract billions in foreign investment
    while generating high-tech employment across the country.The initiative’s second
    phase will introduce access to renewable energy for mining operations, aiming
    to balance growth with environmental responsibility.Related: Trump-backed World
    Liberty Financial partners with Pakistan Crypto CouncilPakistan unveils tax incentives
    to attract investorsPer the report, interest from international Bitcoin (BTC)
    miners and AI firms has already picked up. Officials confirmed that multiple foreign
    delegations have visited Pakistan in recent months to explore potential partnerships.To
    further incentivize investment, the Ministry of Finance announced a package of
    tax incentives for AI centers and duty exemptions for Bitcoin miners.Bilal Bin
    Saqib, CEO of Pakistan’s Crypto Council, reportedly welcomed the development,
    calling it a “turning point” for the country’s digital economy.Saqib claimed that
    with clear regulations and a transparent framework, Pakistan could emerge as a
    significant player in the global crypto and AI sectors.Saqib first proposed using
    the country’s runoff energy to fuel Bitcoin mining at the Crypto Council’s inaugural
    meeting on March 21.The meeting included lawmakers, the Bank of Pakistan’s governor,
    the chairman of Pakistan’s Securities and Exchange Commission (SECP), and the
    federal information technology secretary.Related: Pakistan proposes compliance-based
    crypto regulatory framework — ReportPakistan creates Digital Asset AuthorityOn
    May 21, Pakistan’s Ministry of Finance endorsed the creation of a dedicated body
    to regulate blockchain-based financial infrastructure in the country.The Pakistan
    Digital Assets Authority (PDAA) will serve as a regulatory body to oversee licensing
    and regulating exchanges, custodians, wallets, tokenized platforms, stablecoins,
    and decentralized finance applications.The PDAA will also be tasked with tokenizing
    national assets and government debt, facilitating monetization of Pakistan’s surplus
    electricity through regulated Bitcoin mining, and helping startups build blockchain-based
    solutions at scale.Pakistan ranked highly in Chainalysis’ 2024 crypto adoption
    index, coming in ninth, mainly due to strong retail adoption and transactions
    at centralized services.Pakistan ranked highly in Chainalysis’ 2024 crypto adoption
    index, coming in 9th. Source: ChainalysisData from Statista also shows Pakistan’s
    crypto market is “experiencing rapid growth,” estimating the number of crypto
    users to amount to over 27 million by 2025, out of a population of 247 million.Magazine:
    Bitcoin bears eye $69K, CZ denies WLF ‘fixer’ rumors: Hodler’s Digest, May 18
    – 24\n\n            "

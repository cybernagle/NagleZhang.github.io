- title: " Bitcoin &#039;bullish cross&#039; with 50%-plus average returns flashes
    again "
  url: https://cointelegraph.com/news/bitcoin-bullish-cross-50-plus-returns-average-flash-again?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWEzYjItYmZjMy03NjllLWJmMjctMmU3MTAxODIyNDFj.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWEzYjItYmZjMy03NjllLWJmMjctMmU3MTAxODIyNDFj.jpg\"
    alt=\"Bitcoin 'bullish cross' with 50%-plus average returns flashes again\"></p><p>Bitcoin&rsquo;s
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/bitcoin-price\">BTC</a>)
    stochastic RSI has printed a bullish cross with a history of preceding sharp price
    rebounds. <p>Stochastic RSI tracks momentum based on price movements relative
    to their range over a given period. This classic indicator operates between 0
    and 100, with values above 80 considered overbought and below 20 deemed oversold.
    </p><figure><img alt=\"Bitcoin 'bullish cross' with 50%-plus average returns flashes
    again\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a3d4-6871-749c-9932-04e13d531eca\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>BTC/USDT weekly price
    chart. Source: TradingView/Merjin The Trader</em></p></figcaption></figure><p>A
    crossover of the blue %K line above the orange %D line from an oversold region
    technically suggests growing upward momentum. </p><h2>Another $120,000 BTC price
    target emerges</h2><p>Historical fractals show that each time the weekly stochastic
    RSI made the bullish cross, Bitcoin underwent sharp price recoveries within three
    to five months. Its gains have averaged at around 56% during such rebounds, &#795;including
    rallies that extended beyond the 90%-return mark.</p><figure><img alt=\"Bitcoin
    'bullish cross' with 50%-plus average returns flashes again\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a3c4-400f-71e1-bd25-900188a31d93\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>BTC/USD weekly price
    chart. Source: TradingView</em></p></figcaption></figure><p>That includes a roughly
    90% rally from November 2022 lows, 92% gains in late 2023, and a staggering 98%
    move into Bitcoin&rsquo;s recent all-time high of around $110,000 in January 2025.</p><p>If
    history repeats, <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-shakeout-not-end-4-year-cycle-analysts\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-shakeout-not-end-4-year-cycle-analysts\">Bitcoin
    could see another parabolic rise</a> by July or August, aligning with previous
    stochastic RSI bullish crosses that delivered outsized returns. </p><p>Market
    analyst Merjin the Trader <a data-ct-non-breakable=\"null\" href=\"https://x.com/MerlijnTrader/status/1901574234389852467\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://x.com/MerlijnTrader/status/1901574234389852467\">says</a>
    Bitcoin&rsquo;s price can reach at least $120,000 if the Stochastic RSI fractal
    plays out as intended.</p><figure><img alt=\"Bitcoin 'bullish cross' with 50%-plus
    average returns flashes again\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a3d3-125b-7464-bf85-6d93044a7e7a\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Source: Merjin The
    Trader</em></p></figcaption></figure><p>Meanwhile, Bitcoin&rsquo;s bullish reversal
    outlook receives further cues from its 50-week exponential moving average (50-week
    EMA; the red wave in the chart above) at around $77,230. </p><p>The 50-week EMA
    wave has served as a strong accumulation zone for traders since October 2023.</p><p>In
    case BTC&rsquo;s price breaks decisively below the 50-week EMA, it could head
    toward the next support target at around the 200-week EMA (the blue wave), near
    $50,480, down approximately 40% from current prices.</p><h2>Bitcoin hedge funds
    are buying the dip</h2><p>Another bullish sign comes from hedge fund accumulation
    during the ongoing price correction.</p><p>Global crypto hedge funds are increasing
    their Bitcoin exposure, as seen in the latest rolling 20-day beta to BTC, which
    has <a data-ct-non-breakable=\"null\" href=\"https://etc-group.com/blog/regular-updates/Bitwise_Crypto_Market_Compass_2025_06/\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://etc-group.com/blog/regular-updates/Bitwise_Crypto_Market_Compass_2025_06/\">surged
    to a four-month high</a>. This suggests that institutional investors are buying
    into the dip, positioning themselves for potential upside.</p><figure><img alt=\"Bitcoin
    'bullish cross' with 50%-plus average returns flashes again\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a3e6-1f51-7fb4-b26d-296dcf3aee16\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Global crypto hedge
    funds rolling 1-month beta to Bitcoin. Source: Glassnode/Bloomberg</em></p></figcaption></figure><p>Beta
    measures how closely hedge fund returns track Bitcoin&rsquo;s movements. When
    beta rises above 1.0, it indicates that the fund rises more than BTC&rsquo;s price.
    Conversely, when the beta drops below 1.0, the fund moves less than Bitcoin. </p><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/peak-fud-70k-floor-5-things-bitcoin-this-week\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/peak-fud-70k-floor-5-things-bitcoin-this-week\"><em><strong>Peak
    'FUD' hints at $70K floor &mdash; 5 Things to know in Bitcoin this week</strong></em></a></p><p>The
    beta is now at a 4-month high, meaning hedge funds believe the recent Bitcoin
    dip is a buying opportunity and expect higher prices ahead, reinforcing the $120,000
    price outlook as discussed above.</p><p>As Cointelegraph <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-gets-126k-june-target-data-predicts-bull-market-comeback\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-gets-126k-june-target-data-predicts-bull-market-comeback\">reported</a>,
    the $120,000+ is becoming a popular target for summer 2025.</p><p class=\"post-content__disclaimer\"
    type=\"\">This article does not contain investment advice or recommendations.
    Every investment and trading move involves risk, and readers should conduct their
    own research when making a decision.</p><template data-name=\"subscription_form\"
    data-type=\"markets_outlook\" label=\"Subscription Form: Markets Outlook\"></template></p>\n</p>\n

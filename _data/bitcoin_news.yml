  summary: "Key points:Bitcoin is struggling again as gold retakes the limelight with
    week-to-date gains of nearly 5%.Bitcoin’s correlation with gold is under scrutiny
    amid ongoing macroeconomic shifts.Traders see a short-term slump amid a wider
    BTC price rebound.Bitcoin (BTC) eyed fresh month-to-date lows into the May 6 Wall
    Street open as “directionless” crypto markets contrasted with a gold rebound.BTC/USD
    1-hour chart. Source: Cointelegraph/TradingViewAnalysis: Bitcoin, crypto “largely
    directionless”Data from Cointelegraph Markets Pro and TradingView showed BTC price
    momentum stalling at $95,000 before the latest daily close. Inching closer to
    the key yearly open support level at $93,500, BTC/USD appeared caught in limbo
    while gold returned to outperform.XAU/USD was up 1.5% on the day at the time of
    writing, with week-to-date gains already at 4.4%.XAU/USD 1-hour chart. Source:
    Cointelegraph/TradingView“Crypto implied vols remain suppressed, with front-end
    skew drifting back toward neutral and spot largely directionless,” trading firm
    QCP Capital wrote in its latest bulletin to Telegram channel subscribers.QCP noted
    various swings across the macro spectrum, with the dollar staying lower and emerging
    market currencies, especially the Taiwanese dollar, surging alongside gold.“At
    the same time, the FX shakeup coincides with a nearly 3% surge in gold on Monday,
    as investors lean into the weaker-dollar narrative and price in geopolitical risk
    premia, including prospective US trade diplomacy,” it continued.With Bitcoin yet
    to follow suit, QCP saw an “increasingly binary” next phase, with one outcome
    being that BTC “decouples from gold’s safe haven bid and relinks with broader
    risk proxies.”In its own analysis, trading resource The Kobeissi Letter nonetheless
    saw the “first gold, then Bitcoin” narrative sticking.“In April, Bitcoin joined
    the gold run, increasing correlation for the first time in months. Between April
    7th and April 21st, gold surged +15% along with +12% in Bitcoin,” it observed
    in an X thread on May 5. “The flight to decentralized and inflation-protected
    assets is strong. Keep watching this trend.”Bitcoin vs. gold comparison. Source:
    The Kobeissi Letter/XMACD gives BTC bulls pause for thoughtExamining technical
    data, Bitcoin traders suggested that BTC/USD may be pausing within a broader comeback.Related:
    Bitcoin eyes gains as macro data makes US recession 2025 ‘base case’Evidence for
    this came from the moving average convergence/divergence (MACD) indicator, a measure
    of trend strength that gave conflicting signals on longer and shorter timeframes.#btc
    weekly MACD about to cross bullishly from a position of strength... pic.twitter.com/x2JjK9rHNW—
    dave the wave\U0001F30A\U0001F313 (@davthewave) May 6, 2025Popular trader Dave

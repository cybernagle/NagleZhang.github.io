- title: " BlackRock’s Bitcoin ETF notches 2-week high inflow as BTC nears $112K "
  url: https://cointelegraph.com/news/blackrock-bitcoin-etf-biggest-inflow-two-weeks-as-bitcoin-nears-11200?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "BlackRock’s iShares Bitcoin Trust (IBIT) has seen its largest inflow in
    the past two weeks as traders allocate to US spot Bitcoin exchange-traded funds
    (ETFs) to scoop up the rocketing cryptocurrency.IBIT’s May 21 net inflows hit
    $530.6 million, its biggest single-day net inflow since it took in $531.2 million
    on May 5, according to Farside Investors. The ETF hasn’t had an outflow since
    April 9.In one day alone, IBIT has accumulated over 10 times the amount of Bitcoin
    (BTC) mined over the same timeframe, with it scooping up 4,931 BTC against just
    450 BTC produced for the day.IBIT also saw its largest volume day since January,
    according to the ETF tracking X account Trader T. “Given trading volume today,
    expect these inflow numbers to increase,” said ETF Store president Nate Geraci. BlackRock
    IBIT net flows. Source: Trader TThe total inflow figure for all 11 spot ETFs was
    $607.1 million, with the Fidelity Wise Origin Bitcoin Fund (FBTC) seeing the second-most
    inflows for the day at $23.5 million. Related: BlackRock’s Bitcoin ETF posts $356 million
    inflows, marking the longest streak of 2025Bloomberg ETF analyst Eric Balchunas
    called the ETF inflows a “classic feeding frenzy” caused by Bitcoin’s recent price
    rally, which has seen it extend to nearly $112,000 in early May 22 trading. Balchunas
    added that the last time ETF trading volumes soared to current levels was in January,
    around Bitcoin’s then all-time high. “All the Bitcoin ETFs are elevated, most
    are gonna see 2x their average flows incoming,” he said.IBIT trading volume surges
    to January levels. Source: Eric Balchunas The big ETF inflow and volume day came
    as Bitcoin notched a new all-time high above $110,000 late on May 2, and it has
    continued to rally to a top of just under $111,897 on Coinbase, according to TradingView.Bitcoin
    ETF pile in to continue Jeff Mei, operations chief at the crypto exchange BTSE,
    told Cointelegraph in a note that investors are “crowding into Bitcoin ETFs,”
    which saw $3.6 billion in net inflows in May.“We believe this trend will continue
    as long as companies continue to tap public markets for more capital,” he added.
    “This could even accelerate if the Fed decides to cut interest rates in the coming
    months.” Jupiter Zheng, HashKey Capital partner, anticipated more volatility once
    Bitcoin breaks above $110,000, telling Cointelegraph that it was “entering uncharted
    price discovery territory, while unstable geopolitical and macroeconomic factors
    lead investors to consider the long-term value of Bitcoin.”Magazine: Arthur Hayes
    $1M Bitcoin tip, altcoins ‘powerful rally’ looms: Hodler’s Digest\n\n            "

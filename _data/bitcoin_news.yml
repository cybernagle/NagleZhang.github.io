- title: " FIFA taps Avalanche to launch dedicated blockchain for NFT platform "
  url: https://cointelegraph.com/news/fifa-avalanche-l1-nft-marketplace?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "The Federation Internationale de Football Association (FIFA) has selected
    Avalanche to power its dedicated blockchain network for non-fungible tokens and
    digital fan engagement, the organization announced on May 22.FIFA’s layer-1 (L1)
    blockchain will be powered by the Avalanche network’s scalability-focused infrastructure
    for the association’s five billion fans worldwide.The move comes nearly a month
    after FIFA announced its initial plans to launch a new network for its blockchain-based
    collectibles. AvaCloud’s Ethereum Virtual Machine (EVM) compatibility will enable
    smoother integration with decentralized wallets and applications.Related: Bitcoin
    hits new all-time high of $109K as trade war tensions easeThe move will enable
    FIFA to deliver “unique digital collectibles and immersive fan experiences, powered
    by the speed, scalability, and EVM compatibility,” according to Francesco Abbate,
    CEO of Modex and FIFA Collect.“The decision was based on a rigorous analysis of
    key factors including performance, security, transaction fees, customizability,
    and scalability,” Abbate stated in a May 22 announcement shared with Cointelegraph.Related:
    Bitcoin volatility lowest in 563 days, Hayes predicts $1M BTC by 2028FIFA Collect
    begins migration to AvalancheAs part of the rollout, FIFA will migrate its NFT
    marketplace and NFT collection, FIFA Collect, to the new Avalanche-powered FIFA
    Blockchain.FIFA added that “future plans and business cases are planned but not
    yet publicly disclosed.”Following the migration, external Algorand-based wallets
    such as Pera and Defly will no longer be supported. Instead, users will be able
    to connect to FIFA Collect via MetaMask or other EVM wallets that support WalletConnect.FIFA
    launched its NFT collection ahead of the 2023 Club World Cup in Saudi Arabia in
    collaboration with blockchain firm Modex.Source: EntertheMythosIn November 2024,
    FIFA partnered with blockchain gaming studio Mythical Games to launch FIFA Rivals,
    a free-to-play soccer game for iOS and Android.Magazine: Bitcoin $100K hopes on

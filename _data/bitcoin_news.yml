- title: " UK firm buys $250M Bitcoin as analysts eye quiet Easter weekend "
  url: https://cointelegraph.com/news/uk-investment-firm-buys-250-m-bitcoin-analysts-quiet-easter-weekend?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Whales and institutions are increasing their Bitcoin holdings ahead of
    Easter, as market analysts predict a weekend with less volatility after two weeks
    of heightened volatility driven by escalating global trade tensions.A wallet linked
    to London-based investment firm Abraxas Capital acquired 2,949 Bitcoin (BTC) worth
    more than $250 million during the four days leading up to April 19.In the latest
    transaction, the firm bought over $45 million worth of Bitcoin from Binance on
    April 18, according to crypto intelligence firm Lookonchain, citing Arkham Intelligence
    data.Source: Arkham Intelligence, LookonchainThe investment came days after Michael
    Saylor’s Strategy bought $285 million worth of Bitcoin at an average price of
    $82,618 per BTC, as the world’s largest corporate Bitcoin holders signal continued
    confidence in Bitcoin, amid global tariff uncertainty.Large Bitcoin investors,
    or whales, continue accumulating, absorbing over 300% of Bitcoin’s yearly issuance
    as exchanges continue losing coins at a historic pace, Cointelegraph reported
    on April 18.Related: Spar supermarket in Switzerland starts accepting Bitcoin
    paymentsCrypto analysts eye quiet Easter weekend after weeks of turmoilDespite
    continued accumulation from whales and institutions, volatility concerns were
    raised by significant movements from the medium-term Bitcoin cohort, which holds
    coins for an average of three to six months.Over 170,000 Bitcoin entered circulation
    from the medium-term cohort, a development that may signal “imminent” crypto market
    volatility, according to pseudonymous CryptoQuant analyst Mignolet.“The effect
    of this metric on LTF moves is overstated as large onchain movement of coins hardly
    ever affects weekend price action since it’s not on liquid markets or CEX markets,”
    analysts at Bitfinex exchange told Cointelegraph, adding:“It is important to note
    that funding rates remain relatively flat currently. Moreover, US markets are
    closed as we have a long weekend for Easter, so volatility could be suppressed
    barring headlines from the White House.”Related: Crypto, DeFi may widen wealth
    gap, destabilize finance: BIS reportMarcin Kazmierczak, chief operating officer
    of RedStone Oracles, added that the recent movements may be operational transfers,
    not necessarily signs of imminent selling pressure.Still, concerns over weekend
    volatility have been amplified over the past two weeks after the Mantra (OM) token’s
    price collapsed by over 90% on Sunday, April 13, from roughly $6.30 to below $0.50,
    triggering market manipulation allegations and highlighting “critical” liquidity
    issues in the industry.Two weeks ago, on April 6, Bitcoin fell below $75,000 on
    Sunday, as investor concerns spread from a record-breaking  $5 trillion sell-off
    from the S&P 500, its largest on record.BTC, SPX, year-to-date chart. Source:
    Cointelegraph/TradingViewThe correction was caused by Bitcoin’s 24/7 trading availability,
    which made it the only large liquid asset available for de-risking on Sunday,
    Blockstream CEO Adam Back told Cointelegraph.“On a weekend, there’s not much volume.
    So you have a worse risk of rapid sort of flash crashes or flash dips that get
    filled in again,” he said.Magazine: Bitcoin ATH sooner than expected? XRP may
    drop 40%, and more: Hodler’s Digest, March 23 – 29\n\n            "

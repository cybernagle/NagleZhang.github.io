  summary: "Bitcoin (BTC) has risen above $85,000, signaling that the bulls are trying
    to form a higher low at $83,000. The short-term price action remains susceptible
    to news related to the US tariffs and the ongoing trade war with China.Gold has
    been a clear winner during the current bout of macroeconomic uncertainty. Citing
    data from Bank of America (BoA), The Kobeissi Letter said that gold funds are
    on track to hit $80 billion in net inflows year-to-date, roughly double the amount
    seen in 2020. In comparison, spot Bitcoin exchange-traded funds’ net inflows have
    shrunk to just $165 million after weeks of continuous outflows, per CoinShares
    data.Crypto market data daily view. Source: Coin360However, some cryptocurrency
    investors are happy about gold’s rally because a popular theory suggests that
    Bitcoin not only copies but exceeds gold’s rally with a few months’ lag. Anonymous
    crypto trader Titan of Crypto said in a post on X that Bitcoin could hit $137,000
    by July-August 2025.Could Bitcoin bulls build momentum and push the price above
    the overhead resistance? Will the altcoins also see a short-term rally? Let’s
    analyze the charts of the top 10 cryptocurrencies to find out.Bitcoin price analysisBitcoin
    failed to rise above the 200-day simple moving average ($87,660) on April 15,
    but a minor positive is that the buyers have sustained the price above the 20-day
    exponential moving average ($83,289).BTC/USDT daily chart. Source: Cointelegraph/TradingViewThe
    flattish 20-day EMA and the relative strength index (RSI) near the midpoint suggest
    the sellers are losing their grip. Buyers will have to propel the price above
    the 200-day SMA to seize control. If they manage to do that, the BTC/USDT pair
    could jump to $95,000 and eventually to the psychologically crucial level at $100,000.Contrarily,
    a break and close below the 20-day EMA indicates that the bulls have given up.
    That could pull the pair down to $78,500 and later to $73,777.Ether price analysisEther’s
    (ETH) relief rally stalled at the 20-day EMA ($1,697) on April 14, suggesting
    that bears remain active at higher levels.ETH/USDT daily chart. Source: Cointelegraph/TradingViewSellers
    will try to strengthen their position by pulling the price below $1,471. If they
    do that, the ETH/USDT pair could fall to $1,368. Buyers will try to guard the
    $1,368 level, but the pair could slump to $1,150 if the bears have their way.The
    first sign of strength will be a break and close above $1,754. That opens the
    gates for a possible rally to $2,111. The 50-day SMA ($1,919) may act as a barrier,
    but it is likely to be crossed. Buyers will have to shove the price above $2,111

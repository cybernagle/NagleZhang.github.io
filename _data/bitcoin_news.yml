- title: " Here’s what happened in crypto today "
  url: https://cointelegraph.com/news/what-happened-in-crypto-today?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Today in crypto, crypto industry professionals say US regulation must
    clarify banking and stablecoins before focusing on taxes, a video of Vitalik Buterin
    interacting with a robot has caught the crypto industry’s attention.Binance introduces
    CEX to DEX trades for better user experienceCrypto exchange Binance has introduced
    centralized exchange (CEX) to decentralized exchange (DEX) trading, eliminating
    the need for complicated asset bridging and cumbersome manual transfers.Binance
    Wallet users will now be able to use Circle's USDC (USDC) and other supported
    stablecoins to purchase tokens trading on the Ethereum, Base, Solana, and BNB
    Smart Chain networks.An online meme poking fun at the highly technical nature
    of crypto and the complex user experience. Source: Kev.ETHThe CEX to DEX feature
    creates a much-needed user experience overhaul, especially for those new to crypto,
    who may find bridging or manually transferring assets too technically complex
    and unapproachable.Additionally, the technical complexity inherent in crypto creates
    the potential for lost user funds and is one of the main barriers to crypto achieving
    mass adoption.Stablecoin rules needed in US before crypto tax reform, experts
    sayUnited States cryptocurrency regulations need more clarity on stablecoins and
    banking relationships before lawmakers prioritize tax reform, according to industry
    leaders and legal experts.“In my view, tax isn’t necessarily the priority for
    upgrading US crypto regulation,” according to Mattan Erder, general counsel at
    layer-3 decentralized blockchain network Orbs.A “tailored regulatory approach”
    for areas including securities laws and removing “obstacles in banking” is a priority
    for US lawmakers with “more upside” for the industry, Erder told Cointelegraph.“The
    new Trump administration is clearly all in on crypto and is taking steps that
    we could have only dreamed about a few years ago (including during his first term),”
    he said. “It seems likely that crypto regulation will be able to have it all and
    get much more clear and rational regulation in all areas, including tax.”Still,
    Erder noted there are limits to what President Donald Trump can accomplish through
    executive orders and regulatory agency action alone. “At some point, the laws
    themselves will need to change, and for that, he will need Congress,” he said.Trump’s
    March 7 executive order, which directed the government to establish a national
    Bitcoin reserve using crypto assets seized in criminal cases, was seen as a signal
    of growing federal support for digital assets.Vitalik Buterin meows at a robot,
    and the crypto world loses itA video of Ethereum co-founder Vitalik Buterin kneeling
    in front of a robot and seemingly letting out a “meow” sound has gone viral —
    and, as usual, the crypto industry is already speculating what it might mean for
    Ether’s future.“The future of Ethereum is in this man’s hands… Meow,” crypto influencer
    Wendy O said in a March 29 X post. Cork Protocol co-founder Phil Fogel shared the
    video and commented that “so much” of his professional life and net worth depend
    on Buterin but reiterated that the entertaining interaction makes him “bullish.”Source:
    RinorPseudonymous crypto trader Scott Crypto Warrior shared the video with his
    514,300 X followers and said, “Pray for our ETH bags.” The short clip shows Buterin
    on his knees, gesturing at a four-legged robot and letting out what sounds like
    a “meow” before patting it on the head. At the time of publication, Buterin has
    yet to address the video on social media himself.\n\n            "

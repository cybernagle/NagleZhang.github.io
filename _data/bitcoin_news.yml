    to push and maintain the price above the 50-day SMA ($15.47). If they manage to
    do that, the pair could rally to $17.50 and subsequently to the resistance line.UNUS
    SED LEO price analysisUNUS SED LEO (LEO) turned down from the overhead resistance
    of $9.90 and plunged below the uptrend line on March 30.LEO/USD daily chart. Source:
    Cointelegraph/TradingViewHowever, the bears could not sustain the lower levels,
    and the bulls pushed the price back into the triangle on April 1. The recovery
    is expected to face selling at the 20-day EMA ($9.60). If the price turns down
    from the 20-day EMA and breaks below the uptrend line, it increases the risk of
    a fall to $8.Instead, if the LEO/USD pair breaks above the 20-day EMA, it suggests
    that the markets have rejected the breakdown. A breakout and close above $9.90
    will complete an ascending triangle pattern, which has a target objective of $12.04.This
    article does not contain investment advice or recommendations. Every investment

- title: " El Salvador stacks 7 Bitcoin in last week, despite IMF deal "
  url: https://cointelegraph.com/news/el-salvador-stacks-7-bitcoin-week-despite-imf-deal?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "The government of El Salvador continues stacking Bitcoin (BTC) for its
    national crypto reserve, despite an ongoing deal with the International Monetary
    Fund (IMF) stipulating that the Central American country stop using public funds
    to purchase Bitcoin as one of the conditions for a loan agreement.According to
    data from the El Salvador Bitcoin Office, the country acquired an additional seven
    BTC in the last seven days, bringing its total holdings to 6,173 BTC, valued at
    over $637 million.El Salvador's Bitcoin Office has continued its steady pace of
    Bitcoin acquisitions months after the IMF agreement was signed and shows no sign
    of halting its Bitcoin purchases.The Central American country is one of the only
    nations actively purchasing Bitcoin in open market operations, and its national
    Bitcoin treasury strategy will serve as a blueprint for other countries also considering
    Bitcoin strategic reserves, according to crypto industry executives.El Salvador’s
    Bitcoin holdings and acquisitions since March 13. Source: El Salvador Bitcoin
    OfficeRelated: El Salvador works with Nvidia to develop sovereign AI infrastructureEl
    Salvador remains defiant against IMF pressure El Salvador signed a $1.4 billion
    loan agreement with the IMF in December 2024. As part of that agreement, the government
    of the country agreed to rescind its Bitcoin legal tender law and make Bitcoin
    payments voluntary.The agreement also stipulated that El Salvador must scale back
    its Bitcoin accumulation, refraining from using public funds to finance Bitcoin
    purchases. Additionally, the deal required the government to privatize the Chivo
    Wallet, which was publicly funded but saw little use among residents.In January
    2025, lawmakers in the Central American country repealed the Bitcoin legal tender
    law in a 55-2 Congressional vote, although this did nothing to pause or slow Bitcoin
    acquisitions.The IMF issued another request to the country to halt Bitcoin buys
    in March 2025, reiterating the original terms of the agreement. However, El Salvador's
    President Nayib Bukele pushed back against the requests.Bukele emphasized that
    the country would not stop its Bitcoin purchases or slow down its accumulation
    of BTC in the face of mounting pressure from the supranational financial institution.\"No,
    it’s not stopping. If it didn’t stop when the world ostracized us and most 'Bitcoiners'
    abandoned us, it won’t stop now, and it won’t stop in the future,\" Bukele wrote
    in a March 4 X post.Magazine: El Salvador’s national Bitcoin chief has been orange-pilling
    Argentina\n\n            "
  published: 2025-05-10 22:51:42.000000000 +01:00
- title: " Bitcoin now deflationary due to Strategy&#039;s BTC purchases — Analyst "
  url: https://cointelegraph.com/news/bitcoin-deflationary-due-strategy-btc-purchases?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Strategy, a Bitcoin (BTC) treasury company, is accumulating Bitcoin at
    a faster rate than total miner output, giving the supply-capped asset a -2.33%
    annual deflation rate, according to CryptoQuant CEO and market analyst Ki Young
    Ju.“Their 555,000 BTC is illiquid with no plans to sell,” the analyst wrote in
    a May 10 X post. “Strategy's holdings alone mean a -2.23% annual deflation rate
    — likely higher with other stable institutional holders,” Ju continued.Michael
    Saylor, the co-founder of Strategy, is an outspoken Bitcoin advocate who evangelizes
    the scarce digital currency to potential investors and has inspired many other
    companies to adopt a Bitcoin treasury plan.The total BTC supply is shrinking due
    to Strategy accumulating Bitcoin. Source: Ki Young JuAdditionally, Strategy acts
    as a bridge between Bitcoin and traditional financial (TradFi) markets by funneling
    funds from TradFi investors into Bitcoin through selling corporate debt and equity,
    which the company uses to finance more BTC purchases. According to Michael Saylor,
    over 13,000 institutions hold Strategy stock directly in their portfolios.Bitcoin
    investors continue to watch the company and its effect on Bitcoin market dynamics.
    Strategy leads the charge toward institutional adoption of Bitcoin, further restricting
    the supply of available coins and raising BTC prices, while dampening volatility.Related:
    Bitcoin yet to hit $150K because outsiders are ghosting — Michael SaylorStrategy
    and corporate institutions change the Bitcoin market dynamicAdam Livingston, author
    of \"The Bitcoin Age and The Great Harvest,\" recently said that Strategy is synthetically
    halving Bitcoin by outpacing miner supply through high demand.According to the
    author, the current collective daily miner output is approximately 450 BTC, while
    Strategy accumulates an average of 2,087 BTC per day, over four times the daily
    miner production.Miner reserves are dwindling and are in a long-term decline.
    Source: CryptoQuantOther institutions, including hedge funds, pension funds, asset
    managers, and tech companies, continue buying BTC as a portfolio diversifier or
    a treasury asset to hedge against fiat currency inflation.ETF inflows have also
    helped to stabilize Bitcoin's price by injecting fresh capital from traditional
    financial markets, smoothing out the volatility of Bitcoin and making downturns
    less severe.However, the most august institutional players — sovereign wealth
    funds — will not ramp up Bitcoin purchases until clear cryptocurrency regulations
    are established in the United States, according to SkyBridge founder Anthony Scaramucci.Once
    a comprehensive regulatory framework emerges in the US, it will trigger large
    blocks of Bitcoin purchases by sovereign wealth funds, increasing Bitcoin's price,
    Scaramucci added.Magazine: Bitcoin vs. the quantum computer threat: Timeline and
    solutions (2025–2035)\n\n            "
  published: 2025-05-10 19:01:28.000000000 +01:00
- title: " Robert Kiyosaki says ditch ‘fake money’ for Bitcoin, gold and silver "
  url: https://cointelegraph.com/news/robert-kiyosaki-bitcoin-gold-silver-fake-money?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Robert Kiyosaki, businessman and best-selling author of Rich Dad Poor
    Dad, is once again sounding the alarm on the dangers of centralized monetary policy,
    urging his followers to abandon what he calls “fake money” and adopt alternatives
    like Bitcoin, gold and silver.In a May 10 post on X, Kiyosaki backed a hardline
    stance against central banking systems, particularly the US Federal Reserve, while
    quoting former US Congressman Ron Paul.Ron Paul, a longtime critic of the Fed
    and author of End the Fed, described interest rate setting by central banks as
    “price fixing,” equating it to socialist and Marxist economic control.Paul warned
    that such mechanisms erode personal wealth and undermine economic freedom — a
    sentiment that aligns closely with Kiyosaki’s long-held concerns.“Fake money leads
    to dishonest money, dishonest statistics, dishonest accounting, dishonest balance
    sheets, dishonest compensation, dishonest relations, dishonest leaders, and corruption
    in everyday life,” Kiyosaki wrote.He called on Americans to “fight back” by opting
    out of fiat systems and instead embracing decentralized stores of value like Bitcoin
    (BTC) and precious metals.Source: Robert KiyosakiRelated: ‘Rich Dad, Poor Dad’
    author calls for $1 million BTC by 2035Kiyosaki remains a major fiat criticKiyosaki’s
    disdain for fiat currency is not new. He has repeatedly criticized the US dollar,
    labeling it a “dying” currency inflated by government spending and central bank
    manipulation.His financial philosophy, rooted in Austrian economics and personal
    sovereignty, champions assets that cannot be debased or politically controlled.Kiyosaki
    has long argued that bearer assets like gold, silver and, more recently, Bitcoin,
    are critical hedges against inflation and key to long-term generational wealth
    accumulation through economic cycles.“Don’t work or save fake money,” he advised.
    “Get on your own decentralized gold, silver, and Bitcoin standard.”In an April
    18 post, Kiyosaki forecasted that Bitcoin could hit $1 million by 2035 as the
    US dollar continues to lose value to inflationary monetary policies.“I strongly
    believe, by 2035, that one Bitcoin will be over $ 1 million, gold will be $30,000,
    and silver $3,000 a coin,” he said.Kiyosaki is not the only one expressing confidence
    in Bitcoin’s future.In February 2025, ARK Invest CEO Cathie Wood said that Bitcoin
    could hit $1.5 million by 2030 if demand for the digital asset continues to grow.More
    recently, on Dec. 10, Eric Trump delivered the keynote speech at the Bitcoin MENA
    event in Abu Dhabi, United Arab Emirates (UAE), and predicted that Bitcoin would
    hit $1 million due to its scarcity.Magazine: TradFi fans ignored Lyn Alden’s BTC
    tip — Now she says it’ll hit 7 figures: X Hall of Flame\n\n            "

- title: " Polymarket bettors say there’s a 100% chance the Fed ends QT before May "
  url: https://cointelegraph.com/news/polymarket-fed-ends-quantitative-tightening-may?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWE1NzEtZDA2ZS03MTEyLWFhNjItODJjMDBhODA0ZTZi.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWE1NzEtZDA2ZS03MTEyLWFhNjItODJjMDBhODA0ZTZi.jpg\"
    alt=\"Polymarket bettors say there’s a 100% chance the Fed ends QT before May\"></p><p>Betters
    on Polymarket believe it&rsquo;s now a certainty that the US Federal Reserve will
    wind down its quantitative tightening (QT) program by May of this year, a move
    many analysts say could trigger the next leg of the crypto bull market.&nbsp;<p>By
    March 14, Polymarket&rsquo;s betting odds that the Fed would end QT by April 30
    was 100%, where it remains unchanged at the time of writing.</p><p>The wager,
    titled &ldquo;Will Fed end QT before May?,&rdquo; has more than $6.2 million in
    cumulative trading volume.</p><figure><img alt=\"Polymarket bettors say there&rsquo;s
    a 100% chance the Fed ends QT before May\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a558-3be6-7a3b-8493-ad09bdd53572\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Polymarket users have
    assigned a 100% probability that the Fed will end quantitative tightening in the
    coming months. Source: </em><a data-ct-non-breakable=\"null\" href=\"https://polymarket.com/event/will-fed-end-qt-before-may?tid=1742233009911\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://polymarket.com/event/will-fed-end-qt-before-may?tid=1742233009911\"><em>Polymarket</em></a></p></figcaption></figure><p>Polymarket
    is a crypto-based prediction market that lets betters wager on real-world events.
    It rose to prominence during the 2024 US presidential election cycle, where it
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/trump-s-odds-near-67-as-polymarket-whale-bets-another-2-m\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">accurately predicted
    the ascent of Donald Trump</a>.</p><p><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/fed-money-printer-goes-into-reverse-what-does-it-mean-for-crypto\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Quantitative tightening</a>
    is a monetary policy tool used by the Fed to draw money out of the economy by
    letting the bonds on its balance sheet mature. It&rsquo;s the opposite of quantitative
    easing or the balance sheet expansion that the central bank embarked on following
    the 2008 financial crisis.&nbsp;</p><p>The Fed&rsquo;s current QT regime has been
    ongoing since June 2022 as a complement to other inflation-reducing policies.
    In addition to raising short-term interest rates, the Fed uses QT to raise long-term
    rates and drain excess liquidity from the market.&nbsp;</p><p>Although the start
    of QT didn&rsquo;t prevent stocks and crypto prices from rallying &mdash; these
    markets are coming off back-to-back years of impressive growth &mdash; it has
    become a bottleneck due to <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/crypto-biz-trump-intentionally-crashing-market\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/crypto-biz-trump-intentionally-crashing-market\">the
    recent macroeconomic shocks</a> stemming from the Trump administration.</p><p>This
    was <a data-ct-non-breakable=\"null\" href=\"https://www.cambridgeassociates.com/insight/quantitative-tightening-raises-the-risks-for-markets/\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://www.cambridgeassociates.com/insight/quantitative-tightening-raises-the-risks-for-markets/\">predicted</a>
    in 2022 by Cambridge Associates senior investment director TJ Scavone, who said
    the negative side effects of QT would be felt once &ldquo;something breaks&rdquo;:&nbsp;</p><blockquote>&ldquo;With
    QT just now ramping up, the risk it poses to financial markets appears low. Yet,
    adding QT to what is an already difficult and volatile market environment may
    worsen market conditions, increasing the risk that &ldquo;something breaks&rdquo;
    from overtightening.&rdquo;</blockquote><p><em><strong>Related: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/polymarket-fort-knox-audit-betting-gold-reserve-debate\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Polymarket
    bets on Fort Knox audit as reserve debate heats up</strong></em></a></p><h2>QT
    and crypto</h2><p>Crypto&rsquo;s strong correlation with traditional markets exposed
    the asset class to extreme volatility in February. By March, the S&amp;P 500 Index
    was officially in correction territory &mdash; and Bitcoin (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/bitcoin-price\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">BTC</a>) was down roughly 30% from its January peak.&nbsp;</p><p>The
    growing belief that the Fed is ready to wind down QT is seen by many as a bullish
    catalyst for crypto, as more liquidity will eventually trickle down into risk
    assets. Combined with rate cuts in the second half of the year, there may be enough
    policy drivers to reverse the crypto market&rsquo;s multimonth downtrend.</p><p>This
    general playbook is supported by crypto analyst Benjamin Cowen, who believes the
    end of QT will be followed by a broad market rally.&nbsp;</p><figure><img alt=\"Federal
    Reserve, Bitcoin Price, Predictions\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a559-c21b-755b-9adb-09e45130e82b\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/intocryptoverse/status/1899105889522487553\" rel=\"null\"
    target=\"null\" text=\"null\" title=\"https://x.com/intocryptoverse/status/1899105889522487553\"><em>Benjamin
    Cowen</em></a></p></figcaption></figure><p>Although the Fed hasn&rsquo;t confirmed
    whether it will wind down its QT program, the <a data-ct-non-breakable=\"null\"
    href=\"https://www.federalreserve.gov/monetarypolicy/files/fomcminutes20250129.pdf\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">minutes</a> of the January
    Federal Open Market Committee meeting revealed that some officials were concerned
    about balance sheet reductions impacting the government&rsquo;s debt ceiling debate:</p><blockquote>&ldquo;Regarding
    the potential for significant swings in reserves over coming months related to
    debt ceiling dynamics, various participants noted that it may be appropriate to
    consider pausing or slowing balance sheet runoff until the resolution of this
    event.&rdquo;</blockquote><p>Important policy changes at the Fed are coinciding
    with a broad pickup in the business cycle. As Cointelegraph recently reported,
    the <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/trump-bitcoin-price-pmi-roadmap-business-cycle\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">US Manufacturing Purchasing
    Managers Index (PMI)</a> has been in expansion mode for two consecutive months
    following more than two years of contraction.&nbsp;</p><p>During the last two
    crypto market cycles, Bitcoin&rsquo;s peak coincided with the top of the business
    cycle, as expressed by the manufacturing PMI.</p><figure><img alt=\"Polymarket
    bettors say there&rsquo;s a 100% chance the Fed ends QT before May\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01956242-a045-70a9-8a11-c947886f2cc9\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Bitcoin&rsquo;s price
    exhibits a strong correlation with the ISM manufacturing PMI. Source: </em><a
    data-ct-non-breakable=\"null\" href=\"https://x.com/TomasOnMarkets/status/1886829755099468052\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://x.com/TomasOnMarkets/status/1886829755099468052\"><em>TomasOnMarkets</em></a></p></figcaption></figure><p><em><strong>X
    Hall of Flame: </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/trump-bitcoin-price-pmi-roadmap-business-cycle\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>DeFi will
    rise again after memecoins die down: Sasha Ivanov</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"crypto_biz\" label=\"Subscription
    Form: Crypto Biz Newsletter\"></template></p>\n</p>\n            "

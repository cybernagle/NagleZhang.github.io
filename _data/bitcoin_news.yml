- title: " Metaplanet tops $400M Bitcoin holdings with new $28M purchase "
  url: https://cointelegraph.com/news/metaplanet-surpasses-400-m-bitcoin-holdings-28-m?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Japanese investment firm Metaplanet increased its Bitcoin holdings to
    more than $400 million after its latest purchase.Metaplanet acquired 330 Bitcoin
    (BTC) for $28.2 million at an average price of $85,605 per BTC, bringing its total
    holdings to 4,855 Bitcoin worth $414 million, according to an April 21 post from
    Simon Gerovich, the CEO of Metaplanet.The firm’s Bitcoin yield surpassed 119%
    year-to-date after its latest investment.Source: Simon GerovichMetaplanet issued
    2 billion Japanese yen ($13.3 million) of bonds to buy more Bitcoin on March 31,
    Cointelegraph reported.Related: UK firm buys $250M Bitcoin as analysts eye quiet
    Easter weekendThe $414 million in Bitcoin holdings make Metaplanet Asia’s largest
    and the world’s 10th-largest corporate Bitcoin holder, Bitbo data shows.Source:
    Bitbo According to Enmanuel Cardozo, a market analyst at the asset tokenization
    platform Brickken, the growing institutional presence of firms, such as Strategy
    and Tether, is accelerating the four-year Bitcoin cycle.“That puts the bottom
    around Q3 this year and a peak mid-2026, but I think we might see things move
    it a bit sooner because the market’s more mature now with more liquidity,” the
    analyst told Cointelegraph.Related: $1T stablecoin supply could drive next crypto
    rally — CoinFund’s PakmanMetaplanet plans to reach 21,000 BTCThe latest acquisitions
    are part of Metaplanet’s plans to accumulate 21,000 BTC by 2026, aligning with
    its mission to drive Bitcoin adoption across Japan.Often dubbed “Asia’s MicroStrategy,”
    Metaplanet has drawn comparisons to Michael Saylor’s company Strategy, which continues
    to top the list of public Bitcoin holders.Metaplanet’s investment was announced
    a week after the latest purchase by Strategy, the world’s largest corporate Bitcoin
    holder.Source: Michael SaylorStrategy bought 3,459 BTC for $285.5 million at an
    average price of $82,618 per BTC, bringing its total holding to 531,644 BTC acquired
    for a cumulative $35.92 billion, Cointelegraph reported on April 14.Despite tariff
    uncertainty limiting risk appetite among traditional and crypto investors in the
    short term, analysts are optimistic about Bitcoin’s price trajectory for the next
    decade.Bitcoin may surpass $1.8 million by 2035, driven by its growing recognition
    as a superior savings technology, set to rival or surpass gold’s $21 trillion
    market capitalization, Joe Burnett, director of market research at Unchained,
    told Cointelegraph during the  Chainreaction live show on X.Magazine: SCB tips
    $500K BTC, SEC delays Ether ETF options, and more: Hodler’s Digest, Feb. 23 –
    March 1\n\n            "

    pose a substantial challenge at $644, but if the buyers prevail, the BNB/USDT
    pair could soar to $680.Contrarily, a close below the moving averages suggests
    that the bears are trying to form a lower high. The pair could drop to $576 and
    then to $566, where the bulls are expected to step in.Solana price predictionSolana
    (SOL) pulled back from the $153 resistance, but the bulls are trying to sustain
    the price above the 20-day EMA ($140).SOL/USDT daily chart. Source: Cointelegraph/TradingViewSuppose
    the price rebounds off the 20-day EMA with strength; the likelihood of a break
    above the $153 resistance increases. If that happens, the SOL/USDT pair could
    pick up momentum and surge to $180. Alternatively, a break and close below the
    20-day EMA suggests that the short-term bulls are closing their positions. The
    pair may then slip to the 50-day SMA ($131), signaling a consolidation between
    $110 and $153.Dogecoin price predictionDogecoin (DOGE) has been range-bound between
    $0.21 and $0.14 for several days, indicating buying near the support and selling
    close to the overhead resistance.DOGE/USDT daily chart. Source: Cointelegraph/TradingViewThe
    flattish moving averages and the RSI just below the midpoint signal that the range-bound
    action may extend for a few more days. The trend will turn in favor of the bulls
    if they push and maintain the DOGE/USDT pair above the $0.21 resistance. That
    completes a double-bottom pattern, which has a target objective of $0.28.On the
    downside, buyers are expected to vigorously defend the $0.14 support because a
    break below it could resume the downtrend toward $0.10.Cardano price predictionCardano
    (ADA) has been sustaining above the moving averages for the past few days, but
    the bulls have failed to start a strong rebound. ADA/USDT daily chart. Source:
    Cointelegraph/TradingViewIf the price skids below the moving averages, it will
    tilt the short-term advantage in favor of the bears. The ADA/USDT pair could drop
    to $0.58, which is expected to act as a strong support. If buyers want to prevent
    the downside, they will have to swiftly push the price above the $0.75 resistance.
    If they do that, the pair could rally to $0.83, where the bears are likely to
    mount a strong defense.Related: Bitcoin macro indicator that predicted 2022 bottom
    flashes 'buy signal'Sui price predictionBuyers tried to push Sui (SUI) above the
    $3.90 overhead resistance on April 28, but the bears held their ground.SUI/USDT
    daily chart. Source: Cointelegraph/TradingViewSellers are trying to strengthen
    their position by pulling the price below the 38.2% Fibonacci retracement level

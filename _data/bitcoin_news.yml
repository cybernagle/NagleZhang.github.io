- title: " The current BTC ‘bear market’ will only last 90 days — Analyst "
  url: https://cointelegraph.com/news/btc-bear-market-last-90-days-analyst?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "The current Bitcoin (BTC) bear market, defined as a 20% or more drop from
    the all-time high, is relatively weak in terms of magnitude and should only last
    for 90 days, according to market analyst and the author of Metcalfe’s Law as a
    Model for Bitcoin's Value, Timothy Peterson.Peterson compared the current downturn
    to the 10 previous bear markets, which occur roughly once per year, and said that
    only four bear markets have been worse than the price decline in terms of duration,
    including 2018, 2021, 2022, and 2024.The analyst predicted that BTC will not sink
    deeply below the $50,000 price level due to the underlying adoption trends. However,
    Peterson also argued that based on momentum, it is unlikely that BTC will break
    below $80,000. The analyst added:\"There may be a slide in the next 30 days followed
    by a 20-40% rally sometime after April 15. You can see that in the charts around
    day 120. This would probably be enough of a headline to bring weak hands back
    into the market and propel Bitcoin even higher.\"Crypto markets experienced a
    sharp downturn following United States President Trump’s tariffs on several US
    trading partners, which sparked counter-tariffs on US exports, leading to fears
    of a prolonged trade war.Comparison of every bear market since 2025. Source: Timothy
    PetersonRelated: Is Bitcoin going to $65K? Traders explain why they're still bearishInvestors
    flee risk-on assets over trade war fears Investor appetite for speculative assets
    is declining due to the ongoing trade war and macroeconomic uncertainty.The Glassnode
    Hot Supply metric, a measure of BTC owned for one week or less, declined from
    5.9% amid the historic bull rally in November 2024 to only 2.3% as of March 20.According
    to Nansen research analyst Nicolai Sondergaard, crypto markets will face trade
    war pressures until April 2025, when international negotiations could potentially
    lower or diffuse the trade tariffs altogether.A recent analysis from CryptoQuant
    also shows that a majority of retail traders are already invested in BTC, dashing
    long-held hopes that a massive rush of retail traders would inject fresh capital
    into the markets and push prices higher in the near term.The trade war also placed
    Bitcoin's safe haven narrative in doubt as the price of the decentralized asset
    collapsed over tariff headlines alongside other risk and speculative assets.Magazine:
    Bitcoiners are ‘all in’ on Trump since Bitcoin ’24, but it’s getting riskyThis
    article does not contain investment advice or recommendations. Every investment
    and trading move involves risk, and readers should conduct their own research
    when making a decision.\n\n            "

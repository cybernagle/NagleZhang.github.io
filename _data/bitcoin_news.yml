- title: " Bitcoin breaks $86K as US tariff &#039;Liberation Day&#039; risks 11% BTC
    price dip "
  url: https://cointelegraph.com/news/bitcoin-price-86k-us-tariffs-liberation-day-begins?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin (BTC) reached new April highs at the April 2 Wall Street open
    as markets braced for US “Liberation Day.”BTC/USD 1-hour chart. Source: Cointelegraph/TradingViewBitcoin
    teases breakout in US tariff countdownData from Cointelegraph Markets Pro and
    TradingView showed local highs of $86,444 on Bitstamp, the best performance for
    BTC/USD since March 28.Volatility remained in the run-up to US President Donald
    Trump announcing a sweeping round of reciprocal trade tariffs.The measures would
    be unveiled in an address from the White House Rose Garden at 4 pm Eastern Time,
    with Trump then holding a press conference.While US stocks traded slightly down
    after the open, Bitcoin managed to claw back lost ground, acting in a key area
    of interest filled with long-term trend lines.As Cointelegraph reported, these
    include various simple (SMA) and exponential (EMA) moving averages, among them
    the 200-day SMA — a classic bull market support line currently lost.  BTC/USD
    1-day chart with 200 SMA. Source: Cointelegraph/TradingViewIn his latest observations,
    popular trader and analyst Rekt Capital made additional reference to the 21-week
    and 50-week EMAs.“The consolidation between the two Bull Market EMAs continues.
    However, the 21-week EMA (green) represents lower prices as it declines,” he wrote
    in a post on X alongside an illustrative chart.“This week the green EMA represents
    $87650. The declining nature of this EMA will make it easier for $BTC to breakout.”BTC/USD
    1-week chart with 21, 50 EMA. Source: Rekt Capital/XRekt Capital flagged more
    bullish news in the making, thanks to BTC/USD attempting to break out of an extended
    downtrend on daily timeframes.He confirmed:“Bitcoin is one Daily Candle Close
    above & retest of the Downtrend away from breaking out into a new technical uptrend.”BTC/USD
    1-day chart. Source: Rekt Capital/XLast month, Bitcoin’s daily relative strength
    index (RSI) metric broke free from its own downtrend that had been in place since
    November 2024.Analysis warns $76,000 BTC price may returnContinuing on the macro
    picture, however, trading firm QCP Capital was uninspired.Related: Bitcoin sales
    at $109K all-time high 'significantly below' cycle tops — GlassnodeRisk assets,
    it told Telegram channel subscribers on the day, were likely to “remain under
    pressure” following the tariffs announcement.“In crypto, sentiment remains broadly
    subdued. BTC continues to trade without conviction, while ETH is holding the line

- title: " Bitcoin landfill man loses appeal, says he has one ‘last legal option’ "
  url: https://cointelegraph.com/news/uk-man-who-lost-bitcoin-landfill-loses-uk-appeal-case?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "A UK man’s bid to obtain a permit to search a landfill for his hard drive
    — holding private keys to 8,000 Bitcoin — has been rejected by the UK Court of
    Appeal.“Appeal request to the Royal Court of Appeal: refused,” Howells said in
    a March 14 X post.“The Great British Injustice System strikes again… The state
    always protects the state,” the early Bitcoin adopter added before revealing his
    “next stop” would be the European Convention on Human Rights (ECHR).UK Royal Court
    of Appeal Judge Christopher Nugee knocked back Howells’ application, stating that
    there was no “real prospect of success” and there was “no other compelling reason”
    as to why it should be heard, according to a March 13 filing shared with Cointelegraph.Source:
    James HowellsNugee’s decision follows an earlier dismissal on Jan. 9 from High
    Court Judge Andrew Keyser, who similarly said there was “no realistic prospect”
    of Howells’ case succeeding at a full trial.In a note to Cointelegraph, Howell
    said his “last legal option” to exhaust is at the ECHR — where he will claim that
    the UK High Court and UK Court of Appeal breached his right to property and right
    to a fair trial under Article 1 of Protocol 1 and Article 6 of the ECHR.“The British
    establishment want to sweep this under the carpet, and i will not let them. It
    will not go away — no matter how long it takes!”The ECHR cannot overrule a UK
    court decision — however, a verdict in Howells’ favor would call on the UK courts
    to consider whether its legislation was interpreted in a way that is compatible
    with the ECHR’s provisions.In a separate statement shared with Cointelegraph,
    Howells said he would file a claim to the ECHR in the “coming weeks.”The court
    filings follow repeated rejections from the Newport City Council allowing Howells
    to search through the Docksway landfill — where Howells’ former partner disposed
    of a bag containing the hard drive at the site in 2013.Related: Burning quantum-vulnerable
    BTC is the best option — Jameson LoppHowells’ 8,000 Bitcoin (BTC) is worth around
    $660 million at current prices. While few predicted Bitcoin would reach such heights
    back then, Howells’ incident illustrates the importance of properly securing self-custodied
    crypto funds.Howells also appears to be running out of time, as the Docksway landfill
    is reportedly set to shut down sometime during the UK’s 2025-2026 financial year,
    BBC News reported on Feb. 9.Magazine: Bitcoin vs. the quantum computer threat:
    Timeline and solutions (2025–2035)\n\n            "

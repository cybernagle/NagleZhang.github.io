- title: " Russian Gotbit founder strikes $23M plea deal with US prosecutors "
  url: https://cointelegraph.com/news/russian-gotbit-23-million-plea-united-states?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Aleksei Andriunin, a Russian national charged with manipulating cryptocurrency
    through the Gotbit market maker platform, has reportedly struck a plea deal with
    prosecutors in the United States.Gotbit founder and CEO Andriunin has agreed to
    forfeit about $23 million in Tether USDt (USDT) and Circle’s USDC (USDC) in a
    plea deal with Massachusetts federal prosecutors, the legal news service Law360
    reported on March 19.As part of the plea, Andriunin will plead guilty to three
    counts charging conspiracy to commit wire fraud and market manipulation, according
    to the letter signed by the defendant on March 19.An excerpt from letters in the
    Gotbix founder case related to the $23 million forfeiture as part of the plea
    with Massachusetts prosecutors: Law360 “Defendant understands and agrees that
    forfeiture shall not satisfy or affect any fine, lien, penalty, restitution, cost
    of imprisonment, tax liability or any other debt owed to the United States,” the
    letter reads.The agreement doesn’t bind the US Attorney GeneralIn the letter to
    the defendant, the US Attorney for the District of Massachusetts, Leah Foley,
    stressed that the agreement to forfeit $23 million is only between Andriunin and
    the attorney.“It does not bind the Attorney General of the United States or any
    other federal, state, or local prosecuting authorities,” the letter reads.The
    letter also states that the defendant acknowledges the court is not obligated
    to adhere to the sentencing calculations proposed by the Massachusetts attorney.An
    excerpt from legal letters in the Gotbix founder case related to sentencing guidelines
    with Massachusetts prosecutors: Law360 “Defendant may not withdraw defendant’s
    guilty plea if defendant disagrees with how the court calculates the guidelines
    or with the sentence the court imposes,” attorney Foley wrote.Andriunin was extradited
    to the US in October 2025Gotbit founder’s deal with Massachusetts prosecutors
    came months after Andriunin was extradited to the US in October 2024 after being
    arrested by Portuguese authorities.Since extradition, Andriunin has appeared in
    a federal court in Boston, Massachusetts, where he was ordered to remain detained
    until further notice.Andriunin, 26, was charged with wire fraud and conspiracy
    to commit market manipulation and wire fraud in a superseding indictment in October
    2024.Source: Alex Andriunin According to Massachusetts court documents, Gotbit
    was a crypto “market maker” that orchestrated a “widespread cryptocurrency market
    manipulation scheme.” The platform was registered in Belize and was said to provide
    artificial trading volume for global firms, including those in the US, between
    2017 and 2024.Related: Telegram founder Pavel Durov given permission to leave
    FranceApart from Andriunin, the criminal complaint from Massachusetts authorities
    in September 2024 also involved other Gotbit employees, such as marketing director
    Fedor Kedrov and sales director Qawi Jalili, both living in Russia.In the plea
    letter, Massachusetts attorney Foley mentioned that the assets listed in the forfeiture
    section of the Gotbit plea agreement are solely controlled by the defendant on
    Gotbit’s behalf despite these assets belonging to Gotbit.Magazine: Memecoins are
    ded — But Solana ‘100x better’ despite revenue plunge\n\n            "

- title: " Crypto market’s biggest risks in 2025: US recession, circular crypto economy "
  url: https://cointelegraph.com/news/crypto-bull-cycle-threatened-by-us-recession-circular-economy?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDIvMDE5NGVmMTItZThmYy03YWViLTk5ZWQtMWZhOWVhMzhkMDhl.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDIvMDE5NGVmMTItZThmYy03YWViLTk5ZWQtMWZhOWVhMzhkMDhl.jpg\"
    alt=\"Crypto market’s biggest risks in 2025: US recession, circular crypto economy\"></p><p>While
    most analysts expect the crypto bull cycle to continue until the end of 2025,
    concerns over an economic recession in the United States, along with crypto&rsquo;s
    &ldquo;circular&rdquo; economy, may still threaten crypto valuations.<p>Despite
    the recent market correction, most crypto analysts expect the bull cycle to peak
    after the third quarter of 2025, with Bitcoin (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/bitcoin-price\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">BTC</a>) price predictions <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-price-predicted-160k-2025-macroeconomic-boost\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">ranging from $160,000</a>
    to <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/vaneck-predicts-q1-2025-crypto-correction-q4-all-time-highs\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">above $180,000</a>.</p><p>Beyond
    external concerns, such as a potential recession in the world&rsquo;s largest
    economy, crypto&rsquo;s biggest industry-specific risk is the &ldquo;circular&rdquo;
    nature of its economy, according to Arthur Breitman, the co-founder of Tezos.</p><p>&ldquo;Within
    the industry, the main risk is that the industry is still very much in search
    of grounding. It&rsquo;s all still very circular,&rdquo; Breitman told Cointelegraph.</p><p>&ldquo;If
    you look at DeFi, for example, the point of finance is to finance something [...],
    but if the only thing that DeFi finances is more DeFi, then that&rsquo;s circular,&rdquo;
    said Breitman, adding:</p><blockquote>&ldquo;If the only reason people want to
    buy your token is because they feel other people will want to buy this token,
    that's circular.&rdquo;</blockquote><iframe width=\"100%\" height=\"315\" src=\"https://www.youtube.com/embed/xzvpXxfbdF4?start=\"
    frameborder=\"0\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope;
    picture-in-picture\" allowfullscreen loading=\"lazy\"></iframe><p>This is in stark
    contrast to the stock market, which is &ldquo;built on revenue-generating businesses,&rdquo;
    making the crypto industry&rsquo;s &ldquo;lack of grounding&rdquo; one of the
    main industry threats, Breitman added.</p><p>Other industry insiders have also
    criticized the state of the crypto economy, specifically related to the latest
    memecoin meltdowns, which are siphoning liquidity from more established cryptocurrencies.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a3ec-8a3f-7f69-bdfa-e2490aacf06e\"
    title=\"\" alt=\"Crypto market&rsquo;s biggest risks in 2025: US recession, circular
    crypto economy\"><figcaption style=\"text-align: center;\"><p><em>Solana outflows.
    Source: deBridge, Binance Research</em></p></figcaption></figure><p><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/solana-sees-485-m-outflows-feb-amid-flight-safety-in-crypto-markets\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Solana was hit by over
    $485 million</a> worth of outflows in February after the recent wave of <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/milei-libra-token-scandal-107m-rug-pull\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">memecoin rug pulls</a>
    triggered an investor flight to &ldquo;safety,&rdquo; with some of the capital
    flowing into memecoins on the BNB Chain, such as <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/crypto-sniper-makes-28-m-cz-broccoli-memecoin\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">the Broccoli memecoin</a>,
    inspired by the Changpeng Zhao&rsquo;s dog.</p><p><em><strong>Related: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/rising-219-b-stablecoin-supply-mid-bull-cycle-not-top\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Rising $219B
    stablecoin supply signals mid-bull cycle, not market top</strong></em></a></p><h2>US
    recession fears are crypto&rsquo;s biggest external risk: Tezos co-founder</h2><p>Beyond
    industry-specific events, larger macroeconomic concerns, including a potential
    US recession, threaten traditional and cryptocurrency markets.</p><p>&ldquo;In
    terms of macro events, I still think we could see a recession,&rdquo; said Breitman,
    adding:</p><blockquote>&ldquo;There's a lot of bullish winds for the market, but
    there's also a lot of traditional recession indicators which have been flashing
    for a while now. So I don't think you can rule it out.&rdquo;</blockquote><p>Cryptocurrency
    markets still trade in significant correlation with tech stocks, meaning that
    a recession will cause a widespread sell-off, he added.</p><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/libra-melania-creator-wolf-wall-street-memecoin-crashes-99\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Libra, Melania
    creator&rsquo;s &lsquo;Wolf of Wall Street&rsquo; memecoin crashes 99%</strong></em></a></p><p>The
    current trade war concerns, driven by US President Donald Trump&rsquo;s import
    tariffs and continued retaliatory measures, have reignited concerns over a potential
    recession.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a3ec-8e3a-7b29-81ed-18a9841d89c8\"
    title=\"\" alt=\"Crypto market&rsquo;s biggest risks in 2025: US recession, circular
    crypto economy\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a
    data-ct-non-breakable=\"null\" href=\"https://polymarket.com/event/us-recession-in-2025?tid=1742210540718\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://polymarket.com/event/us-recession-in-2025?tid=1742210540718\"><em>Polymarket</em></a></p></figcaption></figure><p>Over
    40% of market participants expect a recession in the US this year, up from just
    22% a month ago on Feb. 17, according to the largest decentralized predictions
    market, <a data-ct-non-breakable=\"null\" href=\"https://polymarket.com/event/us-recession-in-2025?tid=1742210540718\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Polymarket</a>.</p><iframe
    width=\"100%\" height=\"315\" src=\"https://www.youtube.com/embed/6UnogdVQWrE?start=\"
    frameborder=\"0\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope;
    picture-in-picture\" allowfullscreen loading=\"lazy\"></iframe><p><em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/crypto-fans-obsessed-longevity-biohacking-why/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Crypto fans
    are obsessed with longevity and biohacking: Here&rsquo;s why</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"defi_newsletter\" label=\"Subscription
    Form: DeFi Newsletter\"></template></p>\n</p>\n            "
  published: 2025-03-17 12:03:31 UTC
- title: " Crypto ETPs see $1.7B in outflows, longest streak since 2015 "
  url: https://cointelegraph.com/news/crypto-etps-see-1-7b-outflows-fifth-week-in-row?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWEzYjQtZjYzMy03YWZhLTk5MzktYmVlYWE5MTE2ZjFl.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWEzYjQtZjYzMy03YWZhLTk5MzktYmVlYWE5MTE2ZjFl.jpg\"
    alt=\"Crypto ETPs see $1.7B in outflows, longest streak since 2015\"></p><p>Cryptocurrency
    exchange-traded products (ETPs) continued seeing massive selling last week, recording
    the fifth week of outflows in a row, with $1.7 billion leaving the market.&nbsp;<p>After
    seeing slightly softened outflows of $876 million in the previous week, crypto
    ETP liquidations accelerated during the past trading week, bringing the total
    five-week outflows to $6.4 billion, CoinShares <a data-ct-non-breakable=\"null\"
    href=\"https://blog.coinshares.com/volume-225-digital-asset-fund-flows-weekly-report-6f57a96f6d1a\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">reported</a> on March
    17.</p><p>The ongoing outflows have also marked the 17th straight day of outflows,
    the longest negative streak since CoinShares started records in 2015, CoinShares&rsquo;
    James Butterfill wrote.</p><p>Despite notable negative sentiment, year-to-date
    (YTD) inflows remain positive at $912 million, he added.</p><h2>BTC ETP outflows:
    $5.4 billion in five weeks</h2><p>After seeing $756 million outflows in the first
    week of March, Bitcoin (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>) ETPs saw increased
    selling in the trading week from March 10 to March 14, seeing a further $978 million
    outflows.</p><p>The five-week selling streak brought total BTC ETP outflows to
    $5.4 billion, leaving just $612 million of YTD inflows by March 14.</p><figure><img
    alt=\"Investments, CoinShares, Ethereum ETF, Bitcoin ETF\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a3bd-2a42-7b06-a410-36370231ce91\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Flows by asset (in
    millions of US dollars). Source: CoinShares</em></p></figcaption></figure><p>Both
    Ether (<a data-ct-non-breakable=\"null\" href=\"/ethereum-price\" rel=\"null\"
    target=\"null\" text=\"null\" title=\"null\">ETH</a>) and Solana (<a data-ct-non-breakable=\"null\"
    href=\"/solana-price-index\" rel=\"null\" target=\"null\" text=\"null\" title=\"null\">SOL</a>)
    ETPs saw $175 million and $2.2 million outflows, respectively. XRP (<a data-ct-non-breakable=\"null\"
    href=\"/xrp-price-index\" rel=\"null\" target=\"null\" text=\"null\" title=\"null\">XRP</a>)
    ETPs continued to go against the trend, seeing a further $1.8 million in inflows.</p><h2>European
    21Shares sees largest outflows</h2><p>According to CoinShares data, European crypto
    ETP provider 21Shares recorded the largest liquidations among issuers last week,
    totaling $534 million of outflows.</p><p>Despite significant selling in Europe,
    the United States still saw the largest outflows among the analyzed regions, with
    $1.2 billion leaving its crypto ETP market.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a457-7987-7f70-aaf8-a7dc14e73c05\"
    title=\"\" alt=\"Crypto ETPs see $1.7B in outflows, longest streak since 2015\"><figcaption
    style=\"text-align: center;\"><p><em>Flows by issuer (in millions of US dollars).
    Source: CoinShares</em></p></figcaption></figure><p>BlackRock, the largest crypto
    holder among all the issuers, saw $401 million of outflows, with month-to-date
    outflows expanding to $594 million.</p><p><em><strong>Related: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/crypto-bull-cycle-threatened-by-us-recession-circular-economy\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/crypto-bull-cycle-threatened-by-us-recession-circular-economy\"><em><strong>Crypto
    market&rsquo;s biggest risks in 2025: US recession, circular crypto economy</strong></em></a></p><p>ProShares
    is the only tracked major issuer that still has $2 million of inflows MTD. ProShares
    is also one of three major issuers that managed to maintain inflows YTD by March
    14, including firms such as BlackRock and ARK Invest.</p><p>Additionally, Binance
    saw almost all its assets under management wiped out by a seed investor exit,
    leaving just $15 million left, Butterfill noted.</p><p><em><strong>Magazine: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/xrp-analyst-price-sbf-parents-trump-pardon-kraken-staking-hodlers-digest/\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/magazine/xrp-analyst-price-sbf-parents-trump-pardon-kraken-staking-hodlers-digest/\"><em><strong>XRP
    to $4 next? SBF&rsquo;s parents seek Trump pardon, and more: Hodler&rsquo;s Digest,

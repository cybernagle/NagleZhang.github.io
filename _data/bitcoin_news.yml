- title: " Bitcoin nears $100K as Trump set to reveal trade deal with UK "
  url: https://cointelegraph.com/news/bitcoin-price-100k-donald-trump-uk-trade-deal-looms?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoiners expect Bitcoin to soon break past $100,000 and potentially
    hit a new all-time high as US President Donald Trump is set to announce a trade
    deal with the UK.Trump said in a May 7 Truth Social post that a “major trade deal”
    with a “big, and highly respected, country” would be announced on May 8, which
    The New York Times reported would be the UK, citing three people familiar with
    the plans.Bitcoin inches toward $100,000When Trump published his post, Bitcoin
    (BTC) was trading at around $97,759 and has since crept up closer to the psychological
    $100,000 price level to trade at $99,140 at the time of publication, according
    to CoinMarketCap data.Bitcoin is trading at $99,140 at the time of publication.
    Source: CoinMarketCapSeveral Bitcoiners and analysts are crediting the rally toward
    $100,000 to speculation surrounding the trade deal.Australian crypto exchange
    BTC Markets’ head of finance, Charlie Sherry, told Cointelegraph that “as everyone
    else was looking down and calling for lower,” Bitcoin’s price did the opposite.“As
    is often the case in markets, just when consensus leans heavily bearish, price
    bottoms form and new market structures start to emerge.”Sherry said it is possible
    that the trade deal is already getting priced into Bitcoin.“While we may see psychological
    resistance at the $100k mark, it seems inevitable Bitcoin puts another zero on
    the board,” Sherry added.FOMO21 co-founder Neil Jacobs said on X that the Bitcoin
    rally was primarily due to Trump’s announcement. Crypto entrepreneur Anthony Pompliano

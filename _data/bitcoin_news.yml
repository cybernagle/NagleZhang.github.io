- title: " First Trust launches Bitcoin strategy ETFs "
  url: https://cointelegraph.com/news/first-trust-launches-bitcoin-strategy-etfs?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "First Trust Advisors has launched two Bitcoin (BTC) strategy exchange-traded
    funds (ETFs) designed to provide investors with Bitcoin exposure while capping
    losses and earning yield, the asset manager said. The move comes amid an outpouring
    of funds seeking to enhance Bitcoin’s appeal to traditional investors by offering
    tailored exposure to the cryptocurrency’s performance.The FT Vest Bitcoin Strategy
    Floor15 ETF (BFAP) is designed to track Bitcoin’s performance up to a capped upside
    while limiting drawdown risk to approximately 15%, First Trust said in an announcement.“Over
    the past few years, investors have shown a remarkably strong appetite for bitcoin-linked
    ETFs, but the potential for sharp drawdowns has kept many on the sidelines,” Ryan
    Issakainen, an ETF strategist at First Trust, said in a statement.First Trust
    launched two new Bitcoin strategy funds. Source: First TrustThe FT Vest Bitcoin
    Strategy & Target Income ETF (DFII) is an actively managed fund aiming to offer
    partial Bitcoin exposure while generating a yield that beats short-dated US Treasurys
    by at least 15%, according to the asset manager. The DFII fund “will seek to take
    advantage of bitcoin’s high volatility to generate income by selling call options,”
    Issakainen said. The BFAP fund also uses financial derivatives to hedge downside
    risk. Options are contracts granting the right to buy or sell — “call” or “put,”
    in trader parlance — an underlying asset at a certain price. Related: Trump-linked
    Strive files for ‘Bitcoin Bond’ ETFStructured Bitcoin fundsLaunched in January
    2024, Bitcoin ETFs emerged as one of last year’s hottest investment products. As
    of April 4, spot BTC ETFs collectively manage approximately $93 billion in assets,
    according to data from Bitbo. Bitcoin ETFs saw outflows after US President Trump
    announced tariffs. Source: Farside InvestorsOther types of ETFs designed to offer
    tailored exposure to Bitcoin’s performance are also gaining popularity. On April
    2, Grayscale — a cryptocurrency-focused asset manager — launched two Bitcoin strategy
    ETFs. Like First Trust’s ETFs, they use financial derivatives to optimize for
    downside risk management and income generation. In March, asset manager Bitwise
    launched an ETF holding stocks of companies with large Bitcoin treasuries. Spot
    BTC ETFs saw nearly $100 million in outflows on April 3 amid the heightened market
    volatility following US President Donald Trump’s tariff announcement of sweeping
    tariffs on April 2. Magazine: Bitcoin ATH sooner than expected? XRP may drop 40%,
    and more: Hodler’s Digest, March 23 – 29\n\n            "

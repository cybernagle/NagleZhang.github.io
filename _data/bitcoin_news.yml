- title: " Crusoe to sell Bitcoin mining business to NYDIG to focus on AI "
  url: https://cointelegraph.com/news/crusoe-to-sell-bitcoin-mining-business-nydig-to-focus-on-ai?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Crusoe Energy, a company that captures waste gas from oil to power high-performance
    compute, is selling its Bitcoin mining business to New York Digital Investment
    Group (NYDIG) to focus on artificial intelligence. In a March 25 announcement,
    Crusoe said it plans to sell its Bitcoin (BTC) mining operation,  including its
    digital flare mitigation business, to NYDIG, subject to regulatory approvals and
    other consents. The deal includes Crusoe’s 270 megawatts of power generation technology
    from more than 425 modular data centers across the United States and Argentina,
    along with 135 Crusoe employees who will join NYDIG, as no roles will be eliminated
    as a result of the transaction. Crusoe was founded in 2018 and pioneered technology
    that captures waste gas created during oil extraction and refinement that would
    be normally burned off in a process called gas flaring in order to power Bitcoin
    miners.Photo of gas flaring in action. Source: Crusoe EnergyIt converts the gas
    or “stranded energy” into electricity used to power the high-performance compute
    required for Bitcoin mining and AI data centers. Some reports suggest that Crusoe’s
    Bitcoin mining operation accounts for 1% of the world’s Bitcoin mining. Crusoe’s
    AI expansion plansHowever, Crusoe says it now wants to focus its tech on building
    out AI infrastructure. “The AI business — it’s become the majority of our revenue,”
    Cully Cavness, the co-founder, president and chief operating officer of Crusoe,
    told CNBC. The company recently expanded its AI data center in Abilene, Texas,
    to 1.2 gigawatts around the same time it announced a joint venture with investment
    firm Engine No. 1 to develop large-scale data center campuses across the US to
    build out AI capabilities.Source: Matthew SigelLast December, it closed $600 million
    in a Series D round at a $2.8 billion valuation to power AI. “We see a huge opportunity
    in front of us, and we have a big advantage and a big head start with what we’ve
    already announced — and more coming soon,” added Cavness. Related: Tokenized US
    gold could ultimately benefit Bitcoin: NYDIGNYDIG said that the acquisition of
    Crusoe’s Bitcoin mining business will help expand its role in supporting Bitcoin’s
    proof-of-work security. NYDIG founder and executive chairman Ross Stevens said
    that “it is critically important to keep the Bitcoin network secure, and at the
    lowest possible cost,” claiming that fiat currencies are “collapsing against Bitcoin
    around the world.” Magazine: Ex-Alameda hire on ‘pressure’ to not blow up Backpack
    exchange: Armani Ferrante, X Hall of Flame\n\n            "

    the $0.26 resistance to signal the resumption of the recovery. There is minor
    resistance at $0.30, but it is likely to be crossed. The pair may then ascend
    to $0.35.Cardano price predictionCardano (ADA) has broken below the neckline of
    the inverted head-and-shoulders pattern, indicating that the bulls are losing
    their grip.ADA/USDT daily chart. Source: Cointelegraph/TradingViewThe next support
    is at the 50-day SMA ($0.68). If the price turns up from the 50-day SMA, the bulls

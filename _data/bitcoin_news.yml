- title: " GameStop finishes $1.5B raise to add Bitcoin to its balance sheet "
  url: https://cointelegraph.com/news/game-stop-finishes-debt-offering-raise-to-buy-bitcoin?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Video game retailer GameStop Corporation (GME) has finished a convertible
    debt offering that raised $1.5 billion, with some proceeds earmarked for buying
    Bitcoin.The offering was initially set to raise at least $1.3 billion, but purchasers
    opted for an additional $200 million aggregate principal amount of notes, GameStop
    said in an April 1 filing with the Securities and Exchange Commission.\"The company
    expects to use the net proceeds from the offering for general corporate purposes,
    including the acquisition of Bitcoin in a manner consistent with the Company's
    Investment Policy,\" GameStop added.The convertible notes are debt that can later
    be converted into equity and are scheduled to mature on April 1, 2030, unless
    earlier converted, redeemed or repurchased.The conversion rate for the notes will
    initially be 33 shares of Common Stock per $1,000 principal amount of notes, according
    to the filing. GameStop shares didn’t see a significant move following the close
    of the convertible debt offering. GME closed the April 1 trading day up 1.34%
    at $22.61 and only saw an extra 0.5% bump after the bell, Google Finance data
    shows.GameStop’s share price barely moved after sharing it closed the convertible
    debt offering. Source: Google FinancePositive shareholder sentiment saw the stock
    jump nearly 12% to $28.36 on March 26, the day after GameStop announced its Bitcoin
    (BTC) plan, but its fortunes reversed the next day, with GME shares dropping nearly
    24% to $21.68.Analysts at the time suggested the chilly reception reflected shareholders'
    fear of GameStop's deeper problems with its business model. GameStop joins growing
    Bitcoin move On March 25, GameStop confirmed that it had received board approval
    to invest in Bitcoin and US-dollar-pegged stablecoins using the notes and its
    cash reserves. Those reserves stood at $4.77 billion as of Feb. 1, compared with
    $921.7 million a year earlier, according to its 2024 fourth-quarter financial
    statements. GameStop is a relative latecomer among public companies creating Bitcoin
    treasuries. A slew of others have already added Bitcoin to their balance sheets
    in a playbook popularized by Micheal Saylor’s Strategy.Related: Metaplanet adds
    $67M in Bitcoin following 10-to-1 stock splitThe video game retailer previously
    made forays into the crypto space with a crypto wallet for its users, which it
    eventually shut down in November 2023 due to regulatory uncertainty.GameStop is
    also considered the first example of meme stock success after a short squeeze
    in 2021 that sent the stock surging over 1,000% in a month as traders flipped
    the table on hedge funds that had been making money shorting on the company.Magazine:
    SEC’s U-turn on crypto leaves key questions unanswered\n\n            "

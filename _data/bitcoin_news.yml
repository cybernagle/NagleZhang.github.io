- title: " Coinbase to launch yield-bearing Bitcoin fund for institutions "
  url: https://cointelegraph.com/news/coinbase-to-launch-yield-bearing-bitcoin-fund-for-institutions?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Coinbase, the world’s third-largest cryptocurrency exchange by volume,
    is launching the Coinbase Bitcoin Yield Fund on May 1, aiming to offer Bitcoin
    (BTC) exposure for institutional investors outside the US.The fund targets an
    annual net return of 4% to 8% on Bitcoin holdings, according to an April 28 blog
    post by Coinbase.“To address the growing institutional demand for bitcoin yield,
    Coinbase Asset Management is excited to introduce the Coinbase Bitcoin Yield Fund
    (CBYF),” the company wrote.The fund is backed by multiple investors, including
    Aspen Digital, a digital asset manager based in Abu Dhabi and regulated by the
    Financial Services Regulatory Authority.  Coinbase introduces a Bitcoin yield-bearing
    fund. Source: CoinbaseRelated: Michael Saylor hints at Bitcoin purchase as whales
    stack aggressivelyThe yield will be generated through a cash-and-carry strategy,
    through the difference between spot Bitcoin prices and derivatives.Unlike Ether
    (ETH) and Solana (SOL), Bitcoin holders can’t generate passive income through
    staking — a gap the fund is aiming to fill, according to the announcement:“Bitcoin
    yield funds have emerged to address this limitation, but these funds generally
    require institutional allocators to take on significant investment and operational
    risk.”The new fund seeks to lower the investment and operational risks typically
    associated with Bitcoin yield products, which Coinbase says will better align
    with the risk appetite of institutional investors.Related: Stacks Asia expands
    Bitcoin initiatives with Abu Dhabi partnershipBitcoin momentum mainly driven by
    institutional interestCoinbase cited growing institutional crypto adoption as
    the reason behind the launch of the funds, which may have been the reason behind
    Bitcoin’s significant price recovery over the past week.Bitcoin rose by more than
    9% in the week leading up to April 28, bolstered by exchange-traded fund (ETF)
    inflows, which recorded their second-highest week of inflows at over $3 billion,
    Farside Investors data shows.Bitcoin ETF Flow, USD, million. Source: Farside InvestorsBitcoin’s
    recovery to $94,000 was mainly supported by growing “ETF inflows and corporate
    buying,” amid lagging retail interest, Ryan Lee, chief analyst at Bitget Research,
    told Cointelegraph, adding:“Retail interest may surge if Bitcoin breaks $100,000,
    fueled by media hype and FOMO. Monitor the $94,000–$95,000 resistance for potential
    retail re-engagement.”On April 21, BitMEX co-founder Arthur Hayes predicted that
    this might be the “last chance” to buy Bitcoin below $100,000, as the incoming
    US Treasury buybacks may signal the next significant catalyst for Bitcoin price.Magazine:
    Bitcoin’s odds of June highs, SOL’s $485M outflows, and more: Hodler’s Digest,
    March 2 – 8\n\n            "

- title: " Here’s what happened in crypto today "
  url: https://cointelegraph.com/news/what-happened-in-crypto-today?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Today in crypto, Paul Atkins has been officially sworn in as SEC chief,
    taking over for acting chair Mark Uyeda. New filings reveal crypto companies among
    donors to US President Donald Trump's inauguration and the Ethereum Foundation
    is entering a new phase as Vitalik Buterin steps back to focus on research.Paul
    Atkins, nominated by Trump, sworn in as SEC chairPaul Atkins has officially been
    sworn in as the 34th chairman of the US Securities and Exchange Commission.The
    April 21 announcement comes nearly two weeks after Atkins’ position was confirmed
    by the US Senate in a 52-44 vote on April 9.Source: US House Committee on Financial
    Services Republicans“I am honored by the trust and confidence President Trump
    and the Senate have placed in me to lead the SEC,” said Atkins, who served as
    an SEC commissioner between 2002 and 2008.Atkins is widely expected to lead a
    more crypto-friendly SEC than former chair Gary Gensler under the Biden administration.Consensys,
    Solana, Uniswap CEO donated to Trump's $239M inauguration fundNew filings from
    the Federal Election Commission (FEC) reveal that several cryptocurrency firms
    and their executives made significant contributions to US President Donald Trump’s
    inauguration fund after the results of the 2024 election. According to FEC filings
    made public on April 20 by the Trump-Vance Inaugural Committee, Uniswap CEO Hayden
    Adams donated more than $245,000, Solana Labs donated $1 million, and software
    firm Consensys sent $100,000 in January to support the then-president-elect’s
    inauguration. Many major crypto firms had previously announced their support of
    Trump through donations to the inaugural fund, including Coinbase, Ripple Labs,
    Kraken, Ondo Finance, and Robinhood.Altogether, the fund reported more than $239
    million in net donations between Nov. 15 and April 20 from companies and individuals.
    These included $1 million from McDonald’s, $1 million from Meta, $1 million from
    Apple CEO Tim Cook, $1 million from OpenAI CEO Sam Altman, and various contributions
    from Delta Air Lines, ExxonMobil, FedEx, Nvidia, PayPal, Target, and Coca-Cola. Jan.
    9 contribution from Uniswap CEO Hayden Adams to Trump-Vance inauguration fund.
    Source: FECSince Trump took office on Jan. 20 and appointed Mark Uyeda as acting
    chair of the US Securities and Exchange Commission (SEC), the agency has dropped
    multiple investigations and enforcement actions against crypto firms, including
    those that donated to the president’s 2024 campaign or inauguration fund. In February,
    Uniswap reported that the SEC had dropped its probe into the firm, and Consensys
    founder Joseph Lubin said the agency had agreed to end a separate lawsuit. Ethereum
    Foundation shifts focus to user experience, layer-1 scalingThe Ethereum Foundation,
    the nonprofit organization developing the Ethereum ecosystem, is shifting its
    focus to user experience and layer-1 scaling challenges following its March leadership
    reshuffle. On April 21, the Ethereum Foundation co-executive director Tomasz Stańczak
    shared an X post detailing how the organization has changed since its change in
    leadership structure.Stańczak said the change aims to give Ethereum co-founder
    Vitalik Buterin more time for research and exploration rather than dealing with
    day-to-day tasks and crisis management.“Each time Vitalik shares insights or communicates
    a direction, he accelerates major long‑term breakthroughs,” he wrote.Stańczak
    added that Buterin’s recent posts had advanced promising avenues and helped realign
    the community around the organization’s core values.On April 20, Buterin proposed
    a change in the Ethereum Virtual Machine’s (EVM) contract language to improve
    the efficiency and speed of the blockchain’s execution layer. Stańczak said that
    while Buterin’s proposals will “always carry weight,” they are supposed to start
    conversations and encourage progress in different research areas. The executive
    said the community can either refine or reject the ideas. \n\n            "

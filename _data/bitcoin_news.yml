- title: " Satoshi Nakamoto turns 50 as Bitcoin becomes US reserve asset "
  url: https://cointelegraph.com/news/satoshi-nakamoto-50-bitcoin-becomes-us-reserve-asset?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Satoshi Nakamoto, the pseudonymous creator of Bitcoin, marks their 50th
    birthday amid a year of rising institutional and geopolitical adoption of the
    world’s first cryptocurrency.The identity of Nakamoto remains one of the biggest
    mysteries in crypto, with speculation ranging from cryptographers like Adam Back
    and Nick Szabo to broader theories involving government intelligence agencies.While
    Nakamoto’s identity remains anonymous, the Bitcoin (BTC) creator is believed to
    have turned 50 on April 5 based on details shared in the past. According to archived
    data from his P2P Foundation profile, Nakamoto once claimed to be a 37-year-old
    man living in Japan and listed his birthdate as April 5, 1975.Source: Web.archive.orgNakamoto’s
    anonymity has played a vital role in maintaining the decentralized nature of the
    Bitcoin network, which has no central authority or leadership.The Bitcoin wallet
    associated with Nakamoto, which holds over 1 million BTC, has laid dormant for
    more than 16 years despite BTC rising from $0 to an all-time high above $109,000
    in January.Satoshi Nakamoto statue in Lugano, Switzerland. Source: CointelegraphNakamoto’s
    50th birthday comes nearly a month after US President Donald Trump signed an executive
    order creating a Strategic Bitcoin Reserve and a Digital Asset Stockpile, marking
    the first major step toward integrating Bitcoin into the US financial system.Related:
    Bitcoin at 16: From experiment to trillion-dollar assetNakamoto’s legacy: A “cornerstone
    of economic sovereignty”“At 50, Nakamoto’s legacy is no longer just code; it’s
    a cornerstone of economic sovereignty,” according to Anndy Lian, author and intergovernmental
    blockchain expert.“Bitcoin’s reserve status signals trust in its scarcity and
    resilience,” Lian told Cointelegraph, adding: “What’s fascinating is the timing.
    Fifty feels symbolic — half a century of life, mirrored by Bitcoin’s journey from
    a white paper to a trillion-dollar asset. Nakamoto’s vision of trustless, peer-to-peer
    money has outgrown its cypherpunk roots, entering the halls of power.”However,
    lingering questions about Nakamoto remain unanswered, including whether they still
    hold the keys to their wallet, which is “a fortune now tied to US policy,” Lian
    said.Related: Bitcoin’s next catalyst: End of $36T US debt ceiling suspensionIs
    Satoshi Nakamoto wealthier than Bill Gates?In February, Arkham Intelligence published
    findings that attribute 1.096 million BTC — then valued at more than $108 billion
    — to Nakamoto. That would place him above Microsoft co-founder Bill Gates on the
    global wealth rankings, according to data shared by Coinbase director Conor Grogan.Satoshi’s
    new addresses. Source: Conor GroganIf accurate, this would make Nakamoto the world’s
    16th richest person.Despite the growing interest in Nakamoto’s identity and holdings,
    his early decision to remain anonymous and inactive has helped preserve Bitcoin’s
    decentralized ethos — a principle that continues to define the cryptocurrency
    to this day.Magazine: 10 crypto theories that missed as badly as ‘Peter Todd is
    Satoshi’\n\n            "

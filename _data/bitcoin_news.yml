- title: " Wintermute opens New York office, citing improved US crypto rules "
  url: https://cointelegraph.com/news/wintermute-new-york-office-improved-us-crypto-regulations?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Wintermute, a London-based algorithmic crypto trading and market-making
    firm, has opened an office in New York as part of its expansion into the US.Wintermute
    announced the opening of its New York office on May 15, citing improved regulatory
    conditions in the world’s largest economy.“As the US takes a friendlier stance
    on digital assets and institutional adoption accelerates, we moved quickly to
    establish roots in New York City,” the company wrote in a May 15 X post, adding
    that the local presence will help them in “contributing to the future regulatory
    framework.”Source: Wintermute“We’re eager to continue our growth and play an integral
    role in the U.S. market,” according to Evgeny Gaevoy, CEO of Wintermute. “As a
    neutral player with deep expertise in all areas of digital assets, we believe
    we are well-positioned to lend our expertise on Capitol Hill.”As part of the firm’s
    expansion, Wintermute has appointed Ron Hammond as its new head of policy and
    advocacy, who brings “ten years of experience shaping crypto policy on Capitol
    Hill,” the company also announced. Hammond was previously the senior director
    of government relations and institutional engagement at the Blockchain Association
    and the policy lead for US Representative Warren Davidson. Hammond also authored
    the Token Taxonomy Act of 2021, the first bipartisan-supported crypto regulatory
    bill in the US.Related: Coinbase faces $400M bill after insider phishing attackIncreasingly
    more crypto firms have expanded into the US since President Donald Trump took
    office on Jan. 20 after winning the 2024 presidential election.During his campaign,
    Trump signaled that his administration intends to make crypto policy a national
    priority, bolstering expectations for more innovation-friendly crypto regulations
    for the next four years.At least eight large crypto firms have announced their
    expansion in the US so far this year, banking on growing regulatory clarity. These
    include Binance.US, eToro, OKX exchange, Nexo, Circle, Crypto.com and a16z, Cointelegraph
    reported on May 11.Related: Stablecoins seen as ideal fit for real-time collateral
    managementWintermute met with SEC Crypto Task ForceWintermute said it aims to
    contribute to the emerging regulatory framework in the US.“We’ve already met with
    the SEC Crypto Task Force and will continue offering technical input and contributing
    to key legislative efforts,” the company said, adding that these are “essential
    for continued institutional participation.” Meanwhile, crypto industry participants
    await progress on the Stablecoin Transparency and Accountability for a Better
    Ledger Economy (STABLE) Act.The STABLE Act passed the House Financial Services
    Committee in a 32–17 vote on April 2 and currently awaits scheduling for debate
    and a floor vote in the House of Representatives.However, a second piece of key
    stablecoin legislation, the Guiding and Establishing National Innovation for US
    Stablecoins, or GENIUS Act, initially failed to garner enough support from Democrats
    on May 8, prompting at least 60 top crypto founders to gather in Washington, DC,
    to show support.Despite the stalled stablecoin legislation, “momentum toward regulatory
    clarity remains active in both chambers,” Nexo dispatch analyst Iliya Kalchev
    told Cointelegraph.Magazine: Bitcoin to $1M ‘by 2029,’ CIA tips its hat to Bitcoin:
    Hodler’s Digest, April 27 – May 3\n\n            "

- title: " Brazilian lawmaker introduces bill to regulate Bitcoin salaries "
  url: https://cointelegraph.com/news/brazil-bill-bitcoin-salary-regulation?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWEzNzYtOWEyYi03MWYyLWE3NTUtYTMyNjVhMDhlNTRk.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWEzNzYtOWEyYi03MWYyLWE3NTUtYTMyNjVhMDhlNTRk.jpg\"
    alt=\"Brazilian lawmaker introduces bill to regulate Bitcoin salaries\"></p><p>Brazilian
    lawmakers are considering new legislation that would officially authorize employers
    to pay salaries to employees using cryptocurrencies like Bitcoin.<p>Federal deputy
    Luiz Philippe de Orleans e Bragan&ccedil;a has introduced a bill proposing regulation
    of crypto payments for wages, remunerations and labor benefits.</p><p><a data-ct-non-breakable=\"null\"
    href=\"https://www.camara.leg.br/proposicoesWeb/fichadetramitacao?idProposicao=2486744\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Filed</a>&nbsp;on March
    12, the bill PL 957/2025 legalizes voluntary and partial salary payments in cryptocurrencies
    like Bitcoin (<a data-ct-non-breakable=\"null\" href=\"http://btc\" rel=\"null\"
    target=\"null\" text=\"null\" title=\"null\">BTC</a>) while also requiring employers
    to proceed with a part of the pay in the national currency, the Brazilian real.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a389-0380-7570-9c9b-757f6bdfa591\"
    title=\"\" alt=\"Brazilian lawmaker introduces bill to regulate Bitcoin salaries\"><figcaption
    style=\"text-align: center;\"><p><em>Preview of the draft bill PL 957/2025 by
    Luiz Philippe de Orleans e Bragan&ccedil;a (translated via Google). Source: Camara.leg.br</em></p></figcaption></figure><p>Orleans-Braganza,
    a descendant of Brazil&rsquo;s former royal family, is <a data-ct-non-breakable=\"null\"
    href=\"https://lpbraganca.com.br/conheca-minha-trajetoria/\" rel=\"nofollow noopener\"
    target=\"_blank\" text=\"null\" title=\"https://lpbraganca.com.br/conheca-minha-trajetoria/\">serving</a>
    his second term as a federal deputy for S&atilde;o Paulo and <a data-ct-non-breakable=\"null\"
    href=\"https://www.afr.com/companies/media-and-marketing/meet-the-brazilian-prince-backing-trump-s-media-venture-20211024-p592md\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://www.afr.com/companies/media-and-marketing/meet-the-brazilian-prince-backing-trump-s-media-venture-20211024-p592md\">supports</a>
    Truth Social, the social media platform owned by US President Donald Trump.</p><h2>Bitcoin
    may only account for 50% of a salary payout</h2><p>In the proposed legislation,
    Orleans-Braganza asked lawmakers to prohibit employees from paying full salaries
    in crypto, capping such payments at 50%.</p><p>&ldquo;The payment of salaries
    exclusively in virtual assets is prohibited,&rdquo; except for cases involving
    expatriate employees or foreign workers, under the terms of regulations by the
    Central Bank of Brazil.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a389-06dd-7059-9383-9da370c7e2c4\"
    title=\"\" alt=\"Brazilian lawmaker introduces bill to regulate Bitcoin salaries\"><figcaption
    style=\"text-align: center;\"><p><em>An excerpt from the proposed bill PL 957/2025
    (translated via Google). Source: Camara.leg.br</em></p></figcaption></figure><p>The
    bill also allows full crypto payments by &ldquo;independent service providers,&rdquo;
    subject to certain contractual provisions.</p><p>Otherwise, the share of the payment
    in the Brazilian real may not be less than 50% of the employee&rsquo;s total salary
    payout.&nbsp;</p><p>The conversion of the amount paid into crypto must follow
    the exchange rate officially established by an institution authorized by the Central
    Bank of Brazil.</p><h2>Reasons behind the bill</h2><p>According to Orleans-Braganza,
    the introduction of crypto payment salaries in Brazil has the potential to boost
    the financial technology sector and attract crypto investment in the local economy.</p><p>Additionally,
    the measure &ldquo;reinforces the principle of autonomy of will, allowing workers
    and employers greater freedom to decide on their contractual relations, without
    prejudice to fundamental guarantees,&rdquo; the bill reads.</p><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/brazil-bill-bitcoin-salary-regulation\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Brazil fintech
    unicorn Meliuz adopts Bitcoin treasury strategy</strong></em></a></p><p>The proposal
    aims to follow successful crypto payment implementation in many global jurisdictions,
    including <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/swiss-canton-of-zug-starts-accepting-tax-payments-in-cryptocurrency\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Switzerland</a>, <a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/japanese-e-commerce-giant-mercari-allow-bitcoin-payments-june\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Japan</a> and <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/firm-in-portugal-to-accept-bitcoin-for-electricity-bills\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Portugal</a>, Orleans-Braganza
    mentioned, adding:</p><blockquote>&ldquo;In Japan, for example, legislation requires
    individual agreement between employer and employee, as well as specific guidelines
    for the conversion of the amounts paid. In Portugal, regulation brought flexibility
    and drove the adoption of virtual assets in the financial sector.&rdquo;</blockquote><p>While
    some global jurisdictions allow Bitcoin use in payments, many countries &mdash;
    like <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/turkey-regulator-cmb-two-docs-crypto-regulation\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Turkey</a> and <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/russia-bitcoin-oil-trade-crypto-payments\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Russia</a> &mdash; prohibit
    citizens from using any cryptocurrency as a means of payment.</p><p>El Salvador
    &mdash; the first country to <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/september-7-is-bitcoin-day-in-el-salvador-as-btc-becomes-legal-tender\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">adopt Bitcoin as legal
    tender</a> in 2021 &mdash; allows voluntary payments in crypto but <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/el-salvador-bitcoin-status-btc-law-amendment\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">no longer allows tax
    payments</a> and any government fees in crypto following a deal with the International
    Monetary Fund.</p><p>Separately from the crypto salary news in Brazil, the Brazilian
    government has recently <a data-ct-non-breakable=\"null\" href=\"https://valor.globo.com/financas/criptomoedas/noticia/2025/03/12/brasil-quer-propor-cripto-para-comrcio-dos-brics.ghtml\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">pushed</a> a new initiative
    to facilitate <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/russia-rejects-trump-brics-tariff-threat-currency\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BRICS transactions</a>
    using cryptocurrency and blockchain technology, according to a March 12 report
    by Valor International.</p><p><em><strong>Magazine: </strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/magazine/ether-price-bottom-sec-delays-multiple-crypto-etfs-ftx-hodlers-digest/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>ETH may
    bottom at $1.6K, SEC delays multiple crypto ETFs, and more: Hodler&rsquo;s Digest,
    March 9 &ndash; 15</strong></em></a></p><template data-name=\"subscription_form\"
    data-type=\"markets_outlook\" label=\"Subscription Form: Markets Outlook\"></template></p>\n</p>\n
    \           "

- title: " Here’s what happened in crypto today "
  url: https://cointelegraph.com/news/what-happened-in-crypto-today?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Today in crypto, tokenized real estate could top $4 trillion by 2035,
    according to a new Deloitte report, US Senator Cynthia Lummis says the Federal
    Reserve’s latest crypto decision is “just lip service,” and US Securities and
    Exchange Commission (SEC) chair Paul Atkins speaks at the agency’s roundtable.Deloitte
    predicts $4 trillion tokenized real estate on blockchain by 2035Over $4 trillion
    worth of real estate could be tokenized on blockchain networks during the next
    decade, potentially offering investors greater access to property ownership opportunities,
    according to a new report.The Deloitte Center for Financial Services predicts
    that over $4 trillion worth of real estate may be tokenized by 2035, up from less
    than $300 billion in 2024. The report, published April 24, estimates a compound
    annual growth rate (CAGR) of more than 27%.The $4 trillion of tokenized property
    is predicted to stem from the benefits of blockchain-based assets, as well as
    a structural shift across real estate and property ownership.Global tokenized
    real estate value, growth predictions. Source: Deloitte“Real estate itself is
    undergoing transformation. Post-pandemic work-from-home trends, climate risk,
    and digitization have reshaped property fundamentals,” according to Chris Yin,
    co-founder of Plume Network, a blockchain built for real-world assets (RWAs).“Office
    buildings are being repurposed into AI data centers, logistics hubs and energy-efficient
    residential communities,” Yin told Cointelegraph.“Investors want targeted access
    to these modern use cases, and tokenization enables programmable, customizable
    exposure to such evolving asset profiles,” he said.Crypto banking rule withdrawal
    by Fed “not real progress” — Senator LummisUnited States Senator Cynthia Lummis
    says the crypto industry may be celebrating too soon over the US Federal Reserve
    softening its crypto guidance for banks.“The Fed withdrawing crypto guidance is
    just noise, not real progress,” Lummis said in an April 25 X post. Lummis called
    the Fed’s April 24 announcement — withdrawing its 2022 supervisory letter that
    had discouraged banks from engaging with crypto and stablecoin activities — “just
    lip service.”Lummis, a pro-crypto advocate known for introducing the Bitcoin Strategic
    Reserve Bill in July 2024, pointed out several flaws in the Fed’s announcement,
    even as Strategy founder Michael Saylor and crypto entrepreneur Anthony Pompliano
    suggested it was a step forward for banks and crypto.She argued that the Fed continues to
    “illegally flout the law on master accounts” and still relies on reputational
    risk in its bank supervision practices. Lummis also highlighted the Fed’s policy
    statement in Section 9(13), which hasn’t been withdrawn, stating that Bitcoin
    and digital assets are considered “unsafe and unsound.”SEC chair suggests “huge
    benefits” in agency’s third crypto roundtableIn one of his first appearances as
    the recently sworn-in chair of the US Securities and Exchange Commission, Paul
    Atkins delivered remarks to the agency’s third roundtable discussion of crypto
    regulation. In the “Know Your Custodian” roundtable event on April 25, Atkins
    said he expected “huge benefits” from blockchain technology through efficiency,
    risk mitigation, transparency, and cutting costs. He reiterated that among his
    goals at the SEC would be to facilitate “clear regulatory rules of the road” for
    digital assets, hinting that the agency under former chair Gary Gensler had contributed
    to market and regulatory uncertainty. “I look forward to engaging with market
    participants and working with colleagues in President Trump’s administration and
    Congress to establish a rational fit-for-purpose framework for crypto assets,”
    said Atkins.SEC chair Paul Atkins addressing the April 25 crypto roundtable. Source: SECSome
    critics of US President Donald Trump see Atkins’ nomination to lead the SEC as
    a nod to the crypto industry, acting on campaign promises to remove Gensler —
    the former chair resigned the day Trump took office — and cut back on regulation.
    Democratic lawmakers on the Senate Banking Committee questioned Atkins on his
    ties to the industry, potentially presenting conflicts of interest in his role
    regulating crypto.\n\n            "

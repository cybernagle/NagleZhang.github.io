- title: " Bitcoin trader issues ‘overbought’ warning as BTC price eyes $84K "
  url: https://cointelegraph.com/news/bitcoin-trader-issues-overbought-warning-btc-price-84k?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin (BTC) ticked higher at the March 31 Wall Street open as traders
    stayed risk-averse on the short-term BTC price outlook.BTC/USD 1-hour chart. Source:
    Cointelegraph/TradingViewBitcoin RSI teases bearish continuationData from Cointelegraph
    Markets Pro and TradingView showed local highs of $83,914 on Bitstamp, with BTC/USD
    up 1.5% on the day.With hours to go until the quarterly candle close, Bitcoin
    saw some much-needed relief, even as US stocks opened lower.Market momentum remained
    tied to upcoming US trade tariffs set to go live on April 2, with gold also slipping
    after touching fresh all-time highs of $3,128 per ounce.XAU/USD 1-hour chart.
    Source: Cointelegraph/TradingViewCommenting on BTC price action, many market participants
    nonetheless favored caution.“Retesting our 84k area of interest,” popular trader
    Roman wrote in his latest X analysis of the 4-hour BTC/USD chart. Roman referenced
    the relative strength index (RSI) while forecasting a return to levels closer
    to the $80,000 mark.“To me, it looks like we should begin to head lower as we
    have a breakdown and bearish retest on LTF,” he continued. “RSI also retesting
    the 50 area with stoch overbought. HTF still leans bearish as well.”BTC/USD 4-hour
    chart with RSI data. Source: Roman/XPopular trader and analyst Rekt Capital went
    further on RSI signals, revealing a support retest on daily timeframes after a
    key breakout from a multimonth downtrend.“The $BTC RSI is trying to retest its

- title: " Bitcoin &#039;blow-off top&#039; set at $128K with new all-time highs in
    sight "
  url: https://cointelegraph.com/news/bitcoin-blow-off-top-128k-new-all-time-highs-sight?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Key points:Bitcoin tags $108,000 for the first time since the day of its
    current all-time highs in January.Traders and analysts mention support extending
    toward $90,000, but the probability of a retest is fading.Near-term upside targets
    include a “blow-off top” at $128,000.Bitcoin (BTC) spiked to more than $108,000
    on May 21, marking new four-month highs. Where will BTC/USD go next?Crypto traders
    and analysts are lining up their forecasts with BTC price action less than 1.5%
    away from new all-time highs.BTC price support test now “less likely”Bitcoin continues
    to coil below what is now its most significant psychological resistance barrier,

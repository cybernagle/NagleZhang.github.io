    price of $67,556.However, not everyone is bullish in the near term. Several institutional
    investors seem to have trimmed their holdings. CoinShares reported on April 14
    that digital asset exchange-traded products (ETPs) witnessed $795 million in outflows
    last week. The $7.2 billion in outflows since February have reversed nearly all
    year-to-date inflows, now at just $165 million.Daily cryptocurrency market performance.
    Source: Coin360Although Bitcoin seems to have bottomed out in the short term,
    a roaring bull market rally is unlikely to start in a hurry. The tariff headlines

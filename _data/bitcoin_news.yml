- title: " Misleading crypto narratives continue, driven by ‘sensationalist’ sentiment "
  url: https://cointelegraph.com/news/crypto-market-narratives-misleading-sensationalist-sentiment-analysts?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "A crypto analyst says that inaccurate narratives continue to circulate
    in the cryptocurrency market, largely driven by distorted information rather than
    being supported by onchain data.“Beware of misinformation. Despite the data, misleading
    narratives persist,” CryptoQuant contributor “Onchained,” said in a March 22 market
    report.“Such claims often lack onchain validation and are driven by sensationalist
    market sentiment rather than objective analysis,” the analyst said, adding:“Trust
    data, not noise, verify sources and cross-check onchain metrics.”Onchained pointed
    to the recent movements of Bitcoin (BTC) long-term holders (LTH) — those holding
    for over 155 days — as an example of false narratives clashing with real data.The
    analyst pointed out that while some narratives claim Bitcoin long-term holders
    are “capitulating,” the data shows they’re remaining consistent. “The data leaves
    no room for speculation,” Onchained said.The Inactive Supply Shift Index (ISSI)
    — which measures the degree to which long-dormant Bitcoin supply is shifting —
    “shows no meaningful LTH selling pressure, reinforcing a narrative of structural
    demand outpacing supply,” Onchained said.Narratives are always being challengedCrypto
    analytics platform Glassnode recently made a similar observation based on data,
    saying, Long-Term Holder activity remains largely subdued, with a notable decline
    in their sell-side pressure.”Crypto market narratives are constantly changing
    and being challenged. One long-standing crypto narrative under debate is the relevance
    of the 4-year cycle theory, which suggests that Bitcoin’s price follows a predictable
    pattern tied to its halving event every four years.Source: Tomas GreifMN Trading
    Capital founder Michael van de Poppe said in a March 22 X post, “I assume that
    we can erase the entire 4-year cycle theory and that we’re in a longer cycle for
    Altcoins.” Related: Crypto markets will be pressured by trade wars until April:
    AnalystEchoing a similar sentiment, Bitwise Invest chief investment officer Matt
    Hougan recently said that “the traditional four-year cycle is over in crypto”
    due to the recent change in the US government’s stance.“Crypto has moved in four-year
    cycles since its earliest days. But the change in DC introduces a new wave that
    will play out over a decade,” Hougan said.Alongside this, some analysts are even
    debating whether the entire Bitcoin bull market is over.CryptoQuant founder and
    CEO Ki Young Ju said in a March 17 X post, “Bitcoin bull cycle is over, expecting
    6-12 months of bearish or sideways price action.”Ju said all Bitcoin onchain metrics
    indicate a bear market. “With fresh liquidity drying up, new whales are selling
    Bitcoin at lower prices,” Ju said. Magazine: Dummies guide to native rollups:
    L2s as secure as Ethereum itself\n\n            "

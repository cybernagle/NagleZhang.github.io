    below the 20-day EMA ($2.10) on April 15 and reached near the critical support
    at $2 on April 16. XRP/USDT daily chart. Source: Cointelegraph/TradingViewThe
    flattish 20-day EMA and the RSI just below the midpoint suggest a possible range-bound
    action in the near term. The XRP/USDT pair may swing between $2 and the 50-day
    SMA ($2.23) for a while.A break and close above the 50-day SMA could clear the
    path for a rally to the resistance line. This is an important level for the bears
    to defend because a break above it will signal a short-term trend change. On the
    downside, a break and close below $2 could sink the pair to $1.61.BNB price analysisBNB
    (BNB) has been trading inside a triangle, signaling buying near the support line
    and selling close to the downtrend line. BNB/USDT daily chart. Source: Cointelegraph/TradingViewThe
    downsloping moving averages and the RSI just below the midpoint indicate a slight
    edge to the bears. There is support at $566 and then at $550. If the price rebounds
    off the support, the bulls will again try to shove the price above the downtrend
    line. If they can pull it off, the BNB/USDT pair could rally to $644.Sellers are
    likely to have other plans. They will try to pull the price below $550 and retest
    the support line.Solana price analysisSellers successfully defended the 50-day
    SMA ($130) in Solana (SOL) and are trying to pull the price below the $120 support.SOL/USDT
    daily chart. Source: Cointelegraph/TradingViewThe flattish 20-day EMA ($124) and
    the RSI near the midpoint suggest a balance between supply and demand. Buyers
    are expected to defend the $120 to $110 support zone. If the price rebounds off
    the support zone, the bulls will again attempt to drive the SOL/USDT pair above
    the 50-day SMA. If they succeed, the pair could reach $153.Alternatively, if the
    price continues lower and breaks below $110, it indicates that bears remain in
    control. The pair could then tumble to the $95 support.Dogecoin price analysisDogecoin
    (DOGE) has been gradually sliding to the vital support at $0.14, where the buyers
    are expected to step in.DOGE/USDT daily chart. Source: Cointelegraph/TradingViewThe
    positive divergence on the RSI suggests that the bearish momentum could be weakening.
    If the price turns up from the current level or $0.14, the possibility of a break
    above the 50-day SMA ($0.17) increases. The DOGE/USDT pair will complete a double-bottom
    pattern on a break above $0.21, signaling that the downtrend may have ended.Conversely,
    a break and close below $0.14 signals the resumption of the downtrend toward the

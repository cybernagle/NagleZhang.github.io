    the Bitcoin price action has led to the formation of a bull flag pattern on the
    weekly timeframe, a bullish setup that forms after the price consolidates inside
    a down-sloping range.BTC/USD weekly chart. Source: Cointelegraph/TradingViewThe
    bull flag breakout occurred when the price jumped above the upper trendline at

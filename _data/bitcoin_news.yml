    analyst at Nansen.Risk assets may lack direction until the tariff-related concerns
    are resolved, which may happen between April 2 and July, presenting a positive
    market catalyst, added the analyst.BTC/USD, 1-day chart. Source: TradingViewPresident
    Trump’s reciprocal tariff rates are set to take effect on April 2, despite earlier
    comments from Treasury Secretary Scott Bessent that indicated a possible delay
    in their activation.Tether seeks Big Four firm for its first full financial audit:
    ReportStablecoin issuer Tether is reportedly engaging with a Big Four accounting

- title: " &#039;Bitcoin Macro Index&#039; bear signal puts $110K BTC price return
    in doubt "
  url: https://cointelegraph.com/news/bitcoin-macro-index-bear-signal-110k-btc-price-return-doubt?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin (BTC) risks falling into a fresh bear market as a large collection
    of BTC price metrics has produced a “bearish divergence.”In a social media discussion
    on March 27, Bitcoin commentators flagged troubling signals from the Capriole
    Investments’ Bitcoin Macro Index.Bitcoin Macro Index slump “not great,” says creatorAs
    BTC/USD struggles to return to the area around all-time highs, onchain metrics
    are beginning to lose their bull market edge.The Bitcoin Macro Index, created
    by Capriole in 2022, uses machine learning to analyze data from a large number
    of metrics that founder Charles Edwards says “give a strong indication of Bitcoin’s
    relative value throughout historic cycles.”“The model only looks at onchain and
    macro-market data. Uniquely, price data and technical analysis is not considered
    as an input in this model,” he explained in an introduction to the tool at the
    time.Since late 2023, the metric has been printing lower highs while price prints
    higher highs, creating a “bearish divergence.” While common to previous bull markets,
    a potential implication is that BTC/USD has already put in a long-term peak.“Not
    great,” Edwards reacted while reposting a print of the Index uploaded to X by
    another user. “But... when Bitcoin Macro Index turns positive, I won't be fighting
    it.”Capriole Bitcoin Macro Index. Source: @A_Trade_Academy/XBTC price metrics
    struggle to recoverVarious analytics sources have concluded that Bitcoin is suffering
    from macro turbulence this year.Related: Bitcoin price prediction markets bet
    BTC won’t go higher than $138K in 2025In one of its “Quicktake” blog posts this
    week, onchain analytics platform CryptoQuant referenced four onchain metrics currently
    in a state of flux.“All of these metrics suggest that Bitcoin is experiencing
    significant turbulence in the short to mid-term,” contributor Burak Kesmeci said.“However,
    none of them indicate that Bitcoin has reached an overheated or cycle-top level.”Bitcoin
    IFP chart (screenshot). Source: CryptoQuantThe list includes the Market Value
    to Realized Value (MVRV) and Net Unspent Profit/Loss (NUPL), as well as the so-called
    Inter-Exchange Flow Pulse (IFP) metric, which flipped bearish in February.For
    this to change, Kesmeci concluded, IFP should return above its 90-day simple moving
    average (SMA).This article does not contain investment advice or recommendations.
    Every investment and trading move involves risk, and readers should conduct their
    own research when making a decision.\n\n            "

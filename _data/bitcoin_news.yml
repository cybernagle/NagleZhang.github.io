- title: " US recession would be a big catalyst for Bitcoin: BlackRock "
  url: https://cointelegraph.com/news/bitcoin-benefit-us-recession-blackrock-crypto-head?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "BlackRock’s head of digital assets, Robbie Mitchnick, says that Bitcoin
    will most likely thrive in a recessionary macro environment, contrary to what
    some analysts may think. “I don’t know if we’ll have a recession or not, but a
    recession would be a big catalyst for Bitcoin,” Mitchnick said in a March 19 interview
    with Yahoo Finance.Mitchnick said Bitcoin (BTC) is catalyzed by increased fiscal
    spending, deficit accumulation, lower interest rates and monetary stimulus — all
    of which tend to happen in recessions.“And it’s catalyzed to some extent over
    fears of general social disorder,” Mitchnick pointed out. “And that, too, unfortunately,
    is something that can happen in a recession.”\U0001F6A8 LATEST: BlackRock Global
    Head of Digital Assets Robbie Mitchnick says, “If you look at Bitcoin fundamentally
    on a long-term basis, it really seems like an asset that should be uncorrelated
    or even inversely correlated against certain risk factors that exist.” pic.twitter.com/bC0zKqF3xB—
    Cointelegraph (@Cointelegraph) March 19, 2025The BlackRock executive said the
    market is “not particularly well calibrated” for Bitcoin, and many still view
    it as a risk-on asset.Risk-on assets, such as stocks, commodities and high-yield
    bonds, tend to suffer during times of economic crises, but Mitchnick said in September
    that he believed the asset was mislabeled. “But that’s where the opportunity comes
    in for education in a market and asset class that’s still very nascent.”Mitchnick
    said BlackRock has been helping some of its clients see through some of these
    conflicting narratives.He added that some of BlackRock’s more “sophisticated long-term
    Bitcoin accumulator” clients see the market correction as a buying opportunity
    and aren’t bothered by the current economic headwinds.Meanwhile, researchers from
    cryptocurrency exchange Coinbase were less bullish, saying crypto’s positive outlook
    for the first quarter had “clearly been misplaced” by recession fears and the
    recent tariffs imposed.“Fears of a dramatic US economic slowdown or even recession
    have caused sentiment to turn sharply,” Coinbase Institutional said in its monthly
    outlook report on March 17.Related: Crypto market’s biggest risks in 2025: US
    recession, circular crypto economyBlackRock has played a key role in the institutional
    and wealth advisory adoption of Bitcoin through its iShares Bitcoin Trust ETF,
    which holds the most net assets of any Bitcoin investment product at $48.7 billion.Mitchnick
    isn’t worried about the mass net outflows across most spot Bitcoin exchange-traded
    funds of late — pointing out that it has mostly come from hedge funds’ unwinding
    of the spot futures arbitrage trade, not the long-term buy-and-hold investors.Bitcoin
    is currently trading at $86,000, up 3.8% over the last 24 hours.Magazine: Meet
    lawyer Max Burwick — ‘The ambulance chaser of crypto’\n\n            "

- title: " Avalanche stablecoins up 70% to $2.5B, AVAX demand lacks DeFi deployment "
  url: https://cointelegraph.com/news/avalanche-stablecoin-surge-fails-to-boost-avax-price?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Avalanche saw a significant surge in stablecoin supply over the past year,
    but the onchain deployment of this capital points to passive investor behavior,
    which may be limiting demand for the network’s utility token.The stablecoin supply
    on the Avalanche network rose by over 70% over the past year, from $1.5 billion
    in March 2024, to over $2.5 billion as of March 31, 2025, according to Avalanche’s
    X posMarket capitalization of stablecoins on Avalanche. Source: AvalancheStablecoins
    are the main bridge between the fiat and crypto world and increasing stablecoin
    supply is often seen as a signal for incoming buying pressure and growing investor
    appetite.However, Avalanche’s (AVAX) token has been in a downtrend, dropping nearly
    60% over the past year to trade above $19 as of 12:31 pm UTC, despite the $1 billion
    increase in stablecoin supply, Cointelegraph Markets Pro data shows.AVAX/USD,1-year
    chart. Source: Cointelegraph Markets Pro“The apparent contradiction between surging
    stablecoin value on Avalanche and AVAX's significant price decline likely stems
    from how that stablecoin liquidity is being held,” according to Juan Pellicer,
    senior research analyst at IntoTheBlock crypto intelligence platform.Related:
    Bitcoin can hit $250K in 2025 if Fed shifts to QE: Arthur HayesA “substantial
    portion” of these inflows consists of bridged Tether (USDT), the research analyst
    told Cointelegraph, adding:“This seems as inactive treasury holdings rather than
    capital actively deployed within Avalanche's DeFi ecosystem (at least for the

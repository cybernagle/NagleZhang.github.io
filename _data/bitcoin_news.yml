- title: " Bitcoin gets $126K June target as data predicts bull market comeback "
  url: https://cointelegraph.com/news/bitcoin-gets-126k-june-target-data-predicts-bull-market-comeback?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTllODQtZDQyZC03NjkyLWJhZDAtMjBjYTdhYjkxNzcz.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTllODQtZDQyZC03NjkyLWJhZDAtMjBjYTdhYjkxNzcz.jpg\"
    alt=\"Bitcoin gets $126K June target as data predicts bull market comeback\"></p><p>Bitcoin
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>) can hit new
    all-time highs by June this year if historical patterns repeat, network economist
    Timothy Peterson said.<p><a data-ct-non-breakable=\"null\" href=\"https://x.com/nsquaredvalue/status/1900945275880866246\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Data</a> uploaded to
    X on March 15 gives BTC/USD around two-and-a-half months to beat its $109,000
    record.</p><h2>April could spark 50% BTC price upside</h2><p>Bitcoin has declined
    30% after topping out in mid-January. The extent of the drop is characteristic
    of bull market corrections, and Peterson keenly senses the potential for a comeback.</p><p>&ldquo;Bitcoin
    is trading near the low end of its historical seasonal range,&rdquo; he determined
    alongside a chart comparing BTC price cycles.&nbsp;&nbsp;</p><blockquote>&ldquo;Nearly
    all of Bitcoin's annual performance occurs in 2 months: April and October.&nbsp;
    It is entirely possible Bitcoin could reach a new all-time high before June.&rdquo;</blockquote><figure><img
    alt=\"Bitcoin gets $126K June target as data predicts bull market comeback\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01959e79-fa0c-7b03-8b4e-7a845f490b40\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Bitcoin seasonal comparison.
    Source: Timothy Peterson/X</em></p></figcaption></figure><p>Peterson has created
    various Bitcoin price metrics over the years. One of them, Lowest Price Forward,
    has successfully defined levels below which BTC/USD never falls after a crossing
    above them at a certain point.&nbsp;</p><p>After its recovery from multi-year
    lows in March 2020, Lowest Price Forward predicted that BTC price would never
    trade under $10,000 again from September onward.</p><p>Meanwhile, a new likely
    floor level has appeared this year: $69,000, as <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-price-metric-called-2020-bull-run-69k-new-bottom\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-price-metric-called-2020-bull-run-69k-new-bottom\">Cointelegraph
    reported</a>, which has a &ldquo;95% chance&rdquo; of holding.</p><p>Continuing,
    Peterson stipulated a median target of $126,000 with a deadline of June 1.&nbsp;</p><p>Alongside
    a chart showing the performance of $100 in BTC, he also revealed that limp bull
    market performance has always been temporary.</p><p>&ldquo;Bitcoin average time
    below trend = 4 months,&rdquo; he <a data-ct-non-breakable=\"null\" href=\"https://x.com/nsquaredvalue/status/1901026971259228238\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">explained</a>.</p><blockquote>&ldquo;The
    red dotted trend line = $126,000 on June 1.&rdquo;</blockquote><figure><img alt=\"Bitcoin
    gets $126K June target as data predicts bull market comeback\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01959e7a-7ff1-7cfb-b7af-489116f5138d\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Bitcoin growth of
    $100 comparison. Source: Timothy Peterson/X</em></p></figcaption></figure><h2>A
    standard Bitcoin bull market comedown</h2><p>Other popular market commentators
    continue to emphasize that Bitcoin&rsquo;s recent trip to $76,000 is standard
    corrective behavior.</p><p><em><strong>Related: </strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/watch-bitcoin-price-levels-btc-84-k-btc-key-resistance\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Watch these
    Bitcoin price levels as BTC retests key $84K resistance</strong></em></a></p><p>&ldquo;You
    don&rsquo;t have to look at the previous BTC bull runs to understand that corrections
    are a part of the cycle,&rdquo; popular trader and analyst Rekt Capital <a data-ct-non-breakable=\"null\"
    href=\"https://x.com/rektcapital/status/1895886268355219890\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">wrote</a> in part of X analysis of the phenomenon
    at the start of March.</p><p>Rekt Capital counted five of what he called &ldquo;major
    pullbacks&rdquo; in the current cycle alone, going back to the start of 2023.</p><figure><img
    alt=\"Bitcoin gets $126K June target as data predicts bull market comeback\" src=\"https://s3.cointelegraph.com/uploads/2025-03/01959e7b-a934-7370-89d3-0f45db313111\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>BTC/USD 1-week chart.
    Source: Rekt Capital/X</em></p></figcaption></figure><p>Analysts at crypto exchange
    Bitfinex <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-shakeout-not-end-4-year-cycle-analysts\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">told Cointelegraph</a>
    this weekend that the current lows mark a &ldquo;shakeout,&rdquo; rather than
    the end of the current cycle.</p><p class=\"post-content__disclaimer\" type=\"\">This
    article does not contain investment advice or recommendations. Every investment
    and trading move involves risk, and readers should conduct their own research
    when making a decision.</p><template data-name=\"subscription_form\" data-type=\"markets_outlook\"
    label=\"Subscription Form: Markets Outlook\"></template></p>\n</p>\n            "

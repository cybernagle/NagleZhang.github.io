- title: " US crypto rules like &#039;floor is lava&#039; game without lights — Hester
    Peirce "
  url: https://cointelegraph.com/news/united-states-crypto-custody-regulations-floor-lava-hester-peirce-sec?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "SEC Commissioner and head of the crypto task force, Hester Peirce, says
    US financial firms are navigating crypto in a way that’s similar to playing the
    children’s game “the floor is lava,” but in the dark.“It is time that we find
    a way to end this game. We need to turn on the lights and build some walkways
    over the lava pit,” Peirce said at the SEC “Know Your Custodian” roundtable event
    on April 25.The lava is crypto, says PeircePeirce explained that SEC registrants
    are forced to approach crypto-related activities like “the floor is lava,” where
    the aim is to jump from one piece of furniture to the next without touching the
    ground, except here, touching crypto directly is the lava. “A D.C. version of
    this game is our regulatory approach to crypto assets, and crypto asset custody
    in particular,” she said.Peirce said that, much like in the game, firms wanting
    to engage with crypto must avoid directly holding it due to unclear regulatory
    rules. “To engage in crypto-related activities, SEC-registrants have had to hop
    from one poorly illuminated regulatory space to the next, all while ensuring that
    they never touch any crypto asset,” Peirce said.Source: US Securities and Exchange
    CommissionPeirce said that investment advisers are often unsure which crypto assets
    qualify as securities, what entities count as qualified custodians, and whether
    “exercising staking or voting rights” could trigger custody violations.“The twist
    in the regulatory version is that it is largely played in the dark: burning legal
    lava and no lamps to illuminate the way.”Peirce also said that a broker or ATS
    that cannot custody or manage crypto assets will struggle to facilitate trading,
    making it unlikely for a “robust market” to develop.Echoing a similar sentiment,
    SEC Commissioner Mark Uyeda said at the event that as more SEC registrants work
    with crypto assets, it’s essential that they have access to custodial options
    that meet legal and regulatory requirements.Uyeda said the agency should consider
    letting advisers use “state-chartered limited-purpose trust companies” with the
    authority to hold crypto assets as qualified custodians.Related: Blockchain needs
    regulation, scalability to close AI hiring gapMeanwhile, the recently sworn-in
    chair of the SEC, Paul Atkins, said that he expected “huge benefits” from blockchain
    technology through efficiency, risk mitigation, transparency, and cutting costs.He
    reiterated that among his goals at the SEC would be to facilitate “clear regulatory
    rules of the road” for digital assets, hinting that the agency under former chair
    Gary Gensler had contributed to market and regulatory uncertainty.“I look forward
    to engaging with market participants and working with colleagues in President
    Trump’s administration and Congress to establish a rational fit-for-purpose framework
    for crypto assets,” said Atkins.Magazine: Bitcoin $100K hopes on ice, SBF’s mysterious
    prison move: Hodler’s Digest, April 19 – 25\n\n            "

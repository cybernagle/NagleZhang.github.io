- title: " SEC plans 4 more crypto roundtables on trading, custody, tokenization,
    DeFi "
  url: https://cointelegraph.com/news/sec-4-more-crypto-roundtables-trading-custody-tokenization-defi?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "The US Securities and Exchange Commission will host four more crypto roundtables
    — focusing on crypto trading, custody, tokenization and decentralized finance
    (DeFi) — after hosting its first crypto roundtable on March 21.The series of roundtables,
    organized by the SEC’s Crypto Task Force, will kick off with a discussion on tailoring
    regulation for crypto trading on April 11, the SEC said in a March 25 statement.A
    roundtable on crypto custody will follow on April 25, with another to discuss
    tokenization and moving assets onchain on May 12. The fourth roundtable in the
    series will discuss DeFi on June 6.A series of four crypto roundtable discussions
    are scheduled from April through to June. Source: SEC“The Crypto Task Force roundtables
    are an opportunity for us to hear a lively discussion among experts about what
    the regulatory issues are and what the Commission can do to solve them,” said
    SEC Commissioner Hester Peirce, the task force lead.The specific agenda and speakers
    for each roundtable have yet to be disclosed, but all are open for the public
    to watch online or to attend at the SEC's headquarters in Washington, DC.SEC softens
    on crypto with new leadershipThe agency’s Crypto Task Force was launched on Jan.
    21 by acting SEC Chair Mark Uyeda. It’s tasked with establishing a workable crypto
    framework for the agency to use. The task force held its first roundtable on March
    21 with a discussion titled “How We Got Here and How We Get Out — Defining Security
    Status.”The SEC will also be hosting a roundtable about AI's role in the financial
    industry on March 27, according to a March 25 release. Join us on March 27 for
    a roundtable discussion on artificial intelligence in the financial industry.
    Topics include the risks, benefits, and governance of AI. More details: https://t.co/ekX2RWp2KQ
    pic.twitter.com/7fH3j1tlwj— U.S. Securities and Exchange Commission (@SECGov)
    March 25, 2025The roundtable will discuss the risks, benefits, and governance
    of AI in the financial industry, with Uyeda, Peirce and fellow SEC Commissioner
    Caroline Crenshaw slated to speak.Under the Trump administration, the SEC has
    slowly been walking back its hardline stance toward crypto forged under former
    SEC Chair Gary Gensler.The regulator has dismissed a growing number of enforcement
    actions against crypto firms it launched under Gensler.Related: Bitnomial drops
    SEC lawsuit ahead of XRP futures launch in the USUyeda, who took the reins after
    Gensler resigned on Jan. 20, flagged plans on March 17 to scrap a rule proposed
    under the Biden administration that would tighten crypto custody standards for
    investment advisers.Uyeda also said in a March 10 speech that he had asked SEC
    staff for options to abandon part of proposed changes that would expand regulation
    of alternative trading systems to include crypto firms, requiring them to register
    as exchanges. Magazine: SEC’s U-turn on crypto leaves key questions unanswered \n\n
    \           "

- title: " Bitfinex Bitcoin longs total $6.8B while shorts stand at $25M — Time for
    BTC to rally? "
  url: https://cointelegraph.com/news/bitfinex-bitcoin-longs-total-6-8-b-while-shorts-stand-at-25-m-time-for-btc-to-rally?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Key takeaways:Bitfinex margin longs fell 18%, despite Bitcoin price rising
    24% in 30 days.$6.8 billion in long positions far outweight the current $25 million
    in shorts.Bitcoin options positioning and spot BTC inflows point to confidence
    from institutional investors.Bitcoin (BTC) price climbed 23.7% over the past 30
    days, yet traders on Bitfinex have cut their leveraged long positions by more
    than 18,000 BTC during this time. This wave of profit-taking in margin markets
    has led to speculation that professional traders may not be fully confident in
    the current $104,000 price level.Bitfinex BTC margin longs, BTC. Source: TradingView
    / CointelegraphBitfinex margin longs dropped to 65,889 BTC from 80,387 BTC between
    April 16 and May 16. This shift marks a reversal from the strong bullish margin
    demand seen between mid-February and mid-March, a period when Bitcoin’s price
    fell to $82,500 from $97,600. The current decrease in margin longs is likely a
    sign of healthy profit-taking rather than a turn toward bearish momentum.The reasoning
    behind this move is not entirely clear, since Bitcoin’s jump above $100,000 occurred
    on May 8, about three weeks after the margin longs peaked. Still, it would be
    wrong to suggest that Bitfinex whales have adopted a bearish outlook. Their margin
    longs now total $6.8 billion, while margin shorts stand at just $25 million, showing
    a major gap between bullish and bearish positions.Bitfinex BTC margin shorts,
    BTC. Source: TradingView / CointelegraphThis difference is mainly due to Bitfinex’s
    low 0.7% annual interest rate for margin trading. By contrast, those using leverage
    for 90-day Bitcoin futures are paying a 6.3% annualized premium. This gap creates
    arbitrage opportunities.For example, one can open Bitcoin longs on margin and
    simultaneously sell an equivalent position in BTC futures to benefit from the
    rate difference. Margin traders also tend to have longer time frames and higher
    risk tolerance than average investors, so their position changes are less affected
    by short-term price moves.Whales unfazed by $105,000 resistance as BTC ETFs drive
    optimismTo rule out factors limited to margin markets, it is useful to look at
    Bitcoin options. If traders expect a correction, demand for put (sell) options
    rises, pushing the 25% delta skew above 6%. In bullish periods, this metric usually
    drops below -6%.Bitcoin 30-day options delta skew (put-call) at Deribit. Source:
    Laevitas.chThe current -6% options delta skew shows confidence in Bitcoin’s price,
    even though data over the past two weeks has ranged from neutral to slightly bullish.
    This indicates that whales and market makers are not especially concerned about
    repeated failures to break above the $105,000 barrier.Related: Bitcoin traders’
    evolving view of BTC’s role in every portfolio bolsters $100K supportSome of the
    increased optimism, despite lower demand for leveraged bullish positions, comes
    from the $2.4 billion net inflows to US spot Bitcoin exchange-traded funds (ETFs)
    between May 1 and May 15. Therefore, the drop in Bitcoin margin longs does not
    mean institutional traders are turning bearish, especially when considering the
    BTC options markets.Although this data does not reveal whether Bitcoin is any
    closer to breaking above $105,000, the fact that there are $6.8 billion in leveraged
    margin longs clearly shows that professional traders remain highly optimistic
    about the price outlook.This article is for general information purposes and is
    not intended to be and should not be taken as legal or investment advice. The
    views, thoughts, and opinions expressed here are the author’s alone and do not
    necessarily reflect or represent the views and opinions of Cointelegraph.\n\n
    \           "

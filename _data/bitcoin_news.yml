- title: " Morgan Stanley eyes crypto rollout for E*Trade platform: Bloomberg "
  url: https://cointelegraph.com/news/morgan-stanley-etrade-crypto-trading-2026?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Banking giant Morgan Stanley reportedly plans to list cryptocurrencies
    on its E*Trade investment brokerage and trading platform.According to a May 1
    Bloomberg report, the firm intends to list crypto assets on E*Trade in 2026. The
    plan is still in early development, and the bank is said to be exploring partnerships
    with established crypto firms to power the service. Internal discussions about
    cryptocurrency support reportedly began in late 2024.E*Trade homepage. Source:
    E*TradeThis would not be Morgan Stanley’s first exposure to digital assets. The
    bank’s wealthiest clients have had access to crypto exchange-traded funds (ETFs)
    and futures for some time, with the firm’s advisers allowed to pitch Bitcoin ETFs
    since August 2024.Related: Morgan Stanley to explore crypto offerings for clients
    — CEORegulatory tailwinds push crypto forwardThe news follows previous reports
    that Morgan Stanley was considering adding cryptocurrency trading to its E*Trade
    online brokerage platform in early January. The reports at the time cited the
    expectations of a friendlier crypto regulatory environment.The move comes amid
    an increasingly favorable regulatory environment in the United States following
    the election of President Donald Trump, who campaigned on a pro-crypto platform
    and is personally involved in several blockchain ventures.  Morgan Stanley did
    not respond to Cointelegraph’s inquiry by publication.Related: Morgan Stanley
    discloses $188M in BlackRock Bitcoin ETF holdingsThe first 30 days of the Trump
    administration brought significant changes to the local crypto industry. More
    recently, US crypto proponents have shown optimism following the swearing-in of
    pro-crypto Securities and Exchange Commission Chair Paul Atkins.The SEC had significantly
    changed its stance even before Atkins took office. In late February, the agency
    had already paused multiple cryptocurrency enforcement cases with imminent deadlines.Trump’s
    own involvement with the crypto industry, paired with his pro-crypto stance, has
    raised concerns over potential conflicts of interest. Massachusetts Senator Elizabeth
    Warren recently called on government officials to address questions related to
    Trump’s memecoin and his media company.Senator Jon Ossoff recently expressed support
    for impeaching Trump over his meeting of the top holders of his Trump Official
    (TRUMP) memecoin. He said that “he is granting audiences to people who buy his
    memecoin,” adding:“When the sitting president of the United States is selling
    access for what are effectively payments directly to him. There is no question
    that that rises to the level of an impeachable offense.”Magazine: ZK-proofs are
    bringing smart contracts to Bitcoin — BitcoinOS and Starknet\n\n            "

- title: " Bitcoin falls to $81.5K as US stock futures sell-off in advance of Trump’s
    ‘Liberation Day’ tariffs "
  url: https://cointelegraph.com/news/bitcoin-falls-to-81-5-k-as-us-stock-futures-sell-off-in-advance-of-trump-s-liberation-day-tariffs?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin looks set for a bearish open to mark the last trading day of March
    and possibly the weakest Q1 performance since 2018. Crypto and stock traders’
    anxiety over US President Donald Trump’s fresh wave of 25% tariffs on cars imported
    to the US, the threat of tariffs on the pharmaceutical industry is clearly reflected
    in BTC’s current downside. Trump’s frequent references to April 2 being “Liberation
    Day” (the day when an apparent number for “reciprocal tariffs” will be assigned
    to various countries) also has shaken traders’ confidence. At the time of publishing,
    stock futures have already slipped into the red, with the DOW futures shedding
    206 points and the S&P 500 futures down 0.56%. As expected, Bitcoin's (BTC) price
    moved in tandem with equities markets, slipping to $81,656 on March 30 and locking
    in a 7th consecutive day of lower lows. US futures markets performance on March
    30. Source: X / Spencer HakimianAfter a tumultuous quarter, equities markets look
    set to close down for the month, with the S&P 500 down 6.3% and the Nasdaq and
    DOW each registering 8.1% and 5.2% respective losses. Bitcoin’s steady decline
    is a combination of weak demand in spot markets and clear derisking from traders
    who are reluctant to open fresh positions in BTC’s futures markets. Last week’s
    core Personal Consumption Expenditures (PCE) data showed a higher-than-anticipated
    uptick in inflation, and March consumer confidence data from the Conference Board
    showed the monthly confidence index — a metric that reflects respondents’ expectation
    for income, business and job prospects — at a 12-year low. Consumer confidence
    present situation and future expectations data. Source: The Conference BoardRelated:
    Bitcoin bottom ‘likely’ at $80K, opening door for TON, CRO, MNT and RENDER to
    rallyRecession odds also continue to rise, with a recent report from Goldman Sachs
    raising the 12-month recession probability from their previous 20% to 35%. In
    the report, Goldman Sachs’ analysts said, “The upgrade from our previous 20% estimate
    reflects our lower growth beeline, the sharp recent deterioration in household
    and business confidence and statements from White House officials indicating greater
    willingness to tolerate near-term economic weakness in pursuit of their policies.”    US
    recession odds raised by Goldman Sachs. Source: X / Peter BerezinDoes Bitcoin’s
    downside have a silver lining? While many crypto analysts have publicly revised
    their bullish six-figure-plus BTC price estimates and now forecast a revisit to
    Bitcoin’s swing lows in the mid $70,000 range, institutional investors continue
    to buy, and net inflows to the spot ETFs remain positive. On March 30, Strategy
    CEO Michael Saylor took to X and posted his famous orange dots Bitcoin chart,
    saying, “Needs even more Orange.” Strategy Bitcoin purchases. Source: X / Michael
    Saylor Data from CryptoQuant also shows Bitcoin inflows to accumulation addresses
    continuing to rise throughout the month. BTC: Inflows to accumulation addresses.
    Source: CryptoQuant This article does not contain investment advice or recommendations.
    Every investment and trading move involves risk, and readers should conduct their
    own research when making a decision.\n\n            "

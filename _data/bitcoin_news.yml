- title: " Bad news Bitcoin bulls, the long-hoped-for retail is already here: CryptoQuant "
  url: https://cointelegraph.com/news/bitcoin-bulls-hoping-retail-investors-surprise-cryptoquant-ceo?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin bulls who still think the cycle peak has yet to come as retail
    investors haven’t piled in yet might be using an outdated playbook, according
    to a crypto executive.“The idea that the cycle isn’t over just because onchain
    retail activity is absent needs reconsideration,” CryptoQuant founder and CEO
    Ki Young Ju said in a March 19 X post. Ju said that those tracking retail movements
    using only onchain metrics will not have seen the full picture. “Retail is likely
    entering through ETFs — the paper Bitcoin layer — which doesn’t show up onchain,”
    Ju said. “This keeps the realized cap lower than if the funds were flowing directly
    to exchange deposit wallets,” he added, noting that 80% of spot Bitcoin (BTC)
    exchange-traded fund (ETF) flows come from retail investors — a trend that Binance
    analysts already once observed in October last year. Since the launch of spot
    Bitcoin ETFs in January 2024, inflows have totaled around $35.88 billion. Source:
    Farside At the time, the analysts said most of the ETF buying likely came from
    retail investors moving their holdings from wallets and exchanges into funds with
    more regulatory protection.Ju was responding to counter-arguments over his earlier
    prediction on X that the “Bitcoin bull cycle is over” on March 17. “I’ve been
    calling for a bull market over the past two years, even when indicators were borderline.
    Sorry to change my view, but it now looks pretty clear that we’re entering a bear
    market,” he said. Ju explained that certain indicators are showing a lack of new
    liquidity, which is likely being driven by macro factors. He also clarified when
    he said the bull cycle was over, he meant Bitcoin could take “6-12 months” to
    break its all-time high, not that it’s about to crash.Related: Bitcoin is just
    seeing a ‘normal correction,’ cycle peak is yet to come: AnalystsTraders often
    look at retail investor activity to spot signs of exhaustion or as a signal to
    start selling when the market appears overheated.There are several sentiment indicators
    that help market participants understand the level of retail interest in the market.
    One of these is the Crypto Fear & Greed Index, which measures overall crypto market
    sentiment, reading a “Fear” score of 31, down 18 points from its “Neutral” score
    of 49 yesterday.Other common signals used to track the level of retail interest
    in the crypto market include Google search trends for “crypto” and related keywords
    and the popularity of crypto applications in major app stores worldwide.While
    the Google search score for “crypto” worldwide was at a score of 100 during the
    week of Jan. 19 - 25, when Bitcoin reached its all-time high of $109,000 and US
    President Donald Trump’s inauguration, it has since declined by almost 62%.The
    amount of searches on Google for “crypto” has declined almost 62% since the end
    of January. Source: Google TrendsAt the time of publication, the Google search
    score for “crypto” stands at 38, with Bitcoin trading 22% below its January all-time
    high.Magazine: Memecoins are ded — But Solana ‘100x better’ despite revenue plungeThis
    article does not contain investment advice or recommendations. Every investment
    and trading move involves risk, and readers should conduct their own research
    when making a decision.\n\n            "

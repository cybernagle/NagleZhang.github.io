- title: " El Salvador adds Bitcoin, but is complying with IMF deal — Director "
  url: https://cointelegraph.com/news/el-salvador-continues-bitcoin-purchases-despite-imf-agreement?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "El Salvador, the world’s first country to adopt Bitcoin as legal tender,
    is still acquiring Bitcoin despite comments from the International Monetary Fund
    (IMF) appearing to claim the opposite.The treasury of El Salvador acquired 7 Bitcoin
    (BTC) worth over $650,000 in the seven days leading up to April 27, blockchain
    data from El Salvador’s Bitcoin Office shows.When asked about the country’s Bitcoin
    investments, Rodrigo Valdes, director of the Western Hemisphere Department at
    the IMF, said that the country continues to comply with its agreement to halt
    government Bitcoin accumulation.El Salvador Bitcoin holdings. Source: El Salvador
    Bitcoin Office“In terms of El Salvador, let me say that I can confirm that they
    continue to comply with their commitment of non-accumulation of Bitcoin by the
    overall fiscal sector, which is the performance criteria that we have,” said Valdes
    during an April 26 press briefing.Related: Crypto sentiment recovers, but weekend
    liquidity risks remain“But on top of that, I think this is very important for
    the discussion in El Salvador,” he added. “The program of El Salvador is not about
    Bitcoin. It’s much more, much deeper in structural reforms, in terms of governance,
    in terms of transparency.”In December 2024, El Salvador struck a deal with the
    IMF for a $1.4 billion loan, which required the government to drop Bitcoin’s status
    as a legal tender and stop its BTC accumulation.Related: Serbia’s Prince Filip
    says Bitcoin is being stifled, expects huge rallyFlexible interpretation leaves
    room for Bitcoin buysThe IMF’s agreement may still enable room for purchases through
    non-governmental entities, according to Anndy Lian, author and intergovernmental
    blockchain adviser.“The IMF’s ‘flexible interpretation’ suggests purchases may
    involve non-public sector entities or reclassified assets, maintaining technical
    compliance,” Lian told Cointelegraph, adding:“This alternative approach allows
    El Salvador to retain its Bitcoin-friendly image while securing critical IMF funding
    to address unsustainable public debt and limited reserves.”Lian added that El
    Salvador’s strategy highlights the growing tension between financial innovation
    and traditional economic policies.“El Salvador’s experience offers valuable lessons
    for nations exploring crypto adoption, emphasizing the need for robust regulatory
    frameworks and state capacity to navigate international financial pressures,”
    he added.Magazine: Altcoin season to hit in Q2? Mantra’s plan to win trust: Hodler’s
    Digest, April 13 – 19\n\n            "

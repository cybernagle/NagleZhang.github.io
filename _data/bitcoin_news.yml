- title: " Bitcoin ‘in position’ for first key RSI breakout in 6 months at $85K "
  url: https://cointelegraph.com/news/bitcoin-in-position-first-rsi-breakout-6-months-85k?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin (BTC) circled $85,000 into the March 23 weekly close as excitement

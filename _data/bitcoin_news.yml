  url: https://cointelegraph.com/news/bitcoin-bull-market-almost-over-traders-split-over-btc-price-105k?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Key points:BTC price action retargets $105,000 after the Wall Street open,
    rising 2.5% from the day’s lows.Volatility continues, leading market participants
    to varying conclusions over what will happen to BTC/USD next.Perspectives include
    the Bitcoin bull market being in its final stages.Bitcoin (BTC) sought a rebound
    from a 4% dive at the May 19 Wall Street open as traders diverged on bull market
    strength.BTC/USD 1-hour chart. Source: Cointelegraph/TradingView$106,000 becomes
    BTC price zone to watchData from Cointelegraph Markets Pro and TradingView showed
    BTC/USD passing $104,500, up 2.5% from the day’s low.The pair had seen flash volatility
    around the weekly close, which although the highest ever recorded, swiftly saw
    bulls lose control.Now, opinions differed about when, or if, new all-time highs

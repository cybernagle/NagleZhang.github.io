- title: " American Bitcoin’s ambition is to dominate mining — Hut 8 CEO "
  url: https://cointelegraph.com/news/inside-the-trump-linked-american-bitcoin-mining-ambitions-to-dominate-the-industry-hut-8-ceo?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Earlier this week, Bitcoin mining giant Hut 8 revealed a partnership that
    includes two members of the Trump family — Donald Jr. and Eric — and its plans
    to launch a new mining venture, American Bitcoin. In an exclusive interview on
    Decentralize with Cointelegraph’s Byte-Sized Insight series, Hut 8 CEO Asher Genoot
    shared new details about the venture’s vision, why the timing was right and how
    the company plans to scale.The right team and the right time“We’ve thought about
    splitting out our Bitcoin mining and energy infrastructure businesses for some
    time,” Genoot said. “Meeting Eric and Don Jr. and seeing their deep passion for
    Bitcoin and infrastructure was the perfect catalyst.”According to Genoot, the
    goal is clear: to build one of the world’s largest and most efficient Bitcoin
    mining platforms, rooted in American soil and aligned with pro-Bitcoin sentiment
    growing under President Donald  Trump’s administration. “Eric told me, ‘I don’t
    want to get involved in anything that isn’t the biggest and the best,’” he said.The
    move comes at a pivotal moment for US-based mining. With China out of the picture
    post-2021 crackdown and Washington now openly exploring the idea of a strategic
    Bitcoin reserve, America’s place in the global mining ecosystem is under transformation.Still,
    size isn’t everything. Genoot emphasized that efficiency and cost-effectiveness
    are core to the strategy. “We don’t want to just be the biggest. We want to be
    the most efficient and cost-effective miner. If our cost basis isn’t low, we might
    as well just buy Bitcoin.”Related: Bitcoin miner Hut 8 argues to toss ‘short and
    distort’ shareholder suitMining and accumulating BTCAmerican Bitcoin’s structure
    allows it to mine BTC at low cost, accumulate more when the market allows, and
    potentially expand into other Bitcoin ecosystem services. Hut 8 currently holds
    over 10,000 BTC on its balance sheet, worth up to $1 billion depending on market
    conditions. American Bitcoin aims to surpass that.And the company isn’t just bullish
    on Bitcoin; it’s bullish on power consumption. Genoot pushed back on criticism
    that mining wastes energy: “Power consumption has only increased with every tech
    revolution. Cheap, excess energy is what drives Bitcoin mining — and a lot of
    that energy is renewable.”Looking ahead, Hut 8’s mining spinoff has big ambitions.
    “Our focus is scaling. Our focus is taking this company public on a US exchange,”
    Genoot said. “You’ll hear more from us soon.”Listen to the full episode of Byte-Sized
    Insight for the complete interview on Cointelegraph’s Podcasts page, Apple Podcasts
    or Spotify. And don’t forget to check out Cointelegraph’s full lineup of other
    shows! Got thoughts? Join the conversation on X or email us at savannah@cointelegraph.com.Magazine:
    SEC’s U-turn on crypto leaves key questions unanswered\n\n            "

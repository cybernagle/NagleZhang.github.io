    different exchanges just reads like they’re just trying to get as much liquidity
    from each order book as possible[...]”The reports surrounding the German government’s
    Bitcoin liquidations may have contributed more to Bitcoin’s downtrend than the
    volume of sold Bitcoin.BTC/USDT, 1-month chart. Source: CoinMarketCapBitcoin’s
    price recovered above the $60,000 psychological mark on July 14, a day after the
    German government-labeled wallet ran out of BTC, putting an end to investor uncertainty
    about further selling pressure.Magazine: Arthur Hayes $1M Bitcoin tip, altcoins
    ‘powerful rally’ looms: Hodler’s Digest, May 11 – 17\n\n            "

- title: " Robert Kiyosaki says ditch ‘fake money’ for Bitcoin, gold, and silver "
  url: https://cointelegraph.com/news/robert-kiyosaki-bitcoin-gold-silver-fake-money?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Robert Kiyosaki, businessman and best-selling author of Rich Dad Poor
    Dad, is once again sounding the alarm on the dangers of centralized monetary policy,
    urging his followers to abandon what he calls “fake money” and adopt alternatives
    like Bitcoin, gold, and silver.In a May 10 post on X, Kiyosaki backed a hardline
    stance against central banking systems, particularly the Federal Reserve, while
    quoting former US Congressman Ron Paul.Ron Paul, a longtime critic of the Fed
    and author of End the Fed, described interest rate setting by central banks as
    “price fixing,” equating it to socialist and Marxist economic control.Paul warned
    that such mechanisms erode personal wealth and undermine economic freedom — a
    sentiment that aligns closely with Kiyosaki’s long-held concerns.“Fake money leads
    to dishonest money, dishonest statistics, dishonest accounting, dishonest balance
    sheets, dishonest compensation, dishonest relations, dishonest leaders, and corruption
    in everyday life,” Kiyosaki wrote.He called on Americans to “fight back” by opting
    out of fiat systems and instead embracing decentralized stores of value like Bitcoin
    (BTC) and precious metals.Source: Robert KiyosakiRelated: ‘Rich Dad, Poor Dad’
    author calls for $1 million BTC by 2035Kiyosaki remains a major fiat criticKiyosaki’s
    disdain for fiat currency is not new. He has repeatedly criticized the US dollar,
    labeling it a “dying” currency inflated by government spending and central bank
    manipulation.His financial philosophy, rooted in Austrian economics and personal
    sovereignty, champions assets that cannot be debased or politically controlled.Kiyosaki
    has long argued that bearer assets like gold, silver, and more recently Bitcoin,
    are critical hedges against inflation and key to long-term generational wealth
    accumulation through economic cycles.“Don’t work or save fake money,” he advised.
    “Get on your own decentralized gold, silver, and Bitcoin standard.”In an April
    18 post, Kiyosaki forecasted that Bitcoin could hit $1 million by 2035 as the
    US dollar continues to lose value to inflationary monetary policies.“I strongly
    believe, by 2035, that one Bitcoin will be over $ 1 million, gold will be $30,000,
    and silver $3,000 a coin,” he said.Kiyosaki is not the only one expressing confidence
    in Bitcoin’s future.In February 2025, ARK Invest CEO Cathie Wood said that Bitcoin
    could hit $1.5 million by 2030 if demand for the digital asset continues to grow.More
    recently, on Dec. 10, Eric Trump delivered the keynote speech at the Bitcoin MENA
    event in Abu Dhabi, United Arab Emirates (UAE), and predicted that Bitcoin would
    hit $1 million due to its scarcity.Magazine: TradFi fans ignored Lyn Alden’s BTC
    tip — Now she says it’ll hit 7 figures: X Hall of Flame\n\n            "

- title: " Bitcoin gets $126K June target as data predicts bull market comeback "
  url: https://cointelegraph.com/news/bitcoin-gets-126k-june-target-data-predicts-bull-market-comeback?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin (BTC) can hit new all-time highs by June this year if historical
    patterns repeat, network economist Timothy Peterson said.Data uploaded to X on
    March 15 gives BTC/USD around two-and-a-half months to beat its $109,000 record.April
    could spark 50% BTC price upsideBitcoin has declined 30% after topping out in
    mid-January. The extent of the drop is characteristic of bull market corrections,
    and Peterson keenly senses the potential for a comeback.“Bitcoin is trading near
    the low end of its historical seasonal range,” he determined alongside a chart
    comparing BTC price cycles.  “Nearly all of Bitcoin's annual performance occurs
    in 2 months: April and October.  It is entirely possible Bitcoin could reach a
    new all-time high before June.”Bitcoin seasonal comparison. Source: Timothy Peterson/XPeterson
    has created various Bitcoin price metrics over the years. One of them, Lowest
    Price Forward, has successfully defined levels below which BTC/USD never falls
    after a crossing above them at a certain point. After its recovery from multi-year
    lows in March 2020, Lowest Price Forward predicted that BTC price would never
    trade under $10,000 again from September onward.Meanwhile, a new likely floor
    level has appeared this year: $69,000, as Cointelegraph reported, which has a
    “95% chance” of holding.Continuing, Peterson stipulated a median target of $126,000
    with a deadline of June 1. Alongside a chart showing the performance of $100 in
    BTC, he also revealed that limp bull market performance has always been temporary.“Bitcoin
    average time below trend = 4 months,” he explained.“The red dotted trend line
    = $126,000 on June 1.”Bitcoin growth of $100 comparison. Source: Timothy Peterson/XA
    standard Bitcoin bull market comedownOther popular market commentators continue
    to emphasize that Bitcoin’s recent trip to $76,000 is standard corrective behavior.Related:
    Watch these Bitcoin price levels as BTC retests key $84K resistance“You don’t
    have to look at the previous BTC bull runs to understand that corrections are
    a part of the cycle,” popular trader and analyst Rekt Capital wrote in part of
    X analysis of the phenomenon at the start of March.Rekt Capital counted five of
    what he called “major pullbacks” in the current cycle alone, going back to the
    start of 2023.BTC/USD 1-week chart. Source: Rekt Capital/XAnalysts at crypto exchange
    Bitfinex told Cointelegraph this weekend that the current lows mark a “shakeout,”
    rather than the end of the current cycle.This article does not contain investment
    advice or recommendations. Every investment and trading move involves risk, and
    readers should conduct their own research when making a decision.\n\n            "

- title: " Here is why Bitcoin price is stuck below $105K "
  url: https://cointelegraph.com/news/here-is-why-bitcoin-price-is-stuck-below-105-k?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Key takeaways:Bitcoin price consolidates as resistance at $105,000 prevents
    a rally to new all-time highs.Traders are slightly bearish, but historical data
    suggests a sudden bullish move should not be ruled out.Bitcoin (BTC) price has
    been consolidating within a roughly $3,500 range over the past seven days as the
    $105,000 level remains the overhead resistance to break.BTC/USD weekly chart.
    Cointelegraph/TradingViewBitcoin unable to crack $105,000Data from Cointelegraph
    Markets Pro and Bitstamp shows that BTC’s price has been oscillating between its
    resistance level at $105,000 and $101,500, where it has found support.“$BTC is
    stuck in a narrowing $101.5K–$104K range,” said Swissblock in a May 16 post on
    X. The onchain data provider said that Bitcoin began consolidating after two failed
    attempts to break above the resistance at $105,000. “With the weekend ahead, resolution
    will likely be delayed, unless we get a Friday break.”BTC/USD chart. Source: SwissblockFor
    market intelligence firm Santiment, failure to rise past the $105,000 level has
    seen traders flip slightly bearish. “Markets generally tend to move opposite to
    the crowd’s expectations, suggesting there is a heightened probability of crypto
    markets rising due to this increased fear,” the firm explained in an X post, adding:“Retail
    traders are beginning to show impatience, which historically is a bullish sign
    for prices.”Bitcoin social volume. Source: SantimentBTC price lacks “serious catalyst”Bitcoin
    has managed to sustain $100,000 as support for over a week while hitting 14-week
    highs of $105,700 on May 12. Despite following broad volatility across risk assets,
    BTC/USD might have gone even higher were it not for maneuvers of large-volume
    trading entities on exchange order books, according to trading resource Material
    Indicators.Related: Bitcoin hitting $220K ‘reasonable’ in 2025, says gold-based
    forecastLooking at the Binance exchange, Material Indicators said large blocks
    of ask liquidity were stacked above the spot price, pinning the BTC price in the
    range.An accompanying chart shows that these liquidity clusters currently sit
    between $105,000 and $110,000.“Unless we have a serious catalyst, I’m not expecting
    to see a sustainable breakout to the all-time high territory until BTC has a legit
    support test at $100,000,” it said in a May 16 post on X.  BTC/USDT order book
    liquidity data. Source: Material IndicatorsMaterial Indicators added that a key
    level to watch on the downside was the $98,000-$100,000 range.“With all of the
    above in mind, be prepared for a support test in the $98,000-$100,000 range, but
    beware of short squeezes and bull traps until that happens.”Bitcoin bulls fight
    to hold key support levelsMeanwhile, trader Daan Crypto Trades said that the “start
    of the recent move” at $93,000 was essential for Bitcoin traders going forward.Bitcoin
    is trading “far away from any large liquidity clusters. The price didn’t trade
    for a long time up here just yet. So, after the initial squeeze of shorts, there
    are not that many new positions built up around this area,” his X post said, adding:“The
    main level to look out for would be local highs above $106,000 and below all the
    way down to $93,00, which was the start of the recent move.”BTC/USDT liquidation
    heatmap. Source: Daan Crypto TradesMaterial Indicators paid additional attention
    to the 50-day and 100-day simple moving averages (SMAs), key longer-term trendlines
    that formed a bullish cross, indicating a “strong upward momentum for the macro
    trend.”For MN Capital founder Michael van de Poppe, $98,000 is a “crucial area
    to hold on to” in order to ensure continuation upward.Source: Michael van de PoppeThis
    article does not contain investment advice or recommendations. Every investment
    and trading move involves risk, and readers should conduct their own research
    when making a decision.\n\n            "

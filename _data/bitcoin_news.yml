    chart. Source: Cointelegraph/TradingViewThe pair has been consolidating between
    $217 and $240 for some time. The 20-EMA has started to turn up, and the RSI has
    risen into the positive zone, signaling an advantage to buyers. A break and close
    above $240 could drive the pair to $267.On the other hand, if the price turns
    down from $240, it suggests that the bears are fiercely defending the level. That
    could keep the pair stuck between $240 and $217 for some time. Sellers will have
    to tug the price below $217 to signal a comeback.This article does not contain
    investment advice or recommendations. Every investment and trading move involves

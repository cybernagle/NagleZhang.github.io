- title: " Crypto ETPs hit 3rd-largest inflows on record at $3.4B — CoinShares "
  url: https://cointelegraph.com/news/crypto-etp-3-4-billion-inflows-weakening-dollar?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Cryptocurrency exchange-traded products (ETPs) bounced back with their
    third-largest inflows on record last week, according to CoinShares.Global crypto
    ETPs collectively posted $3.4 billion of inflows in the trading week of April
    21–25, marking the highest level since December 2024, CoinShares reported on April
    28.The inflows were just 13% below the all-time high of $3.85 billion seen in
    the trading week of Dec. 2–6, 2024, CoinShares previously reported.Renewed investment
    interest in crypto ETPs came as Bitcoin (BTC) broke back above $90,000 last week
    for the first time since briefly retesting the price mark in early March, according
    to CoinGecko.Bitcoin ETFs lead as price consolidates above $90,000Bitcoin was
    the primary winner among crypto ETPs last week, with investors pouring as much
    as $3.18 billion into BTC ETPs.The fresh inflows covered all the previous outflows
    seen since the beginning of April, with year-to-date (YTD) inflows extending to
    $3.7 billion.Flows by asset (in millions of US dollars). Source: CoinSharesBitcoin
    ETP’s assets under management (AUM) have reached $132 billion, while total AUM
    surged to $151.6 billion.Solana was the only loserBullish sentiment was seen in
    all crypto ETPs except for Solana (SOL), with Solana-based investment products
    seeing $5.7 million of outflows last week.Meanwhile, Ether (ETH), the second-largest
    cryptocurrency by market cap, saw $183 million inflows in the past trading week,
    breaking an eight-week streak of outflows.Related: Solana's Loopscale pauses lending
    after $5.8M hackOther notable gainers among altcoins were Sui (SUI) and XRP (XRP),
    which saw $20.7 million and $31.6 million of inflows, respectively.All issuers
    see healthy inflowsThe fresh crypto ETP flows were distributed across all major
    issuers, including those in the United States and Europe.BlackRock’s iShares ETFs
    saw the largest inflows last week at $1.5 billion, with ARK and Fidelity following
    at $621 million and $574 million, respectively.Flows by issuer (in millions of
    US dollars). Source: CoinSharesDespite significant inflows, some issuers continue
    to see outflows month-to-date, or since April 1. Among those issuers are Grayscale
    with $84 million in outflows, ProShares with $18 million in outflows, and CoinShares
    with $7 million in outflows.Reasons for the spikeThe latest inflows mark a notable
    trend reversal in crypto ETPs as the majority of issuers were seeing massive YTD
    inflows in the previous week, following a series of outflows in 2025.According
    to CoinShares’ James Butterfill, the new inflows likely came from concerns over
    the tariff impact on corporate earnings as well as a notable weakening of the
    US dollar, fueling demand for safe-haven assets.The inflows also came as gold
    prices saw a notable decline last week after breaking new highs at nearly $3,500
    on April 22, dropping to as low as $3,275 on April 23, according to TradingView.Magazine:
    Ethereum is destroying the competition in the $16.1T TradFi tokenization race\n\n
    \           "

- title: " Kentucky governor signs ‘Bitcoin Rights’ bill into law "
  url: https://cointelegraph.com/news/kentucky-signs-bitcoin-rights-bill-into-law?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Kentucky governor Andy Beshear has signed a measure known as the “Bitcoin
    Rights” bill, into law, enshrining protections for crypto users, as two other
    US states’ Bitcoin reserve legislation advanced.Crypto advocacy group the Satoshi
    Action Fund said in a March 24 statement to X that House Bill 701 protects the
    “right to self-custody, run a node, and use of digital assets” without “fear of
    discrimination.” First introduced to the Kentucky House by Rep Adam Bowling on
    Feb. 19, HB701’s description says it safeguards the right to use digital assets
    and self-custody wallets and bans local zoning changes that discriminate against crypto
    mining. Source: Satoshi Action FundAt the same time, the legislation provides
    guidelines for running a crypto node, excludes crypto mining from money transmitter
    license requirements, and specifies that mining and staking are not considered
    offering or selling a security.The bill passed Kentucky’s House of Representatives
    on Feb. 28, with all 91 representatives voting in favor, and passed the state
    Senate on March 13, with all 37 senators voting in favor. It was then signed into
    law by Beshear on March 24. The legislation mirrors similar legislation signed
    into law by Oklahoma Governor Kevin Stitt in May 2024. Kentucky’s Bitcoin Rights
    bill enshrines protections for crypto users in the state. Source: Kentucky General
    AssemblyKentucky has also introduced a bill to establish a Bitcoin reserve, allowing
    the State Investment Commission to allocate up to 10% of excess state reserves
    into digital assets, including Bitcoin (BTC); the bill is still under review. Other
    Bitcoin reserve bills move forwardMeanwhile, Oklahoma’s House Bill 1203 (HB 1203),
    known as the Strategic Bitcoin Reserve Act, has passed the State House of Representatives
    77 to 15, according to the crypto advocacy group, the Oklahoma Bitcoin Association.The
    bill was introduced to the Oklahoma House of Representatives on Jan. 15 by state
    Representative Cody Maynard and passed the Government Oversight Committee with
    a 12–2 vote on Feb. 25. Related: Crypto bills stack up across the US, from Bitcoin
    reserves to task forcesIt must now pass through the Senate before the Oklahoma
    governor can veto or sign the bill into law. Oklahoma State Senator Dusty Deevers
    also filed legislation on Jan. 8 that would allow residents in the state to receive
    salaries in Bitcoin. Bitcoin legislation tracker group Bitcoin Laws said in a
    March 24 X post that Oklahoma has now moved into equal second place with Texas
    in the State Bitcoin reserve race.Oklahoma has now moved into equal second place
    in the State Bitcoin reserve race. Source: Bitcoin LawsArizona remains in the
    lead after two strategic digital asset reserve bills cleared Arizona’s House Rules
    Committee on March 24 and headed to the House floor for a full vote.Bitcoin Laws
    speculates that because Republicans dominate the Oklahoma Senate and the governor
    is Republican, the bill “has a good chance to pass into law.” Missouri’s Special
    Committee on Intergovernmental Affairs is also in the process of evaluating the
    state’s Bitcoin reserve bill, according to Bitcoin Laws.Magazine: How crypto laws
    are changing across the world in 2025\n\n            "
  published: 2025-03-25 06:05:06.000000000 +00:00
- title: " Massive Bitcoin whale buys $200M in BTC, another wakes up after 8 years "
  url: https://cointelegraph.com/news/billionaire-btc-whale-adds-to-stash-amid-other-whale-activity?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "A massive Bitcoin whale wallet holding has just added $200 million worth
    of Bitcoin to its position after selling over 11,400 Bitcoin over the last few
    months — coinciding with a recent rebound for the original cryptocurrency. The
    Bitcoin (BTC) whale added 2,400 Bitcoin — worth over $200 million — to their stash
    on March 24, blockchain analytics firm Arkham Intelligence said in an X post.Data
    shared by the firm shows that despite some sales in February, after the latest
    purchase, the whale holds over 15,000 Bitcoin in its wallet, worth over $1.3 billion,
    at current prices. “A $1 billion Bitcoin Whale just withdrew $200 million of Bitcoin
    this morning from Binance,” Arkham said.The whale started acquiring Bitcoin five
    days ago after selling off its stash when Bitcoin’s price was between $100,000
    and $86,000 in February. CoinGeck data shows on Feb. 1, Bitcoin was worth over
    $104,000, but it steadily declined to hit a low of $78,940 on Feb. 28. Source:
    Arkham IntelligenceThe whale movement comes amid a recent Bitcoin price rebound. Bitcoin
    has been trading $81,000 and $88,000 in the last seven days, according to CoinGecko,
    with a price surge of 3% on March 24, distancing itself from its $76,900 low on
    March 11.Bitcoin whale wakes from slumber At the same time, another Bitcoin whale
    has woken up after eight years of dormancy, moving over 3,000 Bitcoin, worth $250
    million, in one transaction on March 22.“His Bitcoin stack went from $3M in early
    2017 to over $250M today  — and he’s held Bitcoin on one address for over 8 years,”
    Arkham said in a March 22 X post. Another huge Bitcoin holder, BlackRock, the
    world’s largest asset manager with approximately $11.6 trillion in assets under
    management, has been steadily accumulating more Bitcoin over the last week as
    well, according to Arkham.Across 15 transactions, the asset manager bought an
    extra 4,054 Bitcoin, giving it a total stash of 573,878, worth over $50 billion,
    data on Bitbo’s Bitcoin treasury tracker shows. BlackRock’s iShares Bitcoin Trust
    (IBIT) also led a rally of spot Bitcoin exchange-traded funds (ETFs) in the US,
    snapping a five-week net outflow streak by clocking a net inflow of $744.4 million. The
    bulk of net inflows came from BlackRock’s iShares, which recorded $537.5 million,
    followed by Fidelity’s Wise Origin Bitcoin Fund (FBTC) with $136.5 million.Bitcoin
    whales weren’t the only ones accumulating more crypto. Lookonchain used Arkham
    data to track a lone Ether whale who added 7,074 Ether (ETH) to its stash on March
    21, worth $13.8 million.Source: LookonchainEther has been moving between $1,876
    and $2,097 in the last seven days, CoinGecko data shows. It’s still down over
    57% from its all-time high of $4,878, which it hit in November 2021.However, its
    open interest surged to a new all-time high on March 21, and the number of addresses
    with at least $100,000 worth of Ether started rising at the beginning of March,
    from just over 70,000 addresses on March 10 to over 75,000 on March 22.Magazine:
    Crypto fans are obsessed with longevity and biohacking: Here’s why\n\n            "
  published: 2025-03-25 03:18:31.000000000 +00:00
- title: " Mt. Gox transfers $1B in Bitcoin in third major BTC move this month "
  url: https://cointelegraph.com/news/mt-gox-transfers-1-billion-bitcoin-third-major-btc-move?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bankrupt crypto exchange Mt. Gox has just shifted 11,501 Bitcoin in its
    third significant transaction in less than a month. Blockchain analytics firm
    Arkham Intelligence alerted the community of the transfer on March 25 on X, revealing
    the Japanese exchange had sent 893 Bitcoin (BTC) worth around $78 million at current
    prices to the Mt. Gox cold wallet (1Jbez) and another 10,608 Bitcoin, worth around
    $929 million, to another wallet, the Mt. Gox change wallet (1DcoA).Source: Arkham
    IntelligenceThe latest move comes after Mt. Gox shuffled a total of 12,000 Bitcoin
    worth over $1 billion on March 6 and another 11,833 Bitcoin on March 11.Blockchain
    analytics platform Spot On Chain said in a March 25 post to X that one of the
    previous transfers this month ended up in the crypto exchange Bitstamp.Spot On
    Chain speculates the 893 Bitcoin “sent to the warm wallet will be moved out shortly
    too.”Source: Spot On ChainArkham data shows the exchange still holds about 35,000
    Bitcoin worth $3.1 billion across wallets it controls.Many speculate significant
    movements from Mt. Gox could mean creditor payouts are around the corner. Creditors
    have the option to receive their payouts in Bitcoin. A July 2024 Reddit poll following
    the exchange’s first payout found creditors were not rushing to sell their Bitcoin
    payouts.Mt. Gox fell into bankruptcy in early 2014 after suffering an 850,000
    Bitcoin loss in one of the biggest crypto hacks ever recorded. Before the security
    breach, it was the largest Bitcoin exchange, handling around 70-80% of trades.After
    its bankruptcy in February 2014, a Tokyo court appointed a trustee to manage the
    bankruptcy proceedings and compensate creditors with the exchange’s assets.Related:
    Mt. Gox moves $2.2B of Bitcoin, adding to BTC selling pressureHowever, last October,
    the trustee in charge of the exchange’s Bitcoin stash extended the deadline, pushing
    it by a full year to Oct. 31, 2025, claiming many creditors “still have not received
    their repayments because they have not completed the necessary procedures for
    receiving repayments.”Last December, Mt. Gox also moved over 24,000 Bitcoin, worth
    nearly $2.5 billion, to an unknown address after the cryptocurrency hit a milestone
    of $100,000. Magazine: Meet lawyer Max Burwick — ‘The ambulance chaser of crypto’\n\n
    \           "

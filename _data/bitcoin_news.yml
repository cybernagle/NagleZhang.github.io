- title: " India’s Supreme Court urges government to regulate cryptocurrency "
  url: https://cointelegraph.com/news/india-s-surpeme-court-asks-government-for-clearer-crypto-stance?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "India’s Supreme Court questioned the government’s lack of regulatory clarity
    on cryptocurrencies despite imposing taxes on digital assets like Bitcoin.According
    to the Indian legal news outlet LawChakra, the country’s Supreme Court expressed
    concern over the increasing use of Bitcoin (BTC) and other cryptocurrencies, which
    remain largely unregulated.“This is a whole parallel economy running with such
    coins, and it is a danger to the economy of the country,” Justice Surya Kant reportedly
    said during a recent hearing related to an ongoing investigation into a Bitcoin
    transaction.Kant said that while the government has implemented crypto taxation,
    it has failed to regulate the space.“If you can tax it at 30%, also please regulate
    it as you have recognised it by taxing it,” the judge said.Related: Indian high
    court orders steps to block Proton MailGovernment says review may followThe Additional
    Solicitor General of India — a senior legal officer representing the government
    of India — reportedly answered the request by saying that the government “will
    take instructions, my lord,” indicating that the government may consider reviewing
    the country’s current cryptocurrency regulation.The report follows a May 5 hearing
    by the Supreme Court during which Kant and lawyer Mahesh Jethmalani shared their
    views on cryptocurrency. Jethmalani said that Bitcoin is already being used worldwide,
    noting that “in Europe, you can walk into a car showroom and buy a car using just
    one Bitcoin.”Related: Coinbase plans India comeback with FIU registrationWhile
    this scenario is not as common as this statement may suggest, buying a car with
    Bitcoin is possible at specialized sellers. The lawyer also showed that he misunderstood
    the pseudonymous nature of Bitcoin’s creator, Satoshi Nakamoto, claiming that
    he was from Japan:“It was created by someone from Japan who used a fake name.”Concerns
    over misuseKant also expressed concern over the misuse of cryptocurrencies. He
    said that “there is some system of rules that applies to this.”Kant also said
    that “some Bitcoins are genuine, but some might not be.” However, it’s unclear
    whether he meant to suggest that counterfeit Bitcoin are in circulation (there
    are none) or that illegal activities taint some. The latter appears likely since
    the statement was followed by the judge saying that “it has also become a possible
    way to do illegal business.”India’s government has not yet introduced comprehensive
    legislation to govern cryptocurrencies, though it taxes gains and requires firms
    to report certain activities to financial regulators. The lack of regulation has
    drawn criticism from both the industry and policymakers amid the asset class’s
    continued growth.Magazine: India mulls new crypto ban to support CBDC, Lazarus
    Group strikes again: Asia Express\n\n            "
  published: 2025-05-20 13:18:57.000000000 +01:00
- title: " Bitcoin privacy tool Payjoin receives $100K grant from Maelstrom "
  url: https://cointelegraph.com/news/bitcoin-payjoin-privacy-grant-maelstrom?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin developer Ben Allen has received a $100,000 grant from investment
    firm Maelstrom to support the development of Payjoin, a privacy-focused tool aimed
    at improving Bitcoin’s scalability and privacy.According to a May 20 announcement
    shared with Cointelegraph, Maelstrom will finance Allen’s work on his Payjoin
    devkit alongside Dan Gould. The system allows Bitcoin (BTC) senders and receivers
    to use batched transactions, with positive implications for scalability and privacy.Payjoin
    Developer Kit’s website. Source: Payjoin Dev KitPayjoin was first proposed by
    Nicolas Dorier in 2019 in Bitcoin improvement proposal (BIP) 78. The core principle
    behind the system is that both senders and receivers may contribute inputs to
    a transaction.“Namely that privacy is enhanced and improved consolidation of transaction
    outputs is achieved, benefiting scalability,“ the Maelstrom announcement states.A
    Maelstrom representative told Cointelegraph that grantees are paid monthly for
    a total of $100,000 per year in Bitcoin and Allen’s grant will last one year.
    There are no concrete milestones and the grant is managed on a hands-off approach:“We
    believe grantees may work better with freedom to work on what they wish, rather
    than being tightly controlled by those who provide the funding.“Related: Bitcoin
    privacy will survive despite CoinJoin closure — zkSNACKs CEOPayjoin: Soon in wallets
    near you?Allen will be working on improving Payjoin implementations, with the
    clear objective of making it possible for the feature to be added to more wallets.
    He explained that the funding will enable him to work on the project full time.The
    announcement points out that the system presents challenges, with the receiver
    needing to be online and the payment communication flow being more complex than
    normal non-interactive Bitcoin transactions. Maelstrom’s chief investment officer
    and BitMEX crypto exchange co-founder and former CEO Arthur Hayes said that “improving
    financial privacy in Bitcoin is extremely important.” He added:“The great thing
    about Payjoin is that if only a small amount of adoption is achieved, it breaks
    a key assumption used by financial surveillance companies. The assumption they
    have is that if a Bitcoin transaction has multiple inputs, all the inputs must
    all belong to the same entity.“A Maelstrom representative explained to Cointelegraph
    that the firm “is keen to support more grantees in the privacy area.” The company
    is actively seeking candidates with strong track records in Bitcoin privacy projects.Related:
    What are privacy coins and how do they differ from Bitcoin?Enjoy the benefits
    whether you use it or notHayes noted that “Payjoin adoption improves the privacy
    of even the people who don’t use it.” Allen said he believes privacy is important
    for Bitcoin users to enjoy a better experience and control their financial data
    when using it daily.Allen told Cointelegraph he is “building out benchmarks to
    help downstream developers implement Payjoin in individual wallet software as
    well as expanding test coverage to ensure consistent and reproducible code.” He
    explained that encouraging its adoption “is the biggest step we can take for simplifying
    the experience and encouraging Payjoin adoption by moving the complexities mostly
    away from the user.” The Maelstrom representative told Cointelegraph that “a key
    metric for Payjoin success would be adoption by popular open source Bitcoin wallets.”
    “In particular if the BitcoinCore wallet ever adopts it, that would be a huge
    signal of success,” they added.Magazine: Big Questions: What did Satoshi Nakamoto
    think about ZK-proofs?\n\n            "

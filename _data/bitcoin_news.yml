- title: " Teens kidnap Las Vegas man at gunpoint, stealing $4M in crypto "
  url: https://cointelegraph.com/news/florida-teens-kidnap-crypto-entrepreneur-at-gunpoint-steal-4-m-in-crypto?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Three teenagers have been accused of kidnapping a man at gunpoint after
    he was returning from a crypto event in Las Vegas, before driving him an hour
    outside of the city and robbing him of $4 million in crypto and non-fungible tokens.According
    to police, the incident occurred last November. The victim had finished hosting
    a crypto-related event in downtown Las Vegas, and when he returned home, the suspects
    forced him into a vehicle and drove him to a remote desert area an hour away from
    the city. There, they forced him to hand over passwords to his accounts, according
    to a May 10 report from Las Vegas local news outlet 8 News Now. The man was allegedly
    told to comply with the teens’ demands if he wanted to “live to see another day,”
    and because they also “had his dad and would kill him,” according to the report. It’s
    also alleged that a fourth person may have been communicating with the three young
    men through a phone call during the incident, which the victim could hear through
    a speakerphone.After having his accounts drained of $4 million in crypto and NFTs,
    the victim reportedly walked five miles back through the desert to reach a gas
    station where he could call a friend for help. Two 16-year-olds from Florida are
    facing charges including robbery, kidnapping, and extortion in connection with
    the incident. A third teen allegedly involved in the plot has left the country,
    prosecutors say.One of the young men is behind bars with bail set at $4 million,
    while the other has been released under house arrest with electronic monitoring.
    A preliminary hearing is scheduled for June, with both teens set to be tried as
    adults. Digital asset lawyer Sasha Hodder said in a May 10 X post that this case
    illustrates how “Crypto theft is evolving. It’s not just social engineering or
    SIM swaps anymore.”Source: Sasha HodderUptick in thieves targeting crypto industry
    offlineCrypto industry participants are increasingly becoming targets for kidnappings
    and extortion. In a recent May 3 case, the father of a crypto entrepreneur was
    freed by police in Paris, France, after being held for several days in connection
    with a 7 million euro ($7.8 million) kidnapping plot.In February, a UK crypto
    broker reportedly jumped 30 feet from a balcony to escape kidnappers who were
    threatening to torture and kill him if he didn’t hand over 30,000 euros ($30,917)
    of crypto.Related: Ledger co-founder released after days in captivity in France:
    ReportMeanwhile, Jameson Lopp, a cypherpunk and co-founder of self-custodial firm
    Casa, has created a list on GitHub recording dozens of offline crypto robberies
    all over the world. The first dates back to 2014, when someone allegedly tried
    to extort computer scientist and cryptographer Hal Finney of 1,000 Bitcoin (BTC)
    worth $400,000 at the time. There have been 21 incidents of in-person crypto-related
    robbery so far this year, according to Lopp’s list. In 2024, there were 28 incidents,
    while there were 17 in 2023 and 32 in 2021. Magazine: Bitcoiner sex trap extortion?
    BTS firm’s blockchain disaster: Asia Express\n\n            "
  published: 2025-05-12 06:53:22.000000000 +01:00
- title: " Metaplanet now holds more Bitcoin than El Salvador "
  url: https://cointelegraph.com/news/metaplanet-bitcoin-holdings-surpass-el-salvador?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Japanese investment firm Metaplanet has added another $129 million to
    its Bitcoin treasury, pushing its total holdings past the Bitcoin-stacking country
    of El Salvador. “Metaplanet now holds more Bitcoin than El Salvador. From humble
    beginnings to rivaling nation-states, we’re just getting started,” said CEO Simon
    Gerovich on X after the latest purchase announcement. On May 12, the Tokyo-listed
    firm announced that it had acquired 1,241 Bitcoin (BTC) for 14.8 million yen ($101,843)
    per coin.The total buy, at its highest ever purchase price, is worth around $129
    million at current market prices. This brings the firm’s total holdings to 6,796
    Bitcoin, currently worth around $707 million, and the average purchase price is
    $91,000 per Bitcoin. Metaplanet started its BTC accumulation strategy in April
    2024. El Salvador is the sixth-largest nation-state holder of the asset with 6,714
    Bitcoin worth around $642 million, according to the National Bitcoin Office.Source:
    Simon GerovichThe Japanese investment firm also reported a Bitcoin Yield, which
    measures the ratio of percentage change in Bitcoin holdings per fully diluted
    share, of 38% for the current quarter to date. The firm achieved a BTC Yield of
    95.6% during the first quarter of 2025. Related: Trump’s US-China trade deal could
    shed light on Bitcoin’s use caseMetaplanet has been more aggressive in its accumulation
    of the asset in recent months, with a purchase of 5,555 Bitcoin on May 7, four
    purchases in April totaling 18,586 BTC, and six purchases in March totaling 18,925
    BTC, each buy larger than the previous. Metaplanet BTC purchase disclosure. Source:
    MetaplanetThe firm is the largest holder of Bitcoin in Asia and the tenth largest
    globally, according to BiTBO. Saylor hints at another buy Meanwhile, Michael Saylor
    hinted at another purchase by his firm, Strategy, on May 12, by posting a screenshot
    of the “Saylor Tracker” chart, which tracks the firm’s Bitcoin treasury portfolio.
    “Connect the dots,” was the accompanying comment. Source: Michael SaylorSaylor
    has made similar Monday posts with a cryptic comment many times in the past, which
    have been followed by a BTC acquisition announcement. Strategy currently holds
    555,450 BTC worth around $57.8 billion at current prices, according to the tracker. Magazine:
    Bitcoin eyes ‘crazy numbers,’ JD Vance set for Bitcoin talk: Hodler’s Digest\n\n
    \           "
  published: 2025-05-12 06:15:23.000000000 +01:00
- title: " US-China trade deal could shed light on Bitcoin’s use case: Trader "
  url: https://cointelegraph.com/news/us-trump-trade-deal-china-shed-light-bitcoin-safe-haven?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin’s potential price reaction to a trade deal between the United
    States and China could give insights into whether Bitcoin is being used as a safe-haven
    asset in the current market. Bitcoin (BTC) outperformed stocks and held up “incredibly
    strong” during a sharp sell-off on stock markets in April, following Donald Trump’s
    announcement of tariffs on “Liberation Day,” observed crypto trader “Daan Crypto”
    on May 11.Following its plunge to $75,000 on April 7, Bitcoin recovered strongly
    to trade 27% higher at around $95,000 by the end of the month. Meanwhile, indexes
    like the S&P 500 and Nasdaq declined in April. At the time, people wondered if
    Bitcoin’s relative strength came from the narrative that countries were using
    Bitcoin to bypass tariffs. The analyst said the opposite should theoretically
    occur if the trade deal is confirmed. “Theoretically speaking, if the trade uncertainty
    was what was making BTC outperform, it should stop outperforming after we hit
    the most important deal, which includes China.”Bitcoin performance since Trump’s
    “Liberation Day” tariff announcement. Source: Daan CryptoOn May 11, the White
    House announced that talks between the US and China regarding a trade deal have
    made “substantial progress.” However, no official agreement had been announced.Related:
    Bitcoin must close the week above this level to start 'price discovery 2'“We will
    be giving details tomorrow, but I can tell you that the talks were productive,”
    said US Treasury Secretary Scott Bessent.However, if Bitcoin keeps doing its thing
    and outperforming, “it’s safe to assume that tariffs likely have little direct
    impact on how BTC is treated or used,” Daan concluded. Markets await trade deal
    announcement Some analysts, however, believe that Bitcoin will likely jump if
    a trade deal comes through, along with potential rate cuts. “We believe that institutional
    investors are less apprehensive about investing in Bitcoin and crypto as US-China
    trade talks come to a conclusion and the likelihood of rate cuts increases,” Jeff
    Mei, chief operations officer at BTSE, told Cointelegraph. Meanwhile, Jupiter
    Zheng, researcher at HashKey Capital, said, “A US-China trade deal could signal
    stability in global markets, potentially driving investors to seek growth opportunities
    and send capital into alternative assets.”“Bitcoin could also see new highs as
    a result, particularly if the deal weakens the dollar or leads to renewed liquidity
    flows into emerging markets.”Analyst Will Clemente said on X that only a solid
    announcement of a trade deal is likely to keep momentum rolling. “Feels like you’re
    gonna need a real, tangible announcement on the China front to keep things moving
    here locally, momentum starting to stall out on BTC for the first time in a bit,”
    he said.  Magazine: Bitcoin eyes ‘crazy numbers,’ JD Vance set for Bitcoin talk:
    Hodler’s Digest\n\n            "

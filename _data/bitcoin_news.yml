- title: " Bitcoin treasury firms driving $200T hyperbitcoinization — Adam Back "
  url: https://cointelegraph.com/news/bitcoin-treasury-firms-front-running-200-t-hyperbitcoinization-adam-back?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Investment firms with Bitcoin-focused treasuries are front-running global
    Bitcoin adoption, which may see the world’s first cryptocurrency soar to a $200
    trillion market capitalization in the coming decade.Institutions and governments
    worldwide are starting to recognize the unique monetary properties of Bitcoin
    (BTC), according to Adam Back, co-founder and CEO of Blockstream and the inventor
    of Hashcash.“$MSTR and other treasury companies are an arbitrage of the dislocation
    between the bitcoin future and todays fiat world,” Back wrote in an April 26 X
    post.“A sustainable and scalable $100-$200 trillion trade front-running hyperbitcoinization.
    scalable enough for most big listed companies to move to btc treasury,” he added.Hyperbitcoinization
    refers to the theoretical future where Bitcoin soars to become the largest global
    currency, replacing fiat money due to its inflationary economics and growing distrust
    in the legacy financial system.Source: Adam BackRelated: Crypto sentiment recovers,
    but weekend liquidity risks remainBitcoin’s price outpacing fiat money inflation
    remains the main driver of global hyperbitcoinization, Back said, adding:“Some
    people think treasury strategy is a temporary glitch. i’m saying no it's a logical
    and sustainable arbitrage. but not for ever, the driver is bitcoin price going
    up over 4 year periods faster than interest and inflation.”Back’s comments come
    nearly two months after US President Donald Trump signed an executive order to
    establish a national Bitcoin reserve from BTC forfeited in government criminal
    cases.Related: Serbia’s Prince Filip says Bitcoin is being stifled, expects huge
    rallyGlobal firms continue Bitcoin accumulationContinued Bitcoin investments from
    the likes of Strategy, the largest corporate Bitcoin holder, may inspire more
    global firms to follow suit.Strategy’s approach is proving to be lucrative, with
    the firm’s Bitcoin treasury generating over $5.1 billion worth of profit since
    the beginning of 2025, according to Strategy’s co-founder, Michael Saylor.Source:
    Michael SaylorJapanese investment firm Metaplanet, also known as “Asia’s MicroStrategy,” 
    adopted a similar strategy, since surpassing 5,000 BTC in total holdings on April
    24, Cointelegraph reported.As Asia’s largest corporate Bitcoin holder, Metaplanet
    plans to acquire 21,000 BTC by 2026.US financial institutions may also have more
    confidence in adopting Bitcoin after the US Federal Reserve withdrew its 2022
    guidance discouraging banks from engaging with cryptocurrency. “Banks are now
    free to begin supporting Bitcoin,” Saylor said in response to the guidance withdrawal.“Banks
    will now be supervised through normal processes, signaling a more open regulatory
    environment for digital asset integration,” Nexo dispatch analyst Iliya Kalchev
    told Cointelegraph.Magazine: Altcoin season to hit in Q2? Mantra’s plan to win
    trust: Hodler’s Digest, April 13 – 19\n\n            "

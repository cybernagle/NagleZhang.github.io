- title: " Getting crypto out of the ‘AOL era’ — Sandeep Nailwal "
  url: https://cointelegraph.com/news/getting-crypto-out-aol-era-sandeep-nailwal?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "The current state of crypto is akin to the internet's “America Online”
    (AOL) era during the late 1990s, when the user experience was clunky, technical,
    featured limited use cases, and moved at dial-up speeds, according to Polygon
    co-founder Sandeep Nailwal.In an interview with Cointelegraph, Nailwal identified
    several key areas of development to improve user experience, including seamless
    fiat on- and off-ramps, custody solutions that feature key recovery, and hardware
    wallets built into mobile devices.\"We are in the dial-up era of the internet
    where even connecting to the Internet was a tedious task, like you had to be a
    mini-engineer to be able to connect to the Internet — we are still there in crypto.\"
    “We are probably still in 1998, and it is going to take at least 10 to 15 years
    to see crypto in its full glory,” the Polygon founder added.While considered revolutionary
    at the time, the AOL days of the internet featured limited functionality and a
    high barrier to entry. Source: PC MagazineThe internet took between 30-40 years
    to achieve mass adoption and began with a limited number of use cases. In the
    late 1990s, the AOL era of the internet was primarily focused on email and basic
    web browsing, but today, the internet encompasses the entire economy.Nailwal said
    that the current state of crypto is similar, with financial use cases, particularly
    market speculation, being the core focus of crypto at this time.However, once
    the financial use cases have been fully developed and achieved sufficient adoption,
    crypto adoption will spread to alternative use cases such as decentralized social
    media, gaming, and other niche sectors, he said.Related: Security concerns slow
    crypto payment adoption worldwide — SurveyBeing in crypto today is being early
    to the partyNailwal pointed out that even the base use case for cryptocurrencies,
    which is financial, has not been fully developed.According to a February 2025
    report from Bitcoin (BTC) financial services company River, only 4% of individuals
    worldwide own BTC — which is the original cryptocurrency with the largest market
    cap and has the most mainstream appeal.Bitcoin’s adoption path. Source: RiverThe
    report found that BTC has only achieved about 3% of its total adoption path when
    institutions, the total addressable market, and proper portfolio allocations are
    considered.This small number of BTC holders indicates that crypto mass adoption
    is still years away and signals that the entire industry is still in the early
    adopter phase of development.Magazine: They solved crypto’s janky UX problem —
    you just haven’t noticed yet\n\n            "
  published: 2025-03-27 22:15:00.000000000 +00:00
- title: " $16.5B in Bitcoin options expire on Friday — Will BTC price soar above
    $90K? "
  url: https://cointelegraph.com/news/16-5-b-in-bitcoin-options-expire-on-friday-will-btc-price-soar-above-90-k?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin (BTC) investors are preparing for the record-breaking $16.5 billion
    monthly options expiry on March 28. However, the actual market impact is expected
    to be more limited, as BTC's drop below $90,000 caught investors off guard and
    invalidated many bullish positions. This shift gives Bitcoin bears a crucial opportunity
    to escape a potential $3 billion loss, a factor that could significantly influence
    market dynamics in the coming weeks.Bitcoin options open interest for March 28,
    USD. Source: Laevitas.chCurrently, the total open interest for call (buy) options
    stands at $10.5 billion, while put (sell) options lag at $6 billion. However,
    $7.6 billion of these calls are set at $92,000 or higher, meaning Bitcoin would
    need a 6.4% gain from its current price to make them viable by the March 28 expiry.
    As a result, the advantage for bullish bets has significantly weakened.Bitcoin
    bulls pray for a “decoupling” if QE restarts Some analysts attribute Bitcoin’s
    weak performance to the ongoing global tariff war and US government spending cuts,
    which increase the risk of an economic recession. Traders worry about slower growth,
    particularly in the artificial intelligence sector, which had driven the S&P 500
    to a record high on Feb. 19 before falling 7%.S&P 500 futures (left) vs. Bitcoin/USD
    (right). Source: TradingView / CointelegraphMeanwhile, Bitcoin bulls remain hopeful
    for a decoupling from the stock market, despite the 40-day correlation staying
    above 70% since early March. Their optimism stems from the expansion of the monetary
    base by central banks and increased Bitcoin adoption by companies such as GameStop
    (GME), Rumble (RUM), Metaplanet (TYO:3350), and Semler Scientific (SMLR).As the
    options expiry date nears, bulls and bears each have a strong incentive to influence
    Bitcoin’s spot price. However, while bullish investors aim for levels above $92,000,
    their optimism alone is not enough to ensure BTC surpasses this mark. Deribit
    leads the options market with a 74% share, followed by the Chicago Mercantile
    Exchange (CME) at 8.5% and Binance at 8%.Given the current market dynamics, Bitcoin
    bulls hold a strategic advantage heading into the monthly options expiry. For
    instance, if Bitcoin remains at $86,500 by 8:00 am UTC on March 28, only $2 billion
    worth of put (sell) options will be in play. This situation incentivizes bears
    to drive Bitcoin below $84,000, which would increase the value of active put options
    to $2.6 billion.Related: Would GameStop buying Bitcoin help BTC price hit $200K?Bitcoin
    bulls will have the edge if BTC price passes $90,000Below are five probable scenarios
    based on current price trends. These outcomes estimate theoretical profits based
    on open interest imbalances but exclude complex strategies, such as selling put
    options to gain upside price exposure.Between $81,000 and $85,000: $2.7 billion
    in calls (buy) vs. $2.6 billion in puts (sell). The net result favors the call
    instruments by $100 million.Between $85,000 and $88,000: $3.3 billion calls vs.
    $2 billion puts, favoring calls by $1.3 billion.Between $88,000 and $90,000: $3.4
    billion calls vs. $1.8 billion puts. favoring calls by $1.6 billion.Between $90,000
    and $92,000: $4.4 billion calls vs. $1.4 billion puts, favoring calls by $3 billion.To
    minimize losses, bears must push Bitcoin below $84,000—a 3% drop—before the March
    28 expiry. This move would increase the value of put (sell) options, strengthening
    their position. Conversely, bulls can maximize their gains by driving BTC above
    $90,000, which could create enough momentum to establish a bullish trend for April,
    especially if inflows into spot Bitcoin exchange-traded funds (ETFs) resume at
    a strong pace.This article is for general information purposes and is not intended
    to be and should not be taken as legal or investment advice. The views, thoughts,
    and opinions expressed here are the author’s alone and do not necessarily reflect
    or represent the views and opinions of Cointelegraph.\n\n            "
  published: 2025-03-27 19:20:00.000000000 +00:00
- title: " GameStop wipes out $3B in market cap as stockholders question Bitcoin plan "
  url: https://cointelegraph.com/news/gamestop-loses-3b-market-cap-investors-bitcoin-buys?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "GameStop shed nearly $3 billion in market capitalization on March 27 as
    investors second-guessed the videogame retailer’s plans to stockpile Bitcoin (BTC),
    according to data from Google Finance. On March 26, GameStop tipped plans to use
    proceeds from a $1.3 billion convertible debt offering to buy Bitcoin — an increasingly
    popular strategy for public companies looking to boost share performance. GameStop’s
    announcement came a day after it proposed building a stockpile of cryptocurrencies,
    including Bitcoin and US dollar-pegged stablecoins. Investors initially celebrated
    the news, sending shares up 12% on March 26. Shareholders’ sentiment reversed
    on March 27, pushing GameStop’s stock, GME, down by nearly 24%, according to Google
    Finance. GameStop’s stock reversed gains on March 27. Source: Google FinanceRelated: GameStop
    buying Bitcoin would ‘bake the noodles’ of TradFi: Swan execChilly receptionAnalysts
    say the chilly reception reflects fears GameStop may be seeking to distract investors
    from deeper problems with its business model. “Investors are not necessarily optimistic
    on the underlying business,” Bret Kenwell, US investment analyst at eToro, told
    Reuters on March 27. “There are question marks with GameStop's model. If bitcoin
    is going to be the pivot, where does that leave everything else?”The sell-off
    also highlights investors’ more bearish outlook on Bitcoin as macroeconomic instability,
    including ongoing trade wars, weighs on the cryptocurrency’s spot price. Bitcoin
    is down around 7% year-to-date, hovering around $87,000 as of March 27, according
    to Google Finance.Bitcoin’s “price briefly jumped to $89,000 but has now reversed
    its trend,” Agne Linge, decentralized finance (DeFi) protocol WeFi’s head of growth,
    told Cointelegraph. Linge added that trade wars triggered by US President Donald
    Trump’s tariffs remain a concern for traders.Public companies are among the largest
    Bitcoin holders. Source: BitcoinTreasuries.NETCorporate Bitcoin treasuriesGameStop
    is a relative latecomer among public companies creating Bitcoin treasuries.In
    2024, rising Bitcoin prices sent shares of Strategy soaring more than 350%, according
    to data from FinanceCharts. Founded by Michael Saylor, Strategy has spent more
    than $30 billion buying BTC since pioneering corporate Bitcoin accumulation in
    2020, according to data from BitcoinTreasuries.NET.NET. Strategy’s success prompted
    dozens of other companies to build Bitcoin treasuries of their own. Public companies
    collectively hold nearly $58 billion of Bitcoin as of March 27, the data shows. Magazine: SEC’s
    U-turn on crypto leaves key questions unanswered\n\n            "
  published: 2025-03-27 18:59:54.000000000 +00:00
- title: " 3 reasons why Bitcoin price can’t take out the $90K resistance level "
  url: https://cointelegraph.com/news/3-reasons-why-bitcoin-price-can-t-take-out-the-90-k-resistance-level?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Since reaching a weekly high of $88,752 on March 24, Bitcoin (BTC) price
    has formed a series of lower highs and lower lows in the 1-hour time frame chart.
    As the end of the week approaches, Bitcoin price has failed to break above the
    $88,000 resistance, reducing the chance for a $90,000 retest before the end of
    Q1. Bitcoin 1-hour chart. Source: Cointelegraph/TradingViewWhat is keeping Bitcoin
    under $90K?One major reason for Bitcoin’s current price struggles is constant
    sell-side pressure from short-term holders (STHs) or investors holding coins for
    less than 155 days. Glassnode's “The Week On-chain” newsletter noted that the
    current Bitcoin cycle has witnessed a “top heavy” market where investors who purchased
    BTC at higher prices hold a significant portion of Bitcoin’s supply. As a result,
    the STH cohort have become the primary group facing the largest price drawdown
    since Bitcoin’s 30% correction from its all-time high. In the report, Glassnode
    analysts said,“Volume of Short-Term Holder supply held in loss surging to a massive
    3.4M BTC. This is the largest volume of STH supply in loss since July 2018.”Bitcoin
    total supply in loss held by STHs. Source: GlassnodeThe selling pressure faced
    by the short-term holders is reflected in Bitcoin’s accumulation trend score.
    Bitcoin’s accumulation trend score, a metric that quantifies selling pressure,
    remained below 0.1 since BTC price dropped from $108,000 to the $93,000-$97,000
    range. A score under 0.5 signals distribution (selling) instead of accumulation,
    and a sub-0.1 value highlights intense selling pressure.Another reason Bitcoin
    has struggled to break through the $90,000 threshold is due to the contraction
    of liquidity conditions. Data suggests that onchain transfer volumes have dropped
    to $5.2 billion daily, a steep 47% decline from the peak during the rally to all-time
    highs. Similarly, the active address count has also decreased by 18%, dropping
    from 950,000 in November 2024 to 780,000.At the same time, the open interest (OI)
    in the BTC futures market dropped 24% from $71.85 billion to $54.65 billion, with
    the perpetual futures funding rates also cooling down. This deleveraging and liquidity
    contraction—combined with only 2.5% of the total supply moving in profit during
    the correction—limits the market’s capacity to rally past $90k since there are
    insufficient buy orders to absorb sell orders.Related: Bitcoin price prediction
    markets bet BTC won't go higher than $138K in 2025New demand for Bitcoin continues
    to fallGlassnode data also highlighted that the current BTC bull cycle lacks new
    demand (buyers) entering the market, with the Cost Basis Distribution (CBD) Heatmap
    showing supply concentration at higher price levels ($100K-$108K) but no significant
    influx of buyers at lower levels to drive a price recovery. Bitcoin Euphoria Zone,
    Top Buyer Cost Basis. Source: GlassnodeThe lack of demand factor is compounded
    by macroeconomic uncertainty, which has discouraged new investors, as seen in
    the transition to net capital outflows when the 1-week to 1-month STH cost basis
    fell below the 1-month to 3-month cost basis. However, Glassnode analysts said,“The
    flip side of these observations is that the Long-Term Holder cohort still retains
    a substantial portion of the network wealth, holding almost 40% of invested value.”Essentially,
    these periods of prolonged accumulation can eventually constrict the supply and
    lead to better conditions for a new wave of demand once a stronger uptrend is
    established in the market. Related: Would GameStop buying Bitcoin help BTC price
    hit $200K?This article does not contain investment advice or recommendations.
    Every investment and trading move involves risk, and readers should conduct their
    own research when making a decision.\n\n            "
  published: 2025-03-27 18:19:37.000000000 +00:00
- title: " Bitcoin price rally stalls as gold nears record $3.1K "
  url: https://cointelegraph.com/news/bitcoin-price-rally-stalls-gold-passes-record-3-1-k?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin (BTC) faced mixed forces on March 27 as a combination of fresh
    US trade tariffs and macroeconomic data weighed on risk assets.BTC/USD 1-hour
    chart. Source: Cointelegraph/TradingViewGold leaves Bitcoin in the dust amid tariff
    woesData from Cointelegraph Markets Pro and TradingView showed BTC price volatility
    returning at the Wall Street open.BTC/USD displayed uncertain trading behavior
    in line with US stocks as the second revision of US Q4 GDP came in above the median
    forecast of 2.3%. At the same time, initial jobless claims fell short of estimates,
    potentially emboldening more hawkish financial policy from the Federal Reserve
    in the form of higher interest rates.However, the main talking point among market
    commentators was tariffs on non-US-made cars imposed by President Donald Trump.
    These added to existing concerns over a round of tariffs due to commence on April
    2.“These tariffs are going to have MASSIVE implications,” trading resource The
    Kobeissi Letter wrote in part of its response on X, noting the UK’s $10 billion
    auto export market to the US.Already sensitive to tariff surprises, risk assets
    thus failed to climb, with the clear winner from the latest news being gold.XAU/USD
    hit new all-time highs of $3,059 per ounce on the day, repeating an existing trend
    of gaining while Bitcoin treads water.“Gold has now added +$7 trillion of market
    cap over the last 12 months. It's also nearing $21 trillion in market cap for
    the first time in history,” Kobeissi added. “Gold is telling us something.”XAU/USD
    1-hour chart. Source: Cointelegraph/TradingViewBTC price gets $91,000 short-term
    targetSome positive BTC price perspectives nonetheless remained on the day.Related:
    Bitcoin price prediction markets bet BTC won't go higher than $138K in 2025Popular
    trader Titan of Crypto eyed a potential climb to $91,000 as part of an upside
    breakout from a “bullish pennant” on the 4-hour BTC/USD chart.BTC/USDT perpetual
    swaps 4-hour chart. Source: Titan of Crypto/XThis week, Titan of Crypto revealed
    a breakout on daily timeframes, ending a multimonth downtrend.Continuing on the
    latter theme, fellow trader Mikybull Crypto gave a BTC price target of $112,000.“Market
    structure is shifting – is the pump finally here?” another popular trading account,
    Merlijn The Trader, queried about the breakout.BTC/USD 1-day chart. Source: Mikybull
    Crypto/XThis article does not contain investment advice or recommendations. Every

- title: " Strategy&#039;s Michael Saylor hints at buying the Bitcoin dip "
  url: https://cointelegraph.com/news/michael-saylor-hints-buying-bitcoin-dip?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Strategy co-founder Michael Saylor signaled an impending Bitcoin (BTC)
    purchase by the company amid the recent dip from the all-time high of $112,000
    reached on May 22.\"I only buy Bitcoin with money I can't afford to lose,\" Saylor
    wrote to his 4.3 million followers in an X post.The company's most recent purchase
    of 7,390 BTC on May 19, valued at nearly $765 million, brought Strategy's total
    holdings to 576,230 BTC.If Strategy completes the acquisition on May 26, it will
    mark the company's seventh consecutive week of Bitcoin purchases.Strategy’s Bitcoin
    purchases over time and major metrics. Source: SaylorTrackerStrategy has become
    synonymous with Bitcoin, as the company continues stacking large amounts of BTC
    for its corporate treasury and inspiring other companies to pivot to a Bitcoin
    treasury plan, creating a sustained demand for the digital asset from institutional
    players and helping bolster the price of BTC.Related: Jim Chanos takes opposing
    bets on Bitcoin and StrategyBTC to propel Strategy into a $10 trillion enterprise,
    leaving other companies in the dust? Market analyst Jeff Walton recently said
    that Strategy may become a $10 trillion company and potentially command the title
    of the most valuable publicly traded corporation in the world due to its growing
    Bitcoin stockpile.“Strategy holds more of the best assets, and the most pristine
    collateral, on the entire planet than any other company, by multiples,” Walton
    told the Financial Times in a documentary about the company.The analyst added
    that most companies typically face challenges raising hundreds of millions of
    dollars in capital, but Strategy has been able to raise billions of dollars in

- title: " Robinhood shares up 8% after launching betting markets hub "
  url: https://cointelegraph.com/news/robinhood-launches-betting-markets-hub?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWE0ZGEtMmE5ZC03MGNiLTgzYjUtYzVkMGFiZTJiMzRm.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWE0ZGEtMmE5ZC03MGNiLTgzYjUtYzVkMGFiZTJiMzRm.jpg\"
    alt=\"Robinhood shares up 8% after launching betting markets hub\"></p><p>Robinhood
    has launched a betting markets hub as the online brokerage &mdash; best known
    for stock trading &mdash; expands its presence in emergent asset classes, including
    cryptocurrencies and event contracts, according to a March 17 announcement.&nbsp;<p>Robinhood&rsquo;s
    stock, HOOD, rose roughly 8% on the Nasdaq after the announcement, according to
    data from Google Finance. </p><p>The new betting feature will let users &ldquo;trade
    contracts for what the upper bound of the target fed funds rate will be in May,
    as well as the upcoming men&rsquo;s and women&rsquo;s College Basketball Tournaments,&rdquo;
    it <a data-ct-non-breakable=\"null\" href=\"https://newsroom.aboutrobinhood.com/robinhood-prediction-markets-hub/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://newsroom.aboutrobinhood.com/robinhood-prediction-markets-hub/\">said</a>.&nbsp;</p><figure><img
    alt=\"Cryptocurrencies, Betting, Stocks, Derivatives, Financial Derivatives, Robinhood\"
    src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a555-b22b-7039-88bb-e315ccc06ce7\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>HOOD&rsquo;s intraday
    performance on the Nasdaq on March 17. Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://www.google.com/finance/quote/HOOD:NASDAQ?sa=X&amp;ved=2ahUKEwjLuJyV3ZGMAxVoSDABHZVTHG0Q3ecFegQIOBAf\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://www.google.com/finance/quote/HOOD:NASDAQ?sa=X&amp;ved=2ahUKEwjLuJyV3ZGMAxVoSDABHZVTHG0Q3ecFegQIOBAf\"><em>Google
    Finance</em></a></p></figcaption></figure><p>The online brokerage is tapping Kalshi,
    the US&rsquo; first CFTC-regulated prediction platform, to operate the event contract
    platform, it said.&nbsp;</p><p>Kalshi is already registered to list dozens of
    event contracts, covering outcomes ranging from election results to Rotten Tomatoes
    movie ratings.</p><p>Prediction markets &ldquo;play an important role at the intersection
    of news, economics, politics, sports, and culture,&rdquo; JB Mackenzie, vice president
    and general manager of futures and international at Robinhood, said in a statement.&nbsp;</p><p>Experts
    say political betting markets often capture public sentiment <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/prediction-markets-polymarket-polls\" rel=\"null\"
    target=\"null\" text=\"null\" title=\"https://cointelegraph.com/news/prediction-markets-polymarket-polls\">more
    accurately than polls</a>. Platforms such as Kalshi and Polymarket accurately
    predicted US President Donald Trump&rsquo;s November election win even as polls
    indicated a tossup.</p><p><em><strong>Related: </strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/robinhood-surge-memecoin-plans-singapore-launch\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/news/robinhood-surge-memecoin-plans-singapore-launch\"><em><strong>Robinhood
    tips Singapore launch, touts memecoin interest: Report</strong></em></a></p><h2>Rising
    popularity</h2><p>Prediction markets have become increasingly popular in the US
    since September 2024, when Kalshi prevailed in a lawsuit challenging a CFTC decision
    to bar it from listing political event contracts.</p><p>By November, trading volumes
    across popular prediction markets neared $4 billion for <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/betting-volumes-near-4-billion-us-election-day\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/betting-volumes-near-4-billion-us-election-day\">contracts
    tied to the US elections</a>.</p><p>Robinhood <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/robinhood-presidential-elections-contracts-kamala-harris-donald-trump\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/robinhood-presidential-elections-contracts-kamala-harris-donald-trump\">tested
    the waters of political event contracts</a> in October when it started letting
    certain users bet on the outcome of the presidential election between former Vice
    President Kamala Harris and Trump.</p><p>In February, Robinhood <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/robinhood-suspends-super-bowl-bets-cftc-request\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/robinhood-suspends-super-bowl-bets-cftc-request\">suspended
    Super Bowl betting</a> after receiving a request from the CFTC to nix its customers&rsquo;
    access to the event contracts.</p><h2>Beyond stock trading</h2><p>Robinhood has
    been expanding its footprint in emerging asset classes, including cryptocurrencies
    and derivatives.&nbsp;</p><p>On March 13, the <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/robinhood-lists-pengu-popcat-memecoins-crypto-ramp-up\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/robinhood-lists-pengu-popcat-memecoins-crypto-ramp-up\">company
    listed memecoins</a> like Pengu (PENGU), Pnut (PNUT) and Popcat&nbsp;(<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/popcat-sol-price-index\" rel=\"\" target=\"_self\"
    text=\"null\" title=\"https://cointelegraph.com/popcat-sol-price-index\">POPCAT</a>)
    in a bid to expand its presence in crypto.&nbsp;Back in January, it <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/robinhood-tips-planned-bitcoin-futures-launch\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/robinhood-tips-planned-bitcoin-futures-launch\">rolled
    out futures contracts</a> tied to cryptocurrencies such as Bitcoin (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/bitcoin-price\" rel=\"\" target=\"_self\" text=\"null\"
    title=\"https://cointelegraph.com/bitcoin-price\">BTC</a>).</p><p>Robihood&rsquo;s
    latest earnings report shows the firm posted a 700% year-over-year <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/coinbase-robinhood-crush-estimates-analysts-raise-targets\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">jump in crypto revenues</a>
    in the fourth quarter of 2024 as <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/trump-declares-victory-crypto-community\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Trump&rsquo;s election
    win</a> and <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-price-hits-100-000-first-time-new-all-time-high\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">rising market prices</a>
    fueled boosted crypto trading.</p><p><em><strong>X Hall of Flame: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/celeb-memecoin-hype-defi-comeback-waves-sasha-ivanov-x-hall-of-flame/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/magazine/celeb-memecoin-hype-defi-comeback-waves-sasha-ivanov-x-hall-of-flame/\"><em><strong>Memecoins
    will die and DeFi will rise again &mdash; Sasha Ivanov</strong></em></a>&nbsp;</p><template
    data-name=\"subscription_form\" data-type=\"markets_outlook\" label=\"Subscription
    Form: Markets Outlook\"></template></p>\n</p>\n            "
  published: 2025-03-17 18:40:00 UTC
- title: " Price analysis 3/17: SPX, DXY, BTC, ETH, XRP, BNB, SOL, DOGE, ADA, PI "
  url: https://cointelegraph.com/news/price-analysis-3-17-spx-dxy-btc-eth-xrp-bnb-sol-doge-ada-pi?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWE0ZjMtNmM0Zi03Nzc2LTliYmEtZDc0ZmYyMDJiNTNi.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWE0ZjMtNmM0Zi03Nzc2LTliYmEtZDc0ZmYyMDJiNTNi.jpg\"
    alt=\"Price analysis 3/17: SPX, DXY, BTC, ETH, XRP, BNB, SOL, DOGE, ADA, PI\"></p><p>Bitcoin
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>) has largely
    stayed above $80,000 since March 11, indicating that the bulls are not waiting
    for a deeper correction to buy. However, the failure to propel the price above
    $86,000 shows that the bears have not given up and continue to sell on rallies.<p>CoinShares&rsquo;
    weekly report shows that cryptocurrency exchange-traded products (ETPs) <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/crypto-etps-see-1-7b-outflows-fifth-week-in-row\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">witnessed $1.7 billion
    in outflows last week</a>. That takes the total five-week outflows to $6.4 billion.
    Additionally, the streak of outflows has reached 17 days, marking the longest
    negative streak since CoinShares records began in 2015.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a4e7-398e-7819-9749-78bbceae99e9\"
    title=\"\" alt=\"Price analysis 3/17: SPX, DXY, BTC, ETH, XRP, BNB, SOL, DOGE,
    ADA, PI\"><figcaption style=\"text-align: center;\"><p><em>Daily cryptocurrency
    market performance. Source: </em><a data-ct-non-breakable=\"null\" href=\"https://coin360.com\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://coin360.com\"><em>Coin360</em></a></p></figcaption></figure><p>It&rsquo;s
    not all gloom and doom for the long-term investors. CryptoQuant contributor ShayanBTC
    said that investors who purchased Bitcoin between three and six months ago are
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/peak-fud-70k-floor-5-things-bitcoin-this-week\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">showing an accumulation
    pattern</a>. Historically, similar behavior has &ldquo;played a crucial role in
    forming market bottoms and igniting new uptrends.&rdquo;&nbsp;</p><p>Will buyers
    succeed in catapulting Bitcoin above the overhead resistance levels? How are the
    altcoins placed? Let&rsquo;s analyze the charts to find out.</p><h2>S&amp;P 500
    Index price analysis</h2><p>The S&amp;P 500 Index (SPX) is in a strong corrective
    phase. The fall to 5,504 on March 13 sent the relative strength index (RSI) into
    the oversold territory, signaling a possible relief rally in the near term.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a4e7-4440-7d73-b653-e3c200418a78\"
    title=\"\" alt=\"Price analysis 3/17: SPX, DXY, BTC, ETH, XRP, BNB, SOL, DOGE,
    ADA, PI\"><figcaption style=\"text-align: center;\"><p><em>SPX daily chart. Source:
    Cointelegraph/TradingView</em></p></figcaption></figure><p>The bears will try
    to halt the recovery in the 5,670 to 5,773 resistance zone. If they succeed, it
    will signal that the sentiment remains negative and traders are selling on rallies.
    That heightens the risk of a fall to 5,400. The bulls are expected to defend the
    5,400 level with all their might because a drop below it may sink the index to
    5,100.</p><p>On the upside, a break and close above the 20-day exponential moving
    average (5,780) will signal strength. The index may then climb to the 50-day simple
    moving average (5,938).</p><h2>US Dollar Index price analysis</h2><p>The weak
    rebound off the 103.37 support in the US Dollar Index (DXY) suggests that the
    bears have kept up the pressure.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a4e7-4f57-766e-9837-e8309c1e120a\"
    title=\"\" alt=\"Price analysis 3/17: SPX, DXY, BTC, ETH, XRP, BNB, SOL, DOGE,
    ADA, PI\"><figcaption style=\"text-align: center;\"><p><em>DXY daily chart. Source:
    Cointelegraph/TradingView</em></p></figcaption></figure><p>Sellers are trying
    to sink the index below 103.37. If they can pull it off, the decline could extend
    to 102 and thereafter to 101.</p><p>Conversely, if the price turns up from the
    current level and breaks above 104, it will signal that buyers are trying to make
    a comeback. The index could rise to the 20-day EMA (105), which is likely to attract
    sellers. If buyers do not cede much ground to the bears, the prospects of a break
    above the 20-day EMA increase. The index could then rally to the 50-day SMA (107).</p><h2>Bitcoin
    price analysis</h2><p>Bitcoin has been trying to form a higher low in the near
    term, building strength to cross above the 200-day SMA ($84,112).</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a4e7-5c8a-72f3-9ff6-8ceb17e7e293\"
    title=\"\" alt=\"Price analysis 3/17: SPX, DXY, BTC, ETH, XRP, BNB, SOL, DOGE,
    ADA, PI\"><figcaption style=\"text-align: center;\"><p><em>BTC/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The positive
    divergence on the RSI suggests that the bearish momentum is weakening. If buyers
    drive the price above the 20-day EMA ($85,808), the BTC/USDT pair could rise to
    the 50-day SMA ($92,621).</p><p>Contrary to this assumption, if the price turns
    down sharply from the 200-day SMA, it will indicate that the bears are trying
    to flip the level into resistance. The pair may slide to $80,000 and next to $76,606.</p><h2>Ether
    price analysis</h2><p>Ether (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/ethereum-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">ETH</a>) has been trading
    between $1,963 and $1,821, signaling a lack of aggressive buying at current levels.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a4e7-66fb-7050-b33b-029455bf18f1\"
    title=\"\" alt=\"Price analysis 3/17: SPX, DXY, BTC, ETH, XRP, BNB, SOL, DOGE,
    ADA, PI\"><figcaption style=\"text-align: center;\"><p><em>ETH/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>If the price
    dips below the $1,821 to $1,754 support zone, it will indicate the resumption
    of the downtrend. The ETH/USDT pair may then nosedive to the next significant
    support at $1,550.</p><p>This negative view will be invalidated in the near term
    if the price turns up and breaks above the 20-day EMA ($2,107). The pair could
    ascend to the 50-day SMA ($2,514), where the bears are likely to sell aggressively.
    However, if the bulls pierce the 50-day SMA resistance, the pair may rally to
    $2,857.</p><h2>XRP price analysis</h2><p>XRP (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/xrp-price-index\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">XRP</a>) turned down from the 50-day SMA ($2.51)
    on March 15, indicating that the bears are active at higher levels.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a4e7-734e-7b7c-82c4-431e920d8808\"
    title=\"\" alt=\"Price analysis 3/17: SPX, DXY, BTC, ETH, XRP, BNB, SOL, DOGE,
    ADA, PI\"><figcaption style=\"text-align: center;\"><p><em>XRP/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The 20-day
    EMA ($2.34) has flattened out, and the RSI is near the midpoint, indicating a
    balance between supply and demand. The XRP/USDT pair could remain stuck between
    the 50-day SMA and $2 for some time.</p><p>If the price turns up from the current
    level and breaks above the 50-day SMA, it will clear the path for a potential
    rally to $3. Instead, a break and close below $2 will complete a head-and-shoulders
    pattern. The pair may then tumble to $1.28.</p><h2>BNB price analysis</h2><p>BNB
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/binance-coin-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BNB</a>) turned up from
    the 20-day EMA ($598) and rose above the 50-day SMA ($620), indicating that the
    correction may be ending.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a4e7-7eba-75fe-a44d-fc4df0ce0590\"
    title=\"\" alt=\"Price analysis 3/17: SPX, DXY, BTC, ETH, XRP, BNB, SOL, DOGE,
    ADA, PI\"><figcaption style=\"text-align: center;\"><p><em>BNB/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The 20-day
    EMA has started to turn up, and the RSI has risen into positive territory, indicating
    a slight advantage to the bulls. If the price sustains above the 50-day SMA, the
    BNB/USDT pair could rally to $686 and eventually to $745.</p><p>The 20-day EMA
    is the critical support to watch out for on the downside. A break and close below
    the 20-day EMA will signal that the bears have seized control. The pair may then
    descend to the strong support at $500.</p><h2>Solana price analysis</h2><p>Solana
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/solana-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">SOL</a>) turned down
    from the 20-day EMA ($139) on March 16, signaling that bears are aggressively
    defending the level.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a4e7-89bc-7b3f-81ad-8e71bc0f2afa\"
    title=\"\" alt=\"Price analysis 3/17: SPX, DXY, BTC, ETH, XRP, BNB, SOL, DOGE,
    ADA, PI\"><figcaption style=\"text-align: center;\"><p><em>SOL/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The SOL/USDT
    pair could drop to $120 and then to $110, where buyers are expected to step in.
    If the price rebounds off the support zone, the bulls will again try to drive
    the SOL/USDT pair above the 20-day EMA. If they manage to do that, the pair could
    climb to $180.</p><p>This positive view will be invalidated in the near term if
    the price continues lower and breaks below the support zone. That may start a
    downward move to $100 and subsequently to $80.</p><p><em><strong>Related: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/ethereum-onchain-data-2k-eth-price-out-of-reach\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Ethereum
    onchain data suggests $2K ETH price is out of reach for now</strong></em></a></p><h2>Dogecoin
    price analysis</h2><p>Dogecoin (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/doge-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">DOGE</a>) has been gradually
    rising toward the 20-day EMA ($0.19), which is an important near-term resistance
    to watch out for.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a4e7-981a-7516-bda9-f58ea2b1166c\"
    title=\"\" alt=\"Price analysis 3/17: SPX, DXY, BTC, ETH, XRP, BNB, SOL, DOGE,
    ADA, PI\"><figcaption style=\"text-align: center;\"><p><em>DOGE/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>If the price
    turns down sharply from the 20-day EMA, it suggests that bears are selling on
    every minor rally. That heightens the risk of a break below the $0.14 support.
    If that happens, the DOGE/USDT pair could plunge to $0.10.</p><p>Contrarily, a
    break and close above the 20-day EMA indicates that the selling pressure is reducing.
    The pair could rise to the 50-day SMA ($0.23) and later to $0.29. A break and
    close above $0.29 suggests that buyers are back in the driver&rsquo;s seat.</p><h2>Cardano
    price analysis</h2><p>Cardano (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/ada-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">ADA</a>) has been trading
    below the 20-day EMA ($0.76) since March 8, but the bears have failed to sink
    the pair to the uptrend line. This suggests that selling dries up at lower levels.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a4e7-a4cb-743f-a024-34165ec76c44\"
    title=\"\" alt=\"Price analysis 3/17: SPX, DXY, BTC, ETH, XRP, BNB, SOL, DOGE,
    ADA, PI\"><figcaption style=\"text-align: center;\"><p><em>ADA/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>Buyers will
    have to drive the price above the moving averages to start a sustained recovery.
    The ADA/USDT pair could climb to $1.02, where the bears may again mount a strong
    defense.</p><p>Contrary to this assumption, if the price turns down from the moving
    averages, it will suggest that bears remain in control. That increases the likelihood
    of a drop below the uptrend line. If that happens, the pair may plummet to $0.50.</p><h2>Pi
    price analysis</h2><p>Pi (PI) has been gradually sliding toward the $1.23 support,
    which is likely to attract buying from the bulls.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a4e7-b0ff-700c-9234-cf19accbec75\"
    title=\"\" alt=\"Price analysis 3/17: SPX, DXY, BTC, ETH, XRP, BNB, SOL, DOGE,
    ADA, PI\"><figcaption style=\"text-align: center;\"><p><em>PI/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>If the price
    rebounds off $1.23 with strength, the PI/USDT pair could attempt a move back toward
    $1.80. Sellers are expected to pose a strong challenge at $1.80, but if the bulls
    prevail, the pair could rally to $2 and thereafter to $2.35.</p><p>Contrarily,
    if the price turns down from $1.80, it will signal a range formation. The pair
    may swing between $1.23 and $1.80 for a while. Sellers will strengthen their position
    on a break below $1.23. The pair may then collapse to the 78.6% retracement level
    of $0.72.</p><p class=\"post-content__disclaimer\" type=\"\">This article does
    not contain investment advice or recommendations. Every investment and trading
    move involves risk, and readers should conduct their own research when making
    a decision.</p><template data-name=\"subscription_form\" data-type=\"markets_outlook\"
    label=\"Subscription Form: Markets Outlook\"></template><p><br></p></p>\n</p>\n

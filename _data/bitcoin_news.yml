    the upmove.Crypto market data daily view. Source: Coin360BitMEX co-founder and
    Maelstrom chief investment officer Arthur Hayes said in a post that if the Federal
    Reserve pivots to quantitative easing, then Bitcoin could rally to $250,000 by
    year-end.Could Bitcoin break above the $89,000 overhead resistance, starting a
    rally in select altcoins? Let’s analyze the charts of the top 10 cryptocurrencies
    to find out.Bitcoin price analysisBitcoin has risen close to the resistance line,
    where the sellers are expected to pose a solid challenge.BTC/USDT daily chart.

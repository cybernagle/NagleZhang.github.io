- title: " Here’s what happened in crypto today "
  url: https://cointelegraph.com/news/what-happened-in-crypto-today?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Today in crypto, Robinhood is planning a new blockchain for tokenized
    securities offering in Europe. Meanwhile, Ethereum developers have activated the
    network’s Pectra upgrade, introducing smart accounts and other features. In US
    politics, Democrats have launched a new offensive targeting Donald Trump’s crypto
    ventures.Robinhood plans blockchain for US asset trading in Europe — ReportBrokerage
    fintech Robinhood is reportedly developing a blockchain network that will enable
    retail investors in Europe to trade US securities.According to a May 7 Bloomberg
    report citing sources familiar with the matter, the move seeks to expand the company's
    local presence by offering trading of tokenized securities, such as stocks.Two
    crypto firms, Arbitrum and the Solana Foundation, are reportedly vying to become
    partners in the project. Tokenization is the process of turning real-world assets,
    like stocks, real estate, or commodities, into digital tokens that can be traded
    on a blockchain.Tokenizing securities instead of providing direct exposure can
    offer several advantages: reduced costs by eliminating traditional financial infrastructure,
    enhanced accessibility, faster settlement times, and quicker transactions. More
    brokerages and investment firms are exploring asset tokenization.Robinhood has
    been preparing to enter the European market. In April 2025, it acquired a brokerage
    license in Lithuania that allows the firm to offer investment services throughout
    the European Union. Robinhood has also inked a deal in 2024 to purchase crypto
    exchange Bitstamp.Ethereum’s “Pectra” network upgrade goes liveEthereum — the
    network that unleashed smart contracts on the world — moves on to the next chapter
    with today’s Pectra upgrade, but what does it mean?Pectra went live on the Ethereum
    mainnet at the start of epoch 364032, May 7, 2025, at about 10:00 am UTC. The
    three main EIPs included are EIP-7702, EIP-7251 and EIP-7691.Source: Ethereum.orgEIP-7702
    allows externally owned accounts to act as smart contracts and cover gas expenses
    (transaction fees) and payments in tokens that are not Ether (ETH). EIP-7251 increases
    the validator staking limit from 32 ETH to 2,048 ETH, which makes operations for
    large stakers easier and simpler.Finally, EIP-7691 increases the number of data
    blobs per block, which allows for better layer-2 scalability and potentially significantly
    reduces transaction fees. Sergej Kunz, co-founder of Ethereum decentralized exchange
    (DEX) aggregator 1inch, said Pectra “introduces ‘smart account’ functionality”
    at deeper protocol levels and “improves Ethereum’s scalability” through layer-2
    solutions.Democrats aim at Trump’s crypto profits with a 3-prong pincer moveUS
    Democrat lawmakers have launched a multi-angle attack on President Donald Trump’s
    crypto ventures with two bills and a subcommittee inquiry aimed at cutting his
    ability to profit from the initiatives.   The Modern Emoluments and Malfeasance
    Enforcement Act, or the MEME Act, aims to prevent federal officials from using
    their position to profit from memecoins, Democrat Senator Chris Murphy said in
    a May 6 statement. With his cryptocurrency schemes, Trump is putting a for sale
    sign in front of the White House. That’s why, as Ranking Member of the Permanent
    Subcommittee on Investigations, I’m launching an inquiry into this brazen corruption
    whose scope & scale is staggering. pic.twitter.com/3SiaCrthN8— Richard Blumenthal
    (@SenBlumenthal) May 6, 2025If passed, the MEME Act prohibits the president, vice
    president, members of Congress, senior executive branch officials, their spouses
    and children from issuing, sponsoring, or promoting a security, future, commodity,
    or digital asset, according to the bill’s description. US Representative Sam Liccardo,
    another Democrat, introduced companion legislation in the House of Representatives.
    However, Trump’s party, the Republicans, controls both chambers, and the legislation
    will need Republican support. Meanwhile, Democratic Senator Richard Blumenthal,
    a ranking member of the Permanent Subcommittee on Investigations (PSI), said in
    a May 6 statement that the committee is opening a preliminary inquiry into the
    Official Trump (TRUMP) token, Trump-backed platform World Liberty Financial (WLFI),
    and other associated business ventures. \n\n            "

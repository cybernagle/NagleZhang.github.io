- title: " Twitter User Claims TradingView Has Ignored a Fibonacci Retracement Bug
    for 5 Years "
  url: https://cointelegraph.com/news/twitter-user-claims-tradingview-has-ignored-a-fibonacci-retracement-bug-for-5-years?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\nUpdate: the CTO of TradingView told Cointelegraph in comments that the
    reports of a bug were inaccurate, and the Twitter user partially withdrew his
    earlier claims that the tool was broken.\nPopular chart analysis service TradingView
    reportedly contains a bug in the Fibonacci retracement technical analysis tool,
    according to a tweet by self-proclaimed certified Elliott wave analyst Cryptoteddybear

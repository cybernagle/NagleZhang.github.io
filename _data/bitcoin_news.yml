- title: " Burning quantum-vulnerable BTC is the best option — Jameson Lopp "
  url: https://cointelegraph.com/news/burning-quantum-vulnerable-btc-best-option-jameson-lopp?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMTIvMDE5M2FmNjgtMzQ5NC03OTEyLTk3NDktMjEwZmE4MWYxYWJh.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjQtMTIvMDE5M2FmNjgtMzQ5NC03OTEyLTk3NDktMjEwZmE4MWYxYWJh.jpg\"
    alt=\"Burning quantum-vulnerable BTC is the best option — Jameson Lopp\"></p><p>Jameson
    Lopp, the chief security officer at Bitcoin (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/bitcoin-price\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">BTC</a>) custody company Casa, recently argued against
    allowing quantum recovery of lost BTC and said that burning these coins to protect
    the integrity of the protocol was the preferable option.<p>According to Lopp,
    allowing individuals or institutions with <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/quantum-computing-bitcoin-lost-wallet-threat-tether-ceo\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">quantum computers to
    recover lost coins</a> violates the Bitcoin network's properties of censorship
    resistance, transaction immutability, and conservatism.</p><p>In a March 16 <a
    data-ct-non-breakable=\"null\" href=\"https://blog.lopp.net/against-quantum-recovery-of-bitcoin/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">article</a>, the crypto
    executive wrote that allowing quantum recovery is not good for anyone. Lopp added:</p><blockquote>\"Allowing
    quantum recovery of bitcoin is tantamount to wealth redistribution. What we would
    be allowing is for bitcoin to be redistributed from those who are ignorant of
    quantum computers to those who have won the technological race to acquire quantum
    computers.\"</blockquote><p>\"It is hard to see a bright side to that scenario,\"
    the executive continued before concluding that quantum recovery can only harm
    the security of the Bitcoin network.</p><p>The <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/learn/articles/cryptocurrency-vs-quantum-computing-a-deep-dive-into-the-future-of-cryptocurrencies\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">threat posed by quantum
    computers</a> to Bitcoin continues to be hotly debated, with some arguing that
    the <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/quantum-computing-fortify-bitcoin-signatures-adam-back\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">threat to modern encryption
    is decades away</a>, others arguing that quantum computers will never be practical,
    and some warning that the threat is imminent.</p><figure><img alt=\"Bitcoin Mining,
    Quantum Computing\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a07a-f04b-7437-a7c7-a61f8ebf918d\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Jameson Lopp discusses
    the risks posed by quantum computers at the Future of Bitcoin Conference in 2024.
    Source: </em><a data-ct-non-breakable=\"null\" href=\"https://www.youtube.com/watch?v=MTUzpR_mxAg&amp;t=9s\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://www.youtube.com/watch?v=MTUzpR_mxAg&amp;t=9s\"><em>Future
    of Bitcoin Conference</em></a></p></figcaption></figure><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/crypto-quantum-computing-collision-microsoft-new-chip\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Crypto,
    quantum computing on collision course as Microsoft debuts new chip</strong></em></a></p><h2>The
    great quantum scare of 2024</h2><p>In October 2024, researchers at Shanghai University
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/scientists-breach-crypto-algorithms-quantum-computer-report\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">claimed they broke encryption
    standards</a> used in military and banking applications using a quantum computer.</p><p>However,
    YouTuber \"Mental Outlaw\" later asserted that these claims were overblown and
    that the researchers <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/china-has-not-cracked-encryption-mental-outlaw\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">did not break modern
    encryption standards</a>.</p><p>The YouTuber said that the quantum computer used
    by the research team could only factorize the integer 2,269,753, which set a new
    record for quantum computers but still lagged behind some classical computers.</p><p>Mental
    Outlaw added that the device used in the experiment could only break a 22-bit
    key, while the record set by a classical computer was breaking an 892-bit key.</p><p>Modern
    encryption key sizes can range anywhere between 2048 to 4096 bits, with the option
    of extending key sizes in the future to make them even more secure.</p><p><em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/bitcoin-quantum-computer-threat-timeline-solutions-2024-2035/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Bitcoin
    vs. the quantum computer threat: Timeline and solutions (2025&ndash;2035)</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"consulting_newsletter\" label=\"Subscription
    Form: Consulting Newsletter\"></template></p>\n</p>\n            "
  published: 2025-03-16 19:48:38 UTC
- title: " Bitcoin reclaims $80K zone as BNB, TON, GT, ATOM hint at altcoin season "
  url: https://cointelegraph.com/news/bitcoin-reclaims-80-k-zone-as-bnb-ton-gt-atom-hint-at-altcoin-season?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTlmZTItNjRlNi03OTFjLTlmYjktZDRhOGMyOGY3OTk0.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTlmZTItNjRlNi03OTFjLTlmYjktZDRhOGMyOGY3OTk0.jpg\"
    alt=\"Bitcoin reclaims $80K zone as BNB, TON, GT, ATOM hint at altcoin season\"></p><p>Bitcoin
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>) is struggling
    to break above the 200-day simple moving average ($84,000), but a positive sign
    is that the bulls have not ceded much ground to the bears. Bitget Research chief
    analyst Ryan Lee told Cointelegraph that Bitcoin needs to achieve a <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-weekly-close-81-k-avoid-downside-ahead-of-fomc\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">weekly close above $81,000</a>
    to signal resilience. Selling could accelerate if the price plummets below $76,000.<p>Another
    cautious voice was that of Markus Thielen, head crypto researcher at 10x Research.
    Thielen told Cointelegraph that Bitcoin&rsquo;s chart structure &ldquo;suggests
    market indecision rather than a straightforward bullish consolidation.&rdquo;
    Thielen remains <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-consolidation-phase-repeat-2024-price-action-possible-crypto-analyst\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">doubtful of a strong
    price recovery in Bitcoin</a> at the current juncture.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01959fd4-b0b9-7032-a5a1-15aad352a7ca\"
    title=\"\" alt=\"Bitcoin reclaims $80K zone as BNB, TON, GT, ATOM hint at altcoin
    season\"><figcaption style=\"text-align: center;\"><p><em>Crypto market data daily
    view. Source: </em><a data-ct-non-breakable=\"null\" href=\"https://coin360.com\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://coin360.com\"><em>Coin360</em></a></p></figcaption></figure><p>However,
    Bitcoin network economist Timothy Peterson has a different view. In an X post,
    Peterson said that April and October are the two months that generate a <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-gets-126k-june-target-data-predicts-bull-market-comeback\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">large portion of Bitcoin&rsquo;s
    annual performance</a>. That suggests Bitcoin could rise to a &ldquo;new all-time
    high before June.&rdquo;</p><p>Could buyers drive Bitcoin above the short-term
    overhead resistance levels? If they do, what other top cryptocurrencies may rally
    in the near term?</p><h2>Bitcoin price analysis</h2><p>The downsloping 20-day
    exponential moving average ($86,188) suggests that bears are in command, but the
    positive divergence on the relative strength index (RSI) indicates that the selling
    pressure is reducing.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01959fd2-ea83-74ff-afeb-9987266462b5\"
    title=\"\" alt=\"Bitcoin reclaims $80K zone as BNB, TON, GT, ATOM hint at altcoin
    season\"><figcaption style=\"text-align: center;\"><p><em>BTC/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>If the price
    turns down from the current level, the BTC/USDT pair could drop to $80,000 and
    then to $76,606.&nbsp;</p><p>Contrarily, if the price turns up and breaks above
    the 20-day EMA, it will signal that the markets have rejected the breakdown below
    the 200-day SMA. The pair could rally to the 50-day SMA ($93,033) and, after that,
    to $100,000. Buyers may find it difficult to surpass the psychological barrier
    at $100,000.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01959fd2-f61b-7f82-8d3f-371e8d17b689\"
    title=\"\" alt=\"Bitcoin reclaims $80K zone as BNB, TON, GT, ATOM hint at altcoin
    season\"><figcaption style=\"text-align: center;\"><p><em>BTC/USDT 4-hour chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The 20-EMA
    on the 4-hour chart is flattening out, and the RSI is just above the midpoint,
    indicating a balance between supply and demand. Buyers will have to drive the
    pair above the resistance line to gain the upper hand. The pair may climb to $92,810
    and then to $95,000.</p><p>The downside support is at $80,000 and next at $78,000.
    If the supports crack, the possibility of a drop below $76,606 increases.&nbsp;</p><h2>BNB
    price analysis</h2><p>BNB (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/binance-coin-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BNB</a>) started a recovery
    from $507 on March 11, which is facing selling at the 50-day SMA ($621).</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01959fd3-00a0-7e04-b84a-b51947b773ed\"
    title=\"\" alt=\"Bitcoin reclaims $80K zone as BNB, TON, GT, ATOM hint at altcoin
    season\"><figcaption style=\"text-align: center;\"><p><em>BNB/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The 20-day
    EMA ($595) is the critical near-term support to watch out for. If the price rebounds
    off the 20-day EMA, it suggests that the bulls are buying on minor dips. That
    improves the prospects of a break above the 50-day SMA. The BNB/USDT pair could
    then rally toward $686.</p><p>Contrary to this assumption, if the price turns
    down and breaks below the 20-day EMA, it will indicate that the bears are fiercely
    defending the 50-day SMA. The pair may tumble to $550.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01959fd3-0b05-7e81-ae37-eb6ad163941b\"
    title=\"\" alt=\"Bitcoin reclaims $80K zone as BNB, TON, GT, ATOM hint at altcoin
    season\"><figcaption style=\"text-align: center;\"><p><em>BNB/USDT 4-hour chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The 20-EMA
    has turned up on the 4-hour chart, and the RSI is in the positive zone, indicating
    a bullish sentiment. There is resistance at $632, but if buyers overcome it, the
    pair could jump to $680.</p><p>This optimistic view will be negated in the near
    term if the price turns down and breaks below the 20-EMA. The pair may dip to
    the 50-SMA, which is again likely to attract buyers. A break below the 50-SMA
    will tilt the advantage in favor of the bears.</p><h2>Toncoin price analysis</h2><p>Toncoin
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/toncoin-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">TON</a>) rose sharply
    from $2.35 on March 11 and reached the 50-day SMA ($3.64) on March 16.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01959fd3-1590-7e78-8487-f2ce0a6ed054\"
    title=\"\" alt=\"Bitcoin reclaims $80K zone as BNB, TON, GT, ATOM hint at altcoin
    season\"><figcaption style=\"text-align: center;\"><p><em>TON/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The correction
    from the 50-day SMA is expected to find support at the 20-day EMA ($3.15). If
    that happens, it will signal a change in sentiment from selling on rallies to
    buying on dips. That increases the possibility of a rally above the 50-day SMA.
    The TON/USDT pair could climb to $4 and later to $5.</p><p>Contrarily, a break
    and close below the 20-day EMA suggests that the bears remain active at higher
    levels. The pair may then drop toward $2.50.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01959fd3-2074-7691-8a0e-0195bb987018\"
    title=\"\" alt=\"Bitcoin reclaims $80K zone as BNB, TON, GT, ATOM hint at altcoin
    season\"><figcaption style=\"text-align: center;\"><p><em>TON/USDT 4-hour chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The 4-hour
    chart shows the up move is facing selling at the $3.60 level, but buyers are expected
    to defend the 20-EMA on declines. If the price turns up sharply from the 20-EMA,
    the bulls will try to propel the price above $4.15. If they manage to do that,
    the pair could jump toward $4.67.</p><p>Conversely, if the price turns down and
    breaks below the 20-EMA, it will signal that the bears remain active at higher
    levels. The pair may drop to the 50-SMA and subsequently to $2.50.</p><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/toncoin-great-entry-zone-pavel-durov-france-ton-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Toncoin
    in 'great entry zone' as Pavel Durov's France exit fuels TON price rally</strong></em></a></p><h2>Gate
    Token price analysis</h2><p>Gate Token (GT) has formed a symmetrical triangle
    pattern, indicating indecision between the bulls and the bears.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01959fd3-2b7c-7216-a667-a529da8866cf\"
    title=\"\" alt=\"Bitcoin reclaims $80K zone as BNB, TON, GT, ATOM hint at altcoin
    season\"><figcaption style=\"text-align: center;\"><p><em>GT/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The 20-day
    EMA ($21.06) is flattening out, and the RSI has risen to the midpoint, indicating
    that the selling pressure is reducing. If buyers drive the price above the triangle,
    it will signal the resumption of the upmove. The GT/USDT pair could climb to $24
    and eventually to $26.</p><p>If the price continues lower and closes below the
    20-day EMA, it will signal that the pair may remain inside the triangle for a
    while. The bears will be back in command on a break below the triangle.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01959fd3-3622-74bd-bda0-5e9a8fab2bc1\"
    title=\"\" alt=\"Bitcoin reclaims $80K zone as BNB, TON, GT, ATOM hint at altcoin
    season\"><figcaption style=\"text-align: center;\"><p><em>GT/USDT 4-hour chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The 4-hour
    chart shows that the bears are finding it difficult to maintain the price below
    the 20-EMA. That suggests demand at lower levels. Buyers will try to strengthen
    their position by pushing the price above the resistance line. If they do that,
    the pair could rally toward $24.</p><p>Instead, if the price turns down and breaks
    below the 50-SMA, it will signal that the bullish momentum is weakening. The pair
    may descend to $19 and eventually to the support line.</p><h2>Cosmos price analysis</h2><p>Cosmos
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/cosmos-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">ATOM</a>) broke above
    the 20-day EMA ($4.31) on March 15, indicating that the selling pressure is reducing.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01959fd3-40d7-7050-9143-a8b217514bda\"
    title=\"\" alt=\"Bitcoin reclaims $80K zone as BNB, TON, GT, ATOM hint at altcoin
    season\"><figcaption style=\"text-align: center;\"><p><em>ATOM/USDT daily chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The RSI has
    formed a positive divergence, suggesting that the bearish momentum is weakening.
    The 50-day SMA ($4.73) could act as resistance but is likely to be crossed. A
    close above $5.15 could open the doors for a rally to $6.50.</p><p>The 20-day
    EMA is the crucial support to watch out for on the downside. If this support gives
    way, it will signal that the bears remain sellers on rallies. That could sink
    the ATOM/USDT pair to $3.50.&nbsp;</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01959fd3-4b44-7f54-bdd0-795746f81ccc\"
    title=\"\" alt=\"Bitcoin reclaims $80K zone as BNB, TON, GT, ATOM hint at altcoin
    season\"><figcaption style=\"text-align: center;\"><p><em>ATOM/USDT 4-hour chart.
    Source: Cointelegraph/TradingView</em></p></figcaption></figure><p>The pair started
    a pullback in the near term, which could reach the 20-EMA. If the price turns
    up from the 20-EMA, it will signal a positive sentiment where the bulls are buying
    on dips. That increases the likelihood of a break above $5.15. If that happens,
    the pair may surge to $5.50 and then to $6.50.</p><p>This positive view will be
    invalidated in the near term if the price breaks below the 20-EMA. That could
    sink the pair to the 50-SMA and later to $3.80.</p><p class=\"post-content__disclaimer\"
    type=\"\">This article does not contain investment advice or recommendations.
    Every investment and trading move involves risk, and readers should conduct their
    own research when making a decision.</p><template data-name=\"subscription_form\"
    data-type=\"markets_outlook\" label=\"Subscription Form: Markets Outlook\"></template><p><br></p></p>\n</p>\n
    \           "
  published: 2025-03-16 18:23:52 UTC
- title: " Bitcoin whale bets $368M with 40x leverage on BTC decline ahead of FOMC "
  url: https://cointelegraph.com/news/bitcoin-whale-bets-368-m-40x-leverage-btc-decline-fomc?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTlmM2QtMDY3OS03Y2NhLWJlOTMtOTI2YmJhMzYwODE2.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTlmM2QtMDY3OS03Y2NhLWJlOTMtOTI2YmJhMzYwODE2.jpg\"
    alt=\"Bitcoin whale bets $368M with 40x leverage on BTC decline ahead of FOMC\"></p><p>A
    Bitcoin whale is betting hundreds of millions of dollars on a short-term decline
    in Bitcoin&rsquo;s price ahead of a pivotal week filled with key economic reports
    that could significantly influence its trajectory and investor risk appetite.<p>A
    large crypto investor, or whale, has opened a 40x leveraged short position for
    over 4,442 Bitcoin (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>)  &mdash;worth
    over $368 million &mdash; which functions as a de facto bet on Bitcoin&rsquo;s
    price fall.</p><p><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/explained/long-and-short-positions-explained\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Leveraged positions
    use</a> borrowed money to increase the size of an investment, which can boost
    the size of both gains and losses, making leveraged trading riskier compared to
    regular investment positions.</p><p>The Bitcoin whale opened the $368 million
    position at $84,043 and faces liquidation if Bitcoin&rsquo;s price surpasses $85,592.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01959f23-f792-76e0-93a1-aba85deee34d\"
    title=\"\" alt=\"Bitcoin whale bets $368M with 40x leverage on BTC decline ahead
    of FOMC\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://hypurrscan.io/address/0xf3F496C9486BE5924a93D67e98298733Bb47057c\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://hypurrscan.io/address/0xf3F496C9486BE5924a93D67e98298733Bb47057c\"><em>Hypurrscan</em></a></p></figcaption></figure><p>The
    investor has generated over $2 million in unrealized profit, however, he has an
    over $200,000 loss on his position&rsquo;s funding fees, <a data-ct-non-breakable=\"null\"
    href=\"https://hypurrscan.io/address/0xf3F496C9486BE5924a93D67e98298733Bb47057c\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Hypurrscan</a> data
    shows.</p><p>Despite the heightened risk of leveraged trading, some crypto investors
    are making significant profits with this strategy. Earlier in March, a savvy trader
    gained <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/ether-shorter-80-m-50x-leverage-eth-drops-12\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">$68 million on a 50x
    leveraged short position</a>, banking on Ether&rsquo;s (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/ethereum-price\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">ETH</a>) 11% price decline.</p><p>The leveraged bet
    comes ahead of a week of numerous significant macroeconomic releases, including
    the upcoming Federal Open Market Committee (FOMC) meeting on March 19, which may
    impact investor appetite for <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-weekly-close-81-k-avoid-downside-ahead-of-fomc\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">risk assets such as
    Bitcoin</a>.</p><p><em><strong>Related: </strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-catalyst-end-of-36-t-us-debt-ceiling-suspension\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Bitcoin&rsquo;s
    next catalyst: End of $36T US debt ceiling suspension</strong></em></a></p><h2>Bitcoin
    needs weekly close above $81,000 to avoid pre-FOMC downside</h2><p>Bitcoin price
    continues to risk significant downside volatility due to growing macroeconomic
    uncertainty around global trade tariffs.</p><p>To avoid downside volatility ahead
    of the FOMC meeting, Bitcoin will need a weekly close above $81,000, according
    to Ryan Lee, chief analyst at Bitget Research,</p><p>The analyst told Cointelegraph:</p><blockquote>&ldquo;The
    key level to watch for the weekly close is $81,000 range, holding above that would
    signal resilience, but if we see a drop below $76,000, it could invite more short-term
    selling pressure.&rdquo;</blockquote><p><em><strong>Related: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-shakeout-not-end-4-year-cycle-analysts\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Bitcoin
    experiencing &lsquo;shakeout,&rsquo; not end of 4-year cycle: Analysts</strong></em></a></p><p>The
    analyst&rsquo;s comments come days before the next FOMC meeting scheduled for
    March 19. Markets are currently pricing in a 98% chance that the Fed will keep
    interest rates steady, according to the latest estimates of the CME Group&rsquo;s
    FedWatch <a data-ct-non-breakable=\"null\" href=\"https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">tool</a>.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01959f23-fbee-7fbe-b50c-fa101961a386\"
    title=\"\" alt=\"Bitcoin whale bets $368M with 40x leverage on BTC decline ahead
    of FOMC\"><figcaption style=\"text-align: center;\"><p><em>Source: CME Group&rsquo;s
    FedWatch </em><a data-ct-non-breakable=\"null\" href=\"https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html\"><em>tool</em></a></p></figcaption></figure><p>&ldquo;The
    market largely expects the Fed to hold rates steady, but any unexpected hawkish
    signals could put pressure on Bitcoin and other risk assets,&rdquo; added the
    analyst.</p><iframe width=\"100%\" height=\"315\" src=\"https://www.youtube.com/embed/6UnogdVQWrE?start=\"
    frameborder=\"0\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope;
    picture-in-picture\" allowfullscreen loading=\"lazy\"></iframe><p><em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/standard-chartered-500k-bitcoin-prediction-coinbase-sec-lawsuit-hodlers-digest/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>SCB tips
    $500K BTC, SEC delays Ether ETF options, and more: Hodler&rsquo;s Digest, Feb.
    23 &ndash; Mar. 1</strong></em></a></p><template data-name=\"subscription_form\"
    data-type=\"defi_newsletter\" label=\"Subscription Form: DeFi Newsletter\"></template></p>\n</p>\n

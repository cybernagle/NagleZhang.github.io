- title: " Bitcoin treasury companies will hold &#039;way more&#039; than Bitcoiners
    expect: Exec "
  url: https://cointelegraph.com/news/bitcoin-treasury-companies-significant-holdings-forecast-btc-jesse-myers?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Moon Inc. head of Bitcoin strategy Jesse Myers says that Bitcoin holders
    are underestimating the significant amount of Bitcoin that corporations will accumulate
    by 2045.“Bitcoin Treasury Companies will hold 50% of all BTC, way more than most
    Bitcoiners are prepared for,” Jesse Myers said in a May 23 X thread.Strategy will
    own $70T of Bitcoin by 2025, says MyersMyers further forecasted that Michael Saylor’s
    Strategy will own $70 trillion worth of Bitcoin (BTC) by 2045, “making it by far
    the most valuable company in the history of the world.” At the time of publication,
    Strategy holds 576,320 Bitcoin, worth approximately $62.24 billion, according
    to Saylor Tracker.Source: Jesse MyersMyers said, “To set the stage, there is $1,000T
    of asset value in the world.” He added that Bitcoin represents just 0.2% of that
    total amount. He explained that, since half of all capital in the world is essentially
    seeking the best store of value, more capital will “osmotically flow” into Bitcoin
    over time.“Over the last 2 years, an exodus from fiat assets (bonds and money)
    has already begun. Hard money assets (Bitcoin and gold) are where things are shifting,”
    he said.Source: Jesse MyersMyers said that there is around $318 trillion of capital
    in bonds “looking for greener pastures.” He said most of this capital is tied
    up in fixed-income institutional vehicles with “strict mandates.” “That’s where
    Bitcoin Treasury Companies come in,” Myers said.“Treasury Cos will be the primary
    bidders for BTC over the coming decades, deploying an ocean of SoV capital to
    BTC.”Related: Bitcoin price hit a new all-time high, and data shows BTC bulls
    aren’t done yetWhile Strategy has been accumulating Bitcoin since 2020, other
    treasury companies are starting to emerge.On April 24, Twenty One Capital formed,
    which is a Bitcoin treasury company led by Strike founder Jack Mallers with the
    support of Tether, SoftBank and Cantor Fitzgerald. The firm is looking to become
    the “superior vehicle for investors seeking capital-efficient Bitcoin exposure.”Meanwhile,
    Metaplanet — a Japanese company focused on accumulating Bitcoin — announced on
    May 1 it will launch a United States-based subsidiary.According to Bitbo data,
    publicly traded and private companies, ETFs, and nation-states collectively hold
    3.23 million BTC, valued at approximately $348.25 billion.Magazine: AI cures blindness,
    ‘good’ propaganda bots, OpenAI doomsday bunker: AI Eye\n\n            "

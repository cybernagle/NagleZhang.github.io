- title: " BlackRock launches Bitcoin ETP in Europe "
  url: https://cointelegraph.com/news/blackrock-launches-bitcoin-etp-europe?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "BlackRock, the world’s largest asset manager, launched a Bitcoin exchange-traded
    product (ETP) on multiple European stock exchanges.The iShares Bitcoin ETP began
    trading on March 25 on Xetra, Euronext Amsterdam and Euronext Paris, according
    to BlackRock’s product page. The launch follows the success of its iShares Bitcoin
    Trust exchange-traded fund (ETF), which dominates the US market with $50.7 billion
    of assets under management, accounting for about 2.73% of the total Bitcoin (BTC)
    supply.Stephen Wundke, director of strategy and revenue at crypto investment firm
    Algoz, told Cointelegraph that “the availability of the iShares Bitcoin ETP may
    not have the same reaction across Europe” as it saw in the US:“Quality investment
    products through regulated asset managers have been more available throughout
    Europe than in the US, and secondly, Bitcoin is also more easily purchased. […]
    However, the ability for traditional family offices across Europe to hold a small
    percentage of their asset base in ‘digital gold’ is no doubt a good thing. […]
    Just don’t expect $60 billion of purchases in the first quarter.”Product details
    and fee structureThe new ETP trades under the IB1T ticker on Xetra and Euronext
    Paris, while on Euronext Amsterdam it uses BTCN. Bloomberg previously reported
    that the company was preparing to launch the new product, which followed the firm’s
    launch of a Bitcoin ETF on CBOE Canada.BlackRock iShares Bitcoin ETP specifics.
    Source: BlackRockAccording to Bloomberg, the product launched with a temporary
    fee waiver of 10 basis points, which decreases the expense ratio to 0.15% until
    the end of 2025. Europe’s top crypto ETP is the CoinShares Physical Bitcoin ETP,
    which currently charges 0.25%, making BlackRock’s offering considerably cheaper
    while the waiver is in place.“There is no doubt BlackRock’s aggressive fee structure
    was designed to keep competitors out of the market and question the commitment
    of any new entrants,” Wundke said.Wundke added that “this type of competition
    is good for investors and ultimately good for digital currencies,” highlighting
    that players in the market will have to compete to provide the best offering to
    investors.Related: ‘Successful’ ETH ETF less perfect without staking — BlackRockiShares
    expanding to EuropeThis is BlackRock’s first issuance of a crypto ETP outside
    of North America. Manuela Sperandeo, BlackRock’s head of Europe and Middle East
    iShares Product, told Bloomberg:“[This launch] reflects what really could be seen
    as a tipping point in the industry — the combination of established demand from
    retail investors with more professionals now really getting into the fold.”Related:
    Bitcoin ETFs log first net inflows in weeks, while Ether outflows continueAjay
    Dhingra, head of research at decentralized exchange aggregator Unizen, told Cointelegraph
    that the move reflects BlackRock’s confidence in the European Union’s Markets
    in Crypto-Assets Regulation framework:“From Trump to Biden and now Trump again,
    US digital asset policy has been largely inconsistent. In contrast, the EU has
    steadily embraced compliant blockchain adoption — offering the regulatory stability
    companies are looking for.”A recent BlackRock earnings report showed that the
    firm managed over $11.55 trillion on average during the fourth quarter of 2024.
    Other than the top Bitcoin ETF, the firm also launched its Grayscale Ethereum
    Trust ETF — the top Ether (ETH) ETF, with $3.46 billion in assets under management.Magazine:
    EU politician reveals her conversion to crypto — Eva Kaili\n\n            "
  published: 2025-03-25 11:44:00.000000000 +00:00
- title: " Bitcoin flips ‘macro bullish’ amid first Hash Ribbon buy signal in 8 months "
  url: https://cointelegraph.com/news/bitcoin-flips-macro-bullish-hash-ribbon-buy-signal-8-months?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin (BTC) traders are celebrating as one of the best-known BTC price
    metrics finally flipped bullish again.The popular Hash Ribbon tool, created by
    quantitative Bitcoin and digital asset fund Capriole Investments, printed a first
    buy signal in a “macro bullish” event.Hash Ribbon sparks $100,000 Q2 BTC price
    targetBitcoin miners look set to make a comeback as the Hash Ribbon metric marks
    the end of their latest “capitulation” phase.The Hash Ribbon tracks potential
    long-term buy opportunities using hashrate; when miner profitability is at risk
    and network participants retire, this forms the capitulation which in turn leads
    to long-term price reversals.These are monitored using two moving averages of
    hashrate: the 30-day and 60-day. Capitulations correspond to the former crossing
    below the latter, while the reverse is true for buy signals.According to data
    from Cointelegraph Markets Pro and TradingView, the Hash Ribbon put in its latest
    buy signal on March 24. It is visible on both daily and weekly timeframes.“This
    is macro Bullish,” trader Titan of Crypto wrote on X.BTC/USD 1-week chart with
    Hash Ribbon data. Source: Cointelegraph/TradingViewThe previous Hash Ribbon buy
    signal came in July 2024. At the time, BTC/USD had yet to bottom out, and it took
    several months before a wave of upside began.A similar scenario happened after
    a buy signal printed in August 2023.Optimism over the latest development seemed
    tangible after much of Q1 2025 was marred by disappointing BTC price action.“One
    of the most accurate mid-term indicators is bullish now,” fellow trader Robert
    Mercer added.“Expecting $BTC to go back above $100,000 in Q2 of 2025!”Bitcoin
    ends “multimonth RSI downtrend”As Cointelegraph reported, Bitcoin has already
    begun to tease a bullish market turnaround as March nears a close.Related: Bitcoin
    must reclaim this key 2025 level to avoid new lows — ResearchChief among the signs
    is the relative strength index (RSI) indicator, which, like the Hash Ribbon, is
    in the process of returning to form after months of suppression.On weekly timeframes,
    RSI has confirmed a bullish divergence for the first time since September, while
    the daily chart is showing a support retest after breaking through a downward
    trend line in place since November.“The multimonth RSI Downtrend is over,” trader
    and analyst Rekt Capital confirmed to X followers this week.BTC/USD 1-day chart
    with RSI data. Source: Rekt Capital/XThis article does not contain investment
    advice or recommendations. Every investment and trading move involves risk, and
    readers should conduct their own research when making a decision.\n\n            "
  published: 2025-03-25 10:22:36.000000000 +00:00
- title: " Kentucky governor signs ‘Bitcoin Rights’ bill into law "
  url: https://cointelegraph.com/news/kentucky-signs-bitcoin-rights-bill-into-law?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Kentucky governor Andy Beshear has signed a measure known as the “Bitcoin
    Rights” bill, into law, enshrining protections for crypto users, as two other
    US states’ Bitcoin reserve legislation advanced.Crypto advocacy group the Satoshi
    Action Fund said in a March 24 statement to X that House Bill 701 protects the
    “right to self-custody, run a node, and use of digital assets” without “fear of
    discrimination.” First introduced to the Kentucky House by Rep Adam Bowling on
    Feb. 19, HB701’s description says it safeguards the right to use digital assets
    and self-custody wallets and bans local zoning changes that discriminate against crypto
    mining. Source: Satoshi Action FundAt the same time, the legislation provides
    guidelines for running a crypto node, excludes crypto mining from money transmitter
    license requirements, and specifies that mining and staking are not considered
    offering or selling a security.The bill passed Kentucky’s House of Representatives
    on Feb. 28, with all 91 representatives voting in favor, and passed the state
    Senate on March 13, with all 37 senators voting in favor. It was then signed into
    law by Beshear on March 24. The legislation mirrors similar legislation signed
    into law by Oklahoma Governor Kevin Stitt in May 2024. Kentucky’s Bitcoin Rights
    bill enshrines protections for crypto users in the state. Source: Kentucky General
    AssemblyKentucky has also introduced a bill to establish a Bitcoin reserve, allowing
    the State Investment Commission to allocate up to 10% of excess state reserves
    into digital assets, including Bitcoin (BTC); the bill is still under review. Other
    Bitcoin reserve bills move forwardMeanwhile, Oklahoma’s House Bill 1203 (HB 1203),
    known as the Strategic Bitcoin Reserve Act, has passed the State House of Representatives
    77 to 15, according to the crypto advocacy group, the Oklahoma Bitcoin Association.The
    bill was introduced to the Oklahoma House of Representatives on Jan. 15 by state
    Representative Cody Maynard and passed the Government Oversight Committee with
    a 12–2 vote on Feb. 25. Related: Crypto bills stack up across the US, from Bitcoin
    reserves to task forcesIt must now pass through the Senate before the Oklahoma
    governor can veto or sign the bill into law. Oklahoma State Senator Dusty Deevers
    also filed legislation on Jan. 8 that would allow residents in the state to receive
    salaries in Bitcoin. Bitcoin legislation tracker group Bitcoin Laws said in a
    March 24 X post that Oklahoma has now moved into equal second place with Texas
    in the State Bitcoin reserve race.Oklahoma has now moved into equal second place
    in the State Bitcoin reserve race. Source: Bitcoin LawsArizona remains in the
    lead after two strategic digital asset reserve bills cleared Arizona’s House Rules
    Committee on March 24 and headed to the House floor for a full vote.Bitcoin Laws
    speculates that because Republicans dominate the Oklahoma Senate and the governor
    is Republican, the bill “has a good chance to pass into law.” Missouri’s Special
    Committee on Intergovernmental Affairs is also in the process of evaluating the
    state’s Bitcoin reserve bill, according to Bitcoin Laws.Magazine: How crypto laws
    are changing across the world in 2025\n\n            "

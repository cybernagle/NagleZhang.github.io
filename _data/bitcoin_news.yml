- title: " US Senator calls for Trump impeachment, cites memecoin dinner "
  url: https://cointelegraph.com/news/us-senator-calls-for-trump-impeachment-cites-memecoin-dinner?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "United States Senator Jon Ossoff expressed support for impeaching President
    Donald Trump during an April 25 town hall, citing the President’s plan to host
    a private dinner for top Official Trump memecoin holders. “I mean, I saw just
    48 hours ago, he is granting audiences to people who buy his meme coin,” said
    Ossoff, a Democrat, according to a report by NBC News. “When the sitting president
    of the United States is selling access for what are effectively payments directly
    to him. There is no question that that rises to the level of an impeachable offense.”Senator
    Ossoff said he “strongly” supports impeachment proceedings during a town hall
    in the state of Georgia, where he is running for reelection to the Senate.The
    Senator added that an impeachment is unlikely unless the Democratic Party gains
    control of Congress during the US midterm elections in 2026. Trump’s own Republican
    Party currently has a majority in both the House of Representatives and the Senate. TRUMP
    holders can register to dine with the US President. Source: gettrumpmemes.comRelated: US
    lawmaker says TRUMP coin could risk national securityConflicts of interestOn April
    23, the Official Trump (TRUMP) memecoin’s website announced plans for Trump to
    host an exclusive dinner at his Washington, DC golf club with the top 220 TRUMP
    holders. The website subsequently posted a leaderboard tracking top TRUMP wallets
    and a link to register for the event. The TRUMP token’s price has gained more
    than 50% since the announcement, according to data from CoinMarketCap.The specific
    guest list is unclear, but the memecoin’s website states that applicants must
    pass a background check, “can not be from a [Know Your Customer] watchlist country,”
    and cannot bring any additional guests.On April 25, the team behind TRUMP denied
    social media rumors that TRUMP holders need at least $300,000 to participate in
    an upcoming dinner with the president.“People have been incorrectly quoting #220
    on the block explorer as the cutoff. That’s wrong because it includes things like
    locked tokens, exchanges, market makers, and those who are not participating.
    Instead, you should only be going off the leaderboard,” they wrote.The TRUMP token
    jumped on news of the private dinner plans. Source: CoinMarketCapLegal experts
    told Cointelegraph that Trump’s cryptocurrency ventures, including the TRUMP memecoin
    and Trump-affiliated decentralized finance (DeFi) protocol World Liberty Financial,
    raise significant concerns about potential conflicts of interest. “Within just
    a couple of days of him taking office, he’s signed a number of executive orders
    that are significantly going to affect the way that our crypto and digital assets
    industry works,” Charlyn Ho of law firm Rikka told Cointelegraph in February. “So
    if he has a personal pecuniary benefit arising from his own policies, that’s a
    conflict of interest.”Magazine: Trump’s crypto ventures raise conflict of interest,
    insider trading questions\n\n            "

- title: " Here’s what happened in crypto today "
  url: https://cointelegraph.com/news/what-happened-in-crypto-today?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Today in crypto, Coinbase is set to halt trading for the MOVE token. Morgan
    Stanley reportedly plans to launch crypto trading on its E*Trade platform by 2026,
    and the eye-scanning project Worldcoin has officially launched in the US.Coinbase
    suspends trading for MOVE tokenCrypto exchange Coinbase has announced it will
    suspend trading of the Movement Network token (MOVE), the native cryptocurrency
    of the Movement layer-2 blockchain protocol, developed by Movement Labs, effective
    May 15.The decision was shared in a May 1 X post, with Coinbase citing the token’s
    failure to meet its listing standards. The price of the MOVE token also declined
    by approximately 14.5% in the last 24 hours. Coinbase specified the details of
    the suspension in an announcement:\"Trading for MOVE will be suspended on Coinbase,
    Simple and Advanced Trade, Coinbase Exchange, and Coinbase Prime. We have moved
    our MOVE order books to limit-only mode. Limit orders can be placed and canceled,
    and matches may occur.\"The suspension of the token follows a recently announced
    third-party review orchestrated by the Movement Network Foundation into an agreement
    allegedly signed by Movement Labs and a market-making firm, which is said to be
    behind the downfall of the MOVE token price in December 2024.Source: Coinbase
    AssetsA Movement Network Foundation spokesperson recently confirmed to Cointelegraph
    that the third-party investigation, which commenced on April 21, is ongoing. The
    investigation is being conducted by Groom Lake, an independent cybersecurity and
    intelligence firm, and has cast a cloud over the MOVE token's price.Morgan Stanley
    eyes crypto rollout for E*Trade platform: BloombergBanking giant Morgan Stanley
    reportedly plans to list cryptocurrencies on its E*Trade investment brokerage
    and trading platform.According to a May 1 Bloomberg report, the firm intends to
    list crypto assets on E*Trade in 2026. The plan is still in early development,
    and the bank is said to be exploring partnerships with established crypto firms
    to power the service. Internal discussions about cryptocurrency support reportedly
    began in late 2024.E*Trade homepage. Source: E*TradeThis would not be Morgan Stanley’s
    first exposure to digital assets. The bank’s wealthiest clients have had access
    to crypto exchange-traded funds (ETFs) and futures for some time, with the firm’s
    advisers allowed to pitch Bitcoin ETFs since August 2024.Eyeball scanning crypto
    project World hits US shoresOpenAI CEO Sam Altman’s crypto-tied digital identity
    project World, formerly Worldcoin, said on April 30 that it will make its US debut,
    first coming to the so-called “key innovation hubs” of Atlanta, Austin, Los Angeles,
    Miami, Nashville and San Francisco.World offers a crypto token, Worldcoin (WLD),
    to those who verify their humanity with its spherical device called an Orb that
    scans a user’s face and eyeballs, which can then be used to make a World ID on
    the company’s platform to verify they are human on connected services including
    Minecraft, Reddit and Discord.Source: WorldThe firm had previously stayed away
    from the US due to regulatory concerns over offering a token, fears now seemingly
    allayed with the crypto-friendly Trump administration.World also announced a tie-up
    with Visa for a card that allows payments in WLD, and a pilot program testing
    out World ID with the online dating giant Match Group, which owns Tinder, Hinge,
    Match.com, and Plenty of Fish.\n\n            "

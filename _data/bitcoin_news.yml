- title: " India’s Supreme Court urges government to regulate cryptocurrency "
  url: https://cointelegraph.com/news/india-s-surpeme-court-asks-government-for-clearer-crypto-stance?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Update (May 21, 2025, 2:05 pm UTC): This article has been updated to add
    expert commentary on the Indian legal system.India’s Supreme Court questioned
    the government’s lack of regulatory clarity on cryptocurrencies despite imposing
    taxes on digital assets like Bitcoin.According to the Indian legal news outlet
    LawChakra, the country’s Supreme Court expressed concern over the increasing use
    of Bitcoin (BTC) and other cryptocurrencies, which remain largely unregulated.“This
    is a whole parallel economy running with such coins, and it is a danger to the
    economy of the country,” Justice Surya Kant reportedly said during a recent hearing
    related to an ongoing investigation into a Bitcoin transaction.Kant said that
    while the government has implemented crypto taxation, it has failed to regulate
    the space.“If you can tax it at 30%, also please regulate it as you have recognised
    it by taxing it,” the judge said.Jalaj Jain, the founder of JALAJ719 Consultants
    and a lawyer who transitioned to consultin, told Cointelegraph that “while there
    are complete constitutional grounds for the Indian government to introduce taxation
    with respect to crypto, there are no constitutional grounds which force the government
    to regulate crypto.”Anuradha Chowdhary, the founder of technology-specialized
    law firm ZeroTo3, told Cointelegraph that  “the recent judicial nudge, while not
    binding, will certainly increase pressure on the executive to move.” “So I expect
    executive action will likely precede legislative clarity,“ she added.Related:
    Indian high court orders steps to block Proton MailGovernment says review may
    followThe Additional Solicitor General of India — a senior legal officer representing
    the government of India — reportedly answered the request by saying that the government
    “will take instructions, my lord,” indicating that the government may consider
    reviewing the country’s current cryptocurrency regulation.Jain told Cointelegraph
    that “India’s regulatory approach to crypto will inevitably follow a measured,
    multilayered path rather than a singular legislative breakthrough.” He added:“What
    we’re witnessing isn’t regulatory uncertainty but rather regulatory evolution.
    Clarity will emerge incrementally through a constellation of legislative amendments.”The
    report follows a May 5 hearing by the Supreme Court during which Kant and lawyer
    Mahesh Jethmalani shared their views on cryptocurrency. Jethmalani said that Bitcoin
    is already being used worldwide, noting that “in Europe, you can walk into a car
    showroom and buy a car using just one Bitcoin.”Chowdhary told Cointelegraph that
    as a crypto lawyer, “it’s clear that the Reserve Bank of India has a strong incentive
    to regulate operational and systemic risks posed by digital assets.” Still, she
    suggests that the public shouldn’t hold its breath for a crypto bill:“India has
    cycled through multiple versions of a crypto bill. A revived bill or new statute
    could perhaps surface in late 2025 or early 2026, likely as part of a broader
    digital asset framework.“Related: Coinbase plans India comeback with FIU registrationWhile
    this scenario is not as common as this statement may suggest, buying a car with
    Bitcoin is possible at specialized sellers. The lawyer also showed that he misunderstood
    the pseudonymous nature of Bitcoin’s creator, Satoshi Nakamoto, claiming that
    he was from Japan:“It was created by someone from Japan who used a fake name.”Concerns
    over misuseKant also expressed concern over the misuse of cryptocurrencies. He
    said that “there is some system of rules that applies to this.”Kant also said
    that “some Bitcoins are genuine, but some might not be.” However, it’s unclear
    whether he meant to suggest that counterfeit Bitcoin are in circulation (there
    are none) or that illegal activities taint some. The latter appears likely since
    the statement was followed by the judge saying that “it has also become a possible
    way to do illegal business.”India’s government has not yet introduced comprehensive
    legislation to govern cryptocurrencies, though it taxes gains and requires firms
    to report certain activities to financial regulators. The lack of regulation has
    drawn criticism from both the industry and policymakers amid the asset class’s
    continued growth.Magazine: India mulls new crypto ban to support CBDC, Lazarus
    Group strikes again: Asia Express\n\n            "

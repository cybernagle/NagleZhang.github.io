- title: " Michael Saylor’s Strategy bagged 6,556 Bitcoin for $555.8M last week "
  url: https://cointelegraph.com/news/michael-saylor-strategy-buy-6556-bitcoin-555-8-million?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Michael Saylor’s Strategy, one of the world’s largest publicly listed
    corporate Bitcoin holders, added another major purchase to its growing portfolio
    as the cryptocurrency trades near $85,000.Strategy acquired 6,556 Bitcoin for
    $555.8 million from April 14–20, at an average price of $84,785 per coin, the
    firm announced in its latest Form 8-K filing with the United States Securities
    and Exchange Commission.The latest purchase accounts for 1.2% of Strategy’s total
    Bitcoin holdings of 538,200 BTC as of April 20, acquired for the aggregate amount
    of $36.5 billion at an average price of $67,766 per BTC.An excerpt from Strategy’s
    Form 8-K filing. Source: StrategyThe latest Bitcoin purchase was funded using
    proceeds from the Common ATM and STRK ATM stock offerings, including the sale
    of 1,755,000 Strategy shares for $547.7 million and 91,213 shares of Series A
    preferred stock sold for $7.8 million.Strategy expands buying after a pauseThe
    latest purchase follows Strategy’s 3,459 BTC acquisition reported on April 14,
    which was the first announced purchase by the firm after March 31.Prior to that,
    Strategy did not report a Bitcoin buy between March 31 and April 6, breaking its
    usual cadence as Bitcoin fell below $87,000.Strategy’s Bitcoin acquisitions in
    2025 so far. Source: StrategyStrategy has acquired 91,800 Bitcoin so far in 2025,
    accounting for 17% of its total BTC holdings.Growing institutional exposureThe
    new announcement came shortly after Saylor highlighted growing institutional exposure
    to Strategy, with at least 13 institutional investors holding MSTR shares directly.Citing
    public data as of the first quarter of 2025, Saylor also mentioned that 814,000
    retail accounts have direct exposure to MSTR, with another 55 million beneficiaries
    having indirect exposure through mutual funds, pensions, insurance portfolios
    and exchange-traded funds.Source: Michael SaylorRelated: Metaplanet tops $400M
    Bitcoin holdings with new $28M purchaseMSTR shares have seen a massive rise since
    2024, peaking above $420 amid optimism over Donald Trump’s presidential win in
    November 2025. At the time of writing, MSTR is trading at $314, up around 4% year-to-date,
    according to TradingView.On the other hand, the Bitcoin price is seeing a significant
    drop YTD, down more than 6% and trading at $86,936 at the time of writing, according
    to data from CoinGecko.Magazine: Your AI ‘digital twin’ can take meetings and
    comfort your loved ones\n\n            "

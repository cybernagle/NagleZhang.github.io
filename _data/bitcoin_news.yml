- title: " Trump firing Powell would be a ‘very bad precedent to set’ — Pompliano "
  url: https://cointelegraph.com/news/united-states-donald-trump-jerome-powell-consequences-firing-federal-reserve?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Crypto entrepreneur Anthony Pompliano says that US President Donald Trump
    shouldn’t follow through on his recent threat to fire the head of the US Federal
    Reserve, saying it would set a dangerous precedent — especially considering the
    true motive behind it.“I do not believe that the President of the United States
    should come in and unilaterally fire the Fed President,” Pompliano said in a video
    posted on X on April 18.Firing over disagreement is a slippery slope, says PomplianoPompliano
    said, “Where you have a disagreement and then the firing, I think that’s not really
    the area that we want to go into.”“The idea of firing the Fed chairman is a very
    bad precedent to set this way.”It comes after Trump took to his social media platform
    Truth Social to accuse Fed chair Jerome Powell of being too slow to cut interest
    rates. “Powell’s termination cannot come fast enough!” Trump said on April 17.Anthony
    Pompliano made the remarks on his online show “From The Desk of Anthony Pompliano.”
    Source: Anthony Pompliano Pompliano explained that while the Fed is meant to operate
    independently, he agrees with critics who argue it’s not truly independent. “The
    Fed, I think, is highly politicized, even though they pretend not to be,” he said.Pompliano
    acknowledged his own criticism of the Fed, saying he's not exactly a fan, but
    emphasized that even if the Fed has made mistakes, responding in kind isn't the
    right approach.“I still think that just because somebody else is doing something
    wrong doesn't mean that you should do something wrong,” Pompliano said.US Senator
    Elizabeth Warren recently warned that if Trump eventually moves to fire Powell,
    it could undermine investor confidence in the integrity of US capital markets
    and trigger a financial crash. “A big part of our economy strong, and a big part
    of the world economy strong, is the idea that the big pieces move independently
    of politics,” Warren said during an appearance on CNBC.Related: Fed’s Powell reasserts
    support for stablecoin legislationLower interest rates often lead to increased
    liquidity, which has historically led to higher prices of perceived riskier assets
    like Bitcoin and other cryptocurrencies.It comes not long after Powell said establishing
    a stablecoins legal framework was a “good idea.” In an April 16 panel at the Economic
    Club of Chicago, Powell said, “The climate is changing, and you’re moving into
    more mainstreaming of that whole sector, so Congress is again looking [...] at
    a legal framework for stablecoins.”Magazine: Your AI’ digital twin’ can take meetings
    and comfort your loved ones\n\n            "
  published: 2025-04-19 06:50:28.000000000 +01:00
- title: " Lyn Alden lowers Bitcoin forecast after ‘tariff kerfuffle,’ eyes liquidity "
  url: https://cointelegraph.com/news/bitcoin-price-year-end-prediction-lowered-lyn-alden-liquidity-tariffs?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Macroeconomist Lyn Alden expects Bitcoin to finish 2025 higher than its
    current price of around $85,000, though she says it would have been much higher
    if not for US President Donald Trump’s tariff announcement in February.“Before
    all this tariff kerfuffle, I would have had a higher price target,” Alden told
    Natalie Brunell on the April 17 episode of Coin Stories. “My guess is that we
    end up higher at the end of the year than we are now, at least,” she added.Bitcoin’s
    24/7 trading bolsters volatility when TradFi “freaking out”However, she said that
    a “massive liquidity unlock” could be the catalyst needed for Bitcoin (BTC) to
    reach more optimistic targets, similar to those before the tariffs were introduced.For
    example, if the US bond market “broke” and the US Federal Reserve had to step
    in with measures like yield curve control or heavy quantitative easing (QE), Alden
    explained.Lyn Alden spoke to Coin Stories’ host Natalie Brunell on April 17. Source:
    Natalie BrunellWhile Alden said that there is a “good chance” Bitcoin reclaims
    the $100,000 price level before the end of the year, she emphasized that broader
    financial market “down days” will remain a challenge for the asset, especially
    since Bitcoin trades 24/7, unlike traditional stock markets with trading hours.“Because
    it trades 24/7, if people are worried about how things are going to open on Monday,
    some pools of capital can sell their Bitcoin on a Sunday and prepare,” she said. Alden
    explained that crypto's round-the-clock trading contributes to its \"volatile
    pricing,\" particularly when traditional financial markets are “freaking out.”Bitcoin
    is down 0.95% over the past 30 days. Source: CoinMarketCapAt the time of publication,
    Bitcoin is trading at $84,950, according to CoinMarketCap data.However, Alden
    said Bitcoin can “disconnect” from the Nasdaq 100, especially in situations that
    “hurt Nasdaq margins” without affecting global liquidity. As an example, she pointed
    to a potential repeat of the five years leading up to the 2008 global financial
    crisis, which she believes could be favorable for Bitcoin.Related: Bitcoin whales
    absorb 300% of newly mined BTC supply — Is $100K next?She pointed to the 2003–2007
    period, where there was a weaker US dollar cycle, and while there wasn’t a mass
    exodus of capital, it did flow into “emerging markets,” commodities, gold, and
    other assets — with US stocks not “really being the place to be.”“If we encounter
    a five-year period like that again, that could be a period where Bitcoin does
    pretty well, even as the US stock market doesn’t do particularly well.”Alden wrote
    in a September research report that Bitcoin moves in the direction of global M2
    83% of the time in a given 12-month period. The research termed “Bitcoin a Global
    Liquidity Barometer” compared Bitcoin to other major asset classes such as SPX,
    gold and VT, and BTC topped the correlation index concerning global liquidity.Magazine:
    Uni students crypto ‘grooming’ scandal, 67K scammed by fake women: Asia Express\n\n
    \           "

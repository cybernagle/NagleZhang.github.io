- title: " Here’s what happened in crypto today "
  url: https://cointelegraph.com/news/what-happened-in-crypto-today?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Today in crypto, DeFi lender Nostra paused borrowing on two liquid staking
    tokens after a critical price feed issue on Starknet. MicroStrategy bought 6,911
    Bitcoin, pushing its holdings past 500,000. Meanwhile, BTC eyes $90K as Trump
    hints at easing tariffs.DeFi lender Nostra pauses borrowing after price feed errorNostra,
    a lending protocol on Starknet, has paused borrowing for two liquid staking tokens
    after identifying a “critical issue” with its price feeds, the decentralized finance
    (DeFi) protocol said. On March 24, errors in Nostra’s price feed inflated the
    reported prices of xSTRK and sSTRK — two liquid staking derivatives of Starknet’s
    native STRK token — to approximately three times the tokens’ actual value, Nostra
    said in a post on the X platform.According to Nostra, “[s]uch an inflated price
    feed could have caused unnecessary liquidations of otherwise safe positions, resulting
    in users with healthy positions getting liquidated.” In response, the DeFi protocol
    has disabled any further borrowing against xSTRK and sSTRK collateral deposits,
    Nostra said. Nostra has also recommended that users with existing xSTRK and sSTRK
    deposits withdraw the collateral immediately. “Since we don’t have a secondary
    (fallback) oracle to support these assets, as none are available, we are unable
    to fully prevent similar events from occurring in the future,” Nostra added.“Our
    priority has always been and continues to be to keep existing user funds safe
    and with no fallback oracle, the risks outweigh the benefits,” it said.Michael
    Saylor’s Strategy surpasses 500,000 Bitcoin with latest purchaseStrategy has acquired
    over $500 million worth of Bitcoin as institutional interest and exchange-traded
    fund (ETF) inflows make a comeback.Strategy acquired 6,911 Bitcoin (BTC) for over
    $584 million between March 17 and March 23 at an average price of $84,529 per
    coin, according to a March 24 filing with the US Securities and Exchange Commission
    (SEC). Strategy’s SEC filing, March 24. Source: US SECFollowing the latest acquisition,
    the company now holds more than 500,000 Bitcoin, with a total of 506,137 Bitcoin
    acquired at an aggregate purchase price of roughly $33.7 billion and an average
    purchase price of approximately $66,608 per Bitcoin, inclusive of fees and expenses.The
    milestone comes a day after Strategy co-founder Michael Saylor hinted at an impending
    Bitcoin investment after the company announced the pricing of its latest tranche
    of preferred stock on March 21.Strategy total Bitcoin holdings, all-time chart.
    Source: SaylortrackerThe preferred stock was sold at $85 per share and featured
    a 10% coupon. According to Strategy, the offering should bring the company approximately
    $711 million in revenue scheduled to settle on March 25, 2025.Bitcoin bottom forming
    as Fed eases, Trump softens on tariffs, says analystBitcoin may have bottomed
    and could rebound toward $90,000 after US President Donald Trump signaled a willingness
    to ease tariffs and the Federal Reserve resisted short-term pressure last week,
    according to 10x Research’s founder Markus Thielen.“Bitcoin is attempting to form
    a bottom, supported by Trump’s recent shift toward ‘flexibility’ on the upcoming
    April 2 reciprocal tariffs, softening his earlier rhetoric,” 1Thielen said in
    a March 23 report.Bitcoin’s bottoming formations over the last two years. Source:
    10x ResearchThe Federal Reserve signaled in its March 18-19 meeting that it would
    also “look past short-term inflationary pressures, laying the groundwork for potential
    future easing,” Thielen added.“Powell’s mildly dovish tone suggests that the Fed's
    put remains intact, providing further support for a recovery in stock prices.”10x
    Research’s Bitcoin reversal indicators have turned bullish as a result, with Bitcoin’s
    (BTC) 21-day moving average now at $85,200, Thielen noted.\n\n            "

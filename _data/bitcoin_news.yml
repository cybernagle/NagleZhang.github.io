- title: " US crypto industry needs band-aid now, ‘long-term solution’ later — Uyeda "
  url: https://cointelegraph.com/news/mark-uyeda-crypto-temporary-framework-sec-roundtable-crypto-task-force?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "A fast-tracked temporary crypto regulatory framework could bolster innovation
    within the US crypto industry while permanent regulations are still in the works,
    says acting US Securities and Exchange Commission (SEC) Chair Mark Uyeda.“A time-limited,
    conditional exemptive relief framework for registrants and non-registrants could
    allow for greater innovation with blockchain technology within the United States
    in the near term,” Uyeda said at the SEC’s April 11 Crypto Task Force roundtable
    titled “Between a Block and a Hard Place: Tailoring Regulation for Crypto Trading.”Relief
    measures may address immediate challengesUyeda said this might be the short-term
    answer as the SEC works toward a “long-term solution” at the roundtable with SEC
    members and crypto industry executives, including Uniswap Labs’ Katherine Minarik,
    Cumberland DRW’s Chelsea Pizzola and Coinbase’s Gregory Tusar.He flagged state-by-state
    regulation of crypto trading as a concern, warning it could lead to a “patchwork
    of state licensing regimes.” Uyeda said that a favorable federal regulatory framework
    would ease the burden for market participants wishing to offer tokenized securities
    and non-security crypto assets, allowing them to operate under a single SEC license
    instead of navigating “fifty different state licenses.”He urged crypto market
    participants to share feedback on areas where “exemptive relief” could be appropriate.Source:
    US Securities and Exchange CommissionUyeda also reiterated the benefits of blockchain
    technology in financial markets during the roundtable discussion.  “Blockchain
    technology offers the potential to execute and clear securities transactions in
    ways that may be more efficient and reliable than current processes,” Uyeda said.Uyeda
    to fill chair position until Atkins is sworn in“Blockchains can be used to manage
    and mobilize collateral in tokenized form to increase capital efficiency and liquidity,”
    he added.Uyeda will continue serving as acting SEC chair until US President Donald
    Trump’s nominee, Paul Atkins, is officially sworn in.On April 10, the US Senate
    confirmed Atkins as chair of the SEC in a 52-44 vote largely along party lines. Related:
    SEC, Ripple file joint motion to pause appeals in XRP caseUyeda has served as
    acting SEC chair since Jan. 20, succeeding former chair and crypto skeptic Gary
    Gensler. He’s been widely seen within the industry as a pro-crypto advocate.On
    March 18, Cointelegraph reported that Uyea said the SEC could change or scrap
    a rule proposed under the Biden administration that would tighten crypto custody
    standards for investment advisers.“I have asked the SEC staff to work closely
    with the crypto task force to consider appropriate alternatives, including its
    withdrawal,” Uyeda said.Magazine: Memecoin degeneracy is funding groundbreaking
    anti-aging research\n\n            "

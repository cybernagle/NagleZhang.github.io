- title: " Trade war puts Bitcoin’s status as safe-haven asset in doubt "
  url: https://cointelegraph.com/news/bitcoin-trade-tariff-safe-haven?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTk1MjMtMGM1NC03Mzc3LTkyMWUtYTY0ZjVhZmMxMzAy.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTk1MjMtMGM1NC03Mzc3LTkyMWUtYTY0ZjVhZmMxMzAy.jpg\"
    alt=\"Trade war puts Bitcoin’s status as safe-haven asset in doubt\"></p><p>Several
    years back, many in the crypto community described Bitcoin as a &ldquo;safe-haven&rdquo;
    asset. Fewer are calling it that today.<p>A safe-haven asset maintains or increases
    in value in times of economic stress. It can be a government bond, a currency
    like the US dollar, a commodity like gold, or even a blue-chip stock.&nbsp;</p><p>A
    spreading global tariff war set off by the United States, as well as troubling
    economic reports, have sent equity markets tumbling, and Bitcoin too &mdash; which
    wasn&rsquo;t supposed to happen with a &ldquo;risk off&rdquo; asset.&nbsp;</p><template
    data-ct-widget=\"buzzsprout\" data-buzzsprout-podcast-id=\"2040516\" data-buzzsprout-episode-id=\"16791823\"></template><p>Bitcoin
    has suffered compared with gold, too. &ldquo;While gold prices are up +10%, Bitcoin
    is down -10% since January 1st,&rdquo; <a data-ct-non-breakable=\"null\" href=\"https://x.com/KobeissiLetter/status/1896766532312830255\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">noted</a> the Kobeissi
    Letter on March 3. &ldquo;Crypto is no longer viewed as a safe haven play.&rdquo;
    (Bitcoin dropped even further last week.)</p><p>But some market observers are
    saying that this wasn&rsquo;t really unexpected.<br></p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195951b-888d-754e-bef7-e8312a33aee5\"
    title=\"\" alt=\"Trade war puts Bitcoin&rsquo;s status as safe-haven asset in
    doubt\"><figcaption style=\"text-align: center;\"><p><em>Bitcoin (white) and gold
    (yellow) price chart from Dec. 1 to March 13. Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://bitcoincounterflow.com/charts/bitcoin-gold-sp500/\" rel=\"nofollow
    noopener\" target=\"_blank\" text=\"null\" title=\"https://bitcoincounterflow.com/charts/bitcoin-gold-sp500/\"><em>Bitcoin
    Counter Flow</em></a></p></figcaption></figure><h2>Was Bitcoin ever a safe haven?</h2><p>&ldquo;I
    have never thought of BTC as a &lsquo;safe haven,&rsquo;&rdquo; Paul Schatz, founder
    and president of Heritage Capital, a financial advisory firm, told Cointelegraph.
    &ldquo;The magnitude of the moves in BTC are just too great to be put in the haven
    category although I do believe investors can and should have an allocation to
    the asset class in general.&rdquo;</p><p>&ldquo;Bitcoin is still a speculative
    instrument for me, not a safe haven,&rdquo; Jochen Stanzl, Chief Market Analyst
    at CMC Markets (Germany), told Cointelegraph. &ldquo;A safe haven investment like
    gold has an intrinsic value that will never be zero. Bitcoin can go down 80% in
    major corrections. I wouldn&rsquo;t expect that from gold.&rdquo;</p><p>Crypto,
    including Bitcoin, &ldquo;has never been a &lsquo;safe haven play&rsquo; in my
    opinion,&rdquo; Buvaneshwaran Venugopal, assistant professor in the department
    of finance at the University of Central Florida, told Cointelegraph.</p><p>But
    things aren&rsquo;t always as clear as they first appear, especially when it comes
    to cryptocurrencies.&nbsp;</p><p><em><strong>Related: </strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-dominance-reaches-new-highs-alts-fade\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Bitcoin
    dominance hits new highs, alts fade: Research</strong></em></a></p><p>One could
    argue that there are different kinds of safe havens: one for geopolitical events
    like wars, pandemics, and economic recessions, and another for strictly financial
    events like bank collapses or a weakening dollar, for instance.&nbsp;</p><p>The
    perception of Bitcoin may be changing. Its inclusion in exchange-traded funds
    issued by major asset managers like BlackRock and Fidelity in 2024 widened its
    ownership base, but it may also have changed its &ldquo;narrative.&rdquo;</p><figure><img
    alt=\"Trade war puts Bitcoin&rsquo;s status as safe-haven asset in doubt\" src=\"https://s3.cointelegraph.com/uploads/2025-02/01954c71-f554-7edf-8ec8-b17a0c01789a\"
    title=\"\"><figcaption style=\"text-align: center;\"></figcaption></figure><p>It
    is now more widely seen as a speculative or &ldquo;risk on&rdquo; asset like a
    technology stock.</p><p>&ldquo;Bitcoin, and crypto as a whole, have become highly
    correlated with risky assets and they often move inversely to safe-haven assets,
    like gold,&rdquo; Adam Kobeissi, editor-in-chief of the Kobeissi Letter, told
    Cointelegraph.&nbsp;</p><p>There&rsquo;s a lot of uncertainty where BTC is heading,
    he continued, amid &ldquo;more institutional involvement and leverage,&rdquo;
    and there&rsquo;s also been a &ldquo;narrative shift from Bitcoin being viewed
    as &lsquo;digital gold&rsquo; to a more speculative asset.&rdquo;&nbsp;&nbsp;&nbsp;</p><p>One
    might think that its acceptance by traditional finance giants like BlackRock and
    Fidelity would make Bitcoin&rsquo;s future more secure, which would boost the
    safe haven narrative -- but that&rsquo;s not necessarily the case, according to
    Venugopal:</p><blockquote>&ldquo;Big companies piling into BTC does not mean it
    has become safer. In fact, it means BTC is becoming more like any other asset
    that institutional investors tend to invest in.&rdquo;</blockquote><p>It will
    be more subject to the usual trading and draw-down strategies that institutional
    investors use, Venugopal continued. &ldquo;If anything, BTC is now more<em> </em>correlated
    to risky assets in the market.&rdquo;&nbsp;</p><h2>Bitcoin&rsquo;s dual nature</h2><p>Few
    deny that Bitcoin and other cryptocurrencies are still subject to big price swings,
    further propelled recently by growing retail<em> </em>adoption of crypto, particularly
    from the memecoin craze, &ldquo;one of the largest crypto-onboarding events in
    history,&rdquo; Kobeissi noted. But perhaps that is the wrong thing to focus on.</p><p>&ldquo;Safe
    havens are always longer-term assets, which means that short-term volatility is
    not a factor in that characteristic,&rdquo; Noelle Acheson, author of the Crypto
    is Macro Now newsletter, told Cointelegraph.&nbsp;</p><p>The big question is whether
    BTC can hold its value longer-term against fiat currencies, and it&rsquo;s been
    able to do that. &ldquo;The numbers bear out its validity &ndash; on just about
    any four-year timeframe, BTC has outperformed gold and US equities,&rdquo; said
    Acheson, adding:</p><blockquote>&ldquo;BTC has always had two key narratives:
    it is a short-term risk asset, sensitive to liquidity expectations and overall
    sentiment. It is also a longer-term store of value. It can be both, as we are
    seeing.&rdquo;</blockquote><p>Another possibility is that Bitcoin could be a safe
    haven against some happenings but not others.&nbsp;</p><p>&ldquo;I see Bitcoin
    as a hedge against issues in TradFi,&rdquo; like the downturn that followed the
    collapse of the Silicon Valley Bank and Signature Bank two years ago, and &ldquo;US
    Treasury risks,&rdquo; Geoff Kendrick, global head of digital assets research
    at Standard Chartered told Cointelegraph. But for some geopolitical events, Bitcoin
    might still trade as a risk asset, he said.</p><p><em><strong>Related: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/altseason-bitcoin-etf-crypto-investment\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Is altseason
    dead? Bitcoin ETFs rewrite crypto investment playbook</strong></em></a></p><p>Gold
    can serve as a hedge against geopolitical issues, like trade wars, while both
    Bitcoin and gold are hedges against inflation. &ldquo;So both are useful hedges
    in a portfolio,&rdquo; Kendrick added.</p><p>Others, including Ark Investment&rsquo;s
    Cathie Wood, <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/crypto-acted-as-safe-haven-amid-svb-and-signature-bank-run-cathie-wood\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">agree that Bitcoin acted
    as a safe haven</a> during the SVB and Signature bank runs in March 2023. When
    SVB collapsed on March 10, 2023, Bitcoin&rsquo;s price was around $20,200, according
    to CoinGecko. It stood close to $27,400 a week later, roughly 35% higher.<br></p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/0195951b-8d65-728f-9a08-e67bed272dee\"
    title=\"\" alt=\"Trade war puts Bitcoin&rsquo;s status as safe-haven asset in
    doubt\"><figcaption style=\"text-align: center;\"><p><em>BTC price fell on March
    10 before bouncing back a week later. Source: CoinGecko</em></p></figcaption></figure><p>Schatz
    doesn&rsquo;t see Bitcoin as a hedge against inflation. The events of 2022, when
    FTX and other crypto firms collapsed and the crypto winter began, &ldquo;damages
    that thesis dramatically.&rdquo;&nbsp;</p><p>Maybe it&rsquo;s a hedge against
    the US dollar and Treasury bonds? &ldquo;That&rsquo;s possible, but those scenarios
    are pretty dark to think about,&rdquo; Schatz added.</p><h2>No time for over-reaction</h2><p>Kobeissi
    agreed that short-term fluctuations in asset classes &ldquo;often have minimal
    relevance over a long-term time period.&rdquo; Many of Bitcoin&rsquo;s fundamentals
    remain positive despite the current drawdown: a pro-crypto US government, the
    announcement of a US Bitcoin Reserve, and a surge in crypto adoption.&nbsp;</p><p>The
    big question for market players is: &ldquo;What is the next major catalyst for
    the run to continue?&rdquo; Kobeissi told Cointelegraph. &ldquo;This is why markets
    are pulling back and consolidating: it&rsquo;s a search for the next major catalyst.&rdquo;</p><p>&ldquo;Ever
    since macro investors started seeing BTC as a high-volatility, liquidity-sensitive
    risk asset, it has behaved like one,&rdquo; added Acheson. Moreover, &ldquo;it
    is almost always short-term traders that set the last price, and if they&rsquo;re
    rotating out of risk assets, we will see BTC weakness.&rdquo;</p><p>Markets are
    struggling in general. There&rsquo;s &ldquo;the specter of renewed inflation and
    an economic slowdown weighing heavy on expectations&rdquo; that are also affecting
    Bitcoin&rsquo;s price. Acheson further noted:</p><blockquote>&ldquo;Given this
    outlook, and BTC&rsquo;s dual nature of risk asset and long-term safe haven, I&rsquo;m
    surprised it&rsquo;s not falling further.&rdquo;&nbsp;&nbsp;</blockquote><p>Venugopal,
    for his part, says Bitcoin hasn&rsquo;t been a short-term hedge or safe haven
    since 2017. As for the long-term argument that Bitcoin is digital gold because
    of its 21 million BTC supply cap, that only works &ldquo;if a large fraction of
    investors collectively expect Bitcoin to increase in value over time,&rdquo; and
    &ldquo;this may or may not be true.&rdquo;&nbsp;</p><p><em><strong>Magazine: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/crypto-fans-obsessed-longevity-biohacking-why/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Crypto fans
    are obsessed with longevity and biohacking: Here&rsquo;s why</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"markets_outlook\" label=\"Subscription
    Form: Markets Outlook\"></template><p><br></p></p>\n</p>\n            "

- title: " UK outpaces global crypto ownership growth in 2025: Gemini report "
  url: https://cointelegraph.com/news/uk-outpaces-global-crypto-ownership-growth-in-2025-says-gemini?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Update (May 27, 3:00 pm UTC): This article has been updated to add a comment
    by Gemini’s head of Europe.The United Kingdom is leading the world in increasing
    cryptocurrency ownership among its population in 2025, outpacing economies including
    the United States, according to a new study by Gemini.Gemini, the US-based crypto
    exchange founded by Cameron and Tyler Winklevoss, on May 27 released its latest
    “State of Crypto” report, giving insights into changes in the global adoption
    of cryptocurrencies like Bitcoin (BTC).Based on a survey of 7,200 adults across
    the US, Europe, Singapore and Australia, the report found that Europe has been
    leading the way in growing crypto ownership, with the UK in front.The UK saw the
    biggest year-over-year growth in crypto ownership of the surveyed nations, with
    the share of respondents indicating crypto holdings rising to 24% as of April
    from 18% last year, Gemini said in the report shared with Cointelegraph.Crypto
    sees highest ownership in SingaporeWhile the UK has reportedly seen an increase
    in new crypto owners, it’s yet to reach the world’s top crypto ownership rate.According
    to Gemini’s report, Singapore has been the top country globally for crypto ownership
    in the past two years, with 28% of local survey respondents saying they were invested
    in crypto as of April. In 2024, that share was 26%.Crypto ownership percentage
    in the US, UK, France, Singapore, Italy and Australia. Source: GeminiSome European
    countries have picked up the pace, with 21% of French respondents reporting owning
    crypto in 2025, up from 18% in 2024. In the US, the indicator grew to 22% from
    21%.Overall crypto ownership rate in the US, UK, France and Singapore increased
    to 24% by April from 21% last year, suggesting that nearly one in four now own
    crypto globally.Implications of the EU’s MiCA regulation?According to Gemini,
    the rise of global crypto ownership in the past few years may be attributed to
    the impact of the Trump administration’s policies on overall positive sentiment
    following the bear market of 2022.“In particular, crypto ownership in France and
    the UK increased, reflecting a warming regulatory environment for digital assets
    in Europe,” the report said, referring to the rollout of the European Union’s
    Markets in Crypto-Assets Regulation (MiCA).Related: UK to become ‘safe harbor’
    for crypto with new draft rules — ExpertsHowever, the UK has yet to adopt a national
    regulatory framework for cryptocurrency.An excerpt from the UK’s draft statutory
    instrument for crypto regulation. Source: Gov.ukIn April, the UK government published
    a draft statutory instrument (SI) aimed at regulating crypto exchanges, dealers
    and agents in order to bolster consumer protection and ensure operational resilience.After
    conducting a public consultation with last entries accepted before May 23, the
    UK Treasury expects to finalize the “near-final version” of the SI later this
    year.UK’s soaring crypto ownership: Why?The UK’s sharp spike in crypto ownership
    reflects the country’s status as a “central financial hub for many decades,” Gemini’s
    head of Europe, Mark Jennings, told Cointelegraph.Such a status recognizes the
    maturity of the market and reasons why investors are keen to get involved in crypto,
    Jennings noted.“Outside of the US, the UK had the highest rate of non-crypto owners
    who responded that the Strategic Bitcoin Reserve made them more confident in the
    value of crypto, showing the positive influence that a pro-crypto US administration
    has had on the UK,” he added.Jennings also suggested that MiCA would still likely
    grow outside of its regulatory scope and have an impact on adjacent countries
    despite not having a direct effect on the UK.Magazine: Crypto wanted to overthrow
    banks, now it’s becoming them in stablecoin fight\n\n            "

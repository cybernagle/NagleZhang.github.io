- title: " Here’s what happened in crypto today "
  url: https://cointelegraph.com/news/what-happened-in-crypto-today?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDEvMDE5NDgzZjctMTdlYS03OTc0LWJlNzMtNjYxYzdjZDE1N2M3.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDEvMDE5NDgzZjctMTdlYS03OTc0LWJlNzMtNjYxYzdjZDE1N2M3.jpg\"
    alt=\"Here’s what happened in crypto today\"></p><p>Today in crypto, Robinhood
    has entered the prediction markets with the launch of a new betting platform.
    In France, authorities have temporarily lifted judicial restrictions on Telegram
    founder Pavel Durov until April 7. Meanwhile, South Korea&rsquo;s central bank
    has clarified that it has neither discussed nor considered the possibility of
    holding Bitcoin reserves.<h2>Robinhood shares up 8% after launching betting markets
    hub</h2><p>Robinhood <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/robinhood-launches-betting-markets-hub\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/robinhood-launches-betting-markets-hub\">has
    launched a betting markets hub</a> as the online brokerage &mdash; best known
    for stock trading &mdash; expands its presence in emergent asset classes, including
    cryptocurrencies and event contracts, according to a March 17 announcement.&nbsp;</p><p>Robinhood&rsquo;s
    stock, HOOD, rose roughly 8% on the Nasdaq after the announcement, according to
    data from Google Finance.</p><p>The new betting feature will let users &ldquo;trade
    contracts for what the upper bound of the target fed funds rate will be in May,
    as well as the upcoming men&rsquo;s and women&rsquo;s College Basketball Tournaments,&rdquo;
    it <a data-ct-non-breakable=\"null\" href=\"https://newsroom.aboutrobinhood.com/robinhood-prediction-markets-hub/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">said</a>.&nbsp;</p><p>The
    online brokerage is tapping Kalshi, the US&rsquo; first CFTC-regulated prediction
    platform, to operate the event contract platform, it said.&nbsp;</p><p>Kalshi
    is already registered to list dozens of event contracts, covering outcomes ranging
    from election results to Rotten Tomatoes movie ratings.</p><p>Prediction markets
    have become increasingly popular in the US since September 2024, when Kalshi prevailed
    in a lawsuit challenging a CFTC decision to bar it from listing political event
    contracts.</p><p>By November, trading volumes across popular prediction markets
    neared $4 billion for <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/betting-volumes-near-4-billion-us-election-day\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">contracts tied to the
    US elections</a>.</p><figure><img alt=\"Security, Banks, South Korea, United States,
    Libra, Quantum Computing, Memecoin, Bitcoin Reserve\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a555-b22b-7039-88bb-e315ccc06ce7\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>HOOD&rsquo;s intraday
    performance on the Nasdaq on March 17. Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://www.google.com/finance/quote/HOOD:NASDAQ?sa=X&amp;ved=2ahUKEwjLuJyV3ZGMAxVoSDABHZVTHG0Q3ecFegQIOBAf\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://www.google.com/finance/quote/HOOD:NASDAQ?sa=X&amp;ved=2ahUKEwjLuJyV3ZGMAxVoSDABHZVTHG0Q3ecFegQIOBAf\"><em>Google
    Finance</em></a></p></figcaption></figure><h2>Pavel Durov legal restrictions suspended
    until April 7: Report</h2><p><br>Media platform TASS reported that <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/telegram-founder-pavel-durov-reached-dubai-legal-obligations\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">French authorities have
    suspended judicial control of Durov for three weeks</a>. Citing sources in the
    French prosecutor&rsquo;s office, media outlet TASS reported that the agency&rsquo;s
    interlocutor said judicial control in relation to Durov was suspended from March
    15 to April 7.&nbsp;</p><p>Parallely, the Telegram founder posted an update on
    the messaging application, saying he was already back in Dubai after spending
    months in France. Durov said the process is still ongoing but added that it &ldquo;feels
    great to be home.&rdquo;</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a44c-bf9f-7d0c-a935-5c861c107dd8\"
    title=\"\" alt=\"Here&rsquo;s what happened in crypto today\"><figcaption style=\"text-align:
    center;\"><p><em>Pavel Durov shared a post on Telegram after returning to Dubai.
    Source: Pavel Durov</em></p></figcaption></figure><p>In his post, Durov thanked
    the judges for allowing him to return to Dubai.</p><h2>Bank of Korea to take &lsquo;cautious
    approach&rsquo; to Bitcoin reserve</h2><p>The Bank of Korea says it is taking
    a &ldquo;cautious approach&rdquo; to <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/south-korea-central-bank-cautious-stance-potential-bitcoin-reserve\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">potentially including
    Bitcoin</a> as a foreign exchange reserve.</p><p>Officials from the Korean central
    bank said in a March 16 response to a written inquiry that they have not looked
    into a potential Bitcoin (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC)</a> reserve, citing
    high volatility.&nbsp;</p><p>Responding to a question from Representative Cha
    Gyu-geun of the National Assembly&rsquo;s Planning and Finance Committee, central
    bankers said that they have &ldquo;neither discussed nor reviewed the possible
    inclusion of Bitcoin in foreign exchange reserves, adding that &ldquo;a cautious
    approach is needed,&rdquo; <a data-ct-non-breakable=\"null\" href=\"https://www.koreaherald.com/article/10442438\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">according</a> to the
    Korea Herald.</p><p>&ldquo;Bitcoin&rsquo;s price volatility is very high,&rdquo;
    the central bank noted, before adding that &ldquo;in the case of cryptocurrency
    market instability, transaction costs to cash out Bitcoins could rise drastically.&rdquo;</p><template
    data-name=\"subscription_form\" data-type=\"defi_newsletter\" label=\"Subscription
    Form: DeFi Newsletter\"></template></p>\n</p>\n            "
  published: 2025-03-17 21:24:58 UTC
- title: " Bitcoin sees 30% retracement as selling pressure increases — Bitfinex "
  url: https://cointelegraph.com/news/bitcoin-30-retracement-selling-pressure-bitfinex?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWE1YzUtZTRmNC03NDI5LTkwMTctOTQ2YjIzYjUxNTAw.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWE1YzUtZTRmNC03NDI5LTkwMTctOTQ2YjIzYjUxNTAw.jpg\"
    alt=\"Bitcoin sees 30% retracement as selling pressure increases — Bitfinex\"></p><p>Bitcoin
    (<a data-ct-non-breakable=\"null\" href=\"/bitcoin-price\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">BTC</a>) has undergone its second-largest correction
    of this bull run, according to analysts at crypto exchange Bitfinex. The correction,
    from the coin&rsquo;s all-time high of $109,590 set on Jan. 20 to a low of $77,041
    during the week of March 9-15, represents a 30% retracement triggered by selling
    pressure from short-term holders.<p>In its report, Bitfinex defines short-term
    holders as those who have bought within the last seven to 30 days. According to
    the exchange, they have suffered net unrealized losses and are often more subject
    to capitulation. </p><p>Bitfinex notes that ongoing outflows from Bitcoin ETFs,
    which totaled around $920 million during the week of March 9-15, suggest that
    institutional buyers have not yet returned with enough strength to combat selling
    pressure.</p><figure><img alt=\"Cryptocurrencies, United States, ETF\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a5db-8c58-700b-97c8-5c6d9c63eab5\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Bitcoin capital flow
    by short-term holders. Source: </em><a data-ct-non-breakable=\"null\" href=\"https://blog.bitfinex.com/bitfinex-alpha/bitfinex-alpha-waiting-for-conviction/\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://blog.bitfinex.com/bitfinex-alpha/bitfinex-alpha-waiting-for-conviction/\"><em>Glassnode/Bitfinex</em></a></p></figcaption></figure><p>Trading
    at around $84,357, Bitcoin has rebounded 9.5% from its low. According to Bitfinex,
    a key factor moving forward will be whether institutional demand picks up at these
    lower levels, potentially leading to supply absorption and price stabilization.</p><p>&ldquo;While
    institutional flows and the macro situation is pivotal for market direction in
    the mid-term, statistically, a 30 percent drawdown has often marked the low before
    continuation higher,&rdquo; Bitfinex analysts told Cointelegraph. &ldquo;If Bitcoin
    stabilizes around this level, history suggests a strong recovery could follow.&rdquo;</p><iframe
    width=\"100%\" height=\"315\" src=\"https://www.youtube.com/embed/MwOUFTWirpg?start=\"
    frameborder=\"0\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope;
    picture-in-picture\" allowfullscreen loading=\"lazy\"></iframe><h2>Bitcoin ETPs
    see $5.4B in outflows over five weeks</h2><p>Weekly outflows from crypto exchange-traded
    products (ETPs) have reached a streak of five weeks, <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/crypto-etps-see-1-7b-outflows-fifth-week-in-row\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">totaling $6.4 billion</a>
    as of March 14. According to data from CoinShares, Bitcoin ETPs have borne the
    brunt of outflows, with $5.4 billion in losses.</p><p>The current macroeconomic
    climate may be weighing on the markets, according to Bitfinex. US consumer confidence
    has fallen to its lowest level in two years, and there are expectations of higher
    inflation along with economic uncertainty. On March 4, a Federal Reserve&rsquo;s
    model predicted that the US economy <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/atlanta-fed-model-predicts-us-gdp-shrink-q1\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">would shrink by 2.8%
    in the first quarter of 2025</a>.</p><p>Meanwhile, talks of trade wars continue
    to dominate the news, putting Bitcoin&rsquo;s <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-trade-tariff-safe-haven\" rel=\"null\"
    target=\"null\" text=\"null\" title=\"null\">status as a safe-haven asset in doubt</a>,
    keeping <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/us-canada-tariff-bitcoin-miners\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">miners on their toes</a>,
    and perhaps <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-bull-market-in-peril-as-us-recession-and-tariff-worries-loom\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">putting the bull market
    in peril</a> &mdash; despite the White House&rsquo;s recent announcement of a
    US <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/explained/trumps-strategic-bitcoin-reserve-and-digital-asset-stockpile-explained\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Bitcoin strategic reserve
    and digital asset stockpile</a>.</p><p><em><strong>Magazine: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/bitcoin-dominance-crypto-predictions-bull-run-benjamin-cowen-hall-of-flame/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>X Hall of
    Flame, Benjamin Cowen: Bitcoin dominance will fall in 2025</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"markets_outlook\" label=\"Subscription
    Form: Markets Outlook\"></template></p>\n</p>\n            "
  published: 2025-03-17 21:00:00 UTC
- title: " Bitcoin price fails to go parabolic as the US Dollar Index (DXY) falls
    — Why? "
  url: https://cointelegraph.com/news/bitcoin-price-fails-to-go-parabolic-as-the-us-dollar-index-dxy-falls-why?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDEvMDE5NGIwOGMtOGUwNy03NzU0LWI2MTEtMjJlMjZhZmNlOWU0.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDEvMDE5NGIwOGMtOGUwNy03NzU0LWI2MTEtMjJlMjZhZmNlOWU0.jpg\"
    alt=\"Bitcoin price fails to go parabolic as the US Dollar Index (DXY) falls —
    Why?\"></p><p>Bitcoin (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>) has fallen
    12% since March 2, when it nearly reached $94,000. Interestingly, during the same
    period, the US dollar weakened against a basket of foreign currencies, which is
    usually seen as a positive sign for scarce assets like BTC. <p>Investors are now
    puzzled as to why Bitcoin hasn&rsquo;t reacted positively to the declining DXY
    and what could be the next factor to trigger a decoupling from this trend.</p><p><br></p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a523-1266-7f7b-a0f5-4c2f778b80b0\"
    title=\"\" alt=\"Bitcoin price fails to go parabolic as the US Dollar Index (DXY)
    falls &mdash; Why?\"><figcaption style=\"text-align: center;\"><p><em>US Dollar
    Index (DXY, left) vs. Bitcoin/USD (right). Source: TradingView / Cointelegraph</em></p></figcaption></figure><p>Up
    to mid-2024, the US Dollar Index (DXY) had an inverse relationship with Bitcoin&rsquo;s
    price, meaning the cryptocurrency often rose when the dollar weakened. During
    that time, Bitcoin was widely viewed as a hedge against inflation, thanks to its
    lack of correlation with the stock market and its fixed monetary policy, similar
    to digital gold.</p><p>However, correlation does not imply causation, and the
    past eight months have shown that the rationale for investing in Bitcoin evolves
    over time. For instance, some analysts claim that Bitcoin&rsquo;s price aligns
    with <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/crypto-regulation-shifts-as-bitcoin-eyes-105-k-amid-liquidity-boost\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">global monetary supply</a>
    as central banks adjust economic policies, while others emphasize its role as
    uncensorable money, enabling free transactions for governments and individuals
    alike.</p><h2><strong>Bitcoin gains from DXY weakness can take months or years
    to materialize</strong></h2><p>Julien Bittel, the head of macro research at Global
    Macro Investor, pointed out that the recent drop in the US Dollar Index&mdash;from
    107.6 on Feb. 28 to 103.60 on March 7&mdash;has occurred only three times in the
    past twelve years.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a523-1844-7ef8-8861-ee351c8b304e\"
    title=\"\" alt=\"Bitcoin price fails to go parabolic as the US Dollar Index (DXY)
    falls &mdash; Why?\"><figcaption style=\"text-align: center;\"><p><em>Source:
    </em><a data-ct-non-breakable=\"null\" href=\"https://x.com/BittelJulien/status/1897956114370600994\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://x.com/BittelJulien/status/1897956114370600994\"><em>BittelJulien</em></a></p></figcaption></figure><p>Bittel&rsquo;s
    post on X highlights that Bitcoin&rsquo;s price surged after the last significant
    drop in the DXY Index in November 2022, as well as following the March 2020 event,
    when the US dollar fell from 99.5 to 95 during the early weeks of the COVID-19
    crisis. His analysis emphasizes that &ldquo;financial conditions lead risk assets
    by a couple of months. Right now, financial conditions are easing &ndash; and
    fast.&rdquo;</p><p>While Bittel&rsquo;s comments are highly bullish for Bitcoin&rsquo;s
    price, the positive effects of past US dollar weakness took more than six months
    to materialize and, in some cases, even a couple of years, such as during the
    2016-17 cycle. The current underperformance of Bitcoin may be due to &ldquo;short-term
    macro fears,&rdquo; according to user @21_XBT.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a523-1e57-7541-81c4-03626b2e8e2e\"
    title=\"\" alt=\"Bitcoin price fails to go parabolic as the US Dollar Index (DXY)
    falls &mdash; Why?\"><figcaption style=\"text-align: center;\"><p><em>Source:
    </em><a data-ct-non-breakable=\"null\" href=\"https://x.com/21_XBT/status/1901429676242792487\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://x.com/21_XBT/status/1901429676242792487\"><em>21_XBT</em></a></p></figcaption></figure><p>The
    analyst briefly cites several reasons for Bitcoin&rsquo;s recent price weakness,
    including &ldquo;Tariffs, Doge, Yen carry trade, yields, DXY, growth scares,&rdquo;
    but concludes that none of these factors alter Bitcoin&rsquo;s long-term fundamentals,
    suggesting its price will eventually benefit.</p><p>For example, cuts by the US
    Department of <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/doge-slashing-internal-revenue-service-staff-20\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Government Efficiency</a>
    (DOGE) are highly positive for the economy in the medium term, as they reduce
    overall debt and interest payments, freeing up resources for productivity-boosting
    measures. Similarly, tariffs could prove beneficial if the Trump administration
    achieves a more favorable trade balance by increasing US exports, as this could
    pave the way for sustainable economic growth.</p><p><em><strong>Related: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/crypto-bull-cycle-threatened-by-us-recession-circular-economy\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Crypto market&rsquo;s
    biggest risks in 2025: US recession, circular crypto economy</strong></em></a></p><p>The
    measures taken by the US government have trimmed excessive but unsustainable growth,
    causing short-term pain while lowering yields on US Treasury notes, making it
    cheaper to refinance debt. However, there is no indication that the US dollar&rsquo;s
    role as the world&rsquo;s <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/explained/us-bitcoin-reserve-vs-gold-and-oil-reserves-how-do-they-compare\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">reserve currency</a>
    is weakening, nor is there reduced demand for US Treasurys. As a result, the recent
    decline in the DXY Index does not directly correlate with Bitcoin&rsquo;s appeal.</p><p>Over
    time, as user @21_XBT noted, macroeconomic fears will fade as central banks adopt
    more expansionary monetary policies to stimulate economies. This will likely lead
    Bitcoin to decouple from the DXY Index, setting the stage for a new all-time high
    in 2025.</p><p class=\"post-content__disclaimer\" type=\"\">This article is for
    general information purposes and is not intended to be and should not be taken
    as legal or investment advice. The views, thoughts, and opinions expressed here
    are the author&rsquo;s alone and do not necessarily reflect or represent the views
    and opinions of Cointelegraph.</p><template data-name=\"subscription_form\" data-type=\"markets_outlook\"
    label=\"Subscription Form: Markets Outlook\"></template></p>\n</p>\n            "

    this weekTargets include $120,000 in the short term, with June in line for $150,000
    or more.“As for Bitcoin... Honestly.. Ridiculous, the more you zoom out, the more
    insane it looks,” filbfilb added on the outlook. “Short-term pullbacks below 100k
    are easily possible, however, I haven't seen such a bullish-looking thing in a
    long time.”BTC/USD 3-day chart with indicator data. Source: filbfilb/XThis article
    does not contain investment advice or recommendations. Every investment and trading

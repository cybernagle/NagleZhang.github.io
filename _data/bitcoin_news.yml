  summary: "Today in crypto, Warren Buffett announces he wants to step down as CEO
    of Berkshire Hathaway by the end of 2025, Arizona Governor Katie Hobbs has vetoed
    a bill that would have allowed the state to hold Bitcoin as part of its official
    reserves, and Apple has eased crypto application rules following a court order.Berkshire
    Hathaway CEO and notable investor Warren Buffett to step down by the end of 2025Warren
    Buffett, the CEO and founder of the Berkshire Hathaway investment firm, announced
    he is stepping down by the end of 2025 and letting his successor Greg Abel, the
    company's vice chairman of non-insurance operations, take the helm.The decision
    is still subject to the approval of the company's board of directors. However,
    Buffett said he was confident that the board would fully back the decision to
    elevate Abel, who has been groomed for this position for years, to the position
    of CEO.Speaking at the Berkshire Hathaway annual shareholder meeting on May 3,
    2025, Buffett announced his decision:\"The time has arrived when Greg should become
    the Chief executive officer of the company at year-end, and I want to spring that
    on the directors effectively and give that as my recommendation.\"Although investors
    have long anticipated the move, Buffett's announcement officially signals the
    end of an era at the publicly traded investment company.Buffett speaking at the
    Berkshire Hathaway annual shareholder meeting. Source: CNBCArizona governor vetoes
    bill to make Bitcoin part of state reservesArizona Governor Katie Hobbs has vetoed
    a bill that would have allowed the state to hold Bitcoin as part of its official
    reserves, effectively ending efforts to make Arizona the first US state to adopt
    such a policy.The Digital Assets Strategic Reserve bill, which would have permitted
    Arizona to invest seized funds into Bitcoin (BTC) and create a reserve managed
    by state officials, was formally struck down on Friday, according to an update
    on the Arizona State Legislature’s website.“Today, I vetoed Senate Bill 1025.
    The Arizona State Retirement System is one of the strongest in the nation because
    it makes sound and informed investments,” Hobbs wrote in a statement aimed at
    Warren Petersen, the President of the Arizona Senate.Hobbs had previously stated
    she would veto any legislation not tied to a bipartisan agreement on disability
    funding.Source: Governor Katie HobbsApple softens crypto app rules, “hugely bullish”
    for crypto industryCrypto app developers are now free to direct users to payments
    outside of Apple’s ecosystem without restrictions or hefty fees, after a United
    States district judge ruled that Apple violated an injunction in its antitrust
    legal battle against Epic Games.“The Court finds Apple in willful violation of
    this Court’s 2021 Injunction, which was issued to restrain and prohibit Apple’s
    anticompetitive conduct and anticompetitive pricing. Apple’s continued attempts
    to interfere with competition will not be tolerated,” US district judge Yvonne
    Gonzalez Rogers said in an April 30 court filing.“Effective immediately, Apple
    will no longer impede developers’ ability to communicate with users, nor will
    they levy or impose a new commission on off-app purchases,” Rogers added.Rogers
    reiterated, “This is an injunction, not a negotiation. There are no do-overs once
    a party willfully disregards a court order. Time is of the essence.”\n\n            "

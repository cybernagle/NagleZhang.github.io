- title: " How low can the Bitcoin price go? "
  url: https://cointelegraph.com/news/how-low-can-the-bitcoin-price-go?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin (BTC) price has declined by more than 6.5% over the last two days
    after rallying to $88,000 at the beginning of the week.Data from Cointelegraph
    Markets Pro and TradingView shows that the price of Bitcoin dropped from a high
    of $87,500 on March 28 to an intra-day low of $81,900 on March 29.BTC/USD daily
    chart. Source: Cointelegraph/TradingViewBitcoin’s price drop coincides with a
    marketwide drawdown fueled by uncertainties over Trump’s trade tariffs and poor
    economic data. The ensuing sell-off in stocks has left market participants wondering
    how much deeper the drawdown can go.Bitcoin wipes out liquidity in tumble to $81,000BTC
    continued mounting losses on March 29, down 3% over the last 24 hours to trade
    just above $82,000.Key points:BTC price fell as low as $81,983 on Bitstamp, wiping
    out all the gains from earlier this week.This came as US inflation data came in
    hotter than expected.The February US Personal Consumption Expenditures (PCE) Index
    reading showed inflation quickening — in contrast to the January print.While the
    month-on-month and year-on-year PCE tally met market expectations of  0.3% and
    2.5%, respectively, their core PCE equivalents were both 0.1% higher than anticipated.The
    implementation of broad-scale US tariffs next week—the so-called Liberation Day
    on April 2—also compounded investor concerns across markets.24-hour crypto market
    liquidations hit $338 million, per data from monitoring resource CoinGlass.Bitcoin
    wiped out more than $165 million in long positions between March 28 and March
    29.Crypto liquidations (screenshot). Source: CoinGlassAdditional data from CoinGlass
    showed intensive bands of buyer interest within the $70,000-$80,000 range in the
    six-month timeframe.This suggests that Bitcoin’s price might drop further to sweep
    the liquidity within this range before staging a sustained recovery.BTC/USDT liquidation
    heatmap (screenshot). Source: CoinGlassIn the short term, Bitcoin appears to have
    taken out “a lot of liquidity,” with a local bottom sitting within the $82,000
    and $80,000 range, according to analyst Stockmoney Lizards.With major short liquidation
    levels sitting above $88,000, the analyst said that Bitcoin could be experiencing
    a classic weekend correction with a possible reversal next week.“Typical weekend
    dump with next week’s reversal? At least, this is a possible scenario.”Related: 
    Bitcoin price falls toward range lows, but data shows ‘whales going wild right

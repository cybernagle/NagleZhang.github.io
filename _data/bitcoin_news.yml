    etc.), their presence alone wouldn't necessarily boost the AVAX price”The AVAX
    token’s downtrend comes during a wider crypto market correction, as investor sentiment
    is pressured by global uncertainty ahead of US President Donald Trump’s reciprocal
    import tariff announcement on April 2, a measure aimed at reducing the country’s
    estimated trade deficit of $1.2 trillion.Related: Michael Saylor’s Strategy buys

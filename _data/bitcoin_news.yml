  summary: "United States President Donald Trump has exempted an array of tech products
    including, smartphones, chips, computers, and select electronics from reciprocal
    tariffs, giving the tech industry a much-needed respite from trade pressures.According
    to the US Customs and Border Protection, storage cards, modems, diodes, semiconductors,
    and other electronics were also excluded from the  ‘reciprocal’ trade tariffs.
    \"Large-cap technology companies will ultimately come out ahead when this is all
    said and done,\" The Kobeissi letter wrote in an April 12 X post.US Customs and
    Border Protection announces tariff exemptions on select tech products. Source:
    US Customs and Border ProtectionThe tariff relief will take the pressure off of
    tech stocks, which were one of the biggest casualties of the trade war. Crypto
    markets are correlated with tech stocks and could also rally as risk appetite
    increases on positive trade war headlines.Following news of the tariff exemptions,
    the price of Bitcoin (BTC) broke past $85,000 on April 12, a signal that crypto
    markets are already responding to the latest macroeconomic development.Related:
    Billionaire investor would ‘not be surprised’ if Trump postpones tariffsMarkets
    hinge on Trump's every word during macroeconomic uncertaintyPresident Trump walked
    back the sweeping tariff policies on April 9 by initiating a 90-day pause on the
    reciprocal tariffs and lowering tariff rates to 10% for countries that did not
    respond with counter-tariffs on US goods.Bitcoin surged by 9% and the S&P 500

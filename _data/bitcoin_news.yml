- title: " Why Grayscale’s Bitcoin Trust still dominates ETF revenue in 2025 "
  url: https://cointelegraph.com/news/why-grayscales-bitcoin-trust-still-dominates-etf-revenue-2025?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "In the annals of financial history, few institutions have faced the tempests
    of competition with the steadfast resolve of Grayscale Bitcoin Trust (GBTC). Born
    in 2013 as a private placement, GBTC pioneered regulated Bitcoin investment, granting
    investors access to Bitcoin’s (BTC) meteoric rise without the perils of digital
    wallets or unregulated exchanges.On Jan. 11, 2024, it transitioned into a spot
    Bitcoin ETF following a landmark victory against the SEC. This marked a pivotal
    moment with the SEC’s view that ETFs can offer lower expense ratios and enhanced
    tax efficiency compared to traditional funds. Even still, GBTC’s financial resilience
    shines, generating $268.5 million in annual revenue, surpassing the $211.8 million
    of all other US spot Bitcoin ETFs combined, despite losing over half its holdings
    with $18 billion in outflows since early 2024. This is no fleeting triumph of
    inertia. The numbers tell a tale of paradox. BlackRock’s iShares Bitcoin Trust
    (IBIT), with $56 billion in assets under management (AUM) and a 0.25% fee, generated
    $137 million in 2024 while achieving $35.8 billion in inflows and $1 billion in
    daily trading volume within weeks of launch. Meanwhile, GBTC’s 1.5% expense ratio,
    up to seven times higher than competitors, fuels its revenue lead, even though
    it bled $17.4 billion in outflows, with a record single-day loss of $618 million
    on March 19, 2024, driven by investors chasing lower fees or capitalizing on the
    trust’s historical discount to net asset value (NAV), which plummeted from 50%
    to near zero by July 2024.This clash of revenue dominance and capital flight demands
    scrutiny, unveiling the intricate dance of investor psychology, market dynamics
    and Grayscale’s calculated resilience.Yet, GBTC’s $18 billion in AUM and its ability
    to generate $268.5 million despite significant outflows points to a deeper narrative:
    tax friction and institutionalized inertia. The inability of companies, family
    offices and other institutions to quickly pivot due to tax barriers and company
    directives bubbles to the surface. The $100-billion total spot Bitcoin ETF market
    points to the stakes of this contest, with Grayscale’s revenue dominance poised
    to evolve as competition intensifies.Related: The sentiment engine of Bitcoin
    ETFs is rewiring market structureWhat sustains GBTC’s revenue crown in this crucible
    of competition? Is it the arithmetic of high fees applied to a still-formidable
    AUM, the loyalty of battle-scarred investors, or the unseen weight of tax frictions
    binding them to their positions?As we probe this question, we uncover the mechanics
    of GBTC’s dominance and the broader currents shaping the future of crypto investment.
    The answer lies in a potent blend of history, strategy and the unyielding faith
    of investors in a titan that, against all odds, refuses to yield.GBTC Rev vs.
    all other ETFs. Source: CoinGlassGrayscale’s high-fee revenue engineAt the core
    of GBTC’s revenue dominance lies its 1.5% expense ratio, a towering figure beside
    competitors like IBIT and FBTC (both 0.25%), Bitwise (0.24%) and Franklin Templeton
    (0.19%).Applied to $17.9 billion in AUM, this fee yields $268.5 million annually,
    eclipsing the $211.8-million combined revenue of all other US spot Bitcoin ETFs,
    which manage $89 billion collectively.ETF Store president Nate Geraci remarked
    on X, “GBTC still making more [money] than all of the other ETFs combined… And
    it’s not even close.” This arithmetic edge endures despite $21 billion in outflows
    since January 2024, including a daily average loss of $89.9 million, underscoring
    the sheer power of high fees on a substantial asset base.Source: Nate GeraciThe
    fee structure is both GBTC’s bastion and its Achilles’ heel. Before its ETF conversion,
    GBTC charged 2%, a rate justified by its monopoly as the sole US vehicle for Bitcoin
    exposure within traditional portfolios. Post-conversion, the 1.5% fee draws ire,
    with Bryan Armour, director of passive strategies research for Morningstar, predicting
    sustained outflows as investors flock to cheaper alternatives. Grayscale’s counterstroke
    was the Grayscale Bitcoin Mini Trust (BTC), launched in March 2025 with a 0.15%
    fee (the lowest among US spot Bitcoin ETPs). Seeded with 10% of GBTC’s Bitcoin
    holdings ($1.7 billion AUM), the Mini Trust has drawn $168.9 million in inflows,
    targeting cost-conscious investors. However, the Mini Trust’s lower revenue per
    dollar of AUM ($2.55 million annually) pales beside GBTC’s $268.5 million, reinforcing
    the latter’s dominance.Grayscale’s dual strategy (high-fee GBTC for revenue, low-fee
    Mini Trust for retention) reveals a nuanced defense, but the fortress of GBTC’s
    fees remains unbreached, its revenue crown secure for now.Legacy and loyaltyBeyond
    the arithmetic of fees, GBTC’s revenue supremacy rests on its storied legacy,
    the fierce loyalty it inspires and the formidable tax frictions that tether investors
    to its fold. Since 2013, Grayscale has been the standard-bearer of regulated Bitcoin
    investment, overcoming regulatory tempests to become the first publicly traded
    Bitcoin fund in 2015 and the largest spot Bitcoin ETF by AUM ($26 billion) upon
    its NYSE Arca listing in 2024.Its August 2023 legal victory against the US SEC,
    which compelled the approval of spot Bitcoin ETFs, solidified its stature as a
    pioneer. This legacy resonates with institutional and accredited investors, many
    of whom entered GBTC during its private placement phase or at steep NAV discounts,
    forging a bond that endures.Tax considerations form a silent but mighty anchor.
    Many early GBTC investors purchased shares at low prices, with Bitcoin trading
    at $800 in 2013 compared to the mid-$90,000 range by May 2025. This roughly 120-fold
    increase has generated substantial unrealized capital gains, making sales costly.Related:
    Bitcoin price recovers, Ethereum RWA value up 20%: April in chartsAn investor
    who purchased 100 shares of GBTC at $10 in 2015 and now sees them valued at $400
    each would be sitting on a $39,000 capital gain. Selling those shares to move
    into a lower-fee ETF like IBIT or FBTC could trigger a tax bill of $7,800 at the
    20% long-term capital gains rate typically applied to high-net-worth individuals
    or $5,850 at the 15% rate for others. This kind of taxable event often discourages
    redemptions, particularly for long-term holders in taxable accounts.On the other
    hand, for those holding GBTC in tax-advantaged vehicles such as IRAs or 401(k)s,
    gains can be deferred and, in the case of Roth IRAs, avoided entirely, making
    GBTC comparatively more attractive for legacy investors reluctant to switch.Psychological
    factors amplify these barriers. Loss aversion (the reluctance to realize taxable
    gains) and loyalty to Grayscale’s brand deter investors from abandoning a vehicle
    that weathered Bitcoin’s volatility. The closure of the NAV discount (from 50%
    to near zero in July 2024) spurred outflows as arbitrageurs cashed out. Still,
    core holders remain, bolstered by trust in Grayscale’s custodianship via Coinbase
    Custody, which secures $18.08 billion in AUM in May 2024. Its investor base, spanning
    crypto-native institutions, hedge funds and retail clients via platforms like
    Fidelity and Schwab, values its simplicity (no crypto wallets required) and regulatory
    pedigree.While IBIT and FBTC draw new capital with lower fees and liquidity, GBTC
    retains a niche among those who see it as a battle-tested titan. Former Grayscale
    CEO Michael Sonnenshein’s claim that outflows are reaching “equilibrium” suggests
    a stabilizing core, with tax frictions and legacy fortifying retention. In a market
    driven by innovation, GBTC’s history, bolstered by tax barriers and investor faith,
    is its shield, guarding its revenue crown against the relentless advance of newer
    rivals.A historical timeline graphic showing GBTC milestones (2013 launch, 2015
    public trading, 2023 SEC victory, 2024 ETF conversion), with Bitcoin price spikes
    ($800 to $103,000) and AUM growth overlaid. Source: Dr. Michael Tabone Magazine:
    ZK-proofs are bringing smart contracts to Bitcoin — BitcoinOS and Starknet\n\n
    \           "

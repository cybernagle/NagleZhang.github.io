- title: " Trump tariffs squeeze already struggling Bitcoin miners — Braiins exec "
  url: https://cointelegraph.com/news/trump-tariffs-bitcoin-mining-impact?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "The new trade tariffs announced by US President Donald Trump may place
    added pressure on the Bitcoin mining ecosystem both domestically and globally,
    according to one industry executive.While the US is home to Bitcoin (BTC) mining
    manufacturing firms such as Auradine, it’s still “not possible to make the whole
    supply chain, including materials, US-based,” Kristian Csepcsar, chief marketing
    officer at BTC mining tech provider Braiins, told Cointelegraph.On April 2, Trump
    announced sweeping tariffs, imposing a 10% tariff on all countries that export
    to the US and introducing “reciprocal” levies targeting America’s key trading
    partners.Community members have debated the potential effects of the tariffs on
    Bitcoin, with some saying their impact has been overstated, while others see them
    as a significant threat.Tariffs compound existing mining challengesCsepcsar said
    the mining industry is already experiencing tough times, pointing to key indicators
    like the BTC hashprice.Hashprice — a measure of a miner’s daily revenue per unit
    of hash power spent to mine BTC blocks — has been on the decline since 2022 and
    dropped to all-time lows of $50 for the first time in 2024.According to data from
    Bitbo, the BTC hashprice was still hovering around all-time low levels of $53
    on March 30.Bitcoin hashprice since late 2013. Source: Bitbo“Hashprice is the
    key metric miners follow to understand their bottom line. It is how many dollars
    one terahash makes a day. A key profitability metric, and it is at all-time lows,
    ever,” Csepcsar said.He added that mining equipment tariffs were already increasing
    under the Biden administration in 2024, and cited comments from Summer Meng, general
    manager at Chinese crypto mining supplier Bitmars.Source: Summer Meng“But they
    keep getting stricter under Trump,” Csepcsar added, referring to companies such
    as the China-based Bitmain — the world’s largest ASIC manufacturer —  which is
    subject to the new tariffs.Trump’s latest measures include a 34% additional tariff
    on top of an existing 20% levy for Chinese mining imports. In response, China
    reportedly imposed its own retaliatory tariffs on April 4.BTC mining firms to
    “lose in the short term”Csepcsar also noted that cutting-edge chips for crypto
    mining are currently massively produced in countries like Taiwan and South Korea,
    which were hit by new 32% and 25% tariffs, respectively.“It will take a decade
    for the US to catch up with cutting-edge chip manufacturing. So again, companies,
    including American ones, lose in the short term,” he said.Source: jmhorpCsepcsar
    also observed that some countries in the Commonwealth of Independent States region,
    including Russia and Kazakhstan, have been beefing up mining efforts and could
    potentially overtake the US in hashrate dominance.Related: Bitcoin mining using
    coal energy down 43% since 2011 — Report“If we continue to see trade war, these
    regions with low tariffs and more favorable mining conditions can see a major
    boom,” Csepcsar warned.As the newly announced tariffs potentially hurt Bitcoin
    mining both globally and in the US, it may become more difficult for Trump to
    keep his promise of making the US the global mining leader.Trump’s stance on crypto
    has shifted multiple times over the years. As his administration embraces a more
    pro-crypto agenda, it remains to be seen how the latest economic policies will
    impact his long-term strategy for digital assets.Magazine: Bitcoin ATH sooner
    than expected? XRP may drop 40%, and more: Hodler’s Digest, March 23 – 29\n\n
    \           "

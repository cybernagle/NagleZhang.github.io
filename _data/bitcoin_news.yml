    EMA, which is a strong near-term support to keep an eye on. A bounce off the 20-day
    EMA will keep the bullish momentum intact, but a break below it could sink the
    pair to the 50-day simple moving average ($85,645).Ether price predictionEther
    (ETH) is finding support at the moving averages, but the bulls have failed to
    resume the relief rally.ETH/USDT daily chart. Source: Cointelegraph/TradingViewA
    break and close above $1,858 signals strength to the buyers. The ETH/USDT pair
    could then rally to the breakdown level of $2,111. Sellers are expected to aggressively
    defend the $2,111 level as a break above it suggests that the downtrend has ended.
    The pair could then skyrocket to $2,550.On the contrary, if the price turns down
    and breaks below the moving averages, it signals a range formation. The pair could
    swing between $2,111 and $1,368 for a while.XRP price predictionXRP (XRP) turned
    down from the resistance line on April 28 and slipped below the moving averages
    on April 30.XRP/USDT daily chart. Source: Cointelegraph/TradingViewIf the price
    continues lower and closes below the moving averages, it suggests that the bears
    have seized control. The pair could then retest the critical support at $2. If

- title: " Spar supermarket in Switzerland starts accepting Bitcoin payments "
  url: https://cointelegraph.com/news/spar-store-zug-switzerland-bitcoin-payments-lightning-network?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Global grocery giant Spar has rolled out Bitcoin-based payments in a Swiss
    city, marking another step in the growing adoption of cryptocurrency for everyday
    transactions.A Spar supermarket in Zug, Switzerland, has implemented Bitcoin (BTC)
    payments via the Lightning Network.The store’s Bitcoin payments went live on BTC
    Map, a community-driven project highlighting stores that accept BTC payments,
    DFX Swiss, a crypto-to-fiat payment solution firm, announced in an April 17 LinkedIn
    post.“This SPAR location is among the first supermarkets in Switzerland where
    you can pay directly at the checkout using Bitcoin (via LNURL), thanks to our
    new hashtag#OpenCryptoPay solution, an open P2P standard for in-person crypto
    payments,” DFX said.Spar in Zug adopts Bitcoin payment, announcement. Source:
    DFX SwissSwitzerland has long been regarded as one of the more crypto-friendly
    European jurisdictions with some of the earliest crypto-adoption initiatives.In
    2023, the Swiss city of Lugano adopted Bitcoin and Tether USDt (USDT) payments
    for all municipal fees, one of the world’s first city administrations to do so.There
    are currently 1,013 stores and businesses accepting Bitcoin payments in Switzerland,
    according to BTCmap data.Businesses accepting Bitcoin payment in Switzerland,
    Europe. Source: BTCmapRelated: ‘Bitcoin Standard’ author to develop Austrian economics
    curriculum for UK schoolBitcoin adoption among retail giants with a global presence
    may increase mainstream trust in cryptocurrency payments.Spar operates over 13,900
    stores across 48 countries, with over 14.7 million daily shoppers and 450,000
    employees worldwide.Related: Crypto, stocks enter ‘new phase of trade war’ as
    US-China tensions riseSpar in Zug enables seamless Bitcoin payment via QR codeFriction
    points and complicated user experience are often criticized as some of the biggest
    hurdles limiting mainstream blockchain adoption.However, Spar’s Bitcoin implementation
    enables easy payments by scanning a simple quick-response (QR) code, according
    to Rahim Taghizadegan, a university lecturer and director of Bitcoin Association
    Switzerland.In an April 16 LinkedIn post, he outlined how simple it is to pay
    using BTC in Spar:“Just scan a static QR code, send sats, immediate and easy registration
    by the cashier. If enough people use it, it may be rolled out in the whole country.
    ““I used Phoenix Wallet for [the Lightning Network], but pretty much anything
    works,” he added.Bitcoin payment in Spar, Zug, Switzerland. Source: Rahim TaghizadeganIncreasingly
    more companies are adopting cryptocurrency in the country. Switzerland-based blockchain
    ecosystem Crypto Valley surpassed $593 billion in valuation in 2024 after a 55%
    yearly increase, Cointelegraph reported on Jan. 21.Crypto Valley Unicorns. Source:
    CvVc.comAmong the 50 regional entities, 17 have reached unicorn status, with a
    $1 billion or more valuation.“A Swiss industry where the Top 50 entities share
    a valuation of $593 billion and whose funding medians exceed global medians reflects
    vision and resilience,” Mathias Ruch, founder and CEO of CV VC, told Cointelegraph.Top
    50 projects in Crypto Valley. Source: CvVc.comSome of Crypto Valley’s well-known
    projects include the layer-1 (L1) blockchain network Ethereum, Cardano and the
    Casper blockchain.Magazine: BTC’s ‘reasonable’ $180K target, NFTs plunge in 2024,
    and more: Hodler’s Digest Jan 12 – 18\n\n            "

- title: " UK authorizes charges against NCA officer for alleged Bitcoin theft "
  url: https://cointelegraph.com/news/uk-charges-officer-bitcoin-theft?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTU5MmUtZjI5ZC03YmUwLWJjOWEtYTdiY2NkZmI5MWEx.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTU5MmUtZjI5ZC03YmUwLWJjOWEtYTdiY2NkZmI5MWEx.jpg\"
    alt=\"UK authorizes charges against NCA officer for alleged Bitcoin theft\"></p><p>The
    agency responsible for conducting criminal prosecutions in England and Wales announced
    that a National Crime Agency (NCA) officer was due to be charged with the alleged
    theft of Bitcoin worth roughly $75,000 in 2017.<p>In a March 14 notice, the Crown
    Prosecution Service <a data-ct-non-breakable=\"null\" href=\"https://www.cps.gov.uk/cps/news/cps-authorises-charges-against-nca-officer\"
    rel=\"noopener noreferrer nofollow\" target=\"_blank\" text=\"null\" title=\"null\">said</a>
    it had authorized the Merseyside Police to charge NCA officer Paul Chowles with
    15 offenses related to the alleged Bitcoin (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/bitcoin-price\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">BTC</a>) theft &ldquo;during an investigation into
    online organized crime.&rdquo; Authorities said Chowles could face one count of
    theft, 11 charges for concealing, disguising, or converting criminal property
    and three counts for acquiring, using or possessing criminal property.</p><iframe
    allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\"
    allowfullscreen=\"\" frameborder=\"0\" height=\"315\" loading=\"lazy\" src=\"https://www.youtube.com/embed/iWmJkVGZm6c?start=\"
    width=\"100%\"></iframe><p>The 50 Bitcoin, worth roughly $75,000 before the December
    2017 bull run, was valued at more than $4.2 million at the time of publication
    at a BTC price of $84,541. The NCA officer is expected to appear at the Liverpool
    Magistrates&rsquo; Court on April 25.</p><p><em><strong>Related: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/british-man-sues-council-640m-lost-bitcoin-landfill\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/news/british-man-sues-council-640m-lost-bitcoin-landfill\"><em><strong>British
    man sues council for $647M over lost Bitcoin in landfill</strong></em></a></p><p>In
    April 2024, amendments to the UK&rsquo;s Economic Crime and Corporate Transparency
    Act authorized NCA officers and local police to <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/uk-police-seize-criminal-crypto-without-arrests\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">seize crypto from suspected
    criminals</a> without arresting them. The Crown Prosecution Service did not mention
    how Chowles allegedly stole the Bitcoin or whether the funds were connected to
    illicit activities.</p><template data-buzzsprout-episode-id=\"16668327\" data-buzzsprout-podcast-id=\"2040516\"
    data-ct-widget=\"buzzsprout\"></template><h2>Crypto policies across the pond</h2><p>The
    NCA said in December 2024 that it had <a data-ct-non-breakable=\"null\" href=\"https://www.nationalcrimeagency.gov.uk/news/operation-destabilise-nca-disrupts-multi-billion-russian-money-laundering-networks-with-links-to-drugs-ransomware-and-espionage-resulting-in-84-arrests\"
    rel=\"noopener noreferrer nofollow\" target=\"_blank\" text=\"null\" title=\"null\">seized</a>
    roughly $26 million in cash and crypto and arrested 84 people as part of a global
    campaign to fight money laundering and organized crime. Some of the crypto addresses
    targeted by UK authorities at the time &ldquo;showed regular exposure to Garantex.&rdquo;
    The founder of the Russian crypto exchange was <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/india-arrest-aleksej-besciokov-garantex\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">arrested in India in
    March</a> and is expected to be extradited to the US to face criminal charges.&nbsp;</p><p>The
    UK government is expected to move forward on <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/uk-crypto-regulation-framework-2025\" rel=\"noopener\"
    target=\"_blank\" text=\"null\" title=\"https://cointelegraph.com/news/uk-crypto-regulation-framework-2025\">creating
    a comprehensive regulatory framework</a> for digital assets in 2025 following
    the Labour government&rsquo;s election victory. The country remains a significant
    market for crypto users, with Coinbase <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/coinbase-fca-uk-crypto-registration\"
    rel=\"noopener\" target=\"_blank\" text=\"null\" title=\"https://cointelegraph.com/news/coinbase-fca-uk-crypto-registration\">securing
    approval to operate</a> from the financial regulatory body in February.</p><p><em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/crypto-fans-obsessed-longevity-biohacking-why/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Crypto fans
    are obsessed with longevity and biohacking: Here&rsquo;s why</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"law_decoded\" label=\"Subscription
    Form: Law Decoded\"></template></p>\n</p>\n            "
  published: 2025-03-14 20:26:00 UTC
- title: " US House kills IRS DeFi broker rule, Solana won’t cut 80% inflation rate:
    Finance Redefined "
  url: https://cointelegraph.com/news/us-house-kills-irs-de-fi-broker-rule-solana-won-t-cut-80-inflation-rate?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDEvMDE5NDIyYjUtM2RiYi03OTBiLWFkMjEtYmZiMTk4MWQwNzZh.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDEvMDE5NDIyYjUtM2RiYi03OTBiLWFkMjEtYmZiMTk4MWQwNzZh.jpg\"
    alt=\"US House kills IRS DeFi broker rule, Solana won’t cut 80% inflation rate:
    Finance Redefined\"></p><p>In a significant regulatory development for the crypto
    industry, the United States House of Representatives voted to nullify a bill that
    threatened the privacy-preserving properties of decentralized finance (DeFi) protocols.<p>In
    the wider crypto space, one of the Solana network&rsquo;s most significant governance
    proposals was rejected; it sought to implement a mechanism to reduce Solana&rsquo;s
    inflation rate by about 80%.</p><h2>US House follows Senate in passing resolution
    to kill IRS DeFi broker rule</h2><p>The US House of Representatives voted to nullify
    a rule requiring decentralized finance (DeFi) protocols to report to the Internal
    Revenue Service.</p><p>On March 11, the House of Representatives <a data-ct-non-breakable=\"null\"
    href=\"https://clerk.house.gov/evs/2025/roll071.xml\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">voted</a> 292 for and 132 against a motion to repeal
    the so-called IRS DeFi broker rule that <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/irs-final-regulations-digital-asset-reporting-brokers\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">aimed to expand</a>
    existing IRS reporting requirements to crypto.</p><p>All 132 votes to keep the
    rule were Democrats. However, 76 Democrats joined with the Republicans to repeal
    it.&nbsp;</p><p>This followed the Senate&rsquo;s March 4 <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/us-senate-approves-killing-irs-crypto-broker-rule\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">vote on the motion</a>,
    which saw it pass 70 to 27.</p><p>The rule would have forced DeFi platforms, such
    as decentralized exchanges, to disclose gross proceeds from crypto sales, including
    information regarding taxpayers involved in the transactions.</p><p>After the
    vote, Republican Representative Mike Carey, who submitted the repeal motion, said,
    &ldquo;The DeFi broker rule invades the privacy of tens of millions of Americans,
    hinders the development of an important new industry in the United States and
    would overwhelm the IRS.&rdquo;</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/019594a3-536a-7e93-a8e4-673f18f6ab89\"
    title=\"\" alt=\"US House kills IRS DeFi broker rule, Solana won&rsquo;t cut 80%
    inflation rate: Finance Redefined\"><figcaption style=\"text-align: center;\"><p><em>Congressman
    Mike Carey speaking after the vote. Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/RepMikeCarey/status/1899579542961897884\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"https://x.com/RepMikeCarey/status/1899579542961897884\"><em>Mike
    Carey</em></a></p></figcaption></figure><p><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/us-house-follows-senate-kill-irs-defi-broker-rule\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><strong>Continue reading</strong></a></p><h2>Solana
    proposal to cut inflation rate by up to 80% fails</h2><p>A proposal to dramatically
    change Solana&rsquo;s inflation system was rejected by stakeholders but is being
    hailed as a victory for the network&rsquo;s governance process.</p><p>&ldquo;Even
    though our proposal was technically defeated by the vote, this was a major victory
    for the Solana ecosystem and its governance process,&rdquo; <a data-ct-non-breakable=\"null\"
    href=\"https://x.com/TusharJain_/status/1900343984477601861\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">commented</a> Multicoin Capital co-founder Tushar
    Jain on March 14.</p><p>Around 74% of the staked supply voted on proposal SIMD-228
    across 910 validators, but just 43.6% voted in favor of it, with 27.4% voting
    against it and 3.3% abstaining, <a data-ct-non-breakable=\"null\" href=\"https://dune.com/kagren0/simd-0228-voting-status\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">according</a> to Dune
    Analytics. It needed 66.67% approval from participating votes to pass and only
    received 61.4%.</p><p>Jain added that this was the biggest crypto governance vote
    ever, by the number of participants and the participating market cap, of any ecosystem,
    chain or network.</p><p>&ldquo;This was a meaningful scaling stress test &mdash;
    a social, rather than technical, stress test &mdash; and the network passed despite
    a wide stratification of diverging opinions and interests.&rdquo;</p><p><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/solana-proposal-cut-inflation-rate-fails-to-pass\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><strong>Continue reading</strong></a></p><h2>Bitcoin
    $70,000 retracement part of &ldquo;macro correction&rdquo; in bull market &mdash;
    Analysts</h2><p>Bitcoin&rsquo;s potential retracement to $70,000 may be an organic
    part of the current bull market, despite crypto investor fears of an early arrival
    of a bear market cycle.</p><p>Bitcoin (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>) fell more than
    14% during the past week to close at around $80,708 after investors were disappointed
    with the lack of direct federal Bitcoin investments in President Donald Trump&rsquo;s
    March 7 executive order. It outlined a plan to create a Bitcoin reserve using
    cryptocurrency forfeited in government criminal cases.</p><p>Despite the drop
    in investor sentiment, cryptocurrencies and global markets remain in a &ldquo;macro
    correction&rdquo; as part of the bull market, according to Aurelie Barthere, principal
    research analyst at the Nansen crypto intelligence platform.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/019594a3-56ce-7e99-9059-7afef7e0a1ad\"
    title=\"\" alt=\"US House kills IRS DeFi broker rule, Solana won&rsquo;t cut 80%
    inflation rate: Finance Redefined\"><figcaption style=\"text-align: center;\"><p><em>BTC/USD,
    1-month chart. Source: Cointelegraph</em></p></figcaption></figure><p>Most cryptocurrencies
    have broken key support levels, making it hard to estimate the next key price
    levels, the analyst told Cointelegraph, adding:</p><blockquote>&ldquo;This is
    a macro correction (US tech will be down by 3% in the future, as discussed), so
    we have to monitor BTC. Next level will be $71,000 - $72,000, top of the pre-election
    trading range.&rdquo;</blockquote><p>The analyst added: &ldquo;We are still in
    a correction within a bull market: Stocks and crypto have realized and are pricing;
    a period of tariff uncertainty and fiscal cuts, no Fed put. Recession fears are
    popping up.&rdquo;</p><p><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-70k-retracement-bull-market-analysts\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><strong>Continue reading</strong></a></p><h2>Calls
    for stricter rules on political memecoins after $4 billion Libra collapse</h2><p>Industry
    voices warned that politically endorsed cryptocurrencies must adopt stronger investor
    protections and liquidity safeguards to prevent another significant market collapse.</p><p>Investor
    sentiment remains shaken after the Libra (LIBRA) token, which was endorsed by
    Argentine President Javier Milei, suffered a $4 billion market cap wipeout due
    to insider cash-outs.</p><p>According to blockchain analytics firm DWF Labs, at
    least eight insider <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/milei-libra-token-scandal-107m-rug-pull\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">wallets withdrew $107
    million in liquidity</a>, triggering the massive collapse.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/019593a4-ef7c-7ace-a5f6-4ef3c2052f20\"
    title=\"\" alt=\"US House kills IRS DeFi broker rule, Solana won&rsquo;t cut 80%
    inflation rate: Finance Redefined\"><figcaption style=\"text-align: center;\"><p><em>Source:
    Kobeissi Letter</em></p></figcaption></figure><p>To avoid a similar meltdown,
    tokens with presidential endorsements will need more robust safety and economic
    mechanisms, such as liquidity locking or making the tokens in the liquidity pool
    non-sellable for a predetermined period, DWF Labs wrote in a report shared with
    Cointelegraph.</p><p>The report stated that tokens from high-profile leaders also
    need launch restrictions to limit participation from crypto-sniping bots and large
    holders or whales.</p><p>&ldquo;Limiting bot and whale activity is essential in
    limiting the impact of individuals acting on insider information to corner a large
    percentage of the token supply,&rdquo; according to Andrei Grachev, managing partner
    at DWF Labs.</p><p><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/presidential-token-launches-liquidity-locking-insider-restrictions\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><strong>Continue reading</strong></a></p><h2>Hyperliquid
    ups margin requirements after $4 million liquidation loss</h2><p>Hyperliquid,
    a blockchain network specializing in trading, increased margin requirements for
    traders after its liquidity pool lost millions of dollars during a massive Ether
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/ethereum-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">ETH</a>) liquidation,
    the network said.</p><p>On March 12, a trader intentionally liquidated a roughly
    $200 million Ether long position, causing Hyperliquid&rsquo;s liquidity pool,
    HLP, to lose $4 million, unwinding the trade.</p><p>Starting March 15, Hyperliquid
    will require traders to maintain a collateral margin of at least 20% on certain
    open positions to &ldquo;reduce the systemic impact of large positions with hypothetical
    market impact upon closing,&rdquo; Hyperliquid said in a March 13 X post.</p><p>The
    incident highlights the growing pains confronting Hyperliquid, which has emerged
    as Web3&rsquo;s most popular platform for leveraged perpetual trading.&nbsp;</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/019594a3-5ddb-7fc6-93c7-eba9414c7f10\"
    title=\"\" alt=\"US House kills IRS DeFi broker rule, Solana won&rsquo;t cut 80%
    inflation rate: Finance Redefined\"><figcaption style=\"text-align: center;\"><p><em>Hyperliquid
    has adjusted margin requirements for traders. Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/HyperliquidX/status/1900205791250202844\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"https://x.com/HyperliquidX/status/1900205791250202844\"><em>Hyperliquid</em></a></p></figcaption></figure><p>Hyperliquid
    said the $4 million loss was not from an exploit but rather a predictable consequence
    of the mechanics of its trading platform under extreme conditions.&nbsp;</p><p><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/hyperliquid-ups-margin-rules-4m-liquidation-loss\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><strong>Continue reading</strong></a></p><h2>DeFi
    market overview</h2><p>According to data from Cointelegraph Markets Pro and TradingView,
    most of the 100 largest cryptocurrencies by market capitalization ended the week
    in the red.</p><p>Of the top 100, the Hedera (<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/hedera-hbar-price-index\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\">HBAR</a>) token fell over 24%, marking the biggest
    weekly decrease, followed by JasmyCoin (JASMY) down over 21% over the past week.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/019594a3-62b4-776a-af29-ce3a37a0ac18\"
    title=\"\" alt=\"US House kills IRS DeFi broker rule, Solana won&rsquo;t cut 80%
    inflation rate: Finance Redefined\"><figcaption style=\"text-align: center;\"><p><em>Total
    value locked in DeFi. Source: DefiLlama</em></p></figcaption></figure><p>Thanks
    for reading our summary of this week&rsquo;s most impactful DeFi developments.
    Join us next Friday for more stories, insights and education regarding this dynamically
    advancing space.</p><template data-name=\"subscription_form\" data-type=\"defi_newsletter\"
    label=\"Subscription Form: DeFi Newsletter\"></template></p>\n</p>\n            "

- title: " Crypto, DeFi may widen wealth gap, destabilize finance: BIS report "
  url: https://cointelegraph.com/news/crypto-adoption-critical-mass-regulation-wealth-gap-bis?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "The growing adoption of cryptocurrencies may pose risks to the traditional
    financial system and exacerbate wealth inequality, according to the Bank for International
    Settlements (BIS).In an April 15 report, the BIS warned that the number of investors
    and amount of capital in crypto and decentralized finance (DeFi) have “reached
    a critical mass,” with investor protection becoming a “significant concern for
    regulators.”The size of the crypto market signals that authorities should be worried
    about the “stability of crypto over and above the role it may have for TradFi
    and the real economy,” the report states, highlighting the role of stablecoins,
    which the BIS said have “become the means through which participants transfer
    value within crypto.”BIS report on crypto and DeFi’s functions and financial stability
    implications. Source: BISThe report calls for targeted stablecoin regulation on
    stability and reserve asset requirements that will guarantee the redemption of
    stablecoins for US dollars during “stressed market conditions.”Related: Spar supermarket
    in Switzerland starts accepting Bitcoin paymentsThe report comes two weeks after
    the US House Financial Services Committee passed the Stablecoin Transparency and
    Accountability for a Better Ledger Economy, or STABLE Act, with a 32–17 vote on
    April 2.Source: Financial Services GOPThe STABLE Act aims to create a clear regulatory
    framework for dollar-denominated payment stablecoins, emphasizing transparency
    and consumer protection.On March 13, the GENIUS Act, short for Guiding and Establishing
    National Innovation for US Stablecoins, passed the Senate Banking Committee by
    a vote of 18–6. The act aims to establish collateralization guidelines and require
    full compliance with Anti-Money Laundering laws from stablecoin issuers.Related:
    $400M Web3 investment fund ABCDE halts new investments, fundraisingCrypto may
    exacerbate wealth gapThe BIS also raised concerns about how crypto markets may
    worsen income inequality by enabling larger investors to capitalize on the emotions
    of less sophisticated retail participants, as seen during the FTX collapse in
    2022.Whale vs retail activity after FTX collapse. Source:  BIS“As prices tumbled
    in 2022, users actually traded more,” the BIS report noted. “Most disturbingly,
    large bitcoin holders (“whales”) were selling as ordinary retail investors (“krill”)
    were buying.” It added:“This implies that the crypto market, which is often presented
    as an opportunity for inclusive growth and financial stability, can be a means
    for redistributing wealth from the poorer to the wealthier.”The report concludes
    that DeFi and TradFi have similar underlying economic drivers, but DeFi’s “distinctive
    features,” like “smart contract and composability,” present new challenges that
    need proactive regulatory interventions to “safeguard financial stability, while
    fostering innovation.”Magazine: Uni students crypto ‘grooming’ scandal, 67K scammed
    by fake women: Asia Express\n\n            "

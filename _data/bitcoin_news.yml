- title: " Metaplanet reaches 5,555 Bitcoin milestone with latest 555 BTC buy "
  url: https://cointelegraph.com/news/metaplanet-bitcoin-milestone-5555-btc?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Japan’s Metaplanet purchased an additional 555 Bitcoin as part of its
    aggressive accumulation strategy, bringing its total holdings to 5,555 BTC, valued
    at over $536 million at current prices.On May 7, the Tokyo-listed firm disclosed
    that it spent $53.4 million acquiring 555 Bitcoin (BTC) at an average price of
    $96,134. The company now holds 5,555 BTC, purchased for $481.5 million at an average
    price of $86,672 per Bitcoin, according to CEO Simon Gerovich.The company also
    announced the issuance of another $25 million in zero-coupon ordinary bonds to
    fund its ongoing BTC buys. Since early 2024, the firm has raised over 35 billion
    yen ($244 million) through zero-coupon bonds and stock acquisition rights via
    its partner, Evo Fund.The company’s proprietary key performance indicator, BTC
    Yield, has surged in recent quarters, reaching 309.8% in Q4 2024, 95.6% in Q1
    2025, and 21% in the current quarter.“In Japanese, the number 5 is pronounced
    “Go,” so today we’re shouting: Go go go go — to the moon and beyond!” Gerovich
    said in a post on X.Source: Simon GerovichRelated: Eric Trump joins Metaplanet’s
    strategic board of advisersMetaplanet announces US subsidiaryOn May 1, Metaplanet
    announced plans to launch a wholly owned US subsidiary, Metaplanet Treasury, based
    in Florida. The entity plans to raise up to $250 million to further its Bitcoin
    strategy and tap US capital markets.Metaplanet is Asia’s largest public corporate
    holder of Bitcoin and ranks 11th globally, according to BitcoinTreasuries.NET.At
    the beginning of April, the firm announced its acquisition of 696 BTC for 10.2
    billion yen ($67 million). Later that same month, the firm acquired 330 Bitcoin
    for $28.2 million at an average price of $85,605 per BTC, bringing its total holdings
    to 4,855.On April 24, the firm disclosed it bought an additional 145 BTC for $13.4
    million, boosting its total holdings to 5,000 BTC.Its shares surged 11% by midday
    on the Tokyo exchange, according to data from Google Finance.Magazine: Rise of
    MicroStrategy clones, Asia dominates crypto adoption: Asia Express 2024 review\n\n
    \           "

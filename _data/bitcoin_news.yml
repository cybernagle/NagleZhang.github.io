- title: " Metaplanet repays 2B yen bonds early, CEO comments on BTC ‘down days’ "
  url: https://cointelegraph.com/news/metaplanet-repays-bonds-ceo-comments-bitcoin-down-days?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Metaplanet, a Japanese hotel manager turned Bitcoin treasury company,
    has fully repaid 2 billion yen ($13.5 million) worth of bonds ahead of schedule
    as it seeks to shore up its financial position.Metaplanet conducted an early redemption
    of its 9th Series of Ordinary Bonds on April 4, more than five months before the
    maturity date, the company disclosed on April 7. The zero-interest bonds were
    issued in March through Metaplanet’s Evo Fund and used to acquire additional Bitcoin
    (BTC). Since the bonds carry zero interest, the repayment would not have a material
    impact on the company’s fiscal 2025 results, it said.Source: MetaplanetMetaplanet,
    which trades publicly on the Tokyo stock exchange, has made Bitcoin the center
    of its corporate strategy through a series of acquisitions. The company’s Bitcoin
    balance has swelled to 4,206 BTC, placing it among the top 10 publicly traded
    holders. The acquisitions are part of a broader strategy disclosed in January
    that could see Metaplanet purchase up to 21,000 BTC by the end of 2026. At the
    time, the company said it planned to raise more than $700 million to help fund
    its Bitcoin buying spree. Related: Metaplanet share price rises 4,800% as company
    stacks BTCCEO comments on Bitcoin price action Metaplanet has seemingly embraced
    Bitcoin’s volatility, having adopted a buy-the-dip mentality to acquire more of
    the digital asset. Over the weekend, Metaplanet CEO Simon Gerovich called Bitcoin’s
    volatility “a natural part of an asset that is truly rare, diversified, and has
    long-term potential,” according to a translated version of his social media post. Source:
    Simon GerovichBitcoin’s price is under renewed pressure as part of a global sell-off
    in risk assets stemming from US President Donald Trump’s “Liberation Day” tariff
    announcement last week. The BTC price plunged below $80,000 on April 7, according
    to Cointelegraph Markets Pro.Bitcoin’s performance mirrors broader declines in
    US stocks, with the benchmark S&P 500 Index losing $5 trillion over two trading
    sessions. Magazine: Bitcoin heading to $70K soon? Crypto baller funds SpaceX flight:
    Hodler’s Digest, March 30 – April 5\n\n            "
  published: 2025-04-07 16:20:57.000000000 +01:00
- title: " Hodlers on edge: Trump’s tariffs shake Bitcoin, but some are buying the
    dip "
  url: https://cointelegraph.com/news/hodlers-pressure-trump-tariffs-shake-bitcoin-hayes-buying?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin holders are facing renewed pressure following US President Donald
    Trump's trade tariff announcement, which sent shockwaves through global financial
    markets, including cryptocurrencies.Even with Bitcoin (BTC) hodlers under pressure,
    some community members, including BitMEX co-founder Arthur Hayes, are not missing
    a chance to buy BTC at a discount.“Been nibbling on BTC all day, and shall continue,”
    Hayes wrote on X on April 7 as the Bitcoin price hovered around $75,000.Source:
    Arthur HayesHe also predicted that Bitcoin’s dominance in the broader crypto market
    could grow. He expects the current 60.5% share of the market to go toward 70%.Traders
    are “powerless to second-guess Trump’s next move”While Hayes is stacking sats
    during the tariff-fueled market bloodbath, his investment firm, Maelstrom, reportedly
    sold BTC in December 2024, when Bitcoin traded near its all-time high of about
    $100,000.In a blog post titled “Trump Truth,” Hayes had predicted a massive crypto
    crash after Trump’s inauguration in January, forecasting a clash in market optimism
    over his crypto policies and the realities of policy implementation.Related: Michael
    Saylor’s Strategy halts Bitcoin buys despite dip below $87K“The gospel of Bitcoin
    evangelists to never sell and buy every dip is testing the nerves of hodlers,”
    Petr Kozyakov, co-founder and CEO at the payments infrastructure platform Mercuryo,
    told Cointelegraph.Bitcoin price in the past year. Source: CoinGecko“Amateur retail
    traders and the citadels of high finance appear equally powerless to second-guess
    Trump’s next move,” he said. He added that many traders are waiting on the sidelines,
    weighing whether the market has been oversold. Despite short-term uncertainty,
    Kozyakov remains bullish on Bitcoin’s long-term outlook as “the new digital gold.”“Traders
    are cautiously waiting on the sidelines for opportunities to re-enter the market
    and weighing if there may be evidence of overselling.”Kozyakov is far from being
    alone in seeing a promising future for Bitcoin as “new digital gold.” ARK Invest
    founder Cathie Wood is also bullish on Bitcoin vs. gold, claiming in February
    that the “substitution” of gold for Bitcoin has already happened.Bitcoin will
    fail without payment use case, says Jack DorseyDespite the bullish sentiment of
    Hayes and Wood, others in the crypto community have cautioned that Bitcoin needs
    more than just a store-of-value narrative to remain relevant.Jack Dorsey, former
    CEO of Twitter and serial crypto entrepreneur, is skeptical about whether BTC
    can succeed as a pure store of value.“If it [Bitcoin] just ends up being a store
    of value and nothing more, I don’t think it gains relevance at all,” Dorsey said
    on a “Presidio Bitcoin” podcast episode on April 2.Jack Dorsey on a “Presidio
    Bitcoin” podcast episode on April 2. Source: YouTubeTo stay relevant, Bitcoin
    has to maintain its payment use case, he said:“Otherwise, it’s just something
    you kind of buy and forget and only use in emergency situations or when you want
    to get liquid again. So I think if it doesn’t transition to payments and find
    that everyday use case, it just gets increasingly irrelevant. And that’s a failure
    to me.”Despite its volatility largely being seen as a major impediment to its
    payment use case, Bitcoin continued to be a major payment asset on platforms like
    BitPay in 2024. Some jurisdictions have used Bitcoin as a tool of payment in global
    trade as well.Magazine: Bitcoin heading to $70K soon? Crypto baller funds SpaceX
    flight: Hodler’s Digest, March 30 – April 5\n\n            "
  published: 2025-04-07 16:18:21.000000000 +01:00
- title: " Twitter User Claims TradingView Has Ignored a Fibonacci Retracement Bug
    for 5 Years "
  url: https://cointelegraph.com/news/twitter-user-claims-tradingview-has-ignored-a-fibonacci-retracement-bug-for-5-years?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\nUpdate: the CTO of TradingView told Cointelegraph in comments that the
    reports of a bug were inaccurate, and the Twitter user partially withdrew his
    earlier claims that the tool was broken.\nPopular chart analysis service TradingView
    reportedly contains a bug in the Fibonacci retracement technical analysis tool,
    according to a tweet by self-proclaimed certified Elliott wave analyst Cryptoteddybear
    published on June 13.\nThe Elliott wave principle is a type of technical analysis
    for predicting prices in financial markets by looking at recurring patterns.\nIn
    a video that he uploaded to YouTube, the analyst explains that the tool does linear
    calculations when in logarithmic charts, which he notes is a significant issue
    for Elliot wave traders. The official Twitter account of the company behind the
    charting service answered his tweet, announcing that the issue is being investigated,
    to which Cryptoteddybear answered:\n“Thank you @tradingview for finally taking
    this issue seriously.”\nThe first reports of the bug, posted over five years ago
    (in November 2014) on consumer community platform getsatisfaction, have been reportedly
    ignored by the company. Another report submitted on the same platform, dated June
    3, 2017, has seen the official TradingView account answer in the thread:\n“Hi,
    you are right, we have a planned task to fix this. Thanks for bringing this to
    our attention.”\nHowever, the problem apparently has not yet been solved. Cryptoteddybear
    claims that a company representative told him that he asked the technicians to
    increase the priority given to solving the bug.\nAs Cointelegraph recently reported,
    TradingView is one of the platforms that added the “CIX100” index — an AI-powered
    index for the 100 strongest-performing cryptocurrencies and tokens.\nAt the beginning
    of the current month, cryptocurrency analytics company Coin Metrics announced
    that it has acquired digital asset index firm Bletchley Indexes and plans to launch
    crypto smart beta indexes.\nAs of press time, TradingView has not responded to
    a request for comment.\n\n\n\n\n\n            "
  published: 2019-06-18 13:04:00.000000000 +01:00

- title: " Kevin O’Leary reveals key catalysts that could reverse the bearish trend "
  url: https://cointelegraph.com/news/kevin-o-leary-crypto-future-game-changing-legislation-bull-run?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "The crypto market is currently facing significant pressure, largely due
    to US President Donald Trump’s trade war and deteriorating macroeconomic conditions.
    These factors have put markets under strain, with some analysts predicting that
    the bull run is over and a bear market may be on the horizon.In a recent Cointelegraph
    interview, Kevin O’Leary, also known as “Mr. Wonderful,” shared his thoughts on
    the current state of the market and what could be ahead. Despite the turbulence,
    O’Leary remains optimistic about the future of Bitcoin (BTC). He explains that
    while the market is under pressure, he still expects Bitcoin to end the year higher
    as a couple of key factors come into play.A key issue discussed in the interview
    is the need for regulatory clarity, especially surrounding stablecoins. O’Leary
    is particularly focused on the GENIUS Act, which he believes will be passed imminently
    by the US Congress. “We have been waiting for almost seven years for this legislation.
    I have a feeling it’s going to make it, and when that happens, it’s a game changer,”
    O’Leary said.The passage of the GENIUS Act, which aims to provide regulatory clarity
    around stablecoins, should boost the adoption of dollar-backed stablecoins. This
    move is expected to bring much-needed stability and legitimacy to the crypto market,
    helping to mitigate some of the ongoing risks. O’Leary also shared insights into
    his personal crypto portfolio, revealing a diversified mix of assets in his portfolio.To
    dive deeper into O’Leary’s views on the current state of the crypto market and
    his personal approach to investing in crypto, make sure to watch the full interview
    on our channel.Related: Trump says US will be 'Bitcoin superpower' as BTC price
    breaks 4-month downtrend\n\n            "

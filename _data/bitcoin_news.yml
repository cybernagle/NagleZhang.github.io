- title: " &#039;Rich Dad, Poor Dad&#039; author calls for $1 million BTC by 2035 "
  url: https://cointelegraph.com/news/rich-dad-poor-dad-author-1-million-btc-2035?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Financial educator, author of Rich Dad, Poor Dad, and investor Robert
    Kiyosaki recently forecasted a $1 million Bitcoin (BTC) price by 2035 as the US
    dollar continues to lose value to inflationary monetary policies.\"I strongly
    believe, by 2035, that one Bitcoin will be over $ 1 million, Gold will be $30,000,
    and silver $3,000 a coin,\" Kiyosaki wrote in an April 18 X post.Kiyosaki, a self-described
    gold bug, has long argued that bearer assets like gold, silver, and more recently
    Bitcoin, are critical hedges against inflation and key to long-term generational
    wealth accumulation through economic cycles.United States M2 money supply 1959-2025.
    Source: TradingView\"In 2025, credit card debt is at all-time highs, US debt is
    at all-time highs, unemployment is rising, 401k’s are losing, and pensions are
    being stolen. The USA may be heading for a greater depression,\" Kiyosaki warned.Kiyosaki,
    like many other sound money advocates, has continually warned of an impending
    financial crash brought on by expansionist monetary policies and fiscal irresponsibility.
    Bitcoin maximalists argue that loose monetary policy will drive the price of Bitcoin
    to seven-figures.Related: Bitcoin could hit $1M if US buys 1M BTC — Bitcoin Policy
    InstituteAnalysts eye $1 million BTC in the 2030sIn May 2024, Twitter co-founder
    Jack Dorsey forecasted that the price of a single BTC would be $1 million by 2030
    and could appreciate further.Trader and investor Michaël van de Poppe told Cointelegraph,
    in November 2024, that Bitcoin could go to $1 million. However, the price appreciation
    would come with hyperinflation and a broader economic collapse, the trader said.Blockstream
    CEO Adam Back said the price of Bitcoin could rise to $1 million per coin if the
    Trump administration established a Bitcoin strategic reserve for the United States
    and started buying Bitcoin on the open market.On Dec. 10, Eric Trump delivered
    the keynote speech at the Bitcoin MENA event in Abu Dhabi, United Arab Emirates
    (UAE), and predicted that Bitcoin would hit $1 million due to its scarcity.More
    recently, in February 2025, Ark Invest CEO Cathie Wood said that Bitcoin could
    hit $1.5 million by 2030 if demand for the digital asset continues to grow.Magazine:
    TradFi fans ignored Lyn Alden’s BTC tip — Now she says it’ll hit 7 figures: X
    Hall of Flame\n\n            "

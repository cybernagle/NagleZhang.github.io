- title: " Bitwise lists four crypto ETPs on London stock exchange "
  url: https://cointelegraph.com/news/bitwise-lists-four-crypto-etps-london-stock-exchange?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Asset manager Bitwise has listed four Bitcoin (BTC) and Ether (ETH) exchange-traded
    products on the London Stock Exchange, expanding its presence in the European
    region.The listings include the Bitwise Core Bitcoin ETP, the Bitwise Physical
    Bitcoin ETP, Bitwise's Physical Ethereum ETP, and the Bitwise Ethereum Staking
    ETP, according to the April 16 announcement.The products are available to institutional
    or otherwise-qualified investors with an accreditation, and not open to retail
    investors.Bitwise is applying to launch crypto investment vehicles as digital
    assets gain a greater foothold in global financial markets, attracting more institutional
    interest in crypto and increasing the legitimacy of the nascent asset class.Related:
    Bitwise doubles down on $200K Bitcoin price prediction amid trade tensionBitwise
    expands ETF offerings following a regulatory shift in the USThe resignation of
    former Securities and Exchange Commission (SEC) Chairman Gary Gensler triggered
    a wave of crypto ETF applications in the United States. Asset managers and crypto
    firms rushed to submit filings in anticipation of a relaxed regulatory regime
    once Gensler left the agency in January.Bitwise's BTC and ETH ETF, which gives
    investors exposure to both digital assets in a single investment vehicle, was
    granted preliminary approval by the SEC in January but still requires final approval
    before listing.In March 2025, the New York Stock Exchange (NYSE) submitted an
    application for a rule change to list the Bitwise Dogecoin ETF on the US-based
    exchange.If approved, Dogecoin (DOGE) would be the first memecoin with a US-listed
    investment vehicle and could attract more institutional inflows into the dog-themed
    social token.Bitwise also filed for an Aptos ETF in March. The proposed Bitwise
    Aptos ETF will hold the native cryptocurrency of the high-throughput layer-1 blockchain,
    APT (APT), and will not feature staking rewards.Bitwise CIO Matt Hougan predicted
    Bitcoin ETFs would attract $50 billion in inflows during 2025.Institutional inflows
    into crypto ETFs act as a price stabilizer for digital assets with investment
    vehicles, lowering volatility through a pipeline siphoning capital from traditional
    investors in the stock market to cryptocurrencies.Magazine: Bitcoin ETFs make
    Coinbase a ‘honeypot’ for hackers and governments: Trezor CEO\n\n            "

- title: " Price predictions 5/9: BTC, ETH, XRP, BNB, SOL, DOGE, ADA, SUI, LINK, AVAX "
  url: https://cointelegraph.com/news/price-predictions-5-9-btc-eth-xrp-bnb-sol-doge-ada-sui-link-avax?utm_source=rss_feed&utm_medium=rss_tag_bitcoin%3Fhttps%3A%252F%252Fcointelegraph.com%252Frss%252Ftag%252Fbitcoin%3D&utm_campaign=rss_partner_inbound
  summary: "Key points:Bitcoin holding $100,000 as a level of support would confirm
    the current trend change.Ether leads among altcoins, and DeFi tokens could follow.Bitcoin
    (BTC) broke above the psychologically critical $100,000 level on May 8, and the
    bulls are trying to hold on to the level on May 9. In an X post, CoinGlass said
    that Bitcoin’s rally resulted in $837.80 million in short liquidations in a 24-hour
    period, the largest since 2021.Bitcoin’s rally also lifted several major altcoins,
    which soared above their respective overhead resistance levels. The altcoin rally
    was led by Ether (ETH), which surged roughly 22% on May 8, triggering a $328 million
    liquidation of Ether short positions.Crypto market data daily view. Source: Coin360Although
    the short-term picture has turned positive, Bitcoin bulls are expected to face
    significant resistance near the all-time high of $109,588. During pullbacks, traders
    will have to maintain the price above $100,000 to retain the bullish momentum. Could
    Bitcoin continue its upward move and pierce the all-time high? Are altcoins getting
    ready for a short-term rally? Let’s analyze the charts of the top 10 cryptocurrencies
    to find out.Bitcoin price predictionBitcoin rallied more than 6% and closed above
    the $100,000 barrier on May 8, indicating that buyers have asserted their supremacy.BTC/USDT
    daily chart. Source: Cointelegraph/TradingViewThe BTC/USDT pair could reach the
    $107,000 to $109,588 zone, where the bears are expected to mount a strong defense.
    The overbought level on the relative strength index (RSI) suggests a short-term
    pullback is possible.If the price turns down from the overhead resistance but
    finds support at the 20-day exponential moving average ($94,879), it signals a
    positive sentiment. The bulls will then make one more attempt to push the price
    above the all-time high.The first sign of weakness will be a close below the 20-day
    EMA. That suggests profit booking at higher levels. The pair may then tumble to
    the 50-day simple moving average ($88,139).Ether price predictionEther (ETH) skyrocketed
    above the $2,111 resistance on May 8 and extended its up move to nearly $2,550
    on May 9.ETH/USDT daily chart. Source: Cointelegraph/TradingViewThe long wick
    on the candlestick shows solid selling near $2,550. If the price turns down from
    $2,550 but finds support at $2,111, it indicates that the bulls are trying to
    flip the level into support. The bulls will then make one more attempt to drive
    the ETH/USDT pair above $2,550. If they succeed, the pair could climb to $2,850.Sellers
    will have to pull the price below the $2,111 level to weaken the bullish momentum.
    The pair may then slide to the 20-day EMA ($1,867).XRP price predictionBuyers
    have pushed XRP (XRP) to the resistance line, which is a crucial near-term level
    to watch out for.XRP/USDT daily chart. Source: Cointelegraph/TradingViewSellers
    are expected to defend the resistance line aggressively because a break and close
    above it signals a potential trend change. The XRP/USDT pair could rise to $2.60
    and subsequently to $3.If the price turns down from the resistance line but finds
    support at the moving averages, it suggests that the bulls are buying the dips.
    The bulls will then again attempt to propel the price above the resistance line.
    Sellers will have to tug the price below the $2 support to seize control.BNB price
    predictionBNB (BNB) made a decisive move higher on May 8 and rose above the immediate
    overhead resistance at $620.BNB/USDT daily chart. Source: Cointelegraph/TradingViewThe
    BNB/USDT pair reached the $644 level on May 9, which is expected to behave as
    a strong barrier. However, if buyers keep up the pressure and pierce the $644
    resistance, the pair could soar to $680.Time is running out for the bears. If
    they want to halt the uptrend, they will have to fiercely defend the $644 level
    and pull the price below the moving averages. The pair could then descend to $580.Solana
    price predictionSolana (SOL) broke and closed above the $153 resistance on May
    8, indicating that the bulls are in charge.SOL/USDT daily chart. Source: Cointelegraph/TradingViewThe

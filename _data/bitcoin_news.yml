- title: " Bitcoin sidechains will drive BTCfi growth "
  url: https://cointelegraph.com/news/bitcoin-sidechains-will-drive-btcfi-growth?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Opinion by: Brendon Sedo, Core DAO initial contributorBitcoin is outgrowing
    the “digital gold” narrative. The primary driver of this shift is the rise of
    Bitcoin DeFi (BTCfi), which looks beyond the mere store-of-value use cases. In
    2024, Bitcoin (BTC) became a natively yield-generating asset and the centerpiece
    of Ethereum-style decentralized finance ecosystems. 2025 is when that kindling
    can grow its flame on innovative Bitcoin sidechains. Most past attempts to tap
    Bitcoin’s value as a productive asset required significant changes to its base
    layer. That’s a big reason they failed. The Bitcoin layer 1 is not designed for
    much change, leaving most Bitcoiners to merely hodl and not do much else. The
    result is that Bitcoin remained underutilized as a network and an asset.Bitcoin
    sidechains have emerged as the perfect solution to all these problems, scaling
    Bitcoin’s utility without altering or being limited by the base layer. Naturally,
    these protocols will be the most potent catalyst for BTCfi’s growth, especially
    with BTC surpassing $100,000, constituting over 60% of the total crypto market
    share, and entering a new regulatory landscape with the first “pro-crypto” US
    government regime.Scaling Bitcoin, a productive assetPer Hal Finney, “Bitcoin
    itself cannot scale to have every single financial transaction […] included in
    the blockchain.” That’s why there’s a need for a secondary level of payment’ in
    his view. For a long time, the blockchain space ignored Finney’s call to action
    and prioritized innovation that isolated Bitcoin. However, innovations previously
    limited to chains like Ethereum are now crossing over to the world of Bitcoin.
    Sidechains, rollups and other scaling solutions offer more options for holders
    who want Ethereum-style utility while remaining aligned with Bitcoin. This prepared
    the ground for BTCfi, where holders can access a range of income-generating solutions
    like staking, lending and derivatives. The industry is, however, still in the
    early innings of this revolution in Bitcoin. As of November 2024, merely 0.8%
    of its circulating supply is utilized for DeFi use cases, according to Galaxy
    Digital. Out of Bitcoin’s roughly $2 trillion market cap, less than $7 billion
    comprises BTCfi TVL.While this may appear unencouraging, it highlights the massive
    remaining opportunity. Bitcoin L2 infrastructure scaled 7x from 2021 to November
    2024. Recent: Bitcoin DeFi TVL up 2,000% amid bumper 2024 for BTC price, adoptionMore
    importantly, it has accounted for a sizable share of new liquidity flowing into
    BTC, besides institutional products like exchange-traded funds (ETFs). Even if
    the supply of Bitcoin in BTCfi platforms and sidechains grows by 0.25% annually,
    the sector will have a total addressable market of $44 billion to $47 billion
    by 2030, according to Galaxy Digital. However, as Bitcoiners know, this is a conservative
    estimate and would be accelerated by accelerating BTC price action or even more
    Bitcoin DeFi adoption. VCs, for one, have started to recognize the potential of
    Bitcoin sidechains, investing over $447 million already, according to Galaxy Digital.
    Of this, about $174 million was invested in Q3 2024, setting the stage for more
    explosive growth in 2025. More funding for early-stage projects will ensure more
    successful launches, innovations, choices for users, and overall value. As Bitcoin-native
    solutions provide access to productive use cases for Bitcoin, users will no longer
    need to rely on trusted intermediaries and Bitcoin-agnostic smart contract platforms.
    Sacrifices that were necessary to expand the utility of Bitcoin in the past will
    no longer be required. That can unlock substantial value for principled BTC holders
    and even the Bitcoin network itself. Yields on Bitcoin for BitcoinSo far, bridging
    to Turing-complete Ethereum Virtual Machine (EVM) chains has been a go-to way
    to facilitate yields and other financial use cases on Bitcoin. For example, the
    wrapped Bitcoin (WBTC) market on Ethereum is more than $10 billion. While solutions
    like WBTC have been suitable for some, many Bitcoin holders prefer not to entrust
    custodians with their capital or rely on chains like Ethereum, which do not align
    with Bitcoin's consensus principles or support the network at all. BTCfi, defined
    by Bitcoin-aligned and Bitcoin-powered infrastructure, is a solution from which
    both WBTC users and Bitcoin purists can benefit. Users who are already accustomed
    to Ethereum’s smart contract sophistication can continue to enjoy that EVM experience
    while also growing closer to Bitcoin’s roots. Principled Bitcoin users can get
    more options for their BTC’s utility if the sidechain aligns with the base network. Bitcoin
    holders also gain access to BTC derivatives superior to Ethereum-native solutions
    like WBTC. Yield-bearing BTC derivatives on Bitcoin-aligned sidechains are a 100x
    improvement, offering self-custody and previously unavailable yield sources to
    Bitcoin holders. Overall, BTCfi can be much more significant. Not just compared
    to where it is now, but also vis-a-vis EVM and SVM-based DeFi. Bitcoin sidechains
    are already driving this shift, and will continue to do so throughout 2025. All
    that is needed is the right approach and consistency regarding development and
    product pipelines.For BTCfi, the path is clear: Deliver use cases with product-market
    fit to Bitcoin holders on Bitcoin-powered platforms. This will lay the foundation
    for generating even more value for the Bitcoin community as a whole. And ultimately,
    there will be a positive flywheel of Bitcoin adoption. The institutional side
    led headlines in 2024. Now, it’s time for the native, onchain camp to show its
    strength and deliver. Opinion by: Brendon Sedo, Core DAO initial contributor.This
    article is for general information purposes and is not intended to be and should
    not be taken as legal or investment advice. The views, thoughts, and opinions
    expressed here are the author’s alone and do not necessarily reflect or represent
    the views and opinions of Cointelegraph.\n\n            "
  published: 2025-03-22 15:00:00.000000000 +00:00
- title: " Crypto markets will be pressured by trade wars until April: Analyst "
  url: https://cointelegraph.com/news/crypto-markets-pressured-trade-wars-april-analyst?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Global trade war concerns will pressure both cryptocurrency and traditional
    markets until at least the beginning of April, but the potential resolution may
    bring the next big market catalyst.Bitcoin’s (BTC) price fell over 17% since US
    President Donald Trump first announced import tariffs on Chinese goods on Jan.
    20, the first day after his presidential inauguration.Despite a multitude of positive
    crypto-specific developments, global tariff fears will continue to pressure the
    markets until at least April 2, according to Nicolai Sondergaard, a research analyst
    at Nansen.BTC/USD, 1-day chart. Source: Cointelegraph/TradingViewThe analyst said
    during Cointelegraph’s Chainreaction daily X show on March 21:“I’m looking forward
    to seeing what happens with the tariffs from April 2nd onwards, maybe we’ll see
    some of them dropped but it depends if all countries can agree. That’s the biggest
    driver at this moment.”Risk assets may lack direction until the tariff-related
    concerns are resolved, which may happen between April 2 and July, presenting a
    positive market catalyst, added the analyst.President Trump’s reciprocal tariff
    rates are set to take effect on April 2, despite earlier comments from Treasury
    Secretary Scott Bessent that indicated a possible delay in their activation.Related:
    Ether risks correction to $1.8K as ETF outflows, tariff fears continueFed’s interest
    rates are also contributing to market slumpHigh interest rates will also continue
    pressuring risk appetite among investors until the Federal Reserve eventually
    starts cutting rates, explained Sondergaard, adding:“We’re waiting for the Fed
    to see proper “bad news” before they will really start cutting rates.”Fed target
    interest rate probabilities. Source: CME Group’s FedWatch toolMarkets are currently
    pricing in an 85% chance that the Fed will keep interest rates steady during the
    next Federal Open Market Committee (FOMC) meeting on May 7, according to the latest
    estimates of the CME Group’s FedWatch tool.Related: Crypto debanking is not over
    until Jan 2026: Caitlin LongStill, the Federal Reserve indicates that inflation
    and recession-related concerns are transitory, particularly regarding tariffs,
    which may be a positive sign for investors, according to Iliya Kalchev, dispatch
    analyst at Nexo digital asset investment platform.“Markets may now expect upcoming
    economic data with greater confidence,” the analyst told Cointelegraph, adding:“Cooling
    inflation and stable economic conditions could further boost investor appetite,
    driving additional upside for Bitcoin and digital assets.”“Keep an eye on key
    reports, including Consumer Confidence, Q4 GDP, jobless claims, and next week’s
    crucial PCE inflation release, to gauge the likelihood of future rate cuts,” the
    analyst added.Magazine: SEC’s U-turn on crypto leaves key questions unanswered\n\n
    \           "
  published: 2025-03-22 12:04:59.000000000 +00:00
- title: " Crypto VC giant targets $1B for new funds, expects oversubscription — Report "
  url: https://cointelegraph.com/news/crypto-venture-capitalist-one-billion-two-new-crypto-funds?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Venture capital firm Haun Ventures is reportedly looking to raise $1 billion
    for two new crypto-related investment funds within the next three months.If successful,
    $500 million will be allocated to early-stage crypto investments, while the remaining
    $500 million will go toward late-stage crypto investments, people familiar with
    the matter told Fortune Crypto on March 21.Different market conditions to 2022
    led to lowered expectationsThe VC firm, founded by former Coinbase board member
    and federal prosecutor Katie Haun in 2022, reportedly did not aim for the $1.5
    billion it raised in its highly praised funding round in 2022. It cited different
    market conditions as the reason for the lower target.However, Haun reportedly
    expects the two new funds will be “oversubscribed.” In March 2022, Haun secured
    $1.5 billion in the company’s first funding round shortly after its launch. Haun
    also recruited former executives from Airbnb, Coinbase, and Google tech incubator
    Jigsaw.The firm’s latest fundraising round is set to close in June and is expected
    to be one of the largest in crypto funding in the past two years. Venture capital
    firm Paradigm and digital asset investment manager Pantera Capital both sought
    similar amounts in 2024.137 crypto companies raised a combined $1.11 billion in
    funding in February 2025. Source: The TIEIn June 2024, Paradigm closed an $850
    million investment fund, while in April, digital asset investment manager Pantera
    Capital sought to raise over $1 billion for a new blockchain-focused fund.VCs
    predict that stablecoins will continue to be a focus in 2025More recently, Haun
    Ventures participated in crypto asset management firm Bitwise’s $70 million funding
    round alongside investors such as Electric Capital, MassMutual, MIT Investment
    Management Company, and Highland Capital.While the specific focus of Haun’s upcoming
    crypto funds is not publicly known yet, other venture capitalists have recently
    predicted that stablecoin interest will continue into 2025.Related: Venture capital
    firms invest $400M in TON blockchainDeng Chao, CEO of institutional asset manager
    HashKey Capital, recently told Cointelegraph that stablecoins were the strongest
    proven use case for crypto in 2024. Meanwhile, market analyst Infinity Hedge predicted
    that crypto VC investment in 2025 would surpass last year’s levels but wouldn’t
    approach the peak recorded during the 2021 bull market. VC crypto funding in 2021
    reached $33.8 billion, while in 2024 it reached $13.6 billion.Cointelegraph reached
    out to Haun Ventures but did not receive a response by time of publication.Magazine:
    Dummies guide to native rollups: L2s as secure as Ethereum itself\n\n            "
  published: 2025-03-22 02:03:51.000000000 +00:00
- title: " Coinbase in talks to buy derivatives exchange Deribit: Report "
  url: https://cointelegraph.com/news/coinbase-talks-to-buy-derivatives-exchange-deribit-report?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Coinbase is in advanced talks to buy Deribit, a cryptocurrency derivatives
    exchange, according to a March 21 report by Bloomberg.Acquiring Deribit — the
    world’s largest venue for trading Bitcoin (BTC) and Ether (ETH) options — would
    bolster Coinbase’s existing derivatives platform, which currently focuses on futures. Coinbase
    and Deribit have reportedly alerted regulators in Dubai to the deal talks. Deribit
    holds a license in Dubai, which would need to be transferred to Coinbase if a
    deal goes through, according to Bloomberg, which cited unnamed sources. In January,
    Bloomberg reported that a deal with Coinbase could value Deribit at between $4
    billion and $5 billion. Deribit lists options, futures and spot cryptocurrencies.
    Its total trading volumes last year were around $1.2 trillion, Bloomberg said. On
    March 20, Kraken, a rival crypto exchange, announced plans to acquire derivatives
    trading platform NinjaTrader for around $1.5 billion.Deribit is a popular crypto
    derivatives exchange. Source: DeribitRelated: Kraken to acquire NinjaTrader for
    $1.5B to offer US crypto futuresRed-hot marketCryptocurrency derivatives, such
    as futures and options, are surging in popularity in the US.Futures are standardized
    contracts allowing traders to buy or sell assets at a future date, often with
    leverage. Options are contracts granting the right to buy or sell — “call” or
    “put,” in trader parlance — an underlying asset at a certain price.Both types
    of financial derivatives are popular among both retail and institutional investors
    for hedging and speculation. In December, Coinbase said derivatives trading volumes
    soared roughly 10,950% in 2024, Coinbase said. Coinbase lists derivatives tied
    to some 92 different assets on its international exchange and a smaller number
    in the US, according to its 2024 annual report.In January, Robinhood rolled out
    cryptocurrency futures as the popular online brokerage redoubled its efforts to
    compete with Coinbase. In February, CME Group, the world’s largest derivatives
    exchange, said it clocked an average daily trading volume of approximately $10
    billion for crypto derivatives in the fourth quarter of 2024 — a more than 300%
    increase from the year prior. Coinbase launched the US’ first Commodity Futures
    Trading Commission-regulated Solana (SOL) futures in February. CME launched its
    own SOL futures contracts the following month.Magazine: 5 real use cases for useless
    memecoins\n\n            "
  published: 2025-03-21 19:20:57.000000000 +00:00
- title: " SEC’s XRP reversal marks crypto industry victory ahead of SOL futures ETF
    launch: Finance Redefined "
  url: https://cointelegraph.com/news/sec-xrp-reversal-crypto-industry-victory-sol-futures-etf-finance-redefined?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Crypto investors rejoiced this week after the US Securities and Exchange
    Commission dismissed one of the crypto industry’s most controversial lawsuits
    — one that resulted in an over four-year legal battle with Ripple Labs.In another
    significant regulatory development, Solana-based futures exchange-traded funds
    (ETFs) have debuted in the US, a move that may signal the approval of spot Solana
    (SOL) ETFs as the “next logical step” for lawmakers.SEC’s XRP reversal a “victory
    for the industry”: Ripple CEOThe SEC’s dismissal of its years-long lawsuit against
    Ripple Labs, the developer of the XRP Ledger blockchain network, is a “victory
    for the industry,” Ripple CEO Brad Garlinghouse said at Blockworks’ 2025 Digital
    Asset Summit in New York.On March 19, Garlinghouse revealed that the SEC would
    dismiss its legal action against Ripple, ending four years of litigation against
    the blockchain developer for an alleged $1.3-billion unregistered securities offering
    in 2020.“It feels like a victory for the industry and the beginning of a new chapter,”
    Garlinghouse said on March 19 at the Summit, which Cointelegraph attended. Ripple’s
    CEO said the SEC is dropping its case against the blockchain developer. Source:
    Brad GarlinghouseContinue readingSolana futures ETF to grow institutional adoption,
    despite limited inflowsThe crypto industry is set to debut the first SOL futures
    ETF, a significant development that may pave the way for the first spot SOL ETF
    as the “next logical step” for crypto-based trading products, according to industry
    watchers.Volatility Shares is launching two SOL futures ETFs, the Volatility Shares
    Solana ETF (SOLZ) and the Volatility Shares 2X Solana ETF (SOLT), on March 20.Volatility
    Shares Solana ETF SEC filing. Source: SECThe debut of the first SOL futures ETF
    may bring significant new institutional adoption for the SOL token, according
    to Ryan Lee, chief analyst at Bitget Research.The analyst told Cointelegraph: “The
    launch of the first Solana ETFs in the US could significantly boost Solana’s market
    position by increasing demand and liquidity for SOL, potentially narrowing the
    gap with Ethereum’s market cap.”The Solana ETF will grow institutional adoption
    by “offering a regulated investment vehicle, attracting billions in capital and
    reinforcing Solana’s competitiveness against Ethereum,” said Lee, adding that
    “Ethereum’s entrenched ecosystem remains a formidable barrier.”Continue readingPump.fun
    launches own DEX, drops RaydiumPump.fun has launched its own decentralized exchange
    (DEX) called PumpSwap, potentially displacing Raydium as the primary trading venue
    for Solana-based memecoins. Starting on March 20, memecoins that successfully
    bootstrap liquidity, or “bond,” on Pump.fun will migrate directly to PumpSwap,
    Pump.fun said in an X post. Previously, bonded Pump.fun tokens migrated to Raydium,
    which emerged as Solana’s most popular DEX, largely thanks to memecoin trading
    activity. According to Pump.fun, PumpSwap “functions similarly to Raydium V4 and
    Uniswap V2” and is designed “to create the most frictionless environment for trading
    coins.”“Migrations were a major point of friction - they slow a coin’s momentum
    and introduce needless complexity for new users,” Pump.fun said.“Now, migrations
    happen instantly and for free.”Raydium’s trading volumes surged in 2024, largely
    due to memecoins. Source: DefiLlamaContinue readingBybit: 89% of stolen $1.4B
    crypto still traceable post-hackThe lion’s share of the hacked Bybit funds is
    still traceable after the historic cybertheft, with blockchain investigators continuing
    their efforts to freeze and recover the funds.The crypto industry was rocked by
    the largest hack in history on Feb. 21 when Bybit lost over $1.4 billion in liquid-staked
    Ether (stETH), Mantle Staked ETH (mETH) and other digital assets.Blockchain security
    firms, including Arkham Intelligence, have identified North Korea’s Lazarus Group
    as the likely culprit behind the Bybit exploit as the attackers continue swapping
    the funds in an effort to make them untraceable.Despite the Lazarus Group’s efforts,
    over 88% of the stolen $1.4 billion remains traceable, according to Ben Zhou,
    co-founder and CEO of crypto exchange Bybit.The CEO wrote in a March 20 X post:“Total
    hacked funds of USD 1.4bn around 500k ETH. 88.87% remain traceable, 7.59% have
    gone dark, 3.54% have been frozen.”“86.29% (440,091 ETH, ~$1.23B) have been converted
    into 12,836 BTC across 9,117 wallets (Average 1.41 BTC each),” said the CEO, adding
    that the funds were mainly funneled through Bitcoin (BTC) mixers, including Wasbi,
    CryptoMixer, Railgun and Tornado Cash.Source: Ben ZhouThe CEO’s update comes nearly
    a month after the exchange was hacked. It took the Lazarus Group 10 days to move
    100% of the stolen funds through the decentralized crosschain protocol THORChain,
    Cointelegraph reported on March 4.Continue readingLibra, Melania creator’s “Wolf
    of Wall Street” memecoin crashes 99%The creator of the Libra token has launched
    another memecoin with some of the same concerning onchain patterns that pointed
    to significant insider trading activity ahead of the coin’s 99% collapse.Hayden
    Davis, co-creator of the Official Melania Meme (MELANIA) and Libra tokens, has
    launched a new Solana-based memecoin with an over 80% insider supply.Davis launched
    the Wolf (WOLF) memecoin on March 8, banking on rumors of Jordan Belfort, known
    as the Wolf of Wall Street, launching his own token.The token reached a peak $42
    million market cap. However, 82% of WOLF’s supply was bundled under the same entity,
    according to a March 15 X post by Bubblemaps, which wrote:“The bubble map revealed
    something strange — $WOLF had the same pattern as $HOOD, a token launched by Hayden
    Davis. Was he behind this one too?”Source: BubblemapsThe blockchain analytics
    platform revealed transfers across 17 different addresses, stemming back to the
    address “OxcEAe,” owned by Davis.“He funded these wallets months before $LIBRA
    and $WOLF launched, moving money through 17 addresses and 2 chains,” Bubblemaps

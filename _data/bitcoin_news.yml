- title: " Crypto execs expect global banking push into Bitcoin by end of 2025 "
  url: https://cointelegraph.com/news/crypto-banking-adoption-expected-by-end-of-2025?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Despite the ongoing market meltdown on US trade tariffs, executives at
    major cryptocurrency firms Messari and Sygnum are bullish on institutional Bitcoin
    adoption later in 2025.Speaking on a panel at Paris Blockchain Week on April 8,
    Messari CEO Eric Turner and Sygnum Bank’s chief strategy officer Thomas Eichenberger
    said they expect a significant shift in the banking sector’s involvement with
    crypto in the second half of the year.According to the executives, the global
    banking push into Bitcoin (BTC) services has great potential to happen in the
    second half of 2025 as regulators embrace crypto, including stablecoins and crypto
    services by banks.“I think we’re probably looking at a muted Q2, but I’m really
    excited for Q3 and Q4,” Messari’s Turner said during the panel discussion moderated
    by Cointelegraph CEO Yana Prikhodchenko, forecasting “really interesting” things
    coming to the crypto market in 2025.Crypto adoption is not just about TrumpWhile
    some investors focus on the pro-crypto stance of US President Donald Trump, Turner
    emphasized that broader regulatory momentum is what matters most.“When you look
    at the potential of having market structure regulation in the US, stablecoin regulation,
    and just the fact that across the board, not just President Trump himself, but
    the SEC and all these regulatory industries are really embracing crypto,” Turner
    said.Paris Blockchain Week’s panel with Cointelegraph CEO Yana Prikhodchenko,
    Bancor co-founder Eyal Hertzog, Sygnum’s CSO Thomas Eichenberger, Messari CEO
    Eric Turner, AWS fintech leader Alex Matsuo and Near chief operating officer Chris
    Donovan. Source: CointelegraphSygnum’s CSO Thomas Eichenberger said international
    banks with US branches are also poised to enter the market once the legal landscape
    becomes clearer:“I think it’s a matter of fact that US banks are preparing to
    be able to offer crypto custody and at least crypto spot trading services anytime
    soon.”“I think by then I would agree with you, Eric,” he continued, projecting
    a continued phase of market uncertainty until the US establishes a clear regulatory
    framework.Related: Ripple acquires crypto-friendly prime broker Hidden Road for
    $1.25BBanks are no longer afraid of Bitcoin regulatorsWith the establishment of
    clear crypto rules for banks in the US, there will be a rush for crypto services
    by large international banks that are incorporated outside of the US but have
    a US-based presence, Eichenberger said.“Some of them may have had their strategic
    plans in their cupboard to offer crypto-related services, but have been afraid
    that at some point they will be gone after by any of the  US regulatory authorities,”
    he said, adding:“Now I think there’s no one to be afraid of anymore in terms of
    regulatory authorities worldwide. So I think many of the large international banks
    will launch this year.”Magazine: Financial nihilism in crypto is over — It’s time
    to dream big again\n\n            "

- title: " Stablecoin rules needed in US before crypto tax reform, experts say "
  url: https://cointelegraph.com/news/us-crypto-leaders-seek-stablecoin-guidance-before-tax-reform?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "United States cryptocurrency regulations need more clarity on stablecoins
    and banking relationships before lawmakers prioritize tax reform, according to
    industry leaders and legal experts.“In my view, tax isn’t necessarily the priority
    for upgrading US crypto regulation,” according to Mattan Erder, general counsel
    at layer-3 decentralized blockchain network Orbs.A “tailored regulatory approach”
    for areas including securities laws and removing “obstacles in banking” is a priority
    for US lawmakers with “more upside” for the industry, Erder told Cointelegraph.“The
    new Trump administration is clearly all in on crypto and is taking steps that
    we could have only dreamed about a few years ago (including during his first term),”
    he said. “It seems likely that crypto regulation will be able to have it all and
    get much more clear and rational regulation in all areas, including tax.”Still,
    Erder noted there are limits to what President Donald Trump can accomplish through
    executive orders and regulatory agency action alone. “At some point, the laws
    themselves will need to change, and for that, he will need Congress,” he said.Trump’s
    March 7 executive order, which directed the government to establish a national
    Bitcoin reserve using crypto assets seized in criminal cases, was seen as a signal
    of growing federal support for digital assets.Related: Trump turned crypto from
    ‘oppressed industry’ to ‘centerpiece’ of US strategyDebanking concerns remainDespite
    the administration’s recent pro-crypto moves, industry experts say crypto firms
    may continue to face difficulties with banking access until at least January 2026.“It’s
    premature to say that debanking is over,” as “Trump won’t have the ability to
    appoint a new Fed governor until January,” Caitlin Long, founder and CEO of Custodia
    Bank, said during Cointelegraph’s Chainreaction daily X show.The Crypto Debanking
    Crisis: #CHAINREACTION https://t.co/nD4qkkzKnB— Cointelegraph (@Cointelegraph)
    March 21, 2025Industry outrage over alleged debanking reached a crescendo when
    a June 2024 lawsuit spearheaded by ​​Coinbase resulted in the release of letters
    showing US banking regulators asked certain financial institutions to “pause”
    crypto banking activities.Related: Bitcoin may benefit from US stablecoin dominance
    pushStablecoin legislation could unlock new growthDavid Pakman, managing partner
    at crypto investment firm CoinFund, said a stablecoin regulatory framework could
    encourage more traditional finance institutions to adopt blockchain-based payments.“Some
    of the potentially soon-to-pass legislation in the US, like the stablecoin bill,
    will unlock many of the traditional banks, financial services and payment companies
    onto crypto rails,” Pakman said during Cointelegraph’s Chainreaction live X show
    on March 27.“We hear this firsthand when we talk to them; they want to use crypto
    rails as a lower-cost, transparent, 24/7, and no middleman-dependent network for
    transferring money.”The comments come as the industry awaits progress on US stablecoin
    legislation, which may come as soon as in the next two months, according to Bo
    Hines, the executive director of the president’s Council of Advisers on Digital
    Assets.The GENIUS Act, an acronym for Guiding and Establishing National Innovation
    for US Stablecoins, would establish collateralization guidelines for stablecoin
    issuers while requiring full compliance with Anti-Money Laundering laws.Magazine:
    SEC’s U-turn on crypto leaves key questions unanswered\n\n            "

- title: " How high can Bitcoin price go? "
  url: https://cointelegraph.com/news/how-high-can-bitcoin-price-go?utm_source=rss_feed&utm_medium=rss_tag_bitcoin%3Fhttps%3A%252F%252Fcointelegraph.com%252Frss%252Ftag%252Fbitcoin%3D&utm_campaign=rss_partner_inbound
  summary: "Key takeaways:Bitcoin was up 4.3% on May 9, after breaking $100,000  for
    the first time since February.BTC price gains trigger $800 million in short liquidations,
    the largest since 2021.A bull flag on the weekly chart suggests a $182,200 target,
    with analysts predicting Bitcoin’s price can go as high as $1 million in 2025.Bitcoin’s
    (BTC) price is up 4.3% on May 9 as a fresh liquidity cascade sent BTC price soaring
    above $100,000 for the first time in over 90 days.BTC/USD pair trades above $100K
    for the first time since Feb. 4. Source: Cointelegraph/TradingViewBitcoin wipes
    out liquidity in return to 6-figuresBTC/USD rose as high as $104,150 during the
    late New York trading session on May 8, according to data from Cointelegraph Markets
    Pro and Bitstamp. Crypto market sentiment, as measured via the Crypto Fear & Greed
    Index, has increased from 65 to 73 in the last 24 hours, suggesting increasing
    “greed” among investors.Crypto Fear and Greed Index. Source: Alternative.me24-hour
    crypto market liquidations surpassed $925 million, including $800 million in short
    positions, marking it the largest short liquidation since 2021, according to monitoring
    resource CoinGlass.BTC/USDT liquidation heatmap. Source: CoinGlassSeveral bands
    of seller interest are above the spot price, with ask-orders worth $2.85 billion
    sitting close to the all-time high of $109,500. This suggests the ongoing rally
    still has room to run in the short term. However, crypto analyst GemXBT noted
    that in daily timeframes, the BTC/USD pair had triggered “overbought conditions”
    on the relative strength index (RSI) indicator, which rose above 70.Despite this,
    the analyst said strong support from the moving averages and the MACD moving above
    the signal line reinforced Bitcoin’s upside.“Bitcoin (BTC) is currently in an
    uptrend, trading above the 5MA, 10MA, and 20MA, indicating strong bullish momentum.
    The MACD is above the signal line, supporting the bullish sentiment.”BTC/USD daily
    chart. Source: Cointelegraph/TradingViewTraders set ambitious targets for Bitcoin
    priceBitcoin’s latest recovery has led market analysts and traders to set varied
    BTC price targets based on various analyses and sentiments. Bitcoin’s current
    rally may continue toward $106,000, according to popular crypto analyst AlphaBTC. In
    a technical setup shared on his X handle, the analyst showed Bitcoin trading within
    an ascending parallel channel, with the short-term target being the all-time high
    daily close above $106,000.“I am liking how these Fibonacci retracement levels
    line up with support, makes me think $BTC has another leg to 106K+ before it corrects.”BTC/USD
    12-hour chart. Source: AlphaBTCMultiple analysts have also projected higher year-end
    targets for Bitcoin, including crypto trader Egrag Crypto, who says BTC price
    could rise to $170,000 if it breaks above the all-time high of $109,000.“​​I’ve
    been targeting the $170K range as the potential cycle top — but here’s the key:
    #BTC must close above $109K. Anything less is just a #BullTrap and a retracement,
    nothing more.”Meanwhile, Binance founder Changpeng Zhao expects Bitcoin to reach
    between $500,000 and $1 million this bull cycle, driven by institutional adoption,
    growing government accumulation, and a pro-crypto US administration under President
    Donald Trump.BTC price bull flag targets $180,000 From a technical perspective,
    the Bitcoin price action has led to the formation of a bull flag pattern on the
    weekly timeframe, a bullish setup that forms after the price consolidates inside
    a down-sloping range.BTC/USD weekly chart. Source: Cointelegraph/TradingViewThe
    bull flag breakout occurred when the price jumped above the upper trendline at
    $88,000 on April 22. Bitcoin could now rise by as much as the previous uptrend’s
    height, or $182,200, a 75% gain from the current price.This article does not contain
    investment advice or recommendations. Every investment and trading move involves
    risk, and readers should conduct their own research when making a decision.\n\n
    \           "

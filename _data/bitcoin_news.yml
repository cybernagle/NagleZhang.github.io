    level to watch out for because a break above it will complete a double-bottom
    pattern. The pair could then climb toward the pattern target of $0.26.Cardano
    price analysisBuyers are struggling to push Cardano (ADA) above the 20-day EMA
    ($0.65), indicating that demand dries up at higher levels.ADA/USDT daily chart.
    Source: Cointelegraph/TradingViewIf the price turns down from the 20-day EMA,
    the next support on the downside is $0.58 and then $0.50. Buyers are expected
    to fiercely defend the $0.50 level because a break below it could sink the ADA/USDT

- title: " Bitcoin’s role as an inflation hedge depends on where one lives — Analyst "
  url: https://cointelegraph.com/news/bitcoin-s-role-as-inflation-hedge-depends-on-where-one-lives-analyst?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTZmOTQtYTVlNC03NzMwLWI4MDktYTgzYTI2MTVjNGEy.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTZmOTQtYTVlNC03NzMwLWI4MDktYTgzYTI2MTVjNGEy.jpg\"
    alt=\"Bitcoin’s role as an inflation hedge depends on where one lives — Analyst\"></p><p>For
    years, inflation was primarily a concern for emerging markets, where volatile
    currencies and economic instability made rising prices a persistent challenge.
    However, in the wake of the COVID-19 pandemic, inflation became a global issue.
    Once-stable economies with historically low inflation were suddenly grappling
    with soaring costs, prompting investors to rethink how to preserve their wealth.<p>While
    gold and real estate have long been hailed as safe-haven assets, Bitcoin&rsquo;s
    supporters argue that its fixed supply and decentralized nature make it the ultimate
    shield against inflation. But does the <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/learn/articles/bitcoin-and-inflation-everything-you-need-to-know\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">theory</a> hold up?</p><p>The
    answer may depend largely on where one lives.</p><p>Bitcoin advocates emphasize
    its strict supply limit of <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/explained/can-bitcoins-hard-cap-of-21-million-be-changed\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">21 million coins</a>
    as a key advantage in combating inflationary monetary policies. Unlike fiat currencies,
    which central banks can print in unlimited quantities, Bitcoin&rsquo;s supply
    is predetermined by an algorithm, preventing any form of artificial expansion.
    This scarcity, they argue, makes Bitcoin akin to &ldquo;digital gold&rdquo; and
    a more reliable store of value than traditional government-issued money.</p><p>Several
    companies and even sovereign nations have embraced the idea, <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/nayib-bukele-sticks-to-bitcoin-piggy-bank-strategy-but-is-it-working\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">adding Bitcoin to their
    treasuries to hedge against fiat currency risk and inflation</a>. The most notable
    example is El Salvador, which made global headlines in 2021 by becoming the first
    country to adopt Bitcoin as legal tender. The government has since been steadily
    accumulating Bitcoin, making it a key component of its economic strategy. Companies
    like <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/microstrategy-rebrands-strategy-btc-logo\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Strategy</a> in the
    US and <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/japans-metaplanet-buys-more-bitcoin-considers-us-listing\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Metaplanet in Japan</a>
    have followed suit, and now the United States is in the process of establishing
    its own <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/trump-bitcoin-reserve-global-crypto-adoption-investment\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Strategic Bitcoin Reserve</a>.</p><h2><strong>A
    Bitcoin investment strategy has paid off so far</strong></h2><p>So far, the corporate
    and government Bitcoin investment strategy has paid off as BTC outperformed the
    S&amp;P 500 and gold futures since the early 2020s before inflation surged in
    the United States. </p><p>More recently, however, that strong performance has
    shown signs of moderation. Bitcoin remains a strong performer over the past 12
    months, and while BTC&rsquo;s gains outpace consumer inflation, economists caution
    that past performance is no guarantee of future results. Indeed, some studies
    suggest a correlation between cryptocurrency returns and changes in inflation
    expectations is far from consistent over time.&nbsp;</p><img alt=\"Bitcoin&rsquo;s
    role as an inflation hedge depends on where one lives &mdash; Analyst\" img_link=\"\"
    img_link_new_tab=\"\" img_link_nofollow=\"\" img_link_title=\"\" name=\"\" src=\"data:image/png;base64,\"
    title=\"\"><p><em>                          Returns over the past 12 months. Source:
    Truflation.</em></p><h2><strong>Bitcoin's role as an inflation hedge remains uncertain</strong></h2><p>Unlike
    traditional inflation hedges such as gold, Bitcoin is still a relatively new asset.
    Its role as a hedge remains uncertain, especially considering that widespread
    adoption has only gained traction in recent years.</p><p>Despite high inflation
    in recent years, Bitcoin&rsquo;s price has fluctuated wildly, often correlating
    more with risk assets like tech stocks than with traditional inflation hedges
    like gold. </p><p>A recent <a data-ct-non-breakable=\"null\" href=\"https://www.sciencedirect.com/science/article/abs/pii/S0148619524000602\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">study</a> published
    in the <em>Journal of Economics and Business</em> found that Bitcoin&rsquo;s ability
    to hedge inflation has weakened over time, particularly as institutional adoption
    grew. In 2022, when US inflation hit a 40-year high, Bitcoin lost more than 60%
    of its value, while gold, a traditional inflation hedge, remained relatively stable.</p><p>For
    this reason, some analysts say that Bitcoin&rsquo;s price may be driven more by
    investor sentiment and liquidity conditions than by macroeconomic fundamentals
    like inflation. When the risk appetite is strong, Bitcoin rallies. But when markets
    are fearful, Bitcoin often crashes alongside stocks.</p><p>In a <em>Journal of
    Economics and Business </em>study, authors Harold Rodriguez and Jefferson Colombo
    said,</p><p> </p><blockquote>&ldquo;Based on monthly data between August 2010
    and January 2023, the results indicate that Bitcoin returns increase significantly
    after a positive inflationary shock, corroborating empirical evidence that Bitcoin
    can act as an inflation hedge.&rdquo; </blockquote><p>However, they noted that
    Bitcoin&rsquo;s inflationary hedging property was stronger in the early days when
    institutional adoption of BTC was not as prevalent. Both researchers agreed that
    &ldquo;[&hellip;]Bitcoin&rsquo;s inflation-hedging property is context-specific
    and likely diminishes as it achieves broader adoption and becomes more integrated
    into mainstream financial markets.&rdquo;<br></p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958bff-13c7-726d-8479-146de70c60ff\"
    title=\"\" alt=\"Bitcoin&rsquo;s role as an inflation hedge depends on where one
    lives &mdash; Analyst\"><figcaption style=\"text-align: center;\"><p><em>US inflation
    index since 2020.</em><strong> </strong><em>Source. Truflation</em></p></figcaption></figure><p>&ldquo;So
    far, it has acted as an inflation hedge&mdash;but it&rsquo;s not a black-and-white
    case. It&rsquo;s more of a cyclical (phenomenon),&rdquo; Robert Walden, head of
    trading at Abra, told Cointelegraph. </p><p>Walden said, </p><blockquote>&ldquo;For
    Bitcoin to be a true inflation hedge, it would need to consistently outpace inflation
    year after year with its returns. However, due to its parabolic nature, its performance
    tends to be highly asymmetric over time.&rdquo;</blockquote><p>Bitcoin&rsquo;s
    movement right now, Walden said, is more about market positioning than inflation
    hedging&mdash;it&rsquo;s about capital flows and interest rates.\"</p><h2><strong>Argentina
    and Turkey seek financial refuge in crypto</strong></h2><p>In economies suffering
    from runaway inflation and strict capital controls, Bitcoin has proven to be a
    valuable tool for preserving wealth. Argentina and Turkey, two countries with
    persistent inflation throughout recent decades, illustrate this dynamic well.</p><p>Argentina
    has long grappled with recurring financial crises and soaring inflation. While
    inflation has shown signs of improvement very recently, locals have historically
    turned to cryptocurrency as a way to bypass financial restrictions and protect
    their wealth from currency depreciation.</p><p>A recent Coinbase <a data-ct-non-breakable=\"null\"
    href=\"https://www.coinbase.com/blog/Coinbase-gains-approval-to-launch-in-Argentina\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">survey</a> found that
    87% of Argentinians believe crypto and blockchain technology can enhance their
    financial independence, while nearly three in four respondents see crypto as a
    solution to challenges like inflation and high transaction costs.</p><p><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/argentina-leads-latin-america-crypto-inflows\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Related:
    Argentina overtakes Brazil in crypto inflows &mdash; Chainalysis</strong></em></a></p><p>With
    a population of 45 million, Argentina has become a hotbed for crypto adoption,
    with Coinbase reporting that as many as five million Argentinians use digital
    assets daily.</p><p>&ldquo;Economic freedom is a cornerstone of prosperity, and
    we are proud to bring secure, transparent, and reliable crypto services to Argentina,&rdquo;
    said Fabio Plein, Director for the Americas at Coinbase. </p><blockquote>&ldquo;For
    many Argentinians, crypto isn&rsquo;t just an investment, it&rsquo;s a necessity
    for regaining control over their financial futures.&rdquo;</blockquote><p>&ldquo;People
    in Argentina don&rsquo;t trust the peso. They are always looking for ways to store
    value outside of the local currency,&rdquo; Juli&aacute;n Colombo, a senior director
    at Bitso, a major Latin American cryptocurrency exchange, told Cointelegraph.
    </p><p>&ldquo;Bitcoin and stablecoins allow them to bypass capital controls and
    protect their savings from devaluation.&rdquo;</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/01958bff-177b-71ab-b749-91b09c286f58\"
    title=\"\" alt=\"Bitcoin&rsquo;s role as an inflation hedge depends on where one
    lives &mdash; Analyst\"><figcaption style=\"text-align: center;\"><p><em>Argentina
    inflation index. Source. Truflation.</em></p></figcaption></figure><p>Beyond individual
    investors, businesses in Argentina are also using Bitcoin and stablecoins to protect
    revenue and conduct international transactions. Some workers even opt to receive
    part of their salaries in cryptocurrency to safeguard their earnings from inflation.</p><p>According
    to economist and crypto analyst Natalia Motyl, </p><blockquote>&ldquo;Currency
    restrictions and capital controls imposed in recent years have made access to
    US dollars increasingly difficult amid high inflation and a crisis of confidence
    in the Argentine peso. In this environment, cryptocurrencies have emerged as a
    viable alternative for preserving the value of money, allowing individuals and
    businesses to bypass the limitations of the traditional financial system.&rdquo;
    </blockquote><p>While Bitcoin's effectiveness as an inflation hedge is still up
    for debate, stablecoins have become a more practical solution in high-inflation
    economies, particularly those pegged to the US dollar.</p><p>Relative to its economic
    size, Turkey has emerged as a hotspot for stablecoin transactions. In the year
    leading up to March 2024, purchases alone accounted for 4.3% of GDP. This digital
    currency boom, fueled by years of double-digit inflation&mdash;peaking at 85%
    in 2022&mdash;and a more than 80% plunge in the lira against the dollar over the
    past five years, gained momentum during the pandemic.</p><h2>Turkey&rsquo;s Bitcoin
    adoption proves citizens drive adoption, not governments</h2><p>Although Turkey
    allows its citizens to buy, hold, and trade crypto, the use of digital currencies
    for payments <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/law-firm-challenge-turkey-ban-crypto-payments\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">has been banned since
    2021</a> when the Central Bank of the Republic of Turkey prohibited &ldquo;any
    direct or indirect usage of crypto assets in payment services and electronic money
    issuance.&rdquo; Nevertheless, <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/learn/articles/cryptocurrency-laws-and-regulations-in-turkey\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">crypto adoption in Turkey
    is still evident</a>, with an increasing number of <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/turkey-bankpozitif-crypto-development-taurus\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Turkish banks offering
    crypto services</a> and shops and ATMs providing crypto exchange options.</p><p>High
    inflation rates backed the erosion of the Turkish lira&rsquo;s value, which lost
    nearly 60% of its purchasing power as inflation soared to 85.5% between 2021 and
    2023. This led many Turkish citizens to turn to Bitcoin as a store of value and
    a medium of exchange. </p><p>While some argue that Bitcoin&rsquo;s scarcity bodes
    well for long-term appreciation, potentially outpacing consumer inflation, its
    high volatility and recurring correlation with tech-heavy, risk-associated indexes
    like the Nasdaq in recent times suggest that its performance as a pure inflation
    hedge remains mixed. </p><p>However, in inflation-ridden nations like Argentina
    and Turkey, where local currencies have collapsed in value, the &ldquo;digital
    gold&rdquo; has undeniably served as a crucial avenue of escape from local currencies,
    preserving purchasing power in ways traditional fiat cannot.</p><p>Although Bitcoin
    is still a nascent asset, and its effectiveness as a hedge requires further study,
    one thing remains clear&mdash;so far, it has significantly outperformed consumer
    inflation. For Bitcoin enthusiasts, that alone is reason enough to celebrate.</p><p
    class=\"post-content__disclaimer\" type=\"\">This article is for general information
    purposes and is not intended to be and should not be taken as legal or investment
    advice. The views, thoughts, and opinions expressed here are the author&rsquo;s
    alone and do not necessarily reflect or represent the views and opinions of Cointelegraph.</p><template
    data-name=\"subscription_form\" data-type=\"markets_outlook\" label=\"Subscription
    Form: Markets Outlook\"></template><p><br></p></p>\n</p>\n            "
  published: 2025-03-15 16:00:00 UTC
- title: " Bitcoin poised to reclaim $90,000, according to derivatives metrics "
  url: https://cointelegraph.com/news/bitcoin-poised-reclaim-90000-according-derivatives-metrics?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTk3NGUtMWFlZi03Nzg3LWI2OGQtOTBjOTNmMDYwZjcx.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTk3NGUtMWFlZi03Nzg3LWI2OGQtOTBjOTNmMDYwZjcx.jpg\"
    alt=\"Bitcoin poised to reclaim $90,000, according to derivatives metrics\"></p><p>Bitcoin
    (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>) failed to sustain
    levels above $85,000 on March 14, despite a 1.9% gain in the S&amp;P 500 index.
    More importantly, it has been over a week since Bitcoin last traded at $90,000,
    prompting traders to question whether the bull market is truly over and how long
    selling pressure will persist. <h2>Bitcoin basis rate rebounds from bearish levels</h2><p>From
    a derivatives perspective, Bitcoin metrics have shown resilience despite a 30%
    drop from its all-time high of $109,354 on Jan. 20. The Bitcoin basis rate, which
    measures the premium of monthly contracts over spot markets, has recovered to
    healthy levels after briefly signaling bearish sentiment on March 13.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/0195973f-03ef-7caa-a3c5-a4f09c619058\"
    title=\"\" alt=\"Bitcoin poised to reclaim $90,000, according to derivatives metrics\"><figcaption
    style=\"text-align: center;\"><p><em>Bitcoin 2-month futures contracts annualized
    premium. Source: </em><a data-ct-non-breakable=\"null\" href=\"https://app.laevitas.ch/assets/overview/BTC\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://app.laevitas.ch/assets/overview/BTC\"><em>Laevitas.ch</em></a></p></figcaption></figure><p>Traders
    typically demand a 5% to 10% annualized premium to compensate for longer settlement
    periods. A basis rate below this threshold signals weak demand from leveraged
    buyers. While the current 5% rate is lower than the 8% recorded two weeks ago,
    it remains within neutral territory.</p><h2><strong>Central banks will eventually
    boost BTC price</strong></h2><p>Bitcoin price action has closely tracked the S&amp;P
    500, suggesting that factors driving investor risk aversion may not be directly
    tied to the top cryptocurrency. </p><p>However, this also challenges the idea
    of Bitcoin as a non-correlated asset, as its price behavior has aligned more closely
    with traditional markets, at least in the short term.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195973f-09b0-78fa-ad8e-76bb6ddf3322\"
    title=\"\" alt=\"Bitcoin poised to reclaim $90,000, according to derivatives metrics\"><figcaption
    style=\"text-align: center;\"><p><em>S&amp;P 500 futures (left) vs. Bitcoin/USD.
    Source: TradingView / Cointelegraph</em></p></figcaption></figure><p>If Bitcoin&rsquo;s
    price remains heavily dependent on the stock market, which is under pressure due
    to fears of an <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-bull-market-in-peril-as-us-recession-and-tariff-worries-loom\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">economic recession</a>,
    investors are likely to keep reducing exposure to risk-on assets and shift toward
    short-term bonds for safety. </p><p>However, central banks are expected to implement
    stimulus measures to avoid a recession, and scarce assets like Bitcoin are likely
    to outperform as a result. </p><p>According to the CME <a data-ct-non-breakable=\"null\"
    href=\"https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html\">FedWatch</a>
    tool, the markets are pricing less than 40% odds for interest rates in the US
    below 3.75% from the current 4.25% baseline ahead of the July 30 FOMC meeting.</p><p>Nevertheless,
    Bitcoin should reclaim the $90,000 level as soon as the S&amp;P 500 pares some
    of its recent 10% losses. But in a worst-case scenario, panic selling of risk-on
    assets could continue.</p><p>Under such conditions, BTC would likely keep underperforming
    over the next few months, especially if spot Bitcoin exchange-traded funds (ETFs)
    continue to experience significant and <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-etfs-break-outflow-streak-13m-inflow\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">sustained net outflows</a>.</p><h2><strong>Bitcoin
    derivatives show no signs of stress</strong></h2><p>Professional traders are not
    actively using Bitcoin options for hedging presently, as shown by the 25% delta
    skew metric. This implies that few market participants expect the BTC price to
    retest the $76,900 level anytime soon.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195973f-0f64-76a2-89b6-c4adb6cf588c\"
    title=\"\" alt=\"Bitcoin poised to reclaim $90,000, according to derivatives metrics\"><figcaption
    style=\"text-align: center;\"><p><em>Bitcoin 1-month options 25% delta skew (put-call).
    Source: Laevitas.ch</em></p></figcaption></figure><p>Bullish sentiment typically
    leads to put (sell) options trading at a 6% or higher discount. In contrast, bearish
    periods cause the indicator to rise to a 6% premium, as seen briefly on March
    10 and March 12. However, the 25% delta skew has recently stayed within the neutral
    range, reflecting a healthy <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/learn/articles/bitcoin-spot-vs-derivatives-trading\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">derivatives market</a>.</p><p>To
    better gauge trader sentiment, examining BTC&nbsp;<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/how-to-long-and-short-with-margin-trading\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">margin markets is important</a>.
    Unlike derivatives contracts, which are always balanced between longs (buyers)
    and shorts (sellers), margin markets let traders borrow stablecoins to buy spot
    Bitcoin. Similarly, bearish traders can borrow BTC to open short positions, betting
    on a price drop.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195973f-1423-73b3-99a6-ed98d1372f08\"
    title=\"\" alt=\"Bitcoin poised to reclaim $90,000, according to derivatives metrics\"><figcaption
    style=\"text-align: center;\"><p><em>Bitcoin margin long-to-short ratio at OKX.
    Source: </em><a data-ct-non-breakable=\"null\" href=\"https://www.okx.com/markets/data/all\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://www.okx.com/markets/data/all\"><em>OKX</em></a></p></figcaption></figure><p>The
    Bitcoin long-to-short margin ratio at OKX shows longs outweighing shorts by 18
    times. Historically, excessive confidence has pushed this ratio above 40 times,
    while levels below five times favoring longs are seen as bearish. The current
    ratio mirrors sentiment on Jan. 30, when Bitcoin traded above $100,000.</p><p>There
    are no signs of stress or bearishness in Bitcoin derivatives and margin markets,
    which is reassuring, especially after over $920 million in leveraged long futures
    contracts were liquidated in the seven days ending March 13. </p><p>Therefore,
    as recession risks ease, Bitcoin price is likely to reclaim the $90,000 level
    in the coming weeks, given the resilience in investor sentiment.</p><p class=\"post-content__disclaimer\"
    type=\"\">This article is for general information purposes and is not intended
    to be and should not be taken as legal or investment advice. The views, thoughts,
    and opinions expressed here are the author&rsquo;s alone and do not necessarily
    reflect or represent the views and opinions of Cointelegraph.</p><template data-name=\"subscription_form\"
    data-type=\"markets_outlook\" label=\"Subscription Form: Markets Outlook\"></template></p>\n</p>\n

- title: " Bitcoin tipped for 2023-style rebound as Goldman says dollar &#039;overvalued&#039; "
  url: https://cointelegraph.com/news/bitcoin-tipped-2023-style-rebound-goldman-says-dollar-overvalued?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin (BTC) centered on $84,000 at the April 16 Wall Street open amid
    hopes that a weak US dollar would fuel a bull market comeback.BTC/USD 1-hour chart.
    Source: Cointelegraph/TradingViewBitcoin analysis calls for 2023 rally repeatData
    from Cointelegraph Markets Pro and TradingView showed BTC/USD consolidating after
    a swift comedown from local highs the day prior.That volatility had accompanied
    ongoing developments in the US-China trade war, with crypto and risk assets staying
    sensitive to headlines and statements from parties such as US President Donald
    Trump.The S&P 500 and Nasdaq Composite Index traded down 1.4% and 2.2%, respectively,
    at the time of writing.Gold remained the standout winner, having set new all-time
    highs above $3,300 per ounce on the day.“Unlike gold, BTC has not caught a safe-haven
    bid,” trading firm QCP Capital summarized in its latest bulletin to Telegram channel
    subscribers. “The ‘alternative store of value’ narrative isn't gaining traction
    in the current macro regime. Positioning remains defensive. Participants are still
    focused on hedging their downside until greater clarity emerges.”Gold/USD price
    1-hr candle chart. Source: Cointelegraph/TradingViewLooking for potential tailwinds,
    market participants focused on the US dollar’s inability to reclaim prior support
    after sliding precipitously as the trade war took hold.The US dollar index (DXY)
    hovered near multiyear lows after rejecting at the psychologically significant
    100 mark.US Dollar Index price 1-hr candle chart. Source: Cointelegraph/TradingView“DXY
    is dropping at its fastest pace since 2023,” popular trader BitBull told followers
    in a post on X.BitBull drew comparisons to BTC price performance from the time,
    with early 2023 seeing Bitcoin and altcoins emerge from the pit of the 2022 bear
    market.“Back then, $BTC had already bottomed (Q4 2022) and went on to rally 200%+
    within a year,” he continued.“I guess it’s time for btc to repeat the 2023-24
    rally.”Source: X/@AkaBull_Andre Dragosch, European head of research at asset management
    firm Bitwise, meanwhile flagged Goldman Sachs research seeing further DXY downside
    to come.“NOTE: US Dollar is still significantly overvalued according to GS,” he
    commented alongside a Goldman chart of dollar strength versus US growth performance. “Lots
    of room for USD depreciation = upside potential for BTC to re-rate.”Source: X/@Andre_DragoschBTC
    price gives cautious bullish hintsBitcoin traders eyed various positive chart
    signals on the day, with these including a potential bottom formation on the 4-hour
    chart.Related: Can 3-month Bitcoin RSI highs counter bearish BTC price 'seasonality?'“Forming
    an Inverse Head & Shoulders Pattern on the 4H timeframe, if we manage to hold
    a Higher Low in the coming days,” popular trader Luca suggested.Source: X/@MirageMogulCrypto
    trader, analyst and entrepreneur Michaël van de Poppe hoped for a fresh retest
    of resistance, for him one of two key areas of interest.“Bitcoin is still nicely
    consolidating between the two levels,” he concluded. “The test at $87K did happen,
    and I think that we'll see a big breakout once we'll retest it again. What's next?
    Likely a run to ATH at the end of this quarter.”Source: X/@CryptoMichNLThis article
    does not contain investment advice or recommendations. Every investment and trading
    move involves risk, and readers should conduct their own research when making
    a decision.\n\n            "

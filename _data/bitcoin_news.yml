- title: " Sacks’ VC firm sold $200M+ in crypto, stocks before White House role "
  url: https://cointelegraph.com/news/david-sacks-sold-off-crypto-related-assets-prior-crypto-czar-white-house?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTYxZWYtMDc4NS03NjY0LThmNDQtMWUyMjU0YmUxNGRi.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTYxZWYtMDc4NS03NjY0LThmNDQtMWUyMjU0YmUxNGRi.jpg\"
    alt=\"Sacks’ VC firm sold $200M+ in crypto, stocks before White House role\"></p><p>A
    White House memorandum revealed that David Sacks and his venture capital firm
    sold more than $200 million in cryptocurrency and crypto-related stocks before
    he assumed his role as the White House AI and crypto czar.<p>&ldquo;You and Craft
    Ventures have divested over $200 million of positions related to the digital asset
    industry, of which $85 million is directly attributable to you,&rdquo; <a data-ct-non-breakable=\"null\"
    href=\"https://www.whitehouse.gov/wp-content/uploads/2025/03/Memo-David-Sacks-3.5.2025-1.pdf\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://www.whitehouse.gov/wp-content/uploads/2025/03/Memo-David-Sacks-3.5.2025-1.pdf\">said</a>
    the memorandum dated March 5.</p><h2>Crypto sell-off an effort to prevent conflict
    of interest</h2><p>The memorandum said &ldquo;significant steps&rdquo; were taken
    to reduce potential conflicts of interest before Sacks began his tenure as the
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/trump-names-david-sacks-ai-crypto-czar\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/trump-names-david-sacks-ai-crypto-czar\">White
    House AI and crypto czar</a> &mdash; in which a major part of his role is to help
    create a legal framework for the crypto industry.</p><p>Sacks offloaded all the
    &ldquo;liquid cryptocurrency&rdquo; in his portfolio, as well as Craft Ventures'
    portfolio &mdash; the investment firm he co-founded in 2017 &mdash; including
    holdings in Bitcoin (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/bitcoin-price\">BTC</a>),
    Ether (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/ethereum-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/ethereum-price\">ETH</a>),
    and Solana (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/solana-price-index\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"https://cointelegraph.com/solana-price-index\">SOL</a>)
    before US President Donald <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/trump-inauguration-2025-crypto-live\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/trump-inauguration-2025-crypto-live\">Trump&rsquo;s
    inauguration on Jan. 20.</a></p><figure><img alt=\"United States, Donald Trump\"
    src=\"https://s3.cointelegraph.com/uploads/2025-03/0195973e-1899-7e4f-ac93-327dcc534dbe\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>The memorandum outlined
    which cryptocurrencies and crypto-related stocks David Sacks sold before Trump&rsquo;s
    inauguration. Source: </em><a data-ct-non-breakable=\"null\" href=\"https://www.whitehouse.gov/wp-content/uploads/2025/03/Memo-David-Sacks-3.5.2025-1.pdf\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://www.whitehouse.gov/wp-content/uploads/2025/03/Memo-David-Sacks-3.5.2025-1.pdf\"><em>The
    White House</em></a></p></figcaption></figure><p>Since Trump&rsquo;s inauguration,
    the crypto market has seen a major decline amid a broader market downturn, with
    many blaming Trump&rsquo;s proposed tariffs and uncertainty over US interest rates.</p><p>While
    Bitcoin tapped a new all-time high of $109,000 just hours before Trump was sworn
    in as the 47th US president, it recently dipped <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-price-below-80k-macroeconomic-uncertainty\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-price-below-80k-macroeconomic-uncertainty\">below
    $80,000 on Feb. 27</a>, erasing all post-election gains. At the time of publication,
    Bitcoin is trading at $84,155, as <a data-ct-non-breakable=\"null\" href=\"https://coinmarketcap.com/currencies/bitcoin/\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://coinmarketcap.com/currencies/bitcoin/\">per</a>
    CoinMarketCap data.</p><p>Sacks also divested from publicly traded crypto-related
    firms, including Coinbase (COIN), Robinhood (HOOD), and stakes in private digital
    asset companies.</p><p>Additionally, he sold his limited partner interest in Solana-focused
    Multichain Capital and crypto-focused venture capital firm Blockchain Capital.
    At the same time, Craft Ventures offloaded its holdings in Multichain Capital
    and Bitwise Asset Management.</p><h2>Sen. Warren urged Sacks to prove he no longer
    holds crypto</h2><p>The memorandum is dated one day before <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/senator-elizabeth-warren-financial-disclosures-david-sacks\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Massachusetts Senator
    Elizabeth Warren</a> urged Sacks in a March 6 letter to prove he no longer holds
    any digital assets, following Sacks&rsquo; claim in an X post that he sold off
    all his crypto.</p><p>&ldquo;Despite your public statements via X, it remains
    unclear exactly when you personally divested from BTC, ETH, and SOL, when Craft
    Ventures divested from Bitwise, and whether people close to you &lsquo;may have
    held positions and sold into the recent price surge,&rdquo; Warren said.</p><template
    data-ct-widget=\"buzzsprout\" data-buzzsprout-podcast-id=\"2040516\" data-buzzsprout-episode-id=\"16791823\"></template><p>Since
    Sacks started the White House crypto role, he has been a vocal advocate on various
    issues in the crypto industry, from the importance <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/explained/trumps-strategic-bitcoin-reserve-and-digital-asset-stockpile-explained\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/explained/trumps-strategic-bitcoin-reserve-and-digital-asset-stockpile-explained\">of
    a Strategic Bitcoin Reserve</a> to not over-taxing the crypto industry.</p><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/bitcoin-panic-selling-speculators-100-m-6-weeks-research\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/bitcoin-panic-selling-speculators-100-m-6-weeks-research\"><em><strong>Bitcoin
    panic selling costs new investors $100M in 6 weeks &mdash; Research</strong></em></a></p><p>Sacks
    recently shut down the <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/david-sacks-pushes-back-crypto-transactional-tax\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/david-sacks-pushes-back-crypto-transactional-tax\">idea
    of crypto transaction taxes</a> on an episode of the All In Podcast after host
    Jason Calacanis proposed charging a 0.01% tax on every cryptocurrency transaction.</p><p>&ldquo;That&rsquo;s
    always how taxes start. They are described as being very modest,&rdquo; Sacks
    said.</p><p>&ldquo;You know, when the income tax started, it only applied to like
    a thousand Americans, and the legislators swore up and down that it would never
    be applied to middle-class people,&rdquo; Sacks added.</p><p><em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/crypto-fans-obsessed-longevity-biohacking-why/\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/magazine/crypto-fans-obsessed-longevity-biohacking-why/\"><em><strong>Crypto
    fans are obsessed with longevity and biohacking: Here&rsquo;s why</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"crypto_biz\" label=\"Subscription
    Form: Crypto Biz Newsletter\"></template></p>\n</p>\n            "

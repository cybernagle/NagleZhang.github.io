- title: " Crypto funds see $226M of inflows, but asset values slump — CoinShares "
  url: https://cointelegraph.com/news/crypto-etp-aum-falling-despite-226-million-inflows-coinshares?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Cryptocurrency exchange-traded products (ETPs) continued to see modest
    inflows last week, extending a reversal from a record-breaking streak of outflows.Global
    crypto ETPs posted $226 million in inflows in the last trading week, adding to
    the prior week’s $644 million inflows, CoinShares reported on March 31.Despite
    the two-week positive trend after a five-week outflow streak, total assets under
    management (AUM) continued to decline, dropping below $134 million by March 28.Weekly
    crypto ETP flows since late 2024. Source: CoinSharesLast week’s inflows suggest
    positive but cautious investor behavior amid core Personal Consumption Expenditures
    in the US coming in above expectations, CoinShares’ head of research James Butterfill
    said.Bitcoin leads weekly inflowsBitcoin (BTC) investment products attracted the
    majority of inflows, totaling $195 million for the week, while short-BTC investment
    products saw outflows for the fourth consecutive week, totaling $2.5 million.Altcoins,
    in aggregate, saw a first week of inflows totaling $33 million, following four
    consecutive weeks of outflows totaling $1.7 billion.Flows by asset (in millions
    of US dollars). Source: CoinSharesAmong individual altcoins, Ether (ETH) saw $14.5
    million in inflows. Solana (SOL), XRP (XRP) and Sui (SUI) followed with $7.8 million,
    $4.8 million and $4 million, respectively.AUM drops to lowest level in 2025 amid
    price slumpDespite recent inflows, crypto ETPs have failed to trigger a reversal
    in terms of total AUM.Since March 10, the total crypto ETP AUM dropped 5.7% from
    142 billion, amounting to 133.9 billion as of March 28, the lowest level in 2025.Related:
    BlackRock to launch Bitcoin ETP in Europe — ReportAccording to CoinShares’ Butterfill,
    the AUM decline could be attributed to a slump in cryptocurrency prices.“Recent
    price falls have pushed Bitcoin global ETPs’ total assets under management to
    their lowest level since just after the US election at $114 billion,” Butterfill
    wrote.Bitcoin price chart since Jan. 1, 2025. Source: CoinGeckoSince Jan. 1, 2025,
    the BTC price has dropped 13.6%, while the total market capitalization has tumbled
    nearly 20%, according to data from CoinGecko. Magazine: Bitcoin ATH sooner than
    expected? XRP may drop 40%, and more: Hodler’s Digest, March 23 – 29\n\n            "

- title: " BlackRock flags quantum computing as risk for Bitcoin ETFs "
  url: https://cointelegraph.com/news/blackrock-flags-quantum-computing-as-risk-for-bitcoin-etfs?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Emerging technologies, including quantum computing, could potentially
    render the cryptography securing Bitcoin and other blockchain networks ineffective,
    asset manager BlackRock said in a regulatory filing. On May 9, BlackRock updated
    the registration statement for its iShares Bitcoin ETF (IBIT). The revised version
    addressed potential risks to the integrity of the Bitcoin network posed by quantum
    computing, the filing shows.“[I]f quantum computing technology is able to advance
    […] it could potentially undermine the viability of many of the cryptographic
    algorithms used across the world’s information technology infrastructure, including
    the cryptographic algorithms used for digital assets like bitcoin,” BlackRock
    said. It is the first time the asset manager has explicitly flagged this risk
    in its IBIT disclosures. The IBIT ETF is the largest spot Bitcoin (BTC) ETF, with
    approximately $64 billion in net assets, according to its website. Quantum computing
    is an emergent field that seeks to use the principles of quantum mechanics to
    greatly enhance computers’ processing capabilities. Source: James Seyffart/Bloomberg
    Intelligence Related: Quantum computing will bring lost Bitcoin 'back in circulation’
    — Tether CEORecord-breaking inflowsJames Seyffart, an analyst for Bloomberg Intelligence,
    cautioned that risk disclosures such as IBIT’s are required to highlight every
    possible risk to an asset, even those that are extremely unlikely. “They are going
    to highlight any potential thing that can go wrong with any product they list
    or underlying asset that’s being invested in,” Seyffart said in a May 9 X post.
    “It's completely standard. And honestly [it] makes complete sense.”Since launching
    in January, Bitcoin ETFs have collectively attracted more than $41 billion in
    net inflows, according to data from Farside Investors. Bitcoin ETF inflows reached
    all-time highs on May 8. Source: Eric Balchunas/Bloomberg IntelligenceOn May 8,
    Bitcoin ETF net inflows surpassed all-time highs of around $40 billion, according
    to Bloomberg Intelligence. “Lifetime net flows is #1 most imp metric to watch
    IMO, very hard to grow, pure truth, no bs,” Bloomberg Intelligence analyst Eric
    Balchunas said in a May 9 X post. “Impressive, they were able to make it to a
    new high water mark so soon after the world was supposed to end.”In February,
    Tether CEO Paolo Ardoino predicted that quantum computing would eventually enable
    hackers to break into inactive Bitcoin wallets and recover the dormant coins. “Any
    Bitcoin in lost wallets, including Satoshi (if not alive), will be hacked and
    put back in circulation,” Ardoino said in a Feb. 8 X post.Magazine: Adam Back
    says Bitcoin price cycle ’10x bigger’ but will still decisively break above $100K\n\n
    \           "

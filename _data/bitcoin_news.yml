- title: " Saylor signals impending Bitcoin purchase following Q1 earnings call "
  url: https://cointelegraph.com/news/michael-saylor-signals-bitcoin-purchase-following-earnings-call?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Strategy co-founder Michael Saylor hinted at an impending Bitcoin (BTC)
    purchase, marking the fourth consecutive week of purchases by the BTC treasury
    company.The company's most recent acquisition occurred on April 28 when Strategy
    purchased 15,355 BTC, valued at over $1.4 billion at the time, bringing the company's
    total holdings to 553,555 BTC.According to data from SaylorTracker, Strategy is
    up approximately 39% on its investment, representing over $15 billion in unrealized
    gains.Strategy’s history of Bitcoin acquisition. Source: SaylorTrackerBitcoin
    investors continue closely monitoring the company, which has been a major driver
    of direct institutional exposure to BTC by popularizing the Bitcoin corporate
    treasury concept and indirectly through institutions holding Strategy's stock
    in their investment portfolios.Related: Strategy ends April up 32% in best month
    since November as Q1 earnings loomStrategy misses Q1 analyst estimates but continues
    stacking BitcoinStrategy fell short of analyst estimates for Q1 2025, reporting
    approximately $111 million in revenue, down by 3.6% from Q1 2024 and missing analyst
    expectations by 5%.However, the company also reported that it acquired 61,497
    BTC so far in 2025 and also revealed plans to raise $21 billion through an equity
    offering to finance the purchase of more BTC.The quarter-by-quarter growth of
    Strategy’s Bitcoin treasury. Source: StrategyAsset manager Richard Byworth recently
    suggested that Strategy should acquire companies with ample cash reserves and
    convert those fiat cash reserves to Bitcoin for its treasury.Byworth added that
    Strategy could also purchase Bitcoin on the open market as exchange balances dwindle,
    rather than the over-the-counter (OTC) transactions between private parties that
    do not affect the market exchange price.Doing so would push prices higher, driving
    up the value of Strategy's Bitcoin reserves and acting as a catalyst attracting
    even more investors to BTC, the asset manager said.Strategy's effect on Bitcoin's
    price and Bitcoin adoption continues to draw intense discussion over the role
    of the company as it relates to market dynamics.Adam Livingston, a BTC analyst
    and author of \"The Bitcoin Age and The Great Harvest,\" recently argued that
    Strategy's demand for BTC is synthetically halving Bitcoin by outpacing the daily
    miner output.Livingston pointed out that Strategy's average daily rate of Bitcoin
    accumulation of roughly 2,087 BTC far outstrips the collective daily mined supply
    of around 450 BTC.Magazine: ZK-proofs are bringing smart contracts to Bitcoin
    — BitcoinOS and Starknet\n\n            "

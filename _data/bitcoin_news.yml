  summary: "Bitcoin (BTC) has a new gold-inspired $155,000 target, as analysis describes
    both assets as “remarkably impressive.”In a post on X on April 16, trading and
    analytics account Cryptollica predicted BTC/USD would copy gold to hit new all-time
    highs.Analysis sees key BTC price similarities to goldBitcoin has made headlines
    for its inability to follow in gold’s record-breaking footsteps in 2025.While
    XAU/USD continues to see repeated record highs, BTC/USD is down 9.3% year-to-date,
    data from Cointelegraph Markets Pro and TradingView shows.BTC/USD 1-day chart.
    Source: Cointelegraph/TradingViewDespite calls for an imminent “blow-off top”
    for gold, Bitcoin bulls hope that after a delay of several months, its “digital”
    equivalent will follow suit.For Cryptollica, this means BTC/USD breaking out of
    a consolidatory wedge structure to swiftly reclaim six figures and more.“Bitcoin
    midterm target: 155K $,” it told X followers.XAU/USD vs. BTC/USD. Source: Cryptollica/XBTC
    price performance already has various potential tailwinds at its disposal, all
    of which have fueled bull runs in the past.As Cointelegraph reported, these include
    a declining US Dollar Index (DXY) and all-time highs in the global M2 money supply.Bitcoin
    “remarkably impressive” during trade warContinuing, onchain analytics firm Glassnode
    argued that despite the price performance disparity, Bitcoin and gold have weathered
    the current macroeconomic storm remarkably well.Related: Can 3-month Bitcoin RSI
    highs counter bearish BTC price ‘seasonality?’“Amid this turmoil, the performance
    of hard assets remains remarkably impressive,” it said in the latest edition of
    its regular newsletter, “The Week Onchain,” published on April 16. “Gold continues
    to surge higher, having reached a new ATH of $3,300, as investors flee to the
    traditional safe haven asset. Bitcoin sold off to $75k initially alongside risk
    assets, but has since recovered the weeks gains, trading back up to $85k, now
    flat since this burst of volatility.”XAU/USD vs. BTC/USD (screenshot). Source:
    GlassnodeGlassnode said that gold and BTC are “increasingly entering the center
    stage as global neutral reserve assets.”In terms of the BTC price drawdown, analysts
    stressed the fact that by historical standards, the dip versus all-time highs
    remains modest at around 30%.“In prior macroeconomic events like last week, Bitcoin
    has typically experienced greater than -50% sell-offs in such events, which highlights
    a degree of robustness of modern investor sentiment toward the asset during unfavorable
    conditions,” it wrote, referring to the ongoing US-China trade war.Bitcoin bull
    market drawdowns (screenshot). Source: GlassnodeThis article does not contain
    investment advice or recommendations. Every investment and trading move involves

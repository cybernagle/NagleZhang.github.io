- title: " Over 13K institutions exposed to Strategy as Saylor hints at BTC buy "
  url: https://cointelegraph.com/news/13-000-institutions-exposure-strategy-saylor-hints-btc-buy?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Strategy co-founder Michael Saylor hinted at an impending Bitcoin (BTC)
    purchase by Strategy and said that more than 13,000 institutions now have direct
    exposure to the company.The company's most recent acquisition of 3,459 BTC, valued
    at over $285 million at the time of purchase, on April 14, brought Strategy's
    total holdings to 531,644 BTC, valued at over $44.9 billion.Saylor followed up
    on the BTC chart, which he typically posts on Sundays to signal an imminent BTC
    acquisition, with a breakdown of investor exposure to the company. The executive
    wrote in an April 20 X post:\"Based on public data as of Q1 2025, over 13,000
    institutions and 814,000 retail accounts hold MSTR directly. An estimated 55 million
    beneficiaries have indirect exposure through ETFs, mutual funds, pensions, and
    insurance portfolios.\"Strategy's growing popularity among retail and institutional
    investors is significant due to the company siphoning capital from traditional
    financial markets and into Bitcoin. Increased capital flows translate into the
    company accumulating and holding more BTC, slowly increasing the price of the
    supply-capped digital asset.Strategy’s chart of Bitcoin acquisitions. Source:
    SaylorTrackerRelated: Has Michael Saylor’s Strategy built a house of cards?Michael
    Saylor's stock market-to-BTC pipelineStrategy issues corporate debt and equity
    to finance its Bitcoin acquisitions, giving holders indirect exposure to BTC and
    feeding capital from traditional financial markets into the Bitcoin market.In
    December 2024, Strategy was added to the Nasdaq 100, a weighted stock market index
    that tracks the 100 largest companies by market capitalization on the Nasdaq exchange.The
    inclusion of Strategy in the Nasdaq 100 will draw in even more capital to BTC
    from passive investors holding the tech-focused index in their portfolios.Strategy’s
    stock is currently trading at around $317. Source: TradingViewIn February 2025,
    Bitcoin analyst Julian Fahrer reported that 12 US states had exposure to Strategy,
    including California, Florida, Wisconsin, North Carolina, Arizona, Colorado, Illinois,
    Louisiana, Maryland, New Jersey, Texas, and Utah.Bloomberg exchange-traded fund
    (ETF) analyst Eric Balchunas recently said that inflows from Bitcoin ETFs and
    institutional inflows from companies like Strategy have shored up the Bitcoin
    market against dumping by short-term speculators.The analyst added that Bitcoin
    ETFs recorded approximately $2.4 billion in capital flows year-to-date, helping
    to cushion the price of the digital asset.This article does not contain investment
    advice or recommendations. Every investment and trading move involves risk, and
    readers should conduct their own research when making a decision.Magazine: ‘Bitcoin
    layer 2s’ aren’t really L2s at all: Here’s why that matters\n\n            "

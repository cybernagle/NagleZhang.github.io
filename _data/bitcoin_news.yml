- title: " Arizona crypto reserve bill passes House committee, heads to third reading "
  url: https://cointelegraph.com/news/arizona-bitcoin-reserve-bill-passed-by-house-and-heads-to-third-reading?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Update (April 18 at 3:28 am UTC): This article has been updated to include
    a comment from Bitcoin Laws founder Julian Fahrer. One of Arizona’s crypto reserve
    bills has been passed by the House and is now one successful vote away from heading
    to the governor’s desk for official approval.Arizona's Strategic Digital Assets
    Reserve Bill (SB 1373) was approved on April 17 by the House Committee of the
    Whole, which involves 60 House members weighing in on the bill before a third
    and final reading and a full floor vote.Source: Bitcoin LawsSB 1373 seeks to establish
    a Digital Assets Strategic Reserve Fund made up of digital assets seized through
    criminal proceedings to be managed by the state’s treasurer. Arizona’s treasurer
    would be permitted to invest up to 10% of the fund’s total monies in any fiscal
    year in digital assets. The treasurer would also be able to loan the fund’s assets
    in order to increase returns, provided it doesn’t increase financial risks.However,
    a Senate-approved SB 1373 may be set back by Arizona Governor Katie Hobbs, who
    recently pledged to veto all bills until the legislature passes a bill for disability
    funding.Hobbs also has a history of vetoing bills before the House and has vetoed
    15 bills sent to her desk this week alone.Bitcoin Laws founder and Apollo CEO
    Julian Fahrer told Cointelegraph that he expects SB 1373 will pass the House,
    though it may merge with another crypto-related bill, such as SB 1062, which aims
    to expand the definition of legal tender to include crypto.Arizona is the new
    leader in the state Bitcoin reserve raceSB 1373 has been passing through Arizona’s
    legislature alongside the Arizona Strategic Bitcoin Reserve Act (SB 1025), which
    only includes Bitcoin (BTC).The bill proposes allowing Arizona’s treasury and
    state retirement system to invest up to 10% of the available funds into Bitcoin.SB
    1025 also passed Arizona’s House Committee of the Whole on April 1 and is awaiting
    a full floor vote.Related: Binance helps countries with Bitcoin reserves, crypto
    policies, says CEORace to establish a Bitcoin reserve at the state level. Source:
    Bitcoin LawsUtah passed Bitcoin legislation on March 7 but scrapped the cornerstone
    provision establishing the Bitcoin reserve in the final reading.The Texas Senate
    passed a Bitcoin reserve bill on March 6, while a similar bill recently passed
    through New Hampshire’s House.While Arizona has seen the most progress, Fahrer
    believes the Texas bill has the best shot at being signed into law, noting that
    it has seen the “fewest explicit roadblocks” thus far.Magazine: Crypto ‘more taboo
    than OnlyFans,’ says Violetta Zironi, who sold song for 1 BTC\n\n            "

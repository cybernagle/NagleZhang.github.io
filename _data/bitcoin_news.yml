- title: " Trump tariff negotiations are ‘all about’ China deal — Raoul Pal "
  url: https://cointelegraph.com/news/trump-tariff-negotiation-all-about-china-deal-analyst?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Global trade tensions triggered by US President Donald Trump’s sweeping
    tariff measures may come to an end with a potential deal with China as investors
    remain concerned about escalation from both sides.Trump’s April 2 announcement
    of reciprocal import tariffs sent shockwaves through global equity and crypto
    markets. The measures include a 10% baseline tariff on all imported goods, effective
    April 5, with higher levies — such as a 34% tariff on Chinese imports — set to
    begin on April 9.However, the tariff negotiations may only be “posturing” for
    the US to reach an agreement with China, according to Raoul Pal, founder and CEO
    of Global Macro Investor.“In the end, almost all the other tariff negotiations
    and rhetoric are all about getting China to agree a deal,” Pal wrote in an April
    8 X post, adding:“That is the big prize and both China and the US understand it
    and need it. Everything else is negotiation posturing. China needs a weaker $
    and the US needs tariffs.”Source: Raoul Pal“Also, the US is trying to shut down
    China tariff arbitrage using other channels such as Mexico or Vietnam,” Pal said.Related:
    Bitcoin price can hit $250K in 2025 if Fed shifts to QE: Arthur Hayes\\China retaliates
    with new tariffsConsidering China’s latest retaliatory measures, a resolution
    remains unlikely in the short term.In response to US tariffs, China imposed a
    34% tariff on all US imports effective April 10, media outlet Xinhua News reported
    on April 4. China’s foreign ministry also vowed to “fight till the end” against
    Trump’s tariffs, which it called “bullying” by the world’s largest economy.China
    overtakes the US in global trade. Source: EconovisChina overtook the US in 2012
    to become the world’s largest trading nation by the total value of exports and
    imports, surpassing $4 trillion in goods trade that year, according to The Guardian.Crypto
    markets watch trade outcome closelyAs the trade dispute continues to evolve, analysts
    say a potential agreement between the two global superpowers could serve as a
    key catalyst for recovery in digital asset markets.Crypto markets have a 70% chance
    to bottom by June 2025 before recovering, Nansen analysts predicted.Related: Crypto
    market bottom likely by June despite tariff fears: Finance RedefinedInvestor appetite
    for risk assets such as Bitcoin will depend on the global tariff responses from
    other countries, according to Nicolai Sondergaard, a research analyst at Nansen.“We
    have reached somewhat of a local bottom in regard to tariffs and the impact on
    prices,” the analyst said during Cointelegraph’s Chainreaction live show on X,
    adding:“Trump came out guns blazing, and we’ve mostly seen the worst from the
    US side, so we’ll see if other countries are willing to drop some of the tariffs
    because it’s very likely the US will do the same.”Magazine: Bitcoin ATH sooner
    than expected? XRP may drop 40%, and more: Hodler’s Digest, March 23 – 29\n\n
    \           "

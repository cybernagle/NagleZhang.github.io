- title: " Altseason is coming, 40% daily gains to become ‘new normal’ — Analyst "
  url: https://cointelegraph.com/news/altseason-2025-analysts-split-on-40-percent-daily-gains?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Altcoin markets are flashing early signs of a breakout, with several analysts
    calling for a potential surge over the next few months.Crypto commentator Mister
    Crypto predicts the next 3 to 6 months could be “life-changing,” suggesting daily
    gains of up to 40% may soon become the norm.In a May 11 post on X, he pointed
    to a chart from BlockchainCenter.net that shows whether the crypto market favors
    Bitcoin (BTC) or altcoins.When the index is below 25, it’s considered “Bitcoin
    Season,” meaning Bitcoin is outperforming most altcoins. When it’s above 75, it’s
    “Altcoin Season,” meaning altcoins are doing better than Bitcoin.Currently, the
    chart shows a breakout from a downward trend just below the 29 mark, suggesting
    a possible shift away from Bitcoin dominance. This breakout hints that altcoins
    may start gaining momentum, potentially entering a period where they outperform
    Bitcoin.Source: Mister CryptoRelated: Chance of Bitcoin price highs above $110K
    in May increasing — Here’s whyThis Altseason may be differentOthers see the rally
    but warn it’s not the same as previous cycles. Analyst 2Lambroz agrees that the
    altseason may have arrived, but says the dynamics have changed.“People want to
    bid but lack belief in any strong narrative,” he wrote on X. He noted that, unlike
    2021, there’s no sign of retail investors entering the market. Traders are rotating
    capital faster, with little incentive to hold long-term positions.Technical trader
    Moustache offered a more optimistic view. He shared a chart showing repeating
    altcoin accumulation phases followed by explosive growth. According to him, the
    current structure mirrors those of 2016 and 2020. “Altseason 2025 has officially
    begun,” he said.However, skeptics remain. Commentator Rekt Fencer pointed out
    that most altcoins have been down 90% since December. A modest 10% bounce this
    week sparked exaggerated optimism, prompting him to mock the rally. “This is the
    ALTSEASON we’ve all been waiting for,” he joked.Source: Rekt FencerRelated: Bitcoin
    ‘more likely’ to hit $110K before $76.5K — Arthur HayesCrypto market rallies on
    global optimismCrypto markets started the weekend with strong bullish momentum,
    driven by renewed investor confidence. Bitcoin surged to $104,900, just 4% below
    its all-time high after President Donald Trump announced positive developments
    in US-China trade talks.The rally extended beyond Bitcoin, with Ether (ETH) posting
    one of its best daily performances in weeks. Memecoins also rebounded sharply,
    signaling renewed risk appetite across the broader altcoin market.“Crypto rallied
    on a wave of global optimism,” Hank Huang, CEO of Kronos Research, told Cointelegraph.
    “Ceasefire talks between India and Pakistan eased regional tensions, while news
    on U.S.-China trade tariffs signaled renewed cooperation between major economies.”Huang
    added that Ether’s strong rally added fuel, lifting altcoins across the board.
    “Bitcoin surged to $105K as investors returned to risk assets, clarity replaced
    uncertainty,” he noted.Magazine: Bitcoin eyes ‘crazy numbers,’ JD Vance set for
    Bitcoin talk: Hodler’s Digest, May 4 – 10\n\n            "

    selling pressure, with the S&P 500 and Nasdaq Composite Index both down over 2%
    at the time of writing.Newfound BTC price strength thus appeared to end lockstep
    trading with equities as part of reactions to trade-war headlines.These included
    warnings about the deterioration of relations with the US from both China and

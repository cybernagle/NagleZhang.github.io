- title: " Italian town to unveil locally financed Satoshi Nakamoto monument "
  url: https://cointelegraph.com/news/italian-municipality-fornelli-satoshi-nakamoto-monument?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "The Italian municipality of Fornelli in the Molise region of Italy will
    be dedicating a monument to pseudonymous Bitcoin (BTC) creator Satoshi Nakamoto.In
    an April 23 Facebook post from the municipality, Fornelli said it plans to unveil
    the Satoshi artwork on May 1. Details surrounding the monument were unclear in
    the announcement, but the municipality said it had been designed by artist Mattia
    Pannoni and financed by the local government. “It is important, indeed fundamental,
    as an administration, to take into consideration all the new ideas that come from
    our young people,” said Fornelli Mayor Giovanni Tedeschi.According to the local
    government, Fornelli has the “highest density of Bitcoin adoption in the world”
    among its roughly 1,800 residents. Other regions have attempted to use BTC or
    other cryptocurrencies to attract visitors, including the Bitcoin Beach area of
    El Salvador and the Swiss city of Zug, which accepts crypto payments for many
    local goods and services. Portraying a faceless individual through artThe identity
    of Satoshi, whether a single individual or a group of people, remains one of the
    biggest mysteries in the crypto space since the publication of the Bitcoin white
    paper in 2008. Related: Italy finance minister warns US stablecoins pose bigger
    threat than tariffsMany artists, both crypto investors and otherwise, have released
    artwork attempting to represent the pseudonymous creator through statues and digital
    images. A common theme in these pieces is showing Satoshi without any clearly
    defined facial features, sometimes wearing a hoodie or working on a computer. According
    to the announcement, the monument will be unveiled in the Piazza Umberto I area
    of Fornelli on May 1.Magazine: Former Love Island star’s tips on how to go viral
    in crypto: Van00sa, X Hall of Flame\n\n            "

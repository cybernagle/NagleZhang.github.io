- title: " Strategy added 15,355 Bitcoin for $1.42B as price surged above $90K "
  url: https://cointelegraph.com/news/strategy-buys-15-355-bitcoin-price-surges-90-k?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Michael Saylor’s Strategy added to its massive Bitcoin stash last week
    as the cryptocurrency surged above $90,000.In an April 28 announcement, Strategy
    reported acquiring 15,355 Bitcoin (BTC) between April 21 and 27.The latest purchases
    cost Strategy $1.42 billion at an average price of $92,737 per BTC, increasing
    the company’s aggregate BTC holdings by roughly 3% to a total of 535,555 BTC worth
    more than $50 billion.An excerpt from Strategy’s Form 8-K filing with the United
    States Securities and Exchange Commission. Source: StrategyStrategy’s latest buy
    is its largest since late March, when the firm bagged 22,048 Bitcoin for $1.92
    billion at an average price of $86,969 per BTC.Strategy’s Bitcoin yield is at
    13.7%Announcing the purchase on X, Strategy co-founder Saylor said the firm has
    achieved the BTC yield of 13.7% year-to-date.“As of April 27, we hodl 553,555
    BTC acquired for approximately $37.90 billion at $68,459 per Bitcoin,” Saylor
    noted.Source: Michael SaylorStrategy’s BTC yield — an indicator representing the
    percentage change of the ratio between its BTC holdings and assumed diluted shares
    — amounted to 74% in 2024.The company expects to reach a BTC yield target of 15%
    in 2025.“You can still buy BTC for less than $0.1 million”Strategy’s Bitcoin purchase
    came as the cryptocurrency caught significant bullish action last week, surging
    8% from around $87,000 to nearly $94,000 in the period from April 21–27, according
    to data from CoinGecko.Bitcoin traded at $95,442 at the time of writing, slightly
    above its price on Jan. 1, but still lower than its all-time high price above
    $109,000 seen on Jan. 21.As Strategy beefed up its Bitcoin stash alongside a BTC
    rally, Saylor continued posting bullish messages to the community on social media.Related:
    Over 13K institutions exposed to Strategy as Saylor hints at BTC buy“You can still
    buy BTC for less than $0.1 million,” Saylor wrote on April 25.In another X post
    preceding the purchase announcement, Saylor said: “Stay humble. Stack sats [satoshis].”
    He linked the message to a screenshot of Strategy’s portfolio tracker reflecting
    the company’s BTC purchases on the timeline of the price chart.Source: Michael
    SaylorThe news comes as Strategy is inching toward a $100 billion market capitalization,
    with MSTR shares surging roughly 23% YTD and trading at $368.7 at the time of
    publication, according to data from TradingView.Magazine: Bitcoin $100K hopes
    on ice, SBF’s mysterious prison move: Hodler’s Digest, April 20 – 26\n\n            "

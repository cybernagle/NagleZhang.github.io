- title: " US Bitcoin ETFs clock biggest inflows since January as crypto markets gain "
  url: https://cointelegraph.com/news/bitcoin-etfs-inflow-peak-since-january-amid-crypto-surge?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "US-based Bitcoin exchange-traded funds (ETFs) had their largest day of
    net inflows since late January, as crypto markets remained buoyant over the Easter
    weekend.The 11 Bitcoin (BTC)-tracking funds saw a joint net inflow of $381.3 million
    on April 21, largely carried by a $116.1 million inflow into the ARK 21Shares
    Bitcoin ETF (ARKB), according to CoinGlass data.It's the largest inflow day for
    the ETFs since the funds had a $588.1 million joint net inflow on Jan. 30, days
    after Bitcoin hit a peak and was trading with a six-figure price tag.Total Bitcoin
    ETF flows since their launch in January 2024. Source: CoinGlassThe ETFs have struggled
    to maintain inflows over the past few weeks amid US President Donald Trump’s trade
    war threats. CoinGecko shows Bitcoin fell below $100,000 in early February and
    hit a 2025 low of $74,773 on April 7, days after Trump placed tariffs on every
    country, which also caused a stock market slump.The Fidelity Wise Origin Bitcoin
    Fund (FBTC) saw the second-largest inflow for April 21, with $87.6 million, while
    the Grayscale Bitcoin Trust (GBTC) and the company’s Bitcoin Mini Trust ETF (BTC)
    saw joint net inflows of $69.1 million.The Invesco Galaxy Bitcoin ETF (BTCO) and
    the WisdomTree Bitcoin Fund (BTCW) saw no inflows or outflows on April 21. Source:
    CoinGlassBlackRock’s iShares Bitcoin Trust ETF (IBIT), the largest of the group
    by assets under management, saw net inflows reach $41.6 million, about half of
    the inflows it saw before the weekend trading break on April 17.Crypto stays afloat
    over long weekendUS markets had shut down on April 18 in observance of Good Friday,
    and trading on Monday, April 21, saw them close in the red, with the S&P 500 down
    2.4%, while the Nasdaq and the Dow Jones each dropped 2.5%.Related: Bitcoin rally
    above $100K may follow US Treasury buybacks — Arthur HayesThe crypto markets,
    meanwhile, were able to hold onto gains made over the long weekend, with the total
    crypto market capitalization climbing by $800 billion over the three-day break
    to hold at $2.84 trillion.Bitcoin has boosted that total, having climbed above
    a market value of $1.75 trillion for the first time since March 22 as its price
    struck above $88,500, a four-week high.Magazine: Financial nihilism in crypto
    is over — It’s time to dream big again\n\n            "

- title: " Michael Saylor’s Strategy buys $285M Bitcoin amid market uncertainty "
  url: https://cointelegraph.com/news/michael-saylor-strategy-buys-285-m-bitcoin-83k?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Michael Saylor’s digital asset firm, Strategy, purchased 3,459 Bitcoin
    for $285.5 million, signaling continued confidence in Bitcoin even as global markets
    face trade-related headwinds.Strategy acquired the 3,459 Bitcoin (BTC) for $285.5
    million at an average price of $82,618 per BTC. The purchase brings Strategy’s
    total Bitcoin holdings to 531,644 BTC, acquired for a cumulative $35.92 billion
    at an average price of $67,556 per coin, achieving an over 11.4% yield since the
    beginning of 2025, Saylor wrote in an April 14 X post.Source: Michael SaylorThe
    $285 million purchase marks Strategy’s first Bitcoin investment since March 31,
    when the company acquired $1.9 billion worth of Bitcoin, Cointelegraph reported.According
    to data from Saylortracker, the firm is currently sitting on more than $9.1 billion
    in unrealized profit, representing a 25% gain on its total Bitcoin position as
    of 12:20 pm UTC.Strategy total Bitcoin holdings. Source: Saylortracker Strategy’s
    continued accumulation comes despite a broader market pullback and declining appetite
    for risk assets. The downturn has been largely attributed to global trade policy
    uncertainty after US President Donald Trump announced a new round of tariffs.Trump
    announced a 90-day pause on higher reciprocal tariffs on April 9, reverting the
    tariffs to the 10% baseline for most countries, except for China, which currently
    faces a 145% import tariff.Related: New York bill proposes legalizing Bitcoin,
    crypto for state paymentsCrypto markets open with “cautious strength” ahead of
    key economic releasesDespite continued uncertainty around the outcome of trade
    negotiations, Bitcoin staged an over 10% recovery in the past seven days to above
    $85,000 as of 1:10 pm UTC, Cointelegraph Markets Pro data shows.BTC/USD, 1-year
    chart. Source: Cointelegraph“Crypto markets opened the week with cautious strength,
    continuing a broad recovery from last Monday’s tariff-induced sell-off,” Stella
    Zlatareva, dispatch editor at digital asset investment platform Nexo, told Cointelegraph,
    adding:“Bitcoin trades above $84,000, marking a robust rebound despite the global
    macro background. While investor focus remains fixed on US-China trade dynamics,
    crypto’s relative stability stands out.”“This week’s calendar includes key data
    from China, Fed commentary and updates on retail sales, all of which could shape
    the next leg of risk asset performance,” she added.Related: Bitcoin ‘more likely’
    to hit $110K before $76.5K — Arthur HayesDespite the tariff-related uncertainty,
    some analysts, including Jamie Coutts, predicted that the growing money supply
    could push Bitcoin’s price above $132,000 before the end of 2025.Zooming out to
    the next decade, Bitcoin remains on track to surpass $1.8 million by 2035, in
    a development that may see Bitcoin surpass gold’s $21 trillion market capitalization
    as the superior savings technology, Joe Burnett, director of market research at
    Unchained, told Cointelegraph.Magazine: Bitcoin ATH sooner than expected? XRP
    may drop 40%, and more: Hodler’s Digest, March 23 – 29\n\n            "

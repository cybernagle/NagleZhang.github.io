- title: " Corporate Bitcoin treasuries drop more than $4B on US tariff hike impact "
  url: https://cointelegraph.com/news/corporate-bitcoin-treasuries-down-4b-us-tariff-hike-impact?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Corporate Bitcoin (BTC) treasuries collectively shed more than $4 billion
    in value after US President Donald Trump’s tariffs triggered a global market sell-off,
    data shows. As of April 7, corporate Bitcoin holdings are worth approximately
    $54.5 billion in the aggregate, down from roughly $59 billion before April 2,
    according to data from BitcoinTreasuries.net.The cryptocurrency’s volatility has
    also weighed on publicly traded Bitcoin holders’ share prices. The Bitwise Bitcoin
    Standard Corporations ETF (OWNB) — an exchange-traded fund (ETF) tracking a diverse
    basket of corporate Bitcoin holders — has lost more than 13% since Trump announced
    sweeping US import tariffs on April 2, according to Yahoo Finance.Even shares
    of Strategy — the de facto Bitcoin hedge fund founded by Michael Saylor that pioneered
    corporate Bitcoin buying — are down, clocking losses of more than 13% since April
    2, Google Finance data showed. The losses highlight ongoing concerns about Bitcoin’s
    increasing popularity as a corporate treasury asset. Historically, corporate treasuries
    hold extremely low-risk assets like US Treasury Bills. “Cryptocurrencies' high
    volatility and uncertain regulatory landscape are misaligned with the fundamental
    goals of treasury management [such as] stability, liquidity, and capital preservation,”
    David Krause, a finance professor at Marquette University, said in a January research
    publication. Entities holding Bitcoin. Source: BitcoinTreasuries.NETRelated: Bitcoin,
    showing 'signs of resilience', beats stocks, gold as equities fold — BinanceIs
    Bitcoin right for corporate treasuries?In 2024, surging Bitcoin prices pushed
    Strategy’s shares up more than 350%, according to data from FinanceCharts. Strategy’s
    success has inspired dozens of copycats, but investors are becoming skeptical.In
    March, GameStop lost nearly $3 billion in market capitalization as shareholders
    second-guessed the videogame retailer’s plans to stockpile Bitcoin. “There are
    question marks with GameStop's model. If bitcoin is going to be the pivot, where
    does that leave everything else?” Bret Kenwell, US investment analyst at eToro,
    told Reuters on March 27. The case for Bitcoin as a corporate treasury asset.
    Source: Fidelity Digital AssetsStill, adding Bitcoin to corporate treasuries can
    “potentially be a valuable hedge against growing fiscal deficits, currency debasement,
    and geopolitical risks,” asset manager Fidelity Digital Assets said in a 2024
    report.That thesis may already be playing out as Trump’s tariffs rattle markets,
    Binance said in an April 7 research report.  “[I]n the wake of recent tariff announcements,
    BTC has shown some signs of resilience, holding steady or rebounding on days when
    traditional risk assets faltered,” Binance said.Investors “will be watching closely
    to see if BTC is able to retain its appeal as a non-sovereign, permissionless
    asset in a protectionist global economy,” according to the report.Magazine: Bitcoin
    heading to $70K soon? Crypto baller funds SpaceX flight: Hodler’s Digest, March
    30 – April 5\n\n            "

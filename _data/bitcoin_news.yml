- title: " Victim of a crypto scam? Here’s what to do next "
  url: https://cointelegraph.com/explained/victim-of-a-crypto-scam-heres-what-to-do-next?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS9zdG9yYWdlL3VwbG9hZHMvdmlldy8wZDdmMDY1MDQzZWZjNGMwN2VkZWI3ZTgyN2VmNmQ2OC5qcGc=.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS9zdG9yYWdlL3VwbG9hZHMvdmlldy8wZDdmMDY1MDQzZWZjNGMwN2VkZWI3ZTgyN2VmNmQ2OC5qcGc=.jpg\"
    alt=\"Victim of a crypto scam? Here’s what to do next\"></p><div data-ct-widget=\"explained-block\"
    id=\"explained-block-181083-4\">            <h2 data-ct-widget=\"explained-block-title\">
    \               Beware of various forms of cryptocurrency scams            </h2>
    \           <p data-ct-widget=\"explained-block-content\">                </p><p><em>Cryptocurrency
    scams can manifest in various forms, often preying on the lack of regulation and
    the complexity of blockchain transactions.&nbsp;</em></p><p>You must be aware
    of <a href=\"https://cointelegraph.com/news/crypto-scams-biggest-year-ever-2025-from-ai-chainalysis\">common
    tactics used in cryptocurrency scams.</a> These include:</p><ul><li><strong>Phishing
    scams: </strong>Attackers send fraudulent emails or messages that <a href=\"https://cointelegraph.com/learn/articles/what-is-a-phishing-attack-in-crypto-and-how-to-prevent-it\">mimic
    legitimate cryptocurrency platforms</a>. Victims may be tricked into providing
    sensitive information such as private keys or login credentials.</li><li><strong>Ponzi
    schemes: </strong>Promises of high returns with little to no risk lure investors
    into <a href=\"https://cointelegraph.com/explained/ponzi-vs-pyramid-schemes-whats-the-difference\">schemes
    that eventually collapse</a>, leaving many with significant losses.</li><li><strong>Fake
    ICOs:</strong> Fraudulent projects present a compelling investment opportunity,
    only to disappear after collecting funds.</li><li><strong>Rug pulls: </strong>In
    <a href=\"https://cointelegraph.com/learn/articles/defi-a-comprehensive-guide-to-decentralized-finance\">decentralized
    finance (DeFi)</a>, developers of a project could suddenly withdraw all funds
    from a liquidity pool, leaving investors with worthless tokens. This malicious
    act is called a <a href=\"https://cointelegraph.com/explained/crypto-rug-pulls-what-is-a-rug-pull-in-crypto-and-6-ways-to-spot-it\">rug
    pull</a>, and it typically occurs after a project has gained enough momentum and
    unsuspecting investors have bought into it.&nbsp;</li><li><strong>Social media
    impersonations: </strong>Cybercriminals impersonate reputable influencers or <a
    href=\"https://cointelegraph.com/learn/articles/fake-crypto-support-scam\">customer
    support accounts</a>. They use social media to solicit investments or send links
    that compromise security. Always cross-check identities through official channels.</li><li><strong>AI-powered
    scams:</strong> AI-powered scams in the crypto space involve advanced tools like
    phishing bots, <a href=\"https://cointelegraph.com/learn/articles/deepfakes-how-to-spot-fake-audio-and-video\">deepfakes</a>
    and exploit bots, which can automatically create convincing fake messages or manipulate
    platforms to steal funds. These scams are increasingly sophisticated, making it
    harder for users to spot fraudulent activities and putting digital assets at greater
    risk.</li></ul>                    <div data-ct-widget=\"explained-block\" id=\"explained-block-181083-3\">
    \           <h2 data-ct-widget=\"explained-block-title\">                Immediate
    steps: What to do after a crypto scam            </h2>            <p data-ct-widget=\"explained-block-content\">
    \               </p><p><em>If you suspect you have fallen victim to a crypto scam,
    taking prompt action is crucial.&nbsp;</em></p><p>Here&rsquo;s a step-by-step
    guide on what to do after a crypto scam:</p><p><strong>1. Secure your accounts:</strong></p><ul><li>Change
    passwords and enable <a href=\"https://cointelegraph.com/learn/articles/what-is-two-factor-authentication-2fa\">two-factor
    authentication (2FA) </a>on your cryptocurrency accounts.</li><li>Transfer the
    remaining funds to a secure wallet to minimize further risk.</li></ul><p><strong>2.
    Document the incident:</strong></p><ul><li>Keep records of all communications,
    transaction IDs and any other relevant details. This documentation will be essential
    for recovery efforts and legal action against crypto scams, if possible.</li></ul><p><strong>3.
    Report the scam:</strong></p><ul><li>Contact local law enforcement and financial
    regulatory bodies. Many countries have dedicated cybercrime units that can investigate
    such incidents.</li><li>File a complaint with consumer protection agencies and
    report the scam on platforms like the Financial Conduct Authority (FCA) in the
    UK or the Internet Crime Complaint Center (IC3), a division of the FBI that handles
    internet-related crimes in the US. You can also report <a href=\"https://cointelegraph.com/learn/articles/crypto-money-mule-scam-how-to-avoid-it\">cryptocurrency
    fraud to Action Fraud</a> in the UK, which will then escalate the case to the
    National Crime Agency (NCA), which is responsible for investigating major cybercrimes
    and financial fraud.</li></ul><p><strong>4. Seek professional guidance:</strong></p><ul><li>Consult
    legal experts specializing in digital assets for legal action regarding crypto
    scams. They can help navigate the complex legal landscape and potentially assist
    in recovering lost funds.</li><li>Engage cybersecurity professionals who can provide
    crypto fraud help and advice on strengthening your digital security.</li></ul><p><strong>5.
    Monitor and track transactions:</strong></p><ul><li>Utilize blockchain explorers
    to trace the movement of your stolen assets. Although cryptocurrencies are designed
    for transparency, identifying the destination of funds can be challenging without
    professional assistance.</li><li>Consider reaching out to companies specializing
    in blockchain analytics for a detailed investigation.</li></ul><p><em><strong>Did
    you know?</strong> Argentine President Javier Milei&rsquo;s X post endorsing the
    LIBRA token briefly sent its market cap soaring to $4 billion &mdash; only for
    him to delete it hours later,<a href=\"https://cointelegraph.com/explained/mileis-libragate-scandal-explained-whats-behind-the-controversy\">
    triggering a crash</a> that wiped out millions in investor funds.</em></p>                    </div><div
    data-ct-widget=\"explained-block\" id=\"explained-block-181083-2\">            <h2
    data-ct-widget=\"explained-block-title\">                How to report a cryptocurrency
    scam in the US            </h2>            <p data-ct-widget=\"explained-block-content\">
    \               </p><p><em>Reporting crypto scams in the US can be challenging
    because responsibility is spread across multiple agencies at the federal, state
    and local levels.&nbsp;</em></p><p>Before reporting any scam, keep all transaction
    records, screenshots, emails and any other communications related to the fraud.
    Determine if it was a phishing attack, fake investment or another form of fraud.
    This helps in categorizing the complaint accurately. The next steps in reporting
    the scam are as follows:</p><h3>Federal reporting</h3><ul><li><strong>FBI&rsquo;s
    Internet Crime Complaint Center (IC3): </strong>This is one of the primary platforms
    for reporting online financial crimes, including those involving cryptocurrencies.
    Although many victims report scams through IC3, feedback is <strong>often minimal,
    underscoring the need for a more responsive system.</strong></li><li><strong>Additional
    Federal Agencies:</strong> Depending on the nature of the scam, you might also
    consider contacting regulators like the Securities and Exchange Commission (SEC)
    if the fraud involves investment scams.</li></ul><p><img alt=\"Reporting crypto
    crime of IC3\" src=\"https://s3.cointelegraph.com/storage/uploads/view/ac8bc2125d0e7dee4475b521bcd75acc.png\"
    title=\"Reporting crypto crime of IC3\"></p><h3>State and local authorities</h3><ul><li><strong>Local
    law enforcement:</strong> File a report with your local police or cybercrime unit.
    They can sometimes offer immediate assistance or direct you to specialized resources.</li><li><strong>State
    regulators: </strong>Some states have dedicated offices for financial protection.
    For example, in California, authorities like the Department of Financial Protection
    and Innovation (DFPI) have been actively <a href=\"https://cointelegraph.com/news/californian-regulator-warns-7-new-crypto-ai-scams\">addressing
    emerging crypto scams</a>, from fake mining schemes to fraudulent investment groups.</li></ul><p>Given
    the fragmented crypto crime reporting system in the US, industry leaders have
    called for a <a href=\"https://cointelegraph.com/news/crypto-scam-reporting-fragmented-needs-one-system-coinbase-cso\">streamlined,
    centralized reporting system</a> that not only consolidates data from various
    agencies but also offers victims a way to track the status of their complaints.
    While this system is not yet in place, being aware of this need can help you set
    realistic expectations and encourage further advocacy.</p><h3>Engage with specialized
    support</h3><ul><li><strong>Legal consultation: </strong>Many crypto scams are
    orchestrated from overseas, making cross-border cooperation essential. A lawyer
    specialized in cryptocurrency or cybercrime in your jurisdiction could help you
    navigate the legal system and work with the appropriate agencies.&nbsp;</li><li><strong>Blockchain
    analysis firms:</strong> Some companies offer forensic services to trace the movement
    of funds on the blockchain. However, ensure you thoroughly research these firms
    to avoid further scams.</li></ul>                    </div><div data-ct-widget=\"explained-block\"
    id=\"explained-block-181083-1\">            <h2 data-ct-widget=\"explained-block-title\">
    \               Is it possible to recover crypto lost in scams?            </h2>
    \           <p data-ct-widget=\"explained-block-content\">                </p><p><em>It&rsquo;s
    one of the toughest questions for anyone scammed in the crypto space: Can I get
    my lost crypto back? Unfortunately, the short answer is that recovery can be incredibly
    difficult, but it&rsquo;s not impossible.</em></p><p>Crypto transactions, by nature,
    <a href=\"https://cointelegraph.com/learn/articles/what-is-a-cryptocurrency-a-beginners-guide-to-digital-money\">are
    irreversible</a>. Once you send crypto to a scammer&rsquo;s wallet, no central
    authority like a bank can reverse the transaction. However, there are still a
    few steps you can take to attempt recovery and minimize future risks.</p><p>First,
    report the scam by contacting local authorities, such as Action Fraud in the UK
    or the FBI&rsquo;s IC3 in the US. While they may not be able to recover your funds
    directly, reporting the incident creates a record of the scam, which could help
    in more extensive investigations or lead to action against the scammers in the
    future.</p><p>Crypto exchanges and wallet providers may also be able to assist
    if the scam involves funds sent to or received by a platform they control. Contact
    their support team immediately. Although the likelihood of recovery from an exchange
    is slim, some platforms may freeze accounts or funds related to suspicious activities.</p><p>Use
    blockchain forensics services that specialize in tracing the flow of stolen cryptocurrency
    on the blockchain. They might help you track where your funds went, and sometimes,
    this information can be handed over to law enforcement to assist with investigations.
    However, if your funds were sent to a private wallet or <a href=\"https://cointelegraph.com/explained/crypto-mixers-and-crosschain-bridges-how-hackers-launder-stolen-assets\">mixed
    through services</a> designed to obscure transactions, recovery becomes significantly
    more challenging.</p><p>While it may not always feel like there&rsquo;s hope,
    acting quickly and understanding the complexities of crypto recovery can make
    a difference. Remember, the best recovery tactic is prevention; staying informed
    is your first defense.</p><p><em><strong>Did you know?</strong> Elliptic, a blockchain
    analytics firm, traced funds stolen in the record-breaking $1.5 billion Bybit
    hack to the North Korean Lazarus Group, which <a href=\"https://cointelegraph.com/learn/articles/who-is-ben-zhou\">laundered
    the assets</a> through exchanges like eXch.&nbsp;</em></p>                    </div><div
    data-ct-widget=\"explained-block\" id=\"explained-block-181083-0\">            <h2
    data-ct-widget=\"explained-block-title\">                Preventative measures:
    Avoiding cryptocurrency scams            </h2>            <p data-ct-widget=\"explained-block-content\">
    \               </p><p><em>Preventing future scams is as critical as recovering
    from one. Avoiding cryptocurrency scams is all about staying informed and cautious.&nbsp;</em></p><p>Implement
    the following measures to reduce your risk:</p><ul><li><strong>Do your homework:
    </strong>Before investing in any project or platform, take the time to research.
    Look into the team behind it, read the <a href=\"https://cointelegraph.com/learn/articles/what-is-a-white-paper-a-beginners-guide-on-how-to-write-and-format-one\">white
    paper</a> and check out reviews from reputable sources. If you can&rsquo;t find
    clear, verifiable information or something feels off, trust your instincts and
    steer clear.</li><li><strong>Stay updated on scam tactics: </strong>The tactics
    used by scammers are constantly evolving. Familiarize yourself with common scams
    like phishing, AI-powered or impersonation scams. Following crypto news and joining
    reputable online communities can keep you informed about the latest warning signs.</li><li><strong>Question
    &ldquo;too-good-to-be-true&rdquo; offers: </strong>If someone promises sky-high
    returns with little risk, <a href=\"https://cointelegraph.com/learn/articles/how-ai-and-deepfakes-are-fueling-new-cryptocurrency-scams\">it&rsquo;s
    likely a red flag</a>. In crypto, as in any investment, high rewards usually come
    with high risks. A legitimate opportunity won&rsquo;t pressure you with unrealistic
    promises.</li><li><strong>Verify websites and emails: </strong>Scammers often
    create lookalike websites and send fake emails that mimic trusted services. Always
    double-check URLs and email addresses, and if something doesn&rsquo;t match the
    official website or seems unusual, avoid clicking on any links.</li><li><strong>Secure
    your digital assets: </strong>Treat your <a href=\"https://cointelegraph.com/explained/crypto-wallets-explained\">crypto
    wallets</a> like a personal safe. Use hardware wallets for long-term storage,
    enable 2FA on all accounts and never share your private keys or recovery phrases.
    Think of your <a href=\"https://cointelegraph.com/learn/articles/public-key-vs-private-key\">private
    keys</a> as the keys to your house &mdash; keep them secure and private.</li><li><strong>Take
    your time:</strong> Scammers love to create urgency with &ldquo;limited-time offers&rdquo;
    or &ldquo;exclusive deals.&rdquo; If you&rsquo;re being rushed into a decision,
    pause and do your research. Legitimate opportunities will still be available after
    you&rsquo;ve had time to verify the details.</li><li><strong>Diversify your investments:
    </strong>Never put all your money into one asset or project. Diversification helps
    manage risk and protects you if one investment turns out to be less secure than
    expected.</li><li><strong>Seek trusted opinions:</strong> If you&rsquo;re unsure
    about an investment or an offer, ask for advice from knowledgeable friends or
    community members. Trusted crypto communities and forums can be great for getting
    second opinions &mdash; but always be cautious and cross-check the information.</li></ul><p>By
    staying vigilant, questioning deals that seem too good to be true and taking simple
    security measures, you can significantly reduce the risk of falling victim to
    crypto scams. It&rsquo;s all about being cautious and making informed decisions.
    Your future self will thank you!</p>                    </div></div>\n</p>\n            "
  published: 2025-03-17 08:00:00 UTC
- title: " Here’s what happened in crypto today "
  url: https://cointelegraph.com/news/what-happened-in-crypto-today?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDEvMDE5NDgzZjctMTdlYS03OTc0LWJlNzMtNjYxYzdjZDE1N2M3.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDEvMDE5NDgzZjctMTdlYS03OTc0LWJlNzMtNjYxYzdjZDE1N2M3.jpg\"
    alt=\"Here’s what happened in crypto today\"></p><p>Today in crypto, South Korea&rsquo;s
    central bank has confirmed it has not discussed or reviewed the possibility of
    a Bitcoin reserve. Jameson Lopp says quantum computers should not be used to restore
    lost Bitcoin and Libra&rsquo;s controversial co-creator, Hayden Davies, has launched
    another memecoin that led to a 99% collapse.<h2>Bank of Korea to take &lsquo;cautious
    approach&rsquo; to Bitcoin reserve</h2><p>The Bank of Korea says it is taking
    a &ldquo;cautious approach&rdquo; to <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/south-korea-central-bank-cautious-stance-potential-bitcoin-reserve\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">potentially including
    Bitcoin</a> as a foreign exchange reserve.</p><p>Officials from the Korean central
    bank said in a March 16 response to a written inquiry that they have not looked
    into a potential Bitcoin (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC)</a> reserve, citing
    high volatility.&nbsp;</p><p>Responding to a question from Representative Cha
    Gyu-geun of the National Assembly&rsquo;s Planning and Finance Committee, central
    bankers said that they have &ldquo;neither discussed nor reviewed the possible
    inclusion of Bitcoin in foreign exchange reserves, adding that &ldquo;a cautious
    approach is needed,&rdquo; <a data-ct-non-breakable=\"null\" href=\"https://www.koreaherald.com/article/10442438\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">according</a> to the
    Korea Herald.</p><p>&ldquo;Bitcoin&rsquo;s price volatility is very high,&rdquo;
    the central bank noted, before adding that &ldquo;in the case of cryptocurrency
    market instability, transaction costs to cash out Bitcoins could rise drastically.&rdquo;</p><h2>Jameson
    Lopp says we shouldn't allow quantum computers to restore lost BTC</h2><p>Jameson
    Lopp, chief security officer at Bitcoin (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>) custody company
    Casa, recently argued that Quantum computers<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/burning-quantum-vulnerable-btc-best-option-jameson-lopp\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"> should not be used
    to restore lost BTC</a>.</p><p>According to a March 16<a data-ct-non-breakable=\"null\"
    href=\"https://blog.lopp.net/against-quantum-recovery-of-bitcoin/\" rel=\"null\"
    target=\"null\" text=\"null\" title=\"null\"> article</a> from Lopp, allowing
    quantum computers to restore Bitcoin that was previously thought to be lost would
    violate the core value propositions of the network, including censorship resistance,
    transaction immutability, and conservatism. Lopp added:</p><blockquote>\"Does
    quantum recovery help anyone? I have yet to come across an argument that it is
    a net positive in any way. It certainly doesn't add any security to the network.\"</blockquote><p>\"If
    anything, it greatly decreases the security of the network by allowing funds to
    be claimed by those who did not earn them,\" the executive continued.</p><p>The
    cypherpunk and industry executive added to the ongoing debate about the potential
    for quantum computers to restore lost BTC after Tether CEO<a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/quantum-computing-bitcoin-lost-wallet-threat-tether-ceo\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"> Paolo Ardoino pitched
    the idea</a> in February.&nbsp;</p><h2>Libra, Melania creator&rsquo;s &lsquo;Wolf
    of Wall Street&rsquo; memecoin crashes 99%</h2><p>The creator of the Libra (LIBRA)
    token has launched another memecoin with some of the same concerning onchain patterns
    that pointed to significant insider trading activity ahead of the coin&rsquo;s
    99% collapse.</p><p>Hayden Davis, the co-creator of the <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/melania-trump-memecoin-launches-notches-4-b-market-cap\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Official Melania Meme
    (MELANIA)</a> and the Libra token, has launched a new Solana-based memecoin, with
    an over 80% insider supply.</p><p>Davis launched the Wolf (WOLF) memecoin on March
    8, banking on rumors of Jordan Belfort, known as the Wolf of Wall Street, launching
    his own token.</p><p>The token reached a peak $42 million market cap, however,
    82% of the WOLF token&rsquo;s supply was bundled under the same entity, according
    to a March 15 X post by <a data-ct-non-breakable=\"null\" href=\"https://x.com/bubblemaps/status/1900928833601036634/photo/1\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Bubblemaps</a>, which
    wrote:</p><p>&ldquo;The bubble map revealed something strange &mdash; $WOLF had
    the same pattern as $HOOD, a token launched by Hayden Davis. Was he behind this
    one too?&rdquo;</p><template data-name=\"subscription_form\" data-type=\"defi_newsletter\"
    label=\"Subscription Form: DeFi Newsletter\"></template></p>\n</p>\n            "
  published: 2025-03-17 07:00:00 UTC
- title: " Trump’s second ex-wife calls for end of prosecution against Roger Ver "
  url: https://cointelegraph.com/news/trump-ex-wife-marla-maples-supports-end-roger-ver-persecution?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWEyMDQtNGQyZi03ODhjLTkwZWMtMmVlMGU0YmU5Y2Ez.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWEyMDQtNGQyZi03ODhjLTkwZWMtMmVlMGU0YmU5Y2Ez.jpg\"
    alt=\"Trump’s second ex-wife calls for end of prosecution against Roger Ver\"></p><p>US
    President Donald Trump&rsquo;s second ex-wife, Marla Maples, has shown support
    for ending the country&rsquo;s case against early Bitcoin advocate Roger Ver,
    known as &ldquo;Bitcoin Jesus.&rdquo;<p>&ldquo;Sharing more re [regarding] the
    call to dismiss the prosecution against Roger Ver,&rdquo; Maples <a data-ct-non-breakable=\"null\"
    href=\"https://x.com/itsmarlamaples/status/1901266943568380327\" rel=\"null\"
    target=\"null\" text=\"null\" title=\"null\">said</a> in a March 16 X post, sharing
    a video created by an organization aimed at supporting Ver and tagging Trump,
    Elon Musk and US Attorney General Pam Bondi.</p><p>The Department of Justice <a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/roger-ver-tax-fraud-charges\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">charged Ver with mail
    fraud</a>, tax evasion and filing false tax returns in April 2024, alleging he
    hid the amount of Bitcoin (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>) he owned when
    he renounced his US citizenship in 2014 and defrauded the Internal Revenue Service
    out of $48 million by failing <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/explained/how-are-cryptocurrency-taxes-reported\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">to report</a> the gains
    he made through selling them.</p><blockquote class=\"twitter-tweet\"><p lang=\"en\"
    dir=\"ltr\">Sharing more re the call to dismiss the prosecution against Roger
    Ver <a href=\"https://twitter.com/PamBondi?ref_src=twsrc%5Etfw\">@PamBondi</a>
    <a href=\"https://twitter.com/elonmusk?ref_src=twsrc%5Etfw\">@elonmusk</a> <a
    href=\"https://twitter.com/realDonaldTrump?ref_src=twsrc%5Etfw\">@realDonaldTrump</a>
    <a href=\"https://twitter.com/Davewarrington?ref_src=twsrc%5Etfw\">@Davewarrington</a>
    <a href=\"https://t.co/BckQwEXBW6\">https://t.co/BckQwEXBW6</a></p>&mdash; marla
    maples (@itsmarlamaples) <a href=\"https://twitter.com/itsmarlamaples/status/1901266943568380327?ref_src=twsrc%5Etfw\">March
    16, 2025</a></blockquote><script async src=\"https://platform.twitter.com/widgets.js\"
    charset=\"utf-8\"></script><p>Maples and Trump met in the mid-1980s during his
    first marriage to Ivana Trump, and was his second wife from 1993 until 1999. She
    has long been involved with philanthropy and has advocated for multiple charities
    and causes.</p><p>She is seemingly still close to and supportive of Trump, who
    together have a daughter, Tiffany Trump. Maples <a data-ct-non-breakable=\"null\"
    href=\"https://x.com/itsmarlamaples/status/1881376229741486375\" rel=\"null\"
    target=\"null\" text=\"null\" title=\"null\">attended</a> Trump&rsquo;s inauguration
    and <a data-ct-non-breakable=\"null\" href=\"https://www.standard.co.uk/lifestyle/celebrity/marla-maples-donald-trump-exclusive-interview-innocent-us-election-b1169572.html\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">told</a> the London
    Evening Standard in July that she was &ldquo;open to whatever way that I can serve&rdquo;
    the then-presidential bidder.</p><p>Maples joins a host of high-profile figures
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/crypto-veterans-call-out-doj-targeting-roger-ver\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">calling to stop</a>
    the prosecution of Ver, which includes <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/vitalik-buterin-joins-calls-free-roger-ver\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Ethereum co-founder</a>
    Vitalik Buterin and online black market <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/ross-ulbricht-calls-trump-pardon-bitcoin-jesus-next\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Silk Road creator</a>
    Ross Ulbricht, who was facing a double life sentence in prison until Trump pardoned
    him in January.</p><p>Ver has appealed to Trump for a pardon, claiming he is being
    unfairly persecuted and is a victim of &ldquo;lawfare.&rdquo;</p><p>Neither Trump
    nor the White House has publicly acknowledged Ver&rsquo;s plea, but Trump&rsquo;s
    cost-cutting czar Musk <a data-ct-non-breakable=\"null\" href=\"https://x.com/elonmusk/status/1883408063694254415\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">said</a> in a January
    X post that Ver &ldquo;gave up his US citizenship. No pardon for Ver. Membership
    has its privileges.&rdquo;</p><p><em><strong>Related: </strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/roger-ver-trump-pardon-lawfare\" rel=\"null\"
    target=\"null\" text=\"null\" title=\"null\"><em><strong>Roger Ver&rsquo;s Trump
    pardon plea: &lsquo;Lawfare&rsquo; victim or tax evader?</strong></em></a>&nbsp;</p><p>Ver
    was arrested in Spain at the time of the US indictment pending his extradition
    to the US but was <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/roger-ver-bail-spain-extradition-united-states\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">later granted bail</a>
    on the condition he remain in the country.</p><p>He <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/roger-ver-files-dismiss-us-tax-charges-unconstitutional\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">moved to dismiss</a>
    the government&rsquo;s case in December, arguing the charges were unconstitutional,
    and the IRS&rsquo; &ldquo;exit tax&rdquo; for renounced citizens is &ldquo;inscrutably
    vague&rdquo; when applied to crypto.</p><p>Cointelegraph has contacted Maples
    for comment.</p><p><em><strong>Magazine: </strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/magazine/trumps-crypto-insider-trading-conflict-of-interest-concerns/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Trump&rsquo;s
    crypto ventures raise conflict of interest, insider trading questions</strong></em></a>&nbsp;</p><template
    data-name=\"subscription_form\" data-type=\"law_decoded\" label=\"Subscription
    Form: Law Decoded\"></template></p>\n</p>\n            "
  published: 2025-03-17 06:06:46 UTC
- title: " Bank of Korea to take ‘cautious approach’ to Bitcoin reserve "
  url: https://cointelegraph.com/news/south-korea-central-bank-cautious-stance-potential-bitcoin-reserve?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWExZDItZDM4Ny03M2EzLWIwN2EtMjBjY2NjZTRiMGEz.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWExZDItZDM4Ny03M2EzLWIwN2EtMjBjY2NjZTRiMGEz.jpg\"
    alt=\"Bank of Korea to take ‘cautious approach’ to Bitcoin reserve\"></p><p>The
    Bank of Korea says it is taking a &ldquo;cautious approach&rdquo; to potentially
    including Bitcoin as a foreign exchange reserve.<p>Officials from the Korean central
    bank said in a March 16 response to a written inquiry that they have not looked
    into a potential Bitcoin (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>) reserve, citing
    high volatility.&nbsp;</p><p>Responding to a question from Representative Cha
    Gyu-geun of the National Assembly&rsquo;s Planning and Finance Committee, central
    bankers said that they have &ldquo;neither discussed nor reviewed the possible
    inclusion of Bitcoin in foreign exchange reserves, adding that &ldquo;a cautious
    approach is needed,&rdquo; <a data-ct-non-breakable=\"null\" href=\"https://www.koreaherald.com/article/10442438\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">according</a> to the
    Korea Herald.</p><p>&ldquo;Bitcoin&rsquo;s price volatility is very high,&rdquo;
    the central bank noted, before adding that &ldquo;in the case of cryptocurrency
    market instability, transaction costs to cash out Bitcoins could rise drastically.&rdquo;</p><p>Over
    the past 30 days, Bitcoin prices have swung wildly between $98,000 and $76,000
    before settling at current levels of around $83,000 in a 15% decline since Feb.
    16, <a data-ct-non-breakable=\"null\" href=\"https://www.coingecko.com/en/coins/bitcoin\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">according</a> to CoinGecko.&nbsp;</p><p>The
    decision comes amid increasing global discussions on the role of crypto assets
    in national financial strategies, sparked by US President Donald Trump&rsquo;s
    executive order earlier this month establishing a <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/explained/trumps-strategic-bitcoin-reserve-and-digital-asset-stockpile-explained\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">strategic Bitcoin reserve</a>
    and digital asset stockpile.&nbsp;&nbsp;</p><p>At a seminar on March 6, crypto
    industry lobbyists and some members of Korea&rsquo;s Democratic Party urged the
    country to integrate Bitcoin into its <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/the-strategic-crypto-reserve\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">national reserves</a>
    and develop a won-backed stablecoin.&nbsp;</p><p>However, the Bank of Korea emphasized
    that its foreign exchange reserves must have liquidity and be immediately usable
    when needed, as well as a credit rating of investment grade or higher, criteria
    that Bitcoin does not meet, in its opinion.&nbsp;</p><p>Professor Yang Jun-seok
    of the Catholic University of Korea concurred, stating, &ldquo;It is appropriate
    for foreign exchange to be held in proportion to the currencies of countries with
    which we trade.&rdquo;</p><p>Professor Kang Tae-soo from the KAIST Graduate School
    of Finance commented on the US being likely to leverage stablecoins rather than
    BTC to maintain dollar hegemony before adding, &ldquo;Whether the IMF will recognize
    stablecoins as foreign exchange reserves in the future is important.&rdquo;</p><p><em><strong>Related:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/democrat-asks-scott-bessent-cease-trumps-bitcoin-reserve\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Democrat
    lawmaker urges Treasury to cease Trump&rsquo;s Bitcoin reserve plans</strong></em></a></p><p>Earlier
    this month, South Korea&rsquo;s financial regulator <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/south-korea-inches-bitcoin-etf-looks-japan-example\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">examined</a> the Japanese
    Financial Services Agency&rsquo;s legislative trend toward crypto assets as it
    mulls lifting a ban on crypto exchange-traded funds in the country.</p><p><em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/ether-price-bottom-sec-delays-multiple-crypto-etfs-ftx-hodlers-digest/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>ETH may
    bottom at $1.6K, SEC delays multiple crypto ETFs, and more: Hodler&rsquo;s Digest</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"markets_outlook\" label=\"Subscription
    Form: Markets Outlook\"></template></p>\n</p>\n            "
  published: 2025-03-17 03:45:52 UTC
- title: " Crypto users report new scam emails spoofing Coinbase, Gemini "
  url: https://cointelegraph.com/news/coinbase-gemini-wallet-phishing-scam-targeting-crypto-users?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDIvMDE5NTE5NDEtMDFlOC03OWQ2LTk4NzktOTk2ZGQzYzg0NmYy.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDIvMDE5NTE5NDEtMDFlOC03OWQ2LTk4NzktOTk2ZGQzYzg0NmYy.jpg\"
    alt=\"Crypto users report new scam emails spoofing Coinbase, Gemini\"></p><p>Crypto
    users have reported an increase in scam emails impersonating exchanges like Coinbase
    and Gemini. These fraudulent emails attempt to trick users into setting up a new
    wallet using pre-generated recovery phrases controlled by scammers.<p>In several
    examples <a data-ct-non-breakable=\"null\" href=\"https://x.com/Lucky8Token/status/1900569952853057652\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">posted</a> to X, the
    email claims to be from Coinbase, asking users to transition to <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/explained/crypto-wallets-explained\" rel=\"null\"
    target=\"null\" text=\"null\" title=\"null\">self-custodial wallets</a> and providing
    instructions on downloading the legitimate Coinbase Wallet, giving a deadline
    of April 1 to make the switch.</p><figure><img alt=\"Coinbase\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a1b8-866d-7c35-b23b-3b0944220b3d\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/SteveKBark/status/1900605757025882440\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\"><em>Steve Kaczynski</em></a></p></figcaption></figure><p>However,
    it also provides <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/explained/what-is-a-seed-phrase-and-why-is-it-important\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">pre-generated recovery
    phrases</a>. Once users open a new wallet with those phrases and transfer funds,
    all the assets will be available to the threat actor, who could drain the wallet.</p><p>The
    email mentions a class-action lawsuit against Coinbase alleging it has sold unregistered
    securities, resulting in a court mandating users manage their wallets.</p><p>&ldquo;Coinbase
    will operate as a registered broker, allowing purchases, but all assets must move
    to Coinbase Wallet,&rdquo; the phony email says.</p><p>The US Securities and Exchange
    Commission <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/sec-dismisses-lawsuit-against-coinbase\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">dismissed its lawsuit
    alleging Coinbase </a>was an unregistered broker and selling unregistered securities
    on Feb. 27.</p><p>Coinbase told Cointelegraph it is aware of the scam and pointed
    to its March 14 post to X, <a data-ct-non-breakable=\"null\" href=\"https://x.com/coinbasesupport/status/1900632373651210421\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">saying</a>, &ldquo;We
    will never send you a recovery phrase, and you should never enter a recovery phrase
    given to you by someone else.&rdquo;&nbsp;</p><figure><img alt=\"Coinbase\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a1b9-14ae-7ff8-a255-1b857e2671de\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/coinbasesupport/status/1900632373651210421\" rel=\"null\"
    target=\"null\" text=\"null\" title=\"null\"><em>Coinbase Support&nbsp;</em></a></p></figcaption></figure><p>Crypto
    exchange Gemini has also been spoofed with the same recovery phrase email scam,
    using the same tactics and claiming users need to set up a new wallet because
    of a recent court decision.</p><p>Gemini was being sued by the SEC for allegedly
    offering unregistered securities through its earn program. The regulator <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/sec-closes-investigation-gemini-no-enforcement-action\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">opted to end the legal
    action</a> on Feb. 26.</p><figure><img alt=\"Coinbase\" src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a1b9-8fe1-7523-8398-f4db7ee15152\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/sukeshtedla/status/1900610709240901829\" rel=\"null\" target=\"null\"
    text=\"null\" title=\"null\"><em>Sukesh Tedla</em></a></p></figcaption></figure><p>Gemini
    didn&rsquo;t immediately respond to Cointelegraph&rsquo;s request for comment.&nbsp;</p><p>Blockchain
    security firm CertiK&rsquo;s<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/phishing-scams-top-crypto-threat-2024-certik\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"> </a>annual Web3 security
    report<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/phishing-scams-top-crypto-threat-2024-certik\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"> flagged crypto phishing
    attacks</a>, which cost users $1 billion across 296 incidents, as the most significant
    security threat for 2024.</p><p><em><strong>Related: </strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/californian-regulator-warns-7-new-crypto-ai-scams\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>California
    financial regulator warns of 7 new types of crypto, AI scams</strong></em></a></p><p>The
    email scams come as at least three crypto founders <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/crypto-founders-report-deluge-of-north-korean-fake-zoom-hacking-attempts\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">have reported foiling
    an attempt</a> from alleged North Korean hackers to steal sensitive data through
    fake Zoom calls.</p><p>Scammers have been targeting crypto founders by offering
    a meeting to discuss a partnership opportunity, but once the call starts, they
    send a message feigning audio issues and a link to a new call that installs malware.&nbsp;</p><p><em><strong>Magazine:
    </strong></em><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/north-korean-hackers-private-keys-flash-loan-attacks/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Lazarus
    Group&rsquo;s favorite exploit revealed &mdash; Crypto hacks analysis</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"crypto_biz\" label=\"Subscription
    Form: Crypto Biz Newsletter\"></template></p>\n</p>\n            "
  published: 2025-03-17 01:54:27 UTC
- title: " Bitcoin landfill man loses appeal, says he has one ‘last legal option’ "
  url: https://cointelegraph.com/news/uk-man-who-lost-bitcoin-landfill-loses-uk-appeal-case?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWEwZjItZWYwMy03YjYxLTg4YWItN2ZhYzkwNTMwOWI5.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NWEwZjItZWYwMy03YjYxLTg4YWItN2ZhYzkwNTMwOWI5.jpg\"
    alt=\"Bitcoin landfill man loses appeal, says he has one ‘last legal option’\"></p><p>A
    UK man&rsquo;s bid to obtain a permit to search a landfill for his hard drive
    &mdash; holding private keys to 8,000 Bitcoin &mdash; has been rejected by the
    UK Court of Appeal.<p>&ldquo;Appeal request to the Royal Court of Appeal: refused,&rdquo;
    Howells <a data-ct-non-breakable=\"null\" href=\"https://x.com/howelzy/status/1900544679701078104\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">said</a> in a March
    14 X post.<br><br>&ldquo;The Great British Injustice System strikes again&hellip;
    The state always protects the state,&rdquo; the early Bitcoin adopter added before
    revealing his &ldquo;next stop&rdquo; would be the <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/bitcoin-fixes-democracy-and-fights-corruption-human-rights-foundation\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">European Convention
    on Human Rights</a> (ECHR).</p><p>UK Royal Court of Appeal Judge Christopher Nugee
    knocked back Howells&rsquo; application, stating that there was no &ldquo;real
    prospect of success&rdquo; and there was &ldquo;no other compelling reason&rdquo;
    as to why it should be heard, according to a March 13 filing shared with Cointelegraph.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a16c-86fc-7704-a2a3-8ebdd6798a9a\"
    title=\"\" alt=\"Bitcoin landfill man loses appeal, says he has one &lsquo;last
    legal option&rsquo;\"><figcaption style=\"text-align: center;\"><p><em>Source:
    </em><a data-ct-non-breakable=\"null\" href=\"https://x.com/howelzy/status/1900544679701078104\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em>James Howells</em></a></p></figcaption></figure><p>Nugee&rsquo;s
    decision follows <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/ujudge-dismisses-770m-bitcoin-landfill-case\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">an earlier dismissal</a>
    on Jan. 9 from High Court Judge Andrew Keyser, who similarly said there was &ldquo;no
    realistic prospect&rdquo; of Howells&rsquo; case succeeding at a full trial.</p><p>In
    a note to Cointelegraph, Howell said his &ldquo;last legal option&rdquo; to exhaust
    is at the ECHR &mdash; where he will claim that the UK High Court and UK Court
    of Appeal breached his right to property and right to a fair trial under Article
    1 of Protocol 1 and Article 6 of the ECHR.</p><blockquote>&ldquo;The British establishment
    want to sweep this under the carpet, and i will not let them. It will not go away
    &mdash; no matter how long it takes!&rdquo;</blockquote><p>The ECHR cannot overrule
    a UK court decision &mdash; however, a verdict in Howells&rsquo; favor would <a
    data-ct-non-breakable=\"null\" href=\"https://www.bihr.org.uk/get-informed/legislation-explainers/the-relationship-between-the-human-rights-act-and-the-european-convention-on-human-rights\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">call</a> on the UK courts
    to consider whether its legislation was interpreted in a way that is compatible
    with the ECHR&rsquo;s provisions.</p><p>In a separate statement shared with Cointelegraph,
    Howells said he would file a claim to the ECHR in the &ldquo;coming weeks.&rdquo;</p><p>The
    court filings follow repeated rejections from the <a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/news/from-landfill-to-lawsuit-james-howells-quest-to-reclaim-lost-bitcoin\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">Newport City Council</a>
    allowing Howells to search through the Docksway landfill &mdash; where Howells&rsquo;
    former partner <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/james-howells-lost-bitcoin-landfill-twist\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">disposed of a bag</a>
    containing the hard drive at the site in 2013.</p><p><em><strong>Related: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/burning-quantum-vulnerable-btc-best-option-jameson-lopp\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Burning
    quantum-vulnerable BTC is the best option &mdash; Jameson Lopp</strong></em></a></p><p>Howells&rsquo;
    8,000 Bitcoin (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>) is worth around
    $660 million at current prices. While few predicted Bitcoin would reach such heights
    back then, Howells&rsquo; incident illustrates the importance of properly securing
    <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/explained/what-is-multichain-self-custody-and-why-does-it-matter\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">self-custodied crypto
    funds.</a></p><p>Howells also appears to be running out of time, as the Docksway
    landfill is reportedly <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/uk-landfill-site-containing-768-million-bitcoin-hard-drive-to-close\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">set to shut down</a>
    sometime during the UK&rsquo;s 2025-2026 financial year, BBC News reported on
    Feb. 9.</p><p><em><strong>Magazine:</strong></em><a data-ct-non-breakable=\"null\"
    href=\"https://cointelegraph.com/magazine/bitcoin-quantum-computer-threat-timeline-solutions-2024-2035/\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong> Bitcoin
    vs. the quantum computer threat: Timeline and solutions (2025&ndash;2035)</strong></em></a></p><template
    data-name=\"subscription_form\" data-type=\"law_decoded\" label=\"Subscription
    Form: Law Decoded\"></template></p>\n</p>\n            "

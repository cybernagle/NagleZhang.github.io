- title: " Panama City mayor teases Bitcoin reserve after meeting El Salvador&#039;s
    Bitcoin leaders "
  url: https://cointelegraph.com/news/panama-city-mayor-teases-bitcoin-reserve-after-meeting-el-salvadors-bitcoin-leaders?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Panama City Mayor Mayer Mizrachi has hinted at establishing a city-level
    Bitcoin reserve in a cryptic post following his meeting with two of El Salvador’s
    Bitcoin policy leaders.“Bitcoin Reserve,” Mizrachi wrote to X on May 16 after
    meeting El Salvador-based Bitcoiners Max Keiser and Stacy Herbert.While Mizrachi
    didn’t share details about his discussions with Keiser and Herbert, the timing
    of the post came 11 days before the Bitcoin 2025 conference in Las Vegas, where
    Mizrachi is scheduled to speak.Source: Mayer MizrachiThe creation of a Bitcoin
    reserve in Panama City would follow a recently approved measure permitting the
    use of crypto for public payments, including taxes, fines and municipal fees.Bitcoin
    (BTC), Ether (ETH), Tether (USDT) and USDC (USDC) will be accepted once the crypto-to-fiat
    payment rails are established, Mizrachi said at the time.To push for a Bitcoin
    reserve at the federal level, Mizrachi would need to collaborate with Panama’s
    National Assembly to craft legislation. There’s no evidence to suggest that he
    has taken such measures.Mizrachi’s post follows the recent enactments of two Bitcoin
    reserve bills in the US states of Arizona and New Hampshire. Ukraine is also reportedly
    inching closer toward adopting Bitcoin as a national reserve asset, local media
    reported earlier in the month.Mizrachi, Keiser and Herbert discussed Bitcoin mining,
    educationA post from Keiser suggests the trio spoke about how Panama and El Salvador
    can leverage renewable energy to bolster their Bitcoin mining operations.“Bitcoin
    is transforming Central America. El Salvador’s geothermal & Panama’s hydro-electric
    will power the Bitcoin revolution.”Herbert also noted that Panama City will integrate
    El Salvador’s “What is Money?” financial literacy textbook into its online library
    system.Related: Basel Medical shares down 15% on $1B Bitcoin buying plansKeiser
    and Herbert have played a crucial role in crafting El Salvador’s Bitcoin policy,
    which includes a Bitcoin reserve consisting of 6,179 Bitcoin (BTC), worth nearly
    $640 million.Keiser serves as President Nayib Bukele’s Bitcoin advisor, while
    Herbert runs the country’s Bitcoin Office.Magazine: Danger signs for Bitcoin as
    retail abandons it to institutions: Sky Wee\n\n            "

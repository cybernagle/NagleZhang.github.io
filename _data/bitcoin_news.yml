- title: " Michael Saylor’s Strategy makes smallest Bitcoin purchase on record "
  url: https://cointelegraph.com/news/michael-saylor-strategy-records-smallest-bitcoin-purchase?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDIvMDE5NTMzMzAtMzYwNy03YzFhLTg1OGUtNGJjNmY0MzIyNWQz.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDIvMDE5NTMzMzAtMzYwNy03YzFhLTg1OGUtNGJjNmY0MzIyNWQz.jpg\"
    alt=\"Michael Saylor’s Strategy makes smallest Bitcoin purchase on record\"></p><p>Michael
    Saylor&rsquo;s Strategy, the world&rsquo;s largest public corporate Bitcoin holder,
    has announced its smallest Bitcoin purchase on record.<p>Strategy on March 17
    officially <a data-ct-non-breakable=\"null\" href=\"https://assets.contentstack.io/v3/assets/bltf8d808d9b8cebd37/blte3ca6b2da8324883/67d794bdcca70a077439f04a/form-8-k_03-17-2025.pdf\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://assets.contentstack.io/v3/assets/bltf8d808d9b8cebd37/blte3ca6b2da8324883/67d794bdcca70a077439f04a/form-8-k_03-17-2025.pdf\">announced</a>
    its latest 130-Bitcoin (<a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/bitcoin-price\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">BTC</a>) acquisition,
    bought for around $10.7 million in cash, or at an average price of roughly $82,981
    per BTC.</p><p>The latest Bitcoin purchase was made using proceeds from the &ldquo;STRK
    ATM,&rdquo; a new Strategy <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/michael-saylor-strategy-raise-21-billion-purchase-bitcoin\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/michael-saylor-strategy-raise-21-billion-purchase-bitcoin\">program
    looking to raise up to $21 billion</a> in fresh capital to acquire more BTC.</p><p>Strategy&rsquo;s
    new 130-BTC buy is the smallest one ever <a data-ct-non-breakable=\"null\" href=\"https://www.strategy.com/purchases\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">recorded</a> since the
    company announced its <a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/worlds-biggest-business-intelligence-firm-buys-21k-btc-for-250m\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/worlds-biggest-business-intelligence-firm-buys-21k-btc-for-250m\">first
    purchase of 21,454 BTC</a> for $250 million in August 2020.</p><h2>Strategy is
    774 BTC away from holding 500,000 BTC</h2><p>With the new purchase, Strategy and
    its subsidiaries now hold 499,226 BTC, acquired at an aggregate purchase price
    of approximately $33.1 billion and an average purchase price of around $66,360
    per BTC, including fees and expenses.</p><p>After purchasing 130 BTC, Strategy
    still needs to acquire 774 BTC to reach a total holding of 500,000 BTC.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a418-a81a-740f-b77d-9844fee48da8\"
    title=\"\" alt=\"Michael Saylor&rsquo;s Strategy makes smallest Bitcoin purchase
    on record\"><figcaption style=\"text-align: center;\"><p><em>Source: </em><a data-ct-non-breakable=\"null\"
    href=\"https://x.com/saylor/status/1901606324447646170\" rel=\"nofollow noopener\"
    target=\"_blank\" text=\"null\" title=\"https://x.com/saylor/status/1901606324447646170\"><em>Michael
    Saylor</em></a></p></figcaption></figure><p>According to the Strategy website,
    the company&rsquo;s Bitcoin yield now stands at 6.9%, significantly lower than
    its 15% target for 2025.&nbsp;</p><h2>Smallest buy on record</h2><p>Despite Bitcoin&rsquo;s
    price falling to multimonth lows below $80,000 last week, Strategy&rsquo;s latest
    buy is significantly smaller than its most recent purchases, making it the smallest
    ever announced BTC purchase by the firm.</p><p><em><strong>Related: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/strategy-shares-down-30-since-saylor-forbes-cover\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/news/strategy-shares-down-30-since-saylor-forbes-cover\"><em><strong>Strategy
    shares down 30% since Saylor&rsquo;s Forbes cover</strong></em></a></p><p>Prior
    to the latest purchase, the smallest BTC purchase by Strategy was a 169-BTC purchase
    in August 2024, <a data-ct-non-breakable=\"null\" href=\"https://www.strategy.com/purchases\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">according</a> to official
    records by Strategy.</p><figure><img src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a418-adec-775a-9d5b-be054418fb36\"
    title=\"\" alt=\"Michael Saylor&rsquo;s Strategy makes smallest Bitcoin purchase
    on record\"><figcaption style=\"text-align: center;\"><p><em>Strategy&rsquo;s
    Bitcoin acquisitions in 2025. Source: Strategy</em></p></figcaption></figure><p>So
    far in 2025, Strategy has acquired 51,656 BTC in seven announced acquisitions.</p><h2>Strategy&rsquo;s
    &ldquo;BTC $ Gain&rdquo; indicator is 74% away from yearly targets</h2><p>After
    spending roughly $4.4 billion on its seven Bitcoin purchases in 2025, Strategy
    recorded a BTC gain value versus the dollar of $2.6 billion year-to-date.</p><p>Strategy&rsquo;s
    &ldquo;BTC $ Gain&rdquo; indicator, which <a data-ct-non-breakable=\"null\" href=\"https://assets.contentstack.io/v3/assets/bltf8d808d9b8cebd37/blt368a52561cca7449/67a3dfb0ecc9d726f4414e72/strategy-announces-fourth-quarter-2024-financial-results-presentation.pdf\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://assets.contentstack.io/v3/assets/bltf8d808d9b8cebd37/blt368a52561cca7449/67a3dfb0ecc9d726f4414e72/strategy-announces-fourth-quarter-2024-financial-results-presentation.pdf\">tracks</a>
    the dollar value of BTC gain calculated based on the market BTC price in a certain
    period, is now 74% away from the company&rsquo;s target of $10 billion in 2025.</p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/0195a482-07a9-7118-8a1f-0efc19d4db32\"
    title=\"\" alt=\"Michael Saylor&rsquo;s Strategy makes smallest Bitcoin purchase
    on record\"><figcaption style=\"text-align: center;\"><p><em>Strategy&rsquo;s
    2025 targets and YTD results as of Feb. 2, 2025. Source: Strategy</em></p></figcaption></figure><p>By
    the end of 2024, Strategy&rsquo;s BTC $ Gain reached $13.8 billion, while the
    Bitcoin yield hit a massive 74%.</p><p><em><strong>Magazine: </strong></em><a
    data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/magazine/crypto-fans-obsessed-longevity-biohacking-why/\"
    rel=\"\" target=\"_self\" text=\"null\" title=\"https://cointelegraph.com/magazine/crypto-fans-obsessed-longevity-biohacking-why/\"><em><strong>Crypto
    fans are obsessed with longevity and biohacking: Here&rsquo;s why</strong></em></a><br></p><template
    data-name=\"subscription_form\" data-type=\"consulting_newsletter\" label=\"Subscription
    Form: Consulting Newsletter\"></template></p>\n</p>\n            "

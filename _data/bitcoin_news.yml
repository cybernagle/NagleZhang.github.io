- title: " Crypto awareness in Singapore hits record 94%, but ownership falls "
  url: https://cointelegraph.com/news/singapore-crypto-awareness-2024-survey?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Crypto awareness in Singapore has reached an all-time high, with 94% of
    respondents in a recent survey indicating familiarity with at least one digital
    asset.However, ownership declined, falling to 29% in 2025 from 40% the previous
    year, according to Independent Reserve’s fifth annual Singapore Crypto Market
    Survey released on May 21.The survey, conducted in February with 1,500 participants,
    revealed that men remain more active in crypto investing than women, 35% compared
    to 24%.Millennials and Gen X (aged 25–54) dominate the investor base, comprising
    71% of all holders. Among those trading at least once a week, 76% fall into this
    age group.Related: Singapore’s Grab taps Solana DePIN project Natix to ‘reshape
    mapping’Half of Singaporean investors plan to increase holdingsDespite the decline
    in ownership, sentiment remains strong. Over half of current holders (53%) plan
    to increase their positions in the next 12 months, and 17% of non-holders expressed
    interest in entering the market.Bitcoin (BTC) continues to be the anchor of the
    crypto market in Singapore. It is held by 68% of crypto investors and viewed by
    86% as either a currency, store of value or investment asset. Notably, 77% say
    Bitcoin will be worth over $100,000 by 2030.Direct ownership remains the preferred
    method of exposure, with 61% choosing to hold their assets directly instead of
    through exchange-traded funds (ETFs).Arbitrage trading is also on the rise, with
    67% of respondents saying they had sold part or all of their holdings to capitalize
    on price swings in the past year.Bitcoin is the most recognized crypto in Singapore,

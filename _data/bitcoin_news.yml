- title: " Babylon total value locked drops 32% as wallets unstake $1.2B in Bitcoin "
  url: https://cointelegraph.com/news/babylon-unstaking-1-billion-tvl-drops-30-percent?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin staking protocol Babylon saw $1.26 billion in BTC unstaked from
    its platform, reducing the protocol’s total value locked by 32%. On April 17,
    blockchain analytics firm Lookonchain flagged several addresses that had unstaked
    a total of 14,929 Bitcoin (BTC) from the staking platform. The security firm flagged
    four addresses that had unstaked 299 BTC, 499 BTC, 1,000 BTC and 13,129 BTC. One
    address held a majority of the unstaked assets worth $1.1 billion. With BTC prices
    hovering at around $84,400, the total unstaked BTC was worth about $1.26 billion.The
    unstaking event saw Babylon’s total value locked (TVL) drop by 32%. According
    to data tracker DefiLlama, Babylon’s TVL declined from $3.97 billion to $2.68
    billion after the unstaking.Source: LookonchainUnstaked Bitcoin may be “staked
    back” to Babylon Community members are speculating on who was behind the unstaking.
    One X user suspected that the Bitcoin may belong to the Chinese government, while
    another said the move may simply be a rotation, risk-off, or a trader getting
    liquid.While it’s unclear who’s behind the four addresses cited by Lookonchain,
    the fund movements could be related to a transition initiated by the decentralized
    finance (DeFi) protocol Lombard Finance. At the time of the unstaking, Babylon
    Labs retweeted an announcement from Lombard, saying it was unstaking Bitcoin as
    part of a transition to a new set of finality providers. Lombard Finance said
    it timed the unstaking with the end of Babylon’s phase 1 cap 1 on April 24 so
    users would not miss out on rewards. The protocol said it would stake the assets
    back. “All of this BTC will be staked back into Babylon as soon as the unbonding
    is complete,” Lombard Finance wrote. Cointelegraph reached out to Babylon Labs
    for comments but did not get a response by publication.Related: Bitcoin L2 ’honeymoon
    phase’ is over, most projects will fail — Muneeb AliBitcoin unstaking follows
    BABY airdropThe massive unstaking event follows a Babylon airdrop for early adopters.
    On April 3, Babylon announced the details of its early adopters airdrop program.
    The airdrop was allocated for its Phase 1 stakers, non-fungible token (NFT) holders
    and developers. The protocol allocated 600 million BABY tokens for the airdrop
    event. Following the airdrop, $21 million in BTC was unstaked from the protocol.
    Bitlayer co-founder Kevin He previously told Cointelegraph that this was a common
    short-term market behavior representing early redemption.  Babylon is one of the
    largest Bitcoin DeFi players in the space, with a TVL reaching over $6 billion
    in December. Babylon co-founder Fisher Yu previously told Cointelegraph that the
    platform allows staking to be a native use case for Bitcoin, eliminating the need
    to trust another party while staking. Magazine: Your AI ‘digital twin’ can take
    meetings and comfort your loved ones\n\n            "

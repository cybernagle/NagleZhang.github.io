- title: " Kraken taps Mastercard to launch crypto debit cards in Europe, UK "
  url: https://cointelegraph.com/news/kraken-mastercard-crypto-card-europe-uk?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Cryptocurrency exchange Kraken has partnered with Mastercard to issue
    crypto debit cards across the United Kingdom and Europe, the company announced
    on April 8.The partnership will enable the crypto exchange to expand its payment
    offerings by launching physical crypto debit cards.The partnership comes as Kraken
    continues to pursue a license under the European Union’s regulatory framework,
    the Markets in Crypto-Assets Regulation (MiCA).The debit card will allow users
    to spend cryptocurrencies and stablecoins directly. Kraken said the rollout will
    begin in the coming weeks, with a waitlist now open to customers.This partnership
    builds on Kraken Pay’s growthKraken said its partnership with Mastercard builds
    on the rapid growth of Kraken Pay, a new tool that enables customers to send money
    from their Kraken account.Launched in January 2025, Kraken Pay allows users to
    send more than 300 crypto assets to multiple countries worldwide. It also introduces
    a paylink feature that enables users to send payments through a simple URL.Since
    launching the service, Kraken has seen more than 200,000 customers out of its
    15 million user base activate Kraktag, a unique user identifier allowing owners
    to receive money without exposing full bank account details.Crypto payments on
    the rise“Crypto is evolving the payments industry, and we see a future where global
    commerce and everyday payments are underpinned by crypto,” Kraken co-CEO David
    Ripley said in a statement shared with Cointelegraph.“Our clients want to be able
    to seamlessly pay for real-world goods and services with their crypto or stablecoins,”
    he said, adding:“Partnering with Mastercard is a major step toward us bringing
    that vision to life. Together, we will unlock crypto’s true everyday utility,
    ensuring it remains undeniably relevant and usable long-term.”Mastercard committed
    to cryptoMastercard’s partnership with Kraken is another milestone for the company
    in cryptocurrency-related efforts.The company has collaborated with diverse crypto
    service providers, such as the self-custodial crypto wallet MetaMask and the European
    crypto payments infrastructure provider Mercuryo.Related: Hodlers on edge: Trump’s
    tariffs shake Bitcoin, but some are buying the dip“Mastercard is committed to
    driving innovation and expanding the possibilities of digital payments,” Mastercard
    executive vice president of global partnerships, Scott Abrahams, said.“Our latest
    partnership with Kraken is a testament to that as we work together to unlock the
    true potential of crypto assets for everyday use,” he added.Magazine: 3 reasons
    Ethereum could turn a corner: Kain Warwick, X Hall of Flame\n\n            "

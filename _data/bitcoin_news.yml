- title: " Crypto investor charged with kidnapping, torturing Italian man for passwords "
  url: https://cointelegraph.com/news/crypto-investor-charged-kidnapping-passwords?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "A Manhattan crypto investor is facing serious charges after allegedly
    kidnapping and torturing an Italian man in a disturbing bid to extract access
    to digital assets.John Woeltz was arraigned on Saturday in Manhattan criminal
    court following his arrest on Friday. He stands accused of holding a 28-year-old
    Italian man captive for weeks inside a luxury townhouse in Soho, reportedly rented
    for $30,000 per month.According to police reports cited by The New York Times,
    the victim arrived in the US on May 6 and was allegedly abducted by Woeltz and
    an accomplice.The attackers are said to have stolen the man’s passport and electronic
    devices before demanding the password to his Bitcoin (BTC) wallet. When he refused,
    the suspects allegedly subjected him to prolonged physical abuse.Source: Mario
    NawfalRelated: Violent crypto robberies on the rise: Six attacks that targeted
    investorsCrypto victim beaten, electroshockedThe victim described being beaten,
    shocked with electricity, assaulted with a firearm and even dangled from the upper
    floors of the five-story building.He also told police that Woeltz used a saw to
    cut his leg and forced him to smoke crack cocaine. Threats were also reportedly
    made against his family.Photographic evidence found inside the property, including
    Polaroids, appears to support claims of sustained abuse. The victim managed to
    escape on Friday and alert authorities, leading to Woeltz’s arrest.Woeltz was
    charged with four felony counts, including kidnapping for ransom, and entered
    a plea of not guilty. Judge Eric Schumacher ordered him to be held without bail.
    He is expected back in court on May 28.A 24-year-old woman was also taken into
    custody on Friday in connection with the incident. However, she was seen walking
    freely in New York the next day, and no charges against her were found in the
    court’s online database.Authorities have yet to clarify the relationship between
    the suspect and the victim or whether any cryptocurrency was ultimately stolen.Related:
    Crypto crime goes industrial as gangs launch coins, launder billions — UNCrypto
    executives turn to bodyguardsExecutives and investors in the crypto industry are
    increasingly seeking personal security services as kidnapping and ransom cases
    surge, especially in France.On May 18, Amsterdam-based private firm Infinite Risks
    International reported a rise in requests for bodyguards and long-term protection
    contracts from high-profile figures in the space.French authorities have responded
    by introducing enhanced protections for crypto entrepreneurs and their families,
    including security briefings and priority access to police assistance.This comes
    amid a recent surge in kidnappings and ransom attempts. David Balland, the co-founder
    of hardware wallet company Ledger, was kidnapped in January 2025 and held for
    ransom for several days before being rescued by French police.In May 2024, the
    father of an unnamed crypto entrepreneur was freed from a ransom attempt after
    French law enforcement officials raided the location in a Paris suburb where the
    individual was being held hostage by organized criminals.Magazine: Bitcoiner sex
    trap extortion? BTS firm’s blockchain disaster: Asia Express\n\n            "

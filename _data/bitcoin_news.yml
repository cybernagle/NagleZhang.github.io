- title: " OKX fires back at Tron’s Justin Sun over mysterious  ‘freeze notice’ "
  url: https://cointelegraph.com/news/crypto-exchange-okx-star-xu-tron-justin-sun-freeze-notice?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "OKX founder and CEO Star Xu has publicly defended the crypto exchange
    after Tron founder Justin Sun accused it of failing to act on a law enforcement
    request to freeze stolen funds following a recent hack of Tron’s official X account.“OKX
    also has consumers protection policy according to law, we can’t freeze a customer’s
    funds according to your personal X post or an oral communication. I think you
    should understand it as the CEO of HTX,” Xu said in an X post.OKX says there is
    no communication in the spam box, eitherXu said that the crypto exchange had not
    received any related correspondence through OKX’s official channels. “Our LE cooperation
    team just checked the email, including the spam box; we haven’t received any request
    related with this case,”  Xu said.Source: Star XuIn what is now an unavailable
    X post, but was screenshotted by Xu, Sun had earlier claimed that OKX has not
    responded to a “freeze notice” sent to its official email address from a “relevant
    law enforcement agency.” Sun said that he had no other way to contact OKX’s compliance
    department.“These stolen funds do not belong to me; I’m acting to protect the
    community,” Sun said. On May 3, Tron DAO told its 1.7 million X followers that
    its account had been compromised. Tron explained that during the breach, an unauthorized
    party posted a malicious crypto token contract address, sent direct messages,
    and followed unfamiliar accounts.“If you received a DM from our account on May
    2, please delete it and consider it the work of the attacker.”In response to Sun’s
    claims of inaction, Xu publicly called on him to provide a screenshot showing
    when and where the law enforcement request was sent.The Tron incident is one of
    several recent security breaches involving high-profile crypto accounts on X.Related:
    Over 14,500 Tron addresses at risk of silent hijackingKaito AI, an artificial
    intelligence-powered platform that aggregates crypto data to provide market analysis
    for users, and its founder, Yu Hu, were the victims of an X social media hack
    on March 15. The hackers opened up a short position on KAITO tokens before posting
    that the Kaito wallets were compromised and advised users that their funds were
    not safe.Just a few weeks before, on Feb. 26, the Pump.fun X account was compromised
    to promote a fake governance token called “PUMP” and other fraudulent coins.Meanwhile,
    the X account of UK member of Parliament and Leader of the House of Commons, Lucy
    Powell, was hacked on April 15 to promote a scam crypto token.Magazine: Crypto
    wanted to overthrow banks, now it’s becoming them in stablecoin fight\n\n            "

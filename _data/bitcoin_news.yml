- title: " Why is the crypto market down today? "
  url: https://cointelegraph.com/news/why-is-the-crypto-market-down-today?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "The cryptocurrency market is down on March 27, with the total market capitalization
    dropping by 0.91% to about $2.77 trillion. At its week-to-date high, the market
    cap was at around $2.86 trillion.TOTAL crypto market capitalization daily performance
    chart. Source: TradingVewSeveral factors have contributed to the latest drop in
    crypto prices, including:The latest trade war escalation and its impact on broader
    risk sentiment.Liquidations of overleveraged futures positions.A prevailing bearish
    technical setup.Trump tariffs return to hurt crypto sentimentRising global trade
    tensions are at the heart of the current cryptocurrency market decline.What to
    know:On March 25, the US government announced that it would impose 25% tariffs
    on auto imports and other goods from Canada, Mexico, and China beginning April
    3.These protectionist measures have reignited concerns of a global economic slowdown,
    weighing on market sentiment across asset classes.The S&P 500, for instance, has
    declined by nearly 1.85% since the announcement.S&P 500 daily performance chart.
    Source: TradingViewFears of renewed inflation are intensifying, as the tariffs
    are expected to raise consumer prices on key goods, according to St. Louis Fed
    President Alberto Musalem.Higher rates are leading to lowering rate cut bets in
    the futures market, with odds of a 25 basis point rate decrease now down to 58%
    compared to 62.50% a week ago.Target rate potential for June 18, 2025 Fed meeting.
    Source: CMEAs a result, top cryptocurrencies like Bitcoin (BTC) and Ether (ETH),
    which typically trade in tandem with risk markets, are seeing heightened selling
    pressure.Long liquidations overpower shortsAlmost all top cryptocurrencies have
    suffered larger long liquidations versus shorts in their respective markets, thus
    amplifying the sell-off.Key points:Bitcoin, which makes up over 61% of the total
    crypto market cap, has witnessed $62.45 million in net liquidations in the last
    24 hours, out of which $48.94 million were long positions.Crypto market liquidation
    heat map (24-hour). Source: CoinglassSimilarly, Ether, the second-largest cryptocurrency
    by market cap, suffered over $43 million in long liquidations of a total of $51.76
    million in the same period.Overall, the total crypto market liquidations come
    in at $257.35 million in the last 24 hours, of which $198.11 million are longs.Why

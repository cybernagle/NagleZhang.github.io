- title: " Bitcoin breakout odds climb as all-time highs meet $90K dip warning "
  url: https://cointelegraph.com/news/bitcoin-breakout-odds-climb-all-time-highs-90k-dip-warning?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Key points:Bitcoin refuses to budge from a narrow range as traders consider
    the likely breakout direction.Price discovery is keenly awaited, but downside
    predictions include levels further toward $90,000.BTC/USD has delivered highly
    patterned moves since its rebound began in April.Bitcoin (BTC) kept traders guessing
    at the May 16 Wall Street open as consolidation sparked both bullish and bearish
    forecasts.BTC/USD 1-hour chart. Source: Cointelegraph/TradingView“Significant”
    liquidity builds around BTC priceData from Cointelegraph Markets Pro and TradingView
    showed BTC/USD shuttling between $103,000 and $104,000 on the day.Despite beating
    expectations, the latest US macroeconomic data in the form of the Consumer Price
    Index (CPI) and Producer Price Index (PPI) prints on May 13 and 15, respectively,
    failed to exert a strong influence on short-term price behavior.Instead, traders
    focused on Bitcoin’s latest consolidation phase less than 10% away from new all-time
    highs.“$BTC Has been doing roughly the same thing since the April lows. Move up,
    tight consolidation, new leg up,” popular trader Daan Crypto Trades wrote in part
    of ongoing X analysis. “Keep an eye on this local range and wait for a breakout
    to either direction would be my recommendation.”BTC/USD 6-hour chart. Source:
    Daan Crypto Trades/XA separate post noted areas of thick liquidity on either side
    of the price, potentially providing near-term targets should BTC/USD exit its
    narrow range.$BTC Liquidation Map showing a large cluster at $105K-$106K and a
    ton sitting between $99K-$103K.This makes sense as these are the highs/lows of
    the current tiny range we're consolidating in for the past week or so.Lately,
    we've seen a lot of similar consolidations and we… pic.twitter.com/y387V1WzsC—
    Daan Crypto Trades (@DaanCrypto) May 16, 2025“Notice the massive concentration
    of long liquidations clustered tightly just below the current price, particularly
    around 10280-10300? This represents a significant pool of liquidity,” fellow trading
    TheKingfisher continued. “Shorts are more spread out higher up. This imbalance
    makes the zone below a key area to watch. It could act as a price magnet, or a
    trigger point for cascading liquidations if price moves down.”Bitcoin exchange
    order book liquidity data. Source: TheKingfisher/XAnother popular trader, Crypto
    Caesar, suggested that a range breakout could run deeper and take Bitcoin further
    below the $100,000 mark.“If price breaks and holds above this zone, we could see
    new crazy highs,” he told X followers, referencing a bullish crossover on the
    weekly moving average convergence/divergence (MACD) indicator. “However: a rejection
    right here might lead to a pullback toward $90K.”BTC/USDT 1-week chart with MACD
    data. Source: Crypto Caesar/XA rinse-and-repeat Bitcoin breakout?Like Daan Crypto
    Trades, analyst Kevin Svenson was keen to see a continuation of the stop-start
    rebound in place since April.Related: Bitcoin hitting $220K ‘reasonable’ in 2025,
    says gold-based forecastAnalyzing 4-hour timeframes on the day, he delivered his
    next upside BTC/USD target well inside price discovery.“So far, the measured move
    extrapolations of each leg up in this run have been pinpoint accurate,” he wrote.“If
    this trend continues, if this pattern holds, the next target is $115,000.”BTC/USDT
    4-hour chart. Source: Kevin Svenson/XEarlier, Cointelegraph reported on a variety
    of BTC price predictions now in force, with commentators overwhelmingly favoring
    upside next.Zooming out, $1 million per coin may become reality in three years’
    time or even sooner, according to former BitMEX CEO Arthur Hayes.This article
    does not contain investment advice or recommendations. Every investment and trading
    move involves risk, and readers should conduct their own research when making
    a decision.\n\n            "

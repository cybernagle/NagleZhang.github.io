    breakout patterns point to $100K as a short-squeeze and euphoria magnet.Bitcoin
    (BTC) is flashing multiple technical and onchain signals suggesting that a rally
    to $100,000 is possible by May. Here are five charts making the case for a near-term
    breakout.BTC double bottom hints at $100,600 targetBTC’s daily chart has formed
    a textbook double bottom, confirming a breakout above the neckline resistance
    at $87,643. The structure projects a measured move to $100,575 or above.BTC/USD
    daily price chart. Source: TradingViewMomentum indicators like the relative strength
    index (RSI) support this thesis, staying in bullish territory with more room to
    expand. Meanwhile, the 50- and 200-day exponential moving averages (EMAs) have
    flipped into support, offering additional tailwinds.Volume has remained steady
    post-breakout, showing that buyers are still in control. This setup creates a
    strong foundation for Bitcoin to push toward $100,600.Bull pennant setup eyes
    six-figure BTC priceOn the hourly timeframe, BTC consolidates inside a bull pennant
    following a sharp rally. This pattern indicates temporary indecision before the
    next leg higher. The target sits near $100,900.BTC/USD hourly price chart. Source:
    TradingViewThe pennant formed after a steep rise, suggesting that BTC price is
    likely coiling before resuming its up move. Despite the low volume, the structure
    remains intact and is supported by strong EMA alignment.A breakout above the pennant’s
    upper trendline could trigger fresh upside momentum, attracting short-term traders
    and algorithms targeting round-number breakouts.Bitcoin’s falling wedge breakout
    targets $102,000The three-day chart shows a completed falling wedge breakout,
    with the price breaking a key resistance zone near $94,000. The projected move
    targets $102,270.BTC/USD three-day price chart. Source: TradingViewFalling wedges
    are typically bullish reversal patterns, and BTC’s clean breakout above the upper
    trendline adds technical conviction. Price is also riding above the 50-3D EMA,
    a key trend signal.Volume surged during the breakout, suggesting strong buyer

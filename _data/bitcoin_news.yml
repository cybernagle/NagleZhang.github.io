  summary: "BItcoin (BTC) retains a $138,000 price target for 2025 as the market recovers
    from US trade tariffs, new analysis concludes.Data covering bets on prediction
    service Polymarket suggests that BTC/USD could still gain around 60% from current
    levels this year.“Conservative” Polymarket users cap BTC price upside at 60%Bitcoin
    bull market projections have taken a beating this quarter thanks to multiple setbacks
    impacting crypto and the wider risk-asset spectrum.Now, an assessment of all potential
    BTC price outcomes on Polymarket concludes that the bull market cycle may be capped
    at around 60% before 2026.The results were uploaded to X by user Ashwin on March
    27 and show that price bets extend all the way down to $59,000.“The great thing
    about this analysis is that it not only provides a market sentiment score, like
    the Fear and Greed Index, but also attaches to it the expected price target for
    both bearish and bullish scenarios,” he explained. “This offers a reference to
    compare one's price prediction with the market's.”BTC price targets on Polymarket.
    Source: Ashwin/XAshwin deconstructed the methodology used to analyze odds across
    multiple Polymarket arenas, resulting in a potential BTC price range between $59,040
    and $138,617.“The $138k Bitcoin price target may not seem bullish to most Bitcoiners,

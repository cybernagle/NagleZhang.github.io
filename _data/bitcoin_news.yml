    to $150,000 range by August or September 2025 if it manages to regain its broken
    parabolic slope. However, Brandt cautioned that the rally could be followed by
    a sharp correction of more than 50%.Crypto market data daily view. Source: Coin360As
    Bitcoin nears the 100,000 mark, onchain analytics firm Glassnode cautions that
    the long-term holders (LTHs) may be tempted to book profits. The firm said in
    its newsletter that the LTHs tend to book profits when their profit margin reaches
    350%, and that level will be hit at $99,900. A significant amount of buy-side
    pressure is needed to overcome the selling to continue the up move.Could Bitcoin
    break above $100,000, pulling select altcoins higher? Let’s analyze the charts
    of the top 10 cryptocurrencies to find out.Bitcoin price predictionBitcoin’s break
    above $95,000 signals an advantage to buyers, but the bears are unlikely to give
    up easily.BTC/USDT daily chart. Source: Cointelegraph/TradingViewSellers will
    try to pull the price back below $95,000, trapping the aggressive bulls. If they
    can pull it off, the BTC/USDT pair could test the 20-day exponential moving average
    ($91,391). This is a necessary support to watch out for as a solid bounce off
    the 20-day EMA suggests the bullish sentiment remains intact. That increases the
    likelihood of a break above $100,000. The pair may then reach $107,000.This optimistic
    view will be invalidated in the short term if the price turns down and breaks
    below the 20-day EMA. The pair may then tumble to the 50-day simple moving average
    ($86,236).Ether price predictionBuyers successfully defended Ether’s (ETH) drop
    to the 20-day EMA ($1,757) on April 30, signaling demand at lower levels.ETH/USDT
    daily chart. Source: Cointelegraph/TradingViewThe gradually upsloping 20-day EMA
    and the RSI in the positive territory indicate a slight edge to the bulls. If

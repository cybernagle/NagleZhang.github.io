  url: https://cointelegraph.com/news/bitcoin-price-chart-looks-set-for-100-k-sui-avax-trump-and-tao-expected-to-follow?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Key points:Bitcoin booked a 10% gain in the past week and technical indicators
    remain bullish going into a new week.Analysts expect Bitcoin to gain an additional
    40% by the end of the yearSelect altcoins are showing a positive bias on improving
    crypto sentiment.Bitcoin (BTC) rose more than 10% this week as buyers made a strong
    comeback, pushing the price to the overhead resistance at $95,000. Although buyers
    are struggling to clear the overhead hurdle, a positive sign is that they have
    not given up much ground to the bears.The sharp up move is backed by solid buying
    in the US spot Bitcoin exchange-traded funds (ETFs), which witnessed inflows of
    $3.06 billion, according to Farside Investors data. Bloomberg ETF analyst Eric
    Balchunas said in a post on X that it was really notable to see “HOW FAST the
    flows can go from 1st gear to 5th gear.”Crypto market data daily view. Source:
    Coin360After Bitcoin’s recovery, 21st Capital co-founder Sina said in a post on
    X that Bitcoin reclaimed the power-law price. Sina’s Bitcoin Quantile Model projects
    Bitcoin to reach between $130,000 and $163,000 before the end of 2025. Anonymous
    Bitcoin analyst apsk32 had an even bigger target of more than $200,000 for Bitcoin
    in Q4 of this year.Could Bitcoin maintain its momentum and rise above the overhead
    resistance? Let’s study the charts of the cryptocurrencies that look strong in
    the near term.Bitcoin price predictionBitcoin has been witnessing a tough battle
    between the bulls and the bears near the crucial $95,000 level.BTC/USDT daily
    chart. Source: Cointelegraph/TradingViewThe upsloping 20-day exponential moving
    average ($88,619) and the relative strength index (RSI) near the overbought zone
    indicate that bulls are in command. A close above $95,000 could propel the BTC/USDT
    pair to $100,000 and eventually to $107,000. Sellers are expected to aggressively
    defend the zone between $107,000 and $109,588.The 20-day EMA is the critical near-term
    support to watch out for because a break below it brings the large $95,000 to
    $73,777 range into play.BTC/USDT 4-hour chart. Source: Cointelegraph/TradingViewThe
    4-hour chart shows the bears are fiercely defending the $95,000 level but are
    struggling to sink the pair below the 20-EMA. If the price rebounds off the 20-EMA,
    it enhances the prospects of a break above $95,000. The pair could then surge
    to $100,000.Instead, if the price maintains below the 20-EMA, the pair could tumble
    to the 50-simple moving average. This is an important level for the bulls to defend
    because a break below it could pull the pair to $86,000.Sui price predictionSui
    (SUI) has been facing resistance near $3.90, but the shallow pullback suggests
    that the bulls are in no hurry to dump their positions.SUI/USDT daily chart. Source:
    Cointelegraph/TradingViewIf the price stays above the 38.2% Fibonacci retracement
    level of $3.14, the bulls will make another attempt to shove the SUI/USDT pair
    above $3.90. If they can pull it off, the pair may skyrocket to $4.25 and then
    to $5.Contrary to this assumption, if the price turns down and breaks below $3.14,
    it signals the start of a deeper correction toward the 50% retracement level of
    $2.94. Buyers are expected to fiercely defend the zone between $2.94 and the 20-day
    EMA ($2.69).SUI/USDT 4-hour chart. Source: Cointelegraph/TradingViewThe 4-hour
    chart shows that the pair is finding support at the 20-EMA, but the sellers are
    active at higher levels. The bears will again attempt to sink the pair below the
    20-EMA. If they succeed, the pair could slump to $3.14.Buyers will have to swiftly
    push the price above the $3.81 to $3.90 overhead resistance zone if they want
    to retain the advantage. If they do that, the pair could start the next leg of
    the up move to $4.25.Avalanche price predictionAvalanche (AVAX) has been range-bound
    between $23.50 and $15.27 for the past few days. In a range, traders usually buy
    near the support and sell close to the resistance.AVAX/USDT daily chart. Source:
    Cointelegraph/TradingViewAlthough buyers have failed to push the price above $23.50,
    a positive sign is that they have not ceded much ground to the bears. That increases
    the likelihood of a break above $23.50. If that happens, the AVAX/USDT pair will
    complete a double-bottom pattern, which has a target objective of $31.73.This
    optimistic view will be negated in the near term if the price turns down and breaks
    below the moving averages. The pair may then remain stuck inside the range for
    a few more days.AVAX/USDT 4-hour chart. Source: Cointelegraph/TradingViewThe pair
    has been consolidating in a narrow range between $21.60 and $23.10 for some time.
    That suggests the bulls are holding on to their positions as they anticipate another
    leg higher. If buyers propel the price above $23.10, the pair could surge to $25.
    There is resistance at $23.50, but it is likely to be crossed.Alternatively, a
    drop below $21.60 signals that the bulls have given up. That may pull the price
    down to $19.50.Related: Bitcoin trades at ‘40% discount’ as spot BTC ETF buying
    soars to $3B in one weekOfficial Trump price predictionOfficial Trump (TRUMP)
    surged above the $12.45 resistance on April 23 and held the retest of the breakout
    level on April 24.TRUMP/USDT daily chart. Source: Cointelegraph/TradingViewA rally

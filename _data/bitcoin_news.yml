- title: " $1B Bitcoin exits Coinbase in a day as analysts warn of supply shock "
  url: https://cointelegraph.com/news/coinbase-largest-btc-outflow-1-b-institutional-demand?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Institutional demand for Bitcoin is growing, as Coinbase, the world’s
    third-largest cryptocurrency exchange, recorded its highest daily outflows of
    Bitcoin in 2025 on May 9.On May 9, Coinbase saw 9,739 Bitcoin (BTC), worth more
    than $1 billion, withdrawn from the exchange — the highest net outflow recorded
    in 2025, according to Bitwise head of European research André Dragosch.“Institutional
    appetite for bitcoin is accelerating,” Dragosch added in a May 13 X post.Source:
    André DragoschRelated: Nasdaq-listed GDC plans to buy Bitcoin and TRUMP memecoin
    for $300MThe outflow occurred as Bitcoin traded above $103,600 and just days after
    the White House announced a 90-day reduction in reciprocal tariffs between the
    US and China, easing market concerns and lifting broader investor sentiment.Joint
    statement on US-China meeting in Geneva. Source: The White HouseThe 90-day suspension
    of additional tariffs removes the risk of “sudden re-escalation,” which may help
    Bitcoin, altcoins and the wider stock market rally due to improved risk appetite,
    Nansen’s principal research analyst, Aurelie Barthere, told Cointelegraph.Related:
    Bitcoin ETFs, gov’t adoption to drive BTC to $1M by 2029: Finance RedefinedCorporate
    Bitcoin investment may lead to supply shockGrowing demand from institutional investors
    and corporations may lead to a diminishing Bitcoin supply on exchanges, signaling
    a potential price rally driven by a “supply shock,” which occurs when buyer demand
    meets decreasing available BTC, leading to price appreciation.While Bitcoin may
    experience short-term corrections, Dragosch remains “very bullish” for the rest
    of 2025, he told Cointelegraph during the Chain Reaction daily X show on May 12.“In
    2025 alone, corporations have bought four times more Bitcoin than all US spot
    Bitcoin ETFs combined, which is crazy,” he said. “We’re close to 200,000 Bitcoin
    already, which is the annual supply of new Bitcoin.”Despite the bullish backdrop,
    Dragosch noted that the crypto market may still see short-term corrections due
    to what he described as overheated investor sentiment.  Bitcoin illiquid supply.
    Source: GlassnodeMeanwhile, Bitcoin’s “illiquid supply” reached a record 14 million
    BTC, according to Glassnode data, signaling that large investors continue accumulating,
    Cointelegraph reported on May 13.Magazine: Altcoin season to hit in Q2? Mantra’s
    plan to win trust: Hodler’s Digest, April 13 – 19\n\n            "

- title: " Growth in Bitcoin and stablecoin adoption could accelerate dedollarization "
  url: https://cointelegraph.com/news/growth-in-bitcoin-and-stablecoin-adoption-could-accelerate-dedollarization?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "\n                <p style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img
    src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTcyMDctZWEwMi03NzM1LTljZjMtODYzZDZlOWJjOWVl.jpg\"></p><p><p
    style=\"float:right; margin:0 0 10px 15px; width:240px;\"><img src=\"https://images.cointelegraph.com/images/840_aHR0cHM6Ly9zMy5jb2ludGVsZWdyYXBoLmNvbS91cGxvYWRzLzIwMjUtMDMvMDE5NTcyMDctZWEwMi03NzM1LTljZjMtODYzZDZlOWJjOWVl.jpg\"
    alt=\"Growth in Bitcoin and stablecoin adoption could accelerate dedollarization\"></p><p>The
    US dollar has long reigned as the world&rsquo;s primary reserve currency and the
    default choice for global trade and international transactions. But its dominance
    is now facing growing scrutiny as shifting geopolitical and economic forces&mdash;and
    concerns over the potential weaponization of the greenback&mdash;push more countries
    to accelerate efforts to loosen their dependence on the dollar.<p>By almost every
    measure, the US dollar&rsquo;s command of the global economy is staggering. Although
    the country accounts for roughly 25% of global GDP, its currency reigns over nearly&nbsp;
    60% of global foreign exchange reserves&mdash;far outpacing its nearest rival,
    the euro.&nbsp;</p><p>But this dominance is increasingly under pressure, with
    the strategic use of economic sanctions in the past leading some countries to
    seek alternatives, even as US President Donald Trump regularly threatens 100%
    tariffs on countries that actively seek to substitute the greenback.&nbsp;</p><p>In
    Russia, whose access to the SWIFT payment platform is crippled by sanctions, companies
    have been using cryptocurrencies as a means to skirt restrictions, turning to
    Bitcoin and other digital assets to conduct cross-border business. While crypto
    was barred as illegal by the country&acute;s central bank years ago, recent changes
    to the regulation have paved the way for corporations to embrace cryptocurrencies
    since late last year.</p><p>The country <a data-ct-non-breakable=\"null\" href=\"https://www.reuters.com/markets/currencies/russia-is-using-bitcoin-foreign-trade-finance-minister-says-2024-12-25/\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://www.reuters.com/markets/currencies/russia-is-using-bitcoin-foreign-trade-finance-minister-says-2024-12-25/\">permitted</a>
    the use of cryptocurrencies in foreign trade and has taken steps to make it legal
    to mine cryptocurrencies, including Bitcoin. </p><h2><strong>Bitcoin, sanctions
    and the push for dedollarization</strong></h2><p>Since Bitcoin&rsquo;s inception,
    crypto advocates have been fixated on &ldquo;dedollarization,&rdquo; often described
    as the push to reduce the US dollar&rsquo;s dominance as the global reserve currency.
    The term broadly refers to moving away from the dollar in key financial and trade
    activities, including oil and commodity transactions (the petrodollar system),
    foreign exchange reserves, bilateral trade agreements, and investments in dollar-denominated
    assets.</p><p>A 2024 paper by Morgan Stanley&rsquo;s head of Digital Asset Markets,
    Andrew Peel, suggested that the rise of digital currencies presents &ldquo;opportunities
    to both erode and reinforce&rdquo; the US dollar&rsquo;s dominance, with the potential
    to significantly alter the global currency landscape.</p><p>Still, while digital
    assets&mdash;most notably stablecoins&mdash; are increasingly gaining traction,
    the crypto market&rsquo;s dedollarization expectations look premature.</p><p>While
    Bitcoin is increasingly seen as a strategic reserve asset, experts caution that
    it&rsquo;s still too soon to call it a true alternative to the US dollar. Countries
    like El Salvador have embraced Bitcoin aggressively, with the asset now making
    up about 15% to 20% of the nation&rsquo;s total reserves. The US has reportedly
    considered similar moves, but widespread adoption remains limited, and questions
    persist about whether such steps would undermine the dollar rather than support
    it.</p><p>According to Bitcoin Depot CEO Brandon Mintz, </p><blockquote>&ldquo;For
    Bitcoin to become a true alternative to the USD, it would require broader mainstream
    adoption, clearer regulatory frameworks, and more scalable infrastructure.&rdquo;
    </blockquote><p>Currently, Bitcoin acts more like a hedge and a store of value
    than a dollar replacement, but its role could shift as global financial dynamics
    evolve. Factors like inflation and geopolitical tensions, Mintz said, could drive
    more interest. </p><p>While institutional adoption and cross-border use are on
    the rise, Mintz said that it remains to be seen &ldquo;whether Bitcoin can genuinely
    challenge the dominance of the dollar as this will depend on how these trends
    develop over time.&rdquo;</p><p><a data-ct-non-breakable=\"null\" href=\"https://cointelegraph.com/news/why-bitcoin-sells-off-trump-tariffs\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"><em><strong>Related:
    3 reasons why Bitcoin sells off on Trump tariff news</strong></em></a></p><p>Despite
    its growing appeal, Bitcoin&rsquo;s volatility remains a significant challenge.
    According to the <a data-ct-non-breakable=\"null\" href=\"https://www.gold.org/goldhub/gold-focus/2024/08/why-bitcoin-isnt-new-gold\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">World Gold Council</a>,
    Bitcoin exhibits considerably higher volatility than gold and shows a greater
    correlation with Nasdaq tech stocks than with traditional safe-haven assets.</p><p><br><br></p><figure><img
    src=\"https://s3.cointelegraph.com/uploads/2025-03/01957207-99fa-77cc-be75-34eea44e127b\"
    title=\"\" alt=\"Growth in Bitcoin and stablecoin adoption could accelerate dedollarization\"><figcaption
    style=\"text-align: center;\"><p><em>Gold and major asset 5-year average daily
    volatility - annualized. Source: World Gold Council.</em></p></figcaption></figure><p>Eswar
    Prasad, a trade professor at Cornell University, told Cointelegraph,</p><blockquote>&ldquo;Decentralized
    cryptocurrencies such as Bitcoin still have highly volatile values, rendering
    them unsuitable as mediums of exchange or as reserve currencies.&rdquo;</blockquote><h2><strong>US
    dollar global foreign reserves decline</strong></h2><p>Since the end of World
    War II, the US dollar has reigned as the world&rsquo;s dominant currency, powering
    around 88% of global trade transactions in 2024.</p><p>The dollar&rsquo;s status
    as the leading international currency is well-established. According to the<a
    data-ct-non-breakable=\"null\" href=\"https://data.imf.org/?sk=e6a5f467-c14b-4aa8-9f6d-5a09ec4e62a4\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\"> International Monetary
    Fund</a>, as of the third quarter of 2024, central banks held about 58 percent
    of their allocated reserves in US dollars&mdash;much of it in cash and US bonds.
    This is significantly higher than the euro, second in the race, which accounts
    for as much as 20%&nbsp;</p><img alt=\"Growth in Bitcoin and stablecoin adoption
    could accelerate dedollarization\" img_link=\"\" img_link_new_tab=\"\" img_link_nofollow=\"\"
    img_link_title=\"\" name=\"\" src=\"data:image/png;base64,\"
    title=\"\"><p><em>Allocated foreign exchange reserves by central banks. Source:
    International Monetary Fund&nbsp;&nbsp;</em></p><p>While the US dollar remains
    the dominant global currency due to its stability, widespread acceptance in international
    trade and finance, and status as a key reserve asset for central banks, there
    are signs that its reign may be waning. The <a data-ct-non-breakable=\"null\"
    href=\"https://www.imf.org/en/Blogs/Articles/2024/06/11/dollar-dominance-in-the-international-reserve-system-an-update\"
    rel=\"null\" target=\"null\" text=\"null\" title=\"null\">percentage of global
    foreign reserves</a> held in dollars has diminished from over 70% in the early
    2000s to below 60%.</p><figure><img alt=\"Cryptocurrencies, Federal Reserve, Russia,
    Ukraine, Dollar, Banks, Bitcoin Price, Hyperinflation, Markets, United States,
    Stablecoin, Sanctions, Market Analysis, Digital Dollar\" src=\"https://s3.cointelegraph.com/uploads/2025-03/019592df-859f-72c0-adfd-90cb12451687\"
    title=\"\"><figcaption style=\"text-align: center;\"><p><em>Percentage of global
    FX reserves held in US dollars. Source: International Monetary Fund</em></p></figcaption></figure><p>The
    turning point came after February 2022 when the US froze $300 billion of Russia&rsquo;s
    liquid foreign exchange reserves held in the US and NATO countries. While many
    US allies backed the move, it also sent shockwaves through global markets, highlighting
    the risk that Washington could weaponize the dollar against not just adversaries
    but potentially allies whose policies clash with American interests.</p><p>Citing
    the use of sanctions and how sanctioned countries react, an International Monetary
    Fund <a data-ct-non-breakable=\"null\" href=\"https://www.imf.org/en/Blogs/Articles/2024/06/11/dollar-dominance-in-the-international-reserve-system-an-update\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://www.imf.org/en/Blogs/Articles/2024/06/11/dollar-dominance-in-the-international-reserve-system-an-update\">blog
    post</a> in 2024 said, </p><blockquote>&ldquo;We have found that financial sanctions
    when imposed in the past, induced central banks to shift their reserve portfolios
    modestly away from currencies, which are at risk of being frozen and redeployed,
    in favor of gold, which can be warehoused in the country and thus is free of sanctions
    risk.&rdquo; </blockquote><h2><strong>Do stablecoins actually reinforce dollarization?</strong></h2><p>Despite
    efforts by BRICS+ nations to counteract US dollar dominance, the dollar&rsquo;s
    value has remained strong in recent years. The US Dollar Index is up roughly 8%
    over the past five years.</p><p>In the crypto sector, stablecoins have emerged
    as some of the fastest-growing digital assets, often cited as a potential solution
    for cross-border transactions. However, most stablecoins are still pegged to the
    US dollar.</p><p>Currently, the stablecoin market cap stands at $233 billion,
    with US-pegged stablecoins such as Tether&rsquo;s USDT dominating 97% of the sector,
    according to CoinGecko data.</p><p>This overwhelming reliance on USD-backed stablecoins
    suggests that rather than undermining dollar dominance, digital assets may actually
    reinforce it. &ldquo;With USD-linked stablecoins at the core of this digital ecosystem,
    we have a unique chance to extend US financial influence globally&mdash;if policymakers
    act now,&rdquo; Cody Carbone, president of Digital Chamber, a US-based blockchain
    advocacy association, <a data-ct-non-breakable=\"null\" href=\"https://x.com/CodyCarboneDC/status/1856332568418717911\"
    rel=\"nofollow noopener\" target=\"_blank\" text=\"null\" title=\"https://x.com/CodyCarboneDC/status/1856332568418717911\">said</a>
    on X.</p><p>The emergence and widespread adoption of central bank digital currencies
    (CBDCs) could disrupt some cryptocurrencies, particularly stablecoins, by providing
    efficient and low-cost digital payment alternatives.</p><p>&ldquo;A widely accessible
    digital dollar would undercut the case for privately issued stablecoins, though
    stablecoins issued by major corporations could still have traction,&rdquo; said
    Prasad.</p><p>Still, Prasad emphasized that no viable alternative is poised to
    displace the US dollar as the dominant global reserve currency.&nbsp;</p><blockquote>&ldquo;The
    dollar&rsquo;s strengths lie not just in the depth and liquidity of US financial
    markets but also in the institutional framework that underpins its status as a
    safe haven.&rdquo;</blockquote><p class=\"post-content__disclaimer\" type=\"\">This
    article is for general information purposes and is not intended to be and should
    not be taken as legal or investment advice. The views, thoughts, and opinions
    expressed here are the author&rsquo;s alone and do not necessarily reflect or
    represent the views and opinions of Cointelegraph.</p><template data-name=\"subscription_form\"
    data-type=\"markets_outlook\" label=\"Subscription Form: Markets Outlook\"></template><p><br><br></p></p>\n</p>\n
    \           "

    bullish voice was that of Bitwise chief investment officer Matt Hougan. While
    speaking to Cointelegraph, Hougan said that a supply shock due to increased institutional
    demand could propel Bitcoin to $200,000 by the end of 2025. He expects seller
    exhaustion to occur at the $100,000 level.Crypto market data daily view. Source:
    Coin360Although Bitcoin remains strong, select analysts are shifting their focus
    to altcoins as they believe an altcoin season could be around the corner. Crypto
    analyst Javon Marks said in a post on X that altcoins, excluding Ether (ETH),
    could “deliver one of their most powerful runs since 2017!”Could Bitcoin and altcoins
    continue their move higher? Let’s look at the cryptocurrencies that are showing
    strength on the charts.Bitcoin price predictionBitcoin remains stuck in a range,
    but the bulls are trying to overcome the overhead resistance at $105,820.BTC/USDT
    daily chart. Source: Cointelegraph/TradingViewBoth moving averages are sloping
    up, and the relative strength index (RSI) is in the overbought zone, signaling
    that the buyers hold the edge. A break and close above $105,820 increases the
    likelihood of a retest of the $109,588 level. Sellers will try to defend the $109,588
    resistance, but if the bulls prevail, the BTC/USDT pair could skyrocket to $130,000. Alternatively,
    a sharp drop below $100,000 signals that the bears have seized control. That may
    tempt several short-term bulls to book profits, pulling the pair toward the 50-day
    simple moving average ($91,447).BTC/USDT 4-hour chart. Source: Cointelegraph/TradingViewThe
    pair has broken out of the symmetrical triangle pattern on the 4-hour chart, indicating
    that buyers are in control. There is resistance at $105,820, but it is likely
    to be crossed. If that happens, the pair could march toward the all-time high
    of $109,588 and thereafter to the pattern target of $110,922.Sellers are likely
    to have other plans. They will try to pull the price back into the triangle. If
    that happens, the aggressive bulls may get trapped, pulling the pair to $100,000.
    If this level also cracks, the drop could extend to the target objective of $95,616.Ether
    price predictionEther dipped back below the breakout level of $2,550, but the
    bears are struggling to sustain the lower levels.ETH/USDT daily chart. Source:
    Cointelegraph/TradingViewThe upsloping 20-day exponential moving average ($2,275)
    and the RSI near the overbought zone suggest the path of least resistance is to
    the upside. If the price closes above $2,550, the bulls will try to strengthen
    their position by pushing the ETH/USDT pair above $2,739. If they manage to do
    that, the pair could surge toward $3,000.The first sign of weakness will be a
    break below the $2,400 level. That could pull the pair to the 20-day EMA, which
    is a critical level to watch out for. A break below the 20-day EMA suggests the
    bulls are losing their grip.ETH/USDT 4-hour chart. Source: Cointelegraph/TradingViewThe
    bulls pushed the price above the moving averages, indicating demand at lower levels.
    If buyers pierce the downtrend line, the up move could reach $2,739. A break and
    close above $2,739 could resume the uptrend.Contrary to this assumption, if the
    price turns down from the downtrend line and breaks below $2,400, it signals that
    the bulls are rushing to the exit. That could start a deeper correction to $2,270
    and then to $2,111. Hyperliquid price predictionHyperliquid (HYPE) is facing resistance
    at $28.50, but a positive sign is that the bulls have not ceded much ground to
    the bears.HYPE/USDT daily chart. Source: Cointelegraph/TradingViewThe upsloping
    moving averages and the RSI in the overbought zone indicate that the buyers are
    in command. A break and close above $28.50 could catapult the HYPE/USDT pair toward
    $35.73.If the price turns down sharply from $28.50, it signals that the bears
    are aggressively defending the level. The pair could then slide to the 20-day
    EMA ($23.52), which is likely to attract buyers. If the price rebounds off the
    20-day EMA, the bulls will strive to clear the overhead resistance. HYPE/USDT
    4-hour chart. Source: Cointelegraph/TradingViewThe pair is finding support at
    the 50-SMA on the 4-hour chart, indicating buying on dips. The bulls will try
    to strengthen their position by pushing the price above the $28.50 level. If they
    do that, the pair could rally to $31.33.Instead, if the price turns down and breaks
    below the 50-SMA, it implies that the bulls are booking profits in a hurry. That
    could sink the pair to $24 and later to the solid support at $23.Related: Here’s
    what happened in crypto todayMonero price predictionMonero (XMR) rallied sharply
    to $353 on May 12 from $262 on May 4, indicating aggressive buying by the bulls.XMR/USDT
    daily chart. Source: Cointelegraph/TradingViewThe shallow pullback of the past
    few days shows that the bulls are hanging onto their positions as they anticipate
    another leg higher. If the price continues higher and breaks above $353, the XMR/USDT
    pair could skyrocket to $391 and then to the target objective of $422.The immediate
    support on the downside is at $331. A break and close below $331 could pull the
    pair down to the 20-day EMA ($308). If the price rebounds off the 20-day EMA,
    the bulls will again try to resume the uptrend.XMR/USDT 4-hour chart. Source:
    Cointelegraph/TradingViewThe pair is finding support at the 50-SMA, but the bulls
    are struggling to push the price above the overhead resistance at $353. If the
    price turns down and breaks below the 50-SMA, the pair could start a deeper correction
    to $317 and then to $300.On the contrary, a break and close above $353 signals
    the resumption of the uptrend. The pair could march toward $391, where the bears
    are expected to step in.Aave price predictionAave (AAVE) is facing resistance
    at the $240 level, but a positive sign is that the bulls have not allowed the

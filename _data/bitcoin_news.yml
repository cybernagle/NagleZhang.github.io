- title: " Most shops in Cannes to accept crypto by summer this year — Web3 exec "
  url: https://cointelegraph.com/news/most-shops-cannes-accept-crypto-summer-2025?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Merchants in Cannes, France, the site of the international Cannes Film
    Festival, are set to begin accepting crypto payments by summer this year in an
    effort to attract clientele with high disposable income by modernizing the city's
    commercial payment ecosystem.According to Artem Shaginyan, founder and head of
    strategy of Web3 payment company Lunu Pay, the Cannes municipal government is
    aiming for a 90% adoption rate among local merchants. The executive also told
    Cointelegraph:\"This is a big signal. When a city like Cannes, known globally
    for culture and commerce, starts integrating crypto at scale, it shows that Web3
    payments aren’t just a niche thing anymore. It’s about proving that crypto can
    work in everyday settings, not just online or in theory.\"In February, Cannes
    Mayor David Lisnard announced a crypto payment integration training session for
    business owners and professionals to promote the widespread acceptance of crypto
    payments in the city.The Rue d’Antibes, Canne’s shopping and commercial district.
    Source: City of CannesCanne's shift toward embracing cryptocurrencies reflects
    the broader trend of crypto adoption by city, state, and federal governments as
    these institutions seek to remain competitive on the global stage.Related: Panama's
    capital to accept crypto for taxes, municipal feesAhead of the curve? Other jurisdictions
    modernize with cryptoIn December 2023, the Swiss city of Lugano started accepting
    Bitcoin (BTC) and stablecoin payments for taxes and municipal fees as part of
    the city's broader initiative to become a global crypto hub.Governor Jared Polis
    of the US state of Colorado directed the state's Department of Revenue to begin
    accepting crypto tax payments in September 2022.The Canadian city of Vancouver
    passed a motion in December 2024 to make the jurisdiction a “Bitcoin-friendly
    city” by exploring integrating BTC into the city's financial system and potentially
    adopting a Bitcoin treasury strategy.More recently, in April 2025, the capital
    city of Panama announced that taxes and municipal fees could now be paid in crypto,
    including Bitcoin, Ether (ETH), Circle's US-dollar stablecoin (USDC), and Tether's
    USDt (USDT) token.Panama City mayor Mayer Mizrachi suggested the move would modernize
    the city and bring increased investment as well as global recognition.Magazine:
    Crypto City Guide to Seattle: Site of CZ’s downfall and pot crypto vendors\n\n
    \           "

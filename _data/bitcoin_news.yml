- title: " Here’s what happened in crypto today "
  url: https://cointelegraph.com/news/what-happened-in-crypto-today?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Today in crypto, Ethena Labs has exited the German market after regulators
    flagged “deficiencies” in its USDe stablecoin. In El Salvador, new data from the
    central bank shows that only 11% of registered Bitcoin service providers are currently
    active. Meanwhile, Emblem Vault CEO Jake Gallen claims he lost thousands in digital
    assets following a suspicious Zoom meeting.Ethena Labs exits German market following
    agreement with BaFinSynthetic stablecoin developer Ethena Labs is winding down
    its German operations less than a month after regulators identified “deficiencies”
    in its dollar-pegged USDe (USDE) stablecoin, signaling heightened scrutiny around
    crypto assets in Europe’s largest economy.Ethena Labs reached an agreement with
    Germany’s Federal Financial Supervisory Authority, also known as BaFin, to cease
    all operations of its local subsidiary, Ethena GmbH, according to an April 15
    announcement.As such, Ethena Labs “will no longer be pursuing MiCAR authorization
    in Germany,” the company said, referring to the Markets in Crypto-Assets Regulation.The
    company reiterated that Ethena’s German subsidiary has not conducted any mint
    or redeem activity for USDe since March 21, the day BaFin halted the stablecoin’s
    activities.As Cointelegraph reported at the time, the German regulator identified
    compliance failures and potential securities law violations tied to USDe.Source: Ethena
    LabsOnly 11% of El Salvador’s registered Bitcoin firms operational  Only 20 of
    the 181 Bitcoin service providers registered with El Salvador’s central bank are
    operational, with the rest failing to meet the country’s requirements under its
    Bitcoin Law. Local media outlet El Mundo cited data from the Central Reserve Bank
    of El Salvador, showing that 11% of the service providers are operational. According
    to the central bank’s database, the rest of the providers are classified as non-operational. The
    data showed that at least 22 non-operational providers have failed to meet most
    of the country’s Bitcoin Law requirements, which mandate that providers implement
    stringent supervision of their financial systems. El Salvador’s Bitcoin Law requires
    providers to maintain an Anti-Money Laundering (AML) program, keep records that
    accurately reflect the company’s assets, liabilities and equity and have a tailored
    cybersecurity program depending on the nature of its services. The data showed
    that 89% of the registered providers have failed to meet some of these obligations
    to be classified as operational. Still, a few firms have satisfied the legal criteria,
    including the state-backed Chivo Wallet and companies including Crypto Trading
    & Investment and Fintech Américas.Crypto exec issues warning on Zoom after losing
    $100,000 in cryptoJake Gallen, the CEO of the non-fungible token (NFT) platform
    Emblem Vault, has warned crypto users to be wary of the meeting app Zoom, saying
    a threat actor known as “ELUSIVE COMET” stole over $100,000 worth of crypto assets
    from him.Gallen said he had a “complete computer compromise” that ended up with
    a loss of Bitcoin (BTC) and Ether (ETH) assets from different wallets in a scam
    that took place over Zoom.“We were able to retrieve a malware file that was installed
    on my computer during a Zoom call with a YouTube personality of over 90k subs,”
    said Gallen, who said he set up a call after being contacted by a verified X account
    with 26,000 followers that claims to be the founder and CEO of a crypto mining
    platform. Source: Jake GallenDuring the call, Gallen said he was tricked into
    giving permission for Zoom to allow the host of the call to have remote access
    to his computer. The host, supposedly ELUSIVE COMET, then installed malware that
    stole credentials and accessed Gallen’s crypto wallets. SEAL security researcher
    Samczsun told Cointelegraph that Zoom, by default, allows meeting participants
    to request remote control access. “At this point in time we believe the victim
    still needs to be social engineered into granting access,” they said. Other X
    users recommended those using Zoom change the app’s settings to block other users
    from being able to remotely control their device.\n\n            "

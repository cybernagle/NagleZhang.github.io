- title: " Bitcoin price recovery could be capped at $90K — Here’s why "
  url: https://cointelegraph.com/news/bitcoin-price-recovery-could-be-capped-at-90-k-here-s-why?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "After consecutive drawdowns of 17.39% and 2.3% in February and March,
    Bitcoin’s (BTC) Q2 is shaping up nicely, with a return of 3.77% in April. While
    fresh yearly lows were formed at $74,500, BTC is currently closer to $90,000 than
    its new range bottom. Bitcoin 1-day chart. Source: Cointelegraph/TradingViewBitcoin’s
    higher time frame (HTF) market structure has achieved its first breakout of 2025,
    fueling optimism among bulls for significant upward momentum. However, the following
    factors could limit BTC’s gains over the next two weeks, likely capping its price
    at around $90,000.Related: Can 3-month Bitcoin RSI highs counter bearish BTC price
    'seasonality?'Bitcoin needs spot volume, not just leverage-drivenCointelegraph
    identified a cooldown period in the futures market as the BTC-USDT futures leverage
    ratio dropped by 50%. De-leveraging in the futures market is a positive development
    over the long term, but derivatives traders have taken control of the market at
    the time as well. Bitcoin cumulative net take volume. Source: X.comBitcoin researcher
    Axel Adler Jr. pointed out that Bitcoin’s cumulative net taker volume spiked to
    $800 million on April 11, hinting at a surge in aggressive buying. BTC price also
    jumped from $78,000 to $85,000 within three days, confirming previous historical
    patterns where high net take volume triggers price rallies. Likewise, Maartunn,
    a community analyst at CryptoQuant, confirmed that the current rally is a “leverage-driven
    pump.” The discrepancy arises because retail or spot traders are still not as
    relevant.Bitcoin 30-day apparent demand. Source: CryptoQuantAs illustrated in
    the chart, Bitcoin apparent demand is on a recovery path, but it is not net positive
    yet. Historically, 30-day apparent demand can move sideways for a prolonged period
    after BTC reaches a local bottom, leading to a sideways chop for the crypto. Thus,
    it is less likely that Bitcoin could breach $90,000 in the first attempt after
    dropping close to 20% until there is collective buying pressure from both spot
    and futures markets.Large liquidation clusters between $80-$90K may bait tradersWith
    futures traders positioning in either direction, data from CoinGlass highlighted
    significant cumulative long and short liquidation leverage between $80,000 and
    $90,000. Taking $85,100 at the base price, total cumulative short positions at
    risk of liquidation are at $6.5 billion if BTC price hits $90,035. Bitcoin exchange
    liquidation map. Source: CoinGlassOn the other hand, $4.86 billion in long orders
    will be wiped out if BTC drops to $80,071. While liquidation clusters do not determine
    directional bias, they can create long or short squeezes, baiting traders on either
    side of respective trades. With such high capital at risk under $90,000, it is
    possible that Bitcoin may target each cluster before moving toward the dominant
    side. Related: Bitcoin traders target $90K as apparent tariff exemptions ease
    US Treasury yieldsThis article does not contain investment advice or recommendations.
    Every investment and trading move involves risk, and readers should conduct their
    own research when making a decision.\n\n            "

- title: " Malta regulator fines OKX crypto exchange $1.2M for past AML breaches "
  url: https://cointelegraph.com/news/malta-fines-okx-crypto-exchange-1-2-million-aml-breaches?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Update (April 4, 1:45 pm UTC: This article has been updated to add a comment
    from an OKX spokesperson.Cryptocurrency exchange OKX is under regulatory scrutiny
    in Europe after Maltese authorities issued a fine for violations of Anti-Money
    Laundering (AML) laws in the past.Malta’s Financial Intelligence Analysis Unit
    (FIAU) fined Okcoin Europe — OKX’s Europe-based arm — 1.1 million euros ($1.2
    million) after detecting multiple AML failures on the platform in 2023, the authority
    announced on April 3.While admitting that OKX has significantly improved its AML
    policies in the past 18 months, the authority “could not ignore” its compliance
    failures from 2023, “some of which were deemed to be serious and systematic,”
    the FIAU said.OKX was among the first crypto exchanges to receive a license under
    Europe’s new Markets in Crypto-Assets (MiCA) regulation via its Malta hub in January
    2025.Specifics of the violationsThe FIAU stated that at the time of the compliance
    examination in 2023, OKX compiled a business risk assessment (BRA) in an attempt
    to identify threats and vulnerabilities.The regulators found multiple deficiencies
    within the BRA’s methodology, making OKX unable to properly access the money laundering
    risks it was exposed to and to take necessary measures to manage them, it said.Some
    of those risks included potential threats from the use of cryptocurrency mixers
    or tumblers, privacy coins, stablecoins and the usage of tokens on decentralized
    exchanges.An excerpt from FIAU’s penalty statement to Okcoin Europe. Source: FIAUThe
    FIAU statement also mentioned money laundering risks associated with Okcoin Europe’s
    exposure to other jurisdictions despite its pledge to only service European customers.
    It stated:“Despite the company’s strategy adopted to only service European-based
    customers, it was essential to also consider the potential [money laundering/financing
    terrorism exposure emanating from other jurisdictions, including from where the
    sources of the customers’ funding originated.”A spokesperson for OKX did not respond
    to Cointelegraph’s request to comment on whether the exchange admitted to such
    wrongdoing in the past.“With this chapter behind us, OKX remains focused on the
    future — continuing to build a secure, transparent, and compliant platform for
    our users worldwide,” the representative said.Controversy over OKX and Bybit hackThe
    news on the $1.2 million penalty in Malta came soon after Bloomberg in March reported
    that European Union regulators were probing OKX over its potential role in facilitating
    the laundering of $100 million in funds from the Bybit hack.Bybit CEO Ben Zhou
    previously claimed that OKX’s Web3 proxy allowed hackers to launder roughly $100
    million, or 40,233 Ether (ETH), from the $1.5 billion hack, which occurred in
    February 2025.Related: Binance ends Tether USDT trading in Europe to comply with
    MiCA rulesIn response to Zhou’s allegations, OKX denied claims that there were
    any ongoing investigations by the EU authorities, adding that “Bybit’s statements
    are spreading misinformation.”Source: OKXThe latest news from Malta’s FIAU also
    followed recent reports suggesting that OKX hired former New York Governor Andrew
    Cuomo to advise it over the federal criminal investigation leading to its plea
    and a $505 million penalty payment in the US.OKX’s new penalty in Malta sets a
    precedent in the context of regulators dealing with past compliance violations
    by MiCA-licensed companies, showing that the license does not spare the firms
    from responsibility for past breaches.Magazine: Stablecoin for cyber-scammers
    launches, Sony L2 drama: Asia Express\n\n            "

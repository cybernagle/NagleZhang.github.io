    as the levels to watch below and above spot price.“These mark the local range
    low and high and price has been trading within these for most of the last 1-2
    weeks,” he wrote in part of his own X post. “Keep an eye out for a clean break
    below either of these. So far, price has not sustained above or below for more
    than a day.”BTC/USDT perpetual contract 4-hour chart. Source: Daan Crypto Trades/XThe
    area around $106,000 was also on the radar for onchain analytics firm Glassnode.“BTC's
    price surge stalled just below $106.6K - a level with 31K $BTC held at that cost
    basis,” it observed on the day. “This supply cluster originated on Dec 16 and
    remains unshaken. Holders haven’t redistributed, nor averaged down - making $106.6K
    an important level to watch in the short term.”BTC supply cost basis heatmap.
    Source: Glassnode/XTrader: “Too many bearish signs to ignore” on BitcoinA renewed
    warning meanwhile came from fellow trader Roman, who considered weekly timeframes
    to be no longer in bulls’ favor.Related: $107K fakeout or new all-time highs?
    5 things to know in Bitcoin this week“Not a good close as we rejected resistance,
    created more bearish divergences, and have pumped with low volume. Stoch RSI has
    also topped,” he summarized. “Too many bearish signs to ignore, and it’s why I’ve
    been continuously saying the bull run is likely almost over.”BTC/USD 1-day chart
    with 1-week stoch RSI data. Source: Cointelegraph/TradingViewRoman referred to
    the stochastic relative strength index (RSI) indicator, a trend strength tool
    now firmly in “overbought” territory.As Cointelegraph reported, various short-term
    BTC price predictions have surfaced in recent days, including an “early week”
    target of $116,000 along with a potential retracement toward $90,000.This article
    does not contain investment advice or recommendations. Every investment and trading
    move involves risk, and readers should conduct their own research when making
    a decision.\n\n            "

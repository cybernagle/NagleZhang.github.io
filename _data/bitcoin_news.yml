- title: " Price analysis 3/28: BTC, ETH, XRP, BNB, SOL, DOGE, ADA, TON, LINK, AVAX "
  url: https://cointelegraph.com/news/price-analysis-3-28-btc-eth-xrp-bnb-sol-doge-ada-ton-link-avax?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin (BTC) is moving farther away from the crucial $90,000 mark, indicating

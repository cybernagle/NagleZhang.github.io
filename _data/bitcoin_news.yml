- title: " Bitcoin experiencing ‘shakeout,’ not end of 4-year cycle: Analysts "
  url: https://cointelegraph.com/news/bitcoin-shakeout-not-end-4-year-cycle-analysts?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Bitcoin’s historic bull cycle remains intact despite widespread investor
    concerns over the current downturn, which analysts suggest may be just a temporary
    “shakeout” before the next upward move in the market.Bitcoin’s (BTC) price is
    currently down 22% from its all-time high of over $109,000 recorded on Jan. 20,
    on the day of US President Donald Trump’s inauguration, Cointelegraph Markets
    Pro data shows.Despite investor sentiment dropping into “Extreme Fear” multiple
    times, historic chart patterns suggest that this may just be a price shakeout
    — a sudden price drop caused by multiple investors exiting their positions, preceded
    by a sudden price recovery.“Several key technical indicators have turned bearish,
    leading to speculation that the bull cycle may be ending prematurely,” Bitfinex
    analysts told Cointelegraph.BTC/USD, 1-year chart. Source: Cointelegraph“Despite
    this, Bitcoin’s 4-year cycle remains an important factor, historically shaping
    price movements,” said the analysts, adding:“Corrections within bull cycles are
    normal, and past trends suggest that this may be a shakeout rather than the start
    of a prolonged bear market.”However, the launch of the US spot Bitcoin exchange-traded
    funds (ETFs), which temporarily surpassed $125 billion in cumulative holdings,
    along with the growing institutional crypto investments, make it “clear that the
    conventional cycle ceases to exist,” the analysts added.Related: Bitcoin needs
    weekly close above $81K to avoid downside ahead of FOMCIn an optimistic sign for
    price action, Bitcoin staged a daily close above $84,000 on March 15, for the
    first time in over a week since March 8, TradingView data shows.BTC/USD, 1-day
    chart. Source: TradingView However, due to Bitcoin’s correlation with traditional
    financial markets, BTC may only find a bottom along with equity markets, particularly
    the S&P 500, said Bitfinex analysts, adding:“While $72,000–$73,000 remains a key
    support range, the broader market narrative, especially global treasury yields
    and equity trends, will dictate Bitcoin’s next major move.\"“Trade wars have already
    been priced in, to some extent, but prolonged economic strain could weigh on sentiment,”
    the analysts added.Related: Rising $219B stablecoin supply signals mid-bull cycle,
    not market topBitcoin halving and four-year cycle still crucial for price action:
    Nexo analystDespite fears over a disrupted Bitcoin bull market, the four-year
    cycle, along with the Bitcoin halving event, remain crucial for Bitcoin’s price
    action, according to Iliya Kalchev, dispatch analyst at Nexo digital asset investment
    platform.“Bitcoin’s four-year compound annual growth rate (CAGR) has declined
    to a record low of 8%, posing questions about whether its traditional four-year
    cycle remains valid,” Kalchev told Cointelegraph, adding:“Although strong institutional
    adoption over the past year has served as a significant tailwind for Bitcoin,
    its halving events are still expected to exert long-term influence.”The 2024 Bitcoin
    halving reduced the Bitcoin network’s block reward to 3.125 BTC per block.BTC/USD,
    1-day chart since 2024 halving. Source: TradingView Bitcoin price is up over 31%
    since the last halving occurred on April 20, 2024, which was coined the “most
    bullish” setup for Bitcoin price, partly because of the growing institutional
    interest in the world’s first cryptocurrency.Magazine: SEC’s U-turn on crypto
    leaves key questions unanswered\n\n            "
  published: 2025-03-16 10:09:39.000000000 +00:00
- title: " Uber angel investor stirs Bitcoin debate with ‘build a better Bitcoin’
    remark "
  url: https://cointelegraph.com/news/jason-calacanis-build-better-bitcoin-controversy-bitcoin-community?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "A technology investor who backed ridesharing app Uber in its early days
    has sparked backlash from the Bitcoin community after claiming Bitcoin will inevitably
    be replaced by something better.“Bitcoin has been a wonderful game, but with a
    couple of giant players cornering the market, the timing is right to “build a
    better Bitcoin” — restarting the game,” prominent angel investor and internet
    entrepreneur Jason Calacanis told his 981,600 X followers on March 14.Calacanis,
    an early investor in Bitcoin-related companies like online trading platform Robinhood
    and Bitcoin startup Keza, said, “All technology gets replaced over time… and Bitcoin
    will be no different.”Opportunity presents for Bitcoin layer-2 projectsFounders
    and executives of Bitcoin-related companies were quick to push back, arguing that
    Bitcoin will not be replaced, though there’s still room for a dominant layer-2
    protocol to emerge on top of the Bitcoin network.Source: Pierre RochardSwan Bitcoin
    co-founder Brady Swenson said, “Winning protocols don’t get replaced; they are
    built upon.” “Bitcoin will never be replaced as a protocol for value transfer.
    The race is still on for the winning second layer protocol,” Swenson said.The
    other co-founder of Swan Bitcoin, Cory Klippsten, said, “Bitcoin is a technological
    revolution changing all industries, not following the adoption curve of a single
    technology like an iPad.”Source: Jason LoweryEchoing a similar sentiment, Lightspark
    CEO David Markus said, “What it lacks in functionality can be built on L2s.” “Trying
    to build a better Bitcoin is a fool’s errand.”Meanwhile, ShapeShift CEO Eric Voorhees
    said Bitcoin’s limitations can be solved “on other chains.”The bigger Bitcoin
    grows, the “less likely” it is to be replacedMany in the industry have emphasized
    the importance of layer-2s for Bitcoin, as they provide use cases that the Bitcoin
    network cannot support, such as deploying smart contracts.However, Muneeb Ali,
    co-founder of Stacks, recently told Cointelegraph that more than two-thirds of
    existing Bitcoin layer-2 projects will not exist within three years as their initial
    excitement will fade.Source: Gastón SilvaBitcoin advocate Wayne Vaughan said people
    wrongly assume Bitcoin is easily replaceable because they see it as just an asset,
    application, or platform.“I think of Bitcoin as a network. The larger the network
    gets, the less likely it is for something else to replace it,” Vaughan said in
    a March 15 X post. Related: Strategy’s Bitcoin stash still up over $7B despite
    market downturnStrive Funds CEO Matt Cole said, “There will not be a “better”
    Bitcoin.” “I do think we will get occasional alt seasons of ever-diminishing strength
    that will continue to make insiders money. Most people will end up with less Bitcoin
    by going to that casino,” Cole said.This is not the first time that Calacanis’
    comments have caused debate in the crypto industry.In June 2020, Calacanis said
    that nearly all of the crypto projects around the world are under the control
    of “unqualified idiots” or “grifters” with below-average skills.Magazine: Crypto
    fans are obsessed with longevity and biohacking: Here’s why\n\n            "
  published: 2025-03-16 03:09:28.000000000 +00:00
- title: " Bitcoin’s role as an inflation hedge depends on where one lives — Analyst "
  url: https://cointelegraph.com/news/bitcoin-s-role-as-inflation-hedge-depends-on-where-one-lives-analyst?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "For years, inflation was primarily a concern for emerging markets, where
    volatile currencies and economic instability made rising prices a persistent challenge.
    However, in the wake of the COVID-19 pandemic, inflation became a global issue.
    Once-stable economies with historically low inflation were suddenly grappling
    with soaring costs, prompting investors to rethink how to preserve their wealth.While
    gold and real estate have long been hailed as safe-haven assets, Bitcoin’s supporters
    argue that its fixed supply and decentralized nature make it the ultimate shield
    against inflation. But does the theory hold up?The answer may depend largely on
    where one lives.Bitcoin advocates emphasize its strict supply limit of 21 million
    coins as a key advantage in combating inflationary monetary policies. Unlike fiat
    currencies, which central banks can print in unlimited quantities, Bitcoin’s supply
    is predetermined by an algorithm, preventing any form of artificial expansion.
    This scarcity, they argue, makes Bitcoin akin to “digital gold” and a more reliable
    store of value than traditional government-issued money.Several companies and
    even sovereign nations have embraced the idea, adding Bitcoin to their treasuries
    to hedge against fiat currency risk and inflation. The most notable example is
    El Salvador, which made global headlines in 2021 by becoming the first country
    to adopt Bitcoin as legal tender. The government has since been steadily accumulating
    Bitcoin, making it a key component of its economic strategy. Companies like Strategy
    in the US and Metaplanet in Japan have followed suit, and now the United States
    is in the process of establishing its own Strategic Bitcoin Reserve.A Bitcoin
    investment strategy has paid off so farSo far, the corporate and government Bitcoin
    investment strategy has paid off as BTC outperformed the S&P 500 and gold futures
    since the early 2020s before inflation surged in the United States. More recently,
    however, that strong performance has shown signs of moderation. Bitcoin remains
    a strong performer over the past 12 months, and while BTC’s gains outpace consumer
    inflation, economists caution that past performance is no guarantee of future
    results. Indeed, some studies suggest a correlation between cryptocurrency returns
    and changes in inflation expectations is far from consistent over time.                           Returns
    over the past 12 months. Source: Truflation.Bitcoin's role as an inflation hedge
    remains uncertainUnlike traditional inflation hedges such as gold, Bitcoin is
    still a relatively new asset. Its role as a hedge remains uncertain, especially
    considering that widespread adoption has only gained traction in recent years.Despite
    high inflation in recent years, Bitcoin’s price has fluctuated wildly, often correlating
    more with risk assets like tech stocks than with traditional inflation hedges
    like gold. A recent study published in the Journal of Economics and Business found
    that Bitcoin’s ability to hedge inflation has weakened over time, particularly
    as institutional adoption grew. In 2022, when US inflation hit a 40-year high,
    Bitcoin lost more than 60% of its value, while gold, a traditional inflation hedge,
    remained relatively stable.For this reason, some analysts say that Bitcoin’s price
    may be driven more by investor sentiment and liquidity conditions than by macroeconomic
    fundamentals like inflation. When the risk appetite is strong, Bitcoin rallies.
    But when markets are fearful, Bitcoin often crashes alongside stocks.In a Journal
    of Economics and Business study, authors Harold Rodriguez and Jefferson Colombo
    said, “Based on monthly data between August 2010 and January 2023, the results
    indicate that Bitcoin returns increase significantly after a positive inflationary
    shock, corroborating empirical evidence that Bitcoin can act as an inflation hedge.”
    However, they noted that Bitcoin’s inflationary hedging property was stronger
    in the early days when institutional adoption of BTC was not as prevalent. Both
    researchers agreed that “[…]Bitcoin’s inflation-hedging property is context-specific
    and likely diminishes as it achieves broader adoption and becomes more integrated
    into mainstream financial markets.”US inflation index since 2020. Source. Truflation“So
    far, it has acted as an inflation hedge—but it’s not a black-and-white case. It’s
    more of a cyclical (phenomenon),” Robert Walden, head of trading at Abra, told
    Cointelegraph. Walden said, “For Bitcoin to be a true inflation hedge, it would
    need to consistently outpace inflation year after year with its returns. However,
    due to its parabolic nature, its performance tends to be highly asymmetric over
    time.”Bitcoin’s movement right now, Walden said, is more about market positioning
    than inflation hedging—it’s about capital flows and interest rates.\"Argentina
    and Turkey seek financial refuge in cryptoIn economies suffering from runaway
    inflation and strict capital controls, Bitcoin has proven to be a valuable tool
    for preserving wealth. Argentina and Turkey, two countries with persistent inflation
    throughout recent decades, illustrate this dynamic well.Argentina has long grappled
    with recurring financial crises and soaring inflation. While inflation has shown
    signs of improvement very recently, locals have historically turned to cryptocurrency
    as a way to bypass financial restrictions and protect their wealth from currency
    depreciation.A recent Coinbase survey found that 87% of Argentinians believe crypto
    and blockchain technology can enhance their financial independence, while nearly
    three in four respondents see crypto as a solution to challenges like inflation
    and high transaction costs.Related: Argentina overtakes Brazil in crypto inflows
    — ChainalysisWith a population of 45 million, Argentina has become a hotbed for
    crypto adoption, with Coinbase reporting that as many as five million Argentinians
    use digital assets daily.“Economic freedom is a cornerstone of prosperity, and
    we are proud to bring secure, transparent, and reliable crypto services to Argentina,”
    said Fabio Plein, Director for the Americas at Coinbase. “For many Argentinians,
    crypto isn’t just an investment, it’s a necessity for regaining control over their
    financial futures.”“People in Argentina don’t trust the peso. They are always
    looking for ways to store value outside of the local currency,” Julián Colombo,
    a senior director at Bitso, a major Latin American cryptocurrency exchange, told
    Cointelegraph. “Bitcoin and stablecoins allow them to bypass capital controls
    and protect their savings from devaluation.”Argentina inflation index. Source.
    Truflation.Beyond individual investors, businesses in Argentina are also using
    Bitcoin and stablecoins to protect revenue and conduct international transactions.
    Some workers even opt to receive part of their salaries in cryptocurrency to safeguard
    their earnings from inflation.According to economist and crypto analyst Natalia
    Motyl, “Currency restrictions and capital controls imposed in recent years have
    made access to US dollars increasingly difficult amid high inflation and a crisis
    of confidence in the Argentine peso. In this environment, cryptocurrencies have
    emerged as a viable alternative for preserving the value of money, allowing individuals
    and businesses to bypass the limitations of the traditional financial system.”
    While Bitcoin's effectiveness as an inflation hedge is still up for debate, stablecoins
    have become a more practical solution in high-inflation economies, particularly
    those pegged to the US dollar.Relative to its economic size, Turkey has emerged
    as a hotspot for stablecoin transactions. In the year leading up to March 2024,
    purchases alone accounted for 4.3% of GDP. This digital currency boom, fueled
    by years of double-digit inflation—peaking at 85% in 2022—and a more than 80%
    plunge in the lira against the dollar over the past five years, gained momentum
    during the pandemic.Turkey’s Bitcoin adoption proves citizens drive adoption,
    not governmentsAlthough Turkey allows its citizens to buy, hold, and trade crypto,
    the use of digital currencies for payments has been banned since 2021 when the
    Central Bank of the Republic of Turkey prohibited “any direct or indirect usage
    of crypto assets in payment services and electronic money issuance.” Nevertheless,
    crypto adoption in Turkey is still evident, with an increasing number of Turkish
    banks offering crypto services and shops and ATMs providing crypto exchange options.High
    inflation rates backed the erosion of the Turkish lira’s value, which lost nearly
    60% of its purchasing power as inflation soared to 85.5% between 2021 and 2023.
    This led many Turkish citizens to turn to Bitcoin as a store of value and a medium
    of exchange. While some argue that Bitcoin’s scarcity bodes well for long-term
    appreciation, potentially outpacing consumer inflation, its high volatility and
    recurring correlation with tech-heavy, risk-associated indexes like the Nasdaq
    in recent times suggest that its performance as a pure inflation hedge remains
    mixed. However, in inflation-ridden nations like Argentina and Turkey, where local
    currencies have collapsed in value, the “digital gold” has undeniably served as
    a crucial avenue of escape from local currencies, preserving purchasing power
    in ways traditional fiat cannot.Although Bitcoin is still a nascent asset, and
    its effectiveness as a hedge requires further study, one thing remains clear—so
    far, it has significantly outperformed consumer inflation. For Bitcoin enthusiasts,
    that alone is reason enough to celebrate.This article is for general information
    purposes and is not intended to be and should not be taken as legal or investment
    advice. The views, thoughts, and opinions expressed here are the author’s alone
    and do not necessarily reflect or represent the views and opinions of Cointelegraph.\n\n
    \           "

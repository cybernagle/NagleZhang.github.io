- title: " Alabama, Minnesota lawmakers join US states pushing for Bitcoin reserves "
  url: https://cointelegraph.com/news/minnesota-alabama-bitcoin-investment-bills?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Lawmakers in the US states of Minnesota and Alabama filed companion bills
    to identical existing bills that if passed into law, would allow each state to
    buy Bitcoin.The Minnesota Bitcoin Act, or HF 2946, was introduced to the state’s
    House by Republican Representative Bernie Perryman on April 1, following an identical
    bill introduced on March 17 by GOP state Senator Jeremy Miller.Meanwhile, on the
    same day in Alabama, Republican state Senator Will Barfoot introduced Senate Bill
    283, while a bi-partisan group of representatives led by Republican Mike Shaw
    filed the identical House Bill 482, which allows for the state to invest in crypto,
    but essentially limits it to Bitcoin (BTC).Twin Alabama bills don’t explicitly
    name BitcoinMinnesota’s Bitcoin Act would allow the state’s investment board to
    invest state assets in Bitcoin and other cryptocurrencies and permit state employees
    to add crypto to retirement accounts.It would also exempt crypto gains from state
    income taxes and give residents the option to pay state taxes and fees with Bitcoin.Source:
    Bitcoin LawsThe twin Alabama bills don’t explicitly identify Bitcoin, but would
    limit the state’s crypto investment into assets that have a minimum market value
    of $750 billion, a criterion that only Bitcoin currently meets.26 Bitcoin reserve
    bills now introduced in the USIntroducing identical bills is not uncommon in the
    US and is typically done to speed up the bicameral legislative process so laws
    can pass more quickly.Bills to create a Bitcoin reserve have been introduced in
    26 US states, with Arizona currently the closest to passing a law to make one,
    according to data from the bill tracking website Bitcoin Laws.Arizona currently
    leads in the US state Bitcoin reserve race. Source: Bitcoin LawsPennsylvania was
    one of the first US states to introduce a Bitcoin reserve bill, in November 2024.
    However, the initiative was reportedly eventually rejected, with similar bills
    also killed in Montana, North Dakota, South Dakota and Wyoming.Related: North
    Carolina bills would add crypto to state’s retirement system Montana, North Dakota,
    Pennsylvania, South Dakota and Wyoming are the five states thathave  rejected
    Bitcoin reserve initiatives. Source: Bitcoin LawsAccording to a March 3 report
    by Barron’s, “red states” like Montana have faced setbacks to the Bitcoin reserve
    initiatives amid political confrontations between the Democratic Party and the
    Republican Party.Additional reporting by Helen Partz.Magazine: Financial nihilism
    in crypto is over — It’s time to dream big again\n\n            "

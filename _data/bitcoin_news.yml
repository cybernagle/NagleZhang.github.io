- title: " Growing BTC reserve requires Congressional legislation — VanEck exec "
  url: https://cointelegraph.com/news/btc-reserve-requires-congressional-legislation?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Building a permanent US strategic Bitcoin reserve would likely require
    targeted legislation rather than executive action, according to VanEck’s head
    of digital assets, Matthew Sigel. Speaking at Bitcoin 2025 in Las Vegas, Sigel
    said the most viable path forward may involve inserting Bitcoin mining incentives
    into the congressional budget reconciliation process.According to Sigel, the most
    effective path to growing a US strategic Bitcoin reserve would be through targeted
    amendments to congressional budget legislation. These could include tax credits
    for mining companies that use methane gas and other incentives aimed at encouraging
    miners to share a portion of their mined BTC with the federal government. He argued
    that such an approach would allow the reserve to grow organically over time. Sigel
    also highlighted the limitations of executive actions in achieving this goal:\"The
    problem with executive action is that it's going to prompt lawsuits. And anything
    over $100 million is going to get sued by the Elizabeth Warrens of the world.
    So, I would say start with something maybe in the Exchange Stabilization Fund
    for $100 million.\"US President Donald Trump established the US Bitcoin Strategic
    Reserve through a March 7 executive order. According to the order, the US government
    can only acquire Bitcoin through budget-neutral strategies or asset forfeiture,
    prompting a range of different ideas on how to add to the government’s stockpile
    of nearly 200,000 BTC.From left to right, Alex Thorn, Matthew Sigel, Matthew Pines
    and Fred Thiel. Source: Turner Wright/CointelegraphRelated: Bitcoin’s new highs
    may have been driven by Japan bond market crisisLawmakers, officials pitch different
    ideas to grow strategic Bitcoin reserveWyoming Senator Cynthia Lummis, the US
    lawmaker who introduced legislation for a Bitcoin strategic reserve in July 2024,
    proposed converting a portion of the gold certificates held by the US Treasury
    to Bitcoin.Converting gold to Bitcoin would allow the US government to purchase
    more Bitcoin without incurring a cost to the taxpayer, Lummis said.Bo Hines, the
    executive director of the President’s Council of Advisers on Digital Assets, echoed
    the idea in March 2025.Hines called on the US Treasury to revalue its gold holdings,
    which are currently priced at just $42.22 per troy ounce, and convert a portion
    of those gains to Bitcoin. This strategy would also be budget-neutral, Hines said.The
    price of gold reached an all-time high of $3,500 per ounce in April but experienced
    a minor pullback to around $3,300 on May 27.Magazine: TradFi fans ignored Lyn
    Alden’s BTC tip — Now she says it’ll hit 7 figures: X Hall of Flame\n\n            "
  published: 2025-05-27 22:52:14.000000000 +01:00
- title: " Trump supports bill to buy 1 million BTC — Senator Lummis "
  url: https://cointelegraph.com/news/president-trump-supports-bitcoin-bill-senator-lummis?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "US President Donald Trump supports the BITCOIN Act and has a team of experts
    in the White House working to roll out landmark digital asset legislation in the
    coming weeks, according to Wyoming Senator Cynthia Lummis. Speaking at the Bitcoin
    2025 conference in Las Vegas, Nevada, Lummis said she is bringing the BITCOIN
    ACT to the “attention of the American people and the world,” adding that, “President
    Trump supports the bill.”In March, Lummis reintroduced the BITCOIN Act — landmark
    legislation that directs the US government to acquire 1 million Bitcoin (BTC)
    over five years. The acquisitions would be financed using existing funds within
    the Federal Reserve System and the Treasury Department. As Cointelegraph reported,
    the Trump administration has reiterated the need to use “budget-neutral ways”
    to acquire Bitcoin without burdening taxpayers.Source: CryptoGoosAt the Bitcoin
    Conference, Lummis said the Trump administration has a team working on “digital
    asset issues,” including legislation on stablecoins, market structure and the
    Bitcoin Strategic Reserve.“They will probably roll out in that order,” she said.“The
    Senate Banking Committee has passed the stablecoin bill out of committee,” said
    Lummis, adding: “We’re getting close to being ready to have it on the floor. We’ve
    worked for untold hours with the minority party to satisfy them, and we should
    be voting on it the week before we get back from this break.”Related: Senator
    Lummis’ new BITCOIN Act allows US reserve to exceed 1M BitcoinGENIUS Act on stablecoins
    is “going to pass,” says White House crypto czarThe White House seems to be in
    alignment with Senator Lummis. Last week, Trump’s top crypto adviser, David Sacks,
    said the GENIUS stablecoin bill is “going to pass” the Senate with bipartisan
    support after clearing a key procedural vote on May 19.On May 19, the Senate voted
    66 to 32 to advance debate on the GENIUS Bill. Source: US SenateGENIUS refers
    to the Guiding and Establishing National Innovation for US Stablecoins Act, possibly
    the most comprehensive federal push to establish a legal framework for dollar-pegged
    stablecoins.Stablecoins have become one of the most prominent use cases for blockchain
    technology, with some industry advocates arguing that they could help extend the
    US dollar’s dominance as the global reserve currency.Collateralized, dollar-backed
    stablecoins like Tether’s USDt (USDT) and Circle’s USDC (USDC) account for more
    than 85% of the $250 billion market, according to CoinMarketCap.Related: Former
    CFTC chair criticizes STABLE Act amid calls for urgent regulatory clarity\n\n
    \           "
  published: 2025-05-27 22:38:06.000000000 +01:00
- title: " Selling Bitcoin is like playing in a ‘bad house-rate casino’ — Adam Back "
  url: https://cointelegraph.com/news/selling-bitcoin-like-playing-bad-house-rate-casino-adam-back?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Selling Bitcoin is like “playing in a really bad house-rate casino,” according
    to Adam Back, CEO of Blockstream and one of Bitcoin’s earliest adopters. In a
    recent interview with Bitcoin financial services firm Unchained, Back said the
    odds are stacked against traders trying to time the market.Back came to this conclusion
    in the early days of Bitcoin, he said, when the price “was going up basically
    exponentially but it [was] extremely volatile.”“So [...] if you see something
    that’s going up exponentially but with volatility, if you sell it to time the
    market a bit falling, the odds are against you,” Back said, adding:“The trend
    line is up and to the right, exponential, and so there’s extremely bad trading
    odds attached to selling because you’re really hoping that it falls.”Adam Back
    during the interview. Source: UnchainedBitcoin is known for its extreme volatility
    and heightened bull-bear market cycles. It has seen multiple corrections above
    80%, which may test the stomach of many investors and believers. However, those
    who have remained steady through the ups and downs have been rewarded: In the
    last 10 years, BTC has had a total return of over 39,000%.“I think anything that
    has a really rapid growth curve ends up with some pretty extreme volatility until
    it gets closer to full adoption,” Back said. Average returns of the Bitcoin index.
    Source: CurvoRelated: Bitcoin 2024 conference sparked 30% price crash — Can bulls
    escape this year?Diminishing returns theory might not be in play this cycleBack
    pointed to several factors that could support upward price momentum. He noted
    that companies like Strategy are not only acquiring Bitcoin directly but also
    offering indirect exposure through instruments such as convertible notes. Another
    contributing factor is the growing institutional interest in Bitcoin, including
    investments by sovereign wealth funds. He cited Abu Dhabi’s $408.5 million stake
    in BlackRock’s Bitcoin ETF. Finally, government entities are starting to venture
    into crypto. US President Donald Trump issued an executive order to establish
    a strategic Bitcoin reserve, while the US state of New Hampshire’s governor recently
    signed such a reserve into law. Texas lawmakers recently passed a bill allowing
    the state to create a state Bitcoin reserve.Magazine: Hall of Flame: NBA star
    Tristan Thompson misses $32B in Bitcoin by taking $82M contract in cash\n\n            "
  published: 2025-05-27 22:24:53.000000000 +01:00
- title: " Maple Finance, FalconX secure Bitcoin-backed loans from Cantor Fitzgerald
    — Report "
  url: https://cointelegraph.com/news/maple-finance-falconx-secure-bitcoin-backed-loans-from-cantor-fitzgerald-report?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Wall Street financial firm Cantor Fitzgerald has closed its first Bitcoin
    lending deal nearly a year after announcing its crypto lending services.According
    to a May 27 Bloomberg report, Cantor provided Bitcoin-backed loans to FalconX
    and Maple Finance. FalconX, a digital asset broker, said it secured a facility
    worth over $100 million as part of a “broader credit framework,” while Maple Finance
    reportedly closed the first tranche of an agreement with Cantor.The service allows
    companies holding Bitcoin to borrow funds and use the cryptocurrency as collateral,
    providing a way to unlock liquidity without selling their BTC holdings. Cantor
    announced its Bitcoin financing business with an initial capital of $2 billion
    in July 2024, targeting institutional investors seeking to leverage their Bitcoin.
    At the time, the company said Anchorage Digital and Copper would serve as custodians
    and collateral managers in the venture.Credit markets are a fundamental part of
    the financial system, allowing capital to flow between borrowers and lenders and
    supporting economic activity across sectors. Their central role also means they
    can contribute to financial distress when risks are mismanaged. While mirroring
    some functions of traditional finance, crypto credit markets have been operating
    with less regulatory oversight.Digital asset crisis of 2022 This dynamic was evident
    during the 2022 crisis in the digital asset sector. Celsius Network, once a leading
    crypto lending platform, collapsed after engaging in risky financial practices
    and facing allegations of fraud. Similarly, BlockFi filed for Chapter 11 bankruptcy
    in November 2022 following significant exposure to the collapse of crypto exchange
    FTX.  According to a report from Galaxy, the total crypto lending market, including
    crypto-backed collateralized debt positions (CDPs) tied to stablecoins, stood
    at $36.5 billion in the last quarter of 2024, marking a 43% decline from its all-time
    high of $64.4 billion in 2021. Despite the broader contraction, onchain lending
    platforms have seen a dramatic rebound, with open borrowed positions surging to
    $19.1 billion by Q4 2024, a 959% increase over two years. Crypto lending markets
    remain well below their Q1 2022 peak. Source: GalaxyCantor’s crypto armCantor
    is one of the most traditional financial services companies in the United States.
    Founded in 1945, it offers a range of services for institutions, including investment
    banking, brokerage, equity and fixed-income sales and trading. The company claims
    to serve over 5,000 clients across 20 countries. The company’s CEO, Howard Lutnick,
    has been an advocate for classifying Bitcoin as a commodity, akin to gold and
    oil, and has called for clearer regulatory frameworks for cryptocurrencies in
    the US. Lutnick was also appointed to co-lead US President Donald Trump’s transition
    team in 2024. Cantor is also one of the managers of Tether’s US Treasury securities
    portfolio backing its stablecoin. In early 2024, the firm acquired a 5% stake
    in Tether.Magazine: Unstablecoins: Depegging, bank runs and other risks loom\n\n
    \           "
  published: 2025-05-27 21:30:26.000000000 +01:00
- title: " Bitcoin price held up by corporate adoption and ‘inflation hedge’ narratives "
  url: https://cointelegraph.com/news/bitcoin-price-held-up-by-corporate-adoption-and-inflation-hedge-narratives?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Key takeaways:Institutional investor demand and corporate adoption may
    push Bitcoin higher despite recession fears.Investors’ belief that the US Federal
    Reserve will hold rates favors Bitcoin price upside.Stock markets around the world
    responded positively to the temporary suspension of import tariffs between the
    United States and the European Union, with the S&P 500 rising 1.5% on May 27.
    However, concerns over a global economic recession persist, capping Bitcoin’s
    (BTC) upside, especially since the baseline US import rates have been raised for
    most regions.Bitcoin remains antifragile and poised to outperform in uncertain
    timesGiven the growing investor uncertainty about economic conditions, Bitcoin
    hovering around the $110,000 level has taken investors by surprise as it consolidates
    the top-six position as a global tradable asset by market capitalization. Investors
    now ask whether Bitcoin is becoming antifragile or if a drop below $100,000 is
    inevitable in a recessionary environment.Traders currently estimate a 41% chance
    that the US Federal Reserve (Fed) will maintain interest rates through September,
    a steep rise from just 2% one month ago. CME FEDWatch target rate probabilities.
    Source: CMENormally, a higher cost for capital is bearish for risk-on assets like
    Bitcoin. However, in this context, it also suggests potential liquidity injections
    from the Fed, given the unfavorable US fiscal outlook, where government spending
    exceeds revenue capacity.US President Donald Trump has called for lower interest
    rates, but Fed Chair Jerome Powell remains cautious due to a strong labor market
    and rising inflation pressures, whether driven by tariffs or easy credit conditions.
    This tension helps explain why the S&P 500 has struggled to retake its February
    all-time high of 6,147 and why Bitcoin’s upside has also been limited.Bitcoin’s
    current market capitalization of $2.2 trillion now exceeds that of Google and
    Meta, which partially explains the $112,000 resistance level. Still, it would
    be inaccurate to suggest Bitcoin has decoupled from traditional markets; its 30-day
    correlation with the S&P 500 has remained above 70% over the past four weeks.
    As such, if equities enter a bear market, Bitcoin is likely to face downside as
    well.30-day correlation: Bitcoin/USD vs. S&P 500 futures. Source: TradingView
    / CointelegraphCompanies are currently reporting earnings for the first quarter,
    a period that predates the escalation of the trade war. As a result, the stock
    market may take longer to reflect the full negative impact, even as macroeconomic
    indicators show signs of contraction. The 6.3% drop in US durable goods orders
    in April, reported on May 27, could be the first signal of a weakening economy.US
    durable goods–new orders for April. Source: US Census BureauHowever, even if corporate
    earnings for the first quarter fall short of expectations, this does not automatically
    mean the S&P 500 will suffer significantly. In fact, disappointing results could
    open the door for faster interest rate cuts, which tend to benefit companies by
    lowering financing costs and potentially stimulating consumer demand.Bitcoin's
    appeal as a strategic asset grows, Trump Media joins the partyBitcoin’s risk profile
    appears to have improved after Trump Media and Technology Group announced plans
    to acquire BTC following a $2.5 billion mix of debt and equity financing. “We
    view Bitcoin as an apex instrument of financial freedom,” Trump Media CEO Devin
    Nunes said, according to Reuters. This development suggests that Bitcoin’s trajectory
    toward $112,000 is not solely tied to broader economic growth.Related: Bitcoin
    stalls at $110K but institutional investors continue gobbling up BTCThe growing
    institutional and corporate interest in Bitcoin adds a new dimension to its market
    behavior. While macroeconomic trends and correlations with traditional assets
    still matter, Bitcoin is increasingly being framed as a strategic asset with utility
    beyond speculation. As such, its performance could diverge, at least partially,
    from that of equities, especially as adoption broadens among influential companies
    and investors.While the stock market may remain sensitive to macro data and earnings
    surprises, Bitcoin’s upside potential appears to rest on a mix of monetary policy,
    institutional positioning and its emerging role as a hedge against systemic financial
    risk.This article is for general information purposes and is not intended to be
    and should not be taken as legal or investment advice. The views, thoughts, and

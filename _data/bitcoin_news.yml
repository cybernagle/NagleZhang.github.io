- title: " Crypto, NFTs are a lifeboat in the sinking fiat system: Finance Redefined "
  url: https://cointelegraph.com/news/crypto-nfts-lifeboat-sinking-fiat-system-finance-redefined?utm_source=rss_feed&utm_medium=rss_tag_bitcoin&utm_campaign=rss_partner_inbound
  summary: "Risk appetite across traditional and cryptocurrency markets saw a sharp
    rise this week, helping United States cryptocurrency funds recover the capital
    lost to the correction of February and March, amassing over $7.5 billion worth
    of weekly inflows.Bitcoin (BTC) surpassed its old all-time high on May 21, two
    days after President Donald Trump confirmed ongoing ceasefire negotiations between
    Russia and Ukraine in a May 19 X post.Meanwhile, popular analyst and Global Macro
    Investor CEO Raoul Pal warned of more fiat currency debasement, urging investors
    to gain more exposure to cryptocurrencies and non-fungible tokens (NFTs), as these
    assets “will never be this cheap again.”Exponential currency debasement: “You
    don’t own enough crypto, NFTs”Cryptocurrencies and NFTs can help investors protect
    their eroding purchasing power during an era of exponential currency debasement,
    according to analysts and industry leaders.Investing in digital assets is becoming
    increasingly important in the “world of the exponential age and currency debasement,”
    according to Raoul Pal, founder and CEO of Global Macro Investor.“You don’t own
    enough crypto. When you do, you don’t own enough NFT’s, as art is upstream of
    wealth. Both will never be this cheap again,” Pal said.NFTs are “the single best
    long term store of wealth I know and you get to buy it before network effects
    kick in,” he added in another response.Source: Raoul Pal“There is some validity
    to the statement that NFTs, and in extension art, become a vehicle for the wealthy
    once a certain level of wealth is reached,” wrote Nicolai Sondergaard, research
    analyst at Nansen, calling it a “natural move” for asset diversification.“For
    traders and investors, further down the wealth curve, NFTs are partially about
    speculating on future returns,” he told Cointelegraph, adding that NFTs also benefit
    from the allure of strong communities, beyond just wealth creation.Continue readingUS
    crypto funds top $7.5 billion inflows in 2025 as investor appetite growsCrypto
    investment products in the United States have attracted over $7.5 billion worth
    of investment in 2025, with a fifth week of net positive inflows last week signaling
    growing investor demand for digital assets.US-based crypto investment products
    attracted $785 million worth of investment last week, pushing the year-to-date
    (YTD) total to over $7.5 billion, according to a May 19 report by digital asset
    manager CoinShares.The latest figure marks the fifth consecutive week of net positive
    flows, following nearly $7 billion in outflows during February and March.Weekly
    crypto asset flows, USD, million. Source: CoinSharesThe United States accounted
    for the bulk of inflows, with $681 million, followed by Germany at $86.3 million
    and Hong Kong at $24.4 million.Crypto flows by country. Source: CoinSharesInvestor
    demand for risk assets such as cryptocurrencies staged a significant recovery
    after the White House announced a 90-day pause on additional tariffs on May 12,
    which marked a 24% cut for import tariffs for both the US and China.A day after
    the announcement, Coinbase exchange saw 9,739 Bitcoin worth more than $1 billion
    withdrawn from the exchange — the highest net outflow recorded in 2025, signaling
    that institutional appetite was “accelerating,” according to Bitwise’s head of
    European research, André Dragosch.Continue readingVanEck to launch Avalanche ecosystem
    fundVanEck plans to launch a private digital assets fund in June targeting tokenized
    Web3 projects built on the Avalanche blockchain network, the asset manager said
    in a statement shared with Cointelegraph.The VanEck PurposeBuilt Fund, available
    only to accredited investors, aims to invest in liquid tokens and venture-backed
    projects across Web3 sectors, including gaming, financial services, payments,
    and artificial intelligence. Idle capital will be deployed into Avalanche (AVAX)
    real-world asset (RWA) products, including tokenized money market funds, VanEck
    said.The fund will be managed by the team behind VanEck’s Digital Assets Alpha
    Fund (DAAF), which oversees more than $100 million in net assets as of May 21. “The
    next wave of value in crypto will come from real businesses, not more infrastructure,”
    Pranav Kanade, portfolio manager for DAAF, said in a statement.RWAs are among
    crypto’s fastest-growing segments. Source: RWA.xyzContinue readingYield-bearing
    stablecoins surge to $11 billion, now 4.5% of market: ReportYield-bearing stablecoins
    have soared to $11 billion in circulation, representing 4.5% of the total stablecoin
    market, a steep climb from just $1.5 billion and a 1% market share at the start
    of 2024.One of the biggest winners is Pendle, a decentralized protocol that enables
    users to lock in fixed yields or speculate on variable interest rates. Pendle
    now accounts for 30% of all yield-bearing stablecoin total value locked (TVL),
    roughly $3 billion, according to a report from Pendle compiled by analysts from
    Spartan Group and Modular Capital shared with Cointelegraph.The report noted that
    stablecoins make up 83% of its $4 billion total value locked, a sharp rise from
    less than 20% just a year ago. In contrast, assets such as Ether (ETH), which
    historically contributed 80%–90% of Pendle’s TVL, have shrunk to less than 10%.Traditional
    stablecoins like USDt (USDT) and USDC (USDC) do not pass on interest to holders.
    With over $200 billion in circulation and US Federal Reserve interest rates at
    4.3%, Pendle estimates that stablecoin holders are missing out on more than $9
    billion in annual yield.Pendle TVL share by assets. Source: PendleContinue readingTether
    surpasses Germany’s $111 billion of US Treasury holdingsTether, the $151 billion
    stablecoin issuance giant, has surpassed Germany in United States Treasury bill
    holdings, showcasing the benefits of a diversified reserve strategy that has helped
    the firm navigate the volatility of the cryptocurrency market.Tether, the issuer
    of the world’s largest stablecoin, USDT, has surpassed Germany’s $111.4 billion
    worth of US Treasurys, data from the US Department of the Treasury shows.Foreign
    countries by US Treasury holdings. Source: Ticdata.treasury.govTether has surpassed
    $120 billion worth of Treasury bills, the firm shared in its attestation report
    for the first quarter of 2025. That makes Tether the 19th largest entity among
    all counties in terms of T-bill investments.“This milestone not only reinforces
    the company’s conservative reserve management strategy but also highlights Tether’s
    growing role in distributing dollar-denominated liquidity at scale,” wrote Tether
    in the report. During 2024, Tether was the seventh-largest buyer of US Treasurys
    across all countries, surpassing Canada, Taiwan, Mexico, Norway, Hong Kong and
    numerous other countries, Cointelegraph reported in March 2025.Continue reading:DeFi
    market overviewAccording to data from Cointelegraph Markets Pro and TradingView,
    most of the 100 largest cryptocurrencies by market capitalization ended the week
    in the green.Worldcoin (WLD) rose over 32% as the week’s biggest gainer in the
    top 100, followed by the Hyperliquid (HYPE) token, up over 30% on the weekly chart.Total
    value locked in DeFi. Source: DefiLlamaThanks for reading our summary of this
    week’s most impactful DeFi developments. Join us next Friday for more stories,
    insights and education regarding this dynamically advancing space.\n\n            "

  summary: "Today in crypto, asset manager VanEck has filed for the first US BNB exchange-traded
    fund. Tether CEO Paolo Ardoino unveiled a new AI platform with crypto payment
    support, and the Solana Foundation announced it had patched a security vulnerability
    that could have impacted Token-22 confidential tokens.VanEck files for BNB ETF,
    first in USAsset manager VanEck has asked US regulators for permission to list
    an exchange-traded fund (ETF) holding BNB, the native token of Binance’s BNB Chain,
    regulatory filings show. The ETF is designed to accumulate spot BNB (BNB) tokens
    and “may, from time to time, stake a portion of the [fund’s] assets through one
    or more trusted staking providers,” according to the ETF’s S-1 prospectus. The
    filing marks the first time an asset manager has filed for a BNB ETF in the United
    States.The BNB token has a market capitalization of roughly $84 billion, according
    to data from CoinMarketCap. As of May 5, BNB stakers earn a yield of approximately
    2.5%, according to data from Stakingrewards.com. Binance’s BNB Chain is among
    the most popular smart contract networks, with a total value locked (TVL) of nearly
    $6 billion, according to data from DefiLlama. BNB Chain is among the most popular
    blockchain networks. Source: DeFILlamaTether AI platform to support Bitcoin and
    USDT payments, CEO saysTether AI, the forthcoming artificial intelligence platform
    from stablecoin giant Tether, will feature payments in major cryptocurrencies,
    including USDt and Bitcoin.Tether CEO Paolo Adroino took to X on May 5 to tease
    the imminent launch of Tether AI, the company’s new AI platform designed to offer
    “personal infinite intelligence.”According to Ardoino, Tether’s AI platform will
    be integrated with USDt (USDT) and Bitcoin (BTC) payments, allowing users to make
    transactions directly through a peer-to-peer (P2P) network.Source: Paolo ArdoinoThe
    initiative builds on Tether’s December 2024 announcement that it was developing
    a website for the AI tool, targeting a launch by the end of the first quarter
    of 2025.Ardoino emphasized that Tether AI will not use application programming
    interface (API) keys and will not depend on centralized control points.Instead,
    Tether AI will offer a “fully open-source AI runtime” that will run on an “unstoppable
    peer-to-peer network,” and be “fully modular and composable.”Additionally, Tether
    AI will be capable of adapting and evolving on “any hardware and device,” he said.Solana
    devs fix bug that allowed unlimited minting of certain tokensThe Solana Foundation
    has confirmed that a zero-day vulnerability that allowed an attacker to potentially
    mint certain tokens and even withdraw those tokens from user accounts has been
    fixed. A May 3 post-mortem from the Solana Foundation said that the security vulnerability,
    first discovered on April 16, could have allowed an attacker to forge an invalid
    proof to mint and steal an unlimited amount of Token-22 confidential tokens.Solana
    released a post-mortem about the zero-day bug, which has since been patched. Source:
    SolanaThe vulnerability was first identified on April 16, and two patches were
    deployed to resolve the issues. A super majority of Solana validators adopted
    the patches around two days later.The foundation said there is no known exploit
    of the vulnerability and confirmed that all funds remain safe.\n\n            "
